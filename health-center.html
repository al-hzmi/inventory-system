<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>صحة النظام | الإدارة التنفيذية</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./v52-admin.css?v=54.2"><link rel="stylesheet" href="./v53-admin-polish.css?v=54.2"><link rel="stylesheet" href="./v54-admin-overhaul.css?v=54.2"><link rel="stylesheet" href="./v54-1-desktop-canvas-fix.css?v=54.2"><style>html,body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.hk{background:#fff;border:1px solid var(--admin-line);border-radius:16px;padding:15px;box-shadow:var(--admin-shadow);min-width:0}.hk small{font-size:8px;color:var(--admin-muted)}.hk b{display:block;font-size:22px;margin-top:7px}.hk span{display:block;font-size:8px;color:#8b958f;margin-top:5px}.hs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:12px;margin-top:12px}.hr{display:flex;gap:10px;align-items:center;border:1px solid var(--admin-line);border-radius:12px;padding:10px 11px;background:#fff}.hr+.hr{margin-top:7px}.dot{width:9px;height:9px;border-radius:50%;background:#18a36e;box-shadow:0 0 0 4px #e7f7ef}.hr.bad .dot{background:#c14b4b;box-shadow:0 0 0 4px #fff0f0}.hm{flex:1;min-width:0}.ht{font-size:10px;font-weight:800}.hsu{font-size:8px;color:var(--admin-muted);margin-top:3px}.hv{font-size:9px;font-weight:800;direction:ltr}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(#0d654b calc(var(--score)*1%),#e6ebe8 0);position:relative}.ring:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#fff}.ring>div{position:relative;text-align:center}.ring b{font-size:27px}.ring span{display:block;font-size:8px;color:var(--admin-muted)}.alert{padding:10px 11px;border-radius:11px;background:#fff8ef;border:1px solid #f0dfbd;font-size:8px;line-height:1.6}.alert.bad{background:#fff5f5;border-color:#efcece;color:#923b3b}.loading{padding:60px;text-align:center;color:var(--admin-muted);font-size:10px}@media(max-width:1180px){.hg{grid-template-columns:repeat(2,minmax(0,1fr))}.hs{grid-template-columns:1fr}}@media(max-width:900px){.hg{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hk{padding:12px}.hk b{font-size:19px}}</style></head><body><main id="app" class="v52-page"><div class="loading">جاري فحص صحة النظام…</div></main><script>const ADMIN_HASH='1jh297-spgf2z';if(!(String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH))location.replace('./index.html?employee=1');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>new Intl.NumberFormat('en-US').format(Number(n)||0);const ROUTES=['admin-home.html','inventory-analytics.html','admin-dashboard.html','control-center.html','admin-stocktake-shell.html','health-center.html','index.html','customer.html'];const FILES=['data/jeddah.tsv','data/riyadh.tsv','data/pricing.tsv','data/images_list.txt','data/categories.tsv','data/inventory-analytics.json','data/version.json','data/v54-admin-release.json'];const S={routes:[],files:{},data:{},alerts:[]};async function ping(path,text=false){const t=performance.now();try{const r=await fetch('./'+path+'?health='+Date.now(),{cache:'no-store'});return{path,ok:r.ok,status:r.status,ms:Math.round(performance.now()-t),body:text&&r.ok?await r.text():''}}catch(e){return{path,ok:false,status:0,ms:0,body:''}}}function rows(text){return String(text||'').replace(/\r/g,'').split('\n').filter(Boolean)}function inv(text){const out=[];for(const line of rows(text).slice(1)){const c=line.split('\t'),id=String(c[0]||'').trim();if(id)out.push({id,qty:Number(String(c[3]||'').replace(/,/g,'')),pack:String(c[4]||'').trim()})}return out}function priceIds(text){const s=new Set();for(const line of rows(text).slice(2)){const c=line.split('\t');[0,5].forEach(i=>{const v=String(c[i]||'').trim();if(v)s.add(v)})}return s}function imageIds(text){const s=new Set();for(const line of rows(text)){const v=String(line.split('\t')[0]||'').trim();if(v)s.add(v)}return s}function analyze(){const j=inv(S.files['data/jeddah.tsv']?.body),r=inv(S.files['data/riyadh.tsv']?.body),all=[...j,...r],u=new Map();all.forEach(x=>{if(!u.has(x.id))u.set(x.id,x)});const p=priceIds(S.files['data/pricing.tsv']?.body),im=imageIds(S.files['data/images_list.txt']?.body);let a={};try{a=JSON.parse(S.files['data/inventory-analytics.json']?.body||'{}')}catch{}S.data={j:j.length,r:r.length,unique:u.size,missingPrice:[...u.keys()].filter(x=>!p.has(x)).length,imageCount:im.size,badQty:all.filter(x=>!Number.isFinite(x.qty)).length,missingPack:[...u.values()].filter(x=>!x.pack).length,events:Number(a.eventCount||a.events?.length||0)}}function build(){S.alerts=[];S.routes.filter(x=>!x.ok).forEach(x=>S.alerts.push({bad:true,t:'مسار غير متاح',d:x.path+' · HTTP '+(x.status||'ERR')}));Object.values(S.files).filter(x=>!x.ok).forEach(x=>S.alerts.push({bad:true,t:'ملف بيانات غير متاح',d:x.path}));if(S.data.badQty)S.alerts.push({bad:true,t:'كميات غير صالحة',d:num(S.data.badQty)+' سجل'});if(S.data.missingPrice)S.alerts.push({t:'أصناف بلا سعر',d:num(S.data.missingPrice)+' صنف'});}function score(){let n=100;n-=S.routes.filter(x=>!x.ok).length*12;n-=Object.values(S.files).filter(x=>!x.ok).length*10;if(S.data.badQty)n-=15;if(S.data.missingPrice)n-=Math.min(8,Math.ceil(S.data.missingPrice/50));return Math.max(0,n)}function k(l,v,s){return`<div class="hk"><small>${l}</small><b>${v}</b><span>${s}</span></div>`}function rr(x){return`<div class="hr ${x.ok?'':'bad'}"><i class="dot"></i><div class="hm"><div class="ht">${esc(x.path)}</div><div class="hsu">${x.ok?'متاح ويستجيب':'تعذر الوصول'}</div></div><div class="hv">HTTP ${x.status||'ERR'}</div></div>`}function render(){const d=S.data,sc=score();$('#app').innerHTML=`<div class="v52-page-head"><div><div class="v52-eyebrow">SYSTEM HEALTH</div><h1 class="v52-page-title">صحة النظام</h1><div class="v52-page-sub">فحص مباشر للمسارات وملفات البيانات وجودة المخزون.</div></div><div class="v52-head-actions"><button class="v52-btn primary" id="again">إعادة الفحص</button></div></div><section class="hg">${k('مؤشر الصحة',sc+'%',sc>=95?'ممتاز':sc>=80?'جيد':'يحتاج مراجعة')}${k('المسارات',S.routes.filter(x=>x.ok).length+'/'+S.routes.length,'صفحات الإدارة والموظف والعميل')}${k('ملفات البيانات',Object.values(S.files).filter(x=>x.ok).length+'/'+FILES.length,'المخزون والأسعار والصور')}${k('سجل الحركة',num(d.events),'تحديثات مخزون محللة')}${k('أصناف فريدة',num(d.unique),'جدة + الرياض')}${k('بلا سعر',num(d.missingPrice),d.missingPrice?'تحتاج مراجعة':'مكتملة')}${k('صور مفهرسة',num(d.imageCount),'ملفات الصور المسجلة')}${k('كميات غير صالحة',num(d.badQty),d.badQty?'حرج':'سليم')}</section><section class="hs"><div class="v52-card"><div class="v52-card-head"><div><h2>الفحوصات التشغيلية</h2><p>فتح فعلي للمسارات والملفات الأساسية.</p></div></div><div class="v52-card-body">${S.routes.map(rr).join('')}${Object.values(S.files).map(rr).join('')}</div></div><div class="v52-card"><div class="v52-card-head"><div><h2>الحالة العامة</h2><p>الاستثناءات المهمة فقط.</p></div></div><div class="v52-card-body"><div class="ring" style="--score:${sc}"><div><b>${sc}%</b><span>Health Score</span></div></div><div style="margin-top:14px">${S.alerts.length?S.alerts.map(a=>`<div class="alert ${a.bad?'bad':''}"><b>${esc(a.t)}</b><br>${esc(a.d)}</div>`).join(''):'<div class="v52-notice">لا توجد مشاكل تشغيلية واضحة ضمن نطاق الفحص الحالي.</div>'}</div></div></div></section>`;$('#again').onclick=run}async function run(){$('#app').innerHTML='<div class="loading">جاري فحص صحة النظام…</div>';const[r,f]=await Promise.all([Promise.all(ROUTES.map(x=>ping(x,false))),Promise.all(FILES.map(x=>ping(x,true)))]);S.routes=r;S.files=Object.fromEntries(f.map(x=>[x.path,x]));analyze();build();render()}run();</script><script src="./v46-admin-nav.js?v=54.2"></script></body></html>
