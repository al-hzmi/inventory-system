const ADMIN_HASH='1jh297-spgf2z';const adminOk=()=>String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH;if(!adminOk())location.replace('./index.html?employee=1');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();const QA_RE=/(اختبار|تجربه|تجربة|test|qa|playwright|audit_employee|موظف اختبار|اختبار تقني)/i;const isQa=x=>QA_RE.test(norm(x?.name||x?.actorName||x?.employeeName||''));const ms=v=>{try{return v?.toMillis?.()||v?.seconds*1000||new Date(v).getTime()||0}catch{return 0}};const dt=v=>{const n=ms(v);return n?new Date(n).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'};const num=n=>new Intl.NumberFormat('en-US').format(Number(n)||0);const cleanId=s=>{const raw=String(s??'').trim().replace(/\.webp$/i,'');const d=raw.replace(/\D/g,'');return d||raw.toLowerCase().replace(/[^a-z0-9]/g,'')};
const S={tab:'overview',running:true,lastRun:null,routes:[],firebase:{ok:false,ms:0,error:''},files:{},data:null,zeroSearches:[],carts:[],stocktake:[],alerts:[],errors:[]};
const CRITICAL_ROUTES=['index.html','customer.html','admin-dashboard.html','command-center.html','control-center.html','stocktake.html'];
async function timedFetch(path,text=true){const t=performance.now();try{const r=await fetch('./'+path+'?health='+Date.now(),{cache:'no-store'});const body=text&&r.ok?await r.text():'';return {ok:r.ok,status:r.status,ms:Math.round(performance.now()-t),body,lastModified:r.headers.get('last-modified')||''}}catch(e){return {ok:false,status:0,ms:Math.round(performance.now()-t),body:'',error:String(e)}}}
function parseInventory(text,branch){const lines=String(text||'').replace(/\r/g,'').split('\n').filter(Boolean);const rows=[];for(let i=1;i<lines.length;i++){const c=lines[i].split('\t');const sku=String(c[0]||'').trim();if(!sku)continue;rows.push({branch,sku,id:cleanId(sku),name:String(c[1]||'').trim(),unit:String(c[2]||'').trim(),qty:String(c[3]||'').trim(),pack:String(c[4]||'').trim()})}return rows}
function parsePricing(text){const ids=new Set();const lines=String(text||'').replace(/\r/g,'').split('\n');for(let i=2;i<lines.length;i++){const c=lines[i].split('\t');for(const idx of [0,5]){const v=String(c[idx]||'').trim();if(v)ids.add(cleanId(v))}}return ids}
function parseImages(text){const ids=new Set(),files=[];for(const line of String(text||'').replace(/\r/g,'').split('\n')){if(!line.trim())continue;const [id,file]=line.split('\t');if(id)ids.add(cleanId(id));if(file)files.push({id:cleanId(id),file:file.trim()})}return {ids,files}}
function parseCategories(text){const refs=[];const lines=String(text||'').replace(/\r/g,'').split('\n');for(let i=1;i<lines.length;i++){const c=lines[i].split('\t');for(const v0 of c){const v=String(v0||'').trim();if(!v)continue;refs.push(cleanId(v))}}return refs}
function duplicates(rows){const m=new Map();for(const r of rows)m.set(r.id,(m.get(r.id)||0)+1);return [...m.entries()].filter(([,n])=>n>1)}
async function readOperational(){try{const [z,c,s]=await Promise.all([db.collection('search_logs').orderBy('time','desc').limit(800).get(),db.collection('v44_live_carts').limit(500).get(),db.collection('stocktake_items').limit(1000).get()]);const now=Date.now();S.zeroSearches=z.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!isQa(x)&&Number(x.resultsCount)===0&&now-ms(x.time)<86400000);S.carts=c.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!isQa(x));S.stocktake=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>['shortage','surplus'].includes(x.countStatus));}catch(e){S.errors.push('Operational: '+e.message)}}
async function run(){S.running=true;render();S.errors=[];const routeChecks=await Promise.all(CRITICAL_ROUTES.map(async p=>({path:p,...await timedFetch(p,false)})));S.routes=routeChecks;const t=performance.now();try{await db.collection('system_controls').doc('customer_portal').get();S.firebase={ok:true,ms:Math.round(performance.now()-t),error:''}}catch(e){S.firebase={ok:false,ms:Math.round(performance.now()-t),error:e.message||String(e)}}
const paths=['data/jeddah.tsv','data/riyadh.tsv','data/pricing.tsv','data/images_list.txt','data/categories.tsv','data/version.json'];const arr=await Promise.all(paths.map(async p=>[p,await timedFetch(p,true)]));S.files=Object.fromEntries(arr);const j=parseInventory(S.files['data/jeddah.tsv']?.body,'جدة'),r=parseInventory(S.files['data/riyadh.tsv']?.body,'الرياض'),all=[...j,...r],union=new Map();all.forEach(x=>{if(!union.has(x.id))union.set(x.id,x)});const prices=parsePricing(S.files['data/pricing.tsv']?.body),images=parseImages(S.files['data/images_list.txt']?.body),cats=parseCategories(S.files['data/categories.tsv']?.body),ids=new Set(union.keys()),missingPrice=[...ids].filter(id=>!prices.has(id)),missingImage=[...ids].filter(id=>!images.ids.has(id)),missingPack=[...union.values()].filter(x=>!x.pack),badQty=all.filter(x=>x.qty!==''&&!Number.isFinite(Number(x.qty))),orphanImages=[...images.ids].filter(id=>!ids.has(id)),orphanCats=[...new Set(cats.filter(id=>id&&!ids.has(id)))];let version={};try{version=JSON.parse(S.files['data/version.json']?.body||'{}')}catch{}
S.data={jeddah:j.length,riyadh:r.length,unique:ids.size,prices:prices.size,images:images.ids.size,categories:new Set(cats).size,missingPrice,missingImage,missingPack,badQty,dupJ:duplicates(j),dupR:duplicates(r),orphanImages,orphanCats,lastUpdate:version.lastUpdate||''};await readOperational();buildAlerts();S.lastRun=new Date();S.running=false;render()}
function buildAlerts(){const a=[];for(const r of S.routes.filter(x=>!x.ok))a.push({level:'critical',title:`تعذر فتح ${r.path}`,detail:`HTTP ${r.status||'ERR'} — المسار الأساسي يحتاج مراجعة.`});if(!S.firebase.ok)a.push({level:'critical',title:'تعذر الاتصال بـ Firebase',detail:S.firebase.error||'فشل اختبار القراءة.'});for(const [p,f] of Object.entries(S.files))if(!f.ok)a.push({level:'critical',title:`ملف بيانات غير متاح: ${p}`,detail:`HTTP ${f.status||'ERR'}`});if(S.data){if(S.data.missingPrice.length)a.push({level:'warn',title:`${S.data.missingPrice.length} صنف بدون سعر`,detail:'راجع ملف pricing.tsv قبل الاعتماد على الأسعار.'});if(S.data.missingImage.length)a.push({level:'warn',title:`${S.data.missingImage.length} صنف بدون صورة`,detail:'ليست مشكلة تشغيلية، لكنها تؤثر على جودة المعرض.'});if(S.data.badQty.length)a.push({level:'critical',title:`${S.data.badQty.length} كمية غير قابلة للقراءة`,detail:'يوجد سجل مخزون بكمية غير رقمية.'});if(S.data.dupJ.length+S.data.dupR.length)a.push({level:'warn',title:`${S.data.dupJ.length+S.data.dupR.length} معرف مكرر داخل ملفات المخزون`,detail:'تحتاج مراجعة لتجنب نتيجة بحث ملتبسة.'});}
if(S.zeroSearches.length)a.push({level:'warn',title:`${S.zeroSearches.length} عملية بحث بدون نتيجة خلال 24 ساعة`,detail:'افتح مركز القيادة لمعرفة الكلمات والمستخدمين.'});const abandoned=S.carts.filter(c=>Number(c.itemCount||0)>0&&Date.now()-ms(c.updatedAt||c.lastNonEmptyAt)>2*3600000&&Date.now()-ms(c.updatedAt||c.lastNonEmptyAt)<7*86400000);if(abandoned.length)a.push({level:'warn',title:`${abandoned.length} سلة غير مكتملة منذ أكثر من ساعتين`,detail:'قد تكون فرص متابعة أو سلات مهجورة.'});if(S.stocktake.length)a.push({level:'warn',title:`${S.stocktake.length} فرق جرد مسجل`,detail:'تشمل النواقص والزيادات ضمن البيانات المقروءة.'});S.alerts=a}
function score(){let n=100;n-=S.routes.filter(x=>!x.ok).length*18;if(!S.firebase.ok)n-=25;if(Object.values(S.files).some(x=>!x.ok))n-=20;if(S.data?.badQty.length)n-=15;if(S.data?.missingPrice.length)n-=Math.min(10,Math.ceil(S.data.missingPrice.length/25));return Math.max(0,Math.min(100,n))}
function render(){const tabs=[['overview','الحالة'],['data','صحة البيانات'],['alerts','يحتاج انتباهك'],['search','ذكاء التشغيل']];const sc=score();app.innerHTML=`<header class="top"><div class="topin"><a class="nav" href="./admin-dashboard.html">‹ الإدارة</a><div class="brand"><b>صحة النظام</b><span>تشخيص النظام · البيانات · التنبيهات التشغيلية</span></div><a class="nav" href="./control-center.html">مركز التحكم</a><button class="btn primary" id="rerun">${S.running?'جاري الفحص...':'إعادة الفحص'}</button></div><nav class="tabs">${tabs.map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}</nav></header><main>${S.running&&!S.lastRun?'<div class="loading">جاري تنفيذ فحص شامل للملفات والمسارات وFirebase...</div>':`<section class="section ${S.tab==='overview'?'on':''}">${overview(sc)}</section><section class="section ${S.tab==='data'?'on':''}">${dataHtml()}</section><section class="section ${S.tab==='alerts'?'on':''}">${alertsHtml()}</section><section class="section ${S.tab==='search'?'on':''}">${intelHtml()}</section>`}</main>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});$('#rerun')?.addEventListener('click',()=>{if(!S.running)run()})}
function overview(sc){const okRoutes=S.routes.filter(x=>x.ok).length,filesOk=Object.values(S.files).filter(x=>x.ok).length;return `<div class="grid stats"><div class="stat"><small>مؤشر الصحة</small><b>${sc}%</b><span>${sc>=95?'ممتاز':sc>=80?'جيد':'يحتاج انتباه'}</span></div><div class="stat"><small>المسارات الأساسية</small><b>${okRoutes}/${S.routes.length}</b></div><div class="stat"><small>ملفات البيانات</small><b>${filesOk}/${Object.keys(S.files).length}</b></div><div class="stat"><small>Firebase</small><b>${S.firebase.ok?'سليم':'خلل'}</b><span>${S.firebase.ms}ms</span></div><div class="stat"><small>تنبيهات</small><b>${S.alerts.length}</b></div><div class="stat"><small>آخر فحص</small><b style="font-size:12px">${S.lastRun?S.lastRun.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'—'}</b></div></div><div class="split" style="margin-top:12px"><div class="panel"><div class="ph"><div class="grow"><h2>المسارات الأساسية</h2><p>فحص فعلي للصفحات التي يعتمد عليها الموظفون والعملاء والإدارة.</p></div></div><div class="list">${S.routes.map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle ltr">${esc(x.path)}</div><div class="sub">${x.ms}ms · HTTP ${x.status||'ERR'}</div></div><span class="tag ${x.ok?'ok':'bad'}">${x.ok?'يعمل':'متوقف'}</span></div>`).join('')}</div></div><div class="panel"><div class="ph"><div class="grow"><h2>الخدمات</h2><p>الاتصال ونسخة بيانات المخزون.</p></div></div><div class="metric"><span>Firebase Firestore</span><b>${S.firebase.ok?'متصل':'غير متصل'}</b></div><div class="metric"><span>حالة المتصفح</span><b>${navigator.onLine?'Online':'Offline'}</b></div><div class="metric"><span>آخر تحديث بيانات</span><b>${esc(S.data?.lastUpdate||'—')}</b></div><div class="metric"><span>إجمالي الأصناف الفريدة</span><b>${num(S.data?.unique)}</b></div></div></div>`}
function dataHtml(){const d=S.data;if(!d)return'<div class="loading">لا توجد نتيجة فحص بيانات بعد.</div>';const rows=[['أصناف جدة',d.jeddah,'ok'],['أصناف الرياض',d.riyadh,'ok'],['أصناف فريدة',d.unique,'ok'],['معرفات أسعار',d.prices,d.missingPrice.length?'warn':'ok'],['معرفات صور',d.images,d.missingImage.length?'warn':'ok'],['أصناف بدون سعر',d.missingPrice.length,d.missingPrice.length?'warn':'ok'],['أصناف بدون صورة',d.missingImage.length,d.missingImage.length?'warn':'ok'],['أصناف بدون شد',d.missingPack.length,d.missingPack.length?'warn':'ok'],['كميات غير صالحة',d.badQty.length,d.badQty.length?'bad':'ok'],['تكرار داخل المخزون',d.dupJ.length+d.dupR.length,(d.dupJ.length+d.dupR.length)?'warn':'ok'],['صور غير مرتبطة',d.orphanImages.length,d.orphanImages.length?'warn':'ok'],['مراجع أقسام غير مرتبطة',d.orphanCats.length,d.orphanCats.length?'warn':'ok']];return `<div class="panel"><div class="ph"><div class="grow"><h2>تدقيق البيانات</h2><p>مقارنة المخزون بالأسعار والصور والأقسام دون تعديل أي ملف.</p></div><span class="stamp">${esc(d.lastUpdate||'')}</span></div><div class="grid stats">${rows.slice(0,6).map(x=>`<div class="stat"><small>${x[0]}</small><b>${num(x[1])}</b><span class="tag ${x[2]}">${x[2]==='ok'?'سليم':x[2]==='bad'?'حرج':'مراجعة'}</span></div>`).join('')}</div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>الفحص</th><th>النتيجة</th><th>الحالة</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${num(x[1])}</td><td><span class="tag ${x[2]}">${x[2]==='ok'?'سليم':x[2]==='bad'?'خلل':'مراجعة'}</span></td></tr>`).join('')}</tbody></table></div>${d.missingPrice.length?`<div class="panel" style="margin-top:12px"><div class="ph"><div><h2>أمثلة بدون سعر</h2><p>أول 30 معرفًا فقط.</p></div></div><div class="sub ltr">${esc(d.missingPrice.slice(0,30).join(' · '))}</div></div>`:''}</div>`}
function alertsHtml(){if(!S.alerts.length)return'<div class="panel"><div class="health"><div class="ring" style="--score:100"><b>✓</b></div><div><h2 style="margin:0;font-size:16px">لا يوجد شيء يحتاج تدخلك الآن</h2><div class="sub">المسارات والبيانات والتنبيهات التشغيلية ضمن الحدود الحالية.</div></div></div></div>';return `<div class="panel"><div class="ph"><div class="grow"><h2>يحتاج انتباهك</h2><p>نظهر الاستثناءات المهمة فقط بدل إغراق الإدارة بالسجلات.</p></div><span class="tag ${S.alerts.some(x=>x.level==='critical')?'bad':'warn'}">${S.alerts.length} تنبيه</span></div><div class="list">${S.alerts.map(a=>`<div class="alert ${a.level}"><div class="icon">${a.level==='critical'?'!':'⚠'}</div><div class="rowmain"><div class="rowtitle">${esc(a.title)}</div><div class="sub">${esc(a.detail)}</div></div></div>`).join('')}</div></div>`}
function intelHtml(){const abandoned=S.carts.filter(c=>Number(c.itemCount||0)>0&&Date.now()-ms(c.updatedAt||c.lastNonEmptyAt)>2*3600000&&Date.now()-ms(c.updatedAt||c.lastNonEmptyAt)<7*86400000).sort((a,b)=>ms(b.updatedAt||b.lastNonEmptyAt)-ms(a.updatedAt||a.lastNonEmptyAt));return `<div class="split"><div class="panel"><div class="ph"><div class="grow"><h2>بحث بدون نتائج — آخر 24 ساعة</h2><p>أقوى مؤشر على كلمات أو أصناف تحتاج تحسينًا.</p></div><span class="tag ${S.zeroSearches.length?'warn':'ok'}">${S.zeroSearches.length}</span></div><div class="list">${S.zeroSearches.slice(0,80).map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.rawQuery||x.query||'بحث')}</div><div class="sub">${esc(x.name||'مستخدم')} · ${dt(x.time)}</div></div></div>`).join('')||'<div class="sub">لا يوجد بحث بدون نتائج خلال آخر 24 ساعة.</div>'}</div></div><div class="panel"><div class="ph"><div class="grow"><h2>سلال غير مكتملة</h2><p>سلات غير فارغة لم تتحدث منذ أكثر من ساعتين.</p></div><span class="tag ${abandoned.length?'warn':'ok'}">${abandoned.length}</span></div><div class="list">${abandoned.slice(0,60).map(c=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(c.actorName||'عميل/موظف')}</div><div class="sub">${num(c.itemCount)} صنف · آخر تعديل ${dt(c.updatedAt||c.lastNonEmptyAt)}</div></div><span class="tag info">${c.actorType==='employee'?'موظف':'عميل'}</span></div>`).join('')||'<div class="sub">لا توجد سلال مهجورة ضمن التعريف الحالي.</div>'}</div></div></div><div class="panel" style="margin-top:12px"><div class="ph"><div class="grow"><h2>فروقات الجرد الحالية</h2><p>النواقص والزيادات الموجودة ضمن آخر 1000 سجل تم فحصه.</p></div><span class="tag ${S.stocktake.length?'warn':'ok'}">${S.stocktake.length}</span></div>${S.stocktake.length?`<div class="tablewrap"><table class="table"><thead><tr><th>الصنف</th><th>الحالة</th><th>المطلوب</th><th>الموجود</th><th>الفريق</th></tr></thead><tbody>${S.stocktake.slice(0,100).map(x=>`<tr><td>${esc(x.sku||x.itemId||x.id)}</td><td>${x.countStatus==='shortage'?'ناقص':'زائد'}</td><td>${num(x.expectedQty)}</td><td>${num(x.actualQty)}</td><td>${esc(x.teamName||x.teamId||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="sub">لا توجد فروقات ضمن السجلات المقروءة.</div>'}</div>`}
render();run();
</script></body></html>
