function AdminGate({onPass}){const [name,setName]=useState('مهند'),[code,setCode]=useState(''),[error,setError]=useState('');const submit=e=>{e.preventDefault();if(normalizeText(name)==='مهند'&&hashCode(toEnglishDigits(code).trim())===ADMIN_HASH){localStorage.setItem(STORAGE_KEYS.NAME,'مهند');localStorage.setItem(STORAGE_KEYS.TOKEN,ADMIN_HASH);onPass()}else setError('بيانات الإدارة غير صحيحة.')};return <div className="min-h-screen bg-white flex items-center justify-center p-5"><form onSubmit={submit} className="w-full max-w-[430px] bg-white border border-line rounded-[24px] shadow-lift overflow-hidden"><div className="p-7 text-center border-b border-line"><div className="w-14 h-14 rounded-2xl bg-accentSoft text-accent mx-auto flex items-center justify-center"><Icon name="shield" className="w-7 h-7"/></div><h1 className="text-xl font-bold mt-4">مركز الأمن والرقابة</h1><p className="text-sm text-sub mt-2">هذه الصفحة مخصصة للإدارة فقط.</p></div><div className="p-5 grid gap-4"><label className="text-xs font-bold">اسم المدير<input value={name} onChange={e=>setName(e.target.value)} className="mt-2 w-full h-12 rounded-xl border border-line px-3 outline-none focus:border-accent"/></label><label className="text-xs font-bold">رمز الإدارة<input value={code} onChange={e=>setCode(e.target.value)} type="password" className="mt-2 w-full h-12 rounded-xl border border-line px-3 outline-none focus:border-accent"/></label>{error&&<div className="bg-badSoft text-bad border border-bad/10 p-3 rounded-xl text-xs font-bold">{error}</div>}<button className="h-12 rounded-xl bg-ink text-white font-bold">دخول آمن</button><button type="button" onClick={()=>location.href='./index.html'} className="h-11 rounded-xl border border-line font-bold text-sm">العودة للنظام</button></div></form></div>}

 const q=normalizeText(query); const match=x=>!q||normalizeText(JSON.stringify(x)).includes(q);
 async function customerStatus(c,status){if(!confirm(`${status==='suspended'?'إيقاف':'تفعيل'} حساب ${c.company||c.name||''}؟`))return;setBusyId(c.id);try{await db.collection('customers').doc(c.id).update({status,securityUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),securityUpdatedBy:'مهند'});await logAdmin(status==='suspended'?'customer_suspended':'customer_reactivated',{customerUid:c.id,company:c.company||'',phone:c.phone||''});await load()}finally{setBusyId('')}}
 async function accessDecision(r,status){if(!confirm(`تأكيد ${status==='approved'?'الموافقة':'الرفض'}؟`))return;setBusyId(r.id);try{await db.collection('access_requests').doc(r.id).update({status,reviewedBy:'مهند',reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});await logAdmin('employee_access_decision',{requestId:r.id,name:r.name||'',status});await load()}finally{setBusyId('')}}

 </div>;

 function Overview(){return <div className="grid gap-5"><div className="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-8 gap-3"><KPI label="العملاء" value={customers.length} icon="users"/><KPI label="الشركات" value={companies.length} icon="building"/><KPI label="عملاء متصلون" value={customerOnline.length} icon="activity" tone="ok"/><KPI label="طلبات العملاء" value={cOrders.length} icon="file"/><KPI label="الموظفون" value={employeeProfiles.length} icon="users"/><KPI label="موظفون متصلون" value={employeeOnline.length} icon="activity" tone="ok"/><KPI label="طلبات دخول معلقة" value={pending.length} icon="camera" tone={pending.length?'bad':'ok'}/><KPI label="نشاط 24 ساعة" value={activity24} icon="activity" tone="info"/></div><div className="grid lg:grid-cols-2 gap-4"><Panel title="آخر النشاطات" note="عملاء + موظفون في خط زمني واحد"><Timeline rows={timeline.filter(match).slice(0,18)}/></Panel><Panel title="الحالة التشغيلية" note="ملخص سريع"><div className="grid gap-2"><Metric label="جلسات العملاء المسجلة" value={cSessions.length}/><Metric label="دخول العملاء" value={cLogins.length}/><Metric label="مسودات العملاء" value={cDrafts.length}/><Metric label="جلسات الموظفين" value={eSessions.length}/><Metric label="عمليات بحث الموظفين" value={searches.length}/><Metric label="تعديلات الأقسام" value={audit.length}/></div></Panel></div></div>}
 function Customers(){return <div className="grid gap-4">{companies.filter(match).map(co=><div key={co.name} className="bg-white border border-line rounded-2xl shadow-card overflow-hidden"><div className="p-4 flex items-start justify-between gap-3 border-b border-line"><div className="flex gap-3"><div className="w-11 h-11 rounded-xl bg-accentSoft text-accent flex items-center justify-center"><Icon name="building"/></div><div><b className="block">{co.name}</b><div className="text-[11px] text-muted mt-1">{co.customers.length} حساب · {co.orders.length} طلب · {co.drafts.length} مسودة · {co.activity.length} حركة</div></div></div><Pill tone={co.customers.some(c=>c.status==='suspended')?'bad':'ok'}>{co.customers.some(c=>c.status==='suspended')?'يوجد حساب موقوف':'نشط'}</Pill></div><div className="p-4 grid md:grid-cols-2 xl:grid-cols-3 gap-3">{co.customers.map(c=><div key={c.id} className="border border-line rounded-xl p-3"><div className="flex justify-between gap-2"><div><b className="text-sm">{c.name||'لم يحفظ الاسم بعد'}</b><div className="text-[11px] ltr text-right text-sub">{c.phone||'—'}</div></div><Pill tone={c.status==='suspended'?'bad':'ok'}>{c.status==='suspended'?'موقوف':'نشط'}</Pill></div><div className="mt-3 text-[11px] text-sub grid gap-1"><span>الفروع: <b>{c.branches?.length||0}</b></span><span>آخر دخول: <b>{ago(c.lastLoginAt)}</b></span><span>تحقق الحضور: <b>{c.livenessVerified?'تم':'—'}</b></span></div><div className="grid grid-cols-2 gap-2 mt-3"><button onClick={()=>setDetail(c)} className="h-9 rounded-lg border border-line text-xs font-bold">كل التفاصيل</button><button disabled={busyId===c.id} onClick={()=>customerStatus(c,c.status==='suspended'?'active':'suspended')} className={`h-9 rounded-lg text-xs font-bold ${c.status==='suspended'?'bg-okSoft text-ok':'bg-badSoft text-bad'}`}>{c.status==='suspended'?'إعادة التفعيل':'إيقاف الحساب'}</button></div></div>)}</div></div>)}</div>}
 function CustomerActivity(){const rows=cActivity.filter(match).sort((a,b)=>tsMs(b.createdAt)-tsMs(a.createdAt));return <Panel title={`سجل نشاط العملاء (${rows.length})`} note="الأحداث المهمة المسجلة من بوابة العملاء"><Rows rows={rows} primary={r=>eventName(r.type)} secondary={r=>`${customerName(r.customerUid)} · ${r.label||'—'}`} time={r=>r.createdAt}/></Panel>}
 function CustomerOrders(){const rows=[...cOrders.map(x=>({...x,__type:'طلب'})),...cDrafts.map(x=>({...x,__type:'مسودة'}))].filter(match).sort((a,b)=>tsMs(b.createdAt||b.updatedAt)-tsMs(a.createdAt||a.updatedAt));return <Panel title={`طلبات ومسودات العملاء (${rows.length})`}><Rows rows={rows} primary={r=>`${r.__type} ${r.orderNo||r.draftNo||r.id.slice(0,8)}`} secondary={r=>`${r.customer?.company||customerName(r.customerUid)} · ${r.items?.length||0} صنف · ${num(r.totalCartons)} كرتون`} time={r=>r.createdAt||r.updatedAt}/></Panel>}
 function Employees(){return <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{employeeProfiles.filter(match).map(e=><div key={e.name} className="bg-white border border-line rounded-2xl p-4 shadow-card"><div className="flex justify-between gap-2"><div><b>{e.name}</b><div className="text-[10px] text-muted mt-1">{e.sessions.length} جلسة · {e.searches.length} بحث · {e.logins.length} دخول</div></div><Pill tone={Date.now()-e.lastActive<180000?'ok':'neutral'}>{Date.now()-e.lastActive<180000?'متصل':'غير متصل'}</Pill></div><div className="grid grid-cols-3 gap-2 mt-4 text-center"><MetricMini label="الجلسات" value={e.sessions.length}/><MetricMini label="البحث" value={e.searches.length}/><MetricMini label="الطلبات" value={e.orders.length}/></div><button onClick={()=>setDetail({name:e.name,sessions:e.sessions,logins:e.logins,searches:e.searches,orders:e.orders,__collection:'employee_profile'})} className="mt-3 w-full h-9 rounded-lg border border-line text-xs font-bold">الملف التفصيلي</button></div>)}</div>}
 function EmployeeActivity(){const rows=[...eLogins.map(x=>({...x,__label:'تسجيل دخول',__time:x.time})),...searches.map(x=>({...x,__label:'عملية بحث',__time:x.time})),...eSessions.map(x=>({...x,__label:'جلسة عمل',__time:x.lastActive}))].filter(match).sort((a,b)=>tsMs(b.__time)-tsMs(a.__time));return <Panel title={`نشاط الموظفين (${rows.length})`}><Rows rows={rows} primary={r=>r.__label} secondary={r=>`${r.name||'—'}${r.rawQuery?' · '+r.rawQuery:''}${r.warehouse?' · '+r.warehouse:''}`} time={r=>r.__time}/></Panel>}
 function Access(){const rows=access.filter(match).sort((a,b)=>tsMs(b.timestamp)-tsMs(a.timestamp));return <div className="grid gap-4"><div className="grid grid-cols-3 gap-3"><KPI label="معلق" value={rows.filter(x=>x.status==='pending').length} tone="bad" icon="camera"/><KPI label="مقبول" value={rows.filter(x=>x.status==='approved').length} tone="ok" icon="check"/><KPI label="مرفوض" value={rows.filter(x=>x.status==='rejected').length} icon="pause"/></div><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{rows.map(r=><div key={r.id} className="bg-white border border-line rounded-2xl overflow-hidden shadow-card">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full h-44 object-cover bg-surface"/>:<div className="h-28 bg-surface flex items-center justify-center text-muted"><Icon name="camera"/></div>}<div className="p-3"><div className="flex justify-between gap-2"><b>{r.name||'—'}</b><Pill tone={r.status==='approved'?'ok':r.status==='rejected'?'bad':'info'}>{r.status||'pending'}</Pill></div><div className="text-[10px] text-muted mt-1">{dateTime(r.timestamp)}</div><div className="grid grid-cols-2 gap-2 mt-3"><button onClick={()=>setDetail(r)} className="h-9 rounded-lg border border-line text-xs font-bold">التفاصيل</button>{r.status==='pending'?<div className="grid grid-cols-2 gap-1"><button disabled={busyId===r.id} onClick={()=>accessDecision(r,'approved')} className="h-9 rounded-lg bg-okSoft text-ok text-[10px] font-bold">قبول</button><button disabled={busyId===r.id} onClick={()=>accessDecision(r,'rejected')} className="h-9 rounded-lg bg-badSoft text-bad text-[10px] font-bold">رفض</button></div>:<span/>}</div></div></div>)}</div></div>}
 function System(){const groups=[['customers',customers],['customer_sessions',cSessions],['customer_login_logs',cLogins],['customer_activity_logs',cActivity],['customer_orders',cOrders],['customer_drafts',cDrafts],['users',eUsers],['site_sessions',eSessions],['login_logs',eLogins],['access_requests',access],['search_logs',searches],['orders',eOrders],['drafts',eDrafts],['category_audit_logs',audit],['security_admin_logs',securityAdmin]];return <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{groups.map(([name,rows])=><button key={name} onClick={()=>setDetail({collection:name,count:rows.length,latest:rows.slice(0,20),__collection:'collection_summary'})} className="bg-white border border-line rounded-2xl p-4 shadow-card text-right"><div className="text-[10px] text-muted ltr">{name}</div><div className="text-2xl font-bold mt-2">{rows.length}</div><div className="text-xs text-sub mt-1">فتح عينة من السجلات</div></button>)}</div>}
 function customerName(uid){const c=customers.find(x=>x.id===uid);return c?.company||c?.name||uid||'—'}
 function eventName(t){return({account_created:'إنشاء حساب',liveness_verified:'نجاح التحقق',login_success:'تسجيل دخول',session_restored:'استعادة جلسة',page_view:'فتح صفحة',search:'بحث',category_view:'فتح قسم',product_add_open:'اختيار منتج',product_image_view:'عرض صورة منتج',cart_item_updated:'تعديل كمية/توزيع',cart_item_removed:'حذف من السلة',branch_created:'إنشاء فرع',branches_updated:'تعديل الفروع',draft_saved:'حفظ مسودة',draft_loaded:'فتح مسودة',draft_deleted:'حذف مسودة',order_submitted:'إرسال طلب',profile_name_saved:'حفظ الاسم',pin_changed:'تغيير PIN',logout:'تسجيل خروج'})[t]||t||'نشاط'}
 function Panel({title,note,children}){return <section className="bg-white border border-line rounded-2xl shadow-card overflow-hidden"><div className="p-4 border-b border-line"><b className="text-sm">{title}</b>{note&&<div className="text-[10px] text-muted mt-1">{note}</div>}</div><div className="p-3 sm:p-4">{children}</div></section>}
 function Timeline({rows}){return <div className="grid gap-1">{rows.map((r,i)=><button key={r.id||i} onClick={()=>setDetail(r)} className="w-full text-right flex items-center gap-3 p-2.5 rounded-xl hover:bg-surface"><div className={`w-2.5 h-2.5 rounded-full shrink-0 ${r.__kind==='customer'?'bg-accent':r.__kind==='access'?'bg-bad':'bg-info'}`}></div><div className="min-w-0 flex-1"><b className="text-xs block truncate">{r.__kind==='customer'?eventName(r.type):r.label||r.__kind}</b><span className="text-[10px] text-muted truncate block">{r.__kind==='customer'?customerName(r.customerUid):(r.name||'')}</span></div><span className="text-[10px] text-muted shrink-0">{ago(r.__time)}</span></button>)}</div>}
 function Rows({rows,primary,secondary,time}){return <div className="grid gap-1">{rows.length?rows.map((r,i)=><button key={r.id||i} onClick={()=>setDetail(r)} className="w-full text-right p-3 rounded-xl hover:bg-surface border-b border-line last:border-0"><div className="flex items-start justify-between gap-3"><div className="min-w-0"><b className="text-xs block truncate">{primary(r)}</b><span className="text-[10px] text-sub block mt-1 truncate">{secondary(r)}</span></div><span className="text-[10px] text-muted shrink-0">{ago(time(r))}</span></div></button>):<div className="py-12 text-center text-xs text-muted">لا توجد سجلات مطابقة.</div>}</div>}
 function Metric({label,value}){return <div className="flex items-center justify-between rounded-xl bg-surface border border-line p-3 text-xs"><span className="text-sub">{label}</span><b className="ltr">{value}</b></div>}
 function MetricMini({label,value}){return <div className="rounded-xl bg-surface p-2"><div className="text-[9px] text-muted">{label}</div><b className="text-sm">{value}</b></div>}
}
function Root(){const [ok,setOk]=useState(isAdminSession());return ok?<App/>:<AdminGate onPass={()=>setOk(true)}/>}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script></body></html>
