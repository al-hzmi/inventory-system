<style>
:root{--p:#1c1917;--s:#57534e;--m:#a8a29e;--b:#e7e5e4;--sf:#fafaf9;--ok:#15803d;--oks:#f0fdf4;--bad:#b91c1c;--bads:#fef2f2;--info:#0369a1;--infos:#f0f9ff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--sf);color:var(--p)}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}input,select{font-size:16px}.app{width:100%;max-width:1180px;margin:auto;padding:10px 10px max(28px,env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:rgba(250,250,249,.96);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid var(--b)}.head{display:flex;gap:9px;align-items:center}.back{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--b);border-radius:13px;background:#fff;font-size:22px}.grow{flex:1;min-width:0}.title{font-size:20px;font-weight:700;line-height:1.35}.sub{font-size:12px;color:var(--s);line-height:1.6}.view{font-size:11px;font-weight:700;color:var(--info);background:var(--infos);border:1px solid rgba(3,105,161,.13);padding:7px 9px;border-radius:999px;white-space:nowrap}.panel{background:#fff;border:1px solid var(--b);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(28,25,23,.04)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.select,.search{height:46px;border:1px solid var(--b);border-radius:13px;background:#fff;padding:0 12px;outline:none}.select{width:100%}.search{width:100%}.search:focus,.select:focus{border-color:#a8a29e;box-shadow:0 0 0 3px rgba(168,162,158,.12)}.campaignName{font-size:18px;font-weight:700}.muted{font-size:12px;color:var(--s);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.stat{border:1px solid var(--b);border-radius:13px;padding:11px;text-align:center;background:var(--sf);min-width:0}.stat b{display:block;font-size:24px}.stat span{display:block;font-size:11px;color:var(--s);margin-top:3px}.progress{height:8px;background:#eeeae7;border-radius:999px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--ok)}.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:1px 0 6px;margin-top:12px;overscroll-behavior-inline:contain}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;height:42px;border:1px solid var(--b);border-radius:999px;background:#fff;padding:0 13px;font-size:12px;font-weight:700}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.cards{display:grid;gap:9px;margin-top:10px}.card{border:1px solid var(--b);border-radius:16px;padding:13px;background:#fff;min-width:0}.cardHead{display:flex;gap:8px;align-items:flex-start}.sku{font-size:18px;font-weight:700;direction:ltr;unicode-bidi:isolate}.name{font-size:13px;color:var(--s);line-height:1.55;margin-top:2px}.pill{font-size:11px;font-weight:700;border-radius:999px;padding:6px 9px;background:var(--sf);color:var(--s);border:1px solid var(--b);white-space:nowrap}.pill.ok{background:var(--oks);color:var(--ok);border-color:rgba(21,128,61,.13)}.pill.bad{background:var(--bads);color:var(--bad);border-color:rgba(185,28,28,.13)}.pill.info{background:var(--infos);color:var(--info);border-color:rgba(3,105,161,.13)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.metric{background:var(--sf);border:1px solid var(--b);border-radius:11px;padding:8px;text-align:center;min-width:0}.metric span{display:block;font-size:10px;color:var(--s)}.metric b{display:block;font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}.foot{font-size:11px;color:var(--s);line-height:1.7;margin-top:9px;overflow-wrap:anywhere}.note{margin-top:8px;padding:9px 10px;border-radius:11px;background:#fffbeb;color:#92400e;font-size:12px;line-height:1.7}.empty{text-align:center;color:var(--m);padding:46px 14px;font-size:13px}.tablewrap{display:none}.lock{text-align:center;padding:80px 20px}.lock h2{font-size:21px;margin:0}.lock p{font-size:13px;color:var(--s);line-height:1.8}.btn{height:44px;padding:0 14px;border:1px solid var(--b);border-radius:12px;background:#fff;font-weight:700}
@media(min-width:720px){.app{padding:16px 16px 36px}.stats{grid-template-columns:repeat(6,1fr)}.panel{padding:16px}.cards{display:none}.tablewrap{display:block;overflow:auto;border:1px solid var(--b);border-radius:14px;margin-top:10px}.table{width:100%;border-collapse:collapse;min-width:930px;font-size:11px}.table th,.table td{padding:10px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}.table th{background:var(--sf);color:var(--s)}.table .wrapText{white-space:normal;min-width:180px;max-width:260px}}

</head><body><div id="app" class="app"><div class="empty">جاري تحميل متابعة الجرد...</div></div>
<script>
const firebaseConfig={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374',measurementId:'G-ZGF5DT9D0K'};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const STORAGE={NAME:'inventory_user_name_v2',TOKEN:'inventory_admin_token_v2',EMPLOYEE_ID:'inventory_employee_id_v2',AUTH_VERSION:'inventory_employee_auth_version_v2',PHOTO:'inventory_login_photo_proof_v2'},ADMIN_HASH='1jh297-spgf2z',ROOT_ID='admin_mohanad',CONTROL_DOC='stocktake_accountant_access';
const $=s=>document.querySelector(s),app=$('#app');const state={control:null,campaigns:[],campaign:null,teams:[],items:[],tab:'all',search:'',unsubs:[]};let photo=null;try{photo=JSON.parse(localStorage.getItem(STORAGE.PHOTO)||'null')}catch{}
const user={name:(localStorage.getItem(STORAGE.NAME)||'').trim(),token:localStorage.getItem(STORAGE.TOKEN)||'',employeeId:(localStorage.getItem(STORAGE.EMPLOYEE_ID)||'').trim(),authVersion:localStorage.getItem(STORAGE.AUTH_VERSION)||'',photo};const localQa=['localhost','127.0.0.1'].includes(location.hostname),preview=new URLSearchParams(location.search).get('preview')==='1';user.isAdmin=user.name==='مهند'&&user.token===ADMIN_HASH&&(localQa||(photo?.role==='admin'&&photo?.employeeId===ROOT_ID&&photo?.photoId));user.validEmployee=Boolean(user.employeeId&&user.authVersion==='2'&&(localQa||(photo?.role==='employee'&&photo?.employeeId===user.employeeId&&photo?.photoId)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06ffa-z0-9\s._-]/g,' ').replace(/\s+/g,' ').trim();const fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(Number(v)||0);const ms=v=>v?.toMillis?v.toMillis():v?.seconds?v.seconds*1000:0;const statusLabel=s=>({pending:'متبقي',matched:'مطابق',shortage:'ناقص',surplus:'زائد'}[s]||s);const allowed=c=>{if(user.isAdmin&&preview)return true;if(!user.validEmployee||!c?.enabled)return false;const ids=new Set(c.allowedEmployeeIds||[]),names=new Set((c.allowedEmployeeNames||[]).map(norm));return c.accessMode==='all'||(c.accessMode==='selected'&&(ids.has(user.employeeId)||names.has(norm(user.name))))};
if(!user.name||(!user.isAdmin&&!user.validEmployee))location.href='./index.html?employee=1';else start();
function start(){state.unsubs.push(db.collection('system_controls').doc(CONTROL_DOC).onSnapshot(d=>{state.control=d.exists?d.data():{};render();},()=>lock('تعذر التحقق من الصلاحية','تحقق من الاتصال ثم أعد المحاولة.')));state.unsubs.push(db.collection('stocktake_campaigns').onSnapshot(s=>{state.campaigns=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!c.isTest&&!c.testMode).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));if(!state.campaign||!state.campaigns.some(c=>c.id===state.campaign.id))state.campaign=pickInitialCampaign();bindCampaign();render()},()=>{}))}
function pickInitialCampaign(){const activeId=String(state.control?.activeCampaignId||'');return state.campaigns.find(c=>c.id===activeId)||state.campaigns.find(c=>c.status==='active')||state.campaigns[0]||null}
let bound='';function bindCampaign(){const id=state.campaign?.id||'';if(id===bound)return;bound=id;while(state.unsubs.length>2){try{state.unsubs.pop()()}catch{}}state.teams=[];state.items=[];if(!id)return;state.unsubs.push(db.collection('stocktake_teams').where('campaignId','==',id).onSnapshot(s=>{state.teams=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));state.unsubs.push(db.collection('stocktake_items').where('campaignId','==',id).onSnapshot(s=>{state.items=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}))}
function lock(t,p){app.innerHTML=`<div class="lock"><h2>${esc(t)}</h2><p>${esc(p)}</p><button class="btn" onclick="location.href='./index.html?employee=1'">العودة للنظام</button></div>`}
function filterRows(){let rows=state.items;if(state.tab==='pending')rows=rows.filter(i=>(i.countStatus||'pending')==='pending');if(state.tab==='matched')rows=rows.filter(i=>i.countStatus==='matched');if(state.tab==='shortage')rows=rows.filter(i=>i.countStatus==='shortage');if(state.tab==='surplus')rows=rows.filter(i=>i.countStatus==='surplus');if(state.tab==='notes')rows=rows.filter(i=>String(i.note||'').trim());const q=norm(state.search);if(q)rows=rows.filter(i=>norm(`${i.sku} ${i.name||''} ${i.note||''} ${teamName(i.teamId)} ${teamScope(i.teamId)}`).includes(q));return rows.sort((a,b)=>(a.orderIndex??999999)-(b.orderIndex??999999)).slice(0,1200)}
function teamName(id){return state.teams.find(t=>t.id===id)?.name||'—'}function teamScope(id){const t=state.teams.find(t=>t.id===id);return t?.scope||t?.zone||''}
function render(){if(!state.control)return;if(!allowed(state.control))return lock('متابعة الجرد غير متاحة لحسابك','صلاحية متابعة الجرد يحددها مهند من إدارة الجرد.');const cp=state.campaign;if(!cp){app.innerHTML=`<div class="top"><div class="head"><button class="back" id="back">‹</button><div class="grow"><div class="title">متابعة الجرد</div><div class="sub">متابعة الجرد</div></div><span class="view">متابعة</span></div></div><div class="panel empty">لا توجد حملة جرد حقيقية لعرضها.</div>`;$('#back').onclick=()=>location.href='./index.html?employee=1';return}const total=state.items.length,counted=state.items.filter(i=>(i.countStatus||'pending')!=='pending').length,pending=total-counted,matched=state.items.filter(i=>i.countStatus==='matched').length,short=state.items.filter(i=>i.countStatus==='shortage').length,surplus=state.items.filter(i=>i.countStatus==='surplus').length,notes=state.items.filter(i=>String(i.note||'').trim()).length,progress=total?Math.round(counted/total*100):0,rows=filterRows();app.innerHTML=`<div class="top"><div class="head"><button class="back" id="back">‹</button><div class="grow"><div class="title">متابعة الجرد</div><div class="sub">متابعة الجرد</div></div><span class="view">${preview&&user.isAdmin?'معاينة مهند':'متابعة'}</span></div></div><section class="panel"><div class="row"><div class="grow"><div class="campaignName">${esc(cp.name||`جرد ${cp.warehouse||''}`)}</div><div class="muted">${esc(cp.warehouse||'—')} · ${esc(cp.stocktakeDate||'—')} · ${cp.status==='active'?'الجرد جارٍ':cp.status==='closed'?'مغلق':'تجهيز'}</div></div></div>${state.campaigns.length>1?`<select id="campaign" class="select" style="margin-top:10px">${state.campaigns.map(c=>`<option value="${c.id}" ${c.id===cp.id?'selected':''}>${esc(c.name||`جرد ${c.warehouse||''}`)}</option>`).join('')}</select>`:''}<div class="stats"><div class="stat"><b>${total}</b><span>الأصناف</span></div><div class="stat"><b>${counted}</b><span>تم الجرد</span></div><div class="stat"><b>${pending}</b><span>متبقي</span></div><div class="stat"><b>${matched}</b><span>مطابق</span></div><div class="stat"><b>${short}</b><span>نواقص</span></div><div class="stat"><b>${surplus}</b><span>زيادات</span></div></div><div class="progress"><i style="width:${progress}%"></i></div><div class="muted" style="margin-top:8px">${progress}% مكتمل · ${notes} أصناف عليها ملاحظات</div></section><section class="panel"><input id="search" class="search" value="${esc(state.search)}" placeholder="رقم الصنف / الاسم / المجموعة / الملاحظة"><div class="tabs">${tab('all','الكل')}${tab('pending','المتبقي')}${tab('matched','مطابق')}${tab('shortage','النواقص')}${tab('surplus','الزيادات')}${tab('notes','الملاحظات')}</div><div class="cards">${rows.length?rows.map(card).join(''):'<div class="empty">لا توجد نتائج.</div>'}</div>${desktopTable(rows)}</section>`;bindUi()}
function tab(id,label){return `<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`}function card(i){const st=i.countStatus||'pending',counted=st!=='pending',diff=counted?Number(i.difference):null;return `<article class="card"><div class="cardHead"><div class="grow"><div class="sku">${esc(i.sku)}</div><div class="name">${esc(i.name||'')}${i.pack!==''&&i.pack!=null?` · الشد ${esc(i.pack)}`:''}</div></div><span class="pill ${st==='matched'?'ok':st==='shortage'?'bad':st==='surplus'?'info':''}">${statusLabel(st)}</span></div><div class="metrics"><div class="metric"><span>كمية النظام</span><b>${fmt(i.expectedQty)}</b></div><div class="metric"><span>الفعلي</span><b>${counted?fmt(i.actualQty):'—'}</b></div><div class="metric"><span>الفرق</span><b>${counted?`${diff>0?'+':''}${fmt(diff)}`:'—'}</b></div></div><div class="foot"><b>${esc(teamName(i.teamId))}</b>${teamScope(i.teamId)?` · ${esc(teamScope(i.teamId))}`:''}${i.updatedByName?`<br>آخر تسجيل: ${esc(i.updatedByName)} · التعديلات ${fmt(i.revision||0)}`:''}</div>${i.note?`<div class="note"><b>ملاحظة:</b> ${esc(i.note)}</div>`:''}</article>`}
function desktopTable(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th>المجموعة</th><th>النطاق</th><th>الصنف</th><th>الشد</th><th>النظام</th><th>الفعلي</th><th>الفرق</th><th>الحالة</th><th>الملاحظة</th><th>آخر تسجيل</th><th>التعديلات</th></tr></thead><tbody>${rows.length?rows.map(i=>`<tr><td>${esc(teamName(i.teamId))}</td><td>${esc(teamScope(i.teamId))}</td><td><b>${esc(i.sku)}</b><div class="muted">${esc(i.name||'')}</div></td><td>${esc(i.pack??'—')}</td><td>${fmt(i.expectedQty)}</td><td>${(i.countStatus||'pending')!=='pending'?fmt(i.actualQty):'—'}</td><td>${(i.countStatus||'pending')!=='pending'?`${Number(i.difference)>0?'+':''}${fmt(i.difference)}`:'—'}</td><td>${statusLabel(i.countStatus||'pending')}</td><td class="wrapText">${esc(i.note||'—')}</td><td>${esc(i.updatedByName||'—')}</td><td>${fmt(i.revision||0)}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">لا توجد نتائج.</td></tr>'}</tbody></table></div>`}
function bindUi(){$('#back').onclick=()=>location.href='./index.html?employee=1';$('#campaign')?.addEventListener('change',e=>{state.campaign=state.campaigns.find(c=>c.id===e.target.value)||state.campaign;bindCampaign();render()});$('#search').oninput=e=>{state.search=e.target.value;render();const x=$('#search');x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch{}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
</script></body></html>
