const firebaseConfig={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374'};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const ADMIN_HASH='1jh297-spgf2z';const isAdmin=()=>{try{const p=JSON.parse(localStorage.getItem('inventory_login_photo_proof_v2')||'null'),q=['localhost','127.0.0.1'].includes(location.hostname);return String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH&&(q||(p?.role==='admin'&&Boolean(p?.photoId)))}catch{return false}};if(!isAdmin())location.replace('./index.html?employee=1');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();const ms=v=>{try{return v?.toMillis?.()||v?.seconds*1000||new Date(v).getTime()||0}catch{return 0}};const dt=v=>{const n=ms(v);return n?new Date(n).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'};const ago=v=>{const n=ms(v);if(!n)return'—';const m=Math.floor(Math.max(0,Date.now()-n)/60000);if(m<1)return'الآن';if(m<60)return`منذ ${m} د`;const h=Math.floor(m/60);if(h<24)return`منذ ${h} س`;return`منذ ${Math.floor(h/24)} ي`};const QA_RE=/(اختبار|تجربه|تجربة|test|qa|playwright|audit_employee|موظف اختبار|اختبار تقني)/i;const isQa=x=>QA_RE.test(norm(x?.actorName||x?.name||x?.canonicalName||x?.employeeName||x?.id||''));const online=v=>Date.now()-ms(v)<180000;
const PERMS={employee:{search:'البحث في المخزون',scanner:'ماسح الباركود',catalog:'المعرض الرقمي',cart:'السلة والفاتورة',drafts:'المسودات',orders:'الطلبات',customerView:'واجهة العملاء',stocktake:'الجرد'},customer:{browse:'تصفح المعرض',search:'البحث',categories:'الأقسام',images:'صور الأصناف',cart:'السلة',checkout:'اعتماد الطلب',orders:'سجل الطلبات',whatsapp:'واتساب',install:'إضافة كتطبيق'}};const DEFAULTS={employee:Object.fromEntries(Object.keys(PERMS.employee).map(k=>[k,true])),customer:Object.fromEntries(Object.keys(PERMS.customer).map(k=>[k,true]))};
const TEMPLATES={employee:{full:{label:'كامل',v:{search:true,scanner:true,catalog:true,cart:true,drafts:true,orders:true,customerView:true,stocktake:true}},sales:{label:'مبيعات',v:{search:true,scanner:true,catalog:true,cart:true,drafts:true,orders:true,customerView:true,stocktake:false}},warehouse:{label:'مستودع',v:{search:true,scanner:true,catalog:true,cart:false,drafts:false,orders:false,customerView:false,stocktake:true}},viewer:{label:'استعراض فقط',v:{search:true,scanner:false,catalog:true,cart:false,drafts:false,orders:false,customerView:false,stocktake:false}}},customer:{full:{label:'كامل',v:{browse:true,search:true,categories:true,images:true,cart:true,checkout:true,orders:true,whatsapp:true,install:true}},browse:{label:'تصفح فقط',v:{browse:true,search:true,categories:true,images:true,cart:false,checkout:false,orders:false,whatsapp:false,install:true}},noCheckout:{label:'بدون اعتماد',v:{browse:true,search:true,categories:true,images:true,cart:true,checkout:false,orders:true,whatsapp:false,install:true}}}};
const S={tab:'overview',scope:'employee',q:'',employees:[],customers:[],activity:[],carts:[],employeeSessions:[],customerSessions:[],customerDevices:[],messages:[],customerOrders:[],employeeOrders:[],permissions:{employeeDefaults:{...DEFAULTS.employee},customerDefaults:{...DEFAULTS.customer},employeeOverrides:{},customerOverrides:{}},employeeSite:{mode:'open'},customerPortal:{enabled:true},stocktake:{enabled:false},audit:[],selected:null,errors:[]};const unsubs=[];
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function listen(label,q,cb){try{const u=q.onSnapshot(s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>{S.errors.push(label+': '+e.message);render()});unsubs.push(u)}catch(e){S.errors.push(label+': '+e.message)}}
function docListen(label,ref,cb){try{const u=ref.onSnapshot(d=>{cb(d.exists?{id:d.id,...d.data()}:{});render()},e=>{S.errors.push(label+': '+e.message);render()});unsubs.push(u)}catch(e){S.errors.push(label+': '+e.message)}}
function boot(){listen('الموظفون',db.collection('employee_accounts'),r=>S.employees=r.filter(x=>!isQa(x)));listen('العملاء',db.collection('customers'),r=>S.customers=r.filter(x=>!isQa(x)));listen('النشاط',db.collection('v44_activity_logs').orderBy('createdAt','desc').limit(1200),r=>S.activity=r.filter(x=>!isQa(x)));listen('السلال',db.collection('v44_live_carts'),r=>S.carts=r.filter(x=>!isQa(x)));listen('جلسات الموظفين',db.collection('site_sessions').orderBy('lastActive','desc').limit(600),r=>S.employeeSessions=r.filter(x=>!isQa(x)));listen('جلسات العملاء',db.collection('customer_sessions').orderBy('lastActive','desc').limit(600),r=>S.customerSessions=r.filter(x=>!isQa(x)));listen('أجهزة العملاء',db.collection('customer_devices').limit(1000),r=>S.customerDevices=r.filter(x=>!isQa(x)));listen('الرسائل',db.collection('employee_notifications').orderBy('createdAt','desc').limit(600),r=>S.messages=r.filter(x=>!isQa(x)));listen('طلبات العملاء',db.collection('customer_orders').orderBy('createdAt','desc').limit(600),r=>S.customerOrders=r.filter(x=>!isQa(x)));listen('طلبات الموظفين',db.collection('orders').orderBy('timestamp','desc').limit(600),r=>S.employeeOrders=r.filter(x=>!isQa(x)));listen('التدقيق',db.collection('security_admin_logs').orderBy('createdAt','desc').limit(500),r=>S.audit=r.filter(x=>!isQa(x)));docListen('الصلاحيات',db.collection('system_controls').doc('permissions_v44'),d=>S.permissions={employeeDefaults:{...DEFAULTS.employee,...(d.employeeDefaults||{})},customerDefaults:{...DEFAULTS.customer,...(d.customerDefaults||{})},employeeOverrides:d.employeeOverrides||{},customerOverrides:d.customerOverrides||{}});docListen('بوابة الموظفين',db.collection('system_controls').doc('employee_site_access'),d=>S.employeeSite={mode:'open',...d});docListen('بوابة العملاء',db.collection('system_controls').doc('customer_portal'),d=>S.customerPortal={enabled:true,...d});docListen('الجرد',db.collection('system_controls').doc('stocktake_feature'),d=>S.stocktake={enabled:false,...d});render()}
async function audit(action,data={}){try{await db.collection('security_admin_logs').add({admin:'مهند',action,data,createdAt:firebase.firestore.FieldValue.serverTimestamp(),source:'control_center_v46'})}catch{}}
function employeeId(e){return String(e.employeeId||e.id)}function employeeName(e){return e.canonicalName||e.name||e.displayName||e.username||employeeId(e)}function customerId(c){return String(c.uid||c.id||c.visitorId)}function customerName(c){return c.name||c.company||'عميل'}
function people(scope=S.scope){return scope==='employee'?S.employees.map(e=>({id:employeeId(e),name:employeeName(e),raw:e})):S.customers.map(c=>({id:customerId(c),name:customerName(c),company:c.company||'',raw:c}));}
function overrideMap(scope=S.scope){return S.permissions[scope+'Overrides']||{}}function defaults(scope=S.scope){return S.permissions[scope+'Defaults']||DEFAULTS[scope]}
function effective(scope,id){return {...defaults(scope),...(overrideMap(scope)[id]||{})}}
async function savePermissions(patch,action,data){try{const ref=db.collection('system_controls').doc('permissions_v44');await ref.set({...patch,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await audit(action,data);toast('تم حفظ الصلاحيات')}catch(e){console.error('[V46 permissions]',e);toast('تعذر حفظ الصلاحيات')}}
async function toggleDefault(scope,key){const next=!defaults(scope)[key];await savePermissions({[scope+'Defaults']:{...defaults(scope),[key]:next}},'v46_permission_default_updated',{scope,key,value:next})}
async function setOverride(scope,id,key,val){const maps={...(overrideMap(scope)||{})},cur={...(maps[id]||{})};if(val===null)delete cur[key];else cur[key]=val;if(Object.keys(cur).length)maps[id]=cur;else delete maps[id];await savePermissions({[scope+'Overrides']:maps},'v46_permission_override_updated',{scope,id,key,value:val})}
async function clearOverride(scope,id){const maps={...(overrideMap(scope)||{})};delete maps[id];await savePermissions({[scope+'Overrides']:maps},'v46_permission_override_cleared',{scope,id})}
async function applyTemplate(scope,id,name){const tpl=TEMPLATES[scope]?.[name];if(!tpl)return;const maps={...(overrideMap(scope)||{})};maps[id]={...tpl.v};await savePermissions({[scope+'Overrides']:maps},'v46_permission_template_applied',{scope,id,template:name})}
async function featureSet(kind,value){const dangerous=(kind==='employee'&&value==='closed')||(kind==='customer'&&value===false)||(kind==='stocktake'&&value===false);if(dangerous&&!confirm('هذا الإجراء سيوقف الميزة للمستخدمين. هل تريد المتابعة؟'))return;try{if(kind==='employee'){await db.collection('system_controls').doc('employee_site_access').set({mode:value,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await audit('v46_employee_site_mode',{mode:value});}if(kind==='customer'){await db.collection('system_controls').doc('customer_portal').set({enabled:Boolean(value),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await audit('v46_customer_portal',{enabled:Boolean(value)});}if(kind==='stocktake'){await db.collection('system_controls').doc('stocktake_feature').set({enabled:Boolean(value),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await audit('v46_stocktake_feature',{enabled:Boolean(value)});}toast('تم تحديث التحكم')}catch(e){console.error('[V46 feature]',e);toast('تعذر تحديث التحكم')}}
function initials(s){s=String(s||'—').trim();return esc((s.split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'—').toUpperCase())}
function personActivity(scope,id,name){return S.activity.filter(a=>a.actorType===scope&&(String(a.actorId||a.employeeId||a.visitorId||'')===id||norm(a.actorName)===norm(name))).slice(0,80)}
function personCart(scope,id,name){return S.carts.find(c=>c.actorType===scope&&(String(c.actorId||'')===id||norm(c.actorName)===norm(name)))}
function personSessions(scope,id,name){const rows=scope==='employee'?S.employeeSessions:S.customerSessions;return rows.filter(s=>String(s.employeeId||s.customerUid||s.visitorId||s.actorId||'')===id||norm(s.name||s.customerName||s.actorName)===norm(name)).sort((a,b)=>ms(b.lastActive||b.updatedAt)-ms(a.lastActive||a.updatedAt))}
function personOrders(scope,id,name){const rows=scope==='employee'?S.employeeOrders:S.customerOrders;return rows.filter(o=>String(o.employeeId||o.customerUid||o.visitorId||'')===id||norm(o.employeeName||o.customerName||o.customer?.name||o.name)===norm(name)).sort((a,b)=>ms(b.createdAt||b.timestamp)-ms(a.createdAt||a.timestamp))}
function onlinePeople(scope){const seen=new Set();return S.activity.filter(a=>a.actorType===scope&&Date.now()-ms(a.createdAt)<180000).filter(a=>{const k=a.actorId||a.actorName;if(seen.has(k))return false;seen.add(k);return true}).length}
function render(){const tabs=[['overview','نظرة عامة'],['permissions','الصلاحيات'],['profiles','ملفات 360°'],['features','التحكم العام'],['audit','سجل التدقيق']];const onlineNow={employees:onlinePeople('employee'),customers:onlinePeople('customer')};app.innerHTML=`<header class="top"><div class="topin"><a class="navbtn" href="./admin-dashboard.html">‹ لوحة التحكم</a><div class="brand"><b>مركز التحكم</b><span>الصلاحيات · المستخدمون · الوحدات · التدقيق</span></div><a class="navbtn" href="./command-center.html">مركز القيادة</a></div><nav class="tabs">${tabs.map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}</nav></header><main><section class="section ${S.tab==='overview'?'on':''}">${overviewHtml(onlineNow)}</section><section class="section ${S.tab==='permissions'?'on':''}">${permissionsHtml()}</section><section class="section ${S.tab==='profiles'?'on':''}">${profilesHtml()}</section><section class="section ${S.tab==='features'?'on':''}">${featuresHtml()}</section><section class="section ${S.tab==='audit'?'on':''}">${auditHtml()}</section></main>`;bind()}
function overviewHtml(o){const activeCarts=S.carts.filter(c=>Number(c.itemCount||0)>0).length;return `<div class="grid stats"><div class="stat"><small>موظفون متصلون</small><b>${o.employees}</b></div><div class="stat"><small>عملاء متصلون</small><b>${o.customers}</b></div><div class="stat"><small>حسابات الموظفين</small><b>${S.employees.length}</b></div><div class="stat"><small>العملاء</small><b>${S.customers.length}</b></div><div class="stat"><small>سلال نشطة</small><b>${activeCarts}</b></div><div class="stat"><small>تغييرات إدارية</small><b>${S.audit.length}</b></div></div><div class="split" style="margin-top:12px"><div class="panel"><div class="ph"><div class="grow"><h2>الوصول السريع</h2><p>المهام الإدارية الأكثر استخدامًا.</p></div></div><div class="cards two"><button class="btn primary" data-goto="permissions">إدارة الصلاحيات</button><button class="btn" data-goto="profiles">ملفات الموظفين والعملاء</button><button class="btn" data-goto="features">تشغيل وإيقاف الوحدات</button><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit" href="./security-center.html">مركز الأمن</a></div></div><div class="panel"><div class="ph"><div class="grow"><h2>حالة التحكم</h2><p>ملخص الإعدادات الحالية دون الدخول لكل صفحة.</p></div></div><div class="list"><div class="row"><div class="rowmain"><div class="rowtitle">نظام الموظفين</div><div class="sub">الوضع الحالي: ${esc(S.employeeSite.mode||'open')}</div></div><span class="tag ${S.employeeSite.mode==='open'?'ok':'bad'}">${S.employeeSite.mode==='open'?'مفتوح':'مقيّد'}</span></div><div class="row"><div class="rowmain"><div class="rowtitle">بوابة العملاء</div></div><span class="tag ${S.customerPortal.enabled!==false?'ok':'bad'}">${S.customerPortal.enabled!==false?'مفعلة':'متوقفة'}</span></div><div class="row"><div class="rowmain"><div class="rowtitle">الجرد</div></div><span class="tag ${S.stocktake.enabled?'ok':''}">${S.stocktake.enabled?'مفعّل':'متوقف'}</span></div></div></div></div>${S.errors.length?`<div class="warn" style="margin-top:12px">بعض مصادر البيانات لم تُقرأ: ${esc(S.errors.slice(-3).join(' | '))}</div>`:''}`}
function permissionsHtml(){const labels=PERMS[S.scope],defs=defaults(S.scope),q=norm(S.q),ps=people().filter(p=>!q||norm(p.name+' '+(p.company||'')).includes(q));return `<div class="split"><div class="panel"><div class="ph"><div class="grow"><h2>الإعداد الافتراضي</h2><p>يُطبق على الجميع ما لم يوجد استثناء لشخص محدد.</p></div><select id="scope" class="sel"><option value="employee" ${S.scope==='employee'?'selected':''}>الموظفون</option><option value="customer" ${S.scope==='customer'?'selected':''}>العملاء</option></select></div><div class="permgrid">${Object.entries(labels).map(([k,v])=>`<div class="perm"><div><b>${esc(v)}</b><div class="sub">افتراضي لجميع ${S.scope==='employee'?'الموظفين':'العملاء'}</div></div><button class="switch ${defs[k]!==false?'on':''}" data-default="${k}" aria-label="${esc(v)}"><i></i></button></div>`).join('')}</div></div><div class="panel"><div class="ph"><div class="grow"><h2>استثناءات الأشخاص</h2><p>اضغط على شخص لتحديد السماح أو المنع أو العودة للإعداد الافتراضي.</p></div></div><input id="pq" class="search" placeholder="ابحث بالاسم أو الشركة" value="${esc(S.q)}"><div class="list" style="margin-top:10px">${ps.slice(0,100).map(p=>{const count=Object.keys(overrideMap()[p.id]||{}).length;return `<button class="row click" data-personperm="${esc(p.id)}"><div class="avatar">${initials(p.name)}</div><div class="rowmain"><div class="rowtitle">${esc(p.name)}</div><div class="sub">${esc(p.company||p.id)} · ${count?`${count} استثناء`:'يتبع الافتراضي'}</div></div><span class="tag ${count?'info':''}">${count?'مخصص':'افتراضي'}</span></button>`}).join('')||'<div class="empty">لا توجد نتائج.</div>'}</div></div></div>`}
function profilesHtml(){const q=norm(S.q),all=[...people('employee').map(x=>({...x,scope:'employee'})),...people('customer').map(x=>({...x,scope:'customer'}))].filter(p=>!q||norm(p.name+' '+(p.company||'')).includes(q));return `<div class="panel"><div class="ph"><div class="grow"><h2>ملفات 360°</h2><p>نشاط وسلة وطلبات وجلسات ورسائل في مكان واحد.</p></div></div><input id="pq" class="search" placeholder="ابحث بالاسم أو الشركة" value="${esc(S.q)}"><div class="cards two" style="margin-top:12px">${all.slice(0,100).map(p=>{const acts=personActivity(p.scope,p.id,p.name),cart=personCart(p.scope,p.id,p.name),orders=personOrders(p.scope,p.id,p.name);return `<button class="row click" data-profile="${p.scope}|${esc(p.id)}"><div class="avatar">${initials(p.name)}</div><div class="rowmain"><div class="rowtitle">${esc(p.name)}</div><div class="sub">${p.scope==='employee'?'موظف':'عميل'}${p.company?` · ${esc(p.company)}`:''}<br>نشاط ${acts.length} · طلبات ${orders.length} · السلة ${Number(cart?.itemCount||0)} صنف</div></div><span class="tag ${p.scope==='employee'?'info':'ok'}">${p.scope==='employee'?'موظف':'عميل'}</span></button>`}).join('')||'<div class="empty">لا توجد نتائج.</div>'}</div></div>`}
function featuresHtml(){return `<div class="cards three"><div class="panel"><div class="ph"><div class="grow"><h2>نظام الموظفين</h2><p>تحكم سريع بالحالة العامة مع بقاء إعداد الموظفين المحددين محفوظًا.</p></div></div><div class="row"><div class="rowmain"><div class="rowtitle">الحالة</div><div class="sub">${esc(S.employeeSite.mode||'open')}</div></div><span class="tag ${S.employeeSite.mode==='open'?'ok':'bad'}">${S.employeeSite.mode==='open'?'مفتوح':'غير مفتوح'}</span></div><div class="cards two" style="margin-top:10px"><button class="btn ok" data-feature="employee|open">فتح للجميع</button><button class="btn bad" data-feature="employee|closed">إيقاف الموظفين</button></div><div class="warn" style="margin-top:10px">للصلاحيات الانتقائية للموظفين استخدم لوحة الإدارة الحالية؛ هذا الزر لا يمسح قائمتها.</div></div><div class="panel"><div class="ph"><div class="grow"><h2>بوابة العملاء</h2><p>تشغيل أو إيقاف البوابة كاملة.</p></div></div><div class="row"><div class="rowmain"><div class="rowtitle">الحالة</div></div><span class="tag ${S.customerPortal.enabled!==false?'ok':'bad'}">${S.customerPortal.enabled!==false?'مفعلة':'متوقفة'}</span></div><button class="btn ${S.customerPortal.enabled!==false?'bad':'ok'}" style="width:100%;margin-top:10px" data-feature="customer|${S.customerPortal.enabled!==false?'false':'true'}">${S.customerPortal.enabled!==false?'إيقاف البوابة':'تشغيل البوابة'}</button></div><div class="panel"><div class="ph"><div class="grow"><h2>الجرد</h2><p>Feature Flag للجرد دون حذف الحملات أو النتائج السابقة.</p></div></div><div class="row"><div class="rowmain"><div class="rowtitle">الحالة</div></div><span class="tag ${S.stocktake.enabled?'ok':''}">${S.stocktake.enabled?'مفعّل':'متوقف'}</span></div><button class="btn ${S.stocktake.enabled?'bad':'ok'}" style="width:100%;margin-top:10px" data-feature="stocktake|${S.stocktake.enabled?'false':'true'}">${S.stocktake.enabled?'إيقاف الجرد':'تفعيل الجرد'}</button></div></div><div class="warn" style="margin-top:12px">أي تغيير في هذه الشاشة يسجل تلقائيًا في سجل التدقيق باسم الإدارة ووقت التغيير.</div>`}
function auditHtml(){const rows=S.audit.filter(x=>!S.q||norm((x.action||'')+' '+JSON.stringify(x.data||{})).includes(norm(S.q)));return `<div class="panel"><div class="ph"><div class="grow"><h2>سجل التدقيق الإداري</h2><p>تغييرات الصلاحيات والتحكم والإجراءات الحساسة.</p></div></div><input id="pq" class="search" placeholder="ابحث في سجل التدقيق" value="${esc(S.q)}"><div style="margin-top:12px">${rows.slice(0,300).map(x=>`<div class="audit"><div class="time">${esc(dt(x.createdAt||x.timestamp))}</div><div><b>${esc(x.action||'إجراء إداري')}</b><p>${esc(JSON.stringify(x.data||{}).slice(0,360))}</p></div></div>`).join('')||'<div class="empty">لا توجد سجلات.</div>'}</div></div>`}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.q='';render()});$$('[data-goto]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.goto;render()});$('#scope')?.addEventListener('change',e=>{S.scope=e.target.value;S.q='';render()});$('#pq')?.addEventListener('input',e=>{S.q=e.target.value;render()});$$('[data-default]').forEach(b=>b.onclick=()=>toggleDefault(S.scope,b.dataset.default));$$('[data-personperm]').forEach(b=>b.onclick=()=>openPermissionPerson(S.scope,b.dataset.personperm));$$('[data-profile]').forEach(b=>b.onclick=()=>{const [scope,id]=b.dataset.profile.split('|');openProfile(scope,id)});$$('[data-feature]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.feature.split('|');featureSet(k,v==='true'?true:v==='false'?false:v)});}
function openDrawer(title,sub,html){$('#drawerTitle').textContent=title;$('#drawerSub').textContent=sub||'';$('#drawerBody').innerHTML=html;$('#drawerbg').classList.add('on')}
function closeDrawer(){$('#drawerbg').classList.remove('on')}$('#drawerClose').onclick=closeDrawer;$('#drawerbg').onclick=e=>{if(e.target.id==='drawerbg')closeDrawer()};
function openPermissionPerson(scope,id){const p=people(scope).find(x=>x.id===id);if(!p)return;const ov=overrideMap(scope)[id]||{},labels=PERMS[scope];openDrawer(`صلاحيات ${p.name}`,scope==='employee'?'موظف':'عميل',`<div class="templatebar">${Object.entries(TEMPLATES[scope]).map(([k,t])=>`<button class="btn" data-tpl="${k}">${esc(t.label)}</button>`).join('')}<button class="btn bad" id="clearOv">مسح الاستثناءات</button></div><div class="panel" style="margin-top:10px"><div class="permgrid">${Object.entries(labels).map(([k,v])=>{const val=Object.prototype.hasOwnProperty.call(ov,k)?ov[k]:null;return `<div class="perm"><div><b>${esc(v)}</b><div class="sub">الفعلي الآن: ${effective(scope,id)[k]!==false?'مسموح':'ممنوع'}</div></div><div class="tri"><button class="inherit ${val===null?'on':''}" data-tri="${k}|inherit">وراثة</button><button class="allow ${val===true?'on':''}" data-tri="${k}|allow">سماح</button><button class="deny ${val===false?'on':''}" data-tri="${k}|deny">منع</button></div></div>`}).join('')}</div></div>`);$$('[data-tri]').forEach(b=>b.onclick=async()=>{const [k,v]=b.dataset.tri.split('|');await setOverride(scope,id,k,v==='inherit'?null:v==='allow');openPermissionPerson(scope,id)});$$('[data-tpl]').forEach(b=>b.onclick=async()=>{await applyTemplate(scope,id,b.dataset.tpl);openPermissionPerson(scope,id)});$('#clearOv').onclick=async()=>{await clearOverride(scope,id);openPermissionPerson(scope,id)}}
function openProfile(scope,id){const p=people(scope).find(x=>x.id===id);if(!p)return;const acts=personActivity(scope,id,p.name),cart=personCart(scope,id,p.name),sessions=personSessions(scope,id,p.name),orders=personOrders(scope,id,p.name),msgs=scope==='employee'?S.messages.filter(m=>String(m.employeeId||'')===id||norm(m.employeeName)===norm(p.name)).slice(0,30):[],devices=scope==='customer'?S.customerDevices.filter(d=>String(d.customerUid||d.visitorId||'')===id).slice(0,30):[];const cartItems=cart?.itemsCurrent?.length?cart.itemsCurrent:(cart?.lastNonEmptyItems||[]);openDrawer(p.name,`${scope==='employee'?'موظف':'عميل'} · ${p.company||id}`,`<div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><small>النشاط</small><b>${acts.length}</b></div><div class="stat"><small>الطلبات</small><b>${orders.length}</b></div><div class="stat"><small>الجلسات</small><b>${sessions.length}</b></div><div class="stat"><small>السلة</small><b>${cartItems.length}</b></div></div>${cartItems.length?`<div class="panel" style="margin-top:10px"><div class="ph"><div><h2>السلة الحالية / الأخيرة</h2><p>آخر Snapshot متاح في مركز القيادة.</p></div></div><div class="list">${cartItems.slice(0,40).map(i=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(i.name||i.id||i.cleanId)}</div><div class="sub">${esc(i.id||i.cleanId||'')} · الكمية ${Number(i.qty||0)}</div></div></div>`).join('')}</div></div>`:''}<div class="split" style="margin-top:10px"><div class="panel"><div class="ph"><div><h2>آخر النشاطات</h2><p>Timeline موحد من V44.</p></div></div>${acts.slice(0,35).map(a=>`<div class="audit"><div class="time">${esc(dt(a.createdAt))}</div><div><b>${esc(a.label||a.action||'نشاط')}</b><p>${esc(a.action||'')}</p></div></div>`).join('')||'<div class="empty">لا يوجد نشاط بعد.</div>'}</div><div class="panel"><div class="ph"><div><h2>الجلسات والأجهزة</h2><p>آخر ما سجله النظام لهذا الحساب.</p></div></div>${sessions.slice(0,15).map(s=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(s.device?.platform||s.platform||s.browser||'جهاز')}</div><div class="sub">${esc(dt(s.lastActive||s.updatedAt))} · ${online(s.lastActive||s.updatedAt)?'متصل':'غير متصل'}</div></div></div>`).join('')||'<div class="empty">لا توجد جلسات.</div>'}${devices.length?`<div class="sub" style="margin:10px 0 4px">أجهزة العميل: ${devices.length}</div>${devices.slice(0,10).map(d=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(d.platform||'جهاز')}</div><div class="sub">${esc(dt(d.lastSeen||d.updatedAt))} · ${esc(d.status||'active')}</div></div></div>`).join('')}`:''}${msgs.length?`<div class="sub" style="margin:12px 0 4px">الرسائل المرسلة: ${msgs.length}</div>${msgs.slice(0,8).map(m=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(m.title||'رسالة')}</div><div class="sub">${esc(m.message||'')}<br>ظهرت ${Number(m.shownCount||0)}/${Number(m.maxShows||1)}</div></div></div>`).join('')}`:''}</div></div>`)}
window.addEventListener('beforeunload',()=>unsubs.forEach(u=>{try{u()}catch{}}));boot();
