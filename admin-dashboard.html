const hashCode=str=>{let h1=0x811c9dc5,h2=0xc2b2ae35;const s=CODE_SALT+String(str);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,0x01000193)>>>0;h2=Math.imul(h2^c,0x85ebca6b)>>>0}return h1.toString(36)+'-'+h2.toString(36)};

const tsMs=v=>{try{if(!v)return 0;if(v.toMillis)return v.toMillis();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0}catch{return 0}};

async function getRows(name,limit=750){try{const s=await db.collection(name).limit(limit).get();return s.docs.map(d=>({id:d.id,...d.data(),__collection:name}))}catch(e){console.warn('[Dashboard]',name,e);return[]}}

  useEffect(()=>setMessage(control.maintenanceMessage||DEFAULT_PORTAL_CONTROL.maintenanceMessage),[control.maintenanceMessage]);

  const [area,setArea]=useState('home');
  const [customerTab,setCustomerTab]=useState('accounts');

  useEffect(()=>{window.__adminSetDetail=setDetail;return()=>{delete window.__adminSetDetail}},[]);

  const saveControl=async patch=>{

    try{await db.collection(CONTROL_COLLECTION).doc(CONTROL_DOC).set({...patch,updatedBy:'مهند',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await adminAudit('customer_portal_control_changed',patch)}catch(e){alert('تعذر حفظ الإعداد. تحقق من Firestore Rules والاتصال.')}finally{setBusy(false)}
  };
  const updateCustomerStatus=async(c,status)=>{if(!confirm(status==='suspended'?`إيقاف حساب ${c.company||c.name||c.phone}؟`:`إعادة تفعيل الحساب؟`))return;setBusy(true);try{await db.collection('customers').doc(c.id).update({status,statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),statusUpdatedBy:'مهند'});await adminAudit('customer_status_changed',{customerId:c.id,status,company:c.company||'',phone:c.phone||''});setData(d=>({...d,customers:d.customers.map(x=>x.id===c.id?{...x,status}:x)}))}finally{setBusy(false)}};

  const q=normalizeText(search);
  const match=row=>!q||normalizeText(JSON.stringify(row)).includes(q);
  const customers=data.customers||[], cSessions=data.customerSessions||[], cLogins=data.customerLogins||[], cActivity=data.customerActivity||[], cOrders=data.customerOrders||[], cDrafts=data.customerDrafts||[];
  const eUsers=data.employeeUsers||[], eSessions=data.employeeSessions||[], eLogins=data.employeeLogins||[], access=data.access||[], searches=data.search||[], eOrders=data.employeeOrders||[], eDrafts=data.employeeDrafts||[], categoryAudit=data.categoryAudit||[];
  const customerOnline=new Set(cSessions.filter(s=>online(s.lastActive||s.updatedAt)).map(s=>s.customerUid));
  const employeeOnline=new Set(eSessions.filter(s=>online(s.lastActive)).map(s=>normalizeText(s.name)));
  const companies=useMemo(()=>{const map=new Map();customers.forEach(c=>{const name=c.company||'بدون اسم شركة';if(!map.has(name))map.set(name,{name,customers:[],orders:[],drafts:[],activity:[],sessions:[]});map.get(name).customers.push(c)});cOrders.forEach(o=>{const name=o.customer?.company||customers.find(c=>c.id===o.customerUid)?.company||'بدون اسم شركة';if(!map.has(name))map.set(name,{name,customers:[],orders:[],drafts:[],activity:[],sessions:[]});map.get(name).orders.push(o)});cDrafts.forEach(o=>{const name=o.customer?.company||customers.find(c=>c.id===o.customerUid)?.company||'بدون اسم شركة';if(!map.has(name))map.set(name,{name,customers:[],orders:[],drafts:[],activity:[],sessions:[]});map.get(name).drafts.push(o)});cActivity.forEach(a=>{const c=customers.find(x=>x.id===a.customerUid);const name=c?.company||'بدون اسم شركة';if(!map.has(name))map.set(name,{name,customers:[],orders:[],drafts:[],activity:[],sessions:[]});map.get(name).activity.push(a)});cSessions.forEach(a=>{const c=customers.find(x=>x.id===a.customerUid);const name=c?.company||'بدون اسم شركة';if(!map.has(name))map.set(name,{name,customers:[],orders:[],drafts:[],activity:[],sessions:[]});map.get(name).sessions.push(a)});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'))},[customers,cOrders,cDrafts,cActivity,cSessions]);
  const employeeProfiles=useMemo(()=>eUsers.map(u=>{const n=normalizeText(u.name||u.id);return{...u,sessions:eSessions.filter(x=>normalizeText(x.name)===n),logins:eLogins.filter(x=>normalizeText(x.name)===n),searches:searches.filter(x=>normalizeText(x.name)===n),orders:eOrders.filter(x=>normalizeText(x.repName||x.employeeName||x.name)===n),drafts:eDrafts.filter(x=>normalizeText(x.repName||x.employeeName||x.name)===n)}}),[eUsers,eSessions,eLogins,searches,eOrders,eDrafts]);

  const Header=()=> <><header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-border safe-top"><div className="max-w-[1380px] mx-auto px-4 py-3 flex items-center justify-between gap-3"><div className="flex items-center gap-3 min-w-0"><button onClick={()=>area==='home'?location.href='./index.html':setArea('home')} className="w-10 h-10 rounded-xl border border-border bg-white flex items-center justify-center press" title={area==='home'?'العودة للنظام':'الرئيسية'}><Icon name={area==='home'?'back':'grid'} className="w-4 h-4"/></button><div className="min-w-0"><b className="text-sm sm:text-base block truncate">لوحة التحكم الإدارية</b><div className="text-[10px] text-muted truncate">بيت الأواني الطيبة · حساب مهند</div></div></div><div className="flex items-center gap-2"><button onClick={load} className="w-10 h-10 rounded-xl border border-border bg-white flex items-center justify-center press" title="تحديث"><Icon name="refresh" className={`w-4 h-4 ${loading?'animate-spin':''}`}/></button><a href="./index.html" className="hidden sm:flex h-10 px-3 rounded-xl border border-border bg-white items-center gap-2 text-xs font-bold text-secondary"><Icon name="users" className="w-4 h-4"/>نظام الموظفين</a></div></div></header></>;

  const SearchBar=()=> <div className="relative"><Icon name="search" className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-muted"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث في جميع البيانات..." className="w-full h-11 pr-10 pl-3 rounded-xl border border-border bg-white outline-none focus:border-accent text-sm"/></div>;

  const Home=()=> <div className="grid gap-5 fade"><section className="bg-white border border-border rounded-[22px] shadow-card p-5 sm:p-7"><div className="flex flex-col lg:flex-row lg:items-center justify-between gap-5"><div><div className="text-[11px] text-accent font-bold">الإدارة العليا</div><h1 className="text-2xl sm:text-3xl font-bold mt-1">لوحة التحكم</h1><p className="text-sm text-secondary mt-2 max-w-2xl leading-7">نقطة إدارة موحدة، مع فصل كامل بين بيانات الموظفين وبيانات العملاء. اختر القسم الذي تريد العمل عليه.</p></div><div className="flex items-center gap-2"><Pill tone={control.enabled?'ok':'bad'}>بوابة العملاء {control.enabled?'تعمل':'متوقفة'}</Pill></div></div></section><div className="grid lg:grid-cols-2 gap-4"><button onClick={()=>{setSearch('');setArea('employees')}} className="text-right bg-white border border-border rounded-[22px] shadow-card p-5 sm:p-6 hover:border-[#D6D3D1] press"><div className="flex items-start justify-between gap-4"><div className="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center"><Icon name="users" className="w-6 h-6"/></div><Pill tone={employeeOnline.size?'ok':'neutral'}>{employeeOnline.size} متصل</Pill></div><h2 className="text-xl font-bold mt-5">إدارة الموظفين</h2><p className="text-sm text-secondary mt-2 leading-6">الحسابات، جلسات العمل، دخول الموظفين، صور التحقق، البحث، الطلبات، المسودات وسجل التصنيفات.</p><div className="grid grid-cols-3 gap-2 mt-5"><Mini label="الموظفون" value={eUsers.length}/><Mini label="طلبات معلقة" value={access.filter(x=>x.status==='pending').length}/><Mini label="الجلسات" value={eSessions.length}/></div><div className="mt-5 flex items-center gap-2 text-xs font-bold text-accent">فتح إدارة الموظفين <Icon name="arrow" className="w-4 h-4"/></div></button><button onClick={()=>{setSearch('');setArea('customers')}} className="text-right bg-white border border-border rounded-[22px] shadow-card p-5 sm:p-6 hover:border-[#D6D3D1] press"><div className="flex items-start justify-between gap-4"><div className="w-12 h-12 rounded-2xl bg-accentSoft text-accent flex items-center justify-center"><Icon name="building" className="w-6 h-6"/></div><Pill tone={control.enabled?'ok':'bad'}>{control.enabled?'متاحة للعملاء':'موقوفة'}</Pill></div><h2 className="text-xl font-bold mt-5">إدارة العملاء</h2><p className="text-sm text-secondary mt-2 leading-6">الشركات، حسابات العملاء، الفروع، الجلسات، النشاط، الطلبات، المسودات والتحكم الكامل في تشغيل البوابة.</p><div className="grid grid-cols-3 gap-2 mt-5"><Mini label="الشركات" value={companies.length}/><Mini label="العملاء" value={customers.length}/><Mini label="متصل الآن" value={customerOnline.size}/></div><div className="mt-5 flex items-center gap-2 text-xs font-bold text-accent">فتح إدارة العملاء <Icon name="arrow" className="w-4 h-4"/></div></button></div><PortalControlCard control={control} onSave={saveControl} busy={busy}/></div>;

  const CustomerArea=()=>{
    const tabs=[['accounts','الشركات والعملاء'],['orders','الطلبات والمسودات'],['activity','النشاط'],['sessions','الجلسات والدخول'],['raw','البيانات الخام']];
    return <div className="grid gap-4 fade"><section className="bg-white border border-border rounded-2xl shadow-card p-4 sm:p-5"><div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div><div className="text-[11px] text-accent font-bold">قسم مستقل</div><h1 className="text-xl sm:text-2xl font-bold mt-1">إدارة العملاء</h1><p className="text-xs text-secondary mt-1">كل ما يخص الشركات والعملاء فقط، بدون خلط بيانات الموظفين.</p></div><div className="flex items-center gap-2"><Pill tone={control.enabled?'ok':'bad'}>{control.enabled?'البوابة تعمل':'البوابة متوقفة'}</Pill><button onClick={()=>{localStorage.setItem(PREVIEW_KEY,'admin-preview');window.open('./customer.html','_blank')}} className="h-9 px-3 rounded-xl border border-border text-xs font-bold">معاينة</button></div></div></section><PortalControlCard control={control} onSave={saveControl} busy={busy}/><div className="grid grid-cols-2 sm:grid-cols-4 gap-3"><KPI label="العملاء" value={customers.length} icon="users"/><KPI label="الشركات" value={companies.length} icon="building"/><KPI label="المتصلون الآن" value={customerOnline.size} tone="ok" icon="activity"/><KPI label="الطلبات" value={cOrders.length} icon="cart"/></div><SearchBar/><Tabs items={tabs} active={customerTab} onChange={setCustomerTab}/>{customerTab==='accounts'&&<CustomerAccounts/>}{customerTab==='orders'&&<CustomerOrders/>}{customerTab==='activity'&&<CustomerActivity/>}{customerTab==='sessions'&&<CustomerSessions/>}{customerTab==='raw'&&<RawCollections names={['customers','customer_sessions','customer_login_logs','customer_activity_logs','customer_orders','customer_drafts']}/>}</div>
  };

  function CustomerAccounts(){return <div className="grid gap-3">{companies.filter(c=>match(c)).map(co=><section key={co.name} className="bg-white border border-border rounded-2xl shadow-card overflow-hidden"><div className="p-4 border-b border-border flex items-start justify-between gap-3"><div className="flex items-center gap-3 min-w-0"><div className="w-10 h-10 rounded-xl bg-accentSoft text-accent flex items-center justify-center shrink-0"><Icon name="building" className="w-5 h-5"/></div><div className="min-w-0"><b className="text-sm block truncate">{co.name}</b><div className="text-[10px] text-muted mt-1">{co.customers.length} حساب · {co.orders.length} طلب · {co.drafts.length} مسودة · {co.activity.length} حركة</div></div></div><Pill tone={co.customers.some(c=>c.status==='suspended')?'bad':'ok'}>{co.customers.some(c=>c.status==='suspended')?'يوجد حساب موقوف':'نشطة'}</Pill></div><div className="p-4 grid md:grid-cols-2 xl:grid-cols-3 gap-3">{co.customers.map(c=><div key={c.id} className="border border-border rounded-xl p-3"><div className="flex justify-between gap-3"><div className="min-w-0"><b className="text-sm block truncate">{c.name||'لم يحفظ الاسم بعد'}</b><div className="text-[11px] text-secondary ltr text-right">{c.phone||'—'}</div></div><Pill tone={c.status==='suspended'?'bad':'ok'}>{c.status==='suspended'?'موقوف':'نشط'}</Pill></div><div className="grid grid-cols-2 gap-2 mt-3"><Mini label="الفروع" value={c.branches?.length||0}/><Mini label="آخر دخول" value={ago(c.lastLoginAt)}/></div><div className="grid grid-cols-2 gap-2 mt-3"><button onClick={()=>setDetail(c)} className="h-9 rounded-lg border border-border text-xs font-bold">كل التفاصيل</button><button disabled={busy} onClick={()=>updateCustomerStatus(c,c.status==='suspended'?'active':'suspended')} className={`h-9 rounded-lg text-xs font-bold ${c.status==='suspended'?'bg-successSoft text-success':'bg-dangerSoft text-danger'}`}>{c.status==='suspended'?'إعادة التفعيل':'إيقاف الحساب'}</button></div></div>)}</div></section>)}{companies.filter(c=>match(c)).length===0&&<Empty/>}</div>}
  function CustomerOrders(){const rows=[...cOrders.map(x=>({...x,__kind:'طلب'})),...cDrafts.map(x=>({...x,__kind:'مسودة'}))].filter(match).sort((a,b)=>tsMs(b.createdAt||b.updatedAt)-tsMs(a.createdAt||a.updatedAt));return <ListPanel title={`طلبات ومسودات العملاء (${rows.length})`} rows={rows} primary={r=>`${r.__kind} ${r.orderNo||r.draftNo||r.id.slice(0,8)}`} secondary={r=>`${r.customer?.company||customers.find(c=>c.id===r.customerUid)?.company||'—'} · ${r.items?.length||0} صنف · ${num(r.totalCartons)} كرتون`} time={r=>r.createdAt||r.updatedAt}/>}
  function CustomerActivity(){const rows=cActivity.filter(match).sort((a,b)=>tsMs(b.createdAt)-tsMs(a.createdAt));return <ListPanel title={`سجل نشاط العملاء (${rows.length})`} rows={rows} primary={r=>eventName(r.type)} secondary={r=>`${customers.find(c=>c.id===r.customerUid)?.company||r.company||'—'} · ${r.label||deviceLabel(r.userAgent)}`} time={r=>r.createdAt}/>}
  function CustomerSessions(){const rows=[...cSessions.map(x=>({...x,__kind:'جلسة'})),...cLogins.map(x=>({...x,__kind:'دخول'}))].filter(match).sort((a,b)=>tsMs(b.lastActive||b.createdAt)-tsMs(a.lastActive||a.createdAt));return <ListPanel title={`الجلسات وتسجيلات الدخول (${rows.length})`} rows={rows} primary={r=>r.__kind==='جلسة'?(online(r.lastActive)?'جلسة نشطة الآن':'جلسة عميل'):loginName(r.type)} secondary={r=>`${r.company||customers.find(c=>c.id===r.customerUid)?.company||'—'} · ${deviceLabel(r.userAgent||r.device?.userAgent)}`} time={r=>r.lastActive||r.createdAt}/>}

  const EmployeeArea=()=>{
    const tabs=[['accounts','الموظفون'],['access','الدخول والتحقق'],['activity','النشاط'],['orders','الطلبات والمسودات'],['audit','سجل التصنيفات'],['raw','البيانات الخام']];
    return <div className="grid gap-4 fade"><section className="bg-white border border-border rounded-2xl shadow-card p-4 sm:p-5"><div><div className="text-[11px] text-accent font-bold">قسم مستقل</div><h1 className="text-xl sm:text-2xl font-bold mt-1">إدارة الموظفين</h1><p className="text-xs text-secondary mt-1">بيانات الموظفين وتشغيلهم فقط، منفصلة بالكامل عن حسابات العملاء.</p></div></section><div className="grid grid-cols-2 sm:grid-cols-4 gap-3"><KPI label="الموظفون" value={eUsers.length} icon="users"/><KPI label="متصل الآن" value={employeeOnline.size} tone="ok" icon="activity"/><KPI label="طلبات دخول معلقة" value={access.filter(x=>x.status==='pending').length} tone={access.some(x=>x.status==='pending')?'bad':'neutral'} icon="camera"/><KPI label="جلسات العمل" value={eSessions.length} icon="clock"/></div><SearchBar/><Tabs items={tabs} active={employeeTab} onChange={setEmployeeTab}/>{employeeTab==='accounts'&&<EmployeeAccounts/>}{employeeTab==='access'&&<EmployeeAccess/>}{employeeTab==='activity'&&<EmployeeActivity/>}{employeeTab==='orders'&&<EmployeeOrders/>}{employeeTab==='audit'&&<ListPanel title={`سجل تعديلات الأقسام (${categoryAudit.filter(match).length})`} rows={categoryAudit.filter(match).sort((a,b)=>tsMs(b.createdAt||b.timestamp)-tsMs(a.createdAt||a.timestamp))} primary={r=>r.action||'تعديل قسم'} secondary={r=>`${r.cleanId||r.productId||'—'} · ${r.fromCategory||'—'} ← ${r.toCategory||r.category||'—'}`} time={r=>r.createdAt||r.timestamp}/>} {employeeTab==='raw'&&<RawCollections names={['users','site_sessions','login_logs','access_requests','search_logs','orders','drafts','category_audit_logs']}/>}</div>
  };
  function EmployeeAccounts(){const rows=employeeProfiles.filter(match);return <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{rows.map(e=><div key={e.id||e.name} className="bg-white border border-border rounded-2xl p-4 shadow-card"><div className="flex justify-between gap-2"><div className="min-w-0"><b className="text-sm block truncate">{e.name||e.id}</b><div className="text-[10px] text-muted mt-1">{e.logins.length} دخول · {e.searches.length} بحث</div></div><Pill tone={employeeOnline.has(normalizeText(e.name||e.id))?'ok':'neutral'}>{employeeOnline.has(normalizeText(e.name||e.id))?'متصل':'غير متصل'}</Pill></div><div className="grid grid-cols-3 gap-2 mt-4"><Mini label="الجلسات" value={e.sessions.length}/><Mini label="الطلبات" value={e.orders.length}/><Mini label="المسودات" value={e.drafts.length}/></div><button onClick={()=>setDetail({...e,__collection:'employee_profile'})} className="mt-3 w-full h-9 rounded-lg border border-border text-xs font-bold">الملف التفصيلي</button></div>)}{rows.length===0&&<Empty/>}</div>}
  function EmployeeAccess(){const rows=access.filter(match).sort((a,b)=>tsMs(b.timestamp)-tsMs(a.timestamp));return <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{rows.map(r=><div key={r.id} className="bg-white border border-border rounded-2xl overflow-hidden shadow-card">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full h-48 object-cover bg-surface"/>:<div className="h-32 bg-surface flex items-center justify-center text-muted"><Icon name="camera"/></div>}<div className="p-3"><div className="flex justify-between gap-2"><b className="text-sm">{r.name||'—'}</b><Pill tone={r.status==='approved'?'ok':r.status==='rejected'?'bad':'info'}>{r.status==='approved'?'مقبول':r.status==='rejected'?'مرفوض':'معلق'}</Pill></div><div className="text-[10px] text-muted mt-1">{dateTime(r.timestamp)}</div><div className="grid grid-cols-2 gap-2 mt-3"><button onClick={()=>setDetail(r)} className="h-9 rounded-lg border border-border text-xs font-bold">التفاصيل</button>{r.status==='pending'?<div className="grid grid-cols-2 gap-1"><button disabled={busy} onClick={()=>accessDecision(r,'approved')} className="h-9 rounded-lg bg-successSoft text-success text-[10px] font-bold">قبول</button><button disabled={busy} onClick={()=>accessDecision(r,'rejected')} className="h-9 rounded-lg bg-dangerSoft text-danger text-[10px] font-bold">رفض</button></div>:<span/>}</div></div></div>)}{rows.length===0&&<Empty/>}</div>}
  function EmployeeActivity(){const rows=[...eLogins.map(x=>({...x,__kind:'تسجيل دخول',__time:x.time})),...searches.map(x=>({...x,__kind:'عملية بحث',__time:x.time})),...eSessions.map(x=>({...x,__kind:'جلسة عمل',__time:x.lastActive}))].filter(match).sort((a,b)=>tsMs(b.__time)-tsMs(a.__time));return <ListPanel title={`نشاط الموظفين (${rows.length})`} rows={rows} primary={r=>r.__kind} secondary={r=>`${r.name||'—'}${r.rawQuery?' · '+r.rawQuery:''}${r.warehouse?' · '+r.warehouse:''}`} time={r=>r.__time}/>}
  function EmployeeOrders(){const rows=[...eOrders.map(x=>({...x,__kind:'طلب'})),...eDrafts.map(x=>({...x,__kind:'مسودة'}))].filter(match).sort((a,b)=>tsMs(b.timestamp||b.updatedAt||b.createdAt)-tsMs(a.timestamp||a.updatedAt||a.createdAt));return <ListPanel title={`طلبات ومسودات الموظفين (${rows.length})`} rows={rows} primary={r=>`${r.__kind} ${r.invoiceNo||r.orderNo||r.name||r.id.slice(0,8)}`} secondary={r=>`${r.repName||r.employeeName||r.name||'—'} · ${r.items?.length||0} صنف`} time={r=>r.timestamp||r.updatedAt||r.createdAt}/>}

  function RawCollections({names}){const map={customers,cSessions,cLogins,cActivity,cOrders,cDrafts,eUsers,eSessions,eLogins,access,searches,eOrders,eDrafts,categoryAudit};const alias={customers:'customers',customer_sessions:'cSessions',customer_login_logs:'cLogins',customer_activity_logs:'cActivity',customer_orders:'cOrders',customer_drafts:'cDrafts',users:'eUsers',site_sessions:'eSessions',login_logs:'eLogins',access_requests:'access',search_logs:'searches',orders:'eOrders',drafts:'eDrafts',category_audit_logs:'categoryAudit'};return <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{names.map(name=>{const rows=map[alias[name]]||[];return <button key={name} onClick={()=>setDetail({collection:name,count:rows.length,latest:rows.slice(0,30),__collection:'collection_summary'})} className="bg-white border border-border rounded-2xl p-4 shadow-card text-right press"><div className="text-[10px] text-muted ltr text-right">{name}</div><div className="text-2xl font-bold mt-2">{rows.length}</div><div className="text-xs text-secondary mt-1">فتح عينة من السجلات</div></button>})}</div>}

  if(loading)return <><Header/><div className="min-h-[70vh] flex items-center justify-center"><div className="text-center"><div className="w-9 h-9 border-2 border-border border-t-accent rounded-full animate-spin mx-auto"></div><div className="text-sm font-bold mt-4">جاري تجهيز لوحة التحكم...</div><div className="text-xs text-muted mt-1">تحميل بيانات الإدارة</div></div></div></>;
  return <div className="min-h-screen"><Header/><main className="max-w-[1380px] mx-auto p-4 sm:p-5 lg:p-6">{area==='home'?<Home/>:area==='customers'?<CustomerArea/>:<EmployeeArea/>}</main><DetailDrawer row={detail} onClose={()=>setDetail(null)}/></div>;
}

function Tabs({items,active,onChange}){return <div className="overflow-x-auto no-scrollbar"><div className="inline-flex min-w-full sm:min-w-0 bg-white border border-border rounded-xl p-1 gap-1 shadow-card">{items.map(([id,label])=><button key={id} onClick={()=>onChange(id)} className={`h-9 px-3 rounded-lg text-[11px] font-bold whitespace-nowrap transition-colors ${active===id?'bg-primary text-white':'text-secondary hover:bg-surface'}`}>{label}</button>)}</div></div>}
function Mini({label,value}){return <div className="rounded-xl bg-surface border border-border p-2.5"><div className="text-[9px] text-muted">{label}</div><b className="text-sm block mt-1 truncate">{value}</b></div>}
function Empty(){return <div className="col-span-full py-16 text-center text-xs text-muted bg-white border border-border rounded-2xl">لا توجد بيانات مطابقة.</div>}
function ListPanel({title,rows,primary,secondary,time}){return <section className="bg-white border border-border rounded-2xl shadow-card overflow-hidden"><div className="p-4 border-b border-border"><b className="text-sm">{title}</b></div><div className="divide-y divide-border">{rows.length?rows.slice(0,750).map((r,i)=><button key={r.id||i} onClick={()=>window.__adminSetDetail?window.__adminSetDetail(r):null} className="w-full text-right p-3.5 hover:bg-surface"><div className="flex items-start justify-between gap-3"><div className="min-w-0"><b className="text-xs block truncate">{primary(r)}</b><span className="text-[10px] text-secondary block mt-1 truncate">{secondary(r)}</span></div><span className="text-[10px] text-muted shrink-0">{ago(time(r))}</span></div></button>):<div className="py-14 text-center text-xs text-muted">لا توجد سجلات مطابقة.</div>}</div></section>}

// Bridge صغير لفتح Drawer من ListPanel بدون تمرير setDetail عبر كل مستوى.
function DashboardRoot(){
  const [ok,setOk]=useState(isAdminSession());
  return ok?<AdminWithDetailBridge/>:<AdminGate onPass={()=>setOk(true)}/>;
}
function AdminWithDetailBridge(){
  // AdminApp يملك Drawer داخليًا؛ نستعمل حدث مخصص للعناصر العامة.
