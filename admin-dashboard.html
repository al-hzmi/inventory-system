const toEnglishDigits=s=>String(s??'').replace(/[٠-٩۰-۹]/g,d=>{const a=AR.indexOf(d);return a>-1?String(a):String(FA.indexOf(d))});
const normalizeText=s=>toEnglishDigits(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/\u0640/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const hashCode=str=>{let h1=0x811c9dc5,h2=0xc2b2ae35;const s=CODE_SALT+String(str);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,0x01000193)>>>0;h2=Math.imul(h2^c,0x85ebca6b)>>>0}return h1.toString(36)+'-'+h2.toString(36)};

const tsMs=v=>{try{if(!v)return 0;if(v.toMillis)return v.toMillis();if(v.seconds)return v.seconds*1000;return new Date(v).getTime()||0}catch{return 0}};
const dateTime=v=>{const n=tsMs(v);return n?new Date(n).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'—'};
const ago=v=>{const n=tsMs(v);if(!n)return'—';const m=Math.max(0,Math.floor((Date.now()-n)/60000));if(m<1)return'الآن';if(m<60)return`منذ ${m} د`;const h=Math.floor(m/60);if(h<24)return`منذ ${h} س`;return`منذ ${Math.floor(h/24)} ي`};
const num=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(Number(n)||0);
const online=v=>Date.now()-tsMs(v)<3*60*1000;
const safeString=v=>{if(v==null)return'';if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);try{return JSON.stringify(v)}catch{return String(v)}};
const deviceLabel=ua=>{const s=String(ua||'');if(/iPhone/i.test(s))return'iPhone';if(/iPad/i.test(s))return'iPad';if(/Android/i.test(s))return'Android';if(/Windows/i.test(s))return'Windows';if(/Macintosh/i.test(s))return'Mac';return s?'جهاز آخر':'—'};
const clampText=(s,n=90)=>{s=String(s??'');return s.length>n?s.slice(0,n)+'…':s};

async function getRows(name,limit=750){try{const s=await db.collection(name).limit(limit).get();return s.docs.map(d=>({id:d.id,...d.data(),__collection:name}))}catch(e){console.warn('[Dashboard]',name,e);return[]}}
async function adminAudit(action,data={}){try{await db.collection(COLLECTIONS.adminAudit).add({admin:'مهند',action,data,createdAt:firebase.firestore.FieldValue.serverTimestamp(),userAgent:navigator.userAgent||''})}catch(e){console.warn('[Admin audit]',e)}}

function AdminGate({onPass}){
  const [name,setName]=useState('مهند'),[code,setCode]=useState(''),[error,setError]=useState('');
  const submit=e=>{e.preventDefault();if(normalizeText(name)==='مهند'&&hashCode(toEnglishDigits(code).trim())===ADMIN_HASH){localStorage.setItem(STORAGE_KEYS.NAME,'مهند');localStorage.setItem(STORAGE_KEYS.TOKEN,ADMIN_HASH);onPass();adminAudit('admin_dashboard_login')}else setError('بيانات الإدارة غير صحيحة.')};
  return <div className="min-h-[100dvh] flex items-center justify-center p-4 safe-top safe-bottom"><form onSubmit={submit} className="w-full max-w-[420px] bg-white border border-border rounded-[24px] shadow-card overflow-hidden fade"><div className="p-7 text-center border-b border-border"><div className="w-14 h-14 rounded-2xl bg-primary text-white mx-auto flex items-center justify-center"><Icon name="grid" className="w-7 h-7"/></div><div className="text-[11px] font-bold text-accent mt-4">الإدارة العليا</div><h1 className="text-xl font-bold mt-1">لوحة التحكم</h1><p className="text-sm text-secondary mt-2">وصول إداري موحد للموظفين والعملاء والتشغيل.</p></div><div className="p-5 grid gap-4"><label className="text-xs font-bold">اسم المدير<input value={name} onChange={e=>setName(e.target.value)} className="mt-2 w-full h-12 rounded-xl border border-border px-3 outline-none focus:border-accent bg-white"/></label><label className="text-xs font-bold">رمز الإدارة<input value={code} onChange={e=>setCode(e.target.value)} type="password" className="mt-2 w-full h-12 rounded-xl border border-border px-3 outline-none focus:border-accent bg-white"/></label>{error&&<div className="bg-dangerSoft text-danger p-3 rounded-xl text-xs font-bold">{error}</div>}<button className="h-12 rounded-xl bg-primary text-white font-bold press">دخول إلى لوحة التحكم</button><button type="button" onClick={()=>location.href='./index.html'} className="h-11 rounded-xl border border-border font-bold text-sm text-secondary press">العودة للنظام</button></div></form></div>
}

function DetailDrawer({row,onClose}){
  const [showRaw,setShowRaw]=useState(false);
  if(!row)return null;
  const fields=Object.entries(row).filter(([k])=>!k.startsWith('__'));
  const simple=fields.filter(([,v])=>v==null||typeof v!=='object'||v?.toMillis).slice(0,18);
  const complex=fields.filter(([,v])=>v&&typeof v==='object'&&!v?.toMillis);
  const title=row.company||row.name||row.customer?.company||row.orderNo||row.invoiceNo||row.draftNo||row.id||'تفاصيل';
  const copy=()=>navigator.clipboard?.writeText(JSON.stringify(row,(k,v)=>v?.toDate?v.toDate().toISOString():v,2));
  return <div className="fixed inset-0 z-[120] bg-black/35 flex justify-end" onClick={onClose}><aside className="w-full sm:max-w-[640px] h-full bg-white shadow-lift flex flex-col fade" onClick={e=>e.stopPropagation()}><header className="p-4 border-b border-border flex items-center justify-between gap-3"><div className="min-w-0"><div className="text-[10px] text-muted ltr text-right">{row.__collection||'تفاصيل السجل'}</div><b className="text-base block mt-1 truncate">{title}</b></div><div className="flex gap-2"><button onClick={copy} className="h-10 px-3 rounded-xl border border-border text-[11px] font-bold text-secondary">نسخ JSON</button><button onClick={onClose} className="w-10 h-10 rounded-xl border border-border flex items-center justify-center"><Icon name="x" className="w-4 h-4"/></button></div></header><div className="flex-1 overflow-y-auto p-4 space-y-4">{row.photoDataUrl&&<img src={row.photoDataUrl} className="w-full max-h-[360px] object-contain bg-surface border border-border rounded-2xl"/>}<div className="grid sm:grid-cols-2 gap-2">{simple.map(([k,v])=><div key={k} className="border border-border rounded-xl p-3 bg-white"><div className="text-[9px] font-bold text-muted ltr text-right">{k}</div><div className="text-xs mt-1.5 leading-5 break-words">{v?.toMillis?dateTime(v):safeString(v)||'—'}</div></div>)}</div>{complex.length>0&&<div className="space-y-2"><div className="text-xs font-bold">البيانات المركبة</div>{complex.map(([k,v])=><details key={k} className="border border-border rounded-xl bg-surface"><summary className="p-3 text-xs font-bold cursor-pointer">{k}</summary><pre className="px-3 pb-3 text-[10px] leading-5 whitespace-pre-wrap break-words ltr text-left">{JSON.stringify(v,null,2)}</pre></details>)}</div>}<button onClick={()=>setShowRaw(v=>!v)} className="w-full h-10 rounded-xl border border-border text-xs font-bold">{showRaw?'إخفاء السجل الخام':'عرض السجل الخام بالكامل'}</button>{showRaw&&<pre className="bg-primary text-white rounded-2xl p-4 text-[10px] leading-5 whitespace-pre-wrap break-words ltr text-left">{JSON.stringify(row,(k,v)=>v?.toDate?v.toDate().toISOString():v,2)}</pre>}</div></aside></div>
}

function ListPanel({title,rows,primary,secondary,time,onOpen,icon='activity',limit=80,empty='لا توجد سجلات.'}){return <section className="bg-white border border-border rounded-2xl shadow-card overflow-hidden"><div className="p-4 border-b border-border flex items-center justify-between gap-3"><div className="flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-surface text-secondary flex items-center justify-center"><Icon name={icon} className="w-4 h-4"/></div><b className="text-sm">{title}</b></div><span className="text-[10px] text-muted">{num(rows.length)}</span></div><div className="divide-y divide-border max-h-[620px] overflow-y-auto">{rows.length?rows.slice(0,limit).map((r,i)=><button key={r.id||i} onClick={()=>onOpen(r)} className="w-full text-right p-3.5 hover:bg-surface"><div className="flex items-start justify-between gap-3"><div className="min-w-0"><b className="text-xs block truncate">{primary(r)}</b><span className="text-[10px] text-secondary block mt-1 truncate">{secondary(r)}</span></div><span className="text-[10px] text-muted shrink-0">{ago(time(r))}</span></div></button>):<div className="py-14 text-center text-xs text-muted">{empty}</div>}</div></section>}

ondary press">معاينة بوابة العملاء</button></div></div></section>

  const StateBlock=({icon='shield',title,note})=><div className="py-14 text-center bg-white border border-border rounded-xl"><div className="w-12 h-12 rounded-full bg-successSoft text-success mx-auto flex items-center justify-center"><Icon name={icon} className="w-5 h-5"/></div><b className="text-sm block mt-3">{title}</b>{note&&<div className="text-[11px] text-muted mt-1">{note}</div>}</div>;
  const RecordButton=({row,title,sub,time,status,statusTone='neutral',icon='file'})=><button onClick={()=>setDetail(row)} className="w-full text-right bg-white border border-border rounded-xl p-4 shadow-card hover:bg-surface press"><div className="flex items-start gap-3"><div className="w-9 h-9 rounded-lg bg-surface text-secondary flex items-center justify-center shrink-0"><Icon name={icon} className="w-4 h-4"/></div><div className="min-w-0 flex-1"><div className="flex items-start justify-between gap-2"><b className="text-[13px] truncate">{title}</b>{status&&<Pill tone={statusTone}>{status}</Pill>}</div><div className="text-[10px] text-secondary mt-1 truncate">{sub||'—'}</div>{time&&<div className="text-[9px] text-muted mt-1">{dateTime(time)}</div>}</div><Icon name="eye" className="w-4 h-4 text-muted shrink-0 mt-1"/></div></button>;

  function EmployeePending(){const rows=sortRows(pendingAccess.filter(match),r=>r.timestamp);return <div className="grid gap-3">{rows.length?rows.map(r=><div key={r.id} className="bg-white border border-accent/30 rounded-xl p-4 shadow-card relative overflow-hidden"><div className="absolute top-0 right-0 left-0 h-1 bg-accent"></div><div className="flex justify-between gap-3 mb-3"><div><b className="text-[14px]">{r.name||'—'}</b><div className="text-[10px] text-muted mt-1">{dateTime(r.timestamp)}</div></div><Pill tone="info">بانتظار القرار</Pill></div><div className="rounded-xl overflow-hidden bg-black border border-border relative max-w-[460px] mx-auto">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full aspect-square object-cover"/>:<div className="aspect-square flex items-center justify-center text-white/60"><Icon name="camera" className="w-7 h-7"/></div>}{r.latitude&&r.longitude&&<a href={`https://www.google.com/maps?q=${r.latitude},${r.longitude}`} target="_blank" className="absolute bottom-2 left-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded-lg">عرض الموقع</a>}</div><div className="grid grid-cols-2 gap-2 mt-3"><button disabled={busy} onClick={()=>accessDecision(r,'approved')} className="h-10 rounded-lg bg-success text-white text-[12px] font-bold">اعتماد الدخول</button><button disabled={busy} onClick={()=>accessDecision(r,'rejected')} className="h-10 rounded-lg bg-dangerSoft text-danger text-[12px] font-bold">رفض الدخول</button></div><button onClick={()=>setDetail(r)} className="w-full h-9 mt-2 rounded-lg border border-border text-[11px] font-bold">كل التفاصيل</button></div>):<StateBlock title="لا توجد طلبات دخول معلقة" note="لا يوجد شيء يحتاج قرارك حاليًا."/>}</div>}

  function EmployeeArchive(){const base=access.filter(x=>x.status==='approved'||x.status==='rejected').filter(match).filter(x=>archiveFilter==='all'||x.status===archiveFilter);const rows=sortRows(base,r=>r.reviewedAt||r.timestamp);return <div><div className="flex gap-2 mb-3 overflow-x-auto no-scrollbar"><button onClick={()=>setArchiveFilter('all')} className={`h-8 px-3 rounded-full border text-[10px] font-bold ${archiveFilter==='all'?'bg-primary text-white border-primary':'bg-white border-border'}`}>الكل</button><button onClick={()=>setArchiveFilter('approved')} className={`h-8 px-3 rounded-full border text-[10px] font-bold ${archiveFilter==='approved'?'bg-success text-white border-success':'bg-white border-border'}`}>المقبول</button><button onClick={()=>setArchiveFilter('rejected')} className={`h-8 px-3 rounded-full border text-[10px] font-bold ${archiveFilter==='rejected'?'bg-danger text-white border-danger':'bg-white border-border'}`}>المرفوض</button></div><div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><div key={r.id} className="bg-white border border-border rounded-xl p-3 shadow-card flex gap-3 relative"><div className="w-[88px] h-[88px] rounded-lg overflow-hidden bg-surface shrink-0">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full h-full object-cover"/>:<div className="w-full h-full flex items-center justify-center text-muted"><Icon name="camera" className="w-5 h-5"/></div>}</div><div className="min-w-0 flex-1"><div className="flex justify-between gap-2"><b className="text-[13px] truncate">{r.name||'—'}</b><Pill tone={r.status==='approved'?'ok':'bad'}>{r.status==='approved'?'مقبول':'مرفوض'}</Pill></div><div className="text-[10px] text-muted mt-1">{dateTime(r.reviewedAt||r.timestamp)}</div><div className="flex gap-2 mt-3"><button onClick={()=>setDetail(r)} className="h-8 px-3 rounded-lg border border-border text-[10px] font-bold">التفاصيل</button><button disabled={busy} onClick={()=>deleteAccess(r)} className="w-8 h-8 rounded-lg bg-dangerSoft text-danger flex items-center justify-center" title="حذف"><Icon name="x" className="w-3.5 h-3.5"/></button></div></div></div>):<Empty text="لا توجد صور دخول في هذا التصنيف."/>}</div></div>}

  function EmployeeStaff(){const rows=employeeProfiles.filter(match);return <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{rows.length?rows.map(e=>{const on=employeeOnline.has(normalizeText(e.name||e.id));return <button key={e.id||e.name} onClick={()=>setDetail({...e,__collection:'employee_profile'})} className="bg-white border border-border rounded-xl p-4 shadow-card text-right hover:bg-surface"><div className="flex justify-between gap-3"><div><b className="text-[14px]">{e.name||e.id}</b><div className="text-[10px] text-muted mt-1">آخر دخول: {dateTime(e.lastLogin)}</div></div><Pill tone={on?'ok':'neutral'}>{on?'متصل الآن':'غير متصل'}</Pill></div><div className="grid grid-cols-3 gap-2 mt-4"><Mini label="الجلسات" value={e.sessions.length}/><Mini label="الطلبات" value={e.orders.length}/><Mini label="البحث" value={e.searches.length}/></div><div className="text-[10px] text-accent font-bold mt-4">فتح الملف الكامل ←</div></button>}):<Empty/>}</div>}

  function EmployeeSessions(){const groups={};eSessions.filter(match).forEach(s=>{const n=s.name||'مجهول';if(!groups[n])groups[n]={name:n,sessions:[],minutes:0,lastActive:0};groups[n].sessions.push(s);groups[n].minutes+=Number(s.durationMinutes||0);groups[n].lastActive=Math.max(groups[n].lastActive,tsMs(s.lastActive))});const rows=Object.values(groups).sort((a,b)=>sortOrder==='asc'?a.lastActive-b.lastActive:b.lastActive-a.lastActive);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(g=><button key={g.name} onClick={()=>setDetail({...g,__collection:'employee_sessions_group'})} className="bg-white border border-border rounded-xl p-4 shadow-card text-right"><div className="flex justify-between gap-2"><div><b className="text-[14px]">{g.name}</b><div className="text-[10px] text-muted mt-1">{g.sessions.length} جلسة · {num(g.minutes)} دقيقة</div></div><Pill tone={Date.now()-g.lastActive<180000?'ok':'neutral'}>{Date.now()-g.lastActive<180000?'متصل الآن':'مغادر'}</Pill></div><div className="text-[10px] text-accent font-bold mt-4">عرض سجل الجلسات ←</div></button>):<Empty/>}</div>}

  function EmployeeOrders(){const rows=sortRows(eOrders.filter(match),r=>r.timestamp||r.createdAt);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.invoiceNo||r.orderNo||`طلب ${String(r.id).slice(0,8)}`} sub={`${r.repName||r.employeeName||r.name||'—'} · ${r.customerName||'—'} · ${r.items?.length||0} صنف`} time={r.timestamp||r.createdAt} icon="cart"/>):<Empty/>}</div>}
  function EmployeeDrafts(){const rows=sortRows(eDrafts.filter(match),r=>r.updatedAt||r.timestamp||r.createdAt);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.name||r.draftName||`مسودة ${String(r.id).slice(0,8)}`} sub={`${r.repName||r.employeeName||'—'} · ${r.items?.length||Object.keys(r.cart||{}).length||0} صنف`} time={r.updatedAt||r.timestamp||r.createdAt} icon="file"/>):<Empty/>}</div>}
  function EmployeeSearches(){const rows=sortRows(searches.filter(match),r=>r.time);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.rawQuery||r.query||'عملية بحث'} sub={`${r.name||'—'} · ${r.resultsCount??r.resultCount??'—'} نتيجة`} time={r.time} icon="search"/>):<Empty/>}</div>}
  function EmployeeCategories(){const rows=sortRows(categoryAudit.filter(match),r=>r.createdAt||r.timestamp);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.action||'تعديل قسم'} sub={`${r.cleanId||r.productId||'—'} · ${r.fromCategory||'—'} ← ${r.toCategory||r.category||'—'}`} time={r.createdAt||r.timestamp} icon="history"/>):<Empty/>}</div>}

  function CustomerOverview(){const last=sortRows(cActivity,r=>r.createdAt||r.timestamp).slice(0,10);return <div className="grid gap-3"><div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><KPI label="الشركات" value={companies.length} icon="building"/><KPI label="العملاء" value={customers.length} icon="users"/><KPI label="متصل الآن" value={customerOnline.size} icon="activity" tone="ok"/><KPI label="طلبات اليوم" value={todayCustomerOrders.length} icon="cart"/></div><div className="grid lg:grid-cols-[1fr_.75fr] gap-3"><div className="bg-white border border-border rounded-xl overflow-hidden shadow-card"><div className="p-4 border-b border-border flex justify-between"><b className="text-[13px]">آخر نشاط العملاء</b><span className="text-[10px] text-muted">{cActivity.length} حركة</span></div><div className="divide-y divide-border">{last.length?last.map(r=><button key={r.id} onClick={()=>setDetail(r)} className="w-full p-3 text-right hover:bg-surface"><div className="flex justify-between gap-2"><div><b className="text-[11px]">{eventName(r.type)}</b><div className="text-[9px] text-muted mt-1">{customers.find(c=>c.id===r.customerUid)?.company||r.company||'—'} · {customers.find(c=>c.id===r.customerUid)?.name||r.name||'—'}</div></div><span className="text-[9px] text-muted">{ago(r.createdAt||r.timestamp)}</span></div></button>):<div className="py-10 text-center text-[11px] text-muted">لا يوجد نشاط بعد.</div>}</div></div><PortalControlCard control={control} onSave={saveControl} busy={busy}/></div></div>}

  function CustomerCompanies(){const rows=companies.filter(match);return <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{rows.length?rows.map(c=>{const on=c.customers.filter(x=>customerOnline.has(x.id)).length;return <button key={c.name} onClick={()=>setDetail({...c,__collection:'company_profile'})} className="bg-white border border-border rounded-xl p-4 shadow-card text-right"><div className="flex justify-between gap-3"><div className="w-9 h-9 rounded-lg bg-accentSoft text-accent flex items-center justify-center"><Icon name="building" className="w-4 h-4"/></div><Pill tone={on?'ok':'neutral'}>{on?`${on} متصل`:'غير متصل'}</Pill></div><b className="text-[14px] block mt-4 truncate">{c.name}</b><div className="grid grid-cols-3 gap-2 mt-3"><Mini label="العملاء" value={c.customers.length}/><Mini label="الطلبات" value={c.orders.length}/><Mini label="المسودات" value={c.drafts.length}/></div><div className="text-[10px] text-accent font-bold mt-4">فتح ملف الشركة ←</div></button>}):<Empty/>}</div>}

  function CustomerAccounts(){const rows=sortRows(customers.filter(match),r=>r.lastLoginAt||r.updatedAt||r.createdAt);return <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{rows.length?rows.map(c=>{const on=customerOnline.has(c.id);const suspended=c.status==='suspended';return <div key={c.id} className="bg-white border border-border rounded-xl p-4 shadow-card"><div className="flex justify-between gap-3"><div className="min-w-0"><b className="text-[14px] block truncate">{c.name||'بدون اسم'}</b><div className="text-[10px] text-secondary mt-1 truncate">{c.company||'—'}</div><div className="text-[10px] text-muted mt-1 ltr text-right">{c.phone||'—'}</div></div><Pill tone={suspended?'bad':on?'ok':'neutral'}>{suspended?'موقوف':on?'متصل':'نشط'}</Pill></div><div className="grid grid-cols-2 gap-2 mt-3"><Mini label="الفروع" value={c.branches?.length||0}/><Mini label="آخر دخول" value={ago(c.lastLoginAt)}/></div><div className="grid grid-cols-2 gap-2 mt-3"><button onClick={()=>setDetail(c)} className="h-9 rounded-lg border border-border text-[10px] font-bold">كل التفاصيل</button><button disabled={busy} onClick={()=>updateCustomerStatus(c,suspended?'active':'suspended')} className={`h-9 rounded-lg text-[10px] font-bold ${suspended?'bg-successSoft text-success':'bg-dangerSoft text-danger'}`}>{suspended?'إعادة التفعيل':'إيقاف الحساب'}</button></div></div>}):<Empty/>}</div>}

  function CustomerActivity(){const rows=sortRows(cActivity.filter(match),r=>r.createdAt||r.timestamp);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=>{const c=customers.find(x=>x.id===r.customerUid);return <RecordButton key={r.id} row={r} title={eventName(r.type)} sub={`${c?.company||r.company||'—'} · ${c?.name||r.name||'—'}${r.query?' · '+r.query:''}`} time={r.createdAt||r.timestamp} icon="activity"/>}):<Empty/>}</div>}
  function CustomerOrders(){const rows=sortRows(cOrders.filter(match),r=>r.createdAt||r.timestamp);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.orderNo||r.invoiceNo||`طلب ${String(r.id).slice(0,8)}`} sub={`${r.customer?.company||customers.find(c=>c.id===r.customerUid)?.company||'—'} · ${r.items?.length||0} صنف · ${num(r.totalCartons||r.totalQty||0)} كرتون`} time={r.createdAt||r.timestamp} icon="cart"/>):<Empty/>}</div>}
  function CustomerDrafts(){const rows=sortRows(cDrafts.filter(match),r=>r.updatedAt||r.createdAt||r.timestamp);return <div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=><RecordButton key={r.id} row={r} title={r.draftNo||r.name||`مسودة ${String(r.id).slice(0,8)}`} sub={`${r.customer?.company||customers.find(c=>c.id===r.customerUid)?.company||'—'} · ${r.items?.length||0} صنف`} time={r.updatedAt||r.createdAt||r.timestamp} icon="file"/>):<Empty/>}</div>}
  function CustomerSessions(){const rows=sortRows(cSessions.filter(match),r=>r.lastActive||r.updatedAt||r.startedAt);const logins=sortRows(cLogins.filter(match),r=>r.createdAt||r.timestamp);return <div className="grid gap-4"><div><div className="flex items-center justify-between mb-2"><b className="text-[12px]">الجلسات الحالية والسابقة</b><span className="text-[10px] text-muted">{rows.length} جلسة</span></div><div className="grid md:grid-cols-2 gap-3">{rows.length?rows.map(r=>{const c=customers.find(x=>x.id===r.customerUid);return <RecordButton key={r.id} row={r} title={`${c?.name||r.name||'—'}${online(r.lastActive||r.updatedAt)?' · متصل الآن':''}`} sub={`${c?.company||r.company||'—'} · ${deviceLabel(r.userAgent)} · ${r.platform||'—'}`} time={r.lastActive||r.updatedAt||r.startedAt} status={online(r.lastActive||r.updatedAt)?'متصل':'مغادر'} statusTone={online(r.lastActive||r.updatedAt)?'ok':'neutral'} icon="clock"/>}):<Empty/>}</div></div><div><div className="flex items-center justify-between mb-2"><b className="text-[12px]">سجل عمليات الدخول</b><span className="text-[10px] text-muted">{logins.length} عملية</span></div><div className="grid md:grid-cols-2 gap-3">{logins.length?logins.map(r=>{const c=customers.find(x=>x.id===r.customerUid);return <RecordButton key={r.id} row={r} title={loginName(r.type)} sub={`${c?.company||r.company||'—'} · ${c?.name||r.name||r.phone||'—'} · ${deviceLabel(r.userAgent)}`} time={r.createdAt||r.timestamp} icon="lock"/>}):<Empty text="لا توجد عمليات دخول مسجلة."/>}</div></div></div>}
  function CustomerPortal(){return <div className="max-w-[760px] mx-auto"><PortalControlCard control={control} onSave={saveControl} busy={busy}/></div>}

  function RawCollections({side}){const defs=side==='customers'?[['customers',customers],['customer_sessions',cSessions],['customer_login_logs',cLogins],['customer_activity_logs',cActivity],['customer_orders',cOrders],['customer_drafts',cDrafts],['security_admin_logs',adminLogs]]:[['users',eUsers],['site_sessions',eSessions],['login_logs',eLogins],['access_requests',access],['search_logs',searches],['orders',eOrders],['drafts',eDrafts],['category_audit_logs',categoryAudit],['security_admin_logs',adminLogs]];return <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{defs.map(([name,rows])=><button key={name} onClick={()=>setDetail({collection:name,count:rows.length,latest:rows.slice(0,50),__collection:'collection_summary'})} className="bg-white border border-border rounded-xl p-4 shadow-card text-right"><div className="flex justify-between gap-2"><div className="w-9 h-9 rounded-lg bg-surface text-secondary flex items-center justify-center"><Icon name="database" className="w-4 h-4"/></div><Pill>{rows.length} سجل</Pill></div><div className="text-[10px] text-muted ltr text-right mt-4">{name}</div><b className="text-[13px] block mt-1">فتح البيانات</b></button>)}</div>}

  function ActiveContent(){if(area==='employees'){switch(module){case'access_pending':return <EmployeePending/>;case'access_archive':return <EmployeeArchive/>;case'staff':return <EmployeeStaff/>;case'sessions':return <EmployeeSessions/>;case'orders':return <EmployeeOrders/>;case'drafts':return <EmployeeDrafts/>;case'searches':return <EmployeeSearches/>;case'categories':return <EmployeeCategories/>;case'raw':return <RawCollections side="employees"/>;default:return <EmployeePending/>}}switch(module){case'overview':return <CustomerOverview/>;case'companies':return <CustomerCompanies/>;case'accounts':return <CustomerAccounts/>;case'activity':return <CustomerActivity/>;case'orders':return <CustomerOrders/>;case'drafts':return <CustomerDrafts/>;case'sessions':return <CustomerSessions/>;case'portal':return <CustomerPortal/>;case'raw':return <RawCollections side="customers"/>;default:return <CustomerOverview/>}}

  if(loading)return <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-0 sm:p-4"><div className="w-full max-w-[1080px] h-[100dvh] sm:h-[94vh] bg-white sm:rounded-2xl overflow-hidden shadow-lift flex flex-col"><CommandHeader/><div className="flex-1 p-4 bg-surface"><div className="h-12 rounded-xl skeleton"></div><div className="grid grid-cols-2 gap-3 mt-3"><div className="h-28 rounded-xl skeleton"></div><div className="h-28 rounded-xl skeleton"></div></div><div className="h-72 rounded-xl skeleton mt-3"></div></div></div></div>;

  return <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-0 sm:p-4 safe-top safe-bottom">
    <div className="w-full max-w-[1080px] h-[100dvh] sm:h-[94vh] bg-white sm:rounded-2xl overflow-hidden shadow-lift flex flex-col fade">
      <CommandHeader/>
      {area==='home'?<DomainHome/>:<><TabsBar/><ToolBar/><div className="flex-1 overflow-y-auto p-3 sm:p-4 bg-surface"><ActiveContent/></div></>}
    </div>
    <DetailDrawer row={detail} onClose={()=>setDetail(null)}/>
  </div>;
}

function DashboardRoot(){const [ok,setOk]=useState(isAdminSession());return ok?<AdminApp/>:<AdminGate onPass={()=>setOk(true)}/>}
ReactDOM.createRoot(document.getElementById('root')).render(<DashboardRoot/>);
</script>
</body>
</html>
