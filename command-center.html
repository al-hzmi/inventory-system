<style>
:root{--p:#1c1917;--s:#57534e;--m:#a8a29e;--b:#e7e5e4;--bg:#fafaf9;--w:#fff;--a:#b45309;--as:#fef3c7;--ok:#15803d;--oks:#f0fdf4;--bad:#b91c1c;--bads:#fef2f2;--info:#0369a1;--infos:#f0f9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--p);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;min-height:100dvh;padding-bottom:40px}.top{position:sticky;top:0;z-index:40;background:rgba(250,250,249,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}.topin{height:72px;display:flex;align-items:center;gap:12px;padding:0 18px}.brand{min-width:0;flex:1}.brand b{font-size:18px}.brand span{display:block;font-size:10px;color:var(--s);margin-top:2px}.back{height:40px;padding:0 13px;border:1px solid var(--b);border-radius:12px;background:#fff;font-weight:700}.live{height:34px;padding:0 11px;border-radius:999px;background:var(--oks);color:var(--ok);display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.tabs{display:flex;overflow:auto;scrollbar-width:none;border-top:1px solid #f5f5f4;background:#fff;padding:0 12px}.tabs::-webkit-scrollbar{display:none}.tab{min-width:112px;height:48px;border:0;border-bottom:2px solid transparent;background:#fff;color:var(--s);font-size:11px;font-weight:700;white-space:nowrap}.tab.on{color:var(--a);border-bottom-color:var(--a)}main{padding:14px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.panel{background:#fff;border:1px solid var(--b);border-radius:16px;box-shadow:0 1px 3px rgba(28,25,23,.04)}.stat{padding:13px}.stat small{display:block;color:var(--s);font-size:9px}.stat b{display:block;font-size:22px;margin-top:4px}.stat em{font-style:normal;font-size:9px;color:var(--m)}.panel{padding:14px}.ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}.ph h2{margin:0;font-size:15px}.ph p{margin:2px 0 0;font-size:10px;color:var(--s)}.grow{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{min-width:0;flex:1;height:42px;border:1px solid var(--b);border-radius:11px;background:#fff;padding:0 12px;font-size:13px;outline:none}.search:focus{border-color:var(--a)}.sel{height:42px;border:1px solid var(--b);border-radius:11px;background:#fff;padding:0 10px;font-size:11px}.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chip{height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--b);background:#fff;white-space:nowrap;font-size:10px;font-weight:700;color:var(--s)}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}.list{display:grid;gap:8px}.row{border:1px solid var(--b);border-radius:13px;background:#fff;padding:11px;display:flex;gap:10px;align-items:flex-start}.row.click{cursor:pointer}.avatar{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}.rowmain{min-width:0;flex:1}.rowtitle{font-size:12px;font-weight:700}.sub{font-size:9px;color:var(--s);line-height:1.6;margin-top:2px}.tag{font-size:9px;font-weight:700;border-radius:999px;padding:4px 8px;background:var(--bg);color:var(--s);white-space:nowrap}.tag.ok{background:var(--oks);color:var(--ok)}.tag.bad{background:var(--bads);color:var(--bad)}.tag.info{background:var(--infos);color:var(--info)}.event{display:grid;grid-template-columns:74px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #f5f5f4}.event:last-child{border:0}.time{font-size:9px;color:var(--m);direction:ltr;text-align:left}.event b{font-size:11px}.event p{font-size:10px;color:var(--s);margin:2px 0 0;line-height:1.55}.cart{border:1px solid var(--b);border-radius:14px;background:#fff;padding:12px}.carthead{display:flex;align-items:center;gap:8px}.cartitems{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}.cartitem{display:flex;gap:9px;background:var(--bg);border-radius:11px;padding:8px}.cartitem img{width:52px;height:52px;object-fit:contain;border-radius:9px;background:white;border:1px solid var(--b)}.emptyimg{width:52px;height:52px;border-radius:9px;background:#eeeae7;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--m)}.kv{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:10px;margin-top:4px}.section{display:none}.section.on{display:block}.split{display:grid;gap:12px}.permblock{border:1px solid var(--b);border-radius:14px;padding:12px;background:#fff}.permgrid{display:grid;grid-template-columns:1fr;gap:8px}.perm{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f5f5f4;padding:8px 0}.perm:last-child{border:0}.perm span{flex:1;font-size:11px;font-weight:600}.switch{width:44px;height:25px;border:0;border-radius:999px;background:#d6d3d1;padding:3px;transition:.16s}.switch i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.16s}.switch.on{background:var(--ok)}.switch.on i{transform:translateX(-19px)}.drawerbg{position:fixed;inset:0;background:rgba(28,25,23,.42);z-index:80;display:none;align-items:flex-end;justify-content:center}.drawerbg.on{display:flex}.drawer{width:100%;max-width:640px;max-height:88dvh;background:#fff;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 -20px 60px rgba(0,0,0,.2)}.drawerhead{padding:15px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:9px}.drawerbody{padding:14px;overflow:auto;max-height:calc(88dvh - 66px)}.x{width:38px;height:38px;border:1px solid var(--b);background:#fff;border-radius:11px}.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;background:var(--p);color:#fff;padding:10px 14px;border-radius:12px;font-size:11px;font-weight:700;transition:.18s}.toast.on{opacity:1;transform:translateX(-50%)}.bar{height:7px;background:#eeeae7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.tablewrap{overflow:auto;border:1px solid var(--b);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #f5f5f4;text-align:right;font-size:10px}.table th{background:var(--bg);color:var(--s);font-weight:700}.warn{background:var(--as);color:#92400e;border:1px solid #fde68a;border-radius:12px;padding:10px;font-size:10px;line-height:1.6}
@media(min-width:760px){main{padding:18px}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.split{grid-template-columns:1.15fr .85fr}.permgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cartitems{grid-template-columns:repeat(2,minmax(0,1fr))}.drawerbg{align-items:center;padding:20px}.drawer{border-radius:22px;max-height:86vh}.drawerbody{max-height:calc(86vh - 66px)}}

<body><div id="app" class="app"><div style="padding:80px 20px;text-align:center;color:#78716c">جاري فتح مركز القيادة...</div></div><div id="drawerbg" class="drawerbg"><div class="drawer"><div class="drawerhead"><div class="grow"><b id="drawerTitle">التفاصيل</b><div class="sub" id="drawerSub"></div></div><button id="drawerClose" class="x">×</button></div><div id="drawerBody" class="drawerbody"></div></div></div><div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374'};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const ADMIN_HASH='1jh297-spgf2z';const adminOk=()=>String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH;if(!adminOk()){location.replace('./index.html?employee=1')}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();const QA_RE=/(اختبار|تجربه|تجربة|test|qa|playwright|audit_employee|موظف اختبار|اختبار تقني)/i;const isQa=x=>QA_RE.test(norm(x?.actorName||x?.name||x?.employeeName||x?.customer?.name||x?.id||''));const ms=v=>{try{return v?.toMillis?.()||v?.seconds*1000||new Date(v).getTime()||0}catch{return 0}};const dt=v=>{const n=ms(v);return n?new Date(n).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'};const ago=v=>{const n=ms(v);if(!n)return'—';const d=Math.max(0,Date.now()-n),m=Math.floor(d/60000);if(m<1)return'الآن';if(m<60)return`منذ ${m} د`;const h=Math.floor(m/60);if(h<24)return`منذ ${h} س`;return`منذ ${Math.floor(h/24)} ي`};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(Number(n)||0);const online=v=>Date.now()-ms(v)<180000;const today=v=>{const n=ms(v);if(!n)return false;const d=new Date(n),x=new Date();return d.toDateString()===x.toDateString()};const dayAgo=v=>Date.now()-ms(v)<86400000;
const PERMS={employee:{search:'البحث في المخزون',scanner:'ماسح الباركود',catalog:'المعرض الرقمي',cart:'السلة والفاتورة',drafts:'المسودات',orders:'الطلبات',customerView:'التبديل لواجهة العملاء',stocktake:'الجرد'},customer:{browse:'تصفح المعرض',search:'البحث',categories:'الأقسام',images:'صور الأصناف',cart:'إضافة للسلة وتعديلها',checkout:'اعتماد الطلب',orders:'سجل الطلبات',whatsapp:'الإرسال عبر واتساب',install:'إضافة الموقع كتطبيق'}};const DEFAULTS={employee:Object.fromEntries(Object.keys(PERMS.employee).map(k=>[k,true])),customer:Object.fromEntries(Object.keys(PERMS.customer).map(k=>[k,true]))};
const S={tab:'overview',q:'',actorFilter:'all',actionFilter:'all',presence:[],activity:[],carts:[],employeeSessions:[],searches:[],customerSessions:[],customerOrders:[],employeeOrders:[],employees:[],customers:[],permissions:{employeeDefaults:{...DEFAULTS.employee},customerDefaults:{...DEFAULTS.customer},employeeOverrides:{},customerOverrides:{}},errors:[]};const unsubs=[];
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function safeListen(label,query,cb){try{const u=query.onSnapshot(s=>{const rows=s.docs?s.docs.map(d=>({id:d.id,...d.data()})):[];cb(rows);render()},e=>{S.errors.push(label+': '+e.message);render()});unsubs.push(u)}catch(e){S.errors.push(label+': '+e.message)}}
function bootData(){safeListen('الحضور',db.collection('v44_presence'),r=>S.presence=r.filter(x=>!isQa(x)));safeListen('النشاط',db.collection('v44_activity_logs').orderBy('createdAt','desc').limit(900),r=>S.activity=r.filter(x=>!isQa(x)));safeListen('السلال',db.collection('v44_live_carts'),r=>S.carts=r.filter(x=>!isQa(x)));safeListen('جلسات الموظفين',db.collection('site_sessions').orderBy('lastActive','desc').limit(500),r=>S.employeeSessions=r.filter(x=>!isQa(x)));safeListen('البحث',db.collection('search_logs').orderBy('time','desc').limit(600),r=>S.searches=r.filter(x=>!isQa(x)));safeListen('جلسات العملاء',db.collection('customer_sessions').orderBy('lastActive','desc').limit(500),r=>S.customerSessions=r.filter(x=>!isQa(x)));safeListen('طلبات العملاء',db.collection('customer_orders').orderBy('createdAt','desc').limit(400),r=>S.customerOrders=r.filter(x=>!isQa(x)));safeListen('طلبات الموظفين',db.collection('orders').orderBy('timestamp','desc').limit(400),r=>S.employeeOrders=r.filter(x=>!isQa(x)));safeListen('حسابات الموظفين',db.collection('employee_accounts'),r=>S.employees=r.filter(x=>!isQa(x)));safeListen('العملاء',db.collection('customers'),r=>S.customers=r.filter(x=>!isQa(x)));const u=db.collection('system_controls').doc('permissions_v44').onSnapshot(d=>{S.permissions={employeeDefaults:{...DEFAULTS.employee,...(d.data()?.employeeDefaults||{})},customerDefaults:{...DEFAULTS.customer,...(d.data()?.customerDefaults||{})},employeeOverrides:d.data()?.employeeOverrides||{},customerOverrides:d.data()?.customerOverrides||{},updatedAt:d.data()?.updatedAt};render()},e=>{S.errors.push('الصلاحيات: '+e.message);render()});unsubs.push(u)}
function actorKey(x){return String(x?.actorId||x?.employeeId||x?.customerUid||x?.visitorId||x?.id||'')}
function initials(s){s=String(s||'—').trim();return esc((s.split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'—').toUpperCase())}
function latestPresence(type){const m=new Map();S.presence.filter(x=>x.actorType===type).sort((a,b)=>ms(b.lastActive)-ms(a.lastActive)).forEach(x=>{const k=actorKey(x);if(k&&!m.has(k))m.set(k,x)});return m}
function employeeRows(){const p=latestPresence('employee'),m=new Map();S.employees.forEach(e=>{const id=String(e.employeeId||e.id);m.set(id,{id,name:e.name||e.displayName||e.username||id,account:e,presence:p.get(id)})});S.employeeSessions.forEach(s=>{const id=String(s.employeeId||'name_'+norm(s.name));if(!m.has(id))m.set(id,{id,name:s.name||id,account:null,presence:null});});p.forEach((v,k)=>{if(!m.has(k))m.set(k,{id:k,name:v.actorName||k,account:null,presence:v})});return [...m.values()].filter(x=>!isQa(x)).sort((a,b)=>ms(b.presence?.lastActive)-ms(a.presence?.lastActive))}
function customerRows(){const p=latestPresence('customer'),m=new Map();S.customers.forEach(c=>{const id=String(c.id||c.uid||c.visitorId);m.set(id,{id,name:c.name||'عميل',company:c.company||'',profile:c,presence:p.get(id)});});p.forEach((v,k)=>{if(!m.has(k))m.set(k,{id:k,name:v.actorName||'عميل',company:v.company||'',profile:null,presence:v})});return [...m.values()].filter(x=>!isQa(x)).sort((a,b)=>ms(b.presence?.lastActive)-ms(a.presence?.lastActive))}
function topSearches(){const map=new Map();for(const x of [...S.activity.filter(a=>a.action==='search_query').map(a=>({q:a.label,t:a.createdAt,name:a.actorName,type:a.actorType})),...S.searches.map(a=>({q:a.rawQuery,t:a.time,name:a.name,type:'employee'}))]){const q=String(x.q||'').trim();if(!q)continue;const k=norm(q);const r=map.get(k)||{q,count:0,last:0};r.count++;r.last=Math.max(r.last,ms(x.t));map.set(k,r)}return [...map.values()].sort((a,b)=>b.count-a.count).slice(0,20)}
function eventLabel(a){const map={session_start:'فتح النظام',session_end:'غادر النظام',page_home:'فتح الرئيسية',page_categories:'فتح الأقسام',page_cart:'فتح السلة',page_orders:'فتح الطلبات',search_query:'بحث',cart_add_click:'إضافة للسلة',cart_remove_click:'إزالة من السلة',cart_distribution_edit:'تعديل توزيع',cart_snapshot:'تحديث السلة',checkout_open:'بدأ الاعتماد',checkout_submit:'ضغط اعتماد',cart_images_open:'عرض صور السلة',product_image_open:'فتح صورة صنف',employee_catalog_open:'فتح المعرض الرقمي',stocktake_open:'فتح الجرد',whatsapp_open:'فتح واتساب',ui_select:'اختيار',page_visible:'عاد للصفحة'};return map[a]||a||'نشاط'}
function header(){return `<div class="top"><div class="topin"><div class="brand"><b>مركز القيادة</b><span>رقابة تشغيلية موحدة · الموظفون والعملاء والطلبات والصلاحيات</span></div><span class="live"><i class="dot"></i> مباشر</span><button class="back" onclick="location.href='./admin-dashboard.html'">لوحة التحكم</button></div><div class="tabs">${[['overview','الآن'],['employees','الموظفون'],['customers','العملاء'],['activity','النشاط'],['searches','البحث'],['carts','السلال'],['permissions','الصلاحيات']].map(([id,l])=>`<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${l}</button>`).join('')}</div></div>`}
function statsHtml(){const ep=latestPresence('employee'),cp=latestPresence('customer'),eo=[...ep.values()].filter(x=>online(x.lastActive)).length,co=[...cp.values()].filter(x=>online(x.lastActive)).length,events=S.activity.filter(x=>dayAgo(x.createdAt)).length,search=S.activity.filter(x=>x.action==='search_query'&&today(x.createdAt)).length+S.searches.filter(x=>today(x.time)).length,carts=S.carts.filter(x=>(x.itemCount||x.itemsCurrent?.length)>0).length,orders=S.customerOrders.filter(x=>today(x.createdAt)).length+S.employeeOrders.filter(x=>today(x.timestamp)).length;return `<div class="grid stats"><div class="stat"><small>موظفون متصلون</small><b>${eo}</b><em>من ${employeeRows().length} معروف</em></div><div class="stat"><small>عملاء متصلون</small><b>${co}</b><em>لحظيًا</em></div><div class="stat"><small>نشاط آخر 24 ساعة</small><b>${events}</b><em>حدث مسجل</em></div><div class="stat"><small>عمليات بحث اليوم</small><b>${search}</b><em>موظفون + عملاء</em></div><div class="stat"><small>سلال فيها أصناف</small><b>${carts}</b><em>آخر حالة محفوظة</em></div><div class="stat"><small>طلبات اليوم</small><b>${orders}</b><em>موظفون + عملاء</em></div></div>`}
function recentEvents(rows=S.activity.slice(0,18)){return `<div class="list">${rows.length?rows.map(a=>`<div class="event"><div class="time">${ago(a.createdAt)}</div><div><b>${esc(a.actorName||a.actorId||'غير معروف')} · ${esc(eventLabel(a.action))}</b><p>${esc(a.label||'')}${a.data?.itemCount!=null?` · ${num(a.data.itemCount)} صنف`:''}</p></div></div>`).join(''):'<div class="sub">لا يوجد نشاط مسجل بعد.</div>'}</div>`}
function overview(){const top=topSearches().slice(0,8);return `${statsHtml()}<div class="split" style="margin-top:12px"><div class="panel"><div class="ph"><div class="grow"><h2>النشاط المباشر</h2><p>آخر ما فعله الموظفون والعملاء بدون سجلات الاختبار.</p></div></div>${recentEvents()}</div><div class="grid"><div class="panel"><div class="ph"><div class="grow"><h2>أكثر ما يتم البحث عنه</h2><p>مؤشر سريع على احتياج المستخدمين.</p></div></div>${top.map((x,i)=>`<div style="margin-bottom:9px"><div class="kv"><b>${i+1}. ${esc(x.q)}</b><span>${x.count}</span></div><div class="bar"><i style="width:${Math.max(8,Math.round(x.count/(top[0]?.count||1)*100))}%"></i></div></div>`).join('')||'<div class="sub">لا توجد عمليات بحث بعد.</div>'}</div>${S.errors.length?`<div class="warn">بعض مصادر البيانات لم تُقرأ: ${esc(S.errors.slice(-2).join(' · '))}</div>`:''}</div></div>`}
function personRows(type){const rows=type==='employee'?employeeRows():customerRows();const q=norm(S.q);return rows.filter(x=>!q||norm(`${x.name} ${x.company||''} ${x.id}`).includes(q)).map(x=>{const on=online(x.presence?.lastActive);return `<div class="row click person" data-type="${type}" data-id="${esc(x.id)}"><div class="avatar">${initials(x.name)}</div><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="sub">${type==='customer'?esc(x.company||'بدون اسم شركة'):`ID: ${esc(x.id)}`} · ${x.presence?ago(x.presence.lastActive):'لا توجد جلسة V44'}</div></div><span class="tag ${on?'ok':''}">${on?'متصل':'غير متصل'}</span></div>`}).join('')||'<div class="sub">لا توجد نتائج.</div>'}
function people(type){return `<div class="panel"><div class="ph"><div class="grow"><h2>${type==='employee'?'الموظفون':'العملاء'}</h2><p>${type==='employee'?'من دخل، ماذا بحث، وأي شاشة استخدم.':'الجلسات، الأجهزة، السلال، والطلبات المرتبطة بالعميل.'}</p></div></div><div class="toolbar"><input class="search" id="peopleSearch" value="${esc(S.q)}" placeholder="ابحث بالاسم أو المعرف..."></div><div class="list">${personRows(type)}</div></div>`}
function activity(){let rows=S.activity;const q=norm(S.q);if(S.actorFilter!=='all')rows=rows.filter(x=>x.actorType===S.actorFilter);if(S.actionFilter!=='all')rows=rows.filter(x=>x.action===S.actionFilter);if(q)rows=rows.filter(x=>norm(`${x.actorName} ${x.action} ${x.label} ${JSON.stringify(x.data||{})}`).includes(q));const actions=[...new Set(S.activity.map(x=>x.action).filter(Boolean))].sort();return `<div class="panel"><div class="ph"><div class="grow"><h2>سجل النشاط الموحد</h2><p>بحث، تنقل، معرض، سلة، اعتماد، صور، واتساب وغيرها.</p></div></div><div class="toolbar"><input id="activitySearch" class="search" value="${esc(S.q)}" placeholder="ابحث في النشاط..."><select id="actorFilter" class="sel"><option value="all">الكل</option><option value="employee" ${S.actorFilter==='employee'?'selected':''}>موظفون</option><option value="customer" ${S.actorFilter==='customer'?'selected':''}>عملاء</option></select><select id="actionFilter" class="sel"><option value="all">كل الأحداث</option>${actions.map(a=>`<option value="${esc(a)}" ${S.actionFilter===a?'selected':''}>${esc(eventLabel(a))}</option>`).join('')}</select></div>${recentEvents(rows.slice(0,250))}</div>`}
function searches(){const rows=[...S.activity.filter(a=>a.action==='search_query').map(a=>({time:a.createdAt,name:a.actorName,type:a.actorType,q:a.label,count:'—'})),...S.searches.map(a=>({time:a.time,name:a.name,type:'employee',q:a.rawQuery,count:a.resultsCount}))].sort((a,b)=>ms(b.time)-ms(a.time));const q=norm(S.q),f=rows.filter(x=>!q||norm(`${x.name} ${x.q}`).includes(q));return `<div class="split"><div class="panel"><div class="ph"><div class="grow"><h2>ذكاء البحث</h2><p>أكثر الكلمات بحثًا وما الذي يبحث عنه كل مستخدم.</p></div></div>${topSearches().map((x,i)=>`<div class="row"><div class="avatar">${i+1}</div><div class="rowmain"><div class="rowtitle">${esc(x.q)}</div><div class="sub">آخر بحث ${new Date(x.last).toLocaleString('ar-SA')}</div></div><span class="tag info">${x.count} مرة</span></div>`).join('')}</div><div class="panel"><div class="toolbar"><input id="searchLogSearch" class="search" value="${esc(S.q)}" placeholder="ابحث في سجل البحث..."></div><div class="list">${f.slice(0,180).map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.q)}</div><div class="sub">${esc(x.name||'غير معروف')} · ${x.type==='employee'?'موظف':'عميل'} · ${dt(x.time)}</div></div><span class="tag">${x.count==='—'?'':`${x.count} نتيجة`}</span></div>`).join('')||'<div class="sub">لا توجد نتائج.</div>'}</div></div></div>`}
function imgSrc(i){const f=String(i?.imageFile||'');if(!f)return'';return /^https?:/.test(f)?f:(f.startsWith('./')?f:`./images/${f}`)}
function cartHtml(c){const items=(c.itemsCurrent?.length?c.itemsCurrent:c.lastNonEmptyItems)||[];return `<div class="cart"><div class="carthead"><div class="avatar">${initials(c.actorName)}</div><div class="rowmain"><div class="rowtitle">${esc(c.actorName||c.actorId||'غير معروف')}</div><div class="sub">${c.actorType==='employee'?'موظف':'عميل'} · ${items.length} صنف · ${num(c.totalQty||items.reduce((s,i)=>s+Number(i.qty||0),0))} كرتون · ${ago(c.updatedAt||c.lastNonEmptyAt)}</div></div><span class="tag ${c.itemsCurrent?.length?'ok':''}">${c.itemsCurrent?.length?'سلة حالية':'آخر سلة'}</span></div><div class="cartitems">${items.slice(0,24).map(i=>`<div class="cartitem">${imgSrc(i)?`<img src="${esc(imgSrc(i))}" onerror="this.style.display='none'">`:'<div class="emptyimg">بدون صورة</div>'}<div class="rowmain"><div class="rowtitle">${esc(i.name||i.id)}</div><div class="sub ltr">${esc(i.id||i.cleanId)}</div><div class="sub">الكمية: <b>${num(i.qty)}</b>${i.warehouseKey?` · ${esc(i.warehouseKey)}`:''}</div></div></div>`).join('')}</div></div>`}
function carts(){const q=norm(S.q),rows=S.carts.filter(c=>!q||norm(`${c.actorName} ${c.actorId} ${JSON.stringify(c.itemsCurrent||c.lastNonEmptyItems||[])}`).includes(q)).sort((a,b)=>ms(b.updatedAt||b.lastNonEmptyAt)-ms(a.updatedAt||a.lastNonEmptyAt));return `<div class="panel"><div class="ph"><div class="grow"><h2>السلال الحية</h2><p>تعرف ماذا أضاف الموظف أو العميل حتى قبل اعتماد الطلب.</p></div></div><div class="toolbar"><input id="cartSearch" class="search" value="${esc(S.q)}" placeholder="ابحث باسم المستخدم أو الصنف..."></div><div class="grid">${rows.map(cartHtml).join('')||'<div class="sub">لا توجد سلال مسجلة بعد.</div>'}</div></div>`}
function toggleHtml(kind,key,label,val,scope='default'){return `<div class="perm"><span>${esc(label)}</span><button class="switch ${val?'on':''}" data-perm-kind="${kind}" data-perm-key="${key}" data-perm-scope="${scope}" data-value="${val?'1':'0'}"><i></i></button></div>`}
function permissionTargetOptions(kind){const rows=kind==='employee'?employeeRows():customerRows();return `<option value="">اختر ${kind==='employee'?'موظفًا':'عميلًا'}...</option>${rows.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.company?` — ${esc(x.company)}`:''}</option>`).join('')}`}
function permissions(){return `<div class="grid"><div class="warn">الصلاحيات هنا تطبق لحظيًا على الاستخدام الفعلي. المدير يبقى خارج هذه القيود، وسجلات الاختبار مخفية ولا تؤثر على البيانات.</div><div class="split"><div class="permblock"><div class="ph"><div class="grow"><h2>افتراضي الموظفين</h2><p>القاعدة العامة لكل حساب موظف، ويمكن تخصيص فرد معين.</p></div></div><div class="permgrid">${Object.entries(PERMS.employee).map(([k,l])=>toggleHtml('employee',k,l,S.permissions.employeeDefaults?.[k]!==false)).join('')}</div></div><div class="permblock"><div class="ph"><div class="grow"><h2>افتراضي العملاء</h2><p>تحكم في التصفح والسلة والاعتماد والصور وغيرها.</p></div></div><div class="permgrid">${Object.entries(PERMS.customer).map(([k,l])=>toggleHtml('customer',k,l,S.permissions.customerDefaults?.[k]!==false)).join('')}</div></div></div><div class="split"><div class="permblock"><div class="ph"><div class="grow"><h2>تخصيص موظف</h2><p>أي خيار هنا يتجاوز الإعداد العام لهذا الموظف فقط.</p></div></div><select id="employeePermTarget" class="sel" style="width:100%">${permissionTargetOptions('employee')}</select><div id="employeeOverride" class="permgrid" style="margin-top:10px"><div class="sub">اختر موظفًا لعرض صلاحياته.</div></div></div><div class="permblock"><div class="ph"><div class="grow"><h2>تخصيص عميل</h2><p>يمكن تقييد أو فتح خصائص لعميل بعينه بدون التأثير على بقية العملاء.</p></div></div><select id="customerPermTarget" class="sel" style="width:100%">${permissionTargetOptions('customer')}</select><div id="customerOverride" class="permgrid" style="margin-top:10px"><div class="sub">اختر عميلًا لعرض صلاحياته.</div></div></div></div></div>`}
function render(){const app=$('#app');if(!app)return;let body=S.tab==='overview'?overview():S.tab==='employees'?people('employee'):S.tab==='customers'?people('customer'):S.tab==='activity'?activity():S.tab==='searches'?searches():S.tab==='carts'?carts():permissions();app.innerHTML=header()+`<main><section class="section on">${body}</section></main>`;bind()}
function bind(){$$('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.q='';render()});const bindSearch=(id)=>{$(id)?.addEventListener('input',e=>{S.q=e.target.value;render()})};bindSearch('#peopleSearch');bindSearch('#activitySearch');bindSearch('#searchLogSearch');bindSearch('#cartSearch');$('#actorFilter')?.addEventListener('change',e=>{S.actorFilter=e.target.value;render()});$('#actionFilter')?.addEventListener('change',e=>{S.actionFilter=e.target.value;render()});$$('.person').forEach(x=>x.onclick=()=>openPerson(x.dataset.type,x.dataset.id));$$('[data-perm-scope="default"]').forEach(b=>b.onclick=()=>saveDefaultPerm(b.dataset.permKind,b.dataset.permKey,b.dataset.value!=='1'));$('#employeePermTarget')?.addEventListener('change',e=>renderOverride('employee',e.target.value));$('#customerPermTarget')?.addEventListener('change',e=>renderOverride('customer',e.target.value))}
async function saveDefaultPerm(kind,key,val){try{const next={...(S.permissions[kind+'Defaults']||DEFAULTS[kind]),[key]:val};await db.collection('system_controls').doc('permissions_v44').set({[kind+'Defaults']:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('تم تحديث الصلاحية')}catch(e){toast('تعذر حفظ الصلاحية')}}
function renderOverride(kind,id){const box=$('#'+kind+'Override');if(!box)return;if(!id){box.innerHTML='<div class="sub">اختر حسابًا أولًا.</div>';return}const base=S.permissions[kind+'Defaults']||DEFAULTS[kind],over=S.permissions[kind+'Overrides']?.[id]||{};box.innerHTML=Object.entries(PERMS[kind]).map(([k,l])=>toggleHtml(kind,k,l,over[k]??base[k],id)).join('');box.querySelectorAll('.switch').forEach(b=>b.onclick=()=>saveOverride(kind,id,b.dataset.permKey,b.dataset.value!=='1'))}
async function saveOverride(kind,id,key,val){try{const map={...(S.permissions[kind+'Overrides']||{})},row={...(map[id]||{}),[key]:val};map[id]=row;await db.collection('system_controls').doc('permissions_v44').set({[kind+'Overrides']:map,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('تم تحديث صلاحيات الحساب');setTimeout(()=>renderOverride(kind,id),120)}catch(e){toast('تعذر حفظ الصلاحية')}}
function openPerson(type,id){const rows=type==='employee'?employeeRows():customerRows(),p=rows.find(x=>String(x.id)===String(id));if(!p)return;const activities=S.activity.filter(a=>a.actorType===type&&(String(a.actorId)===String(id)||norm(a.actorName)===norm(p.name))).slice(0,120);const searches=S.searches.filter(x=>type==='employee'&&norm(x.name)===norm(p.name)).slice(0,60);const cart=S.carts.find(c=>c.actorType===type&&(String(c.actorId)===String(id)||norm(c.actorName)===norm(p.name)));const orders=type==='employee'?S.employeeOrders.filter(o=>norm(o.name||o.salesman||o.employeeName)===norm(p.name)).slice(0,30):S.customerOrders.filter(o=>String(o.customerUid||'')===String(id)||norm(o.customer?.name)===norm(p.name)).slice(0,30);$('#drawerTitle').textContent=p.name;$('#drawerSub').textContent=(p.company||'')+(p.presence?` · ${online(p.presence.lastActive)?'متصل الآن':ago(p.presence.lastActive)}`:'');$('#drawerBody').innerHTML=`${cart?`<div class="ph"><div class="grow"><h2>السلة</h2><p>آخر حالة معروفة.</p></div></div>${cartHtml(cart)}`:''}<div class="ph" style="margin-top:14px"><div class="grow"><h2>النشاط</h2><p>${activities.length} حدث</p></div></div>${recentEvents(activities)}${searches.length?`<div class="ph" style="margin-top:14px"><div class="grow"><h2>عمليات البحث</h2></div></div>${searches.map(s=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(s.rawQuery)}</div><div class="sub">${s.resultsCount??'—'} نتيجة · ${dt(s.time)}</div></div></div>`).join('')}`:''}${orders.length?`<div class="ph" style="margin-top:14px"><div class="grow"><h2>الطلبات</h2><p>${orders.length} طلب حديث</p></div></div>${orders.map(o=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(o.orderNo||o.invoiceNumber||o.id)}</div><div class="sub">${o.items?.length||o.cart?.length||0} صنف · ${dt(o.createdAt||o.timestamp)}</div></div></div>`).join('')}`:''}`;$('#drawerbg').classList.add('on')}
$('#drawerClose').onclick=()=>$('#drawerbg').classList.remove('on');$('#drawerbg').onclick=e=>{if(e.target.id==='drawerbg')$('#drawerbg').classList.remove('on')};window.addEventListener('beforeunload',()=>unsubs.forEach(x=>{try{x()}catch{}}));render();bootData();
</script>
