<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>توزيع صور الأصناف</title>
<meta name="theme-color" content="#fff">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafaf9;color:#1c1917}.wrap{max-width:1100px;margin:auto;padding:18px}.head{position:sticky;top:0;z-index:5;background:#fafaf9ee;backdrop-filter:blur(12px);padding:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.card{background:#fff;border:1px solid #e7e5e4;border-radius:18px;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:20px}.muted{color:#78716c;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.pic{aspect-ratio:1;background:#f5f5f4;display:grid;place-items:center;position:relative}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:10px}.key{font-weight:800;direction:ltr;text-align:right}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:700;background:#1c1917;color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:#1c1917;border:1px solid #d6d3d1}.search{width:100%;height:46px;border:1px solid #d6d3d1;border-radius:12px;padding:0 13px;font-size:16px;background:#fff}.tabs{display:flex;gap:7px;margin:10px 0;overflow:auto}.tab{border:1px solid #d6d3d1;background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab.on{background:#1c1917;color:#fff}.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet.on{display:flex}.panel{width:100%;max-width:650px;max-height:88dvh;background:#fff;border-radius:22px 22px 0 0;padding:16px;overflow:auto}.sku{width:100%;text-align:right;border:1px solid #e7e5e4;background:#fff;border-radius:13px;padding:12px;margin-top:7px}.sku b{direction:ltr;display:inline-block}.notice{position:fixed;left:14px;right:14px;bottom:18px;max-width:480px;margin:auto;background:#166534;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:40}.empty{padding:40px 15px;text-align:center;color:#78716c}.badge{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #e7e5e4;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.auto{color:#166534}.badge.manual{color:#0369a1}.owner{margin-top:6px;font-size:10px;line-height:1.55;color:#57534e}.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.7;margin:8px 0}
</style></head><body><div class="wrap">
<div class="head"><div class="row"><div class="grow"><h2 style="margin:0">ألبوم توزيع الصور</h2><div class="muted">يعرض حالة الصورة الفعلية في المعرض: تلقائي أو يدوي. فقط الصور غير المستخدمة فعلاً تظهر في «غير الموزعة».</div></div><button class="btn secondary" onclick="location.href='./index.html?employee=1'">رجوع</button></div>
<div class="stats"><div class="card stat"><b id="unassigned">—</b><span class="muted">غير موزعة فعليًا</span></div><div class="card stat"><b id="assigned">—</b><span class="muted">موزعة</span></div><div class="card stat"><b id="total">—</b><span class="muted">كل الصور</span></div></div>
<input id="q" class="search" placeholder="ابحث باسم الصورة أو رقم الصنف…"><div class="tabs"><button class="tab on" data-tab="unassigned">غير الموزعة</button><button class="tab" data-tab="assigned">الموزعة</button><button class="tab" data-tab="manual">الربط اليدوي</button><button class="tab" data-tab="all">كل الصور</button></div></div>
<div id="grid" class="grid"></div><div id="empty" class="card empty" style="display:none">لا توجد صور في هذا القسم.</div></div>
<div id="sheet" class="sheet"><div class="panel"><div class="row"><div class="grow"><b id="sheetTitle">اختيار الصنف</b><div class="muted">ابحث ثم اضغط على الصنف لاعتماد الربط.</div></div><button class="btn secondary" onclick="closeSheet()">إغلاق</button></div><div id="sheetWarn" class="warn" style="display:none"></div><input id="skuq" class="search" style="margin-top:12px" placeholder="رقم الصنف أو الاسم…"><div id="skus"></div></div></div><div id="notice" class="notice"></div>
<script>
const cfg={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374'};
const norm=s=>String(s||'').toUpperCase().replace(/\.(WEBP|PNG|JPE?G)$/,'').replace(/[^A-Z0-9_\-]/g,'');
const digits=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
const state={images:[],items:[],bindings:{},tab:'unassigned',selected:null,assignment:new Map()};
function adminOK(){try{const n=String(localStorage.getItem('inventory_user_name_v2')||'').trim().toLowerCase(),id=String(localStorage.getItem('inventory_employee_id_v2')||'').trim().toLowerCase();return n==='مهند'||n.includes('mohanad')||id==='admin_mohanad'}catch{return false}}
if(!adminOK()){document.body.innerHTML='<div class="wrap"><div class="card empty"><b>هذه الصفحة خاصة بالإدارة.</b><br><br><button class="btn" onclick="location.href=\'./index.html?employee=1\'">تسجيل الدخول</button></div></div>';throw new Error('ADMIN_ONLY')}
firebase.initializeApp(cfg);const db=firebase.firestore();
const text=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p);return r.text()};
function parseImages(raw){return String(raw).split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const p=line.split('\t'),file=p[p.length-1].trim(),key=norm(p[0]||file);return{key,file,clean:digits(key)}})}
function parseInv(raw){const lines=String(raw).trim().split(/\r?\n/);if(lines.length<2)return[];const h=lines[0].split('\t'),ii=h.findIndex(x=>/رقم|كود|sku|item/i.test(x)),ni=h.findIndex(x=>/اسم|وصف|name/i.test(x));return lines.slice(1).map(l=>{const c=l.split('\t'),id=(c[ii]||'').trim();return{id,name:(c[ni]||'').trim(),key:norm(id),clean:digits(id)}}).filter(x=>x.id)}
function uniqueItems(rows){const m=new Map;rows.forEach(x=>{if(x.key&&!m.has(x.key))m.set(x.key,x)});return[...m.values()]}
function buildAssignment(){
  const exact=new Map(state.images.map(img=>[img.key,img]));
  const legacy=new Map();state.images.forEach(img=>{if(!img.clean)return;if(!legacy.has(img.clean))legacy.set(img.clean,[]);legacy.get(img.clean).push(img)});
  const ownersByClean=new Map();state.items.forEach(item=>{if(!item.clean)return;if(!ownersByClean.has(item.clean))ownersByClean.set(item.clean,new Set());ownersByClean.get(item.clean).add(item.key)});
  const assignment=new Map();
  const add=(img,item,mode)=>{if(!img)return;const current=assignment.get(img.key)||{image:img,owners:[],manual:false,automatic:false};if(!current.owners.some(o=>o.key===item.key))current.owners.push(item);if(mode==='manual')current.manual=true;else current.automatic=true;assignment.set(img.key,current)};
  state.items.forEach(item=>{
    const override=norm(state.bindings[item.key]||'');
    if(override&&exact.has(override)){add(exact.get(override),item,'manual');return}
    if(exact.has(item.key)){add(exact.get(item.key),item,'automatic');return}
    const candidates=legacy.get(item.clean)||[],owners=ownersByClean.get(item.clean)||new Set();
    if(candidates.length&&owners.size===1)add(candidates[0],item,'automatic');
  });
  state.assignment=assignment;
}
function refresh(){buildAssignment();const q=norm(document.getElementById('q').value);let rows=state.images;if(state.tab==='unassigned')rows=rows.filter(x=>!state.assignment.has(x.key));if(state.tab==='assigned')rows=rows.filter(x=>state.assignment.has(x.key));if(state.tab==='manual')rows=rows.filter(x=>state.assignment.get(x.key)?.manual);if(q)rows=rows.filter(x=>x.key.includes(q)||norm(x.file).includes(q)||(state.assignment.get(x.key)?.owners||[]).some(o=>o.key.includes(q)||norm(o.name).includes(q)));const assignedCount=state.images.filter(x=>state.assignment.has(x.key)).length;document.getElementById('total').textContent=state.images.length;document.getElementById('unassigned').textContent=state.images.length-assignedCount;document.getElementById('assigned').textContent=assignedCount;const g=document.getElementById('grid');g.innerHTML='';document.getElementById('empty').style.display=rows.length?'none':'block';rows.forEach(x=>{const info=state.assignment.get(x.key);const ownerText=info?.owners?.map(o=>o.id).join('، ')||'';const mode=info?(info.manual?'يدوي':'تلقائي'):'غير موزعة';const badgeClass=info?(info.manual?'manual':'auto'):'';const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="pic"><img loading="lazy" src="./images/${encodeURIComponent(x.file)}" alt="${x.key}"><span class="badge ${badgeClass}">${info?'موزعة '+mode:'غير موزعة'}</span></div><div class="body"><div class="key">${x.key}</div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.file}</div><button class="btn" style="width:100%;margin-top:8px">${info?'إعادة توزيع':'توزيع على صنف'}</button>${info?`<div class="owner">مرتبطة فعليًا بـ <b>${ownerText}</b>${info.manual?' · ربط يدوي':' · ربط تلقائي آمن'}</div>`:''}</div>`;el.querySelector('button').onclick=()=>openSheet(x);g.appendChild(el)})}
function openSheet(img){state.selected=img;const info=state.assignment.get(img.key);document.getElementById('sheetTitle').textContent='توزيع الصورة '+img.key;document.getElementById('skuq').value='';const warn=document.getElementById('sheetWarn');if(info){warn.style.display='block';warn.textContent='هذه الصورة مستخدمة حاليًا للصنف: '+info.owners.map(o=>o.id).join('، ')+'. اختيار صنف آخر سيجعل الربط اليدوي الجديد له الأولوية لذلك الصنف.'}else warn.style.display='none';document.getElementById('sheet').classList.add('on');renderSkus()}
function closeSheet(){document.getElementById('sheet').classList.remove('on');state.selected=null}
function renderSkus(){const q=document.getElementById('skuq').value.trim().toLowerCase(),clean=digits(q);let rows=state.items;if(q)rows=rows.filter(x=>x.id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)||(clean&&x.clean.includes(clean)));rows=rows.slice(0,80);const host=document.getElementById('skus');host.innerHTML='';rows.forEach(x=>{const b=document.createElement('button');b.className='sku';b.innerHTML=`<b>${x.id}</b><div class="muted">${x.name||'بدون اسم'}</div>`;b.onclick=()=>bind(x);host.appendChild(b)})}
async function bind(item){if(!state.selected)return;const sku=norm(item.id),imageKey=state.selected.key;if(!confirm(`ربط الصورة ${imageKey} بالصنف ${item.id}؟`))return;const ref=db.collection('system_controls').doc('product_image_bindings');await db.runTransaction(async tx=>{const snap=await tx.get(ref),data=snap.exists?snap.data():{},bindings={...(data.bindings||{}),[sku]:imageKey};tx.set(ref,{...data,bindings,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند',version:'56.29'},{merge:true})});state.bindings[sku]=imageKey;closeSheet();toast(`تم ربط ${imageKey} بالصنف ${item.id} ✓`);refresh()}
function toast(s){const n=document.getElementById('notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',2600)}
document.getElementById('q').oninput=refresh;document.getElementById('skuq').oninput=renderSkus;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.tab=b.dataset.tab;refresh()});document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
(async()=>{try{const [imgs,j,r,snap]=await Promise.all([text('./data/images_list.txt'),text('./data/jeddah.tsv'),text('./data/riyadh.tsv'),db.collection('system_controls').doc('product_image_bindings').get()]);state.images=parseImages(imgs);state.items=uniqueItems([...parseInv(j),...parseInv(r)]).sort((a,b)=>a.id.localeCompare(b.id,'ar',{numeric:true}));state.bindings=snap.exists?(snap.data().bindings||{}):{};refresh()}catch(e){console.error(e);document.getElementById('grid').innerHTML='<div class="card empty">تعذر تحميل بيانات الصور أو الأصناف. أعد المحاولة.</div>'}})();
</script></body></html>
