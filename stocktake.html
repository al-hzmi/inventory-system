function chip(id,label,count){return `<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${label} <span>${count}</span></button>`}

function canEditItem(item){return Boolean(item&&state.campaign&&state.team&&item.campaignId===state.campaign.id&&state.campaign.status!=='closed'&&canAccess(state.control)&&isMember(state.team))}
async function writeCount(item,actual,source){

 if(!saveDraft(item.id,String(actual),'qty',{operationId})){saving.delete(item.id);return false}

 const wasCounted=(item.countStatus||'pending')!=='pending',before={actualQty:item.actualQty??null,countStatus:item.countStatus||'pending',difference:item.difference??null,note:item.note||'',revision:item.revision||0},status=statusOf(totalActual,item.expectedQty),difference=StocktakeCore.difference(totalActual,Number(item.expectedQty)),now=firebase.firestore.FieldValue.serverTimestamp(),patch={counted:true,updatedAt:now,lastCountAt:now,updatedByEmployeeId:user.employeeId||ROOT_ID,updatedByName:user.name,revision:firebase.firestore.FieldValue.increment(1),lastInputSource:source,lastCountOperationId:operationId};

   unsub=db.collection('stocktake_items').doc(item.id).onSnapshot({includeMetadataChanges:true},snap=>{if(snap.data()?.teamCounts?.[StocktakeCore.teamKey(countingTeam.id)]?.operationId===operationId&&(durableCache||!snap.metadata.hasPendingWrites)){accept();unsub()}},()=>{});

}

function saveActual(id){ensureFeedbackAudio();const it=state.items.find(x=>x.id===id),inp=$(`#actual_${CSS.escape(id)}`);if(!it||!inp||state.campaign?.status==='closed')return;if(!inp.value.trim())return toast('اكتب الكمية أولًا؛ الحقل الفارغ لا يعني صفرًا');writeCount(it,n(inp.value),(it.countStatus||'pending')==='pending'?'first_manual_count':'manual_revision')}
function openNote(id){const it=state.items.find(x=>x.id===id);if(!it)return;state.noteItem=it;$('#noteSku').textContent=`الصنف ${it.sku}`;$('#noteText').value=draftStore.get(draftKey(id,'note'))?.value??(it.note||'');$('#noteModal').classList.add('open');setTimeout(()=>$('#noteText').focus(),80)}

 const key=draftKey(it.id,'note'),operationId=db.collection('stocktake_audit').doc().id,now=firebase.firestore.FieldValue.serverTimestamp();

 const batch=db.batch();batch.update(db.collection('stocktake_items').doc(it.id),{note,hasNote:!!note,noteUpdatedAt:now,noteUpdatedBy:user.name,lastNoteOperationId:operationId});
 batch.set(db.collection('stocktake_audit').doc(operationId),{campaignId:it.campaignId,teamId:it.teamId,itemId:it.id,sku:it.sku,action:'note_updated',before:{note:it.note||''},after:{note},actorEmployeeId:user.employeeId||ROOT_ID,actorName:user.name,createdAt:now});
 let unsub=()=>{};unsub=db.collection('stocktake_items').doc(it.id).onSnapshot({includeMetadataChanges:true},d=>{if(d.data()?.lastNoteOperationId===operationId&&(durableCache||!d.metadata.hasPendingWrites)){if(state.noteItem?.id===it.id)$('#noteCancel').click();saving.delete('note:'+it.id);toast('تم تسجيل الملاحظة · بانتظار تأكيد المزامنة');unsub()}},()=>{});
 batch.commit().then(()=>{unsub();saving.delete('note:'+it.id);if(draftStore.get(key)?.operationId===operationId)draftStore.remove(key);if(state.noteItem?.id===it.id)$('#noteCancel').click();toast('تمت مزامنة الملاحظة')}).catch(()=>{unsub();saving.delete('note:'+it.id);if(draftStore.get(key)?.operationId===operationId)draftStore.set(key,{value:note});toast('تعذر اعتماد الملاحظة؛ المسودة محفوظة')});
};
function openFound(id){const it=state.items.find(x=>x.id===id);if(!it||!Number.isFinite(Number(it.actualQty)))return;state.foundItem=it;$('#foundInfo').textContent=`الصنف ${it.sku} · الجرد الحالي ${fmt(it.actualQty)} · ${it.countStatus==='shortage'?`النقص الحالي ${fmt(Math.abs(it.difference||0))}`:it.countStatus==='surplus'?`الزيادة الحالية ${fmt(it.difference||0)}`:'مطابق حاليًا'}`;$('#foundQty').value=draftStore.get(draftKey(id,'found'))?.value||'';$('#foundPreview').textContent='';$('#foundModal').classList.add('open');setTimeout(()=>$('#foundQty').focus(),80)}
function closeFound(){$('#foundModal').classList.remove('open');state.foundItem=null}$('#foundCancel').onclick=closeFound;$('#foundModal').onclick=e=>{if(e.target.id==='foundModal')closeFound()};$('#foundQty').oninput=()=>{if(state.foundItem)saveDraft(state.foundItem.id,$('#foundQty').value,'found');const it=state.foundItem,v=n($('#foundQty').value),el=$('#foundPreview');if(!it||!Number.isFinite(v)||v<=0){el.textContent='';return}const next=(Number.isFinite(it._teamActual)?it._teamActual:0)+v,diff=next-Number(it.expectedQty);el.textContent=`الإجمالي الجديد: ${fmt(next)} · ${diff===0?'مطابق':diff<0?`النقص المتبقي ${fmt(Math.abs(diff))}`:`زيادة ${fmt(diff)}`}`};$('#foundSave').onclick=async()=>{const selected=state.foundItem,it=state.items.find(i=>i.id===selected?.id),v=n($('#foundQty').value);if(!it||!Number.isFinite(v)||v<=0)return toast('أدخل الكمية التي عُثر عليها');if(saving.has(it.id))return;$('#foundSave').disabled=true;try{const ok=await writeCount(it,StocktakeCore.difference((Number.isFinite(it._teamActual)?it._teamActual:0)+v,0),'found_later');if(ok){draftStore.remove(draftKey(it.id,'found'));closeFound()}}finally{$('#foundSave').disabled=false}};
async function startScanner(){ensureFeedbackAudio();if(state.scanner)return;$('#scanner').classList.add('open');try{const scanner=new Html5Qrcode('reader');state.scanner=scanner;await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:320,height:180},aspectRatio:1,disableFlip:true},txt=>{const value=String(txt||'').trim();if(!value)return;try{navigator.vibrate&&navigator.vibrate(35)}catch{}const resolved=resolveStocktakeSearch(value);stopScanner();state.search=resolved.query;state.filter='all';state.visible=80;state.activeEditId=resolved.item?.id||'';render();toast(resolved.item?(resolved.fromBarcode?`تم التعرف على الصنف ${resolved.item.sku} من الباركود`:`تم العثور على الصنف ${resolved.item.sku}`):'تمت قراءة الباركود ولم يوجد صنف مطابق')},()=>{})}catch(e){console.error(e);stopScanner();toast('تعذر تشغيل الكاميرا')}}async function stopScanner(){const s=state.scanner;state.scanner=null;if(s){try{await s.stop()}catch{}try{await s.clear()}catch{}}$('#scanner')?.classList.remove('open')}$('#closeScanner').onclick=stopScanner;
