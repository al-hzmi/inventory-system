let surplusDialogActive=false;
function confirmSurplusCount(item,enteredQty,totalQty,expectedQty){
 if(surplusDialogActive)return Promise.resolve(false);
 const modal=$('#surplusModal'),cancel=$('#surplusCancel'),approve=$('#surplusConfirm');
 if(!modal||!cancel||!approve)return Promise.resolve(false);
 surplusDialogActive=true;
 const previousFocus=document.activeElement;
 $('#surplusSku').textContent=String(item.sku||'');
 $('#surplusExpected').textContent=fmt(expectedQty);
 $('#surplusTotal').textContent=fmt(totalQty);
 $('#surplusDifference').textContent='+'+fmt(StocktakeCore.difference(totalQty,expectedQty));
 return new Promise(resolve=>{
  const finish=accepted=>{
   modal.classList.remove('open');
   modal.removeEventListener('keydown',onKey);
   modal.onclick=null;cancel.onclick=null;approve.onclick=null;
   surplusDialogActive=false;
   if(previousFocus?.isConnected)try{previousFocus.focus({preventScroll:true})}catch{}
   resolve(accepted);
  };
  const onKey=e=>{
   if(e.key==='Escape'){e.preventDefault();finish(false)}
   if(e.key==='Tab'){
    if(e.shiftKey&&document.activeElement===cancel){e.preventDefault();approve.focus()}
    else if(!e.shiftKey&&document.activeElement===approve){e.preventDefault();cancel.focus()}
   }
  };
  cancel.onclick=()=>finish(false);
  approve.onclick=()=>finish(true);
  modal.onclick=e=>{if(e.target===modal)finish(false)};
  modal.addEventListener('keydown',onKey);
  modal.classList.add('open');
  cancel.focus({preventScroll:true});
 });
}

  try{if(await verifyDraftReceipt(retryKey)){toast('تم تأكيد العملية السابقة من الخادم');return true}}
  catch(error){toast('تعذر التحقق من العملية السابقة؛ المسودة محفوظة');return false}
 }
 if(retryScope!==state.campaign?.id+':'+state.team?.id||!canEditItem(item))return false;
 const countingTeam={...state.team};
 if(!Number.isFinite(actual)||actual<0){toast('أدخل كمية صحيحة؛ اكتب 0 صراحةً إذا لم توجد كمية');return false}
 if(saving.has(item.id)||surplusDialogActive)return false;

  const names=[...new Set(overlapping.map(x=>x.teamName||x.actorName||'مجموعة أخرى'))].join('، ');
  toast('هذا الصنف جُرد من '+names+' في النطاق نفسه أو نطاق غير محدد. راجع مسؤول الجرد لتجنب احتساب الكمية مرتين.');

 const expected=StocktakeCore.quantity(item.expectedQty);
 if(!Number.isFinite(expected)){toast('كمية النظام غير صالحة؛ راجع الإدارة قبل الاعتماد');return false}
 const previewTotal=StocktakeCore.difference(Number(item._totalActual||0)-(Number.isFinite(item._teamActual)?item._teamActual:0)+actual,0);

function saveActual(id){ensureFeedbackAudio();const it=state.items.find(x=>x.id===id),inp=$(`#actual_${CSS.escape(id)}`);if(!it||!inp||state.campaign?.status==='closed')return;if(!inp.value.trim())return toast('اكتب الكمية أولًا؛ الحقل الفارغ لا يعني صفرًا');writeCount(it,n(inp.value),(it.countStatus||'pending')==='pending'?'first_manual_count':'manual_revision')}

async function saveNote(){

   if(op.exists){if(!StocktakeCore.receiptMatches(key,{value:note,operationId},op.data(),user.employeeId||ROOT_ID))throw Error('STOCKTAKE_OPERATION_CONFLICT');return}

async function startScanner(){

  if(!resolved.item){toast(resolved.invalid?'الباركود غير صحيح؛ أعد توجيه الكاميرا':'تمت قراءة الباركود، لكن لا يوجد صنف مطابق في الجرد');return}
