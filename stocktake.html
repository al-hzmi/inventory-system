function cardHtml(i,readonly){const st=i.countStatus||'pending',counted=st!=='pending',diff=counted?Number(i.actualQty)-Number(i.expectedQty):null;return `<article class="card ${st}" data-id="${i.id}"><div class="meta"><div class="grow"><div class="sku">${esc(i.sku)}</div><div class="name">${esc(i.name||'')}${i.pack!==''&&i.pack!=null?` · الشد: ${esc(i.pack)}`:''}</div></div><span class="pill ${st==='matched'?'ok':st==='shortage'?'bad':st==='surplus'?'info':''}">${statusLabel(st)}</span></div>${counted?`<div class="qtygrid"><div class="q"><span>كمية النظام</span><b>${fmt(i.expectedQty)}</b></div><div class="q"><span>الجرد الفعلي</span><b>${fmt(i.actualQty)}</b></div><div class="q"><span>الفرق</span><b>${diff>0?'+':''}${fmt(diff)}</b></div></div><div class="variance ${st}">${st==='matched'?'✓ مطابق':st==='shortage'?`نقص ${fmt(Math.abs(diff))}`:`زيادة ${fmt(diff)}`}${i.revision?` · تعديل رقم ${fmt(i.revision)}`:''}</div>`:`<div class="blind">العد الأول أعمى: أدخل الموجود فعليًا أولًا، وبعد الاعتماد سيظهر مقدار النقص أو الزيادة تلقائيًا.</div>`}${i.note?`<div class="hint"><b>ملاحظة:</b> ${esc(i.note)}</div>`:''}${i._pending?'<div class="pendingmark">بانتظار المزامنة...</div>':''}<div class="actions"><button class="btn entry" data-entry="${i.id}" ${readonly?'disabled':''}>${counted?'تعديل الكمية':'إدخال الكمية'}</button>${counted?`<button class="btn found" data-found="${i.id}" ${readonly?'disabled':''}>+ كمية عُثر عليها</button>`:''}<button class="btn note ${String(i.note||'').trim()?'has':''}" data-note="${i.id}" ${readonly?'disabled':''} title="ملاحظة">⋯</button></div><div class="editbox ${state.activeEditId===i.id?'open':''}" id="edit_${i.id}"><div class="editrow"><input class="actual" id="actual_${i.id}" inputmode="decimal" value="${counted?esc(i.actualQty):''}" placeholder="الكمية الفعلية"><button class="save" data-save="${i.id}">اعتماد</button></div><div class="hint" id="preview_${i.id}">${counted?'يمكن تعديل الإجمالي النهائي. سيُحفظ التعديل كاملًا في سجل الجرد.':'لن تظهر كمية النظام أو الفرق قبل الاعتماد الأول.'}</div></div></article>`}
function bindUi(readonly){$('#backBtn')?.addEventListener('click',()=>location.href='./index.html?employee=1');$('#teamSelect')?.addEventListener('change',e=>{state.activeEditId='';state.search='';state.historyVisible=12;pickTeam(e.target.value)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const strip=b.closest('.filters');if(strip)state.filterScroll=strip.scrollLeft;state.filter=b.dataset.filter;state.historyVisible=12;render()});const se=$('#search');if(se){se.oninput=e=>{const resolved=resolveStocktakeSearch(e.target.value);state.search=e.target.value;state.activeEditId=resolved.item?.id||'';if(resolved.item&&resolved.fromBarcode)state.search=resolved.query;render();const next=$('#search');if(next&&!state.activeEditId){next.focus();try{next.setSelectionRange(next.value.length,next.value.length)}catch{}}};se.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const resolved=resolveStocktakeSearch(se.value);if(resolved.item){state.search=resolved.query;state.activeEditId=resolved.item.id;render()}else toast('لم يتم العثور على الصنف')}}}$('#scanBtn')?.addEventListener('click',()=>{ensureFeedbackAudio();startScanner()});$('#loadMoreHistory')?.addEventListener('click',()=>{state.historyVisible=(state.historyVisible||12)+12;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.activeEditId=b.dataset.open;state.search=String(state.items.find(i=>i.id===b.dataset.open)?.sku||'');render()});if(readonly)return;document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{ensureFeedbackAudio();state.activeEditId=b.dataset.entry;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveActual(b.dataset.save));document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note));document.querySelectorAll('[data-found]').forEach(b=>b.onclick=()=>openFound(b.dataset.found));document.querySelectorAll('.actual').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const id=inp.id.replace('actual_','');saveActual(id)}})}
async function writeCount(item,actual,source){if(state.campaign?.status==='closed')return toast('الحملة مغلقة');if(!Number.isFinite(actual)||actual<0)return toast('أدخل كمية صحيحة');const wasCounted=(item.countStatus||'pending')!=='pending',before={actualQty:item.actualQty??null,countStatus:item.countStatus||'pending',difference:item.difference??null,note:item.note||'',revision:item.revision||0},status=statusOf(actual,item.expectedQty),difference=actual-Number(item.expectedQty),now=firebase.firestore.FieldValue.serverTimestamp(),patch={actualQty:actual,countStatus:status,difference,counted:true,updatedAt:now,lastCountAt:now,updatedByEmployeeId:user.employeeId||ROOT_ID,updatedByName:user.name,revision:firebase.firestore.FieldValue.increment(1),lastInputSource:source};if(!wasCounted){patch.firstCountAt=now;patch.firstCountByEmployeeId=user.employeeId||ROOT_ID;patch.firstCountByName=user.name}try{const batch=db.batch();batch.set(db.collection('stocktake_items').doc(item.id),patch,{merge:true});batch.set(db.collection('stocktake_audit').doc(),{campaignId:item.campaignId,teamId:item.teamId,itemId:item.id,sku:item.sku,action:wasCounted?'count_revised':'count_created',before,after:{actualQty:actual,countStatus:status,difference},actorEmployeeId:user.employeeId||ROOT_ID,actorName:user.name,createdAt:now,source,userAgent:navigator.userAgent||''});await batch.commit();const finishedAll=!wasCounted&&state.items.length>0&&state.items.every(i=>i.id===item.id||(i.countStatus||'pending')!=='pending');feedback(status,finishedAll);toast(finishedAll?'تم إنهاء جميع أصناف المجموعة':status==='matched'?'تم الاعتماد · مطابق':status==='shortage'?`تم الاعتماد · نقص ${fmt(Math.abs(difference))}`:`تم الاعتماد · زيادة ${fmt(difference)}`);state.activeEditId='';state.search='';setTimeout(()=>$('#search')?.focus(),80);return true}catch(e){console.error(e);toast('تعذر الحفظ، حاول مرة أخرى');return false}}
function saveActual(id){ensureFeedbackAudio();const it=state.items.find(x=>x.id===id),inp=$(`#actual_${CSS.escape(id)}`);if(!it||!inp)return;writeCount(it,n(inp.value),(it.countStatus||'pending')==='pending'?'first_manual_count':'manual_revision')}
function openNote(id){const it=state.items.find(x=>x.id===id);if(!it)return;state.noteItem=it;$('#noteSku').textContent=`الصنف ${it.sku}`;$('#noteText').value=it.note||'';$('#noteModal').classList.add('open');setTimeout(()=>$('#noteText').focus(),80)}
$('#noteCancel').onclick=()=>{$('#noteModal').classList.remove('open');state.noteItem=null};$('#noteModal').onclick=e=>{if(e.target.id==='noteModal')$('#noteCancel').click()};$('#noteSave').onclick=async()=>{const it=state.noteItem;if(!it)return;const note=$('#noteText').value.trim(),now=firebase.firestore.FieldValue.serverTimestamp();try{const batch=db.batch();batch.set(db.collection('stocktake_items').doc(it.id),{note,hasNote:!!note,noteUpdatedAt:now,noteUpdatedBy:user.name},{merge:true});batch.set(db.collection('stocktake_audit').doc(),{campaignId:it.campaignId,teamId:it.teamId,itemId:it.id,sku:it.sku,action:'note_updated',before:{note:it.note||''},after:{note},actorEmployeeId:user.employeeId||ROOT_ID,actorName:user.name,createdAt:now});await batch.commit();$('#noteCancel').click();toast(note?'تم حفظ الملاحظة':'تم حذف الملاحظة')}catch{toast('تعذر حفظ الملاحظة')}};
function openFound(id){const it=state.items.find(x=>x.id===id);if(!it||!Number.isFinite(Number(it.actualQty)))return;state.foundItem=it;$('#foundInfo').textContent=`الصنف ${it.sku} · الجرد الحالي ${fmt(it.actualQty)} · ${it.countStatus==='shortage'?`النقص الحالي ${fmt(Math.abs(it.difference||0))}`:it.countStatus==='surplus'?`الزيادة الحالية ${fmt(it.difference||0)}`:'مطابق حاليًا'}`;$('#foundQty').value='';$('#foundPreview').textContent='';$('#foundModal').classList.add('open');setTimeout(()=>$('#foundQty').focus(),80)}
function closeFound(){$('#foundModal').classList.remove('open');state.foundItem=null}$('#foundCancel').onclick=closeFound;$('#foundModal').onclick=e=>{if(e.target.id==='foundModal')closeFound()};$('#foundQty').oninput=()=>{const it=state.foundItem,v=n($('#foundQty').value),el=$('#foundPreview');if(!it||!Number.isFinite(v)||v<=0){el.textContent='';return}const next=Number(it.actualQty)+v,diff=next-Number(it.expectedQty);el.textContent=`الإجمالي الجديد: ${fmt(next)} · ${diff===0?'مطابق':diff<0?`النقص المتبقي ${fmt(Math.abs(diff))}`:`زيادة ${fmt(diff)}`}`};$('#foundSave').onclick=async()=>{const it=state.foundItem,v=n($('#foundQty').value);if(!it||!Number.isFinite(v)||v<=0)return toast('أدخل الكمية التي عُثر عليها');const next=Number(it.actualQty)+v,before=Number(it.actualQty);closeFound();const ok=await writeCount(it,next,'found_later');if(ok){try{await db.collection('stocktake_audit').add({campaignId:it.campaignId,teamId:it.teamId,itemId:it.id,sku:it.sku,action:'quantity_found_later',before:{actualQty:before},after:{foundQty:v,actualQty:next},actorEmployeeId:user.employeeId||ROOT_ID,actorName:user.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch{}}};
async function startScanner(){ensureFeedbackAudio();if(state.scanner)return;$('#scanner').classList.add('open');try{const scanner=new Html5Qrcode('reader');state.scanner=scanner;await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:320,height:180},aspectRatio:1,disableFlip:true},txt=>{const value=String(txt||'').trim();if(!value)return;try{navigator.vibrate&&navigator.vibrate(35)}catch{}const resolved=resolveStocktakeSearch(value);stopScanner();state.search=resolved.query;state.filter='all';state.visible=80;state.activeEditId=resolved.item?.id||'';render();toast(resolved.item?(resolved.fromBarcode?`تم التعرف على الصنف ${resolved.item.sku} من الباركود`:`تم العثور على الصنف ${resolved.item.sku}`):'تمت قراءة الباركود ولم يوجد صنف مطابق')},()=>{})}catch(e){console.error(e);stopScanner();toast('تعذر تشغيل الكاميرا')}}async function stopScanner(){const s=state.scanner;state.scanner=null;if(s){try{await s.stop()}catch{}try{await s.clear()}catch{}}$('#scanner')?.classList.remove('open')}$('#closeScanner').onclick=stopScanner;
</script>
