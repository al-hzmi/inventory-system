<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--sf);color:var(--p);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}input,textarea{font-size:16px}.app{max-width:860px;margin:auto;min-height:100vh;padding:12px 12px max(28px,env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:30;background:rgba(250,250,249,.96);backdrop-filter:blur(12px);padding:10px 0 12px;border-bottom:1px solid var(--b)}.head{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:1px solid var(--b);border-radius:12px;background:white}.title{font-size:18px;font-weight:700}.sub{font-size:11px;color:var(--s);margin-top:2px}.grow{flex:1}.net{font-size:10px;padding:6px 9px;border-radius:999px;background:var(--oks);color:var(--ok);font-weight:700}.net.off{background:var(--bads);color:var(--bad)}.panel{background:#fff;border:1px solid var(--b);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(28,25,23,.05)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--sf);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--s)}.progress{height:7px;background:#eeeae7;border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:var(--ok);width:0;transition:.2s}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 7px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--b);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:700;color:var(--s)}.chip.active{background:var(--p);color:#fff;border-color:var(--p)}.searchrow{display:grid;grid-template-columns:1fr 46px;gap:8px;margin-top:9px}.search{height:46px;border:1px solid var(--b);border-radius:12px;padding:0 13px;background:#fff;outline:none}.search:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(180,83,9,.08)}.scan{border:1px solid var(--b);background:#fff;border-radius:12px;font-size:19px}.list{display:grid;gap:9px;margin-top:12px}.card{background:#fff;border:1px solid var(--b);border-radius:15px;padding:13px;box-shadow:0 1px 2px rgba(28,25,23,.04)}.card.shortage{border-color:rgba(185,28,28,.25)}.card.surplus{border-color:rgba(3,105,161,.25)}.card.matched{border-color:rgba(21,128,61,.18)}.meta{display:flex;align-items:flex-start;gap:8px}.sku{font-weight:700;font-size:14px;direction:ltr;unicode-bidi:isolate}.name{font-size:10px;color:var(--s);margin-top:2px;line-height:1.5}.pill{font-size:9px;font-weight:700;border-radius:999px;padding:5px 8px;background:var(--sf);color:var(--s);border:1px solid var(--b)}.pill.ok{background:var(--oks);color:var(--ok);border-color:rgba(21,128,61,.12)}.pill.bad{background:var(--bads);color:var(--bad);border-color:rgba(185,28,28,.12)}.pill.info{background:var(--infos);color:var(--info);border-color:rgba(3,105,161,.12)}.qtygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.q{background:var(--sf);border-radius:10px;padding:8px;text-align:center}.q span{display:block;font-size:9px;color:var(--s)}.q b{font-size:14px;direction:ltr;unicode-bidi:isolate}.actions{display:grid;grid-template-columns:1.15fr 1fr 42px;gap:7px;margin-top:10px}.btn{height:42px;border-radius:11px;border:1px solid var(--b);background:#fff;font-size:11px;font-weight:700}.btn.full{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.entry{background:var(--p);color:#fff;border-color:var(--p)}.btn.note{font-size:17px;position:relative}.btn.note.has:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--a);top:6px;left:6px}.editbox{margin-top:9px;background:var(--sf);border:1px solid var(--b);border-radius:12px;padding:10px;display:none}.editbox.open{display:block}.editrow{display:grid;grid-template-columns:1fr auto;gap:8px}.actual{height:44px;border:1px solid var(--b);border-radius:10px;padding:0 12px;direction:ltr;text-align:center;font-weight:700}.save{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700}.diff{font-size:10px;margin-top:7px;color:var(--s)}.loadmore{width:100%;height:46px;border:1px solid var(--b);background:#fff;border-radius:12px;font-weight:700;margin-top:12px}.empty{text-align:center;padding:44px 15px;color:var(--m);font-size:12px}.lock{text-align:center;padding:60px 20px}.lock h2{font-size:19px;margin:0}.lock p{font-size:12px;color:var(--s);line-height:1.8}.modalbg{position:fixed;inset:0;background:rgba(28,25,23,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}.modalbg.open{display:flex}.modal{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(0,0,0,.2)}.modal h3{margin:0 0 4px;font-size:16px}.modal p{margin:0 0 12px;font-size:10px;color:var(--s)}.modal textarea{width:100%;min-height:110px;border:1px solid var(--b);border-radius:12px;padding:12px;resize:vertical;outline:none}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modalactions button{height:44px;border-radius:11px;border:1px solid var(--b);font-weight:700}.primary{background:var(--p);color:#fff;border-color:var(--p)!important}.toast{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--p);color:#fff;border-radius:12px;padding:10px 14px;font-size:11px;font-weight:700;transition:.2s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#reader{width:100%}.scanner{position:fixed;inset:0;background:#111;z-index:90;display:none;flex-direction:column}.scanner.open{display:flex}.scannerhead{padding:14px;color:white;display:flex;justify-content:space-between;align-items:center}.scannerhead button{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:white}.scannerbody{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}.pendingmark{font-size:9px;color:var(--a);font-weight:700;margin-top:5px}
@media(min-width:640px){.app{padding:18px}.modalbg{align-items:center;padding:20px}.modal{border-radius:20px}.stats{grid-template-columns:repeat(5,1fr)}}
</style>

<body>

<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374',measurementId:'G-ZGF5DT9D0K'};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const STORAGE={NAME:'inventory_user_name_v2',TOKEN:'inventory_admin_token_v2',EMPLOYEE_ID:'inventory_employee_id_v2',AUTH_VERSION:'inventory_employee_auth_version_v2'};
const ADMIN_HASH='1jh297-spgf2z';
const CONTROL_DOC='stocktake_feature';
const DEFAULT_CONTROL={enabled:false,accessMode:'none',allowedEmployeeIds:[],allowedEmployeeNames:[],activeCampaignId:''};
const $=s=>document.querySelector(s);const app=$('#app');
const state={control:null,campaign:null,teams:[],team:null,items:[],filter:'all',search:'',visible:80,noteItem:null,scanner:null,unsubs:[]};
const user={name:(localStorage.getItem(STORAGE.NAME)||'').trim(),employeeId:(localStorage.getItem(STORAGE.EMPLOYEE_ID)||'').trim(),token:localStorage.getItem(STORAGE.TOKEN)||'',authVersion:localStorage.getItem(STORAGE.AUTH_VERSION)||''};
user.isAdmin=user.name==='مهند'&&user.token===ADMIN_HASH;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar='٠١٢٣٤٥٦٧٨٩',fa='۰۱۲۳۴۵۶۷۸۹';
const eng=s=>String(s??'').replace(/[٠-٩۰-۹]/g,d=>{let i=ar.indexOf(d);return i>=0?String(i):String(fa.indexOf(d))});
const norm=s=>eng(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06ffa-z0-9\s._-]/g,' ').replace(/\s+/g,' ').trim();
const n=v=>Number(eng(v).replace(/[٬,]/g,'').replace(/٫/g,'.'));
const fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(v)||0);
const statusOf=(actual,expected)=>Number(actual)===Number(expected)?'matched':Number(actual)<Number(expected)?'shortage':'surplus';
const statusLabel=s=>({pending:'غير مجرود',matched:'مطابق',shortage:'ناقص',surplus:'زائد'}[s]||s);
const toast=m=>{const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)};
const canAccess=c=>{if(user.isAdmin)return true;if(!c?.enabled)return false;const mode=c.accessMode||'none';if(mode==='all')return true;if(mode==='admin_only'||mode==='none')return false;const ids=new Set(c.allowedEmployeeIds||[]),names=new Set((c.allowedEmployeeNames||[]).map(norm));return mode==='selected'&&(ids.has(user.employeeId)||names.has(norm(user.name)))};
const destroy=()=>{state.unsubs.splice(0).forEach(fn=>{try{fn()}catch{}});stopScanner()};
window.addEventListener('beforeunload',destroy);
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
if(!user.name||(!user.isAdmin&&(!user.employeeId||user.authVersion!=='2'))){location.href='./index.html?employee=1'}else start();
function start(){
  const u=db.collection('system_controls').doc(CONTROL_DOC).onSnapshot(doc=>{state.control={...DEFAULT_CONTROL,...(doc.exists?doc.data():{})};bindCampaign()},()=>{app.innerHTML=lockHtml('تعذر قراءة إعدادات الجرد','تحقق من الاتصال ثم أعد المحاولة.')});state.unsubs.push(u);
}
let campaignBound='';
function bindCampaign(){
  const c=state.control;
  if(!canAccess(c)){unbindCampaign();app.innerHTML=lockHtml(c?.enabled?'الجرد غير مسند لحسابك':'الجرد غير مفعّل حاليًا','لن يظهر لك الجرد إلا عند تفعيله وإسناده لك من الإدارة.');return}
  const id=String(c.activeCampaignId||'').trim();
  if(!id){unbindCampaign();app.innerHTML=lockHtml('لا توجد حملة جرد نشطة','الميزة مفعّلة لكن الإدارة لم تبدأ حملة جرد بعد.');return}
  if(campaignBound===id)return;unbindCampaign();campaignBound=id;
  state.unsubs.push(db.collection('stocktake_campaigns').doc(id).onSnapshot(d=>{if(!d.exists){state.campaign=null;render();return}state.campaign={id:d.id,...d.data()};render()},()=>{}));
  state.unsubs.push(db.collection('stocktake_teams').where('campaignId','==',id).onSnapshot(s=>{state.teams=s.docs.map(d=>({id:d.id,...d.data()}));pickTeam()},()=>{}));
}
function unbindCampaign(){campaignBound='';state.campaign=null;state.teams=[];state.team=null;state.items=[];if(itemsUnsub){try{itemsUnsub()}catch{}itemsUnsub=null}while(state.unsubs.length>1){const fn=state.unsubs.pop();try{fn()}catch{}}}
let itemsUnsub=null;
function pickTeam(){
  const assigned=state.teams.filter(t=>user.isAdmin||t.assignedEmployeeId===user.employeeId||norm(t.assignedEmployeeName)===norm(user.name));
  state.team=assigned[0]||null;
  if(itemsUnsub){itemsUnsub();itemsUnsub=null}
  if(!state.team){state.items=[];render();return}
  itemsUnsub=db.collection('stocktake_items').where('teamId','==',state.team.id).onSnapshot({includeMetadataChanges:true},s=>{state.items=s.docs.map(d=>({id:d.id,...d.data(),_pending:d.metadata.hasPendingWrites})).sort((a,b)=>(a.orderIndex??999999)-(b.orderIndex??999999)||String(a.sku).localeCompare(String(b.sku),'en'));render()},()=>{toast('تعذر مزامنة أصناف الجرد')});
}
function lockHtml(title,note){return `<div class="lock"><h2>${esc(title)}</h2><p>${esc(note)}</p><button class="btn" style="padding:0 18px;margin-top:12px" onclick="location.href='./index.html?employee=1'">العودة للنظام</button></div>`}
function render(){
  if(!state.control||!canAccess(state.control))return;
  if(!state.campaign){app.innerHTML=lockHtml('جاري تجهيز حملة الجرد','انتظر لحظات...');return}
  if(!state.team&&!user.isAdmin){app.innerHTML=lockHtml('لا توجد مهمة جرد مسندة لك','اطلب من الإدارة إسناد فريق الجرد إلى حسابك.');return}
  if(user.isAdmin&&!state.team&&state.teams.length){state.team=state.teams[0];pickTeam();return}
  if(!state.team){app.innerHTML=lockHtml('لا توجد فرق في هذه الحملة','أنشئ الفرق من لوحة إدارة الجرد أولًا.');return}
  const items=state.items,total=items.length,counted=items.filter(i=>i.countStatus&&i.countStatus!=='pending').length,pending=total-counted,short=items.filter(i=>i.countStatus==='shortage').length,notes=items.filter(i=>String(i.note||'').trim()).length,progress=total?Math.round(counted/total*100):0;
  const filtered=items.filter(i=>{if(state.filter==='pending'&&(i.countStatus&&i.countStatus!=='pending'))return false;if(state.filter==='matched'&&i.countStatus!=='matched')return false;if(state.filter==='shortage'&&i.countStatus!=='shortage')return false;if(state.filter==='surplus'&&i.countStatus!=='surplus')return false;if(state.filter==='notes'&&!String(i.note||'').trim())return false;const q=norm(state.search);return !q||norm(`${i.sku} ${i.name||''}`).includes(q)});
  const shown=filtered.slice(0,state.visible),readonly=state.campaign.status==='closed';
  app.innerHTML=`<div class="top"><div class="head"><button class="back" id="backBtn">‹</button><div class="grow"><div class="title">${esc(state.campaign.name||'الجرد')}</div><div class="sub">${esc(state.team.name||'الفريق')} · ${esc(state.team.zone||'بدون جهة')}${state.team.counterName?` · العد: ${esc(state.team.counterName)}`:''}</div></div><span class="net ${navigator.onLine?'':'off'}">${navigator.onLine?'متصل':'بدون اتصال'}</span></div></div>
  <div class="panel"><div class="stats"><div class="stat"><b>${total}</b><span>الأصناف</span></div><div class="stat"><b>${counted}</b><span>تم الجرد</span></div><div class="stat"><b>${pending}</b><span>متبقي</span></div><div class="stat"><b>${short}</b><span>نواقص</span></div><div class="stat" style="display:${innerWidth>=640?'block':'none'}"><b>${notes}</b><span>ملاحظات</span></div></div><div class="progress"><i style="width:${progress}%"></i></div><div class="sub" style="margin-top:6px">الإنجاز ${progress}%${readonly?' · الحملة مغلقة للقراءة فقط':''}</div></div>
  <div class="panel"><div class="filters">${filterChip('all','الكل',total)}${filterChip('pending','غير مجرود',pending)}${filterChip('matched','كامل',items.filter(i=>i.countStatus==='matched').length)}${filterChip('shortage','النواقص',short)}${filterChip('surplus','الزيادات',items.filter(i=>i.countStatus==='surplus').length)}${filterChip('notes','ملاحظات',notes)}</div><div class="searchrow"><input id="search" class="search" value="${esc(state.search)}" placeholder="ابحث برقم الصنف أو الاسم"><button id="scanBtn" class="scan" title="مسح الباركود">▣</button></div></div>
  <div class="list">${shown.length?shown.map(i=>cardHtml(i,readonly)).join(''):'<div class="empty">لا توجد أصناف مطابقة لهذا الفرز.</div>'}</div>${shown.length<filtered.length?'<button id="loadMore" class="loadmore">إظهار المزيد</button>':''}`;
  bindUi(readonly);
}
function filterChip(id,label,count){return `<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${label} <span>${count}</span></button>`}
function cardHtml(i,readonly){const st=i.countStatus||'pending',actual=st==='pending'?'—':fmt(i.actualQty),diff=st==='pending'?'—':fmt(Number(i.actualQty)-Number(i.expectedQty));return `<article class="card ${st}" data-id="${i.id}"><div class="meta"><div class="grow"><div class="sku">${esc(i.sku)}</div><div class="name">${esc(i.name||'')}</div></div><span class="pill ${st==='matched'?'ok':st==='shortage'?'bad':st==='surplus'?'info':''}">${statusLabel(st)}</span></div><div class="qtygrid"><div class="q"><span>المطلوب</span><b>${fmt(i.expectedQty)}</b></div><div class="q"><span>الموجود</span><b>${actual}</b></div><div class="q"><span>الشد</span><b>${esc(i.pack??'—')}</b></div></div>${st!=='pending'?`<div class="diff">الفرق: <b>${diff}</b>${i.updatedByName?` · آخر تسجيل: ${esc(i.updatedByName)}`:''}</div>`:''}${i._pending?'<div class="pendingmark">بانتظار المزامنة...</div>':''}<div class="actions"><button class="btn full" data-full="${i.id}" ${readonly?'disabled':''}>كاملة ✓</button><button class="btn entry" data-entry="${i.id}" ${readonly?'disabled':''}>${st==='pending'?'إدخال الموجود':'تعديل الموجود'}</button><button class="btn note ${String(i.note||'').trim()?'has':''}" data-note="${i.id}" ${readonly?'disabled':''} title="ملاحظة">⋯</button></div><div class="editbox" id="edit_${i.id}"><div class="editrow"><input class="actual" id="actual_${i.id}" inputmode="decimal" value="${st==='pending'?'':esc(i.actualQty)}" placeholder="الكمية الفعلية"><button class="save" data-save="${i.id}">اعتماد</button></div><div class="diff" id="preview_${i.id}"></div></div></article>`}
function bindUi(readonly){
  $('#backBtn')?.addEventListener('click',()=>location.href='./index.html?employee=1');
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;state.visible=80;render()});
  const se=$('#search');if(se)se.oninput=e=>{const v=e.target.value,pos=e.target.selectionStart??v.length;state.search=v;state.visible=80;render();const next=$('#search');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}};
  $('#loadMore')?.addEventListener('click',()=>{state.visible+=80;render()});
  $('#scanBtn')?.addEventListener('click',startScanner);
  if(readonly)return;
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>markFull(b.dataset.full));
  document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{const box=$(`#edit_${CSS.escape(b.dataset.entry)}`);box?.classList.toggle('open');if(box?.classList.contains('open'))$(`#actual_${CSS.escape(b.dataset.entry)}`)?.focus()});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveActual(b.dataset.save));
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note));
  document.querySelectorAll('.actual').forEach(inp=>inp.oninput=()=>{const id=inp.id.replace('actual_',''),it=state.items.find(x=>x.id===id);if(!it)return;const v=n(inp.value),el=$(`#preview_${CSS.escape(id)}`);if(el)el.textContent=Number.isFinite(v)?`الفرق: ${fmt(v-Number(it.expectedQty))}`:''});
}
async function writeCount(item,actual,source){
  if(state.campaign?.status==='closed')return toast('الحملة مغلقة');
  if(!Number.isFinite(actual)||actual<0)return toast('أدخل كمية صحيحة');
  const before={actualQty:item.actualQty??null,countStatus:item.countStatus||'pending',note:item.note||''},status=statusOf(actual,item.expectedQty),now=firebase.firestore.FieldValue.serverTimestamp();
  const patch={actualQty:actual,countStatus:status,difference:actual-Number(item.expectedQty),counted:true,updatedAt:now,updatedByEmployeeId:user.employeeId||null,updatedByName:user.name,revision:firebase.firestore.FieldValue.increment(1),lastInputSource:source};
  try{const batch=db.batch();batch.set(db.collection('stocktake_items').doc(item.id),patch,{merge:true});batch.set(db.collection('stocktake_audit').doc(),{campaignId:item.campaignId,teamId:item.teamId,itemId:item.id,sku:item.sku,action:'count_updated',before,after:{actualQty:actual,countStatus:status,difference:patch.difference},actorEmployeeId:user.employeeId||null,actorName:user.name,createdAt:now,source,userAgent:navigator.userAgent||''});await batch.commit();toast(status==='matched'?'تم الاعتماد: مطابق':status==='shortage'?`تم الاعتماد: ناقص ${fmt(Number(item.expectedQty)-actual)}`:`تم الاعتماد: زائد ${fmt(actual-Number(item.expectedQty))}`)}catch(e){console.error(e);toast('تعذر الحفظ، حاول مرة أخرى')}
}
function markFull(id){const it=state.items.find(x=>x.id===id);if(it)writeCount(it,Number(it.expectedQty),'full_button')}
function saveActual(id){const it=state.items.find(x=>x.id===id),inp=$(`#actual_${CSS.escape(id)}`);if(!it||!inp)return;const v=n(inp.value);writeCount(it,v,'manual').then(()=>{const box=$(`#edit_${CSS.escape(id)}`);box?.classList.remove('open')})}
function openNote(id){const it=state.items.find(x=>x.id===id);if(!it)return;state.noteItem=it;$('#noteSku').textContent=`الصنف ${it.sku}`;$('#noteText').value=it.note||'';$('#noteModal').classList.add('open');setTimeout(()=>$('#noteText').focus(),80)}
$('#noteCancel').onclick=()=>{$('#noteModal').classList.remove('open');state.noteItem=null};$('#noteModal').onclick=e=>{if(e.target.id==='noteModal')$('#noteCancel').click()};
$('#noteSave').onclick=async()=>{const it=state.noteItem;if(!it)return;const note=$('#noteText').value.trim(),now=firebase.firestore.FieldValue.serverTimestamp();try{const batch=db.batch();batch.set(db.collection('stocktake_items').doc(it.id),{note,hasNote:!!note,noteUpdatedAt:now,noteUpdatedBy:user.name},{merge:true});batch.set(db.collection('stocktake_audit').doc(),{campaignId:it.campaignId,teamId:it.teamId,itemId:it.id,sku:it.sku,action:'note_updated',before:{note:it.note||''},after:{note},actorEmployeeId:user.employeeId||null,actorName:user.name,createdAt:now});await batch.commit();$('#noteCancel').click();toast(note?'تم حفظ الملاحظة':'تم حذف الملاحظة')}catch(e){toast('تعذر حفظ الملاحظة')}};
async function startScanner(){if(state.scanner)return;$('#scanner').classList.add('open');try{const scanner=new Html5Qrcode('reader');state.scanner=scanner;await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:260,height:180}},txt=>{state.search=txt.trim();stopScanner();state.filter='all';state.visible=80;render();toast('تم قراءة رقم الصنف')},()=>{})}catch(e){stopScanner();toast('تعذر تشغيل الكاميرا')}}
async function stopScanner(){const s=state.scanner;state.scanner=null;if(s){try{await s.stop()}catch{}try{await s.clear()}catch{}}$('#scanner')?.classList.remove('open')}
$('#closeScanner').onclick=stopScanner;
</script>
