<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f6"><title>الإدارة | بيت الأواني الطيبة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./v52-admin.css?v=52.0"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script></head><body><main id="home" class="v52-page"><div class="v52-empty">جاري تجهيز لوحة الإدارة...</div></main><script>
const ADMIN_HASH='1jh297-spgf2z';if(!(String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH))location.replace('./index.html?employee=1');
const cfg={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374'};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(n,d=0)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(n)||0);const money=n=>num(n,0)+' ر.س';const ms=v=>{try{return v?.toMillis?.()||v?.seconds*1000||new Date(v).getTime()||0}catch{return 0}};const dt=v=>{const n=ms(v)||new Date(v).getTime();return n?new Date(n).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—'};const online=v=>Date.now()-ms(v)<180000;const saleQty=c=>c.delta<0?Math.max(0,-Number(c.delta||0)-Number(c.transferMatchedQty||0)):0;
const S={analytics:null,employees:[],customers:[],es:[],cs:[],orders:[],customerOrders:[],carts:[],activity:[],search:[],errors:[]};
async function get(col,limit=400,order){try{let q=db.collection(col);if(order)q=q.orderBy(order,'desc');q=q.limit(limit);const s=await q.get();return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){S.errors.push(col);return[]}}
function sales(days=30){const cut=Date.now()-days*86400000,t={qty:0,value:0,j:0,r:0,events:[],items:new Map()};for(const e of S.analytics?.events||[]){const tm=new Date(e.timestamp).getTime();if(tm<cut)continue;let ej=0,er=0;for(const c of e.changes||[]){const q=saleQty(c);if(!q)continue;t.qty+=q;t.value+=q*Number(c.price||0);if(c.branch==='jeddah'){t.j+=q;ej+=q}else{t.r+=q;er+=q}const x=t.items.get(c.sku)||{sku:c.sku,name:c.name,qty:0,value:0};x.qty+=q;x.value+=q*Number(c.price||0);t.items.set(c.sku,x)}t.events.push({date:e.timestamp,j:ej,r:er,total:ej+er})}return t}
function lineChart(rows){if(!rows.length)return'<div class="v52-empty">لا توجد حركة في الفترة.</div>';const arr=rows.slice().reverse().slice(-24),w=760,h=220,p=24,max=Math.max(1,...arr.map(x=>Math.max(x.j,x.r))),pts=(k)=>arr.map((x,i)=>`${p+i*(w-2*p)/Math.max(1,arr.length-1)},${h-p-(x[k]/max)*(h-2*p)}`).join(' ');return `<div class="v52-chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="اتجاه المبيعات"><defs><linearGradient id="gJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f6b4f" stop-opacity=".18"/><stop offset="1" stop-color="#0f6b4f" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(v=>`<line x1="${p}" y1="${p+v*(h-2*p)}" x2="${w-p}" y2="${p+v*(h-2*p)}" stroke="#edf0ee"/>`).join('')}<polyline points="${pts('j')}" fill="none" stroke="#0f6b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts('r')}" fill="none" stroke="#296f92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="v52-legend"><span><i style="background:#0f6b4f"></i>جدة</span><span><i style="background:#296f92"></i>الرياض</span></div></div>`}
function branchCompare(s){const total=Math.max(1,s.j+s.r),jp=s.j/total*100,rp=s.r/total*100;return `<div class="v52-list"><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">جدة</div><div class="v52-row-sub">${num(jp,1)}% من الكمية المباعة</div><div class="v52-progress" style="margin-top:7px"><i style="width:${jp}%"></i></div></div><div class="v52-row-value">${num(s.j)}</div></div><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">الرياض</div><div class="v52-row-sub">${num(rp,1)}% من الكمية المباعة</div><div class="v52-progress" style="margin-top:7px"><i style="width:${rp}%;background:#296f92"></i></div></div><div class="v52-row-value">${num(s.r)}</div></div></div>`}
function render(){const s=sales(30),onE=S.es.filter(x=>online(x.lastActive)).length,onC=S.cs.filter(x=>online(x.lastActive||x.updatedAt)).length,orders30=[...S.orders,...S.customerOrders].filter(x=>Date.now()-ms(x.createdAt||x.timestamp)<30*86400000).length,stock=S.analytics?.current||{},top=[...s.items.values()].sort((a,b)=>b.qty-a.qty).slice(0,8),zero=S.search.filter(x=>Number(x.resultsCount)===0&&Date.now()-ms(x.time)<86400000).length,abandoned=S.carts.filter(c=>Number(c.itemCount||0)>0&&Date.now()-ms(c.updatedAt||c.lastNonEmptyAt)>2*3600000).length;document.getElementById('home').innerHTML=`<div class="v52-page-head"><div><div class="v52-eyebrow">نظرة تنفيذية</div><h1 class="v52-page-title">لوحة الإدارة</h1><div class="v52-page-sub">ملخص واحد لحركة المبيعات والمخزون والمستخدمين والتشغيل.</div></div><div class="v52-head-actions"><a class="v52-btn soft" href="./inventory-analytics.html">تحليل المبيعات</a><a class="v52-btn" href="./admin-dashboard.html?section=employees&module=live">الموظفون الآن</a></div></div><div class="v52-grid v52-kpis"><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">المبيعات — 30 يوم</span><span class="v52-chip ok">كمية</span></div><div class="v52-kpi-value">${num(s.qty)}</div><div class="v52-kpi-sub">النقص الصافي بعد استبعاد التحويل المطابق</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">قيمة المبيعات التقديرية</span><span class="v52-chip ok">30 يوم</span></div><div class="v52-kpi-value" style="font-size:21px">${money(s.value)}</div><div class="v52-kpi-sub">حسب أسعار ملف التسعير في كل تحديث</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">متصلون الآن</span><span class="v52-chip">مباشر</span></div><div class="v52-kpi-value">${num(onE+onC)}</div><div class="v52-kpi-sub">${onE} موظف · ${onC} عميل</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">الطلبات — 30 يوم</span><span class="v52-chip">كل القنوات</span></div><div class="v52-kpi-value">${num(orders30)}</div><div class="v52-kpi-sub">طلبات الموظفين والعملاء المسجلة</div></div></div><div class="v52-grid v52-split" style="margin-top:12px"><section class="v52-card"><div class="v52-card-head"><div><h2>اتجاه المبيعات</h2><p>مقارنة حركة البيع بين جدة والرياض عبر آخر تحديثات المخزون.</p></div><span class="v52-chip ok">30 يوم</span></div><div class="v52-card-body">${lineChart(s.events)}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>مقارنة الفرعين</h2><p>توزيع الكمية المباعة.</p></div></div><div class="v52-card-body">${branchCompare(s)}<div class="v52-divider"></div><div class="v52-list"><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">مخزون جدة الحالي</div></div><div class="v52-row-value">${num(stock.jeddah?.totalQty)}</div></div><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">مخزون الرياض الحالي</div></div><div class="v52-row-value">${num(stock.riyadh?.totalQty)}</div></div></div></div></section></div><div class="v52-grid v52-half" style="margin-top:12px"><section class="v52-card"><div class="v52-card-head"><div><h2>الأصناف الأكثر مبيعًا</h2><p>حسب صافي النقص من المخزون.</p></div><a class="v52-btn" href="./inventory-analytics.html">عرض الكل</a></div><div class="v52-card-body v52-list">${top.map((x,i)=>`<div class="v52-list-row"><span class="v52-chip">${i+1}</span><div class="v52-row-main"><div class="v52-row-title">${esc(x.name||x.sku)}</div><div class="v52-row-sub">${esc(x.sku)} · ${money(x.value)}</div></div><div class="v52-row-value">${num(x.qty)}</div></div>`).join('')||'<div class="v52-empty">لا توجد بيانات.</div>'}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>يحتاج انتباهك</h2><p>استثناءات تشغيلية مختصرة بدل إغراقك بالسجلات.</p></div></div><div class="v52-card-body v52-list"><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">بحث بدون نتائج — 24 ساعة</div><div class="v52-row-sub">قد يعني رقم صنف أو تسمية تحتاج مراجعة</div></div><span class="v52-chip ${zero?'warn':'ok'}">${zero}</span></div><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">سلال غير مكتملة</div><div class="v52-row-sub">سلة غير فارغة لم تتحدث منذ أكثر من ساعتين</div></div><span class="v52-chip ${abandoned?'warn':'ok'}">${abandoned}</span></div><div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">حالة مصادر البيانات</div><div class="v52-row-sub">Firebase + حركة المخزون</div></div><span class="v52-chip ${S.errors.length?'bad':'ok'}">${S.errors.length?'مراجعة':'سليم'}</span></div></div></section></div>`}
async function boot(){try{const r=await fetch('./data/inventory-analytics.json?v='+Date.now(),{cache:'no-store'});S.analytics=await r.json()}catch(e){S.errors.push('analytics')}const res=await Promise.all([get('employee_accounts',500),get('customers',800),get('site_sessions',500,'lastActive'),get('customer_sessions',500,'lastActive'),get('orders',500,'timestamp'),get('customer_orders',500,'createdAt'),get('v44_live_carts',500),get('search_logs',500,'time'),get('v44_activity_logs',100,'createdAt')]);[S.employees,S.customers,S.es,S.cs,S.orders,S.customerOrders,S.carts,S.search,S.activity]=res;render()}boot();
</script><script src="./v46-admin-nav.js?v=52.0"></script></body></html>
