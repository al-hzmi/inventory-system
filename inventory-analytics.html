<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<title>حركة الأصناف | إدارة بيت الأواني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./v52-admin.css?v=52.0">
<style>
:root{--move-green:#0f6b4f;--move-red:#b42318;--move-blue:#296f92;--move-bg:#f7f9f8}
*{box-sizing:border-box}.movement-toolbar{display:grid;grid-template-columns:1.25fr .72fr .72fr;gap:8px}.movement-search{width:100%;min-height:44px;border:1px solid var(--v52-border);border-radius:12px;background:#fff;padding:9px 12px;color:var(--v52-ink);font:600 12px/1.6 inherit;outline:none;resize:vertical}.movement-select{height:44px;border:1px solid var(--v52-border);border-radius:12px;background:#fff;padding:0 11px;color:var(--v52-ink);font:600 11px/1.4 inherit;outline:none}.movement-search:focus,.movement-select:focus{border-color:#9fbcae;box-shadow:0 0 0 3px rgba(15,107,79,.08)}.period-tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding:2px 0}.period-tabs::-webkit-scrollbar{display:none}.period-tab{min-width:max-content;height:38px;padding:0 13px;border:1px solid var(--v52-border);background:#fff;border-radius:11px;color:var(--v52-muted);font:700 10px/1 inherit;cursor:pointer}.period-tab.on{background:#18221e;color:#fff;border-color:#18221e}.movement-note{font-size:10px;line-height:1.8;color:#526057;background:#edf6f1;border:1px solid #d7e8df;border-radius:13px;padding:10px 12px}.movement-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.move-kpi{background:#fff;border:1px solid var(--v52-border);border-radius:14px;padding:12px}.move-kpi small{display:block;color:var(--v52-muted);font-size:8px}.move-kpi b{display:block;font-size:20px;margin-top:3px;direction:ltr;text-align:right}.move-kpi span{display:block;color:var(--v52-muted);font-size:8px;margin-top:2px}.movement-table-wrap{overflow:auto;border:1px solid var(--v52-border);border-radius:14px;background:#fff}.movement-table{width:100%;border-collapse:collapse;min-width:900px}.movement-table th,.movement-table td{padding:10px 9px;border-bottom:1px solid #edf0ee;text-align:right;font-size:10px;white-space:nowrap}.movement-table th{position:sticky;top:0;background:#f8faf9;color:#66736c;font-size:8px;z-index:1}.movement-table td.name{max-width:270px;overflow:hidden;text-overflow:ellipsis}.movement-table tr:last-child td{border-bottom:0}.delta-down{color:var(--move-red);font-weight:700}.delta-up{color:var(--move-green);font-weight:700}.movement-cards{display:none}.move-card{border:1px solid var(--v52-border);border-radius:14px;padding:11px;background:#fff}.move-card-head{display:flex;gap:8px;align-items:flex-start}.move-card-main{flex:1;min-width:0}.move-card-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.move-card-sub{font-size:8px;color:var(--v52-muted);margin-top:3px}.move-card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.move-card-grid div{background:var(--move-bg);border-radius:9px;padding:7px}.move-card-grid small{display:block;font-size:7px;color:var(--v52-muted)}.move-card-grid b{display:block;font-size:11px;margin-top:2px;direction:ltr;text-align:right}.status-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:99px;font-size:8px;font-weight:700;background:#eef2f0;color:#526057}.status-chip.down{background:#fff1f0;color:#9f1c14}.status-chip.up{background:#eef8f3;color:#0b6549}.status-chip.transfer{background:#eef5fa;color:#245f7e}.missing-box{border:1px dashed #d9dfdc;border-radius:12px;background:#fbfcfb;padding:10px 12px;font-size:9px;line-height:1.8;color:#66736c}.missing-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.missing-list span{background:#fff;border:1px solid #e4e9e6;border-radius:8px;padding:4px 7px;direction:ltr}.movement-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--v52-muted);font-size:8px}.empty-state{padding:36px 18px;text-align:center;color:var(--v52-muted);font-size:11px;line-height:1.8}.sku-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.sku-summary-card{border:1px solid var(--v52-border);border-radius:12px;padding:10px;background:#fff;min-width:0}.sku-summary-card b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sku-summary-card span{display:block;font-size:8px;color:var(--v52-muted);margin-top:3px}.sku-summary-card strong{display:block;font-size:13px;margin-top:5px;direction:ltr;text-align:right}
@media(max-width:820px){.movement-toolbar{grid-template-columns:1fr 1fr}.movement-search{grid-column:1/-1}.movement-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.sku-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.movement-table-wrap{display:none}.movement-cards{display:grid;gap:8px}.movement-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.sku-summary{grid-template-columns:1fr}.v52-page{padding-left:12px!important;padding-right:12px!important}}
</style>
</head>
<body>
<main id="movement" class="v52-page"><div class="v52-empty">جاري تحميل حركة الأصناف...</div></main>
<script>
const ADMIN_HASH='1jh297-spgf2z';let ADMIN_PHOTO=null;try{ADMIN_PHOTO=JSON.parse(localStorage.getItem('inventory_login_photo_proof_v2')||'null')}catch{}const ADMIN_LOCAL_QA=['localhost','127.0.0.1'].includes(location.hostname);if(!(String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH&&(ADMIN_LOCAL_QA||(ADMIN_PHOTO?.role==='admin'&&ADMIN_PHOTO?.photoId))))location.replace('./index.html?employee=1');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s??'').replace(/[٠-٩۰-۹]/g,d=>{const a='٠١٢٣٤٥٦٧٨٩',e='۰۱۲۳۴۵۶۷۸۹',i=a.indexOf(d);return i>=0?String(i):String(e.indexOf(d))});
const norm=s=>digits(s).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const num=(n,d=0)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(n)||0);
const dt=s=>{try{return new Date(s).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh',dateStyle:'medium',timeStyle:'short'})}catch{return'—'}};
const dayKey=value=>{const d=value instanceof Date?value:new Date(value),parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),get=t=>parts.find(x=>x.type===t)?.value||'';return `${get('year')}-${get('month')}-${get('day')}`};
const todayKey=()=>dayKey(new Date()),offsetKey=n=>dayKey(new Date(Date.now()+n*86400000));
const S={data:null,period:'today',branch:'all',kind:'decrease',q:'',error:''};
function periodLabel(){return({today:'اليوم',yesterday:'أمس',dayBefore:'قبل أمس','7':'آخر 7 أيام','30':'آخر 30 يوم',all:'كل السجل'})[S.period]||S.period}
function inPeriod(timestamp){const t=new Date(timestamp).getTime();if(!Number.isFinite(t))return false;if(S.period==='all')return true;if(S.period==='today')return dayKey(timestamp)===todayKey();if(S.period==='yesterday')return dayKey(timestamp)===offsetKey(-1);if(S.period==='dayBefore')return dayKey(timestamp)===offsetKey(-2);return Date.now()-t<=Number(S.period)*86400000}
function numericTokens(){return digits(S.q).split(/[\s,،;|]+/).map(x=>x.replace(/\D/g,'')).filter(Boolean)}
function matchesQuery(c){const raw=String(S.q||'').trim();if(!raw)return true;const tokens=numericTokens();if(tokens.length)return tokens.some(t=>String(c.sku||'').replace(/\D/g,'')===t);return norm(`${c.sku} ${c.name}`).includes(norm(raw))}
function kindMatch(c){const d=Number(c.delta||0),tr=Number(c.transferMatchedQty||0);if(S.kind==='all')return true;if(S.kind==='decrease')return d<0;if(S.kind==='increase')return d>0;if(S.kind==='zero')return !!c.zeroed;if(S.kind==='transfer')return tr>0;return true}
function allPeriodChanges(){return(S.data?.events||[]).filter(e=>inPeriod(e.timestamp)).flatMap(e=>(e.changes||[]).map(c=>({...c,timestamp:e.timestamp,event:e.id,message:e.message||'تحديث مخزون'})))}
function rows(){return allPeriodChanges().filter(c=>(S.branch==='all'||c.branch===S.branch)&&matchesQuery(c)&&kindMatch(c)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))}
function chip(c){const d=Number(c.delta||0),tr=Number(c.transferMatchedQty||0);if(tr>0)return'<span class="status-chip transfer">تحويل</span>';if(d<0)return'<span class="status-chip down">نقص</span>';if(d>0)return'<span class="status-chip up">زيادة</span>';return'<span class="status-chip">حركة</span>'}
function missingSearched(rowsNow){const tokens=numericTokens();if(!tokens.length)return[];const seen=new Set(rowsNow.map(c=>String(c.sku||'').replace(/\D/g,'')));return [...new Set(tokens)].filter(x=>!seen.has(x))}
function skuSummaries(rowsNow){const map=new Map();for(const c of rowsNow){const key=String(c.sku),x=map.get(key)||{sku:key,name:c.name||'',events:0,net:0,last:c.timestamp,branch:new Set()};x.events++;x.net+=Number(c.delta||0);x.branch.add(c.branchLabel||c.branch);if(new Date(c.timestamp)>new Date(x.last))x.last=c.timestamp;map.set(key,x)}return[...map.values()].sort((a,b)=>new Date(b.last)-new Date(a.last))}
function render(){if(!S.data){document.getElementById('movement').innerHTML=`<div class="empty-state">${esc(S.error||'جاري تحميل حركة الأصناف...')}</div>`;return}const r=rows(),all=allPeriodChanges().filter(c=>S.branch==='all'||c.branch===S.branch),skus=new Set(r.map(c=>c.sku)),decrease=r.filter(c=>Number(c.delta)<0).reduce((a,c)=>a+Math.abs(Number(c.delta||0)),0),increase=r.filter(c=>Number(c.delta)>0).reduce((a,c)=>a+Number(c.delta||0),0),zero=r.filter(c=>c.zeroed).length,missing=missingSearched(r),summaries=skuSummaries(r),current=S.data.current||{};
document.getElementById('movement').innerHTML=`
<div class="v52-page-head"><div><div class="v52-eyebrow">لوحة التحكم · المخزون</div><h1 class="v52-page-title">حركة الأصناف</h1><div class="v52-page-sub">اعرف بالضبط أي صنف تحرك، متى تحرك، وفي أي فرع، والكمية قبل وبعد.</div></div><div class="v52-head-actions"><a class="v52-btn soft" href="./admin-home.html">العودة للإدارة</a><a class="v52-btn" href="./index.html?employee=1">فتح المخزون</a></div></div>
<div class="movement-note"><b>طريقة القراءة:</b> «النقص» يعني أن الكمية في ملف المخزون أصبحت أقل من التحديث السابق. «الزيادة» تعني دخول كمية. والتحويل المتطابق بين جدة والرياض في نفس التحديث يظهر كتحويل. السجل مبني آليًا من تاريخ تحديثات المخزون، وليس من تخمينات المتصفح.</div>
<div class="period-tabs" style="margin-top:12px">${[['today','اليوم'],['yesterday','أمس'],['dayBefore','قبل أمس'],['7','آخر 7 أيام'],['30','آخر 30 يوم'],['all','كل السجل']].map(([v,l])=>`<button class="period-tab ${S.period===v?'on':''}" data-period="${v}">${l}</button>`).join('')}</div>
<div class="movement-toolbar" style="margin-top:9px"><textarea id="q" class="movement-search" rows="1" placeholder="رقم صنف واحد أو عدة أرقام — مثال: 230086، 230100، 230120">${esc(S.q)}</textarea><select id="branch" class="movement-select"><option value="all">جدة + الرياض</option><option value="jeddah" ${S.branch==='jeddah'?'selected':''}>جدة فقط</option><option value="riyadh" ${S.branch==='riyadh'?'selected':''}>الرياض فقط</option></select><select id="kind" class="movement-select"><option value="decrease" ${S.kind==='decrease'?'selected':''}>النقص فقط</option><option value="all" ${S.kind==='all'?'selected':''}>كل الحركة</option><option value="increase" ${S.kind==='increase'?'selected':''}>الزيادة فقط</option><option value="zero" ${S.kind==='zero'?'selected':''}>وصل للصفر</option><option value="transfer" ${S.kind==='transfer'?'selected':''}>التحويلات</option></select></div>
<div class="movement-kpis" style="margin-top:11px"><div class="move-kpi"><small>أصناف تحركت</small><b>${num(skus.size)}</b><span>${esc(periodLabel())}</span></div><div class="move-kpi"><small>إجمالي النقص</small><b class="delta-down">-${num(decrease)}</b><span>حسب الفلتر الحالي</span></div><div class="move-kpi"><small>إجمالي الزيادة</small><b class="delta-up">+${num(increase)}</b><span>حسب الفلتر الحالي</span></div><div class="move-kpi"><small>وصلت للصفر</small><b>${num(zero)}</b><span>${num(r.length)} حركة معروضة</span></div></div>
${missing.length?`<div class="missing-box" style="margin-top:10px"><b>أصناف لا توجد لها حركة مطابقة للفلاتر الحالية ضمن ${esc(periodLabel())}:</b><div class="missing-list">${missing.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:''}
${S.q&&summaries.length?`<section class="v52-card" style="margin-top:10px"><div class="v52-card-head"><div><h2>ملخص الأصناف المطلوبة</h2><p>آخر حركة وصافي التغير لكل رقم صنف ضمن الفترة.</p></div><span class="v52-chip">${summaries.length}</span></div><div class="v52-card-body"><div class="sku-summary">${summaries.slice(0,60).map(x=>`<div class="sku-summary-card"><b>${esc(x.name||x.sku)}</b><span>${esc(x.sku)} · ${[...x.branch].map(esc).join(' + ')}</span><strong class="${x.net<0?'delta-down':'delta-up'}">${x.net>0?'+':''}${num(x.net)}</strong><span>${num(x.events)} حركة · آخرها ${dt(x.last)}</span></div>`).join('')}</div></div></section>`:''}
<section class="v52-card" style="margin-top:10px"><div class="v52-card-head"><div><h2>السجل التفصيلي</h2><p>${num(r.length)} حركة · ${esc(periodLabel())}</p></div><div class="movement-meta"><span>جدة الآن: ${num(current.jeddah?.totalQty)} وحدة</span><span>الرياض الآن: ${num(current.riyadh?.totalQty)} وحدة</span></div></div><div class="v52-card-body" style="padding-top:0">${r.length?`<div class="movement-table-wrap"><table class="movement-table"><thead><tr><th>التاريخ والوقت</th><th>الفرع</th><th>رقم الصنف</th><th>اسم الصنف</th><th>قبل</th><th>بعد</th><th>الفرق</th><th>النوع</th></tr></thead><tbody>${r.slice(0,3000).map(c=>`<tr><td>${dt(c.timestamp)}</td><td>${esc(c.branchLabel||c.branch)}</td><td dir="ltr">${esc(c.sku)}</td><td class="name">${esc(c.name||'—')}</td><td>${num(c.before)}</td><td>${num(c.after)}</td><td class="${Number(c.delta)<0?'delta-down':'delta-up'}">${Number(c.delta)>0?'+':''}${num(c.delta)}</td><td>${chip(c)}</td></tr>`).join('')}</tbody></table></div><div class="movement-cards">${r.slice(0,1000).map(c=>`<article class="move-card"><div class="move-card-head"><div class="move-card-main"><div class="move-card-title">${esc(c.name||c.sku)}</div><div class="move-card-sub">${esc(c.sku)} · ${esc(c.branchLabel||c.branch)} · ${dt(c.timestamp)}</div></div>${chip(c)}</div><div class="move-card-grid"><div><small>قبل</small><b>${num(c.before)}</b></div><div><small>بعد</small><b>${num(c.after)}</b></div><div><small>الفرق</small><b class="${Number(c.delta)<0?'delta-down':'delta-up'}">${Number(c.delta)>0?'+':''}${num(c.delta)}</b></div></div></article>`).join('')}</div>`:`<div class="empty-state">لا توجد حركة مطابقة للفلتر الحالي.<br>غيّر الفترة أو اختر «كل الحركة»، أو ابحث برقم صنف آخر.</div>`}</div></section>
<div class="movement-meta" style="margin:10px 2px 20px"><span>آخر توليد للسجل: ${dt(S.data.generatedAt)}</span><span>·</span><span>الحركات الخام في الفترة: ${num(all.length)}</span><span>·</span><span>المصدر: تاريخ تحديثات المخزون</span></div>`;bind()}
function bind(){$$('[data-period]').forEach(b=>b.onclick=()=>{S.period=b.dataset.period;render()});$('#branch')?.addEventListener('change',e=>{S.branch=e.target.value;render()});$('#kind')?.addEventListener('change',e=>{S.kind=e.target.value;render()});let timer;$('#q')?.addEventListener('input',e=>{S.q=e.target.value;const caret=e.target.selectionStart;clearTimeout(timer);timer=setTimeout(()=>{render();const q=$('#q');if(q){q.focus({preventScroll:true});try{const pos=Math.min(caret??q.value.length,q.value.length);q.setSelectionRange(pos,pos)}catch{}}},220)})}
async function load(){try{const r=await fetch('./data/inventory-analytics.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل سجل حركة الأصناف');const data=await r.json();if(!data||!Array.isArray(data.events))throw Error('بيانات حركة الأصناف غير صالحة');S.data=data;render()}catch(e){S.error='تعذر فتح سجل الحركة الآن: '+(e?.message||'خطأ غير معروف');render()}}
load();
</script>
<script src="./v46-admin-nav.js?v=56.39"></script>
