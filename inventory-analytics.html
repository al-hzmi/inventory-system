<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf9">
<title>المبيعات وحركة المخزون | بيت الأواني الطيبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#1c1917;--s:#57534e;--m:#a8a29e;--b:#e7e5e4;--bg:#fafaf9;--w:#fff;--ok:#15803d;--oks:#f0fdf4;--bad:#b91c1c;--bads:#fef2f2;--warn:#b45309;--warns:#fffbeb;--info:#0369a1;--infos:#f0f9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--p);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.app{max-width:1450px;margin:auto;min-height:100dvh;padding-bottom:48px}.top{position:sticky;top:0;z-index:40;background:rgba(250,250,249,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}.topin{display:flex;align-items:center;gap:9px;min-height:72px;padding:10px 14px}.brand{flex:1;min-width:0}.brand b{font-size:18px;display:block}.brand span{font-size:10px;color:var(--s);display:block;margin-top:2px}.nav,.btn{height:40px;border:1px solid var(--b);border-radius:11px;background:#fff;color:var(--p);padding:0 12px;font-size:10px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn{cursor:pointer}.tabs{display:flex;overflow:auto;background:#fff;border-top:1px solid #f5f5f4;padding:0 10px}.tab{height:48px;min-width:128px;border:0;border-bottom:2px solid transparent;background:#fff;color:var(--s);font-size:11px;font-weight:700;cursor:pointer}.tab.on{color:var(--warn);border-bottom-color:var(--warn)}main{padding:14px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.panel{background:#fff;border:1px solid var(--b);border-radius:16px;box-shadow:0 1px 3px rgba(28,25,23,.04)}.stat{padding:13px}.stat small{display:block;font-size:9px;color:var(--s)}.stat b{display:block;font-size:21px;margin-top:4px}.stat span{font-size:9px;color:var(--m)}.panel{padding:14px}.ph{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}.ph h2{font-size:15px;margin:0}.ph p{font-size:10px;line-height:1.65;color:var(--s);margin:3px 0 0}.grow{flex:1;min-width:0}.tag{font-size:9px;font-weight:700;border-radius:999px;padding:4px 8px;background:#f5f5f4;color:var(--s);white-space:nowrap}.tag.ok{background:var(--oks);color:var(--ok)}.tag.bad{background:var(--bads);color:var(--bad)}.tag.warn{background:var(--warns);color:var(--warn)}.tag.info{background:var(--infos);color:var(--info)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search,.sel{height:42px;border:1px solid var(--b);border-radius:11px;background:#fff;padding:0 11px;outline:none}.search{flex:1;min-width:190px}.sel{min-width:130px}.split{display:grid;gap:12px}.list{display:grid;gap:8px}.row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--b);border-radius:13px;background:#fff;padding:11px}.rowmain{flex:1;min-width:0}.rowtitle{font-size:12px;font-weight:700}.sub{font-size:9px;color:var(--s);line-height:1.6;margin-top:2px}.delta{font-weight:800;font-size:12px;direction:ltr}.up{color:var(--ok)}.down{color:var(--bad)}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) minmax(100px,2fr) 70px;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f4}.barrow:last-child{border:0}.barname{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:8px;background:#eeeae7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:var(--bad)}.bar.in i{background:var(--ok)}.value{text-align:left;font-size:10px;font-weight:700;direction:ltr}.event{border:1px solid var(--b);border-radius:14px;padding:12px;background:#fff}.eventhead{display:flex;gap:8px;align-items:flex-start}.eventhead b{font-size:12px}.eventstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.mini{background:var(--bg);border-radius:10px;padding:8px}.mini small{font-size:8px;color:var(--s);display:block}.mini b{font-size:12px;display:block;margin-top:2px}.tablewrap{overflow:auto;border:1px solid var(--b);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid #f5f5f4;text-align:right;font-size:10px}.table th{background:var(--bg);color:var(--s);position:sticky;top:0}.notice{border:1px solid #fde68a;background:var(--warns);color:#92400e;border-radius:13px;padding:10px 12px;font-size:10px;line-height:1.75}.empty{text-align:center;padding:42px 14px;color:var(--m);font-size:11px}.section{display:none}.section.on{display:block}.metric{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #f5f5f4;font-size:10px}.metric:last-child{border:0}.metric span{color:var(--s)}.spark{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:8px}.spark i{flex:1;min-width:5px;background:#d6d3d1;border-radius:4px 4px 0 0;position:relative}.spark i.neg{background:#fecaca}.spark i.pos{background:#bbf7d0}.spark i:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:5px 7px;border-radius:7px;font-size:8px;white-space:nowrap;z-index:5}
@media(max-width:640px){.topin{flex-wrap:wrap}.brand{order:-1;flex-basis:100%}.topin>.nav,.topin>.btn{flex:1}.eventstats{grid-template-columns:repeat(2,1fr)}}
@media(min-width:760px){main{padding:18px}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.split{grid-template-columns:1.15fr .85fr}}
@media(min-width:1000px){.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible}.tab{min-width:0;width:100%}}
</style></head>
<body><div id="app" class="app"><div class="empty">جاري تحميل المبيعات وحركة المخزون...</div></div>
<script>
const ADMIN_HASH='1jh297-spgf2z';const adminOk=()=>String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH;if(!adminOk())location.replace('./index.html?employee=1');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const num=(n,d=2)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(n)||0);const money=n=>num(n,0)+' ر.س';const dt=s=>{try{return new Date(s).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'})}catch{return'—'}};const norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const S={tab:'overview',range:'30',branch:'all',kind:'all',q:'',data:null,error:''};
function within(ev){if(S.range==='all')return true;const days=Number(S.range);return Date.now()-new Date(ev.timestamp).getTime()<=days*86400000}
function events(){return (S.data?.events||[]).filter(within)}
function changes(){const q=norm(S.q);return events().flatMap(ev=>(ev.changes||[]).map(ch=>({...ch,eventId:ev.id,timestamp:ev.timestamp,message:ev.message}))).filter(ch=>(S.branch==='all'||ch.branch===S.branch)&&(S.kind==='all'||(S.kind==='out'?ch.delta<0:S.kind==='in'?ch.delta>0:S.kind==='zero'?ch.zeroed:S.kind==='transfer'?Number(ch.transferMatchedQty||0)>0:true))&&(!q||norm(ch.sku+' '+ch.name).includes(q)))}
function saleQty(c){return c.delta<0?Math.max(0,-Number(c.delta||0)-Number(c.transferMatchedQty||0)):0}
function totals(){const evs=events(),t={inbound:0,outbound:0,transfer:0,sales:0,salesValue:0,changed:new Set(),zeroed:0,events:evs.length};evs.forEach(e=>{const s=e.summary||{};t.inbound+=Number(s.inboundQty||0);t.outbound+=Number(s.outboundQty||0);t.transfer+=Number(s.sameEventTransferQty||0);(e.changes||[]).forEach(c=>{t.changed.add(c.sku);const q=saleQty(c);t.sales+=q;t.salesValue+=q*Number(c.price||0)});t.zeroed+=Number(s.zeroedSkus||0)});return t}
function topMovers(direction){const map=new Map();changes().forEach(c=>{let qty=0;if(direction==='out')qty=saleQty(c);else if(direction==='in'&&c.delta>0)qty=Number(c.delta||0);if(qty<=0)return;const k=c.sku,x=map.get(k)||{sku:k,name:c.name,qty:0};x.qty+=qty;map.set(k,x)});return [...map.values()].sort((a,b)=>b.qty-a.qty).slice(0,12)}
function tab(id,label){return `<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${label}</button>`}
function render(){const d=S.data;if(!d){document.getElementById('app').innerHTML=`<div class="empty">${S.error?esc(S.error):'جاري تحميل المبيعات وحركة المخزون...'}</div>`;return}const t=totals();document.getElementById('app').innerHTML=`<header class="top"><div class="topin"><a class="nav" href="./admin-dashboard.html">‹ الإدارة</a><div class="brand"><b>المبيعات وحركة المخزون</b><span>قراءة تلقائية لفروقات كل تحديث · جدة والرياض</span></div><select id="range" class="sel"><option value="7" ${S.range==='7'?'selected':''}>آخر 7 أيام</option><option value="30" ${S.range==='30'?'selected':''}>آخر 30 يوم</option><option value="90" ${S.range==='90'?'selected':''}>آخر 90 يوم</option><option value="all" ${S.range==='all'?'selected':''}>كل السجل</option></select><button class="btn" id="reload">تحديث</button></div><nav class="tabs">${tab('overview','الملخص')}${tab('movers','الأصناف والمبيعات')}${tab('transfers','التحويلات')}${tab('history','سجل التحديثات')}${tab('changes','كل الفروقات')}</nav></header><main><div class="notice"><b>طريقة الحساب:</b> أي نقص في المخزون نعتبره مبيعات، مع استبعاد الكمية التي تطابقت كتحويل مخزني بين جدة والرياض. اللوحة تشغيلية خاصة ومبنية بالكامل على فروقات تحديثات المخزون.</div><section class="section ${S.tab==='overview'?'on':''}" style="margin-top:12px">${overview(t)}</section><section class="section ${S.tab==='movers'?'on':''}" style="margin-top:12px">${movers()}</section><section class="section ${S.tab==='transfers'?'on':''}" style="margin-top:12px">${transfers()}</section><section class="section ${S.tab==='history'?'on':''}" style="margin-top:12px">${history()}</section><section class="section ${S.tab==='changes'?'on':''}" style="margin-top:12px">${allChanges()}</section></main>`;bind()}
function overview(t){const cur=S.data.current||{},j=cur.jeddah||{},r=cur.riyadh||{};return `<div class="grid stats"><div class="stat"><small>المبيعات</small><b>${num(t.sales)}</b><span>نقص بعد استبعاد التحويل</span></div><div class="stat"><small>دخول مخزون</small><b>${num(t.inbound)}</b><span>كمية زادت</span></div><div class="stat"><small>إجمالي النقص</small><b>${num(t.outbound)}</b><span>قبل استبعاد التحويل</span></div><div class="stat"><small>تحويل مخزني</small><b>${num(t.transfer)}</b><span>مطابق بنفس التحديث</span></div><div class="stat"><small>أصناف تغيرت</small><b>${num(t.changed.size,0)}</b></div><div class="stat"><small>قيمة المبيعات التقديرية</small><b style="font-size:16px">${money(t.salesValue)}</b></div></div><div class="split" style="margin-top:12px"><div class="panel"><div class="ph"><div class="grow"><h2>اتجاه حركة المخزون</h2><p>صافي الزيادة والنقص في كل تحديث ضمن الفترة المختارة.</p></div><span class="tag info">${t.events} تحديث</span></div>${spark()}</div><div class="panel"><div class="ph"><div class="grow"><h2>المخزون الحالي</h2><p>لقطة آخر نسخة موجودة في النظام.</p></div></div><div class="metric"><span>جدة — إجمالي الكمية</span><b>${num(j.totalQty)}</b></div><div class="metric"><span>جدة — أصناف متوفرة</span><b>${num(j.positiveSkuCount,0)}</b></div><div class="metric"><span>الرياض — إجمالي الكمية</span><b>${num(r.totalQty)}</b></div><div class="metric"><span>الرياض — أصناف متوفرة</span><b>${num(r.positiveSkuCount,0)}</b></div><div class="metric"><span>أصناف وصلت للصفر</span><b>${num(t.zeroed,0)}</b></div><div class="metric"><span>آخر تحديث للإحصائيات</span><b>${dt(S.data.generatedAt)}</b></div></div></div><div class="split" style="margin-top:12px"><div class="panel">${bars('out')}</div><div class="panel">${bars('in')}</div></div>`}
function spark(){const ev=events().slice().reverse().slice(-30),mx=Math.max(1,...ev.map(e=>Math.abs(Number(e.summary?.netQty||0))));return `<div class="spark">${ev.map(e=>{const n=Number(e.summary?.netQty||0),h=Math.max(5,Math.abs(n)/mx*100);return `<i class="${n<0?'neg':'pos'}" style="height:${h}%" data-tip="${esc(dt(e.timestamp))}: ${n>=0?'+':''}${num(n)}"></i>`}).join('')}</div>`}
function bars(kind){const rows=topMovers(kind),mx=Math.max(1,...rows.map(x=>x.qty));return `<div class="ph"><div class="grow"><h2>${kind==='out'?'الأكثر مبيعًا':'الأكثر دخولًا للمخزون'}</h2><p>${kind==='out'?'الأصناف التي انخفضت أكثر بعد استبعاد التحويلات.':'الأصناف التي زاد مخزونها أكثر.'}</p></div></div>${rows.map(x=>`<div class="barrow"><div class="barname" title="${esc(x.name)}">${esc(x.sku)} · ${esc(x.name)}</div><div class="bar ${kind==='in'?'in':''}"><i style="width:${Math.max(2,x.qty/mx*100)}%"></i></div><div class="value">${num(x.qty)}</div></div>`).join('')||'<div class="empty">لا توجد حركة ضمن الفترة.</div>'}`}
function movers(){return `<div class="toolbar"><input id="q" class="search" placeholder="ابحث برقم الصنف أو الاسم..." value="${esc(S.q)}"><select id="branch" class="sel"><option value="all">كل الفروع</option><option value="jeddah" ${S.branch==='jeddah'?'selected':''}>جدة</option><option value="riyadh" ${S.branch==='riyadh'?'selected':''}>الرياض</option></select></div><div class="split"><div class="panel">${bars('out')}</div><div class="panel">${bars('in')}</div></div>`}
function transfers(){const same=events().flatMap(e=>(e.transfers||[]).map(x=>({...x,timestamp:e.timestamp,event:e.id}))),cross=(S.data.transferCandidates||[]).filter(x=>{const e=(S.data.events||[]).find(v=>v.id===x.fromEvent||v.id===x.toEvent);return !e||within(e)});return `<div class="split"><div class="panel"><div class="ph"><div class="grow"><h2>تحويلات مخزنية واضحة</h2><p>نقص وزيادة للصنف نفسه بين جدة والرياض في نفس تحديث المخزون.</p></div><span class="tag ${same.length?'ok':''}">${same.length}</span></div><div class="list">${same.slice(0,100).map(x=>transferRow(x,'واضح')).join('')||'<div class="empty">لا توجد مطابقة في نفس التحديث.</div>'}</div></div><div class="panel"><div class="ph"><div class="grow"><h2>تحويلات محتملة</h2><p>حركة معاكسة لنفس الصنف خلال 72 ساعة وبكميات متقاربة.</p></div><span class="tag warn">${cross.length}</span></div><div class="list">${cross.slice(0,100).map(x=>transferRow(x,'محتمل')).join('')||'<div class="empty">لا توجد مرشحات.</div>'}</div></div></div>`}
function transferRow(x,confidence){return `<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.sku)} · ${esc(x.name)}</div><div class="sub">${esc(x.fromLabel)} ← ${esc(x.toLabel)}${x.hoursApart!=null?` · خلال ${num(x.hoursApart,1)} ساعة`:''}</div></div><b>${num(x.qty)}</b><span class="tag ${confidence==='واضح'?'ok':'warn'}">${confidence}</span></div>`}
function history(){const ev=events();return `<div class="list">${ev.map(e=>{const sales=Math.max(0,Number(e.summary?.outboundQty||0)-Number(e.summary?.sameEventTransferQty||0));return `<article class="event"><div class="eventhead"><div class="grow"><b>${dt(e.timestamp)}</b><div class="sub">${esc(e.message||'تحديث مخزون')} · ${esc(e.id)}</div></div><span class="tag info">${(e.paths||[]).map(p=>p.includes('jeddah')?'جدة':'الرياض').join(' + ')}</span></div><div class="eventstats"><div class="mini"><small>مبيعات</small><b class="down">${num(sales)}</b></div><div class="mini"><small>دخول</small><b class="up">${num(e.summary?.inboundQty)}</b></div><div class="mini"><small>صافي المخزون</small><b>${num(e.summary?.netQty)}</b></div><div class="mini"><small>أصناف تغيرت</small><b>${num(e.summary?.changedSkus,0)}</b></div><div class="mini"><small>تحويل مخزني</small><b>${num(e.summary?.sameEventTransferQty)}</b></div><div class="mini"><small>وصل للصفر</small><b>${num(e.summary?.zeroedSkus,0)}</b></div></div></article>`}).join('')||'<div class="empty">لا يوجد سجل ضمن الفترة.</div>'}</div>`}
function allChanges(){const rows=changes();return `<div class="toolbar"><input id="q" class="search" placeholder="ابحث برقم الصنف أو الاسم..." value="${esc(S.q)}"><select id="branch" class="sel"><option value="all">كل الفروع</option><option value="jeddah" ${S.branch==='jeddah'?'selected':''}>جدة</option><option value="riyadh" ${S.branch==='riyadh'?'selected':''}>الرياض</option></select><select id="kind" class="sel"><option value="all">كل الحركة</option><option value="out" ${S.kind==='out'?'selected':''}>نقص / بيع</option><option value="in" ${S.kind==='in'?'selected':''}>زيادة</option><option value="zero" ${S.kind==='zero'?'selected':''}>وصل للصفر</option><option value="transfer" ${S.kind==='transfer'?'selected':''}>تحويل مخزني</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>التاريخ</th><th>الفرع</th><th>الصنف</th><th>الاسم</th><th>قبل</th><th>بعد</th><th>الفرق</th><th>القيمة التقديرية</th></tr></thead><tbody>${rows.slice(0,2000).map(c=>`<tr><td>${dt(c.timestamp)}</td><td>${esc(c.branchLabel)}</td><td>${esc(c.sku)}</td><td>${esc(c.name)}</td><td>${num(c.before)}</td><td>${num(c.after)}</td><td class="${c.delta>0?'up':'down'}"><b>${c.delta>0?'+':''}${num(c.delta)}</b></td><td>${c.price?money(Math.abs(c.valueDelta)):'—'}</td></tr>`).join('')}</tbody></table></div>${rows.length>2000?`<div class="sub" style="margin-top:8px">يعرض أول 2,000 حركة من ${num(rows.length,0)}.</div>`:''}`}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});$('#range')?.addEventListener('change',e=>{S.range=e.target.value;render()});$('#reload')?.addEventListener('click',load);$('#q')?.addEventListener('input',e=>{S.q=e.target.value;render()});$('#branch')?.addEventListener('change',e=>{S.branch=e.target.value;render()});$('#kind')?.addEventListener('change',e=>{S.kind=e.target.value;render()})}
async function load(){try{S.error='';const r=await fetch('./data/inventory-analytics.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('لم يتم إنشاء سجل حركة المخزون بعد.');S.data=await r.json();render()}catch(e){S.error=e.message||'تعذر تحميل الإحصائيات';S.data=null;render()}}
load();
</script>
<script src="./v46-admin-nav.js?v=51.0"></script>
</body></html>
