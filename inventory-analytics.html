:1fr 1fr}.sales-filter input{grid-column:1/-1;min-width:0;width:100%}.sales-bar-row{grid-template-columns:minmax(0,1fr) 76px}.sales-bar{grid-column:1/-1;grid-row:2}.branch-cards{grid-template-columns:1fr}.event-stats{grid-template-columns:repeat(2,1fr)}.desktop-changes{display:none}.mobile-changes{display:grid;gap:8px}.change-card{border:1px solid var(--v52-border);border-radius:13px;background:#fff;padding:11px}.change-card-head{display:flex;gap:8px}.change-card-head>div{flex:1;min-width:0}.change-card-title{font-size:11px;font-weight:700}.change-card-sub{font-size:9px;color:var(--v52-muted);margin-top:2px}.change-card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.change-card-grid div{background:#f7f9f8;border-radius:9px;padding:7px}.change-card-grid small{font-size:7px;color:var(--v52-muted);display:block}.change-card-grid b{font-size:10px;display:block;margin-top:2px}.sales-donut{width:124px;height:124px}.sales-donut:before{inset:16px}}</style></head><body><main id="sales" class="v52-page"><div class="v52-empty">جاري تحليل المبيعات...</div></main><script>
const ADMIN_HASH='1jh297-spgf2z';if(!(String(localStorage.getItem('inventory_user_name_v2')||'').trim()==='مهند'&&String(localStorage.getItem('inventory_admin_token_v2')||'')===ADMIN_HASH))location.replace('./index.html?employee=1');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=(n,d=0)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(n)||0),money=n=>num(n,0)+' ر.س',norm=s=>String(s??'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').trim(),dt=s=>{try{return new Date(s).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'})}catch{return'—'}};
const S={data:null,range:'30',branch:'all',tab:'overview',q:'',kind:'all',error:''};const saleQty=c=>c.delta<0?Math.max(0,-Number(c.delta||0)-Number(c.transferMatchedQty||0)):0;
function inRange(e){return S.range==='all'||Date.now()-new Date(e.timestamp).getTime()<=Number(S.range)*86400000}function evs(){return(S.data?.events||[]).filter(inRange)}function scopedChanges(raw=false){const q=norm(S.q);return evs().flatMap(e=>(e.changes||[]).map(c=>({...c,timestamp:e.timestamp,event:e.id,message:e.message}))).filter(c=>(S.branch==='all'||c.branch===S.branch)&&(!q||norm(c.sku+' '+c.name).includes(q))&&(raw||S.kind==='all'||(S.kind==='sales'?saleQty(c)>0:S.kind==='in'?c.delta>0:S.kind==='zero'?c.zeroed:S.kind==='transfer'?Number(c.transferMatchedQty||0)>0:true)))}
function summary(branch=S.branch){const t={sales:0,value:0,inbound:0,transfer:0,zero:0,changed:new Set(),j:{sales:0,value:0,inbound:0,transfer:0,zero:0},r:{sales:0,value:0,inbound:0,transfer:0,zero:0},timeline:[],items:new Map()};for(const e of evs()){const row={date:e.timestamp,j:0,r:0,jIn:0,rIn:0};for(const c of e.changes||[]){if(branch!=='all'&&c.branch!==branch)continue;const q=saleQty(c),v=q*Number(c.price||0),b=c.branch==='jeddah'?t.j:t.r;t.changed.add(c.sku);if(q){t.sales+=q;t.value+=v;b.sales+=q;b.value+=v;if(c.branch==='jeddah')row.j+=q;else row.r+=q;const x=t.items.get(c.sku)||{sku:c.sku,name:c.name,qty:0,value:0,j:0,r:0};x.qty+=q;x.value+=v;x[c.branch==='jeddah'?'j':'r']+=q;t.items.set(c.sku,x)}if(c.delta>0){t.inbound+=c.delta;b.inbound+=c.delta;if(c.branch==='jeddah')row.jIn+=c.delta;else row.rIn+=c.delta}const tr=Number(c.transferMatchedQty||0);if(tr){t.transfer+=tr;b.transfer+=tr}if(c.zeroed){t.zero++;b.zero++}}t.timeline.push(row)}return t}
function trendChart(t){const a=t.timeline.slice().reverse().slice(-28);if(!a.length)return'<div class="v52-empty">لا توجد بيانات ضمن الفترة.</div>';const w=820,h=250,p=28,keys=S.branch==='jeddah'?['j']:S.branch==='riyadh'?['r']:['j','r'],max=Math.max(1,...a.flatMap(x=>keys.map(k=>x[k]))),pts=k=>a.map((x,i)=>`${p+i*(w-2*p)/Math.max(1,a.length-1)},${h-p-(x[k]/max)*(h-2*p)}`).join(' ');return `<div class="sales-chart"><svg viewBox="0 0 ${w} ${h}" aria-label="رسم اتجاه المبيعات">${[0,.25,.5,.75,1].map(v=>`<line x1="${p}" y1="${p+v*(h-2*p)}" x2="${w-p}" y2="${p+v*(h-2*p)}" stroke="#e8eeeb"/>`).join('')}${keys.includes('j')?`<polyline points="${pts('j')}" fill="none" stroke="#0f6b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${keys.includes('r')?`<polyline points="${pts('r')}" fill="none" stroke="#296f92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}</svg><div class="sales-legend">${keys.includes('j')?'<span><i style="background:#0f6b4f"></i>جدة</span>':''}${keys.includes('r')?'<span><i style="background:#296f92"></i>الرياض</span>':''}<span>كل نقطة = تحديث مخزون</span></div></div>`}
function movementChart(t){const a=t.timeline.slice().reverse().slice(-18),mx=Math.max(1,...a.map(x=>Math.max(x.j+x.r,x.jIn+x.rIn)));return `<div class="sales-chart"><svg viewBox="0 0 820 240" aria-label="المبيعات مقابل دخول المخزون">${a.map((x,i)=>{const sales=S.branch==='jeddah'?x.j:S.branch==='riyadh'?x.r:x.j+x.r,inn=S.branch==='jeddah'?x.jIn:S.branch==='riyadh'?x.rIn:x.jIn+x.rIn,bw=Math.max(8,620/Math.max(1,a.length)),x0=60+i*(700/Math.max(1,a.length));return `<rect x="${x0}" y="${220-sales/mx*180}" width="${bw*.42}" height="${sales/mx*180}" rx="3" fill="#0f6b4f"/><rect x="${x0+bw*.46}" y="${220-inn/mx*180}" width="${bw*.42}" height="${inn/mx*180}" rx="3" fill="#8aa99a"/>`}).join('')}<line x1="50" y1="220" x2="790" y2="220" stroke="#dce4e0"/></svg><div class="sales-legend"><span><i style="background:#0f6b4f"></i>مبيعات</span><span><i style="background:#8aa99a"></i>دخول مخزون</span></div></div>`}
function topBars(t,mode='sales'){const rows=[...t.items.values()].sort((a,b)=>b.qty-a.qty).slice(0,12),mx=Math.max(1,...rows.map(x=>x.qty));return rows.map((x,i)=>`<div class="sales-bar-row"><div class="sales-bar-name"><b>${i+1}. ${esc(x.name||x.sku)}</b><span>${esc(x.sku)} · ${money(x.value)}</span></div><div class="sales-bar"><i style="width:${Math.max(2,x.qty/mx*100)}%"></i></div><div class="sales-bar-value">${num(x.qty)}</div></div>`).join('')||'<div class="v52-empty">لا توجد مبيعات.</div>'}
function donut(t){const total=Math.max(1,t.j.sales+t.r.sales),jp=t.j.sales/total*100,rp=100-jp;return `<div class="sales-donut" style="background:conic-gradient(#0f6b4f 0 ${jp}%,#296f92 ${jp}% 100%)"><div><b>${num(t.sales)}</b><span>إجمالي المبيعات</span></div></div><div class="sales-legend" style="justify-content:center"><span><i style="background:#0f6b4f"></i>جدة ${num(jp,1)}%</span><span><i style="background:#296f92"></i>الرياض ${num(rp,1)}%</span></div>`}
function branchCard(label,b,current,color){return `<div class="branch-card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><i style="width:9px;height:9px;border-radius:50%;background:${color}"></i><h3>${label}</h3></div><div class="branch-metrics"><div class="branch-metric"><small>مبيعات</small><b>${num(b.sales)}</b></div><div class="branch-metric"><small>قيمة تقديرية</small><b style="font-size:11px">${money(b.value)}</b></div><div class="branch-metric"><small>دخول مخزون</small><b>${num(b.inbound)}</b></div><div class="branch-metric"><small>المخزون الحالي</small><b>${num(current?.totalQty)}</b></div></div></div>`}
function overview(t){const cur=S.data.current||{};return `<div class="v52-grid v52-kpis"><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">الكمية المباعة</span><span class="v52-chip ok">${S.range==='all'?'كل السجل':S.range+' يوم'}</span></div><div class="v52-kpi-value">${num(t.sales)}</div><div class="v52-kpi-sub">نقص المخزون بعد استبعاد التحويل المطابق</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">قيمة المبيعات</span><span class="v52-chip ok">تقديرية</span></div><div class="v52-kpi-value" style="font-size:21px">${money(t.value)}</div><div class="v52-kpi-sub">حسب سعر الصنف في ملف التسعير</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">دخول المخزون</span><span class="v52-chip">كمية</span></div><div class="v52-kpi-value">${num(t.inbound)}</div><div class="v52-kpi-sub">جميع الزيادات ضمن النطاق</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">تحويل مخزني واضح</span><span class="v52-chip">بين الفرعين</span></div><div class="v52-kpi-value">${num(t.transfer/2)}</div><div class="v52-kpi-sub">يُقسم على 2 لأن طرفي التحويل يحملان المطابقة</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">أصناف تحركت</span><span class="v52-chip">SKU</span></div><div class="v52-kpi-value">${num(t.changed.size)}</div></div><div class="v52-kpi"><div class="v52-kpi-top"><span class="v52-kpi-label">وصلت للصفر</span><span class="v52-chip ${t.zero?'warn':'ok'}">مخزون</span></div><div class="v52-kpi-value">${num(t.zero)}</div></div></div><div class="v52-grid v52-split" style="margin-top:12px"><section class="v52-card"><div class="v52-card-head"><div><h2>اتجاه المبيعات</h2><p>قراءة كل تحديث مخزون مع فصل جدة والرياض.</p></div></div><div class="v52-card-body">${trendChart(t)}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>حصة الفروع</h2><p>توزيع الكمية المباعة في الفترة.</p></div></div><div class="v52-card-body">${donut(t)}</div></section></div><div class="v52-grid v52-split" style="margin-top:12px"><section class="v52-card"><div class="v52-card-head"><div><h2>المبيعات مقابل دخول المخزون</h2><p>يساعدك على رؤية إن كان المخزون يتعوض بنفس سرعة البيع.</p></div></div><div class="v52-card-body">${movementChart(t)}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>أداء الفرعين</h2><p>قراءة مستقلة لكل مستودع.</p></div></div><div class="v52-card-body branch-cards">${branchCard('جدة',t.j,cur.jeddah,'#0f6b4f')}${branchCard('الرياض',t.r,cur.riyadh,'#296f92')}</div></section></div><section class="v52-card" style="margin-top:12px"><div class="v52-card-head"><div><h2>الأصناف الأكثر مبيعًا</h2><p>ترتيب حسب الكمية المباعة ضمن الفلاتر الحالية.</p></div><button class="v52-btn" data-tab="products">تفاصيل الأصناف</button></div><div class="v52-card-body">${topBars(t)}</div></section>`}
function products(t){const inbound=new Map();for(const c of scopedChanges(true)){if(c.delta>0){const x=inbound.get(c.sku)||{sku:c.sku,name:c.name,qty:0};x.qty+=c.delta;inbound.set(c.sku,x)}}const ins=[...inbound.values()].sort((a,b)=>b.qty-a.qty).slice(0,12),mx=Math.max(1,...ins.map(x=>x.qty));return `<div class="v52-grid v52-half"><section class="v52-card"><div class="v52-card-head"><div><h2>الأكثر مبيعًا</h2><p>بالكمية والقيمة التقديرية.</p></div></div><div class="v52-card-body">${topBars(t)}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>الأكثر دخولًا للمخزون</h2><p>أكبر زيادات مسجلة في الفترة.</p></div></div><div class="v52-card-body">${ins.map((x,i)=>`<div class="sales-bar-row"><div class="sales-bar-name"><b>${i+1}. ${esc(x.name||x.sku)}</b><span>${esc(x.sku)}</span></div><div class="sales-bar in"><i style="width:${Math.max(2,x.qty/mx*100)}%"></i></div><div class="sales-bar-value">${num(x.qty)}</div></div>`).join('')||'<div class="v52-empty">لا توجد زيادات.</div>'}</div></section></div>`}
function transfers(){const same=evs().flatMap(e=>(e.transfers||[]).map(x=>({...x,timestamp:e.timestamp,event:e.id}))).filter(x=>S.branch==='all'||x.from===S.branch||x.to===S.branch),cross=(S.data.transferCandidates||[]).filter(x=>{const e=(S.data.events||[]).find(v=>v.id===x.fromEvent||v.id===x.toEvent);return(!e||inRange(e))&&(S.branch==='all'||x.from===S.branch||x.to===S.branch)}),card=(x,conf)=>`<div class="v52-list-row"><div class="v52-row-main"><div class="v52-row-title">${esc(x.name||x.sku)}</div><div class="v52-row-sub">${esc(x.sku)} · ${esc(x.fromLabel)} ← ${esc(x.toLabel)}${x.hoursApart!=null?' · '+num(x.hoursApart,1)+' ساعة':''}</div></div><div class="v52-row-value">${num(x.qty)}</div><span class="v52-chip ${conf==='واضح'?'ok':'warn'}">${conf}</span></div>`;return `<div class="v52-grid v52-half"><section class="v52-card"><div class="v52-card-head"><div><h2>تحويلات واضحة</h2><p>نقص وزيادة لنفس الصنف في نفس التحديث.</p></div><span class="v52-chip ok">${same.length}</span></div><div class="v52-card-body v52-list">${same.slice(0,150).map(x=>card(x,'واضح')).join('')||'<div class="v52-empty">لا توجد تحويلات واضحة.</div>'}</div></section><section class="v52-card"><div class="v52-card-head"><div><h2>تحويلات محتملة</h2><p>نفس الصنف بين الفرعين خلال 72 ساعة وبكميات متقاربة.</p></div><span class="v52-chip warn">${cross.length}</span></div><div class="v52-card-body v52-list">${cross.slice(0,150).map(x=>card(x,'محتمل')).join('')||'<div class="v52-empty">لا توجد تحويلات محتملة.</div>'}</div></section></div>`}
function history(){return `<div class="v52-list">${evs().map(e=>{let sales=0,val=0,inb=0;for(const c of e.changes||[]){if(S.branch!=='all'&&c.branch!==S.branch)continue;const q=saleQty(c);sales+=q;val+=q*Number(c.price||0);if(c.delta>0)inb+=c.delta}return `<article class="event-card"><div class="event-head"><div class="v52-row-main"><div class="v52-row-title">${dt(e.timestamp)}</div><div class="v52-row-sub">${esc(e.message||'تحديث مخزون')} · ${esc(e.id)}</div></div><span class="v52-chip">${(e.paths||[]).map(p=>p.includes('jeddah')?'جدة':'الرياض').join(' + ')}</span></div><div class="event-stats"><div class="event-stat"><small>مبيعات</small><b>${num(sales)}</b></div><div class="event-stat"><small>قيمة</small><b>${money(val)}</b></div><div class="event-stat"><small>دخول</small><b>${num(inb)}</b></div><div class="event-stat"><small>أصناف تغيرت</small><b>${num((e.changes||[]).length)}</b></div></div></article>`}).join('')||'<div class="v52-empty">لا يوجد سجل ضمن الفترة.</div>'}</div>`}
function details(){const rows=scopedChanges();const cards=rows.slice(0,1200).map(c=>`<div class="change-card"><div class="change-card-head"><div><div class="change-card-title">${esc(c.name||c.sku)}</div><div class="change-card-sub">${esc(c.sku)} · ${esc(c.branchLabel)} · ${dt(c.timestamp)}</div></div><span class="v52-chip ${saleQty(c)>0?'ok':c.delta>0?'':'warn'}">${saleQty(c)>0?'بيع':c.delta>0?'دخول':'حركة'}</span></div><div class="change-card-grid"><div><small>قبل</small><b>${num(c.before)}</b></div><div><small>بعد</small><b>${num(c.after)}</b></div><div><small>الفرق</small><b class="${c.delta<0?'sales-down':'sales-up'}">${c.delta>0?'+':''}${num(c.delta)}</b></div></div></div>`).join('');return `<div class="sales-filter"><input id="q" value="${esc(S.q)}" placeholder="ابحث برقم الصنف أو الاسم"><select id="kind"><option value="all">كل الحركة</option><option value="sales" ${S.kind==='sales'?'selected':''}>مبيعات</option><option value="in" ${S.kind==='in'?'selected':''}>دخول مخزون</option><option value="zero" ${S.kind==='zero'?'selected':''}>وصل للصفر</option><option value="transfer" ${S.kind==='transfer'?'selected':''}>تحويل</option></select></div><div class="desktop-changes v52-table-wrap" style="margin-top:10px"><table class="v52-table"><thead><tr><th>التاريخ</th><th>الفرع</th><th>الصنف</th><th>الاسم</th><th>قبل</th><th>بعد</th><th>الفرق</th><th>التصنيف</th><th>القيمة</th></tr></thead><tbody>${rows.slice(0,2000).map(c=>`<tr><td>${dt(c.timestamp)}</td><td>${esc(c.branchLabel)}</td><td>${esc(c.sku)}</td><td>${esc(c.name)}</td><td>${num(c.before)}</td><td>${num(c.after)}</td><td class="${c.delta<0?'sales-down':'sales-up'}"><b>${c.delta>0?'+':''}${num(c.delta)}</b></td><td>${saleQty(c)>0?'بيع':c.delta>0?'دخول':'حركة'}</td><td>${c.price?money(Math.abs(Number(c.valueDelta||0))):'—'}</td></tr>`).join('')}</tbody></table></div><div class="mobile-changes" style="margin-top:10px">${cards||'<div class="v52-empty">لا توجد نتائج.</div>'}</div>`}
function render(){if(!S.data){document.getElementById('sales').innerHTML=`<div class="v52-empty">${esc(S.error||'جاري تحليل المبيعات...')}</div>`;return}const t=summary();document.getElementById('sales').innerHTML=`<div class="v52-page-head"><div><div class="v52-eyebrow">ذكاء المبيعات والمخزون</div><h1 class="v52-page-title">المبيعات</h1><div class="v52-page-sub">كل نقص في المخزون يُحسب بيعًا، مع استبعاد التحويل المطابق بين جدة والرياض.</div></div><div class="sales-filter"><select id="range"><option value="7" ${S.range==='7'?'selected':''}>آخر 7 أيام</option><option value="30" ${S.range==='30'?'selected':''}>آخر 30 يوم</option><option value="90" ${S.range==='90'?'selected':''}>آخر 90 يوم</option><option value="all" ${S.range==='all'?'selected':''}>كل التاريخ</option></select><select id="branch"><option value="all">الفرعان معًا</option><option value="jeddah" ${S.branch==='jeddah'?'selected':''}>جدة فقط</option><option value="riyadh" ${S.branch==='riyadh'?'selected':''}>الرياض فقط</option></select></div></div><div class="sales-note"><b>القراءة التشغيلية:</b> النقص = بيع داخل هذه اللوحة الخاصة. التحويل الذي يطابق نفس الصنف بين الفرعين في نفس تحديث المخزون يُستبعد من البيع لتجنب تضخيم الرقم.</div><div class="sales-tabs" style="margin-top:10px"><button class="sales-tab ${S.tab==='overview'?'on':''}" data-tab="overview">الملخص والتحليل</button><button class="sales-tab ${S.tab==='products'?'on':''}" data-tab="products">الأصناف</button><button class="sales-tab ${S.tab==='transfers'?'on':''}" data-tab="transfers">التحويلات</button><button class="sales-tab ${S.tab==='history'?'on':''}" data-tab="history">التحديثات</button><button class="sales-tab ${S.tab==='details'?'on':''}" data-tab="details">كل التفاصيل</button></div><div style="margin-top:12px">${S.tab==='overview'?overview(t):S.tab==='products'?products(t):S.tab==='transfers'?transfers():S.tab==='history'?history():details()}</div>`;bind()}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});$('#range')?.addEventListener('change',e=>{S.range=e.target.value;render()});$('#branch')?.addEventListener('change',e=>{S.branch=e.target.value;render()});$('#q')?.addEventListener('input',e=>{S.q=e.target.value;render()});$('#kind')?.addEventListener('change',e=>{S.kind=e.target.value;render()})}
async function load(){try{const r=await fetch('./data/inventory-analytics.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل بيانات المبيعات');S.data=await r.json();render()}catch(e){S.error=e.message;render()}}load();
</script><script src="./v46-admin-nav.js?v=52.0"></script></body></html>
