   <script type="text/babel">

const LAST_UPDATE = "23 يوليو 2026 - 9:15 مساءً";

let RAW_JEDDAH_DATA = "";
let RAW_RIYADH_DATA = "";
		
        // ==========================================
        // نهاية منطقة إدخال البيانات
        // ==========================================

        const { useState, useEffect, useRef, useMemo } = React;

        // Normalize Arabic numerals to English numerals for search consistency
        const normalizeNumerals = (str) => {
            if (!str) return '';
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        // Parser function for pasted Excel (TSV) data
        const parseExcelData = (rawText) => {
            if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];

            const lines = rawText.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split('\t').map(h => h.trim());
            const idIdx = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
            const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
            const qtyIdx = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
            const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

            const dataMap = {};

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.trim());
                if (cols.length === 0 || (!cols[idIdx] && !cols[nameIdx])) continue;

                const rawId = cols[idIdx] ? cols[idIdx].trim() : '';
                const searchId = normalizeNumerals(rawId).toLowerCase();

                if (!searchId) continue;

                const name = cols[nameIdx] ? cols[nameIdx].trim() : '';
                const rawQty = normalizeNumerals(cols[qtyIdx] || '0').replace(/,/g, ''); // Remove commas if any
                const qty = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);
                const unit = unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '';
                const pack = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';

                // Overwrites if duplicate, keeping the last valid row per instructions
                // استخراج الرقم فقط من رقم الصنف
const numericId = searchId.match(/\d+/)?.[0] || "";

// البحث عن الصورة المطابقة
const image = imagesList instanceof Map
    ? imagesList.get(numericId) || null
    : null;

dataMap[searchId] = {
    id: rawId,
    searchId,
    name,
    qty,
    unit,
    pack,
    image
};
            }
            return Object.values(dataMap);
        };

        // Icons components
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} aria-hidden="true">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const FormatQuantity = ({ qty, unit }) => {
            const formattedQty = new Intl.NumberFormat('en-US').format(qty);
            return (
                <div className="flex flex-col">
                    <div className="flex items-baseline gap-1">
                        <span className="text-[24px] md:text-[28px] font-bold text-primary leading-none">{formattedQty}</span>
                        {unit && <span className="text-[14px] text-secondary">{unit}</span>}
                    </div>
                    {qty === 0 && (
                        <span className="text-[14px] text-secondary mt-1">نفدت الكمية حالياً</span>
                    )}
                </div>
            );
        };

        // Full Detailed Card (Exact Match)
       const FullResultCard = ({ item, warehouseName }) => (
    <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 md:p-24 bg-bg flex flex-col gap-16">

        <div>
            <div className="text-[14px] font-medium text-secondary mb-1">رقم الصنف</div>
            <div className="text-[16px] font-bold text-primary">{item.id}</div>
        </div>

        <div>
            <div className="text-[14px] font-medium text-secondary mb-1">اسم الصنف</div>
            <div className="text-[16px] text-primary">{item.name || "---"}</div>
        </div>

        <div>
            <div className="text-[14px] font-medium text-secondary mb-1">المستودع</div>
            <div className="text-[16px] text-primary">{warehouseName}</div>
        </div>

        <div className="grid grid-cols-2 gap-4 border-t border-border pt-4">
            <div>
                <div className="text-[14px] font-medium text-secondary mb-1">الوحدة</div>
                <div className="text-[16px] font-bold text-primary">
                    {item.unit || "---"}
                </div>
            </div>

            <div>
                <div className="text-[14px] font-medium text-secondary mb-1">الشد</div>
                <div className="text-[16px] font-bold text-primary">
                    {item.pack || "---"}
                </div>
            </div>
        </div>

        <div className="border-t border-border pt-4">
            <div className="text-[14px] font-medium text-secondary mb-1">
                الكمية المتوفرة
            </div>
            <FormatQuantity qty={item.qty} unit={item.unit} />
        </div>

    </div>
);

        // Compact Card (Partial Match - max 5)
        const CompactResultCard = ({ item, warehouseName }) => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 bg-bg flex justify-between items-center gap-16 mb-8 hover:bg-hoverBg transition-colors duration-200">
                <div className="flex flex-col overflow-hidden">
                    <span className="text-[16px] font-bold text-primary truncate">{item.id}</span>
                    <span className="text-[14px] text-secondary truncate">{item.name || '---'}</span>
                </div>
                <div className="flex-shrink-0 text-left">
                    <FormatQuantity qty={item.qty} unit={item.unit} />
                </div>
            </div>
        );

        const NotFoundState = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <SearchIcon className="w-48 h-48 text-border" />
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">لم يتم العثور على الصنف</h3>
                    <p className="text-[15px] text-secondary">لا يوجد هذا الصنف داخل المستودع المحدد.</p>
                </div>
            </div>
        );

        const EmptyState = () => (
            <div className="w-full flex flex-col items-center justify-center py-48 text-center gap-16 opacity-70">
                <SearchIcon className="w-40 h-40 text-secondary" />
                <p className="text-[16px] text-secondary">ابدأ الكتابة لعرض بيانات الصنف</p>
            </div>
        );
        
        const DatabaseEmptyWarning = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-48 h-48 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">قاعدة البيانات فارغة</h3>
                    <p className="text-[15px] text-secondary">يرجى لصق بيانات الإكسل في الكود المصدري لكي تتمكن من البحث.</p>
                </div>
            </div>
        );

// ==========================================
        // 1. مكون شاشة تسجيل الدخول
        // ==========================================
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                
                setLoading(true);
                try {
                    const userRef = db.collection('users').doc(name.trim());
                    const doc = await userRef.get();
                    
                    const userInfo = {
                        userAgent: navigator.userAgent,
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    };

                    if (doc.exists) {
                        await userRef.update({
                            ...userInfo,
                            loginCount: firebase.firestore.FieldValue.increment(1)
                        });
                    } else {
                        await userRef.set({
                            name: name.trim(),
                            ...userInfo,
                            loginCount: 1,
                            firstJoined: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }

                    await db.collection('login_logs').add({
                        name: name.trim(),
                        time: firebase.firestore.FieldValue.serverTimestamp(),
                        userAgent: navigator.userAgent
                    });

                    localStorage.setItem('inventory_user_name', name.trim());
                    onLogin(name.trim());

                } catch (error) {
                    console.error("Error logging in: ", error);
                    alert("حدث خطأ أثناء الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.");
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-16 font-sans">
                    <div className="animate-card w-full max-w-[400px] bg-white border border-border rounded-12 shadow-card p-32 text-center">
                        <h1 className="text-[24px] font-bold text-primary mb-8 font-cairo">نظام المخزون</h1>
                        <p className="text-[14px] text-secondary mb-32 font-cairo">شركة بيت الأواني الطيبة</p>
                        
                        <form onSubmit={handleSubmit} className="flex flex-col gap-16">
                            <div className="text-right">
                                <label className="text-[14px] font-medium text-primary mb-8 block font-cairo">
                                    الإسم الكريم
                                </label>
                                <input 
                                    type="text" 
                                    required
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="اكتب اسمك هنا..."
                                    className="w-full h-[48px] px-16 rounded-12 border border-border focus:border-primary focus:ring-1 focus:ring-primary text-primary outline-none transition-all font-cairo"
                                />
                            </div>
                            
                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full h-[48px] bg-primary text-white rounded-12 font-medium hover:opacity-90 transition-opacity flex justify-center items-center font-cairo"
                            >
                                {loading ? "جاري الدخول..." : "دخول للنظام"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

       // ==========================================
        // 2. التطبيق الأساسي (نظام المخزون والمعرض)
        // ==========================================
        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('inventory_user_name') || '');
            
            // حالات البحث والمستودع
            const [warehouse, setWarehouse] = useState(null);
            const [query, setQuery] = useState('');
            const [showImageInSearch, setShowImageInSearch] = useState(false); // مفتاح عرض الصورة في البحث

            // حالات البيانات
            const [databases, setDatabases] = useState({ jeddah: [], riyadh: [] });
            const [imagesList, setImagesList] = useState(new Set());
            const [categories, setCategories] = useState({});
            
            // حالات المعرض (Gallery)
            const [activeCategory, setActiveCategory] = useState(null);
            const [galleryView, setGalleryView] = useState('grid'); // 'grid' أو 'list'

            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState("جاري التحقق...");
            const searchInputRef = useRef(null);

            const handleLogout = () => {
                localStorage.removeItem('inventory_user_name');
                setUserName('');
            };

            // دالة تحويل الأرقام العربية/الهندية إلى إنجليزية وتنظيف النص
            const normalizeCleanId = (str) => {
                if (!str) return "";
                let englishNumbers = str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
                return englishNumbers.toLowerCase().replace(/[^a-z0-9]/g, ""); // إبقاء الحروف والأرقام فقط
            };

            // قراءة آخر تحديث
            useEffect(() => {
                fetch("./data/version.json")
                .then(res => res.json())
                .then(data => {
                    if (!data.lastUpdate) return setLastUpdate("غير متوفر");
                    setLastUpdate(typeof dayjs !== 'undefined' ? dayjs(data.lastUpdate).fromNow() : data.lastUpdate);
                })
                .catch(() => setLastUpdate("غير متوفر"));
            }, []);

            // تحميل كافة البيانات (المستودعات، التصنيفات، وقائمة الصور)
            useEffect(() => {        
                const loadAllData = async () => {
                    try {
                        const [jeddahRes, riyadhRes, imagesRes, categoriesRes] = await Promise.all([
                            fetch("./data/jeddah.tsv"),
                            fetch("./data/riyadh.tsv"),
                            fetch("./data/images_list.txt").catch(() => ({ text: () => "" })), // تجاوز الخطأ لو لم يوجد الملف
                            fetch("./data/categories.tsv").catch(() => ({ text: () => "" }))
                        ]);

                        const jeddahText = await jeddahRes.text();
                        const riyadhText = await riyadhRes.text();
                        const imagesText = (await imagesRes.text()) || "";
                        const categoriesText = (await categoriesRes.text()) || "";

                        // معالجة المخزون
                        setDatabases({
                            jeddah: parseExcelData(jeddahText),
                            riyadh: parseExcelData(riyadhText)
                        });

                        // معالجة قائمة الصور
const imgMap = new Map();

imagesText.split("\n").forEach(line => {

    const file = line.trim();

    if (!file) return;

    // استخراج أول رقم من اسم الملف
    const match = file.match(/\d+/);

    if (!match) return;

    const sku = match[0];

    imgMap.set(sku, file);

});

setImagesList(imgMap);

                        // معالجة التصنيفات (بافتراض أن كل عمود هو قسم)
                        const catObj = {};
                        if (categoriesText) {
                            const rows = categoriesText.split('\n').map(row => row.split('\t').map(cell => cell.trim()));
                            if (rows.length > 0) {
                                const headers = rows[0];
                                headers.forEach(header => { if(header) catObj[header] = []; });
                                
                                for (let i = 1; i < rows.length; i++) {
                                    for (let j = 0; j < headers.length; j++) {
                                        if (rows[i][j]) {
                                            catObj[headers[j]].push(normalizeCleanId(rows[i][j]));
                                        }
                                    }
                                }
                            }
                        }
                        setCategories(catObj);

                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };
                loadAllData();
            }, []);
            
            const isDbEmpty = useMemo(() => databases.jeddah.length === 0 && databases.riyadh.length === 0, [databases]);

            useEffect(() => {
                if (warehouse && searchInputRef.current) searchInputRef.current.focus();
            }, [warehouse]);

            // فلترة نتائج البحث
            const searchResults = useMemo(() => {
                if (!warehouse || !query.trim()) return null; 
                
                const normalizedQuery = normalizeCleanId(query);
                const activeDb = databases[warehouse] || [];
                
                return activeDb.filter(item => {
                    const sku = normalizeCleanId(item.searchId);
                    if (/^\d+$/.test(normalizedQuery)) {
                        const numericSku = sku.replace(/^[a-z_]+/i, "");
                        return numericSku.startsWith(normalizedQuery);
                    }
                    return sku.startsWith(normalizedQuery);
                });
            }, [query, warehouse, databases]);

            // فلترة بيانات المعرض بناءً على القسم المختار
            const galleryResults = useMemo(() => {
                if (!activeCategory || !warehouse) return [];
                const activeDb = databases[warehouse] || [];

                if (activeCategory === 'نواقص الصور') {
                    // منتجات متوفرة بالمستودع ولكن ليس لها صورة
                    return activeDb.filter(item => !imagesList.has(normalizeCleanId(item.searchId)));
                }

                if (activeCategory === 'بقية الأصناف') {
                    // منتجات لها صورة، ومتوفرة، ولكن غير مصنفة في أي قسم
                    const allCategorizedIds = new Set(Object.values(categories).flat());
                    return activeDb.filter(item => {
                        const cleanId = normalizeCleanId(item.searchId);
                        return imagesList.has(cleanId) && !allCategorizedIds.has(cleanId);
                    });
                }

                // عرض منتجات القسم المختار (بشرط توفرها بالمستودع ووجود صورة لها)
                const categoryIds = new Set(categories[activeCategory] || []);
                return activeDb.filter(item => {
                    const cleanId = normalizeCleanId(item.searchId);
                    return categoryIds.has(cleanId) && imagesList.has(cleanId);
                });

            }, [activeCategory, warehouse, databases, imagesList, categories]);

            if (!userName) return <LoginScreen onLogin={(name) => setUserName(name)} />;
            if (loading) return <div className="min-h-screen flex items-center justify-center text-xl font-bold">جاري تحميل بيانات المخزون...</div>;

            return (
                <div className="max-w-[1024px] mx-auto px-16 sm:px-24 py-40 md:py-64 font-sans selection:bg-gray-200 relative">
                    
                    {/* Header */}
                    <header className="text-center mb-32 flex flex-col items-center gap-8">
                        <div className="bg-gray-50 border border-border px-16 py-8 rounded-full mb-8">
                            <span className="text-[13px] font-medium text-secondary">الاسم الكريم: {userName}</span>
                        </div>
                        <h1 className="text-[28px] md:text-[32px] font-bold text-primary m-0 leading-tight">
                            مخزون شركة بيت الأواني الطيبة
                        </h1>
                        <h2 className="text-[15px] md:text-[16px] text-secondary font-normal m-0">
                            نظام الاستعلام والمعرض الرقمي
                        </h2>
                        <p className="text-[13px] text-secondary">آخر تحديث للمخزون: {lastUpdate}</p>
                    </header>
                                        
                    {/* اختيار المستودع الأساسي */}
                    <div className="flex justify-center gap-16 mb-32" role="group">
                        <button onClick={() => setWarehouse('jeddah')} className={`px-24 py-16 rounded-12 text-[16px] font-medium transition-all w-[140px] md:w-[160px] ${warehouse === 'jeddah' ? 'bg-primary text-bg shadow-md' : 'bg-bg text-primary border border-primary hover:bg-gray-50'}`}>مخزون جدة</button>
                        <button onClick={() => setWarehouse('riyadh')} className={`px-24 py-16 rounded-12 text-[16px] font-medium transition-all w-[140px] md:w-[160px] ${warehouse === 'riyadh' ? 'bg-primary text-bg shadow-md' : 'bg-bg text-primary border border-primary hover:bg-gray-50'}`}>مخزون الرياض</button>
                    </div>

                    {/* منطقة البحث */}
                    <div className="max-w-[480px] mx-auto w-full mb-48 flex flex-col gap-8 relative pb-8 border-b border-border">
                        <div className="flex justify-between items-end mb-8">
                            <label htmlFor="searchInput" className={`text-[14px] font-medium ${warehouse ? 'text-primary' : 'text-secondary'}`}>البحث السريع</label>
                            
                            {/* مفتاح (Toggle) عرض الصور في البحث */}
                            <label className="flex items-center gap-8 cursor-pointer">
                                <span className="text-[13px] text-secondary">عرض مع الصورة</span>
                                <input type="checkbox" className="hidden" checked={showImageInSearch} onChange={(e) => setShowImageInSearch(e.target.checked)} disabled={!warehouse} />
                                <div className={`w-40 h-24 rounded-full transition-colors relative ${showImageInSearch ? 'bg-primary' : 'bg-gray-300'}`}>
                                    <div className={`absolute top-2 w-20 h-20 bg-white rounded-full transition-transform ${showImageInSearch ? 'left-2 translate-x-16' : 'left-2'}`}></div>
                                </div>
                            </label>
                        </div>

                        <div className="relative">
                            <input
                                ref={searchInputRef} id="searchInput" type="text" value={query} onChange={(e) => setQuery(e.target.value)} disabled={!warehouse}
                                placeholder={warehouse ? "اكتب رقم الصنف..." : "اختر المستودع أولاً"}
                                className={`w-full h-[56px] px-16 pl-48 rounded-12 border transition-all text-[16px] outline-none ${!warehouse ? 'bg-gray-50 border-border cursor-not-allowed opacity-60' : 'bg-bg focus:border-primary focus:ring-1 text-primary'}`}
                            />
                        </div>

                        {/* نتائج البحث (تظهر فقط إذا كان هناك بحث) */}
                        {query.trim() && (
                            <div className="w-full mt-16 min-h-[100px]">
                                {searchResults && searchResults.length === 0 ? <NotFoundState /> : 
                                 searchResults && searchResults.slice(0, 5).map(item => (
                                     <div key={item.id} className="mb-8">
                                         {/* تمرير خاصية showImageInSearch للمكون ليعرض الصورة أم لا */}
                                         <CompactResultCard item={item} showImage={showImageInSearch} imageCleanId={normalizeCleanId(item.searchId)} />
                                     </div>
                                 ))}
                            </div>
                        )}
                    </div>

                    {/* منطقة المعرض (Gallery) */}
                    <div className="w-full">
                        <div className="flex justify-between items-center mb-16">
                            <h3 className="text-[20px] font-bold text-primary">المعرض الرقمي</h3>
                            
                            {/* أزرار العرض الشبكي/الطولي */}
                            {activeCategory && (
                                <div className="flex gap-8">
                                    <button onClick={() => setGalleryView('grid')} className={`p-8 rounded-8 border ${galleryView === 'grid' ? 'bg-primary text-white' : 'bg-white text-secondary'}`}>🔲 شبكي</button>
                                    <button onClick={() => setGalleryView('list')} className={`p-8 rounded-8 border ${galleryView === 'list' ? 'bg-primary text-white' : 'bg-white text-secondary'}`}>🔤 طولي</button>
                                </div>
                            )}
                        </div>

                        {/* أزرار الأقسام */}
                        <div className="flex flex-wrap gap-8 mb-24">
                            {Object.keys(categories).map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === cat ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-border hover:bg-gray-50'}`}>
                                    {cat}
                                </button>
                            ))}
                            <button onClick={() => setActiveCategory('بقية الأصناف')} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === 'بقية الأصناف' ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-800 border-border hover:bg-gray-50'}`}>بقية الأصناف</button>
                            <button onClick={() => setActiveCategory('نواقص الصور')} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === 'نواقص الصور' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-red-600 border-border hover:bg-gray-50'}`}>📸 نواقص الصور</button>
                        </div>

                        {/* عرض نتائج المعرض للقسم المختار */}
                        {!warehouse ? (
                            <div className="text-center text-secondary py-32 bg-gray-50 rounded-12">يرجى اختيار المستودع (جدة أو الرياض) لفتح المعرض.</div>
                        ) : activeCategory ? (
                            <div className={galleryView === 'grid' ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-16" : "flex flex-col gap-16"}>
                                {galleryResults.length === 0 ? (
                                    <div className="col-span-full text-center text-secondary py-32">لا توجد أصناف متوفرة في هذا القسم.</div>
                                ) : (
                                    galleryResults.map(item => (
                                        <div key={item.id} className="border border-border rounded-12 p-16 bg-white flex flex-col items-center">
                                            {activeCategory !== 'نواقص الصور' && (
<img
    src={
        item.image
            ? `./images/${item.image}`
            : "./images/no-image.webp"
    }
	
    alt={item.searchId}
    className={`object-contain mb-16 rounded-8 ${
        galleryView === "grid"
            ? "w-full h-120"
            : "w-full max-w-[400px] h-auto"
    }`}
    loading="lazy"
    onError={(e) => {
        e.currentTarget.src = "./images/no-image.webp";
    }}
/>                                            )}
                                            <div className="text-[16px] font-bold text-primary">{item.searchId}</div>
                                            <div className="text-[14px] text-secondary">{item.name}</div>
                                            <div className="text-[14px] font-medium mt-8 text-green-700 bg-green-50 px-12 py-4 rounded-full">الكمية: {item.quantity}</div>
                                        </div>
                                    ))
                                )}
                            </div>
                        ) : (
                            <div className="text-center text-secondary py-32 bg-gray-50 rounded-12 border border-dashed border-gray-300">
                                اختر قسماً من الأعلى لاستعراض المنتجات المتوفرة.
                            </div>
                        )}
                    </div>
                            
                    <footer className="mt-64 pt-24 border-t border-border text-center">
                        <p className="text-[12px] text-secondary">© 2026 تطوير مهند الحزمي</p>
                    </footer>
                            
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
    }
    </script>
    
</body>
</html>
