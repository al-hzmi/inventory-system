<script type="text/babel">

// ============================================================
// الثوابت المركزية
// ============================================================
const DATA_PATH   = "./data/";
const IMAGES_PATH = "./images/";

const SEARCH_LOG_DEBOUNCE_MS = 1500;
const MULTI_TAP_WINDOW_MS    = 300;
const MAX_SKU_RESULTS        = 5;
const MAX_NAME_RESULTS       = 15;
const MIN_NAME_QUERY_LENGTH  = 2;
const GALLERY_PAGE_SIZE      = 60;
const LOW_STOCK_THRESHOLD    = 10;

const DEFAULT_GALLERY_VIEW = 'list';

const STORAGE_KEYS = { NAME: 'inventory_user_name', TOKEN: 'inventory_admin_token' };

const VISIBILITY_RULES = {
    hideOutOfStockInGallery         : true,
    hideOutOfStockInSearchWithImage : true,
    hideOutOfStockInPlainSearch     : false,
    hideQtyInSearchWithImage        : false,
};

const CARD_VIEW = { IMAGE: 0, QUANTITY: 1, DETAILS: 2 };

const WAREHOUSES = {
    jeddah: { key: 'jeddah', label: 'مخزون جدة',   name: 'مستودع جدة'   },
    riyadh: { key: 'riyadh', label: 'مخزون الرياض', name: 'مستودع الرياض' },
};

const SPECIAL_CATEGORIES = {
    UNCATEGORIZED : 'بقية الأصناف',
    MISSING_IMAGES: 'نواقص الصور',
};

const ADMIN_ONLY_CATEGORIES = new Set([SPECIAL_CATEGORIES.MISSING_IMAGES]);

const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
const NUMBER_FORMATTER = new Intl.NumberFormat('en-US');

// ============================================================
// التطبيع (Mission Critical)
// ============================================================
const ARABIC_INDIC_DIGITS   = '٠١٢٣٤٥٦٧٨٩';
const EASTERN_ARABIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

const toEnglishDigits = (str) => {
    if (!str) return '';
    return String(str).replace(/[٠-٩۰-۹]/g, (d) => {
        const i = ARABIC_INDIC_DIGITS.indexOf(d);
        return i > -1 ? String(i) : String(EASTERN_ARABIC_DIGITS.indexOf(d));
    });
};

const normalizeCleanId = (str) => {
    if (!str) return "";
    return toEnglishDigits(str).replace(/\D/g, "");
};

const normalizeText = (str) => {
    if (!str) return '';
    return toEnglishDigits(String(str))
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/[ىئ]/g, 'ي')
        .replace(/ؤ/g, 'و')
        .replace(/ة/g, 'ه')
        .replace(/[^\u0600-\u06FFa-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
};

const toSafeDocId = (name) => {
    const c = String(name || '').replace(/[\/\\\[\]#?]/g, '_').replace(/^\.+|\.+$/g, '').trim();
    return c.slice(0, 200) || 'unknown';
};

// ============================================================
// الصلاحيات
// ============================================================
const CODE_SALT = 'bayt-awani::v5::';

const hashCode = (str) => {
    let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
    const s = CODE_SALT + String(str);
    for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
        h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
    }
    return h1.toString(36) + '-' + h2.toString(36);
};
window.__genCode = (code) => hashCode(code);

const PROTECTED_ACCOUNTS = {
    'مهند': '1jh297-spgf2z',
};

const isProtectedName = (name) =>
    Object.prototype.hasOwnProperty.call(PROTECTED_ACCOUNTS, normalizeText(name));

const verifyCode = (name, code) => {
    const expected = PROTECTED_ACCOUNTS[normalizeText(name)];
    return Boolean(expected) && hashCode(toEnglishDigits(String(code)).trim()) === expected;
};

// ============================================================
// تحميل البيانات
// ============================================================
const fetchText = async (url) => {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.text();
    } catch (err) { console.warn(`[Data] تعذر تحميل ${url}:`, err.message); return ""; }
};

const fetchJson = async (url) => {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    } catch (err) { console.warn(`[Data] تعذر تحميل ${url}:`, err.message); return null; }
};

const parsePricingMap = (rawText) => {
    const map = {};
    if (!rawText) return map;
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return map;

    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(lines.length, 5); i++) {
        if (lines[i] && lines[i].includes('سعر') && (lines[i].includes('رقم') || lines[i].includes('صنف'))) {
            headerRowIdx = i;
            break;
        }
    }
    if (headerRowIdx === -1) return map;

    const headers = lines[headerRowIdx].split('\t').map(h => h.trim());
    const pairs = [];

    for (let i = 0; i < headers.length; i++) {
        if (/رقم|كود|صنف/i.test(headers[i])) {
            if (i > 0 && /سعر|بيع/i.test(headers[i - 1])) {
                pairs.push({ skuIdx: i, priceIdx: i - 1 });
            } else if (i < headers.length - 1 && /سعر|بيع/i.test(headers[i + 1])) {
                pairs.push({ skuIdx: i, priceIdx: i + 1 });
            }
        }
    }

    for (let i = headerRowIdx + 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        pairs.forEach(pair => {
            const rawSku = cols[pair.skuIdx];
            const rawPrice = cols[pair.priceIdx];
            
            if (rawSku && rawPrice) {
                const cleanId = normalizeCleanId(rawSku);
                const price = parseFloat(toEnglishDigits(rawPrice).replace(/,/g, ''));
                if (cleanId && !isNaN(price) && price > 0) {
                    map[cleanId] = price;
                }
            }
        });
    }
    return map;
};

const parseExcelData = (rawText, warehouseKey, pricingMap) => {
    if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return [];

    const headers = lines[0].split('\t').map(h => h.trim());
    const idIdx   = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
    const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
    const qtyIdx  = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
    const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
    const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

    if (idIdx === -1) {
        console.error(`[Parser:${warehouseKey}] لم يُعثر على عمود رقم الصنف:`, headers);
        return [];
    }

    const dataMap = {};
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        if (cols.length === 0 || (!cols[idIdx] && (nameIdx === -1 || !cols[nameIdx]))) continue;

        const rawId    = cols[idIdx] ? cols[idIdx].trim() : '';
        const searchId = toEnglishDigits(rawId).toLowerCase();
        if (!searchId) continue;

        const name   = nameIdx !== -1 && cols[nameIdx] ? cols[nameIdx].trim() : '';
        const rawQty = toEnglishDigits(qtyIdx !== -1 ? (cols[qtyIdx] || '0') : '0').replace(/,/g, '');
        const qty    = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);

        const packStr = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';
        const cleanId = normalizeCleanId(rawId);
        
        const cartonPrice = pricingMap[cleanId] || 0;
        let approxPiecePrice = 0;

        if (cartonPrice > 0) {
            const packNum = parseFloat(toEnglishDigits(packStr).replace(/[^0-9.]/g, ''));
            if (!isNaN(packNum) && packNum > 0) {
                approxPiecePrice = cartonPrice / packNum;
            }
        }

        dataMap[searchId] = {
            uid: `${warehouseKey}:${searchId}`,
            warehouseKey,
            id: rawId,
            searchId,
            cleanId: cleanId,
            name,
            searchName: normalizeText(name),
            qty,
            unit: unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '',
            pack: packStr,
            price: cartonPrice,
            approxPrice: approxPiecePrice
        };
    }
    return Object.values(dataMap);
};
    
const reportCleanIdCollisions = (items, warehouseKey) => {
    const byClean = new Map();
    items.forEach(it => {
        if (!it.cleanId) return;
        if (!byClean.has(it.cleanId)) byClean.set(it.cleanId, []);
        byClean.get(it.cleanId).push(it.id);
    });
    const collisions = [];
    byClean.forEach((ids, clean) => { if (ids.length > 1) collisions.push({ clean, ids }); });
    if (collisions.length) {
        console.warn(`[Integrity:${warehouseKey}] ${collisions.length} تصادم في الأرقام الصافية:`, collisions);
    }
};

const buildImagesMap = (imagesText) => {
    const map = new Map();
    imagesText.split('\n').forEach((line) => {
        const fileName = line.trim();
        if (!fileName) return;
        const clean = normalizeCleanId(fileName.replace(/\.[^.]+$/, ''));
        if (clean && !map.has(clean)) map.set(clean, fileName);
    });
    return map;
};

const parseCategories = (text) => {
    const obj = {};
    if (!text) return obj;
    const rows = text.split('\n').map(r => r.split('\t').map(c => c.trim()));
    if (rows.length === 0) return obj;
    const headers = rows[0];
    headers.forEach(h => { if (h) obj[h] = []; });
    for (let i = 1; i < rows.length; i++) {
        for (let j = 0; j < headers.length; j++) {
            const h = headers[j];
            if (!h || !obj[h]) continue;
            const clean = normalizeCleanId(rows[i][j]);
            if (clean) obj[h].push(clean);
        }
    }
    return obj;
};

// ============================================================
// محرك البحث (رقم + اسم)
// ============================================================
const runSearch = (activeDb, rawQuery, hideOutOfStock) => {
    const cleanQuery = normalizeCleanId(rawQuery);
    const textQuery  = normalizeText(rawQuery);
    const nameTokens = textQuery.length >= MIN_NAME_QUERY_LENGTH ? textQuery.split(' ').filter(Boolean) : [];

    if (!cleanQuery && nameTokens.length === 0) return { visible: [], total: 0, exact: null };

    const ranked = [];
    for (let i = 0; i < activeDb.length; i++) {
        const item = activeDb[i];
        if (hideOutOfStock && item.qty <= 0) continue;

        let rank = -1;
        if (cleanQuery && item.cleanId.startsWith(cleanQuery)) {
            rank = item.cleanId === cleanQuery ? 0 : 1;
        } else if (nameTokens.length && item.searchName) {
            let all = true;
            for (let t = 0; t < nameTokens.length; t++) {
                if (!item.searchName.includes(nameTokens[t])) { all = false; break; }
            }
            if (all) rank = item.searchName.startsWith(nameTokens[0]) ? 2 : 3;
        }
        if (rank !== -1) ranked.push({ item, rank });
    }

    ranked.sort((a, b) => a.rank - b.rank);

    const sku = [], nm = [];
    for (let i = 0; i < ranked.length; i++) {
        const r = ranked[i];
        if (r.rank <= 1) { if (sku.length < MAX_SKU_RESULTS) sku.push(r.item); }
        else             { if (nm.length  < MAX_NAME_RESULTS) nm.push(r.item);  }
    }
    return {
        visible: sku.concat(nm),
        total: ranked.length,
        exact: ranked.length && ranked[0].rank === 0 ? ranked[0].item : null
    };
};

const stockTone = (qty) => {
    if (qty <= 0) return { text:'text-danger',  bg:'bg-dangerSoft'  };
    if (qty <= LOW_STOCK_THRESHOLD) return { text:'text-warn', bg:'bg-warnSoft' };
    return { text:'text-success', bg:'bg-successSoft' };
};

const LoginScreen = ({ onLogin }) => {
    const [name, setName]       = useState('');
    const [code, setCode]       = useState('');
    const [needCode, setNeed]   = useState(false);
    const [error, setError]     = useState('');
    const [notice, setNotice]   = useState('');
    const [loading, setLoading] = useState(false);
    const codeRef = useRef(null);

    useEffect(() => { if (needCode && codeRef.current) codeRef.current.focus(); }, [needCode]);

    const handleSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) return;

        let isAdmin = false;
        if (isProtectedName(trimmed)) {
            if (!code.trim()) {
                setNeed(true);
                setError('هذا الاسم محمي. أدخل رمز الدخول للمتابعة.');
                return;
            }
            if (!verifyCode(trimmed, code)) {
                setNeed(true);
                setError('رمز الدخول غير صحيح.');
                return;
            }
            isAdmin = true;
        }

        setError('');
        setLoading(true);

        try {
            const db = await getDb();
            const userRef = db.collection('users').doc(toSafeDocId(trimmed));
            const doc = await userRef.get();
            const info = { userAgent: navigator.userAgent, lastLogin: firebase.firestore.FieldValue.serverTimestamp() };
            if (doc.exists) {
                await userRef.update({ ...info, loginCount: firebase.firestore.FieldValue.increment(1) });
            } else {
                await userRef.set({ name: trimmed, ...info, loginCount: 1, firstJoined: firebase.firestore.FieldValue.serverTimestamp() });
            }
            await db.collection('login_logs').add({
                name: trimmed, isAdmin,
                time: firebase.firestore.FieldValue.serverTimestamp(),
                userAgent: navigator.userAgent
            });
        } catch (err) {
            console.error("Error logging in:", err);
            setNotice('تعذر الاتصال بسجل الدخول، وتم الدخول بشكل طبيعي.');
        }

        localStorage.setItem(STORAGE_KEYS.NAME, trimmed);
        if (isAdmin) localStorage.setItem(STORAGE_KEYS.TOKEN, hashCode(toEnglishDigits(String(code)).trim()));
        else localStorage.removeItem(STORAGE_KEYS.TOKEN);

        setLoading(false);
        onLogin(trimmed, isAdmin);
    };

    return (
        <div className="min-h-screen bg-surface flex items-center justify-center p-16 font-sans">
            <div className="animate-card w-full max-w-[380px] bg-bg border border-border rounded-20 shadow-lift p-24 sm:p-32">
                <div className="text-center mb-32">
                    <h1 className="text-[22px] font-bold text-primary mb-4">نظام المخزون</h1>
                    <p className="text-[13px] text-secondary">شركة بيت الأواني الطيبة</p>
                </div>

                <form onSubmit={handleSubmit} className="flex flex-col gap-16">
                    <div>
                        <label htmlFor="employeeName" className="text-[13px] font-medium text-primary mb-8 block">الإسم الكريم</label>
                        <input id="employeeName" type="text" required autoComplete="name" value={name}
                               onChange={(e) => { setName(e.target.value); setError(''); }}
                               placeholder="اكتب اسمك هنا..."
                               className="w-full h-48 px-16 rounded-12 border border-border bg-bg focus:border-accent text-primary outline-none transition-colors" />
                    </div>

                    {needCode && (
                        <div className="animate-card">
                            <label htmlFor="accessCode" className="text-[13px] font-medium text-primary mb-8 flex items-center gap-6">
                                <Icon.Lock className="w-14 h-14 text-accent flex-shrink-0" /> رمز الدخول
                            </label>
                            <input ref={codeRef} id="accessCode" type="password" inputMode="numeric" autoComplete="off" value={code}
                                   onChange={(e) => { setCode(e.target.value); setError(''); }}
                                   placeholder="••••"
                                   className="w-full h-48 px-16 rounded-12 border border-border bg-bg focus:border-accent text-primary outline-none transition-colors tracking-widest" />
                        </div>
                    )}

                    {error  && <p className="text-[13px] text-danger flex items-center gap-6"><Icon.Alert className="w-14 h-14 flex-shrink-0" />{error}</p>}
                    {notice && <p className="text-[12px] text-secondary">{notice}</p>}

                    <button type="submit" disabled={loading}
                            className="w-full h-48 bg-primary text-bg rounded-12 font-semibold text-[15px] hover:opacity-90 disabled:opacity-60 transition-opacity">
                        {loading ? "جاري الدخول..." : "دخول للنظام"}
                    </button>
                </form>
            </div>
        </div>
    );
};

const BarcodeScannerModal = memo(({ onClose, onScan }) => {
    const [camError, setCamError] = useState("");

    useEffect(() => {
        let isMounted = true;
        const html5QrCode = new Html5Qrcode("reader");

        // 1. تطبيق إعدادات الخبير (المربع الديناميكي، تقليل الإطارات للمعالجة، وتحديد الصيغ)
        const config = {
            fps: 10, 
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                const size = Math.min(viewfinderWidth, viewfinderHeight) * 0.72;
                return { width: size, height: size };
            },
            aspectRatio: 1,
            disableFlip: true,
            useBarCodeDetectorIfSupported: true,
            rememberLastUsedCamera: true,
            showTorchButtonIfSupported: true,
            supportedScanTypes: [window.Html5QrcodeScanType?.SCAN_TYPE_CAMERA || 0],
            formatsToSupport: [
                window.Html5QrcodeSupportedFormats.CODE_128,
                window.Html5QrcodeSupportedFormats.CODE_39,
                window.Html5QrcodeSupportedFormats.EAN_13,
                window.Html5QrcodeSupportedFormats.EAN_8,
                window.Html5QrcodeSupportedFormats.UPC_A,
                window.Html5QrcodeSupportedFormats.UPC_E
            ]
        };

        let lastCode = "";
        let lastTime = 0;

        const onScanSuccess = (decodedText) => {
            // 2. تنظيف الباركود كما أشار الخبير
            const code = decodedText.trim();
            if (!code) return; 

            // 3. استخدام Date.now() للسرعة والتوافقية
            const now = Date.now();
            if (code === lastCode && (now - lastTime) < 1000) return;
            lastCode = code;
            lastTime = now;

            if (isMounted) {
                requestAnimationFrame(async () => {
                    // 4. الإغلاق والتنظيف العميق للذاكرة (يمنع تعليق الكاميرا في الآيفون)
                    try {
                        await html5QrCode.stop();
                        await html5QrCode.clear(); 
                    } catch (e) {}
                    
                    onScan(code);
                });
            }
        };

        // 5. التخلي عن exact لتجنب تأخير الآيفون (كما نصح الخبير)
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            (errorMessage) => { /* نتجاهل أخطاء عدم العثور على باركود اللحظية */ }
        ).then(() => {
            // نطبق الفوكس والزوم في وضع الـ Try/Catch حتى لا يكسر النظام إذا رفضها الآيفون
            try {
                const track = html5QrCode.getRunningTrack 
                    ? html5QrCode.getRunningTrack() 
                    : document.querySelector("#reader video")?.srcObject?.getVideoTracks()[0];
                
                if (track && track.getCapabilities) {
                    const capabilities = track.getCapabilities();
                    const advancedConstraints = [];

                    if (capabilities.focusMode) advancedConstraints.push({ focusMode: "continuous" });
                    if (capabilities.zoom) advancedConstraints.push({ zoom: Math.min(capabilities.zoom.max, 2) });

                    if (advancedConstraints.length > 0) {
                        track.applyConstraints({ advanced: advancedConstraints }).catch(() => {});
                    }
                }
            } catch (e) {}
        }).catch((err) => {
            console.error("خطأ الكاميرا:", err);
            if (isMounted) setCamError("تعذر فتح الكاميرا. تأكد من إعطاء الصلاحية للمتصفح.");
        });

        return () => {
            isMounted = false;
            if (html5QrCode.isScanning) {
                // تنظيف الذاكرة عند إغلاق النافذة يدوياً
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
        };
    }, [onScan]);

    return (
        <div className="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-16 animate-card">
            <div className="w-full max-w-[380px] bg-bg rounded-16 overflow-hidden shadow-lift flex flex-col">
                <div className="p-16 flex justify-between items-center border-b border-border bg-surface">
                    <h3 className="font-bold text-primary flex items-center gap-8">
                        <Icon.Scan className="w-20 h-20 text-accent"/> مسح الباركود
                    </h3>
                    <button onClick={onClose} className="p-4 bg-bg rounded-8 border border-border">
                        <Icon.Close className="w-16 h-16 text-secondary"/>
                    </button>
                </div>
                
                <div className="w-full bg-black min-h-[300px] relative flex items-center justify-center overflow-hidden">
                    {camError ? (
                        <div className="text-danger text-center p-24 text-[13px] font-medium leading-relaxed">
                            <Icon.Alert className="w-24 h-24 mx-auto mb-8 text-danger" />
                            {camError}
                        </div>
                    ) : (
                        <div id="reader" className="w-full h-full object-cover"></div>
                    )}
                </div>
                
                <div className="p-16 text-center text-[13px] font-medium text-primary bg-surface border-t border-border">
                    وجّه الكاميرا نحو الباركود
                    <p className="text-[11px] text-muted font-normal mt-4">مدعوم بتقنية التسريع العتادي ⚡️</p>
                </div>
            </div>
        </div>
    );
});

    const [databases, setDatabases]   = useState({ jeddah: [], riyadh: [] });
    const [imagesList, setImagesList] = useState(new Map());
    const [categories, setCategories] = useState({});

    const [activeCategory, setActiveCategory] = useState(null);
    const [galleryView, setGalleryView]       = useState(DEFAULT_GALLERY_VIEW);
    const [visibleCount, setVisibleCount]     = useState(GALLERY_PAGE_SIZE);
    const [cardViews, setCardViews]           = useState({});
    const [zoomItem, setZoomItem]             = useState(null);

    const [loading, setLoading]       = useState(true);
    const [lastUpdate, setLastUpdate] = useState("جاري التحقق...");

    const searchInputRef   = useRef(null);
    const lastLoggedSearch = useRef('');
    const tapStateRef      = useRef({ uid: null, count: 0, timer: null });

    useEffect(() => {
        let alive = true;
        (async () => {
            try {
                const [jT, rT, iT, cT, vJ, pT] = await Promise.all([
                    fetchText(`${DATA_PATH}jeddah.tsv`),
                    fetchText(`${DATA_PATH}riyadh.tsv`),
                    fetchText(`${DATA_PATH}images_list.txt`),
                    fetchText(`${DATA_PATH}categories.tsv`),
                    fetchJson(`${DATA_PATH}version.json`),
                    fetchText(`${DATA_PATH}pricing.tsv`)
                ]);
                if (!alive) return;

                const pricingMap = parsePricingMap(pT);

                const jeddah = parseExcelData(jT, WAREHOUSES.jeddah.key, pricingMap);
                const riyadh = parseExcelData(rT, WAREHOUSES.riyadh.key, pricingMap);
                
                reportCleanIdCollisions(jeddah, WAREHOUSES.jeddah.key);
                reportCleanIdCollisions(riyadh, WAREHOUSES.riyadh.key);

                setDatabases({ jeddah, riyadh });
                setImagesList(buildImagesMap(iT));
                setCategories(parseCategories(cT));
                setLastUpdate(vJ && vJ.lastUpdate
                    ? (typeof dayjs !== 'undefined' ? dayjs(vJ.lastUpdate).fromNow() : vJ.lastUpdate)
                    : "غير متوفر");
            } catch (err) {
                console.error('[Boot] فشل غير متوقع:', err);
                if (alive) setLastUpdate("غير متوفر");
            } finally {
                if (alive) setLoading(false);
            }
        })();
        return () => { alive = false; };
    }, []);

    useEffect(() => () => { if (tapStateRef.current.timer) clearTimeout(tapStateRef.current.timer); }, []);

    useEffect(() => {
        const onKey = (e) => {
            const el = document.activeElement;
            const typing = el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
            if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
                e.preventDefault();
                if (searchInputRef.current) searchInputRef.current.focus();
            }
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
    }, []);

    useEffect(() => { if (warehouse && searchInputRef.current) searchInputRef.current.focus(); }, [warehouse]);
    useEffect(() => { setVisibleCount(GALLERY_PAGE_SIZE); setCardViews({}); }, [activeCategory, warehouse]);

    useEffect(() => {
        if (!isAdmin && activeCategory && ADMIN_ONLY_CATEGORIES.has(activeCategory)) setActiveCategory(null);
    }, [isAdmin, activeCategory]);

    const isDbEmpty = useMemo(
        () => databases.jeddah.length === 0 && databases.riyadh.length === 0,
        [databases]
    );

// -----------------------------------------------------------------
    // المحلل الذكي للباركود (النسخة المتقدمة - صائد الأصناف من أي مكان)
    // -----------------------------------------------------------------
    useEffect(() => {
        const cleanQ = normalizeCleanId(query);
        
        // هل المدخل يشبه الباركود؟ (طويل ويحتوي على أرقام فقط)
        if (cleanQ.length >= 8 && /^\d+$/.test(cleanQ)) {
            const pool = databases[warehouse] || [];
            
            // 1. هل يوجد تطابق تام للباركود؟ (إذا كان الباركود مسجلاً كنفسه)
            const exactMatch = pool.find(item => item.cleanId === cleanQ);
            if (exactMatch) return; // لا تفعل شيئاً، محرك البحث العادي سيتكفل به

            // 2. البحث المتداخل: نبحث عن أي صنف يقع رقمه "داخل" الباركود الممسوح
            // وضعنا شرط أن يكون طول الصنف 3 أرقام فأكثر لمنع التطابقات العشوائية
            const possibleMatches = pool.filter(item => 
                item.cleanId && 
                item.cleanId.length >= 3 && 
                cleanQ.includes(item.cleanId)
            );

            if (possibleMatches.length > 0) {
                // 3. ترتيب النتائج من الأطول للأقصر لضمان دقة الالتقاط
                // مثلاً لو الباركود فيه "26251" وصنفنا الأول "262" والثاني "26251"، سيختار الأطول
                possibleMatches.sort((a, b) => b.cleanId.length - a.cleanId.length);
                
                const bestMatch = possibleMatches[0];
                if (bestMatch.id !== query) {
                    setQuery(bestMatch.id); // استبدال الباركود الطويل برقم الصنف المستخرج
                }
            }
        }
    }, [query, warehouse, databases]);
    
    // ---------- آلة حالة النقر ----------
    const applyTaps = useCallback((uid, taps) => {
        setCardViews(prev => {
            const cur = prev[uid] || CARD_VIEW.IMAGE;
            let next = cur;
            if (taps >= 3)       next = CARD_VIEW.DETAILS;
            else if (taps === 2) next = (cur === CARD_VIEW.IMAGE) ? CARD_VIEW.QUANTITY : CARD_VIEW.IMAGE;
            return next === cur ? prev : { ...prev, [uid]: next };
        });
    }, []);

    const handleCardTap = useCallback((uid) => {
        const s = tapStateRef.current;
        if (s.uid !== uid) { if (s.timer) clearTimeout(s.timer); s.uid = uid; s.count = 0; }
        s.count += 1;
        if (s.timer) clearTimeout(s.timer);
        s.timer = setTimeout(() => {
            const taps = s.count;
            s.count = 0; s.uid = null; s.timer = null;
            applyTaps(uid, taps);
        }, MULTI_TAP_WINDOW_MS);
    }, [applyTaps]);

    const handleCardCycle = useCallback((uid) => {
        setCardViews(prev => {
            const cur = prev[uid] || CARD_VIEW.IMAGE;
            const next = cur === CARD_VIEW.IMAGE ? CARD_VIEW.QUANTITY
                       : cur === CARD_VIEW.QUANTITY ? CARD_VIEW.DETAILS
                       : CARD_VIEW.IMAGE;
            return { ...prev, [uid]: next };
        });
    }, []);

    const handleZoom = useCallback((item) => setZoomItem(item), []);

    // ---------- البحث ----------
    const hideOutOfStockInSearch = showImageInSearch
        ? VISIBILITY_RULES.hideOutOfStockInSearchWithImage
        : VISIBILITY_RULES.hideOutOfStockInPlainSearch;
    const hideQtyInSearch = showImageInSearch && VISIBILITY_RULES.hideQtyInSearchWithImage;

    const search = useMemo(() => {
        if (!warehouse || !query.trim()) return null;
        return runSearch(databases[warehouse] || [], query, hideOutOfStockInSearch);
    }, [query, warehouse, databases, hideOutOfStockInSearch]);

    useEffect(() => {
        if (!warehouse || !search || search.total === 0) return;
        const key = `${warehouse}:${normalizeText(query)}`;
        if (lastLoggedSearch.current === key) return;
        const t = setTimeout(async () => {
            lastLoggedSearch.current = key;
            try {
                const db = await getDb();
                await db.collection('search_logs').add({
                    name: sessionName, warehouse,
                    rawQuery: query.trim(),
                    cleanQuery: normalizeCleanId(query),
                    resultsCount: search.total,
                    exactMatch: Boolean(search.exact),
                    time: firebase.firestore.FieldValue.serverTimestamp(),
                });
            } catch (err) { console.warn('[Log] تعذر تسجيل البحث:', err.message); }
        }, SEARCH_LOG_DEBOUNCE_MS);
        return () => clearTimeout(t);
    }, [search, warehouse, query, sessionName]);

    // ---------- المعرض ----------
    const allCategorizedIds = useMemo(() => new Set(Object.values(categories).flat()), [categories]);
    const categoryNames = useMemo(() => Object.keys(categories), [categories]);

    const galleryResults = useMemo(() => {
        if (!activeCategory || !warehouse) return [];
        if (ADMIN_ONLY_CATEGORIES.has(activeCategory) && !isAdmin) return [];

        let pool = databases[warehouse] || [];
        if (VISIBILITY_RULES.hideOutOfStockInGallery) pool = pool.filter(i => i.qty > 0);

        if (activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES)
            return pool.filter(i => !imagesList.has(i.cleanId));
        if (activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED)
            return pool.filter(i => imagesList.has(i.cleanId) && !allCategorizedIds.has(i.cleanId));

        const ids = new Set(categories[activeCategory] || []);
        return pool.filter(i => ids.has(i.cleanId) && imagesList.has(i.cleanId));
    }, [activeCategory, warehouse, databases, imagesList, categories, allCategorizedIds, isAdmin]);

    const visibleItems = useMemo(() => galleryResults.slice(0, visibleCount), [galleryResults, visibleCount]);

    const isMissingImagesView = activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES;
    const activeWarehouseName = warehouse ? WAREHOUSES[warehouse].name : '';
    const totalCategoryCount  = categoryNames.length + 1 + (isAdmin ? 1 : 0);

    if (!sessionName) return <LoginScreen onLogin={(n, admin) => { setSessionName(n); setIsAdmin(admin); }} />;

    const chip = (active) =>
        `px-14 py-10 rounded-full text-[13px] font-medium border transition-colors duration-200 ${active
            ? 'bg-primary text-bg border-primary'
            : 'bg-bg text-secondary border-border hover:border-muted hover:text-primary'}`;

    return (
        <div className="min-h-screen font-sans">

            {/* ===== شريط الهوية (يمرر مع الصفحة) ===== */}
            <div className="border-b border-border bg-surface">
                <div className="max-w-[1024px] mx-auto px-16 h-44 flex items-center justify-between gap-12">
                    <span className="text-[12px] text-secondary truncate min-w-0">الاسم الكريم: {sessionName}</span>
                    
                    {/* رابط الواتساب العلوي */}
                    <a 
                        href="https://wa.me/966506762257" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-[11px] text-muted hover:text-accent transition-colors flex-shrink-0 cursor-pointer"
                        title="تواصل مع المطور عبر واتساب"
                    >
                        © 2026 تطوير مهند الحزمي
                    </a>
                </div>
            </div>
            
            {/* ===== الترويسة ===== */}
            <div className="max-w-[1024px] mx-auto px-16">
                <header className="text-center pt-32 pb-24 flex flex-col items-center gap-8">
                    <h1 className="text-[24px] sm:text-[28px] md:text-[32px] font-bold text-primary leading-tight">
                        مخزون شركة بيت الأواني الطيبة
                    </h1>
                    <h2 className="text-[14px] sm:text-[16px] text-secondary font-normal">
                        نظام الاستعلام والمعرض الرقمي
                    </h2>
                    <p className="text-[12px] text-muted">آخر تحديث للمخزون: {lastUpdate}</p>
                </header>
            </div>

            {/* ===== لوحة التحكم الثابتة ===== */}
            <div className="sticky top-0 z-30 bg-bg/95 backdrop-blur border-b border-border">
                <div className="max-w-[1024px] mx-auto px-16 py-12 flex flex-col gap-10">

                    {/* اختيار المستودع */}
                    <div className="flex w-full sm:w-auto sm:self-start bg-surface border border-border rounded-12 p-4 gap-4"
                         role="group" aria-label="اختيار المستودع">
                        {Object.values(WAREHOUSES).map(wh => (
                            <button key={wh.key} onClick={() => setWarehouse(wh.key)} aria-pressed={warehouse === wh.key}
                                    className={`flex-1 sm:flex-none sm:px-32 h-40 rounded-10 text-[15px] font-semibold transition-colors duration-200 ${warehouse === wh.key ? 'bg-primary text-bg' : 'text-secondary hover:text-primary'}`}>
                                {wh.label}
                            </button>
                        ))}
                    </div>

                    <div className="flex items-center gap-12">
                        <div className="relative flex-1 min-w-0">
                            <Icon.Search className="w-18 h-18 text-muted absolute right-14 top-1/2 -translate-y-1/2 pointer-events-none" />
                            
                            <input ref={searchInputRef} id="searchInput" type="text" autoComplete="off"
                                   value={query} onChange={(e) => setQuery(e.target.value)} disabled={!warehouse}
                                   placeholder={warehouse ? "اكتب رقم الصنف أو امسح الباركود..." : "اختر المستودع أولاً"}
                                   className={`w-full h-48 pr-40 pl-48 rounded-12 border outline-none transition-colors ${!warehouse ? 'bg-surface border-border text-muted cursor-not-allowed' : 'bg-bg border-border focus:border-accent text-primary'}`} />
                            
                            {/* زر فتح كاميرا الباركود */}
                            {warehouse && (
                                <button 
                                    onClick={() => setShowScanner(true)}
                                    title="مسح الباركود بالكاميرا"
                                    className="absolute left-6 top-1/2 -translate-y-1/2 w-36 h-36 flex items-center justify-center rounded-8 text-secondary bg-surface border border-border hover:text-accent hover:border-accent transition-colors"
                                >
                                    <Icon.Scan className="w-18 h-18" />
                                </button>
                            )}
                        </div>

                        {/* مفتاح (عرض مع الصورة) */}
                        <label className="flex items-center gap-8 cursor-pointer flex-shrink-0">
                            <span className="hidden sm:inline text-[12px] text-secondary whitespace-nowrap">عرض مع الصورة</span>
                            <input type="checkbox" className="sr-only" checked={showImageInSearch}
                                   onChange={(e) => setShowImageInSearch(e.target.checked)} disabled={!warehouse} />
                            <div className={`w-44 h-26 rounded-full transition-colors relative flex-shrink-0 ${showImageInSearch ? 'bg-accent' : 'bg-border'} ${!warehouse ? 'opacity-50' : ''}`}>
                                <div className={`absolute top-2 left-2 w-22 h-22 bg-bg rounded-full shadow-card transition-transform ${showImageInSearch ? 'translate-x-18' : ''}`}></div>
                            </div>
                        </label>
                    </div>

                    {warehouse && showImageInSearch && (
                        <p className="text-[11px] text-accent"> عرض صورة المنتج</p>
                    )}
                </div>
            </div>

            <div className="max-w-[1024px] mx-auto px-16 pb-64">

                {isDbEmpty && !loading && (
                    <div className="max-w-[480px] mx-auto mt-24">
                        <StateBlock tone="danger" icon={<Icon.Alert className="w-20 h-20" />}
                            title="تعذر تحميل بيانات المخزون"
                            note="تحقق من وجود jeddah.tsv و riyadh.tsv في مجلد data ومن صحة ترويسة الأعمدة." />
                    </div>
                )}

                {/* ===== نتائج البحث ===== */}
                {query.trim() && search && (
                    <div className="max-w-[520px] mx-auto mt-24 flex flex-col gap-8">
                        {search.total === 0 && (
                            <StateBlock icon={<Icon.Search className="w-20 h-20" />}
                                title="لم يتم العثور على الصنف"
                                note="لا يوجد صنف بهذا الرقم أو الاسم في المستودع المحدد." />
                        )}
                        {search.exact && (
                            <FullResultCard item={search.exact} warehouseName={activeWarehouseName}
                                showImage={showImageInSearch && imagesList.has(search.exact.cleanId)}
                                imageFileName={imagesList.get(search.exact.cleanId)}
                                hideQty={hideQtyInSearch} />
                        )}
                        {search.visible
                            .filter(i => !search.exact || i.uid !== search.exact.uid)
                            .map(item => (
                                <CompactResultCard key={item.uid} item={item}
                                    showImage={showImageInSearch && imagesList.has(item.cleanId)}
                                    imageFileName={imagesList.get(item.cleanId)}
                                    hideQty={hideQtyInSearch} />
                            ))}
                        {search.total > search.visible.length && (
                            <p className="text-[12px] text-muted text-center pt-8">
                                {NUMBER_FORMATTER.format(search.total)} نتيجة — أضف تفاصيل لتضييق البحث
                            </p>
                        )}
                    </div>
                )}

                {/* ===== المعرض الرقمي ===== */}
                <section className="mt-40">
                    <div className="flex justify-between items-end gap-12 mb-12">
                        <div className="min-w-0">
                            <h2 className="text-[18px] font-bold text-primary">المعرض الرقمي</h2>
                            {warehouse && <p className="text-[12px] text-muted mt-2">{activeWarehouseName}</p>}
                        </div>
                        {activeCategory && (
                            <div className="flex bg-surface border border-border rounded-10 p-4 gap-4 flex-shrink-0" role="group" aria-label="نمط العرض">
                                <button onClick={() => setGalleryView('list')} aria-pressed={galleryView === 'list'}
                                        className={`flex items-center gap-6 px-12 h-36 rounded-8 text-[13px] font-medium transition-colors ${galleryView === 'list' ? 'bg-primary text-bg' : 'text-secondary'}`}>
                                    <Icon.List className="w-16 h-16" /> طولي
                                </button>
                                <button onClick={() => setGalleryView('grid')} aria-pressed={galleryView === 'grid'}
                                        className={`flex items-center gap-6 px-12 h-36 rounded-8 text-[13px] font-medium transition-colors ${galleryView === 'grid' ? 'bg-primary text-bg' : 'text-secondary'}`}>
                                    <Icon.Grid className="w-16 h-16" /> شبكي
                                </button>
                            </div>
                        )}
                    </div>

                    <p className="text-[12px] text-muted mb-8">الأقسام ({NUMBER_FORMATTER.format(totalCategoryCount)})</p>
                    <div className="flex flex-wrap gap-8 mb-20">
                        {categoryNames.map(cat => (
                            <button key={cat} onClick={() => setActiveCategory(cat)} aria-pressed={activeCategory === cat} className={chip(activeCategory === cat)}>
                                {cat}
                            </button>
                        ))}
                        <button onClick={() => setActiveCategory(SPECIAL_CATEGORIES.UNCATEGORIZED)}
                                aria-pressed={activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED}
                                className={chip(activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED)}>
                            {SPECIAL_CATEGORIES.UNCATEGORIZED}
                        </button>
                        {isAdmin && (
                            <button onClick={() => setActiveCategory(SPECIAL_CATEGORIES.MISSING_IMAGES)}
                                    aria-pressed={activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES}
                                    className={`px-14 py-10 rounded-full text-[13px] font-medium border transition-colors duration-200 flex items-center gap-6 ${activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES ? 'bg-accent text-bg border-accent' : 'bg-accentSoft text-accent border-accentSoft hover:border-accent'}`}>
                                <Icon.ImageOff className="w-14 h-14 flex-shrink-0" /> {SPECIAL_CATEGORIES.MISSING_IMAGES}
                            </button>
                        )}
                    </div>

                    {loading ? (
                        <SkeletonGrid />
                    ) : !warehouse ? (
                        <div className="max-w-[480px] mx-auto">
                            <StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر المستودع"
                                        note="حدد مخزون جدة أو مخزون الرياض من الأعلى لفتح المعرض." />
                        </div>
                    ) : !activeCategory ? (
                        <div className="max-w-[480px] mx-auto">
                            <StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر قسماً"
                                        note="حدد قسماً من الأعلى لاستعراض المنتجات المتوفرة." />
                        </div>
                    ) : (
                        <div>
                            <div className="flex flex-wrap justify-between items-center gap-8 mb-16">
                                <p className="text-[12px] text-muted">
                                    {activeCategory} — {NUMBER_FORMATTER.format(galleryResults.length)} صنف متوفر
                                    {galleryResults.length > visibleItems.length && ` (معروض ${NUMBER_FORMATTER.format(visibleItems.length)})`}
                                </p>
                                <p className="text-[11px] text-muted">نقرتان: الكمية · ثلاث: بطاقة المنتج</p>
                            </div>

                            {galleryResults.length === 0 ? (
                                <div className="max-w-[480px] mx-auto">
                                    <StateBlock icon={<Icon.ImageOff className="w-20 h-20" />} title="لا توجد أصناف"
                                                note="لا توجد أصناف متوفرة في هذا القسم داخل المستودع المحدد." />
                                </div>
                            ) : (
                                <div className={galleryView === 'grid'
                                    ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-12 md:gap-16"
                                    : "flex flex-col gap-16 max-w-[520px] mx-auto"}>
                                    {visibleItems.map(item => (
                                        <GalleryCard key={item.uid} item={item}
                                            imageFileName={imagesList.get(item.cleanId)}
                                            showImage={!isMissingImagesView}
                                            isGrid={galleryView === 'grid'}
                                            view={cardViews[item.uid] || CARD_VIEW.IMAGE}
                                            onTap={handleCardTap} onCycle={handleCardCycle} onZoom={handleZoom}
                                            warehouseName={activeWarehouseName} />
                                    ))}
                                </div>
                            )}

                            {galleryResults.length > visibleItems.length && (
                                <div className="flex justify-center mt-24">
                                    <button onClick={() => setVisibleCount(c => c + GALLERY_PAGE_SIZE)}
                                            className="px-24 h-48 rounded-12 border border-border bg-bg text-primary text-[14px] font-semibold hover:bg-surface transition-colors">
                                        عرض المزيد
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </section>

                <footer className="mt-64 pt-24 border-t border-border flex justify-center pb-24">
                    {/* رابط الواتساب السفلي */}
                    <a 
                        href="https://wa.me/966506762257" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-[12px] text-muted hover:text-accent transition-colors cursor-pointer"
                        title="تواصل مع المطور عبر واتساب"
                    >
                        © 2026 تطوير مهند الحزمي
                    </a>
                </footer>
            </div>

            {/* نافذة ماسح الباركود المنبثقة */}
            {showScanner && (
                <BarcodeScannerModal 
                    onClose={() => setShowScanner(false)} 
                    onScan={(scannedText) => {
                        setShowScanner(false);
                        setQuery(scannedText); // الخوارزمية الذكية ستتولى أمر الرقم الطويل!
                    }} 
                />
            )}

            {zoomItem && (
                <Lightbox fileName={imagesList.get(zoomItem.cleanId)}
                          title={`${zoomItem.id} — ${zoomItem.name || ''}`}
                          onClose={() => setZoomItem(null)} />
            )}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
