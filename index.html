        const { useState, useEffect, useRef, useMemo } = React;

        // Normalize Arabic numerals to English numerals for search consistency
        const normalizeNumerals = (str) => {
            if (!str) return '';
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        // Parser function for pasted Excel (TSV) data
        const parseExcelData = (rawText) => {
            if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];

            const lines = rawText.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split('\t').map(h => h.trim());
            const idIdx = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
            const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
            const qtyIdx = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
            const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

            const dataMap = {};

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.trim());
                if (cols.length === 0 || (!cols[idIdx] && !cols[nameIdx])) continue;

                const rawId = cols[idIdx] ? cols[idIdx].trim() : '';
                const searchId = normalizeNumerals(rawId).toLowerCase();

                if (!searchId) continue;

                const name = cols[nameIdx] ? cols[nameIdx].trim() : '';
                const rawQty = normalizeNumerals(cols[qtyIdx] || '0').replace(/,/g, ''); // Remove commas if any
                const qty = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);
                const unit = unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '';
                const pack = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';

                // Overwrites if duplicate, keeping the last valid row per instructions
                dataMap[searchId] = { 
                    id: rawId, 
                    searchId: searchId, 
                    name, 
                    qty, 
                    unit 
                    pack
                };
            }
            return Object.values(dataMap);
        };

        // Icons components
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} aria-hidden="true">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />

        const FormatQuantity = ({ qty, unit }) => {

                    )}

            );
        };

    if (/^\d+$/.test(normalizedQuery)) {

        return numericSku.startsWith(normalizedQuery);
    }

    // إذا كتب الرقم مع البادئة
    return sku.startsWith(normalizedQuery);
});
                
                return matched;

            return (

                                ))}

                    </div>

            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
