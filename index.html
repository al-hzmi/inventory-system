   <script type="text/babel">

        // ==========================================
        // الثوابت المركزية (لا قيم سحرية داخل المكونات)
        // ==========================================
        const DATA_PATH   = "./data/";
        const IMAGES_PATH = "./images/";

        /** مهلة تسجيل البحث في Firestore. الفلترة تبقى فورية — التأخير للتسجيل فقط. */
        const SEARCH_LOG_DEBOUNCE_MS = 1500;

        /** نافذة تجميع النقرات لتمييز المزدوج عن الثلاثي. */
        const MULTI_TAP_WINDOW_MS = 300;

        const MAX_SKU_RESULTS  = 5;   // مطابقات رقم الصنف (حسب المواصفة الأصلية)
        const MAX_NAME_RESULTS = 15;  // مطابقات الاسم تحتاج مجالاً أوسع
        const MIN_NAME_QUERY_LENGTH = 2;

        const GALLERY_PAGE_SIZE = 60;

        /**
         * سياسة الإظهار — مركزية في مكان واحد لتغييرها بسطر واحد.
         * مفتاح "عرض مع الصورة" يُعامَل كـ "وضع العميل": الواجهة تصبح معروضة لطرف خارجي.
         */
        const VISIBILITY_RULES = {
            hideOutOfStockInGallery         : true,   // المعرض واجهة عميل => لا تُعرض الأصناف المنتهية إطلاقاً
            hideOutOfStockInSearchWithImage : true,   // وضع العميل داخل البحث
            hideOutOfStockInPlainSearch     : false,  // بحث الموظف يعرض المنتهي مع وسم واضح
            hideQtyInSearchWithImage        : false,  // اقلبها true لإخفاء الكمية في البحث عند تفعيل الصور
        };

        /** طبقات عرض بطاقة المعرض. */
        const CARD_VIEW = { IMAGE: 0, QUANTITY: 1, DETAILS: 2 };

        const WAREHOUSES = {
            jeddah: { key: 'jeddah', label: 'مخزون جدة',    name: 'مستودع جدة' },
            riyadh: { key: 'riyadh', label: 'مخزون الرياض', name: 'مستودع الرياض' },
        };

        const SPECIAL_CATEGORIES = {
            UNCATEGORIZED : 'بقية الأصناف',
            MISSING_IMAGES: 'نواقص الصور',
        };

        const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;

        const NUMBER_FORMATTER = new Intl.NumberFormat('en-US');

        // ==========================================
        // دوال التطبيع (Mission Critical)
        // ==========================================

        const ARABIC_INDIC_DIGITS   = '٠١٢٣٤٥٦٧٨٩'; // U+0660 - U+0669
        const EASTERN_ARABIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹'; // U+06F0 - U+06F9 (فارسي/أردو)

        /** تحويل الأرقام العربية والفارسية إلى إنجليزية. */
        const toEnglishDigits = (str) => {
            if (!str) return '';
            return String(str).replace(/[٠-٩۰-۹]/g, (d) => {
                const arabicIndex = ARABIC_INDIC_DIGITS.indexOf(d);
                if (arabicIndex > -1) return String(arabicIndex);
                return String(EASTERN_ARABIC_DIGITS.indexOf(d));
            });
        };

        const normalizeNumerals = toEnglishDigits; // اسم قديم محفوظ للتوافق

        /**
         * استخراج "الرقم الصافي" — العمود الفقري للنظام.
         * AR_13438 -> 13438 | ITEM-00591 -> 591 | ١٣٤٣٨ -> 13438 | ۱۳۴۳۸ -> 13438
         */
        const normalizeCleanId = (str) => {
            if (!str) return "";
            return toEnglishDigits(str).replace(/\D/g, "");
        };

        /**
         * تطبيع النص العربي للبحث بالاسم.
         * بدونه: "أواني" لا تطابق "اواني"، و"مقلاة" لا تطابق "مقلاه".
         */
        const normalizeText = (str) => {
            if (!str) return '';
            return toEnglishDigits(String(str))
                .toLowerCase()
                .replace(/[\u064B-\u065F\u0670]/g, '') // التشكيل
                .replace(/\u0640/g, '')                // التطويل
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/[ىئ]/g, 'ي')
                .replace(/ؤ/g, 'و')
                .replace(/ة/g, 'ه')
                .replace(/[^\u0600-\u06FFa-z0-9\s]/g, ' ') // الرموز تصبح فواصل
                .replace(/\s+/g, ' ')
                .trim();
        };

        /** تنظيف الاسم ليصلح كمعرّف مستند في Firestore (الشرطة المائلة تُسقط العملية). */
        const toSafeDocId = (name) => {
            const cleaned = String(name || '').replace(/[\/\\\[\]#?]/g, '_').replace(/^\.+|\.+$/g, '').trim();
            return cleaned.slice(0, 200) || 'unknown';
        };

        // ==========================================
        // طبقة تحميل البيانات
        // ==========================================

        /** fetch().catch() لا يلتقط أخطاء HTTP مثل 404/403 — فقط أخطاء الشبكة. */
        const fetchText = async (url) => {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.text();
            } catch (err) {
                console.warn(`[Data] تعذر تحميل ${url}:`, err.message);
                return "";
            }
        };

        const fetchJson = async (url) => {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.warn(`[Data] تعذر تحميل ${url}:`, err.message);
                return null;
            }
        };

        /**
         * محلل بيانات المستودعات (TSV).
         * warehouseKey يُحقن في كل صنف => الفصل بين جدة والرياض يصبح بنيوياً لا بصرياً:
         * أي صنف يحمل هويّة مستودعه معه أينما ذهب في التطبيق.
         */
        const parseExcelData = (rawText, warehouseKey) => {
            if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];

            const lines = rawText.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split('\t').map(h => h.trim());
            const idIdx   = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
            const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
            const qtyIdx  = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
            const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
            const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

            if (idIdx === -1) {
                console.error(`[Parser:${warehouseKey}] لم يُعثر على عمود رقم الصنف في الترويسة:`, headers);
                return [];
            }

            const dataMap = {};

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.trim());
                if (cols.length === 0 || (!cols[idIdx] && (nameIdx === -1 || !cols[nameIdx]))) continue;

                const rawId    = cols[idIdx] ? cols[idIdx].trim() : '';
                const searchId = toEnglishDigits(rawId).toLowerCase();
                if (!searchId) continue;

                const name = nameIdx !== -1 && cols[nameIdx] ? cols[nameIdx].trim() : '';
                const rawQty = toEnglishDigits(qtyIdx !== -1 ? (cols[qtyIdx] || '0') : '0').replace(/,/g, '');
                const qty  = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);
                const unit = unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '';
                const pack = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';

                dataMap[searchId] = {
                    // معرّف فريد عالمياً: يمنع أي تصادم في مفاتيح React لو عُرض المستودعان معاً مستقبلاً
                    uid: `${warehouseKey}:${searchId}`,
                    warehouseKey,
                    id: rawId,
                    searchId,
                    cleanId: normalizeCleanId(rawId),   // محسوب مرة واحدة عند التحميل
                    name,
                    searchName: normalizeText(name),    // مُطبَّع مسبقاً للبحث بالاسم
                    qty,
                    unit,
                    pack
                };
            }
            return Object.values(dataMap);
        };

        /**
         * كاشف تصادم الأرقام الصافية.
         * لأن normalizeCleanId تحذف الحروف، فإن "AR_100" و"100" في نفس الملف
         * يُنتجان الرقم الصافي 100 => صنفان مختلفان يتقاسمان الصورة والتصنيف نفسه.
         * هذا لا يُعالَج برمجياً (البيانات مصدر الحقيقة) لكنه يجب أن يكون مرئياً لك.
         */
        const reportCleanIdCollisions = (items, warehouseKey) => {
            const byClean = new Map();
            items.forEach(it => {
                if (!it.cleanId) return;
                if (!byClean.has(it.cleanId)) byClean.set(it.cleanId, []);
                byClean.get(it.cleanId).push(it.id);
            });
            const collisions = [];
            byClean.forEach((ids, clean) => { if (ids.length > 1) collisions.push({ clean, ids }); });
            if (collisions.length) {
                console.warn(
                    `[Integrity:${warehouseKey}] ${collisions.length} تصادم في الأرقام الصافية — ` +
                    `أصناف مختلفة ستتقاسم نفس الصورة والتصنيف:`, collisions
                );
            }
            return collisions.length;
        };

        /** خريطة الصور: الرقم الصافي -> اسم الملف الحقيقي (يدعم أي امتداد). */
        const buildImagesMap = (imagesText) => {
            const imgMap = new Map();
            imagesText.split('\n').forEach((line) => {
                const fileName = line.trim();
                if (!fileName) return;
                const cleanName = normalizeCleanId(fileName.replace(/\.[^.]+$/, ''));
                if (cleanName && !imgMap.has(cleanName)) imgMap.set(cleanName, fileName);
            });
            return imgMap;
        };

        /**
         * تحليل categories.tsv — كل عمود قسم، والصفوف تحته أرقام أصناف.
         * الحارس على الترويسة الفارغة يمنع TypeError كان يُسقط التطبيق بالكامل.
         */
        const parseCategories = (categoriesText) => {
            const catObj = {};
            if (!categoriesText) return catObj;

            const rows = categoriesText.split('\n').map(row => row.split('\t').map(cell => cell.trim()));
            if (rows.length === 0) return catObj;

            const headers = rows[0];
            headers.forEach(header => { if (header) catObj[header] = []; });

            for (let i = 1; i < rows.length; i++) {
                for (let j = 0; j < headers.length; j++) {
                    const header = headers[j];
                    if (!header || !catObj[header]) continue;
                    const cell = rows[i][j];
                    if (!cell) continue;
                    const cleanId = normalizeCleanId(cell);
                    if (cleanId) catObj[header].push(cleanId);
                }
            }
            return catObj;
        };

        // ==========================================
        // محرك البحث (رقم الصنف + الاسم)
        // ==========================================

        /**
         * البحث الموحّد. لا يُجبر المستخدم على اختيار نمط:
         *   rank 0 = مطابقة تامة لرقم الصنف
         *   rank 1 = بادئة رقم الصنف
         *   rank 2 = الاسم يبدأ بالكلمة الأولى
         *   rank 3 = الاسم يحتوي كل الكلمات
         * ثم تُقص نتائج الرقم عند 5 (حسب المواصفة) ونتائج الاسم عند 15.
         */
        const runSearch = (activeDb, rawQuery, hideOutOfStock) => {
            const cleanQuery = normalizeCleanId(rawQuery);
            const textQuery  = normalizeText(rawQuery);
            const nameTokens = textQuery.length >= MIN_NAME_QUERY_LENGTH
                ? textQuery.split(' ').filter(Boolean)
                : [];

            if (!cleanQuery && nameTokens.length === 0) {
                return { visible: [], total: 0, exact: null };
            }

            const ranked = [];
            for (let i = 0; i < activeDb.length; i++) {
                const item = activeDb[i];
                if (hideOutOfStock && item.qty <= 0) continue;

                let rank = -1;
                if (cleanQuery && item.cleanId.startsWith(cleanQuery)) {
                    rank = item.cleanId === cleanQuery ? 0 : 1;
                } else if (nameTokens.length && item.searchName) {
                    let all = true;
                    for (let t = 0; t < nameTokens.length; t++) {
                        if (!item.searchName.includes(nameTokens[t])) { all = false; break; }
                    }
                    if (all) rank = item.searchName.startsWith(nameTokens[0]) ? 2 : 3;
                }

                if (rank !== -1) ranked.push({ item, rank });
            }

            ranked.sort((a, b) => a.rank - b.rank);

            const skuHits  = [];
            const nameHits = [];
            for (let i = 0; i < ranked.length; i++) {
                const r = ranked[i];
                if (r.rank <= 1) { if (skuHits.length  < MAX_SKU_RESULTS)  skuHits.push(r.item); }
                else             { if (nameHits.length < MAX_NAME_RESULTS) nameHits.push(r.item); }
            }

            const exact = ranked.length && ranked[0].rank === 0 ? ranked[0].item : null;
            return { visible: skuHits.concat(nameHits), total: ranked.length, exact };
        };

        // ==========================================
        // المكونات المشتركة
        // ==========================================

        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} aria-hidden="true">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const FormatQuantity = ({ qty, unit }) => (
            <div className="flex flex-col">
                <div className="flex items-baseline gap-4">
                    <span className="text-[24px] md:text-[28px] font-bold text-primary leading-none">{NUMBER_FORMATTER.format(qty)}</span>
                    {unit && <span className="text-[14px] text-secondary">{unit}</span>}
                </div>
                {qty === 0 && <span className="text-[14px] text-secondary mt-4">نفدت الكمية حالياً</span>}
            </div>
        );

        const ProductImage = ({ fileName, alt, className }) => {
            if (!fileName) return null;
            return (
                <img
                    src={`${IMAGES_PATH}${fileName}`}
                    alt={alt}
                    loading="lazy"
                    decoding="async"
                    draggable="false"
                    className={className}
                    onError={(e) => { e.currentTarget.style.visibility = 'hidden'; }}
                />
            );
        };

        // ---- بطاقة البحث التفصيلية (مطابقة تامة) ----
        const FullResultCard = memo(({ item, warehouseName, showImage = false, imageFileName = '', hideQty = false }) => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 md:p-24 bg-bg flex flex-col gap-16">

                {showImage && imageFileName && (
                    <div className="w-full flex justify-center border-b border-border pb-16">
                        <ProductImage fileName={imageFileName} alt={item.name || item.id} className="w-full max-w-[240px] aspect-square object-contain rounded-12" />
                    </div>
                )}

                <div>
                    <div className="text-[14px] font-medium text-secondary mb-4">رقم الصنف</div>
                    <div className="text-[16px] font-bold text-primary">{item.id}</div>
                </div>

                <div>
                    <div className="text-[14px] font-medium text-secondary mb-4">اسم الصنف</div>
                    <div className="text-[16px] text-primary">{item.name || "---"}</div>
                </div>

                <div>
                    <div className="text-[14px] font-medium text-secondary mb-4">المستودع</div>
                    <div className="text-[16px] text-primary">{warehouseName}</div>
                </div>

                <div className="grid grid-cols-2 gap-16 border-t border-border pt-16">
                    <div>
                        <div className="text-[14px] font-medium text-secondary mb-4">الوحدة</div>
                        <div className="text-[16px] font-bold text-primary">{item.unit || "---"}</div>
                    </div>
                    <div>
                        <div className="text-[14px] font-medium text-secondary mb-4">الشد</div>
                        <div className="text-[16px] font-bold text-primary">{item.pack || "---"}</div>
                    </div>
                </div>

                {!hideQty && (
                    <div className="border-t border-border pt-16">
                        <div className="text-[14px] font-medium text-secondary mb-4">الكمية المتوفرة</div>
                        <FormatQuantity qty={item.qty} unit={item.unit} />
                    </div>
                )}

            </div>
        ));

        // ---- بطاقة البحث المختصرة (مطابقة جزئية) ----
        const CompactResultCard = memo(({ item, showImage = false, imageFileName = '', hideQty = false }) => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 bg-bg flex justify-between items-center gap-16 mb-8 hover:bg-hoverBg transition-colors duration-200">
                <div className="flex items-center gap-16 overflow-hidden">
                    {showImage && imageFileName && (
                        <ProductImage fileName={imageFileName} alt={item.name || item.id} className="w-56 h-56 flex-shrink-0 object-contain rounded-12 border border-border bg-bg" />
                    )}
                    <div className="flex flex-col overflow-hidden">
                        <span className="text-[16px] font-bold text-primary truncate">{item.id}</span>
                        <span className="text-[14px] text-secondary truncate">{item.name || '---'}</span>
                    </div>
                </div>
                {!hideQty && (
                    <div className="flex-shrink-0 text-left">
                        <FormatQuantity qty={item.qty} unit={item.unit} />
                    </div>
                )}
            </div>
        ));

        // ---- بطاقة المعرض ثلاثية الطبقات ----
        /**
         * الطبقات:
         *   IMAGE    (افتراضي)  — صورة + رقم + اسم. لا شيء يكشف الكمية للعميل.
         *   QUANTITY (نقرتان)   — تُضاف شارة الكمية. نقرتان مجدداً تُعيدها للصورة.
         *   DETAILS  (3 نقرات)  — بطاقة تفاصيل كاملة. نقرتان تُعيدان للصورة.
         * لوحة المفاتيح: Enter/مسافة تتنقل بين الطبقات الثلاث بالترتيب.
         */
        const GalleryCard = memo(({ item, imageFileName, showImage, isGrid, view, onTap, onCycle, warehouseName }) => {
            const isDetails  = view === CARD_VIEW.DETAILS;
            const isQuantity = view === CARD_VIEW.QUANTITY;

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    onCycle(item.uid);
                }
            };

            return (
                <div
                    role="button"
                    tabIndex={0}
                    aria-label={`${item.name || item.id} — نقرتان لعرض الكمية، ثلاث نقرات لبطاقة التفاصيل`}
                    title="نقرتان: الكمية · ثلاث نقرات: بطاقة التفاصيل"
                    onClick={() => onTap(item.uid)}
                    onKeyDown={handleKeyDown}
                    className={`tap-card cursor-pointer border rounded-12 p-16 bg-white flex flex-col items-center text-center transition-colors duration-200 ${isDetails ? 'border-primary' : 'border-border hover:bg-gray-50'}`}
                >
                    {isDetails ? (
                        // ---------- الطبقة الثالثة: بطاقة التفاصيل ----------
                        <div className="animate-flip w-full text-right flex flex-col gap-8">
                            <div className="flex justify-between items-center border-b border-border pb-8 mb-4">
                                <span className="text-[13px] font-medium text-secondary">بطاقة المنتج</span>
                                <span className="text-[12px] text-secondary">نقرتان للعودة</span>
                            </div>

                            <div>
                                <div className="text-[12px] text-secondary">رقم الصنف</div>
                                <div className="text-[15px] font-bold text-primary break-words">{item.id}</div>
                            </div>

                            <div>
                                <div className="text-[12px] text-secondary">اسم الصنف</div>
                                <div className="text-[14px] text-primary break-words">{item.name || '---'}</div>
                            </div>

                            <div className="grid grid-cols-2 gap-8 border-t border-border pt-8">
                                <div>
                                    <div className="text-[12px] text-secondary">الوحدة</div>
                                    <div className="text-[14px] font-bold text-primary">{item.unit || '---'}</div>
                                </div>
                                <div>
                                    <div className="text-[12px] text-secondary">الشد</div>
                                    <div className="text-[14px] font-bold text-primary">{item.pack || '---'}</div>
                                </div>
                            </div>

                            <div className="border-t border-border pt-8">
                                <div className="text-[12px] text-secondary">المستودع</div>
                                <div className="text-[14px] text-primary">{warehouseName}</div>
                            </div>

                            <div className="border-t border-border pt-8">
                                <div className="text-[12px] text-secondary mb-4">الكمية المتوفرة</div>
                                <FormatQuantity qty={item.qty} unit={item.unit} />
                            </div>
                        </div>
                    ) : (
                        // ---------- الطبقة الأولى/الثانية: الصورة (+ الكمية) ----------
                        <React.Fragment>
                            {showImage && (
                                <ProductImage
                                    fileName={imageFileName}
                                    alt={item.name || item.searchId}
                                    className={`object-contain mb-16 rounded-8 pointer-events-none ${isGrid ? 'w-full aspect-square' : 'w-full max-w-[400px] h-auto'}`}
                                />
                            )}
                            <div className="text-[16px] font-bold text-primary break-words">{item.id}</div>
                            <div className="text-[14px] text-secondary break-words">{item.name || '---'}</div>

                            {isQuantity && (
                                <div className="animate-flip text-[14px] font-medium mt-8 px-12 py-4 rounded-full text-green-700 bg-green-50">
                                    الكمية: {NUMBER_FORMATTER.format(item.qty)}{item.unit ? ` ${item.unit}` : ''}
                                </div>
                            )}
                        </React.Fragment>
                    )}
                </div>
            );
        });

        const NotFoundState = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <SearchIcon className="w-48 h-48 text-border" />
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">لم يتم العثور على الصنف</h3>
                    <p className="text-[15px] text-secondary">لا يوجد صنف بهذا الرقم أو الاسم داخل المستودع المحدد.</p>
                </div>
            </div>
        );

        const EmptyState = () => (
            <div className="w-full flex flex-col items-center justify-center py-48 text-center gap-16 opacity-70">
                <SearchIcon className="w-40 h-40 text-secondary" />
                <p className="text-[16px] text-secondary">اكتب رقم الصنف أو اسمه لبدء البحث</p>
            </div>
        );

        const DatabaseEmptyWarning = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-48 h-48 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">قاعدة البيانات فارغة</h3>
                    <p className="text-[15px] text-secondary">تعذر تحميل ملفات المخزون من مجلد data. تحقق من وجود jeddah.tsv و riyadh.tsv ومن صحة ترويسة الأعمدة.</p>
                </div>
            </div>
        );

      // ==========================================
        // 1. شاشة تسجيل الدخول (مع حماية حساب المدير)
        // ==========================================
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState('');
            const [pin, setPin] = useState(''); // حالة الرمز السري
            const [requiresPin, setRequiresPin] = useState(false); // حالة المطالبة بالرمز
            const [loading, setLoading] = useState(false);
            const [notice, setNotice] = useState('');

            // إعادة ضبط حقل الرمز السري إذا قام المستخدم بتعديل الاسم
            useEffect(() => {
                setRequiresPin(false);
                setPin('');
            }, [name]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const trimmedName = name.trim();
                if (!trimmedName) return;

                // --- 🔒 طبقة الحماية لحساب مهند ---
                if (trimmedName.includes('مهند')) {
                    if (!requiresPin) {
                        setRequiresPin(true);
                        setNotice('مرحباً بك يا مهند، يرجى إدخال رمز الدخول السري.');
                        return; // إيقاف العملية لانتظار إدخال الرمز
                    } else if (pin !== '2257') {
                        setNotice('الرمز السري غير صحيح!');
                        return; // رفض الدخول إذا كان الرمز خاطئاً
                    }
                }
                // ------------------------------------

                setLoading(true);
                setNotice('');

                try {
                    const userRef = db.collection('users').doc(toSafeDocId(trimmedName));
                    const doc = await userRef.get();

                    const userInfo = {
                        userAgent: navigator.userAgent,
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    };

                    if (doc.exists) {
                        await userRef.update({ ...userInfo, loginCount: firebase.firestore.FieldValue.increment(1) });
                    } else {
                        await userRef.set({
                            name: trimmedName,
                            ...userInfo,
                            loginCount: 1,
                            firstJoined: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }

                    await db.collection('login_logs').add({
                        name: trimmedName,
                        time: firebase.firestore.FieldValue.serverTimestamp(),
                        userAgent: navigator.userAgent
                    });

                } catch (error) {
                    // التسجيل وظيفة تحليلية؛ البحث في المخزون وظيفة أساسية.
                    // لا يجوز أن يمنع تعثر الشبكة داخل المستودع الموظفَ من العمل.
                    console.error("Error logging in: ", error);
                    setNotice('تعذر الاتصال بسجل الدخول، وتم الدخول للنظام بشكل طبيعي.');
                }

                localStorage.setItem('inventory_user_name', trimmedName);
                setLoading(false);
                onLogin(trimmedName);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-16 font-sans">
                    <div className="animate-card w-full max-w-[400px] bg-white border border-border rounded-12 shadow-card p-32 text-center">
                        <h1 className="text-[24px] font-bold text-primary mb-8 font-cairo">نظام المخزون</h1>
                        <p className="text-[14px] text-secondary mb-32 font-cairo">شركة بيت الأواني الطيبة</p>

                        <form onSubmit={handleSubmit} className="flex flex-col gap-16">
                            <div className="text-right">
                                <label htmlFor="employeeName" className="text-[14px] font-medium text-primary mb-8 block font-cairo">الإسم الكريم</label>
                                <input
                                    id="employeeName"
                                    type="text"
                                    required
                                    autoComplete="name"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="اكتب اسمك هنا..."
                                    disabled={requiresPin}
                                    className={`w-full h-[48px] px-16 rounded-12 border border-border focus:border-primary focus:ring-1 focus:ring-primary text-primary outline-none transition-all font-cairo ${requiresPin ? 'bg-gray-100 opacity-70 cursor-not-allowed' : ''}`}
                                />
                            </div>

                            {/* يظهر حقل الرمز السري فقط إذا كان الاسم يحتوي على "مهند" وتم الضغط على زر الدخول */}
                            {requiresPin && (
                                <div className="text-right animate-card">
                                    <label htmlFor="pinCode" className="text-[14px] font-bold text-red-600 mb-8 block font-cairo">الرمز السري للإدارة 🔒</label>
                                    <input
                                        id="pinCode"
                                        type="password"
                                        inputMode="numeric"
                                        required
                                        autoFocus
                                        value={pin}
                                        onChange={(e) => setPin(e.target.value)}
                                        placeholder="أدخل الرمز (2257)"
                                        className="w-full h-[48px] px-16 rounded-12 border border-red-300 focus:border-red-500 focus:ring-1 focus:ring-red-500 text-primary outline-none transition-all font-cairo tracking-widest text-center text-lg"
                                    />
                                </div>
                            )}

                            {notice && (
                                <p className={`text-[13px] text-right font-medium ${requiresPin && pin !== '2257' && notice.includes('غير صحيح') ? 'text-red-500' : 'text-secondary'}`}>
                                    {notice}
                                </p>
                            )}

                            <div className="flex gap-8 mt-8">
                                {requiresPin && (
                                    <button 
                                        type="button" 
                                        onClick={() => { setRequiresPin(false); setName(''); setNotice(''); }} 
                                        className="w-1/3 h-[48px] bg-gray-100 text-primary rounded-12 font-medium hover:bg-gray-200 transition-colors font-cairo"
                                    >
                                        رجوع
                                    </button>
                                )}
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className={`${requiresPin ? 'w-2/3' : 'w-full'} h-[48px] bg-primary text-white rounded-12 font-medium hover:opacity-90 disabled:opacity-60 transition-opacity flex justify-center items-center font-cairo`}
                                >
                                    {loading ? "جاري الدخول..." : (requiresPin ? "تأكيد الدخول" : "دخول للنظام")}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 2. التطبيق الأساسي
        // ==========================================
        const App = () => {
            const [userName] = useState(localStorage.getItem('inventory_user_name') || '');
            const [sessionName, setSessionName] = useState(userName);

            const [warehouse, setWarehouse] = useState(null);
            const [query, setQuery] = useState('');
            const [showImageInSearch, setShowImageInSearch] = useState(false); // = وضع العميل

            const [databases, setDatabases] = useState({ jeddah: [], riyadh: [] });
            const [imagesList, setImagesList] = useState(new Map());
            const [categories, setCategories] = useState({});

            const [activeCategory, setActiveCategory] = useState(null);
            const [galleryView, setGalleryView] = useState('grid');
            const [visibleCount, setVisibleCount] = useState(GALLERY_PAGE_SIZE);
            const [cardViews, setCardViews] = useState({}); // uid -> CARD_VIEW

            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState("جاري التحقق...");

            const searchInputRef  = useRef(null);
            const lastLoggedSearch = useRef('');
            const tapStateRef      = useRef({ uid: null, count: 0, timer: null });

            // ------------------------------------------
            // تحميل كافة البيانات دفعة واحدة
            // ------------------------------------------
            useEffect(() => {
                let isMounted = true;

                const loadAllData = async () => {
                    try {
                        const [jeddahText, riyadhText, imagesText, categoriesText, versionData] = await Promise.all([
                            fetchText(`${DATA_PATH}jeddah.tsv`),
                            fetchText(`${DATA_PATH}riyadh.tsv`),
                            fetchText(`${DATA_PATH}images_list.txt`),
                            fetchText(`${DATA_PATH}categories.tsv`),
                            fetchJson(`${DATA_PATH}version.json`),
                        ]);

                        if (!isMounted) return;

                        const jeddah = parseExcelData(jeddahText, WAREHOUSES.jeddah.key);
                        const riyadh = parseExcelData(riyadhText, WAREHOUSES.riyadh.key);

                        // فحص سلامة لكل مستودع على حدة — لا يُخلط بينهما إطلاقاً
                        reportCleanIdCollisions(jeddah, WAREHOUSES.jeddah.key);
                        reportCleanIdCollisions(riyadh, WAREHOUSES.riyadh.key);

                        setDatabases({ jeddah, riyadh });
                        setImagesList(buildImagesMap(imagesText));
                        setCategories(parseCategories(categoriesText));

                        if (versionData && versionData.lastUpdate) {
                            setLastUpdate(typeof dayjs !== 'undefined' ? dayjs(versionData.lastUpdate).fromNow() : versionData.lastUpdate);
                        } else {
                            setLastUpdate("غير متوفر");
                        }
                    } catch (err) {
                        console.error('[Boot] فشل غير متوقع أثناء تحميل البيانات:', err);
                        if (isMounted) setLastUpdate("غير متوفر");
                    } finally {
                        if (isMounted) setLoading(false);
                    }
                };

                loadAllData();
                return () => { isMounted = false; };
            }, []);

            // تنظيف مؤقّت النقرات عند تفكيك المكوّن
            useEffect(() => () => {
                if (tapStateRef.current.timer) clearTimeout(tapStateRef.current.timer);
            }, []);

            const isDbEmpty = useMemo(
                () => databases.jeddah.length === 0 && databases.riyadh.length === 0,
                [databases]
            );

            useEffect(() => {
                if (warehouse && searchInputRef.current) searchInputRef.current.focus();
            }, [warehouse]);

            // إعادة ضبط العرض التدريجي وطبقات البطاقات عند تغيير القسم أو المستودع
            useEffect(() => {
                setVisibleCount(GALLERY_PAGE_SIZE);
                setCardViews({});
            }, [activeCategory, warehouse]);

            // ------------------------------------------
            // آلة حالة النقر المتعدد
            // ------------------------------------------
            const applyTaps = useCallback((uid, taps) => {
                setCardViews(prev => {
                    const current = prev[uid] || CARD_VIEW.IMAGE;
                    let next = current;
                    if (taps >= 3)      next = CARD_VIEW.DETAILS;
                    else if (taps === 2) next = (current === CARD_VIEW.IMAGE) ? CARD_VIEW.QUANTITY : CARD_VIEW.IMAGE;
                    if (next === current) return prev;
                    return { ...prev, [uid]: next };
                });
            }, []);

            const handleCardTap = useCallback((uid) => {
                const s = tapStateRef.current;
                if (s.uid !== uid) { // نقرة على بطاقة أخرى => إعادة العد من الصفر
                    if (s.timer) clearTimeout(s.timer);
                    s.uid = uid;
                    s.count = 0;
                }
                s.count += 1;
                if (s.timer) clearTimeout(s.timer);
                s.timer = setTimeout(() => {
                    const taps = s.count;
                    s.count = 0; s.uid = null; s.timer = null;
                    applyTaps(uid, taps);
                }, MULTI_TAP_WINDOW_MS);
            }, [applyTaps]);

            /** مسار لوحة المفاتيح: صورة -> كمية -> تفاصيل -> صورة */
            const handleCardCycle = useCallback((uid) => {
                setCardViews(prev => {
                    const current = prev[uid] || CARD_VIEW.IMAGE;
                    const next = current === CARD_VIEW.IMAGE ? CARD_VIEW.QUANTITY
                               : current === CARD_VIEW.QUANTITY ? CARD_VIEW.DETAILS
                               : CARD_VIEW.IMAGE;
                    return { ...prev, [uid]: next };
                });
            }, []);

            // ------------------------------------------
            // البحث (فوري — الرقم والاسم معاً)
            // ------------------------------------------
            const hideOutOfStockInSearch = showImageInSearch
                ? VISIBILITY_RULES.hideOutOfStockInSearchWithImage
                : VISIBILITY_RULES.hideOutOfStockInPlainSearch;

            const hideQtyInSearch = showImageInSearch && VISIBILITY_RULES.hideQtyInSearchWithImage;

            const search = useMemo(() => {
                if (!warehouse || !query.trim()) return null;
                // databases[warehouse] فقط — لا يمكن بنيوياً أن تتسرب أصناف المستودع الآخر
                return runSearch(databases[warehouse] || [], query, hideOutOfStockInSearch);
            }, [query, warehouse, databases, hideOutOfStockInSearch]);

            // ------------------------------------------
            // تسجيل عمليات البحث الناجحة بعد 1.5 ثانية من التوقف عن الكتابة
            // (الـ Debounce على التسجيل فقط — الفلترة تبقى فورية)
            // ------------------------------------------
            useEffect(() => {
                if (!warehouse || !search || search.total === 0) return;

                const logKey = `${warehouse}:${normalizeText(query)}`;
                if (lastLoggedSearch.current === logKey) return;

                const timer = setTimeout(() => {
                    lastLoggedSearch.current = logKey;
                    db.collection('search_logs').add({
                        name: sessionName,
                        warehouse,
                        rawQuery: query.trim(),
                        cleanQuery: normalizeCleanId(query),
                        resultsCount: search.total,
                        exactMatch: Boolean(search.exact),
                        time: firebase.firestore.FieldValue.serverTimestamp(),
                    }).catch(err => console.warn('[Log] تعذر تسجيل عملية البحث:', err.message));
                }, SEARCH_LOG_DEBOUNCE_MS);

                return () => clearTimeout(timer);
            }, [search, warehouse, query, sessionName]);

            // ------------------------------------------
            // المعرض الرقمي (واجهة عميل)
            // ------------------------------------------
            const allCategorizedIds = useMemo(() => new Set(Object.values(categories).flat()), [categories]);

            const galleryResults = useMemo(() => {
                if (!activeCategory || !warehouse) return [];

                // نبدأ دائماً من أصناف المستودع المختار حصراً.
                // نتيجة ذلك: أي صورة في images_list لا يقابلها صنف في هذا المستودع
                // لا تظهر إطلاقاً — وهو المطلوب (غالباً صنف نفد أو أُلغي).
                let pool = databases[warehouse] || [];

                if (VISIBILITY_RULES.hideOutOfStockInGallery) {
                    pool = pool.filter(item => item.qty > 0);
                }

                if (activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES) {
                    return pool.filter(item => !imagesList.has(item.cleanId));
                }

                if (activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED) {
                    return pool.filter(item => imagesList.has(item.cleanId) && !allCategorizedIds.has(item.cleanId));
                }

                const categoryIds = new Set(categories[activeCategory] || []);
                return pool.filter(item => categoryIds.has(item.cleanId) && imagesList.has(item.cleanId));
            }, [activeCategory, warehouse, databases, imagesList, categories, allCategorizedIds]);

            const visibleGalleryItems = useMemo(
                () => galleryResults.slice(0, visibleCount),
                [galleryResults, visibleCount]
            );

            const isMissingImagesView = activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES;
            const activeWarehouseName = warehouse ? WAREHOUSES[warehouse].name : '';

            // ------------------------------------------
            // التصيير
            // ------------------------------------------
            if (!sessionName) return <LoginScreen onLogin={(name) => setSessionName(name)} />;

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center text-xl font-bold" role="status" aria-live="polite">
                        جاري تحميل بيانات المخزون...
                    </div>
                );
            }

            return (
                <div className="max-w-[1024px] mx-auto px-16 sm:px-24 py-40 md:py-64 font-sans selection:bg-gray-200 relative">

                    {/* Header */}
                    <header className="text-center mb-32 flex flex-col items-center gap-8">
                        <div className="bg-gray-50 border border-border px-16 py-8 rounded-full mb-8">
                            <span className="text-[13px] font-medium text-secondary">الاسم الكريم: {sessionName}</span>
                        </div>
                        <h1 className="text-[28px] md:text-[32px] font-bold text-primary m-0 leading-tight">
                            مخزون شركة بيت الأواني الطيبة
                        </h1>
                        <h2 className="text-[15px] md:text-[16px] text-secondary font-normal m-0">
                            نظام الاستعلام والمعرض الرقمي
                        </h2>
                        <p className="text-[13px] text-secondary">آخر تحديث للمخزون: {lastUpdate}</p>
                    </header>

                    {isDbEmpty && (
                        <div className="mb-32">
                            <DatabaseEmptyWarning />
                        </div>
                    )}

                    {/* اختيار المستودع */}
                    <div className="flex justify-center gap-16 mb-32" role="group" aria-label="اختيار المستودع">
                        {Object.values(WAREHOUSES).map(wh => (
                            <button
                                key={wh.key}
                                onClick={() => setWarehouse(wh.key)}
                                aria-pressed={warehouse === wh.key}
                                className={`px-24 py-16 rounded-12 text-[16px] font-medium transition-all w-[140px] md:w-[160px] ${warehouse === wh.key ? 'bg-primary text-bg shadow-md' : 'bg-bg text-primary border border-primary hover:bg-gray-50'}`}
                            >
                                {wh.label}
                            </button>
                        ))}
                    </div>

                    {/* ================= منطقة البحث ================= */}
                    <div className="w-full max-w-[480px] mx-auto mb-32">
                        <div className="flex justify-between items-center mb-8">
                            <label htmlFor="searchInput" className={`text-[14px] font-medium ${warehouse ? 'text-primary' : 'text-secondary'}`}>البحث السريع</label>

                            <label className="flex items-center gap-8 cursor-pointer">
                                <span className="text-[13px] text-secondary whitespace-nowrap">عرض مع الصورة</span>
                                <input
                                    type="checkbox"
                                    className="sr-only"
                                    checked={showImageInSearch}
                                    onChange={(e) => setShowImageInSearch(e.target.checked)}
                                    disabled={!warehouse}
                                />
                                <div className={`w-40 h-24 rounded-full transition-colors relative flex-shrink-0 ${showImageInSearch ? 'bg-primary' : 'bg-gray-300'} ${!warehouse ? 'opacity-50' : ''}`}>
                                    <div className={`absolute top-2 left-2 w-20 h-20 bg-white rounded-full transition-transform ${showImageInSearch ? 'translate-x-16' : ''}`}></div>
                                </div>
                            </label>
                        </div>

                        <div className="relative">
                            <input
                                ref={searchInputRef}
                                id="searchInput"
                                type="text"
                                autoComplete="off"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                disabled={!warehouse}
                                placeholder={warehouse ? "اكتب رقم الصنف أو اسمه..." : "اختر المستودع أولاً"}
                                className={`w-full h-[56px] px-16 pl-48 rounded-12 border transition-all text-[16px] outline-none ${!warehouse ? 'bg-gray-50 border-border cursor-not-allowed opacity-60' : 'bg-bg border-border focus:border-primary focus:ring-1 text-primary'}`}
                            />
                            <SearchIcon className="w-24 h-24 text-secondary absolute left-16 top-1/2 -translate-y-1/2 pointer-events-none" />
                        </div>

                        {warehouse && showImageInSearch && (
                            <p className="text-[12px] text-secondary mt-8 text-center"> الأصناف المنتهية مخفية</p>
                        )}

                        {warehouse && !query.trim() && <EmptyState />}

                        {query.trim() && search && (
                            <div className="w-full mt-16 min-h-[100px]">
                                {search.total === 0 && <NotFoundState />}

                                {search.exact && (
                                    <div className="mb-16">
                                        <FullResultCard
                                            item={search.exact}
                                            warehouseName={activeWarehouseName}
                                            showImage={showImageInSearch && imagesList.has(search.exact.cleanId)}
                                            imageFileName={imagesList.get(search.exact.cleanId)}
                                            hideQty={hideQtyInSearch}
                                        />
                                    </div>
                                )}

                                {search.visible
                                    .filter(item => !search.exact || item.uid !== search.exact.uid)
                                    .map(item => (
                                        <CompactResultCard
                                            key={item.uid}
                                            item={item}
                                            showImage={showImageInSearch && imagesList.has(item.cleanId)}
                                            imageFileName={imagesList.get(item.cleanId)}
                                            hideQty={hideQtyInSearch}
                                        />
                                    ))
                                }

                                {search.total > search.visible.length && (
                                    <p className="text-[13px] text-secondary text-center mt-8">
                                        يوجد {NUMBER_FORMATTER.format(search.total)} نتيجة — اكتب تفاصيل أكثر لتضييق البحث
                                    </p>
                                )}
                            </div>
                        )}
                    </div>

                    {/* ================= المعرض الرقمي ================= */}
                    <div className="w-full">
                        <div className="flex justify-between items-center mb-16">
                            <div>
                                <h3 className="text-[20px] font-bold text-primary">المعرض الرقمي</h3>
                                {warehouse && <p className="text-[13px] text-secondary">{activeWarehouseName}</p>}
                            </div>

                            {activeCategory && (
                                <div className="flex gap-8">
                                    <button onClick={() => setGalleryView('grid')} aria-pressed={galleryView === 'grid'} className={`p-8 rounded-8 border text-[14px] ${galleryView === 'grid' ? 'bg-primary text-white border-primary' : 'bg-white text-secondary border-border'}`}>شبكي</button>
                                    <button onClick={() => setGalleryView('list')} aria-pressed={galleryView === 'list'} className={`p-8 rounded-8 border text-[14px] ${galleryView === 'list' ? 'bg-primary text-white border-primary' : 'bg-white text-secondary border-border'}`}>طولي</button>
                                </div>
                            )}
                        </div>

                        {/* أزرار الأقسام */}
                        <div className="flex flex-wrap gap-8 mb-24">
                            {Object.keys(categories).map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} aria-pressed={activeCategory === cat} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === cat ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-border hover:bg-gray-50'}`}>
                                    {cat}
                                </button>
                            ))}
                            <button onClick={() => setActiveCategory(SPECIAL_CATEGORIES.UNCATEGORIZED)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-800 border-border hover:bg-gray-50'}`}>
                                {SPECIAL_CATEGORIES.UNCATEGORIZED}
                            </button>
                            <button onClick={() => setActiveCategory(SPECIAL_CATEGORIES.MISSING_IMAGES)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES} className={`px-16 py-8 rounded-full text-[14px] transition-colors border ${activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES ? 'bg-red-600 text-white border-red-600' : 'bg-white text-red-600 border-border hover:bg-gray-50'}`}>
                                📸 {SPECIAL_CATEGORIES.MISSING_IMAGES}
                            </button>
                        </div>

                        {!warehouse ? (
                            <div className="text-center text-secondary py-32 bg-gray-50 rounded-12">يرجى اختيار المستودع (جدة أو الرياض) لفتح المعرض.</div>
                        ) : activeCategory ? (
                            <div>
                                <div className="flex flex-wrap justify-between items-center gap-8 mb-16">
                                    <p className="text-[13px] text-secondary">
                                        {activeCategory} — {NUMBER_FORMATTER.format(galleryResults.length)} صنف متوفر
                                        {galleryResults.length > visibleGalleryItems.length && ` (معروض ${NUMBER_FORMATTER.format(visibleGalleryItems.length)})`}
                                    </p>
                                    <p className="text-[12px] text-secondary">نقرتان: الكمية · ثلاث نقرات: بطاقة المنتج</p>
                                </div>

                                <div className={galleryView === 'grid' ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-16" : "flex flex-col gap-16"}>
                                    {galleryResults.length === 0 ? (
                                        <div className="col-span-full text-center text-secondary py-32">لا توجد أصناف متوفرة في هذا القسم.</div>
                                    ) : (
                                        visibleGalleryItems.map(item => (
                                            <GalleryCard
                                                key={item.uid}
                                                item={item}
                                                imageFileName={imagesList.get(item.cleanId)}
                                                showImage={!isMissingImagesView}
                                                isGrid={galleryView === 'grid'}
                                                view={cardViews[item.uid] || CARD_VIEW.IMAGE}
                                                onTap={handleCardTap}
                                                onCycle={handleCardCycle}
                                                warehouseName={activeWarehouseName}
                                            />
                                        ))
                                    )}
                                </div>

                                {galleryResults.length > visibleGalleryItems.length && (
                                    <div className="flex justify-center mt-24">
                                        <button
                                            onClick={() => setVisibleCount(c => c + GALLERY_PAGE_SIZE)}
                                            className="px-24 py-16 rounded-12 border border-primary text-primary text-[15px] font-medium hover:bg-gray-50 transition-colors"
                                        >
                                            عرض المزيد
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-center text-secondary py-32 bg-gray-50 rounded-12 border border-dashed border-gray-300">
                                اختر قسماً من الأعلى لاستعراض المنتجات المتوفرة.
                            </div>
                        )}
                    </div>

                    <footer className="mt-64 pt-24 border-t border-border text-center">
                        <p className="text-[12px] text-secondary">© 2026 تطوير مهند الحزمي</p>
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!--
      تسجيل Service Worker معطّل حتى يُرفع ملف /sw.js فعلياً.

    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js")
            .catch(err => console.warn("SW registration skipped:", err.message));
    }
    </script>
    -->

</body>
</html>
