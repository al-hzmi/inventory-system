                            {warehouse && (
                                <React.Fragment>
                                    <button onClick={() => setShowDrafts(true)} title="المسودات المؤقتة" className="relative flex items-center justify-center w-48 h-48 rounded-12 bg-surface border border-border text-primary hover:text-accent transition-colors">
                                        <Icon.Archive className="w-20 h-20" />
                                        {drafts.length > 0 && (
                                            <span className="absolute -top-4 -right-4 w-20 h-20 bg-warn text-white text-[10px] font-bold flex items-center justify-center rounded-full animate-flip numeric">
                                                {drafts.length}
                                            </span>
                                        )}
                                    </button>

                                    <button onClick={() => setShowHistory(true)} title="سجل الطلبات" className="flex items-center justify-center w-48 h-48 rounded-12 bg-surface border border-border text-primary hover:text-accent transition-colors">
                                        <Icon.List className="w-20 h-20" />
                                    </button>
                                    
                                    <button onClick={() => setShowCart(true)} className="relative flex items-center justify-center w-48 h-48 rounded-12 bg-surface border border-border text-primary hover:text-accent transition-colors">
                                        <Icon.Cart className="w-20 h-20" />
                                        {Object.keys(cart).length > 0 && (
                                            <span className="absolute -top-4 -right-4 w-20 h-20 bg-danger text-white text-[10px] font-bold flex items-center justify-center rounded-full animate-flip numeric">
                                                {Object.keys(cart).length}
                                            </span>
                                        )}
                                    </button>
                                </React.Fragment>
                            )}
                        </div>
                    </div>

                    <div className="flex items-center gap-12">
                        <div className="relative flex-1 min-w-0">
                            <Icon.Search className="w-18 h-18 text-muted absolute right-14 top-1/2 -translate-y-1/2 pointer-events-none" />
                            <input ref={searchInputRef} id="searchInput" type="text" autoComplete="off"
                                   value={query} onChange={(e) => setQuery(e.target.value)} disabled={!warehouse}
                                   placeholder={warehouse ? "اكتب رقم الصنف أو امسح الباركود..." : "اختر المستودع أولاً"}
                                   className={`w-full h-48 pr-40 pl-48 rounded-12 border outline-none transition-colors ${!warehouse ? 'bg-surface border-border text-muted cursor-not-allowed' : 'bg-bg border-border focus:border-accent text-primary'}`} />
                            
                            {warehouse && (
                                <button onClick={() => setShowScanner(true)} title="مسح الباركود بالكاميرا"
                                    className="absolute left-6 top-1/2 -translate-y-1/2 w-36 h-36 flex items-center justify-center rounded-8 text-secondary bg-surface border border-border hover:text-accent hover:border-accent transition-colors">
                                    <Icon.Scan className="w-18 h-18" />
                                </button>
                            )}
                        </div>

                        <label className="flex items-center gap-8 cursor-pointer flex-shrink-0">
                            <span className="hidden sm:inline text-[12px] text-secondary whitespace-nowrap">عرض مع الصورة</span>
                            <input type="checkbox" className="sr-only" checked={showImageInSearch}
                                   onChange={(e) => setShowImageInSearch(e.target.checked)} disabled={!warehouse} />
                            <div className={`w-44 h-26 rounded-full transition-colors relative flex-shrink-0 ${showImageInSearch ? 'bg-accent' : 'bg-border'} ${!warehouse ? 'opacity-50' : ''}`}>
                                <div className={`absolute top-2 left-2 w-22 h-22 bg-bg rounded-full shadow-card transition-transform ${showImageInSearch ? 'translate-x-18' : ''}`}></div>
                            </div>
                        </label>
                    </div>

                    {warehouse && showImageInSearch && <p className="text-[11px] text-accent"> وضع العرض للعميل — الأصناف المنتهية مخفية</p>}
                </div>
            </div>

            <div className="max-w-[1024px] mx-auto px-16 pb-64">

                {isDbEmpty && !loading && (
                    <div className="max-w-[480px] mx-auto mt-24">
                        <StateBlock tone="danger" icon={<Icon.Alert className="w-20 h-20" />} title="تعذر تحميل بيانات المخزون" note="تحقق من وجود jeddah.tsv و riyadh.tsv في مجلد data ومن صحة ترويسة الأعمدة." />
                    </div>
                )}

                {query.trim() && search && (
                    <div className="max-w-[520px] mx-auto mt-24 flex flex-col gap-8">
                        {search.total === 0 && <StateBlock icon={<Icon.Search className="w-20 h-20" />} title="لم يتم العثور على الصنف" note="لا يوجد صنف بهذا الرقم أو الاسم في المستودع المحدد." />}

                        {selectedSearchItem ? (
                            <React.Fragment>
                                <button onClick={() => setSelectedSearchItem(null)} className="self-start px-12 h-34 rounded-8 bg-surface border border-border text-[12px] font-semibold text-secondary hover:text-primary hover:border-accent transition-colors">
                                    ← العودة لنتائج البحث
                                </button>
                                <FullResultCard item={selectedSearchItem} warehouseName={activeWarehouseName}
                                    showImage={showImageInSearch && imagesList.has(selectedSearchItem.cleanId)}
                                    imageFileName={imagesList.get(selectedSearchItem.cleanId)} hideQty={hideQtyInSearch} cart={cart} setCart={setCart}
                                    isAdmin={isAdmin} currentCategory={currentCategoryById[selectedSearchItem.cleanId]} onAdminCategoryEdit={setCategoryEditItem} />
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                {search.exact && <FullResultCard item={search.exact} warehouseName={activeWarehouseName} showImage={showImageInSearch && imagesList.has(search.exact.cleanId)} imageFileName={imagesList.get(search.exact.cleanId)} hideQty={hideQtyInSearch} cart={cart} setCart={setCart} isAdmin={isAdmin} currentCategory={currentCategoryById[search.exact.cleanId]} onAdminCategoryEdit={setCategoryEditItem} />}
                                {search.visible.filter(i => !search.exact || i.uid !== search.exact.uid).map(item => (
                                    <CompactResultCard key={item.uid} item={item} showImage={showImageInSearch && imagesList.has(item.cleanId)} imageFileName={imagesList.get(item.cleanId)} hideQty={hideQtyInSearch} cart={cart} setCart={setCart} onSelect={setSelectedSearchItem} isAdmin={isAdmin} currentCategory={currentCategoryById[item.cleanId]} onAdminCategoryEdit={setCategoryEditItem} />
                                ))}
                                {search.total > search.visible.length && <p className="text-[12px] text-muted text-center pt-8"><span className="numeric">{NUMBER_FORMATTER.format(search.total)}</span> نتيجة — اضغط على أي نتيجة لفتح بطاقتها كاملة</p>}
                            </React.Fragment>
                        )}
                    </div>
                )}

                <section className="mt-40" id="gallery-section">
                    <div className="flex justify-between items-end gap-12 mb-12">
                        <div className="min-w-0">
                            <h2 className="text-[18px] font-bold text-primary">المعرض الرقمي</h2>
                            {warehouse && <p className="text-[12px] text-muted mt-2">{activeWarehouseName}</p>}
                        </div>
                        {activeCategory && (
                            <div className="flex bg-surface border border-border rounded-10 p-4 gap-4 flex-shrink-0" role="group" aria-label="نمط العرض">
                                <button onClick={() => setGalleryView('list')} aria-pressed={galleryView === 'list'} className={`flex items-center gap-6 px-12 h-36 rounded-8 text-[13px] font-medium transition-colors ${galleryView === 'list' ? 'bg-primary text-bg' : 'text-secondary'}`}><Icon.List className="w-16 h-16" /> طولي</button>
                                <button onClick={() => setGalleryView('grid')} aria-pressed={galleryView === 'grid'} className={`flex items-center gap-6 px-12 h-36 rounded-8 text-[13px] font-medium transition-colors ${galleryView === 'grid' ? 'bg-primary text-bg' : 'text-secondary'}`}><Icon.Grid className="w-16 h-16" /> شبكي</button>
                            </div>
                        )}
                    </div>

                    {(() => {
                        const changeCategory = (cat) => {
                            setActiveCategory(cat);
                            const el = document.getElementById('gallery-section');
                            if (el) {
                                const y = el.getBoundingClientRect().top + window.scrollY - 80;
                                window.scrollTo({ top: y, behavior: 'smooth' });
                            }
                        };

                        const categoryButtons = (
                            <div className="flex flex-wrap gap-8">
                                {categoryNames.map(cat => (
                                    <button key={cat} onClick={() => changeCategory(cat)} aria-pressed={activeCategory === cat} className={chip(activeCategory === cat)}>{cat}</button>
                                ))}
                                <button onClick={() => changeCategory(SPECIAL_CATEGORIES.UNCATEGORIZED)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED} className={chip(activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED)}>{SPECIAL_CATEGORIES.UNCATEGORIZED}</button>
                                {isAdmin && (
                                    <button onClick={() => changeCategory(SPECIAL_CATEGORIES.MISSING_IMAGES)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES} className={`px-14 py-10 rounded-full text-[13px] font-medium border transition-colors duration-200 flex items-center gap-6 ${activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES ? 'bg-accent text-bg border-accent' : 'bg-accentSoft text-accent border-accentSoft hover:border-accent'}`}>
                                        <Icon.ImageOff className="w-14 h-14 flex-shrink-0" /> {SPECIAL_CATEGORIES.MISSING_IMAGES}
                                    </button>
                                )}
                            </div>
                        );

                        return (
                            <React.Fragment>
                                <p className="text-[12px] text-muted mb-8">الأقسام (<span className="numeric">{NUMBER_FORMATTER.format(totalCategoryCount)}</span>)</p>
                                <div className="mb-20">
                                    {categoryButtons}
                                </div>

                                {loading ? ( <SkeletonGrid />
                                ) : !warehouse ? ( <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر المستودع" note="حدد مخزون جدة أو مخزون الرياض من الأعلى لفتح المعرض." /></div>
                                ) : !activeCategory ? ( <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر قسماً" note="حدد قسماً من الأعلى لاستعراض المنتجات المتوفرة." /></div>
                                ) : (
                                    <div>
                                        <div className="flex flex-wrap justify-between items-center gap-8 mb-16">
                                            <p className="text-[12px] text-muted">
                                                {activeCategory} — <span className="numeric">{NUMBER_FORMATTER.format(galleryResults.length)}</span> صنف متوفر
                                                {galleryResults.length > visibleItems.length && ` (معروض `}
                                                {galleryResults.length > visibleItems.length && <span className="numeric">{NUMBER_FORMATTER.format(visibleItems.length)}</span>}
                                                {galleryResults.length > visibleItems.length && `)`}
                                            </p>
                                            <p className="text-[11px] text-muted">نقرتان: الكمية · ثلاث: بطاقة المنتج</p>
                                        </div>

                                        {galleryResults.length === 0 ? (
                                            <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.ImageOff className="w-20 h-20" />} title="لا توجد أصناف" note="لا توجد أصناف متوفرة في هذا القسم داخل المستودع المحدد." /></div>
                                        ) : (
                                            <div className={galleryView === 'grid' ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-12 md:gap-16" : "flex flex-col gap-16 max-w-[520px] mx-auto"}>
                                                {visibleItems.map(item => (
                                                    <GalleryCard key={item.uid} item={item} imageFileName={imagesList.get(item.cleanId)} showImage={!isMissingImagesView} isGrid={galleryView === 'grid'}
                                                        view={cardViews[item.uid] || CARD_VIEW.IMAGE} onTap={handleCardTap} onCycle={handleCardCycle} onZoom={handleZoom} warehouseName={activeWarehouseName} cart={cart} setCart={setCart}
                                                        isAdmin={isAdmin} currentCategory={currentCategoryById[item.cleanId]} onAdminCategoryEdit={setCategoryEditItem} />
                                                ))}
                                            </div>
                                        )}

                                        {galleryResults.length > visibleItems.length && (
                                            <div className="flex justify-center mt-24">
                                                <button onClick={() => setVisibleCount(c => c + GALLERY_PAGE_SIZE)} className="px-24 h-48 rounded-12 border border-border bg-bg text-primary text-[14px] font-semibold hover:bg-surface transition-colors">عرض المزيد</button>
                                            </div>
                                        )}

                                        {galleryResults.length > 0 && (
                                            <div className="mt-32 pt-24 border-t border-border">
                                                <p className="text-[12px] text-muted mb-8">انتقال سريع لقسم آخر:</p>
                                                {categoryButtons}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </React.Fragment>
                        );
                    })()}
                </section>

                <footer className="mt-64 pt-24 border-t border-border flex justify-center pb-24">
                    <a href="https://wa.me/966506762257" target="_blank" rel="noopener noreferrer" className="text-[12px] text-muted hover:text-accent transition-colors cursor-pointer" title="تواصل مع المطور عبر واتساب">© 2026 تطوير مهند الحزمي</a>
                </footer>
            </div>

            {/* ===== النوافذ المنبثقة ===== */}
            {showScanner && <BarcodeScannerModal onClose={() => setShowScanner(false)} onScan={(scannedText) => { setShowScanner(false); setQuery(scannedText); }} />}
            {showDrafts && <DraftsModal drafts={drafts} setDrafts={setDrafts} setCart={setCart} setWarehouse={setWarehouse} onClose={() => setShowDrafts(false)} />}
            {showCart && <OrderInvoiceModal cart={cart} setCart={setCart} drafts={drafts} setDrafts={setDrafts} onClose={() => setShowCart(false)} sessionName={sessionName} warehouse={warehouse} />}
            {showHistory && <OrderHistoryModal onClose={() => setShowHistory(false)} sessionName={sessionName} />}
            {showAdmin && isAdmin && <AdminDashboardModal
                onClose={() => setShowAdmin(false)}
                catalogItems={catalogItems}
                imagesList={imagesList}
                categories={categories}
                currentCategoryById={currentCategoryById}
                categoryMeta={categoryMeta}
            />}
            {categoryEditItem && isAdmin && <AdminCategoryPickerModal item={categoryEditItem} imageFileName={imagesList.get(categoryEditItem.cleanId)} currentCategory={currentCategoryById[categoryEditItem.cleanId]} categoryNames={categoryNames} onClose={() => setCategoryEditItem(null)} />}
            {zoomItem && <Lightbox fileName={imagesList.get(zoomItem.cleanId)} title={`${zoomItem.id} — ${zoomItem.name || ''}`} onClose={() => setZoomItem(null)} />}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
    </html>
