<script type="text/babel">

const DATA_PATH   = "./data/";

const LOW_STOCK_THRESHOLD    = 10;

const DEFAULT_GALLERY_VIEW = 'list';

const STORAGE_KEYS = { NAME: 'inventory_user_name', TOKEN: 'inventory_admin_token' };

const VISIBILITY_RULES = {
    hideOutOfStockInGallery         : true,
    hideOutOfStockInSearchWithImage : true,
    hideOutOfStockInPlainSearch     : false,
    hideQtyInSearchWithImage        : false,
};

const CARD_VIEW = { IMAGE: 0, QUANTITY: 1, DETAILS: 2 };

const WAREHOUSES = {
    jeddah: { key: 'jeddah', label: 'مخزون جدة',   name: 'مستودع جدة'   },
    riyadh: { key: 'riyadh', label: 'مخزون الرياض', name: 'مستودع الرياض' },
};

const SPECIAL_CATEGORIES = { UNCATEGORIZED : 'بقية الأصناف', MISSING_IMAGES: 'نواقص الصور' };
const ADMIN_ONLY_CATEGORIES = new Set([SPECIAL_CATEGORIES.MISSING_IMAGES]);

const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
const NUMBER_FORMATTER = new Intl.NumberFormat('en-US');

const ARABIC_INDIC_DIGITS   = '٠١٢٣٤٥٦٧٨٩';
const EASTERN_ARABIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

const toEnglishDigits = (str) => {
    if (!str) return '';
    return String(str).replace(/[٠-٩۰-۹]/g, (d) => {
        const i = ARABIC_INDIC_DIGITS.indexOf(d);
        return i > -1 ? String(i) : String(EASTERN_ARABIC_DIGITS.indexOf(d));
    });
};

const normalizeCleanId = (str) => { if (!str) return ""; return toEnglishDigits(str).replace(/\D/g, ""); };

const normalizeText = (str) => {
    if (!str) return '';
    return toEnglishDigits(String(str)).toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '').replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا').replace(/[ىئ]/g, 'ي').replace(/ؤ/g, 'و').replace(/ة/g, 'ه')
        .replace(/[^\u0600-\u06FFa-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
};

const toSafeDocId = (name) => {
    const c = String(name || '').replace(/[\/\\\[\]#?]/g, '_').replace(/^\.+|\.+$/g, '').trim();
    return c.slice(0, 200) || 'unknown';
};

const CODE_SALT = 'bayt-awani::v5::';
const hashCode = (str) => {
    let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
    const s = CODE_SALT + String(str);
    for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
        h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
    }
    return h1.toString(36) + '-' + h2.toString(36);
};
window.__genCode = (code) => hashCode(code);

const PROTECTED_ACCOUNTS = { 'مهند': '1jh297-spgf2z' };
const isProtectedName = (name) => Object.prototype.hasOwnProperty.call(PROTECTED_ACCOUNTS, normalizeText(name));
const verifyCode = (name, code) => {
    const expected = PROTECTED_ACCOUNTS[normalizeText(name)];
    return Boolean(expected) && hashCode(toEnglishDigits(String(code)).trim()) === expected;
};

const fetchText = async (url) => {
    const cacheKey = `b2b_cache_${url}`;
    try { 
        const res = await fetch(url); 
        if (!res.ok) throw new Error(`HTTP ${res.status}`); 
        const text = await res.text();
        localStorage.setItem(cacheKey, text);
        return text;
    } catch (err) { 
        console.warn(`[Offline] يتم جلب النسخة المخبأة لـ ${url}`); 
        const cached = localStorage.getItem(cacheKey);
        if (cached) return cached;
        return ""; 
    }
};

const fetchJson = async (url) => {
    const cacheKey = `b2b_cache_${url}`;
    try { 
        const res = await fetch(url); 
        if (!res.ok) throw new Error(`HTTP ${res.status}`); 
        const data = await res.json();
        localStorage.setItem(cacheKey, JSON.stringify(data));
        return data;
    } catch (err) { 
        console.warn(`[Offline] يتم جلب النسخة المخبأة لـ ${url}`); 
        const cached = localStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);
        return null; 
    }
};

const parsePricingMap = (rawText) => {
    const map = {};
    if (!rawText) return map;
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return map;

    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(lines.length, 5); i++) {
        if (lines[i] && lines[i].includes('سعر') && (lines[i].includes('رقم') || lines[i].includes('صنف'))) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) return map;

    const headers = lines[headerRowIdx].split('\t').map(h => h.trim());
    const pairs = [];

    for (let i = 0; i < headers.length; i++) {
        if (/رقم|كود|صنف/i.test(headers[i])) {
            if (i > 0 && /سعر|بيع/i.test(headers[i - 1])) pairs.push({ skuIdx: i, priceIdx: i - 1 });
            else if (i < headers.length - 1 && /سعر|بيع/i.test(headers[i + 1])) pairs.push({ skuIdx: i, priceIdx: i + 1 });
        }
    }

    for (let i = headerRowIdx + 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        pairs.forEach(pair => {
            const rawSku = cols[pair.skuIdx];
            const rawPrice = cols[pair.priceIdx];
            if (rawSku && rawPrice) {
                const cleanId = normalizeCleanId(rawSku);
                const price = parseFloat(toEnglishDigits(rawPrice).replace(/,/g, ''));
                if (cleanId && !isNaN(price) && price > 0) map[cleanId] = price;
            }
        });
    }
    return map;
};

const parseExcelData = (rawText, warehouseKey, pricingMap) => {
    if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return [];

    const headers = lines[0].split('\t').map(h => h.trim());
    const idIdx   = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
    const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
    const qtyIdx  = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
    const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
    const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

    if (idIdx === -1) return [];

    const dataMap = {};
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        if (cols.length === 0 || (!cols[idIdx] && (nameIdx === -1 || !cols[nameIdx]))) continue;

        const rawId    = cols[idIdx] ? cols[idIdx].trim() : '';
        const searchId = toEnglishDigits(rawId).toLowerCase();
        if (!searchId) continue;

        const name   = nameIdx !== -1 && cols[nameIdx] ? cols[nameIdx].trim() : '';
        const rawQty = toEnglishDigits(qtyIdx !== -1 ? (cols[qtyIdx] || '0') : '0').replace(/,/g, '');
        const qty    = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);

        const packStr = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';
        const cleanId = normalizeCleanId(rawId);
        
        const cartonPrice = pricingMap[cleanId] || 0;
        let approxPiecePrice = 0;

        if (cartonPrice > 0) {
            const packNum = parseFloat(toEnglishDigits(packStr).replace(/[^0-9.]/g, ''));
            if (!isNaN(packNum) && packNum > 0) approxPiecePrice = cartonPrice / packNum;
        }

        dataMap[searchId] = {
            uid: `${warehouseKey}:${searchId}`, warehouseKey, id: rawId, searchId, cleanId: cleanId,
            name, searchName: normalizeText(name), qty, unit: unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '',
            pack: packStr, price: cartonPrice, approxPrice: approxPiecePrice
        };
    }
    return Object.values(dataMap);
};
    
const reportCleanIdCollisions = (items, warehouseKey) => {};

const buildImagesMap = (imagesText) => {
    const map = new Map();
    imagesText.split('\n').forEach((line) => {
        const fileName = line.trim();
        if (!fileName) return;
        const clean = normalizeCleanId(fileName.replace(/\.[^.]+$/, ''));
        if (clean && !map.has(clean)) map.set(clean, fileName);
    });
    return map;
};

const parseCategories = (text) => {
    const obj = {};
    if (!text) return obj;
    const rows = text.split('\n').map(r => r.split('\t').map(c => c.trim()));
    if (rows.length === 0) return obj;
    const headers = rows[0];
    headers.forEach(h => { if (h) obj[h] = []; });
    for (let i = 1; i < rows.length; i++) {
        for (let j = 0; j < headers.length; j++) {
            const h = headers[j];
            if (!h || !obj[h]) continue;
            const clean = normalizeCleanId(rows[i][j]);
            if (clean) obj[h].push(clean);
        }
    }
    return obj;
};

const runSearch = (activeDb, rawQuery, hideOutOfStock) => {
    const cleanQuery = normalizeCleanId(rawQuery);
    const textQuery  = normalizeText(rawQuery);
    const nameTokens = textQuery.length >= MIN_NAME_QUERY_LENGTH ? textQuery.split(' ').filter(Boolean) : [];

    if (!cleanQuery && nameTokens.length === 0) return { visible: [], total: 0, exact: null };

    const ranked = [];
    for (let i = 0; i < activeDb.length; i++) {
        const item = activeDb[i];
        if (hideOutOfStock && item.qty <= 0) continue;

        let rank = -1;
        if (cleanQuery && item.cleanId.startsWith(cleanQuery)) {
            rank = item.cleanId === cleanQuery ? 0 : 1;
        } else if (nameTokens.length && item.searchName) {
            let all = true;
            for (let t = 0; t < nameTokens.length; t++) {
                if (!item.searchName.includes(nameTokens[t])) { all = false; break; }
            }
            if (all) rank = item.searchName.startsWith(nameTokens[0]) ? 2 : 3;
        }
        if (rank !== -1) ranked.push({ item, rank });
    }

    ranked.sort((a, b) => a.rank - b.rank);

    const sku = [], nm = [];
    for (let i = 0; i < ranked.length; i++) {
        const r = ranked[i];
        if (r.rank <= 1) { if (sku.length < MAX_SKU_RESULTS) sku.push(r.item); }
        else             { if (nm.length  < MAX_NAME_RESULTS) nm.push(r.item);  }
    }
    return { visible: sku.concat(nm), total: ranked.length, exact: ranked.length && ranked[0].rank === 0 ? ranked[0].item : null };
};

const stockTone = (qty) => {
    if (qty <= 0) return { text:'text-destructive',  bg:'bg-destructive/10 ring-1 ring-inset ring-destructive/30'  };
    if (qty <= LOW_STOCK_THRESHOLD) return { text:'text-warning', bg:'bg-warning/10 ring-1 ring-inset ring-warning/30' };
    return { text:'text-success', bg:'bg-success/10 ring-1 ring-inset ring-success/30' };
};

const formatTimeSpent = (minutes) => {
    if (!minutes) return 'لم يسجل';
    if (minutes < 60) return `${minutes} دقيقة`;
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h} ساعة${m > 0 ? ` و ${m} دقيقة` : ''}`;
};

            <div className="flex items-baseline gap-4">
                <span className={`numeric ${size === 'lg' ? 'text-[26px]' : 'text-[20px]'} font-bold leading-none ${tone.text}`}>
                    {NUMBER_FORMATTER.format(qty)}
                </span>
                {unit && <span className="text-[13px] text-muted-foreground">{unit}</span>}
            </div>
            {qty <= LOW_STOCK_THRESHOLD && (
                <span className={`text-[12px] mt-4 ${tone.text}`}>

const OrderQuantityControl = memo(({ item, cart, setCart }) => {
    const cartQty = cart[item.cleanId]?.cartQty || 0;
    const maxQty = item.qty || 0; 
    
    const [isEditing, setIsEditing] = useState(false);
    const [editVal, setEditVal] = useState(cartQty.toString());

    const updateQty = (newQty) => {
        let val = Math.max(0, parseFloat(newQty) || 0);
        
        if (val > maxQty) {
            alert(`الكمية المتوفرة في المخزون هي ${maxQty} فقط.`);
            val = maxQty;
        }

        setCart(prev => {
            const next = { ...prev };
            if (val === 0) delete next[item.cleanId];
            else next[item.cleanId] = { ...item, cartQty: val };
            return next;
        });
    };

    const handleSaveEdit = () => { setIsEditing(false); updateQty(editVal); };

    if (cartQty === 0) {
        return (
            <button onClick={(e) => { e.stopPropagation(); updateQty(1); }}
                    className="flex items-center gap-6 px-12 h-32 rounded-md bg-card border border-border text-foreground text-[12px] font-medium hover:border-primary hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                <Icon.Cart className="w-14 h-14" /> إضافة للفاتورة
            </button>
        );
    }

    return (
        <div className="flex items-center bg-card border border-primary rounded-md overflow-hidden h-32" onClick={e => e.stopPropagation()}>
            <button onClick={() => updateQty(cartQty - 1)} className="w-32 h-full flex items-center justify-center text-foreground hover:bg-muted transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">-</button>
            
            {isEditing ? (
                <input type="number" step="0.25" min="0" max={maxQty} autoFocus value={editVal}
                       onChange={e => setEditVal(e.target.value)}
                       onBlur={handleSaveEdit}
                       onKeyDown={e => { if(e.key === 'Enter') handleSaveEdit(); }}
                       className="w-48 h-full text-center text-[13px] font-bold text-primary bg-background outline-none border-x border-primary appearance-none numeric" />
            ) : (
                <div onClick={() => { setEditVal(cartQty.toString()); setIsEditing(true); }}
                     className="w-48 h-full flex items-center justify-center text-[13px] font-bold text-primary bg-background border-x border-primary cursor-text numeric"
                     title="اضغط لتعديل الكمية يدوياً (الكسور مدعومة)">
                    {cartQty}
                </div>
            )}
            
            <button onClick={() => updateQty(cartQty + 1)} className="w-32 h-full flex items-center justify-center text-foreground hover:bg-muted transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">+</button>
        </div>
    );
});

const OrderInvoiceModal = memo(({ cart, setCart, drafts, setDrafts, onClose, sessionName, warehouse }) => {
    const [customer, setCustomer] = useState("");
    const [notes, setNotes] = useState(""); 
    const items = Object.values(cart);
    const totalAmount = items.reduce((sum, item) => sum + ((item.price || 0) * item.cartQty), 0);

    const handleSubmit = () => {
        if (!customer.trim()) return alert("يجب كتابة اسم العميل أولاً لتسجيل الفاتورة.");
        
        const gregorianDate = new Date().toLocaleDateString('en-GB');

        let msg = `*طلب مبيعات جديد*\n`;
        msg += `════════════════\n`;
        msg += `المندوب: ${sessionName}\n`;
        msg += `العميل: ${customer.trim()}\n`;
        msg += `المستودع: ${WAREHOUSES[warehouse]?.name || warehouse}\n`;
        msg += `التاريخ: ${gregorianDate}\n`;
        if (notes.trim()) msg += `الملاحظات: ${notes.trim()}\n`;
        msg += `════════════════\n\n`;

        items.forEach((it, idx) => {
            msg += `${idx + 1}. *[ ${it.id} ]*\n`;
            msg += `   الكمية: *${it.cartQty}* | الإجمالي: *${NUMBER_FORMATTER.format((it.price || 0) * it.cartQty)}* ر.س\n`;
            if (idx < items.length - 1) msg += `  ╌╌╌╌╌╌╌╌╌╌╌╌\n`;
        });

        msg += `\n════════════════\n`;
        msg += `*الإجمالي النهائي: ${NUMBER_FORMATTER.format(totalAmount)} ر.س*\n`;

        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');

        const newOrder = {
            id: Date.now(),
            date: gregorianDate,
            customer: customer.trim(),
            warehouse: warehouse,
            totalAmount: totalAmount,
            msg: msg 
        };
        const historyKey = `b2b_history_${sessionName}`;
        const existingHistory = JSON.parse(localStorage.getItem(historyKey)) || [];
        localStorage.setItem(historyKey, JSON.stringify([newOrder, ...existingHistory]));

        getDb().then(db => {
            db.collection('orders').add({
                repName: sessionName, customerName: customer.trim(), warehouse: warehouse, notes: notes.trim(), 
                items: items.map(i => ({ cleanId: i.cleanId, id: i.id, name: i.name, qty: i.cartQty, price: i.price, total: i.price * i.cartQty })),
                totalAmount: totalAmount, timestamp: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent
            });
        }).catch(()=>{});

        setCart({});
        onClose();
    };

    const saveAsDraft = () => {
        const draftId = Date.now();
        const draftName = customer.trim() || `مسودة ${new Date().toLocaleTimeString('ar-SA')}`;
        const newDraft = {
            id: draftId,
            name: draftName,
            date: new Date().toLocaleString('ar-SA'),
            warehouse,
            cart: { ...cart },
            notes: notes.trim()
        };
        setDrafts([newDraft, ...drafts]);
        
        getDb().then(db => {
            db.collection('drafts').doc(draftId.toString()).set({
                ...newDraft, repName: sessionName, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }).catch(()=>{});

        setCart({});
        onClose();
    };

    const deleteCartItem = (cleanId) => {
        if(window.confirm("هل أنت متأكد من حذف الصنف من الفاتورة؟")) {
            if(window.confirm("تأكيد نهائي: سيتم الحذف الآن.")) {
                const nx = {...cart}; 
                delete nx[cleanId]; 
                setCart(nx);
            }
        }
    };

    return (
        <div className="fixed inset-0 z-[100] bg-black/80 flex justify-center items-end sm:items-center animate-card">
            <div className="w-full max-w-[600px] bg-background sm:rounded-lg rounded-t-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">

// ✨ نافذة الدخول بالتحقق الحيوي (Face ID) وتحديد الموقع (GPS)
const LoginScreen = ({ onLogin }) => {
    const [name, setName] = useState('');
    const [step, setStep] = useState('name'); // 'name', 'scan', 'wait', 'rejected', 'password' (for admin)
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    
    // Admin Backdoor
    const [code, setCode] = useState('');
    const codeRef = useRef(null);
    
    // Scanner
    const videoRef = useRef(null);
    const canvasRef = useRef(null);
    const [stream, setStream] = useState(null);
    const [requestId, setRequestId] = useState(null);

    // Focus password field if admin
    useEffect(() => { if (step === 'password' && codeRef.current) codeRef.current.focus(); }, [step]);

    // Handle Name Submit
    const handleNameSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) return;

        setError('');
        
        // 🚨 الباب السري لمهند (يطلب الباسورد القديم ولا يمر بالكاميرا)
        if (isProtectedName(trimmed)) {
            setStep('password');
            return;
        }

        // المستخدمين العاديين: الانتقال لشاشة الكاميرا
        setStep('scan');
        startCamera();
    };

    // Handle Admin Password Submit
    const handleAdminSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!verifyCode(trimmed, code)) { setError('رمز الدخول غير صحيح.'); return; }
        
        setLoading(true);
        try {
            const db = await getDb();
            const userRef = db.collection('users').doc(toSafeDocId(trimmed));
            const doc = await userRef.get();
            const info = { userAgent: navigator.userAgent, lastLogin: firebase.firestore.FieldValue.serverTimestamp() };
            if (doc.exists) await userRef.update({ ...info, loginCount: firebase.firestore.FieldValue.increment(1) });
            else await userRef.set({ name: trimmed, ...info, loginCount: 1, firstJoined: firebase.firestore.FieldValue.serverTimestamp(), timeSpentMinutes: 0 });
            
            await db.collection('login_logs').add({ name: trimmed, isAdmin: true, time: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent });
        } catch (err) {}

        localStorage.setItem(STORAGE_KEYS.NAME, trimmed);
        localStorage.setItem(STORAGE_KEYS.TOKEN, hashCode(toEnglishDigits(String(code)).trim()));
        setLoading(false);
        onLogin(trimmed, true);
    };

    // Start Camera for normal users
    const startCamera = async () => {
        try {
            const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            setStream(mediaStream);
            if (videoRef.current) {
                videoRef.current.srcObject = mediaStream;
            }
        } catch (err) {
            setError('تعذر الوصول للكاميرا. يرجى إعطاء الصلاحية للمتصفح للمتابعة.');
            setStep('name');
        }
    };

    // Stop Camera
    const stopCamera = useCallback(() => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            setStream(null);
        }
    }, [stream]);

    // Capture Face & GPS
    const captureAndRequest = async () => {
        if (!videoRef.current) return;
        setLoading(true);
        setError('');

        try {
            // 1. Capture Image
            const canvas = canvasRef.current;
            const context = canvas.getContext('2d');
            canvas.width = videoRef.current.videoWidth;
            canvas.height = videoRef.current.videoHeight;
            context.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.5); // compress
            
            stopCamera();

            // 2. Get GPS
            let lat = null, lng = null;
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
                });
                lat = pos.coords.latitude;
                lng = pos.coords.longitude;
            } catch (gpsErr) {
                console.warn("GPS Denied or Timeout");
            }

            // 3. Send to Firebase Access Requests
            const db = await getDb();
            const docRef = await db.collection('access_requests').add({
                name: name.trim(),
                photoDataUrl,
                latitude: lat,
                longitude: lng,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userAgent: navigator.userAgent
            });

            setRequestId(docRef.id);
            setStep('wait');
            setLoading(false);

        } catch (err) {
            console.error(err);
            setError('حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.');
            setLoading(false);
            setStep('name');
        }
    };

    // Listen to Request Status
    useEffect(() => {
        if (step === 'wait' && requestId) {
            let unsubscribe;
            getDb().then(db => {
                unsubscribe = db.collection('access_requests').doc(requestId).onSnapshot(async (doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.status === 'approved') {
                            // Proceed to login
                            const trimmed = name.trim();
                            const userRef = db.collection('users').doc(toSafeDocId(trimmed));
                            const userDoc = await userRef.get();
                            const info = { userAgent: navigator.userAgent, lastLogin: firebase.firestore.FieldValue.serverTimestamp() };
                            if (userDoc.exists) await userRef.update({ ...info, loginCount: firebase.firestore.FieldValue.increment(1) });
                            else await userRef.set({ name: trimmed, ...info, loginCount: 1, firstJoined: firebase.firestore.FieldValue.serverTimestamp(), timeSpentMinutes: 0 });
                            
                            await db.collection('login_logs').add({ name: trimmed, isAdmin: false, time: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent });
                            
                            localStorage.setItem(STORAGE_KEYS.NAME, trimmed);
                            localStorage.removeItem(STORAGE_KEYS.TOKEN);
                            onLogin(trimmed, false);
                        } else if (data.status === 'rejected') {
                            setStep('rejected');
                        }
                    }
                });
            });
            return () => { if (unsubscribe) unsubscribe(); };
        }
    }, [step, requestId, name, onLogin]);

    // Cleanup camera on unmount
    useEffect(() => {
        return () => stopCamera();
    }, [stopCamera]);


    return (
        <div className="min-h-screen bg-muted/30 flex items-center justify-center p-16 font-sans">
            <div className="animate-card w-full max-w-[380px] bg-card border border-border rounded-lg shadow-2xl p-24 sm:p-32 flex flex-col items-center">
                
                {/* Header */}
                <div className="text-center mb-24 w-full">
                    <div className="flex items-center justify-center gap-8 mb-4">
                        <h1 className="text-[24px] font-extrabold tracking-wider text-brand bidi-isolate">Korvi</h1>
                        <span className="text-[22px] font-bold text-foreground">Security</span>
                    </div>
                    <p className="text-[13px] text-muted-foreground">حماية شركة بيت الأواني الطيبة</p>
                </div>

                {/* Step 1: Name Input */}
                {step === 'name' && (
                    <form onSubmit={handleNameSubmit} className="flex flex-col gap-16 w-full">
                        <div>
                            <label htmlFor="employeeName" className="text-[13px] font-medium text-foreground mb-8 block text-center">أدخل الإسم الكريم للمطابقة</label>
                            <input id="employeeName" type="text" required autoComplete="name" value={name}
                                   onChange={(e) => { setName(e.target.value); setError(''); }} placeholder="اكتب اسمك هنا..."
                                   className="w-full h-44 px-16 rounded-md border border-input bg-background focus-visible:ring-2 focus-visible:ring-ring text-foreground outline-none transition-shadow text-center font-bold" />
                        </div>
                        {error  && <p className="text-[13px] text-destructive flex items-center justify-center gap-6"><Icon.Alert className="w-14 h-14 flex-shrink-0" />{error}</p>}
                        <button type="submit" className="w-full h-44 bg-primary text-primary-foreground rounded-md font-medium text-[14px] hover:bg-primary/90 transition-colors shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring mt-4 flex items-center justify-center gap-8">
                            المتابعة <Icon.Shield className="w-16 h-16" />
                        </button>
                    </form>
                )}

                {/* Step 1B: Admin Password (Hidden Door) */}
                {step === 'password' && (
                    <form onSubmit={handleAdminSubmit} className="flex flex-col gap-16 w-full animate-flip">
                        <div>
                            <label htmlFor="accessCode" className="text-[13px] font-medium text-primary mb-8 flex items-center justify-center gap-6">
                                <Icon.Lock className="w-14 h-14 flex-shrink-0" /> بوابة الإدارة
                            </label>
                            <input ref={codeRef} id="accessCode" type="password" inputMode="numeric" autoComplete="off" value={code}
                                   onChange={(e) => { setCode(e.target.value); setError(''); }} placeholder="••••"
                                   className="w-full h-44 px-16 rounded-md border border-primary/50 bg-primary/5 focus-visible:ring-2 focus-visible:ring-primary text-primary outline-none transition-shadow tracking-widest text-center font-bold" />
                        </div>
                        {error  && <p className="text-[13px] text-destructive flex items-center justify-center gap-6"><Icon.Alert className="w-14 h-14 flex-shrink-0" />{error}</p>}
                        <button type="submit" disabled={loading} className="w-full h-44 bg-primary text-primary-foreground rounded-md font-medium text-[14px] hover:bg-primary/90 disabled:opacity-50 transition-colors shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                            {loading ? "جاري الدخول..." : "فتح النظام"}
                        </button>
                        <button type="button" onClick={() => setStep('name')} className="text-[12px] text-muted-foreground hover:text-foreground mt-4">العودة</button>
                    </form>
                )}

                {/* Step 2: Scanner UI */}
                {step === 'scan' && (
                    <div className="flex flex-col items-center gap-16 w-full animate-flip">
                        <div className="text-center">
                            <p className="text-[14px] font-bold text-foreground">التحقق الحيوي والمكاني</p>
                            <p className="text-[11px] text-muted-foreground mt-2">يرجى وضع وجهك داخل الإطار للمطابقة</p>
                        </div>
                        
                        <div className="relative w-[200px] h-[200px] sm:w-[240px] sm:h-[240px] rounded-full overflow-hidden border-[6px] border-muted shadow-inner bg-black">
                            <video ref={videoRef} autoPlay playsInline muted className="object-cover w-full h-full transform scale-x-[-1] opacity-90" />
                            
                            {/* Face Guides */}
                            <div className="absolute inset-0 border-[4px] border-dashed border-primary/40 rounded-full animate-pulse" style={{ margin: '10%' }}></div>
                            
                            {/* Scanning Laser */}
                            <div className="absolute left-0 w-full h-[2px] bg-success shadow-[0_0_15px_3px_hsl(var(--success))] animate-laser"></div>
                        </div>
                        
                        {/* Hidden Canvas for capture */}
                        <canvas ref={canvasRef} className="hidden" />

                        <button onClick={captureAndRequest} disabled={loading} className="w-full h-44 bg-primary text-primary-foreground rounded-md font-medium text-[14px] hover:bg-primary/90 disabled:opacity-50 transition-colors shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring flex items-center justify-center gap-8 mt-4">
                            {loading ? "جاري التقاط البيانات..." : <><Icon.Camera className="w-18 h-18" /> مسح الوجه وإرسال الطلب</>}
                        </button>
                        <div className="flex items-center gap-4 text-[10px] text-muted-foreground">
                            <Icon.MapPin className="w-12 h-12" /> سيتم إرفاق موقعك الجغرافي للضرورة الأمنية
                        </div>
                    </div>
                )}

                {/* Step 3: Waiting Room */}
                {step === 'wait' && (
                    <div className="flex flex-col items-center gap-16 w-full animate-flip text-center py-16">
                        <div className="w-64 h-64 border-4 border-muted border-t-primary rounded-full animate-spin"></div>
                        <div>
                            <h3 className="text-[16px] font-bold text-foreground mb-4">في غرفة الانتظار الأمنية</h3>
                            <p className="text-[13px] text-muted-foreground leading-relaxed">
                                تم إرسال هويتك الحيوية وموقعك الجغرافي.<br/>
                                يرجى البقاء في هذه الصفحة حتى يقوم مشرف النظام بالموافقة على دخولك.
                            </p>
                        </div>
                        <div className="bg-primary/10 text-primary px-16 py-8 rounded-md text-[11px] font-bold mt-8 flex items-center gap-6">
                            <Icon.Shield className="w-14 h-14" /> الطلب قيد المراجعة اللحظية...
                        </div>
                    </div>
                )}

                {/* Step 4: Rejected */}
                {step === 'rejected' && (
                    <div className="flex flex-col items-center gap-16 w-full animate-flip text-center py-16">
                        <div className="w-64 h-64 bg-destructive/10 text-destructive rounded-full flex items-center justify-center mb-8">
                            <Icon.Close className="w-32 h-32" />
                        </div>
                        <div>
                            <h3 className="text-[18px] font-bold text-destructive mb-4">تم رفض الدخول</h3>
                            <p className="text-[13px] text-muted-foreground leading-relaxed">
                                تم رفض طلب وصولك من قبل الإدارة.<br/>
                                يرجى مراجعة المسؤول المباشر.
                            </p>
                        </div>
                        <button onClick={() => { setStep('name'); setName(''); }} className="w-full h-44 bg-surface text-foreground border border-input rounded-md font-medium text-[13px] hover:bg-muted transition-colors mt-8">
                            العودة للرئيسية
                        </button>
                    </div>
                )}

            </div>
        </div>
    );
};

// ============================================================
// لوحة تحكم الإدارة (خاصة بالمدير فقط - مهند) ✨ تبويب طلبات الدخول
// ============================================================
const AdminDashboardModal = memo(({ onClose }) => {
    const [activeTab, setActiveTab] = useState('access_requests'); // ✨ تبويب الطلبات الحية الافتراضي
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    
    const [searchTerm, setSearchTerm] = useState('');
    const [sortOrder, setSortOrder] = useState('desc');
    const [expandedOrderId, setExpandedOrderId] = useState(null);

    const tabs = [
        { id: 'access_requests', label: 'طلبات الدخول 🔴' }, // ✨ التبويب الأمني الجديد
        { id: 'site_sessions', label: 'جلسات العمل (مراقبة حية)' },
        { id: 'orders', label: 'الطلبات المعتمدة' },
        { id: 'drafts', label: 'المسودات المؤقتة' }, 
        { id: 'search_logs', label: 'سجل عمليات البحث' },
        { id: 'users', label: 'إحصائيات المستخدمين' }
    ];

    // Listen to live access requests
    useEffect(() => {
        let isMounted = true;
        let unsubscribe;

        if (activeTab === 'access_requests') {
            setLoading(true);
            getDb().then(db => {
                // Real-time listener for pending requests
                unsubscribe = db.collection('access_requests')
                    .where('status', '==', 'pending')
                    .orderBy('timestamp', 'desc')
                    .onSnapshot(snapshot => {
                        if (isMounted) {
                            const reqs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setData(reqs);
                            setLoading(false);
                        }
                    }, err => {
                        console.error(err);
                        // Fallback without orderBy if index is missing
                        db.collection('access_requests').where('status', '==', 'pending').onSnapshot(snap => {
                            if (isMounted) {
                                let reqs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                reqs.sort((a,b) => (b.timestamp?.toMillis?.() || 0) - (a.timestamp?.toMillis?.() || 0));
                                setData(reqs);
                                setLoading(false);
                            }
                        });
                    });
            });
        } else {
            // Normal fetch for other tabs
            setLoading(true);
            setSearchTerm('');
            setExpandedOrderId(null);

            getDb().then(db => {
                let sortField = 'timestamp';
                if (activeTab === 'users') sortField = 'lastLogin';
                else if (activeTab === 'search_logs') sortField = 'time';
                else if (activeTab === 'site_sessions') sortField = 'lastActive'; 
                
                const collectionRef = db.collection(activeTab);
                
                collectionRef.orderBy(sortField, 'desc').limit(200).get()
                    .then(snapshot => {
                        if (isMounted) {
                            const fetchedData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setData(fetchedData);
                            setLoading(false);
                        }
                    })
                    .catch(err => {
                        collectionRef.limit(200).get().then(snap => {
                            if (isMounted) {
                                let fetchedData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                fetchedData.sort((a,b) => {
                                    const t1 = a.timestamp || a.time || a.lastLogin || a.firstJoined || a.lastActive || 0;
                                    const t2 = b.timestamp || b.time || b.lastLogin || b.firstJoined || b.lastActive || 0;
                                    const v1 = t1.toMillis ? t1.toMillis() : new Date(t1).getTime();
                                    const v2 = t2.toMillis ? t2.toMillis() : new Date(t2).getTime();
                                    return v2 - v1;
                                });
                                setData(fetchedData);
                                setLoading(false);
                            }
                        }).catch(e => {
                            if(isMounted) setLoading(false);
                        });
                    });
            });
        }

        return () => { 
            isMounted = false; 
            if (unsubscribe) unsubscribe();
        };
    }, [activeTab]);

    const filteredData = useMemo(() => {
        let res = [...data];
        if (searchTerm.trim()) {
            const q = searchTerm.toLowerCase();
            res = res.filter(row => JSON.stringify(row).toLowerCase().includes(q));
        }
        if (sortOrder === 'asc') res.reverse();
        return res;
    }, [data, searchTerm, sortOrder]);

    const isUserOnline = useCallback((lastActive) => {
        if (!lastActive) return false;
        const lastTime = lastActive.toMillis ? lastActive.toMillis() : new Date(lastActive).getTime();
        return (Date.now() - lastTime) < (3 * 60 * 1000); 
    }, []);

    const groupedSessions = useMemo(() => {
        if (activeTab !== 'site_sessions') return [];
        const groups = {};
        filteredData.forEach(session => {
            const name = session.name || 'مجهول';
            if (!groups[name]) {
                groups[name] = { name: name, totalDuration: 0, sessions: [], isOnline: false, lastActive: 0 };
            }
            groups[name].sessions.push(session);
            groups[name].totalDuration += (session.durationMinutes || 0);
            
            const sessionLastActive = session.lastActive?.toMillis ? session.lastActive.toMillis() : new Date(session.lastActive).getTime();
            if (sessionLastActive > groups[name].lastActive) {
                groups[name].lastActive = sessionLastActive;
                groups[name].isOnline = isUserOnline(session.lastActive);
            }
        });
        return Object.values(groups).sort((a, b) => b.lastActive - a.lastActive);
    }, [filteredData, activeTab, isUserOnline]);

    const formatFbDate = (ts) => {
        if (!ts) return '---';
        try { return ts.toDate ? ts.toDate().toLocaleDateString('ar-SA') : new Date(ts).toLocaleDateString('ar-SA'); } catch { return '---'; }
    };
    
    const formatFbTime = (ts) => {
        if (!ts) return '---';
        try { return ts.toDate ? ts.toDate().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'}) : new Date(ts).toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'}); } catch { return '---'; }
    };

    const totalRevenue = activeTab === 'orders' ? filteredData.reduce((sum, row) => sum + (row.totalAmount || 0), 0) : 0;

    // ✨ دوال الموافقة والرفض الأمنية
    const handleRequestDecision = async (reqId, decision) => {
        if (!window.confirm(`تأكيد ${decision === 'approved' ? 'الموافقة' : 'الرفض'} لهذا الشخص؟`)) return;
        try {
            const db = await getDb();
            await db.collection('access_requests').doc(reqId).update({ status: decision });
        } catch (e) {
            alert('حدث خطأ أثناء تنفيذ القرار.');
        }
    };

    return (
        <div className="fixed inset-0 z-[200] bg-black/80 flex justify-center items-end sm:items-center animate-card">
            <div className="w-full max-w-[1000px] h-[95vh] sm:h-[90vh] bg-background sm:rounded-lg rounded-t-lg overflow-hidden shadow-2xl flex flex-col">
                <div className="p-16 flex justify-between items-center border-b border-border bg-muted/50">
                    <h3 className="font-bold text-foreground flex items-center gap-8">
                        <Icon.Shield className="w-20 h-20 text-primary"/> مركز القيادة والتحكم الأمني
                    </h3>
                    <button onClick={onClose} className="p-4 bg-background rounded-md border border-border hover:bg-destructive/10 hover:text-destructive transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                        <Icon.Close className="w-16 h-16"/>
                    </button>
                </div>
                
                <div className="flex overflow-x-auto border-b border-border bg-muted/20 no-scrollbar">
                    {tabs.map(tab => (
                        <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                            className={`flex-1 min-w-[120px] whitespace-nowrap py-12 text-[13px] font-medium border-b-2 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${activeTab === tab.id ? 'border-primary text-primary' : 'border-transparent text-muted-foreground hover:text-foreground'}`}>
                            {tab.label}
                            {tab.id === 'access_requests' && data.length > 0 && activeTab === 'access_requests' && (
                                <span className="mr-6 inline-flex bg-destructive text-white rounded-full px-6 py-2 text-[10px] numeric animate-pulse">{data.length}</span>
                            )}
                        </button>
                    ))}
                </div>

                <div className="p-16 border-b border-border bg-background flex flex-col sm:flex-row gap-12 items-center justify-between">
                    <div className="relative w-full sm:w-[350px]">
                        <Icon.Search className="w-16 h-16 absolute right-12 top-1/2 -translate-y-1/2 text-muted-foreground" />
                        <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="بحث ذكي عن أي شيء..."
                               className="w-full pl-12 pr-36 py-8 rounded-md border border-input bg-background text-[13px] outline-none focus-visible:ring-2 focus-visible:ring-ring transition-shadow" />
                    </div>
                    <div className="flex items-center gap-8 w-full sm:w-auto">
                        <Icon.Filter className="w-16 h-16 text-muted-foreground" />
                        <select value={sortOrder} onChange={e => setSortOrder(e.target.value)} className="bg-background border border-input rounded-md px-12 py-8 text-[13px] outline-none focus-visible:ring-2 focus-visible:ring-ring flex-1 sm:flex-none cursor-pointer">
                            <option value="desc">ترتيب: الأحدث أولاً</option>
                            <option value="asc">ترتيب: الأقدم أولاً</option>
                        </select>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto p-16 bg-muted/10">
                    {/* ✨ واجهة طلبات الدخول المعلقة (Quarantine Room) */}
                    {activeTab === 'access_requests' ? (
                        loading ? (
                            <div className="flex justify-center items-center h-48 text-muted-foreground text-[14px]">جاري جلب الطلبات الحية...</div>
                        ) : data.length === 0 ? (
                            <StateBlock icon={<Icon.Shield className="w-20 h-20" />} title="لا توجد طلبات دخول معلقة" note="النظام آمن ومستقر حالياً." />
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
                                {filteredData.map(req => (
                                    <div key={req.id} className="bg-card border border-border rounded-lg p-16 shadow-sm flex flex-col gap-12 relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-4 bg-warning animate-pulse"></div>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h4 className="font-bold text-[16px] text-foreground">{req.name}</h4>
                                                <p className="text-[11px] text-muted-foreground mt-2 numeric">{formatFbDate(req.timestamp)} • {formatFbTime(req.timestamp)}</p>
                                            </div>
                                            <span className="bg-warning/10 text-warning px-8 py-2 rounded-md text-[10px] font-bold">بانتظار الموافقة</span>
                                        </div>
                                        
                                        <div className="w-full aspect-square bg-black rounded-md overflow-hidden relative border-2 border-muted">
                                            {req.photoDataUrl ? (
                                                <img src={req.photoDataUrl} alt="صورة حية" className="w-full h-full object-cover transform scale-x-[-1]" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-muted-foreground"><Icon.ImageOff className="w-24 h-24" /></div>
                                            )}
                                            <div className="absolute bottom-0 left-0 w-full p-8 bg-black/60 backdrop-blur-sm flex justify-between items-center">
                                                <span className="text-[10px] text-white">التقطت حياً</span>
                                                {req.latitude && req.longitude ? (
                                                    <a href={`https://www.google.com/maps?q=${req.latitude},${req.longitude}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 text-[10px] text-primary hover:text-white transition-colors bg-primary/20 px-6 py-2 rounded">
                                                        <Icon.MapPin className="w-10 h-10" /> عرض الموقع
                                                    </a>
                                                ) : (
                                                    <span className="text-[10px] text-destructive">بدون موقع</span>
                                                )}
                                            </div>
                                        </div>

                                        <div className="flex gap-8 mt-4">
                                            <button onClick={() => handleRequestDecision(req.id, 'approved')} className="flex-1 h-36 bg-success text-success-foreground rounded-md font-medium text-[13px] hover:bg-success/90 transition-colors flex items-center justify-center gap-6">
                                                <Icon.CheckCircle className="w-14 h-14"/> اعتماد
                                            </button>
                                            <button onClick={() => handleRequestDecision(req.id, 'rejected')} className="flex-1 h-36 bg-destructive/10 text-destructive rounded-md font-medium text-[13px] hover:bg-destructive hover:text-destructive-foreground transition-colors flex items-center justify-center gap-6">
                                                <Icon.Close className="w-14 h-14"/> طرد وحظر
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )
                    ) : (
                        // الأقسام القديمة
                        <React.Fragment>
                            {activeTab === 'orders' && !loading && (
                                <div className="grid grid-cols-2 gap-12 mb-16">
                                    <div className="bg-card border border-border rounded-lg p-16 shadow-sm">
                                        <p className="text-[12px] text-muted-foreground mb-4">إجمالي الدخل للعمليات المفلترة</p>
                                        <p className="text-[20px] font-bold text-success"><span className="numeric">{NUMBER_FORMATTER.format(totalRevenue)}</span> ر.س</p>
                                    </div>
                                    <div className="bg-card border border-border rounded-lg p-16 shadow-sm">
                                        <p className="text-[12px] text-muted-foreground mb-4">عدد الفواتير</p>
                                        <p className="text-[20px] font-bold text-foreground"><span className="numeric">{NUMBER_FORMATTER.format(filteredData.length)}</span> فاتورة</p>
                                    </div>
                                </div>
                            )}

                            {loading ? (
                                <div className="flex justify-center items-center h-48 text-muted-foreground text-[14px]">جاري جلب السجلات...</div>
                            ) : (activeTab !== 'site_sessions' && filteredData.length === 0) || (activeTab === 'site_sessions' && groupedSessions.length === 0) ? (
                                <div className="flex justify-center items-center h-48 text-muted-foreground text-[14px]">لا توجد بيانات مطابقة لعملية البحث.</div>
                            ) : (
                                <div className="overflow-x-auto bg-card border border-border rounded-lg shadow-sm">
                                    <table className="w-full text-right text-[12px]">
                                        <thead className="bg-muted/50 text-muted-foreground border-b border-border uppercase tracking-wide">
                                            {activeTab === 'site_sessions' && (
                                                <tr><th className="p-12 font-medium">المندوب</th><th className="p-12 font-medium text-right">إجمالي الجلسات</th><th className="p-12 font-medium text-right">إجمالي وقت العمل اليوم</th><th className="p-12 font-medium text-right">الحالة الآن</th><th className="p-12 font-medium text-right">الإجراءات</th></tr>
                                            )}
                                            {activeTab === 'orders' && (
                                                <tr><th className="p-12 font-medium text-right">التاريخ</th><th className="p-12 font-medium text-right">المندوب</th><th className="p-12 font-medium text-right">العميل</th><th className="p-12 font-medium text-right">المستودع</th><th className="p-12 font-medium text-right">الملاحظات</th><th className="p-12 font-medium text-right">الإجمالي</th><th className="p-12 font-medium text-right">الإجراءات</th></tr>
                                            )}
                                            {activeTab === 'drafts' && (
                                                <tr><th className="p-12 font-medium text-right">التاريخ</th><th className="p-12 font-medium text-right">المندوب</th><th className="p-12 font-medium text-right">اسم المسودة/العميل</th><th className="p-12 font-medium text-right">المستودع</th><th className="p-12 font-medium text-right">عدد الأصناف</th><th className="p-12 font-medium text-right">الإجراءات</th></tr>
                                            )}
                                            {activeTab === 'search_logs' && (
                                                <tr><th className="p-12 font-medium text-right">التاريخ</th><th className="p-12 font-medium text-right">الوقت</th><th className="p-12 font-medium text-right">المستخدم</th><th className="p-12 font-medium text-right">كلمة البحث</th><th className="p-12 font-medium text-right">النتائج</th></tr>
                                            )}
                                            {activeTab === 'users' && (
                                                <tr><th className="p-12 font-medium text-right">أول انضمام</th><th className="p-12 font-medium text-right">الاسم</th><th className="p-12 font-medium text-right">عدد الدخول</th><th className="p-12 font-medium text-right">إجمالي وقت العمل</th></tr>
                                            )}
                                        </thead>
                                        <tbody className="divide-y divide-border">
                                            {activeTab === 'site_sessions' ? (
                                                groupedSessions.map((group, i) => (
                                                    <React.Fragment key={group.name}>
                                                        <tr className="hover:bg-muted/30 transition-colors">
                                                            <td className="p-12 font-medium text-foreground text-[14px]">{group.name}</td>
                                                            <td className="p-12 font-medium text-muted-foreground"><span className="numeric">{group.sessions.length}</span> جلسات</td>
                                                            <td className="p-12 font-medium text-primary"><span className="numeric">{formatTimeSpent(group.totalDuration)}</span></td>
                                                            <td className="p-12">
                                                                {group.isOnline 
                                                                    ? <span className="bg-success/10 text-success ring-1 ring-inset ring-success/30 px-8 py-4 rounded-md font-medium text-[11px]">متصل الآن</span> 
                                                                    : <span className="bg-muted text-muted-foreground ring-1 ring-inset ring-border px-8 py-4 rounded-md text-[11px]">مغادر</span>}
                                                            </td>
                                                            <td className="p-12">
                                                                <button onClick={() => setExpandedOrderId(expandedOrderId === group.name ? null : group.name)} className="flex items-center gap-4 text-primary hover:text-primary-foreground transition-colors text-[11px] font-medium whitespace-nowrap bg-primary/10 hover:bg-primary px-8 py-4 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                                                    <Icon.Eye className="w-14 h-14" />
                                                                    {expandedOrderId === group.name ? 'إخفاء' : 'عرض التفاصيل'}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                        {expandedOrderId === group.name && (
                                                            <tr className="bg-muted/10 border-b border-border">
                                                                <td colSpan="5" className="p-16">
                                                                    <div className="bg-card border border-border rounded-lg p-12 shadow-sm">
                                                                        <h4 className="font-medium text-[13px] text-foreground mb-8 border-b border-border pb-8">سجل الجلسات المفصل للمندوب ({group.name}):</h4>
                                                                        <div className="overflow-x-auto">
                                                                            <table className="w-full text-[12px] text-right">

                        </div>
                        
                        <div className="flex items-center gap-8 flex-shrink-0">
                            {isAdmin && (
                                <button onClick={() => setShowAdmin(true)} title="لوحة الإدارة" className="flex items-center justify-center w-48 h-48 rounded-md bg-primary/10 border border-primary/20 text-primary hover:bg-primary hover:text-primary-foreground transition-colors animate-flip focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                    <Icon.Dashboard className="w-20 h-20" />
                                </button>
                            )}

                            {warehouse && (
                                <React.Fragment>
                                    <button onClick={() => setShowDrafts(true)} title="المسودات المؤقتة" className="relative flex items-center justify-center w-48 h-48 rounded-md bg-card border border-border text-foreground hover:border-primary/50 hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                        <Icon.Archive className="w-20 h-20" />
                                        {drafts.length > 0 && (
                                            <span className="absolute -top-4 -right-4 w-20 h-20 bg-warning text-warning-foreground text-[10px] font-bold flex items-center justify-center rounded-full animate-flip numeric">
                                                {drafts.length}
                                            </span>
                                        )}
                                    </button>

                                    <button onClick={() => setShowHistory(true)} title="سجل الطلبات" className="flex items-center justify-center w-48 h-48 rounded-md bg-card border border-border text-foreground hover:border-primary/50 hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                        <Icon.List className="w-20 h-20" />
                                    </button>
                                    
                                    <button onClick={() => setShowCart(true)} className="relative flex items-center justify-center w-48 h-48 rounded-md bg-card border border-border text-foreground hover:border-primary/50 hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                        <Icon.Cart className="w-20 h-20" />
                                        {Object.keys(cart).length > 0 && (
                                            <span className="absolute -top-4 -right-4 w-20 h-20 bg-primary text-primary-foreground text-[10px] font-bold flex items-center justify-center rounded-full animate-flip numeric">
                                                {Object.keys(cart).length}
                                            </span>
                                        )}
                                    </button>
                                </React.Fragment>
                            )}
                        </div>
                    </div>

                    <div className="flex items-center gap-12">
                        <div className="relative flex-1 min-w-0">
                            <Icon.Search className="w-18 h-18 text-muted-foreground absolute right-14 top-1/2 -translate-y-1/2 pointer-events-none" />
                            <input ref={searchInputRef} id="searchInput" type="text" autoComplete="off"
                                   value={query} onChange={(e) => setQuery(e.target.value)} disabled={!warehouse}
                                   placeholder={warehouse ? "اكتب رقم الصنف أو امسح الباركود..." : "اختر المستودع أولاً"}
                                   className={`w-full h-48 pr-40 pl-48 rounded-md border outline-none transition-shadow focus-visible:ring-2 focus-visible:ring-ring ${!warehouse ? 'bg-muted/50 border-border text-muted-foreground cursor-not-allowed' : 'bg-background border-input text-foreground'}`} />
                            
                            {warehouse && (
                                <button onClick={() => setShowScanner(true)} title="مسح الباركود بالكاميرا"
                                    className="absolute left-6 top-1/2 -translate-y-1/2 w-36 h-36 flex items-center justify-center rounded-md text-muted-foreground bg-card border border-border hover:text-primary hover:border-primary/50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                                    <Icon.Scan className="w-18 h-18" />
                                </button>
                            )}
                        </div>

                        <label className="flex items-center gap-8 cursor-pointer flex-shrink-0">
                            <span className="hidden sm:inline text-[12px] text-muted-foreground whitespace-nowrap">عرض مع الصورة</span>
                            <input type="checkbox" className="sr-only" checked={showImageInSearch}
                                   onChange={(e) => setShowImageInSearch(e.target.checked)} disabled={!warehouse} />
                            <div className={`w-44 h-26 rounded-full transition-colors relative flex-shrink-0 ${showImageInSearch ? 'bg-primary' : 'bg-border'} ${!warehouse ? 'opacity-50' : ''}`}>
                                <div className={`absolute top-2 left-2 w-22 h-22 bg-background rounded-full shadow-sm transition-transform ${showImageInSearch ? 'translate-x-18' : ''}`}></div>
                            </div>
                        </label>
                    </div>

                    {warehouse && showImageInSearch && <p className="text-[11px] text-primary"> وضع العرض للعميل — الأصناف المنتهية مخفية</p>}
                </div>
            </div>

            <div className="max-w-[1024px] mx-auto px-16 pb-64">

                {isDbEmpty && !loading && (
                    <div className="max-w-[480px] mx-auto mt-24">
                        <StateBlock tone="danger" icon={<Icon.Alert className="w-20 h-20" />} title="تعذر تحميل بيانات المخزون" note="تحقق من وجود jeddah.tsv و riyadh.tsv في مجلد data ومن صحة ترويسة الأعمدة." />
                    </div>
                )}

                {query.trim() && search && (
                    <div className="max-w-[520px] mx-auto mt-24 flex flex-col gap-8">
                        {search.total === 0 && <StateBlock icon={<Icon.Search className="w-20 h-20" />} title="لم يتم العثور على الصنف" note="لا يوجد صنف بهذا الرقم أو الاسم في المستودع المحدد." />}
                        {search.exact && <FullResultCard item={search.exact} warehouseName={activeWarehouseName} showImage={showImageInSearch && imagesList.has(search.exact.cleanId)} imageFileName={imagesList.get(search.exact.cleanId)} hideQty={hideQtyInSearch} cart={cart} setCart={setCart} />}
                        {search.visible.filter(i => !search.exact || i.uid !== search.exact.uid).map(item => (
                            <CompactResultCard key={item.uid} item={item} showImage={showImageInSearch && imagesList.has(item.cleanId)} imageFileName={imagesList.get(item.cleanId)} hideQty={hideQtyInSearch} cart={cart} setCart={setCart} />
                        ))}
                        {search.total > search.visible.length && <p className="text-[12px] text-muted-foreground text-center pt-8"><span className="numeric">{NUMBER_FORMATTER.format(search.total)}</span> نتيجة — أضف تفاصيل لتضييق البحث</p>}
                    </div>
                )}

                <section className="mt-40" id="gallery-section">
                    <div className="flex justify-between items-end gap-12 mb-12">
                        <div className="min-w-0">
                            <h2 className="text-[18px] font-bold text-foreground">المعرض الرقمي</h2>
                            {warehouse && <p className="text-[12px] text-muted-foreground mt-2">{activeWarehouseName}</p>}
                        </div>
                        {activeCategory && (
                            <div className="flex bg-muted/50 border border-border rounded-lg p-4 gap-4 flex-shrink-0" role="group" aria-label="نمط العرض">
                                <button onClick={() => setGalleryView('list')} aria-pressed={galleryView === 'list'} className={`flex items-center gap-6 px-12 h-36 rounded-md text-[13px] font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${galleryView === 'list' ? 'bg-card text-foreground shadow-sm' : 'text-muted-foreground hover:text-foreground'}`}><Icon.List className="w-16 h-16" /> طولي</button>
                                <button onClick={() => setGalleryView('grid')} aria-pressed={galleryView === 'grid'} className={`flex items-center gap-6 px-12 h-36 rounded-md text-[13px] font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${galleryView === 'grid' ? 'bg-card text-foreground shadow-sm' : 'text-muted-foreground hover:text-foreground'}`}><Icon.Grid className="w-16 h-16" /> شبكي</button>
                            </div>
                        )}
                    </div>

                    {(() => {
                        const changeCategory = (cat) => {
                            setActiveCategory(cat);
                            const el = document.getElementById('gallery-section');
                            if (el) {
                                const y = el.getBoundingClientRect().top + window.scrollY - 80;
                                window.scrollTo({ top: y, behavior: 'smooth' });
                            }
                        };

                        const categoryButtons = (
                            <div className="flex flex-wrap gap-8">
                                {categoryNames.map(cat => (
                                    <button key={cat} onClick={() => changeCategory(cat)} aria-pressed={activeCategory === cat} className={chip(activeCategory === cat)}>{cat}</button>
                                ))}
                                <button onClick={() => changeCategory(SPECIAL_CATEGORIES.UNCATEGORIZED)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED} className={chip(activeCategory === SPECIAL_CATEGORIES.UNCATEGORIZED)}>{SPECIAL_CATEGORIES.UNCATEGORIZED}</button>
                                {isAdmin && (
                                    <button onClick={() => changeCategory(SPECIAL_CATEGORIES.MISSING_IMAGES)} aria-pressed={activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES} className={`px-14 py-10 rounded-full text-[13px] font-medium border transition-colors duration-200 flex items-center gap-6 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${activeCategory === SPECIAL_CATEGORIES.MISSING_IMAGES ? 'bg-primary text-primary-foreground border-primary shadow-sm' : 'bg-primary/10 text-primary border-primary/10 hover:border-primary/50'}`}>
                                        <Icon.ImageOff className="w-14 h-14 flex-shrink-0" /> {SPECIAL_CATEGORIES.MISSING_IMAGES}
                                    </button>
                                )}
                            </div>
                        );

                        return (
                            <React.Fragment>
                                <p className="text-[12px] text-muted-foreground mb-8">الأقسام (<span className="numeric">{NUMBER_FORMATTER.format(totalCategoryCount)}</span>)</p>
                                <div className="mb-20">
                                    {categoryButtons}
                                </div>

                                {loading ? ( <SkeletonGrid />
                                ) : !warehouse ? ( <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر المستودع" note="حدد مخزون جدة أو مخزون الرياض من الأعلى لفتح المعرض." /></div>
                                ) : !activeCategory ? ( <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.Grid className="w-20 h-20" />} title="اختر قسماً" note="حدد قسماً من الأعلى لاستعراض المنتجات المتوفرة." /></div>
                                ) : (
                                    <div>
                                        <div className="flex flex-wrap justify-between items-center gap-8 mb-16">
                                            <p className="text-[12px] text-muted-foreground">
                                                {activeCategory} — <span className="numeric">{NUMBER_FORMATTER.format(galleryResults.length)}</span> صنف متوفر
                                                {galleryResults.length > visibleItems.length && ` (معروض `}
                                                {galleryResults.length > visibleItems.length && <span className="numeric">{NUMBER_FORMATTER.format(visibleItems.length)}</span>}
                                                {galleryResults.length > visibleItems.length && `)`}
                                            </p>
                                            <p className="text-[11px] text-muted-foreground">نقرتان: الكمية · ثلاث: بطاقة المنتج</p>
                                        </div>

                                        {galleryResults.length === 0 ? (
                                            <div className="max-w-[480px] mx-auto"><StateBlock icon={<Icon.ImageOff className="w-20 h-20" />} title="لا توجد أصناف" note="لا توجد أصناف متوفرة في هذا القسم داخل المستودع المحدد." /></div>
                                        ) : (
                                            <div className={galleryView === 'grid' ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-12 md:gap-16" : "flex flex-col gap-16 max-w-[520px] mx-auto"}>
                                                {visibleItems.map(item => (
                                                    <GalleryCard key={item.uid} item={item} imageFileName={imagesList.get(item.cleanId)} showImage={!isMissingImagesView} isGrid={galleryView === 'grid'}
                                                        view={cardViews[item.uid] || CARD_VIEW.IMAGE} onTap={handleCardTap} onCycle={handleCardCycle} onZoom={handleZoom} warehouseName={activeWarehouseName} cart={cart} setCart={setCart} />
                                                ))}
                                            </div>
                                        )}

                                        {galleryResults.length > visibleItems.length && (
                                            <div className="flex justify-center mt-24">
                                                <button onClick={() => setVisibleCount(c => c + GALLERY_PAGE_SIZE)} className="px-24 h-48 rounded-md border border-input bg-card text-foreground text-[14px] font-medium hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors shadow-sm">عرض المزيد</button>
                                            </div>
                                        )}

                                        {galleryResults.length > 0 && (
                                            <div className="mt-32 pt-24 border-t border-border">
                                                <p className="text-[12px] text-muted-foreground mb-8">انتقال سريع لقسم آخر:</p>
                                                {categoryButtons}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </React.Fragment>
                        );
                    })()}
                </section>

                <footer className="mt-64 pt-24 border-t border-border flex justify-center pb-24">
                    <a href="https://wa.me/966506762257" target="_blank" rel="noopener noreferrer" className="text-[12px] text-muted-foreground hover:text-primary transition-colors cursor-pointer" title="تواصل مع المطور عبر واتساب">© 2026 تطوير مهند الحزمي</a>
                </footer>
            </div>

            {/* ===== النوافذ المنبثقة ===== */}
            {showScanner && <BarcodeScannerModal onClose={() => setShowScanner(false)} onScan={(scannedText) => { setShowScanner(false); setQuery(scannedText); }} />}
            {showDrafts && <DraftsModal drafts={drafts} setDrafts={setDrafts} setCart={setCart} setWarehouse={setWarehouse} onClose={() => setShowDrafts(false)} />}
            {showCart && <OrderInvoiceModal cart={cart} setCart={setCart} drafts={drafts} setDrafts={setDrafts} onClose={() => setShowCart(false)} sessionName={sessionName} warehouse={warehouse} />}
            {showHistory && <OrderHistoryModal onClose={() => setShowHistory(false)} sessionName={sessionName} />}
            {showAdmin && isAdmin && <AdminDashboardModal onClose={() => setShowAdmin(false)} />}
            {zoomItem && <Lightbox fileName={imagesList.get(zoomItem.cleanId)} title={`${zoomItem.id} — ${zoomItem.name || ''}`} onClose={() => setZoomItem(null)} />}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
