// إدارة التصنيف اللحظية عبر Firebase — categories.tsv يبقى كطبقة أساس / fallback
const CATEGORY_UNASSIGNED = '__UNCATEGORIZED__';
const CATEGORY_COLLECTIONS = {
    OVERRIDES: 'product_category_overrides',
    META: 'catalog_categories',
    AUDIT: 'category_audit_logs'
};

const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
const NUMBER_FORMATTER = new Intl.NumberFormat('en-US');

const ARABIC_INDIC_DIGITS   = '٠١٢٣٤٥٦٧٨٩';
const EASTERN_ARABIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

const toEnglishDigits = (str) => {
    if (!str) return '';
    return String(str).replace(/[٠-٩۰-۹]/g, (d) => {
        const i = ARABIC_INDIC_DIGITS.indexOf(d);
        return i > -1 ? String(i) : String(EASTERN_ARABIC_DIGITS.indexOf(d));
    });
};

const normalizeCleanId = (str) => { if (!str) return ""; return toEnglishDigits(str).replace(/\D/g, ""); };

const normalizeText = (str) => {
    if (!str) return '';
    return toEnglishDigits(String(str)).toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '').replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا').replace(/[ىئ]/g, 'ي').replace(/ؤ/g, 'و').replace(/ة/g, 'ه')
        .replace(/[^\u0600-\u06FFa-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
};

const toSafeDocId = (name) => {
    const c = String(name || '').replace(/[\/\\\[\]#?]/g, '_').replace(/^\.+|\.+$/g, '').trim();
    return c.slice(0, 200) || 'unknown';
};

const CODE_SALT = 'bayt-awani::v5::';
const hashCode = (str) => {
    let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
    const s = CODE_SALT + String(str);
    for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
        h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
    }
    return h1.toString(36) + '-' + h2.toString(36);
};
window.__genCode = (code) => hashCode(code);

const PROTECTED_ACCOUNTS = { 'مهند': '1jh297-spgf2z' };
const isProtectedName = (name) => Object.prototype.hasOwnProperty.call(PROTECTED_ACCOUNTS, normalizeText(name));
const verifyCode = (name, code) => {
    const expected = PROTECTED_ACCOUNTS[normalizeText(name)];
    return Boolean(expected) && hashCode(toEnglishDigits(String(code)).trim()) === expected;
};

const fetchText = async (url) => {
    const cacheKey = `b2b_cache_${url}`;
    try { 
        const res = await fetch(url); 
        if (!res.ok) throw new Error(`HTTP ${res.status}`); 
        const text = await res.text();
        localStorage.setItem(cacheKey, text);
        return text;
    } catch (err) { 
        console.warn(`[Offline] يتم جلب النسخة المخبأة لـ ${url}`); 
        const cached = localStorage.getItem(cacheKey);
        if (cached) return cached;
        return ""; 
    }
};

const fetchJson = async (url) => {
    const cacheKey = `b2b_cache_${url}`;
    try { 
        const res = await fetch(url); 
        if (!res.ok) throw new Error(`HTTP ${res.status}`); 
        const data = await res.json();
        localStorage.setItem(cacheKey, JSON.stringify(data));
        return data;
    } catch (err) { 
        console.warn(`[Offline] يتم جلب النسخة المخبأة لـ ${url}`); 
        const cached = localStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);
        return null; 
    }
};

const parsePricingMap = (rawText) => {
    const map = {};
    if (!rawText) return map;
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return map;

    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(lines.length, 5); i++) {
        if (lines[i] && lines[i].includes('سعر') && (lines[i].includes('رقم') || lines[i].includes('صنف'))) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) return map;

    const headers = lines[headerRowIdx].split('\t').map(h => h.trim());
    const pairs = [];

    for (let i = 0; i < headers.length; i++) {
        if (/رقم|كود|صنف/i.test(headers[i])) {
            if (i > 0 && /سعر|بيع/i.test(headers[i - 1])) pairs.push({ skuIdx: i, priceIdx: i - 1 });
            else if (i < headers.length - 1 && /سعر|بيع/i.test(headers[i + 1])) pairs.push({ skuIdx: i, priceIdx: i + 1 });
        }
    }

    for (let i = headerRowIdx + 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        pairs.forEach(pair => {
            const rawSku = cols[pair.skuIdx];
            const rawPrice = cols[pair.priceIdx];
            if (rawSku && rawPrice) {
                const cleanId = normalizeCleanId(rawSku);
                const price = parseFloat(toEnglishDigits(rawPrice).replace(/,/g, ''));
                if (cleanId && !isNaN(price) && price > 0) map[cleanId] = price;
            }
        });
    }
    return map;
};

const parseExcelData = (rawText, warehouseKey, pricingMap) => {
    if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];
    const lines = rawText.trim().split('\n');
    if (lines.length < 2) return [];

    const headers = lines[0].split('\t').map(h => h.trim());
    const idIdx   = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
    const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
    const qtyIdx  = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
    const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
    const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

    if (idIdx === -1) return [];

    const dataMap = {};
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split('\t').map(c => c.trim());
        if (cols.length === 0 || (!cols[idIdx] && (nameIdx === -1 || !cols[nameIdx]))) continue;

        const rawId    = cols[idIdx] ? cols[idIdx].trim() : '';
        const searchId = toEnglishDigits(rawId).toLowerCase();
        if (!searchId) continue;

        const name   = nameIdx !== -1 && cols[nameIdx] ? cols[nameIdx].trim() : '';
        const rawQty = toEnglishDigits(qtyIdx !== -1 ? (cols[qtyIdx] || '0') : '0').replace(/,/g, '');
        const qty    = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);

        const packStr = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';
        const cleanId = normalizeCleanId(rawId);
        
        const cartonPrice = pricingMap[cleanId] || 0;
        let approxPiecePrice = 0;

        if (cartonPrice > 0) {
            const packNum = parseFloat(toEnglishDigits(packStr).replace(/[^0-9.]/g, ''));
            if (!isNaN(packNum) && packNum > 0) approxPiecePrice = cartonPrice / packNum;
        }

        dataMap[searchId] = {
            uid: `${warehouseKey}:${searchId}`, warehouseKey, id: rawId, searchId, cleanId: cleanId,
            name, searchName: normalizeText(name), qty, unit: unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '',
            pack: packStr, price: cartonPrice, approxPrice: approxPiecePrice
        };
    }
    return Object.values(dataMap);
};

const buildImagesMap = (imagesText) => {
    const map = new Map();
    imagesText.split('\n').forEach((line) => {
        const fileName = line.trim();
        if (!fileName) return;
        const clean = normalizeCleanId(fileName.replace(/\.[^.]+$/, ''));
        if (clean && !map.has(clean)) map.set(clean, fileName);
    });

};

const parseCategories = (text) => {
    const obj = {};
    if (!text) return obj;
    const rows = text.split('\n').map(r => r.split('\t').map(c => c.trim()));
    if (rows.length === 0) return obj;
    const headers = rows[0];
    headers.forEach(h => { if (h) obj[h] = []; });
    for (let i = 1; i < rows.length; i++) {
        for (let j = 0; j < headers.length; j++) {
            const h = headers[j];
            if (!h || !obj[h]) continue;
            const clean = normalizeCleanId(rows[i][j]);
            if (clean) obj[h].push(clean);
        }
    }
    return obj;
};


// يبني التصنيف النهائي: ملف TSV الأساسي + تعديلات Firebase فقط.
// لا يتم نسخ جميع المنتجات إلى Firebase، بل تُحفظ المنتجات التي تغير تصنيفها فقط.
const buildEffectiveCategories = (baseCategories, overrides, categoryMeta) => {
    const result = {};
    const archived = new Set();

    Object.values(categoryMeta || {}).forEach(meta => {
        if (meta && meta.name && meta.archived) archived.add(meta.name);
        if (meta && meta.name && !meta.archived && !result[meta.name]) result[meta.name] = [];
    });

    Object.entries(baseCategories || {}).forEach(([category, ids]) => {
        if (!category || archived.has(category)) return;
        if (!result[category]) result[category] = [];
        (ids || []).forEach(cleanId => {
            const override = overrides?.[cleanId];
            if (override && Object.prototype.hasOwnProperty.call(override, 'category')) {
                if (override.category === CATEGORY_UNASSIGNED || override.category !== category) return;
            }
            result[category].push(cleanId);
        });
    });

    Object.values(overrides || {}).forEach(override => {
        const cleanId = normalizeCleanId(override?.cleanId || override?.id || '');
        const category = override?.category;
        if (!cleanId || !category || category === CATEGORY_UNASSIGNED || archived.has(category)) return;
        if (!result[category]) result[category] = [];
        result[category].push(cleanId);
    });

    Object.keys(result).forEach(category => {
        result[category] = [...new Set(result[category])];
    });
    return result;
};

const buildCategoryLookup = (categories) => {
    const map = {};
    Object.entries(categories || {}).forEach(([category, ids]) => {
        (ids || []).forEach(cleanId => { map[cleanId] = category; });
    });
    return map;
};

const categoryDocId = (name) => 'cat_' + toSafeDocId(normalizeText(name).replace(/\s+/g, '_'));

const saveProductCategory = async ({ cleanId, category, previousCategory, source = 'admin' }) => {
    const id = normalizeCleanId(cleanId);
    if (!id) throw new Error('INVALID_PRODUCT_ID');
    const nextCategory = category || CATEGORY_UNASSIGNED;
    if ((previousCategory || CATEGORY_UNASSIGNED) === nextCategory) return;

    const db = await getDb();
    const batch = db.batch();
    const overrideRef = db.collection(CATEGORY_COLLECTIONS.OVERRIDES).doc(id);
    const auditRef = db.collection(CATEGORY_COLLECTIONS.AUDIT).doc();

    batch.set(overrideRef, {
        cleanId: id,
        category: nextCategory,
        updatedBy: 'مهند',
        source,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    batch.set(auditRef, {
        action: 'move',
        cleanId: id,
        previousCategory: previousCategory || CATEGORY_UNASSIGNED,
        category: nextCategory,
        updatedBy: 'مهند',
        source,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    await batch.commit();
};

const bulkSaveProductCategory = async ({ items, category, currentCategoryById, source = 'bulk' }) => {
    const cleanIds = [...new Set((items || []).map(item => normalizeCleanId(item?.cleanId || item)).filter(Boolean))];
    if (!cleanIds.length) return 0;
    const db = await getDb();
    const nextCategory = category || CATEGORY_UNASSIGNED;

    // 180 منتجاً في الدفعة حتى نترك مساحة لسجل تدقيق لكل منتج تحت حد Firestore batch.
    for (let start = 0; start < cleanIds.length; start += 180) {
        const slice = cleanIds.slice(start, start + 180);
        const batch = db.batch();
        slice.forEach(id => {
            const previousCategory = currentCategoryById?.[id] || CATEGORY_UNASSIGNED;
            if (previousCategory === nextCategory) return;
            batch.set(db.collection(CATEGORY_COLLECTIONS.OVERRIDES).doc(id), {
                cleanId: id,
                category: nextCategory,
                updatedBy: 'مهند',
                source,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            batch.set(db.collection(CATEGORY_COLLECTIONS.AUDIT).doc(), {
                action: 'move',
                cleanId: id,
                previousCategory,
                category: nextCategory,
                updatedBy: 'مهند',
                source,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await batch.commit();
    }
    return cleanIds.length;
};

const runSearch = (activeDb, rawQuery, hideOutOfStock) => {
    const cleanQuery = normalizeCleanId(rawQuery);
    const textQuery  = normalizeText(rawQuery);
    const nameTokens = textQuery.length >= MIN_NAME_QUERY_LENGTH ? textQuery.split(' ').filter(Boolean) : [];

    if (!cleanQuery && nameTokens.length === 0) return { visible: [], total: 0, exact: null };

    const ranked = [];
    for (let i = 0; i < activeDb.length; i++) {
        const item = activeDb[i];
        if (hideOutOfStock && item.qty <= 0) continue;

        let rank = -1;
        if (cleanQuery && item.cleanId.startsWith(cleanQuery)) {
            rank = item.cleanId === cleanQuery ? 0 : 1;
        } else if (nameTokens.length && item.searchName) {
            let all = true;
            for (let t = 0; t < nameTokens.length; t++) {
                if (!item.searchName.includes(nameTokens[t])) { all = false; break; }
            }
            if (all) rank = item.searchName.startsWith(nameTokens[0]) ? 2 : 3;
        }
        if (rank !== -1) ranked.push({ item, rank });
    }

    ranked.sort((a, b) => a.rank - b.rank);

    const sku = [], nm = [];
    for (let i = 0; i < ranked.length; i++) {
        const r = ranked[i];
        if (r.rank <= 1) { if (sku.length < MAX_SKU_RESULTS) sku.push(r.item); }
        else             { if (nm.length  < MAX_NAME_RESULTS) nm.push(r.item);  }
    }
    return { visible: sku.concat(nm), total: ranked.length, exact: ranked.length && ranked[0].rank === 0 ? ranked[0].item : null };
};

const stockTone = (qty) => {
    if (qty <= 0) return { text:'text-danger',  bg:'bg-dangerSoft'  };
    if (qty <= LOW_STOCK_THRESHOLD) return { text:'text-warn', bg:'bg-warnSoft' };
    return { text:'text-success', bg:'bg-successSoft' };
};

const formatTimeSpent = (minutes) => {
    if (!minutes) return 'لم يسجل';
    if (minutes < 60) return `${minutes} دقيقة`;
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h} ساعة${m > 0 ? ` و ${m} دقيقة` : ''}`;
};

        <div className="flex flex-col items-start">
            <div className="flex items-baseline gap-4">
                <span className={`${size === 'lg' ? 'text-[26px]' : 'text-[20px]'} font-bold leading-none ${tone.text}`}>
                    {NUMBER_FORMATTER.format(qty)}
                </span>
                {unit && <span className="text-[13px] text-muted">{unit}</span>}
            </div>
            {qty <= LOW_STOCK_THRESHOLD && (
                <span className={`text-[12px] mt-4 ${tone.text}`}>

        </div>
    );
};

const OrderQuantityControl = memo(({ item, cart, setCart }) => {
    const cartQty = cart[item.cleanId]?.cartQty || 0;
    const maxQty = item.qty || 0; 
    
    const [isEditing, setIsEditing] = useState(false);
    const [editVal, setEditVal] = useState(cartQty.toString());

    const updateQty = (newQty) => {
        let val = Math.max(0, parseFloat(newQty) || 0);
        
        if (val > maxQty) {
            alert(`الكمية المتوفرة في المخزون هي ${maxQty} فقط.`);
            val = maxQty;
        }

        setCart(prev => {
            const next = { ...prev };
            if (val === 0) delete next[item.cleanId];
            else next[item.cleanId] = { ...item, cartQty: val };
            return next;
        });
    };

    const handleSaveEdit = () => { setIsEditing(false); updateQty(editVal); };

    if (cartQty === 0) {
        return (
            <button onClick={(e) => { e.stopPropagation(); updateQty(1); }}
                    className="flex items-center gap-6 px-12 h-32 rounded-8 bg-surface border border-border text-primary text-[12px] font-semibold hover:border-accent hover:text-accent transition-colors">
                <Icon.Cart className="w-14 h-14" /> إضافة للفاتورة
            </button>
        );
    }

    return (
        <div className="flex items-center bg-surface border border-accent rounded-8 overflow-hidden h-32" onClick={e => e.stopPropagation()}>
            <button onClick={() => updateQty(cartQty - 1)} className="w-32 h-full flex items-center justify-center text-primary hover:bg-border transition-colors">-</button>
            
            {isEditing ? (
                <input type="number" step="0.25" min="0" max={maxQty} autoFocus value={editVal}
                       onChange={e => setEditVal(e.target.value)}
                       onBlur={handleSaveEdit}
                       onKeyDown={e => { if(e.key === 'Enter') handleSaveEdit(); }}
                       className="w-48 h-full text-center text-[13px] font-bold text-accent bg-bg outline-none border-x border-accent appearance-none" />
            ) : (
                <div onClick={() => { setEditVal(cartQty.toString()); setIsEditing(true); }}
                     className="w-48 h-full flex items-center justify-center text-[13px] font-bold text-accent bg-bg border-x border-accent cursor-text"
                     title="اضغط لتعديل الكمية يدوياً (الكسور مدعومة)">
                    {cartQty}
                </div>
            )}
            
            <button onClick={() => updateQty(cartQty + 1)} className="w-32 h-full flex items-center justify-center text-primary hover:bg-border transition-colors">+</button>
        </div>
    );
});

const OrderInvoiceModal = memo(({ cart, setCart, drafts, setDrafts, onClose, sessionName, warehouse }) => {
    const [customer, setCustomer] = useState("");
    const [notes, setNotes] = useState(""); 
    const items = Object.values(cart);
    const totalAmount = items.reduce((sum, item) => sum + ((item.price || 0) * item.cartQty), 0);

    const handleSubmit = () => {
        if (!customer.trim()) return alert("يجب كتابة اسم العميل أولاً لتسجيل الفاتورة.");
        
        const gregorianDate = new Date().toLocaleDateString('en-GB');

        let msg = `*طلب مبيعات جديد*\n`;
        msg += `════════════════\n`;
        msg += `المندوب: ${sessionName}\n`;
        msg += `العميل: ${customer.trim()}\n`;
        msg += `المستودع: ${WAREHOUSES[warehouse]?.name || warehouse}\n`;
        msg += `التاريخ: ${gregorianDate}\n`;
        if (notes.trim()) msg += `الملاحظات: ${notes.trim()}\n`;
        msg += `════════════════\n\n`;

        items.forEach((it, idx) => {
            msg += `${idx + 1}. *[ ${it.id} ]*\n`;
            msg += `   الكمية: *${it.cartQty}* | الإجمالي: *${NUMBER_FORMATTER.format((it.price || 0) * it.cartQty)}* ر.س\n`;
            if (idx < items.length - 1) msg += `  ╌╌╌╌╌╌╌╌╌╌╌╌\n`;
        });

        msg += `\n════════════════\n`;
        msg += `*الإجمالي النهائي: ${NUMBER_FORMATTER.format(totalAmount)} ر.س*\n`;

        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');

        const newOrder = {
            id: Date.now(),
            date: gregorianDate,
            customer: customer.trim(),
            warehouse: warehouse,
            totalAmount: totalAmount,
            msg: msg 
        };
        const historyKey = `b2b_history_${sessionName}`;
        const existingHistory = JSON.parse(localStorage.getItem(historyKey)) || [];
        localStorage.setItem(historyKey, JSON.stringify([newOrder, ...existingHistory]));

        getDb().then(db => {
            db.collection('orders').add({
                repName: sessionName, customerName: customer.trim(), warehouse: warehouse, notes: notes.trim(), 
                items: items.map(i => ({ cleanId: i.cleanId, id: i.id, name: i.name, qty: i.cartQty, price: i.price, total: i.price * i.cartQty })),

const getProductImageUrl = (fileName) => new URL(`${IMAGES_PATH}${fileName}`, window.location.href).href;

const copyTextSafe = async (value) => {
    try {
        await navigator.clipboard.writeText(value);
        return true;
    } catch (e) {
        try {
            const ta = document.createElement('textarea');
            ta.value = value;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            return ok;
        } catch (_) {
            return false;
        }
    }
};

const ProductImage = ({ fileName, alt, className }) => {
    const [showActions, setShowActions] = useState(false);
    const [preparedFile, setPreparedFile] = useState(null);
    const holdTimerRef = useRef(null);
    const suppressClickRef = useRef(false);

    if (!fileName) return null;

    const imageUrl = getProductImageUrl(fileName);

    const prepareShareFile = async () => {
        try {
            const response = await fetch(imageUrl, { cache: 'force-cache' });
            if (!response.ok) return null;
            const blob = await response.blob();
            const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });
            setPreparedFile(file);
            return file;
        } catch (e) {
            return null;
        }
    };

    const openActions = () => {
        suppressClickRef.current = true;
        setShowActions(true);
        if (!preparedFile) prepareShareFile();
        try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
    };

    const clearHold = () => {
        if (holdTimerRef.current) {
            clearTimeout(holdTimerRef.current);
            holdTimerRef.current = null;
        }
    };

    const startHold = () => {
        clearHold();
        suppressClickRef.current = false;
        holdTimerRef.current = setTimeout(openActions, 520);
    };

    const handleClick = (e) => {
        if (suppressClickRef.current) {
            e.preventDefault();
            e.stopPropagation();
            suppressClickRef.current = false;
        }
    };

    const handleDownload = async () => {
        try {
            const response = await fetch(imageUrl, { cache: 'force-cache' });
            if (!response.ok) throw new Error('download failed');
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'product-image.jpg';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        } catch (e) {
            window.open(imageUrl, '_blank', 'noopener,noreferrer');
        } finally {
            setShowActions(false);
        }
    };

    const handleShare = async () => {
        try {
            let file = preparedFile;
            if (!file) file = await prepareShareFile();

            if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: alt || 'صورة المنتج' });
            } else if (navigator.share) {
                await navigator.share({ title: alt || 'صورة المنتج', url: imageUrl });
            } else {
                const copied = await copyTextSafe(imageUrl);
                alert(copied ? 'تم نسخ رابط الصورة.' : 'المشاركة غير مدعومة على هذا الجهاز.');
            }
        } catch (e) {
            if (e && e.name !== 'AbortError') console.warn('[Image Share]', e);
        } finally {
            setShowActions(false);
        }
    };

    return (
        <React.Fragment>
            <img
                src={imageUrl}
                alt={alt}
                loading="lazy"
                decoding="async"
                draggable="false"
                className={className}
                style={{ WebkitTouchCallout: 'none', userSelect: 'none' }}
                onPointerDown={startHold}
                onPointerUp={clearHold}
                onPointerCancel={clearHold}
                onPointerLeave={clearHold}
                onContextMenu={(e) => { e.preventDefault(); clearHold(); openActions(); }}
                onClick={handleClick}
                onError={(e) => { e.currentTarget.style.visibility = 'hidden'; }}
            />

            {showActions && (
                <div
                    className="fixed inset-0 z-[300] bg-black/50 flex items-end sm:items-center justify-center animate-card"
                    onClick={(e) => { e.stopPropagation(); setShowActions(false); }}
                >
                    <div
                        className="w-full max-w-[390px] bg-bg rounded-t-20 sm:rounded-20 p-12 shadow-lift border border-border"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-8 pb-10 border-b border-border">
                            <p className="text-[13px] font-bold text-primary">خيارات الصورة</p>
                            <p className="text-[11px] text-muted mt-2 truncate">{alt || fileName}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-8 pt-12">
                            <button onClick={handleDownload} className="h-44 rounded-10 bg-surface border border-border text-primary font-semibold text-[13px] hover:border-accent transition-colors">
                                حفظ الصورة
                            </button>
                            <button onClick={handleShare} className="h-44 rounded-10 bg-primary text-bg font-semibold text-[13px] hover:bg-accent transition-colors">
                                مشاركة الصورة
                            </button>
                        </div>
                        <button onClick={() => setShowActions(false)} className="w-full h-40 mt-8 text-[12px] text-muted hover:text-primary">إلغاء</button>
                    </div>
                </div>
            )}
        </React.Fragment>
    );
};

const Lightbox = ({ fileName, title, onClose }) => {
    useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
    }, [onClose]);

    return (
        <div className="lightbox-backdrop fixed inset-0 z-50 flex items-center justify-center p-16 animate-flip"
             role="dialog" aria-modal="true" aria-label={title} onClick={onClose}>

// ✨ نافذة الدخول بالتحقق الحيوي (Face ID) وتحديد الموقع (GPS) بالهوية البصرية الأصلية
const LoginScreen = ({ onLogin, initialName = '' }) => {
    const [name, setName] = useState(initialName);
    const [step, setStep] = useState('name'); 
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    
    const [code, setCode] = useState('');
    const codeRef = useRef(null);
    
    const videoRef = useRef(null);
    const canvasRef = useRef(null);
    const [stream, setStream] = useState(null);
    const [requestId, setRequestId] = useState(null);

    useEffect(() => { if (step === 'password' && codeRef.current) codeRef.current.focus(); }, [step]);

    const handleNameSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) return;

        setError('');
        
        if (isProtectedName(trimmed)) {
            setStep('password');
            return;
        }

        setStep('scan');
        startCamera();
    };

    const handleAdminSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!verifyCode(trimmed, code)) { setError('رمز الدخول غير صحيح.'); return; }
        
        setLoading(true);
        try {
            const db = await getDb();
            const userRef = db.collection('users').doc(toSafeDocId(trimmed));
            const doc = await userRef.get();
            const info = { userAgent: navigator.userAgent, lastLogin: firebase.firestore.FieldValue.serverTimestamp() };
            if (doc.exists) await userRef.update({ ...info, loginCount: firebase.firestore.FieldValue.increment(1) });
            else await userRef.set({ name: trimmed, ...info, loginCount: 1, firstJoined: firebase.firestore.FieldValue.serverTimestamp(), timeSpentMinutes: 0 });
            
            await db.collection('login_logs').add({ name: trimmed, isAdmin: true, time: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent });
        } catch (err) {}

        localStorage.setItem(STORAGE_KEYS.NAME, trimmed);
        localStorage.setItem(STORAGE_KEYS.TOKEN, hashCode(toEnglishDigits(String(code)).trim()));
        setLoading(false);
        onLogin(trimmed, true);
    };

    const startCamera = async () => {
        try {
            const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            setStream(mediaStream);
            if (videoRef.current) {
                videoRef.current.srcObject = mediaStream;
            }
        } catch (err) {
            setError('تعذر الوصول للكاميرا. يرجى إعطاء الصلاحية للمتصفح للمتابعة.');
            setStep('name');
        }
    };

    const stopCamera = useCallback(() => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            setStream(null);
        }
    }, [stream]);

    const captureAndRequest = async () => {
        if (!videoRef.current) return;
        setLoading(true);
        setError('');

        try {
            const canvas = canvasRef.current;
            const context = canvas.getContext('2d');
            const sourceW = videoRef.current.videoWidth || 640;
            const sourceH = videoRef.current.videoHeight || 480;
            const maxW = 640;
            const scale = Math.min(1, maxW / sourceW);
            canvas.width = Math.max(1, Math.round(sourceW * scale));
            canvas.height = Math.max(1, Math.round(sourceH * scale));
            context.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
            // حجم مضبوط ليبقى أرشيف الصور عملياً داخل Firestore.
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.68); 
            
            stopCamera();

            let lat = null, lng = null;
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
                });
                lat = pos.coords.latitude;
                lng = pos.coords.longitude;
            } catch (gpsErr) {
                console.warn("GPS Denied or Timeout");
            }

            const db = await getDb();
            const docRef = await db.collection('access_requests').add({
                name: name.trim(),
                photoDataUrl,
                latitude: lat,
                longitude: lng,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userAgent: navigator.userAgent
            });

            setRequestId(docRef.id);
            setStep('wait');
            setLoading(false);

        } catch (err) {
            console.error(err);
            setError('حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.');
            setLoading(false);
            setStep('name');
        }
    };

    useEffect(() => {
        if (step === 'wait' && requestId) {

                            if (userDoc.exists) await userRef.update({ ...info, loginCount: firebase.firestore.FieldValue.increment(1) });
                            else await userRef.set({ name: trimmed, ...info, loginCount: 1, firstJoined: firebase.firestore.FieldValue.serverTimestamp(), timeSpentMinutes: 0 });
                            
                            await db.collection('login_logs').add({ name: trimmed, isAdmin: false, time: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent });
                            
                            localStorage.setItem(STORAGE_KEYS.NAME, trimmed);
                            localStorage.removeItem(STORAGE_KEYS.TOKEN);
                            // تصريح أمني لهذا الجهاز/المستخدم بعد موافقة المشرف.
                            localStorage.setItem(STORAGE_KEYS.ACCESS_GATE_VERSION, ACCESS_GATE_VERSION);
                            localStorage.setItem(STORAGE_KEYS.ACCESS_APPROVED_NAME, normalizeText(trimmed));
                            onLogin(trimmed, false);
                        } else if (data.status === 'rejected') {
                            setStep('rejected');
                        }
                    }
                });
            });
            return () => { if (unsubscribe) unsubscribe(); };
        }
    }, [step, requestId, name, onLogin]);

    useEffect(() => {
        return () => stopCamera();
    }, [stopCamera]);

    return (
        <div className="min-h-screen bg-surface flex items-center justify-center p-16 font-sans">
            <div className="animate-card w-full max-w-[380px] bg-bg border border-border rounded-20 shadow-lift p-24 sm:p-32 flex flex-col items-center">
                
                <div className="text-center mb-24 w-full">
                    <div className="flex items-center justify-center gap-8 mb-4">
                        <h1 className="text-[22px] font-bold text-primary leading-tight">مخزون شركة بيت الأواني الطيبة</h1>
                    </div>
                    <p className="text-[13px] text-secondary mt-2">البوابة الأمنية </p>
                </div>

                {step === 'name' && (
                    <form onSubmit={handleNameSubmit} className="flex flex-col gap-16 w-full">
                        <div>
                            <label htmlFor="employeeName" className="text-[13px] font-medium text-primary mb-8 block text-center">أدخل الإسم الكريم للمطابقة</label>
                            <input id="employeeName" type="text" required autoComplete="name" value={name}
                                   onChange={(e) => { setName(e.target.value); setError(''); }} placeholder="اكتب اسمك هنا..."
                                   className="w-full h-48 px-16 rounded-12 border border-border bg-bg focus:border-accent text-primary outline-none transition-colors text-center font-bold" />
                        </div>
                        {error  && <p className="text-[13px] text-danger flex items-center justify-center gap-6"><Icon.Alert className="w-14 h-14 flex-shrink-0" />{error}</p>}
                        <button type="submit" className="w-full h-48 bg-primary text-bg rounded-12 font-semibold text-[15px] hover:opacity-90 transition-opacity flex items-center justify-center gap-8 mt-4">
                            المتابعة <Icon.Shield className="w-16 h-16" />

                    </form>

                {step === 'password' && (

                        <div>
                            <label htmlFor="accessCode" className="text-[13px] font-medium text-accent mb-8 flex items-center justify-center gap-6">
                                <Icon.Lock className="w-14 h-14 flex-shrink-0" /> بوابة الإدارة السرية
                            </label>
                            <input ref={codeRef} id="accessCode" type="password" inputMode="numeric" autoComplete="off" value={code}

                        </div>
                        {error  && <p className="text-[13px] text-danger flex items-center justify-center gap-6"><Icon.Alert className="w-14 h-14 flex-shrink-0" />{error}</p>}
                        <button type="submit" disabled={loading} className="w-full h-48 bg-accent text-white rounded-12 font-semibold text-[15px] hover:opacity-90 disabled:opacity-50 transition-opacity">

                        </button>
                        <button type="button" onClick={() => setStep('name')} className="text-[12px] text-muted hover:text-primary mt-4">العودة</button>
                    </form>
                )}

                {step === 'scan' && (
                    <div className="flex flex-col items-center gap-16 w-full animate-flip">

// ماسح الباركود للجوال — Ultra Fast 1D (iPhone + Android)

const BarcodeScannerModal = memo(({ onClose, onScan }) => {
    const [camError, setCamError] = useState("");
    const onScanRef = useRef(onScan);
    const scanLockedRef = useRef(false);

    // نحفظ أحدث callback بدون إعادة تشغيل الكاميرا عند كل Render للأب.
    useEffect(() => {
        onScanRef.current = onScan;
    }, [onScan]);

    useEffect(() => {
        let isMounted = true;
        let html5QrCode = null;

        const cleanup = async () => {
            if (!html5QrCode) return;
            try {
                if (html5QrCode.isScanning) await html5QrCode.stop();
            } catch (e) {}
            try { html5QrCode.clear(); } catch (e) {}
        };

        const start = async () => {
            try {
                if (!window.Html5Qrcode) throw new Error('html5-qrcode غير محمل');

                // مهم: لا نحصر صيغ الباركود.
                // هذه هي نفس فلسفة الماسح القديم المجرب عندكم: المكتبة تختبر كل الصيغ المدعومة تلقائياً.
                html5QrCode = new Html5Qrcode("reader");

                const config = {
                    // الإعداد المجرب سابقاً على جوالاتكم. رفع FPS أكثر كان يضغط فك الترميز بلا فائدة.
                    fps: 10,
                    // منطقة واسعة مثل النسخة القديمة؛ ممتازة للباركود الطويل أو المائل قليلاً.
                    qrbox: (viewfinderWidth, viewfinderHeight) => {
                        const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
                        return { width: size, height: size };
                    },
                    aspectRatio: 1,
                    disableFlip: true
                };

                const onScanSuccess = (decodedText) => {
                    if (!isMounted || scanLockedRef.current) return;
                    const value = String(decodedText || '').trim();
                    if (!value) return;

                    // أول قراءة فقط؛ نظهر النتيجة فوراً ثم يعتني unmount بإغلاق الكاميرا.
                    scanLockedRef.current = true;
                    try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
                    onScanRef.current(value);
                };

                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    () => {}
                );

                if (!isMounted) await cleanup();
            } catch (err) {
                console.error("خطأ الكاميرا:", err);
                if (!isMounted) return;
                let msg = "تعذر فتح الكاميرا. تأكد من إعطاء الصلاحية للمتصفح.";
                const raw = String(err?.message || err || '');
                if (!window.isSecureContext) msg = "الكاميرا تحتاج إلى تشغيل الموقع عبر HTTPS.";
                else if (/NotAllowed|Permission|denied/i.test(raw)) msg = "صلاحية الكاميرا مرفوضة. اسمح باستخدام الكاميرا ثم أعد المحاولة.";
                else if (/NotFound|DevicesNotFound/i.test(raw)) msg = "لم يتم العثور على كاميرا متاحة.";
                else if (/NotReadable|TrackStart/i.test(raw)) msg = "الكاميرا مستخدمة بواسطة تطبيق آخر. أغلقه ثم حاول مجدداً.";
                setCamError(msg);
            }
        };

        start();

        return () => {
            isMounted = false;
            scanLockedRef.current = true;
            cleanup();
        };
    }, []);

    return (
        <div className="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-16 animate-card">
            <div className="w-full max-w-[380px] bg-bg rounded-16 overflow-hidden shadow-lift flex flex-col">
                <div className="p-16 flex justify-between items-center border-b border-border bg-surface">
                    <h3 className="font-bold text-primary flex items-center gap-8">
                        <Icon.Scan className="w-20 h-20 text-accent"/> مسح الباركود التلقائي
                    </h3>
                    <button onClick={onClose} className="p-4 bg-bg rounded-8 border border-border" aria-label="إغلاق الماسح">
                        <Icon.Close className="w-16 h-16 text-secondary"/>
                    </button>
                </div>

                <div className="w-full bg-black min-h-[300px] relative flex items-center justify-center overflow-hidden">
                    {camError ? (
                        <div className="text-danger text-center p-24 text-[13px] font-medium leading-relaxed bg-bg m-16 rounded-12">
                            <Icon.Alert className="w-24 h-24 mx-auto mb-8 text-danger" />{camError}
                        </div>
                    ) : (
                        <React.Fragment>
                            <div id="reader" className="w-full h-full object-cover"></div>
                            <div className="absolute left-0 w-full h-[2px] bg-success shadow-[0_0_15px_3px_#15803D] animate-laser pointer-events-none z-10" style={{top: '50%'}}></div>
                        </React.Fragment>
                    )}
                </div>

                <div className="p-16 text-center text-[13px] font-medium text-primary bg-surface border-t border-border">
                    وجّه الكاميرا للباركود وسيتم التقاطه تلقائياً
                    <p className="text-[11px] text-muted font-normal mt-4">وضع التوافق العالي — يدعم جميع صيغ الباركود المتاحة</p>
                </div>
            </div>
        </div>
    );
});

const ProductClassificationManager = memo(({ catalogItems, imagesList, categories, currentCategoryById, categoryMeta }) => {
    const [mode, setMode] = useState('quick');
    const [scope, setScope] = useState('uncategorized');
    const [search, setSearch] = useState('');
    const [quickIndex, setQuickIndex] = useState(0);
    const [selected, setSelected] = useState(() => new Set());
    const [bulkCategory, setBulkCategory] = useState('');
    const [busy, setBusy] = useState(false);
    const [notice, setNotice] = useState('');
    const [newCategoryName, setNewCategoryName] = useState('');
    const [auditRows, setAuditRows] = useState([]);
    const [auditLoading, setAuditLoading] = useState(false);

    const categoryNames = useMemo(() => Object.keys(categories || {}).sort((a,b) => a.localeCompare(b, 'ar')), [categories]);
    const unclassifiedItems = useMemo(() => catalogItems.filter(item => !currentCategoryById[item.cleanId]), [catalogItems, currentCategoryById]);

    const scopedItems = useMemo(() => {
        let rows = scope === 'uncategorized'
            ? unclassifiedItems
            : scope === 'all'
                ? catalogItems
                : catalogItems.filter(item => currentCategoryById[item.cleanId] === scope);

        const qClean = normalizeCleanId(search);
        const qText = normalizeText(search);
        if (search.trim()) {
            rows = rows.filter(item =>
                (qClean && item.cleanId.includes(qClean)) ||
                (qText && (item.searchName || normalizeText(item.name)).includes(qText)) ||
                normalizeText(item.id).includes(qText)
            );
        }
        return rows;
    }, [scope, search, catalogItems, unclassifiedItems, currentCategoryById]);

    useEffect(() => {
        setQuickIndex(0);
        setSelected(new Set());
    }, [scope, search]);

    useEffect(() => {
        if (mode !== 'audit') return;
        let alive = true;
        setAuditLoading(true);
        getDb().then(db => db.collection(CATEGORY_COLLECTIONS.AUDIT).orderBy('timestamp','desc').limit(120).get())
            .then(snap => {
                if (!alive) return;
                setAuditRows(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            })
            .catch(err => console.warn('[Category Audit]', err))
            .finally(() => { if (alive) setAuditLoading(false); });
        return () => { alive = false; };
    }, [mode]);

    const flash = (text) => {
        setNotice(text);
        setTimeout(() => setNotice(''), 1800);
    };

    const chooseCategory = async (item, category) => {
        if (!item || busy) return;
        const previousCategory = currentCategoryById[item.cleanId] || CATEGORY_UNASSIGNED;
        if (previousCategory === category) {
            if (mode === 'quick') setQuickIndex(i => Math.min(i + 1, Math.max(0, scopedItems.length - 1)));
            return;
        }
        setBusy(true);
        try {
            await saveProductCategory({ cleanId: item.cleanId, category, previousCategory, source: mode === 'quick' ? 'quick-classifier' : 'catalog-manager' });
            flash('تم حفظ القسم ومزامنته مع جميع الأجهزة ✓');
            if (mode === 'quick') {
                const nextCategory = category === CATEGORY_UNASSIGNED ? null : category;
                const remainsInScope = scope === 'all' || (scope === 'uncategorized' && !nextCategory) || (scope !== 'uncategorized' && scope !== 'all' && scope === nextCategory);
                if (remainsInScope) setQuickIndex(i => Math.min(i + 1, Math.max(0, scopedItems.length - 1)));
                // إذا خرج المنتج من الفلتر الحالي، يبقى المؤشر في مكانه لأن المنتج التالي سيحل محله تلقائياً.
            }
        } catch (err) {
            console.error('[Category Save]', err);
            alert('تعذر حفظ التصنيف. تحقق من الاتصال وحاول مرة أخرى.');
        } finally { setBusy(false); }
    };

    const applyBulk = async () => {
        if (!selected.size || !bulkCategory || busy) return;
        const rows = catalogItems.filter(item => selected.has(item.cleanId));
        if (!window.confirm(`نقل ${rows.length} صنف إلى ${bulkCategory === CATEGORY_UNASSIGNED ? 'غير مصنف' : bulkCategory}؟`)) return;
        setBusy(true);
        try {
            await bulkSaveProductCategory({ items: rows, category: bulkCategory, currentCategoryById, source: 'bulk-manager' });
            setSelected(new Set());
            flash(`تم تحديث ${rows.length} صنف ✓`);
        } catch (err) {
            console.error('[Bulk Category]', err);
            alert('تعذر تنفيذ النقل الجماعي.');
        } finally { setBusy(false); }
    };

    const createCategory = async () => {
        const name = newCategoryName.trim();
        if (!name) return;
        if ([SPECIAL_CATEGORIES.UNCATEGORIZED, SPECIAL_CATEGORIES.MISSING_IMAGES].includes(name)) return alert('هذا الاسم محجوز للنظام.');
        if (categoryNames.some(c => normalizeText(c) === normalizeText(name))) return alert('القسم موجود مسبقاً.');
        setBusy(true);
        try {
            const db = await getDb();
            await db.collection(CATEGORY_COLLECTIONS.META).doc(categoryDocId(name)).set({
                name, archived: false, createdBy: 'مهند', updatedBy: 'مهند',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            await db.collection(CATEGORY_COLLECTIONS.AUDIT).add({ action:'create-category', category:name, updatedBy:'مهند', timestamp:firebase.firestore.FieldValue.serverTimestamp() });
            setNewCategoryName('');
            flash('تم إنشاء القسم ✓');
        } catch (err) { console.error(err); alert('تعذر إنشاء القسم.'); }
        finally { setBusy(false); }
    };

    const renameCategory = async (oldName) => {
        const nextName = window.prompt(`الاسم الجديد لقسم "${oldName}"`, oldName);
        if (!nextName || nextName.trim() === oldName) return;
        const name = nextName.trim();
        if (categoryNames.some(c => c !== oldName && normalizeText(c) === normalizeText(name))) return alert('يوجد قسم بهذا الاسم مسبقاً.');
        const affected = catalogItems.filter(item => currentCategoryById[item.cleanId] === oldName);
        if (!window.confirm(`سيتم تغيير اسم القسم ونقل ${affected.length} صنف إلى "${name}". متابعة؟`)) return;
        setBusy(true);
        try {
            const db = await getDb();
            await bulkSaveProductCategory({ items: affected, category:name, currentCategoryById, source:'rename-category' });
            const batch = db.batch();
            batch.set(db.collection(CATEGORY_COLLECTIONS.META).doc(categoryDocId(oldName)), { name:oldName, archived:true, renamedTo:name, updatedBy:'مهند', updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
            batch.set(db.collection(CATEGORY_COLLECTIONS.META).doc(categoryDocId(name)), { name, archived:false, updatedBy:'مهند', updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
            batch.set(db.collection(CATEGORY_COLLECTIONS.AUDIT).doc(), { action:'rename-category', previousCategory:oldName, category:name, affectedCount:affected.length, updatedBy:'مهند', timestamp:firebase.firestore.FieldValue.serverTimestamp() });
            await batch.commit();
            if (scope === oldName) setScope(name);
            flash('تم تغيير اسم القسم ✓');
        } catch (err) { console.error(err); alert('تعذر تغيير اسم القسم.'); }
        finally { setBusy(false); }
    };

    const deleteCategory = async (category) => {
        const affected = catalogItems.filter(item => currentCategoryById[item.cleanId] === category);
        if (!window.confirm(`حذف قسم "${category}"؟ سيتم نقل ${affected.length} صنف إلى "غير مصنف" ولن تُحذف المنتجات.`)) return;
        setBusy(true);
        try {
            await bulkSaveProductCategory({ items: affected, category:CATEGORY_UNASSIGNED, currentCategoryById, source:'delete-category' });
            const db = await getDb();
            const batch = db.batch();
            batch.set(db.collection(CATEGORY_COLLECTIONS.META).doc(categoryDocId(category)), { name:category, archived:true, renamedTo:null, updatedBy:'مهند', updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
            batch.set(db.collection(CATEGORY_COLLECTIONS.AUDIT).doc(), { action:'delete-category', previousCategory:category, affectedCount:affected.length, updatedBy:'مهند', timestamp:firebase.firestore.FieldValue.serverTimestamp() });
            await batch.commit();
            if (scope === category) setScope('uncategorized');
            flash('تم حذف القسم ونقل منتجاته لغير مصنف ✓');
        } catch (err) { console.error(err); alert('تعذر حذف القسم.'); }
        finally { setBusy(false); }
    };

    const undoAudit = async (row) => {
        if (row.action !== 'move' || !row.cleanId) return;
        if (!window.confirm('التراجع عن هذا التعديل وإعادة المنتج لقسمه السابق؟')) return;
        setBusy(true);
        try {
            await saveProductCategory({
                cleanId: row.cleanId,
                category: row.previousCategory || CATEGORY_UNASSIGNED,
                previousCategory: currentCategoryById[row.cleanId] || CATEGORY_UNASSIGNED,
                source: 'audit-undo'
            });
            flash('تم التراجع عن التعديل ✓');
        } catch (err) { alert('تعذر التراجع عن التعديل.'); }
        finally { setBusy(false); }
    };

    const quickItem = scopedItems.length ? scopedItems[Math.min(quickIndex, scopedItems.length - 1)] : null;
    const countFor = category => catalogItems.reduce((n,item) => n + (currentCategoryById[item.cleanId] === category ? 1 : 0), 0);

    const CategoryChoices = ({ item, compact = false }) => (
        <div className={`flex flex-wrap ${compact ? 'gap-6' : 'gap-8'}`}>
            {categoryNames.map(category => {
                const active = currentCategoryById[item.cleanId] === category;
                return <button key={category} disabled={busy} onClick={() => chooseCategory(item, category)}
                    className={`${compact ? 'px-10 h-32 text-[11px]' : 'px-14 h-38 text-[12px]'} rounded-full border font-semibold transition-colors disabled:opacity-50 ${active ? 'bg-accent text-white border-accent' : 'bg-bg border-border text-primary hover:border-accent'}`}>{category}</button>;
            })}
            <button disabled={busy} onClick={() => chooseCategory(item, CATEGORY_UNASSIGNED)}
                className={`${compact ? 'px-10 h-32 text-[11px]' : 'px-14 h-38 text-[12px]'} rounded-full border font-semibold transition-colors disabled:opacity-50 ${!currentCategoryById[item.cleanId] ? 'bg-primary text-white border-primary' : 'bg-bg border-border text-secondary'}`}>غير مصنف</button>
        </div>
    );

    return (
        <div className="flex flex-col gap-16">
            {notice && <div className="sticky top-0 z-20 bg-success text-white text-[12px] font-bold px-14 py-10 rounded-10 shadow-card text-center animate-card">{notice}</div>}

            <div className="grid grid-cols-3 gap-8">
                <div className="bg-bg border border-border rounded-12 p-12"><p className="text-[10px] text-muted">كل المنتجات</p><p className="text-[18px] font-bold text-primary numeric mt-2">{NUMBER_FORMATTER.format(catalogItems.length)}</p></div>
                <div className="bg-bg border border-border rounded-12 p-12"><p className="text-[10px] text-muted">غير مصنف</p><p className="text-[18px] font-bold text-warn numeric mt-2">{NUMBER_FORMATTER.format(unclassifiedItems.length)}</p></div>
                <div className="bg-bg border border-border rounded-12 p-12"><p className="text-[10px] text-muted">الأقسام</p><p className="text-[18px] font-bold text-accent numeric mt-2">{NUMBER_FORMATTER.format(categoryNames.length)}</p></div>
            </div>

            <div className="flex overflow-x-auto no-scrollbar gap-6 pb-2">
                {[['quick','تصنيف سريع'],['browse','كل المنتجات'],['manage','إدارة الأقسام'],['audit','سجل التعديلات']].map(([id,label]) => (
                    <button key={id} onClick={() => setMode(id)} className={`h-36 px-12 rounded-full whitespace-nowrap border text-[11px] font-bold ${mode===id?'bg-primary text-white border-primary':'bg-bg text-secondary border-border'}`}>{label}</button>
                ))}
            </div>

            {(mode === 'quick' || mode === 'browse') && (
                <div className="bg-bg border border-border rounded-12 p-12 flex flex-col gap-10">
                    <div className="relative">
                        <Icon.Search className="w-16 h-16 absolute right-12 top-1/2 -translate-y-1/2 text-muted" />
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="ابحث برقم الصنف أو الاسم..." className="w-full h-40 pr-36 pl-12 rounded-8 border border-border bg-surface outline-none focus:border-accent text-[12px]" />
                    </div>
                    <select value={scope} onChange={e=>setScope(e.target.value)} className="w-full h-40 px-12 rounded-8 border border-border bg-bg text-[12px] outline-none focus:border-accent">
                        <option value="uncategorized">غير المصنف ({unclassifiedItems.length})</option>
                        <option value="all">كل المنتجات ({catalogItems.length})</option>
                        {categoryNames.map(cat=><option key={cat} value={cat}>{cat} ({countFor(cat)})</option>)}
                    </select>
                </div>
            )}

            {mode === 'quick' && (
                !quickItem ? <StateBlock icon={<Icon.CheckCircle className="w-20 h-20"/>} title="لا توجد منتجات في هذه القائمة" note={scope==='uncategorized'?'ممتاز — جميع المنتجات الحالية مصنفة.':'غيّر نطاق العرض أو البحث.'}/>
                : <div className="bg-bg border border-border rounded-16 overflow-hidden shadow-card">
                    <div className="bg-surface border-b border-border p-10 flex justify-between items-center gap-8">
                        <span className="text-[11px] font-bold text-accent">التصنيف السريع</span>
                        <span className="text-[10px] text-muted numeric">{Math.min(quickIndex+1, scopedItems.length)} / {scopedItems.length}</span>
                    </div>
                    <div className="p-16 flex flex-col gap-16">
                        <div className="w-full max-w-[320px] mx-auto aspect-square rounded-12 border border-border bg-surface overflow-hidden flex items-center justify-center">
                            {imagesList.has(quickItem.cleanId) ? <ProductImage fileName={imagesList.get(quickItem.cleanId)} alt={quickItem.name || quickItem.id} className="w-full h-full object-contain"/> : <div className="text-muted text-center"><Icon.ImageOff className="w-28 h-28 mx-auto mb-6"/><span className="text-[11px]">لا توجد صورة</span></div>}
                        </div>
                        <div>
                            <div className="flex justify-between gap-12 items-start">
                                <div className="min-w-0"><p className="text-[10px] text-muted">رقم الصنف</p><p className="text-[17px] font-bold text-primary bidi-isolate">{quickItem.id}</p></div>
                                <span className="text-[10px] bg-surface border border-border rounded-full px-8 py-4 text-secondary whitespace-nowrap">{currentCategoryById[quickItem.cleanId] || 'غير مصنف'}</span>
                            </div>
                            <p className="text-[13px] text-secondary mt-6 leading-relaxed">{quickItem.name || '---'}</p>
                        </div>
                        <div><p className="text-[11px] text-muted mb-8">اختر القسم — الحفظ فوري ثم ينتقل للمنتج التالي:</p><CategoryChoices item={quickItem}/></div>
                        <div className="grid grid-cols-3 gap-8 border-t border-border pt-12">
                            <button disabled={quickIndex<=0} onClick={()=>setQuickIndex(i=>Math.max(0,i-1))} className="h-38 rounded-8 border border-border text-[11px] disabled:opacity-30">السابق</button>
                            <button onClick={()=>setQuickIndex(i=>Math.min(scopedItems.length-1,i+1))} className="h-38 rounded-8 border border-border text-[11px]">تخطي</button>
                            <button onClick={()=>{setSearch('');setScope('uncategorized');setQuickIndex(0);}} className="h-38 rounded-8 bg-surface border border-border text-[11px]">غير المصنف</button>
                        </div>
                    </div>
                </div>
            )}

            {mode === 'browse' && (
                <div className="flex flex-col gap-12">
                    {selected.size > 0 && <div className="sticky top-0 z-10 bg-primary text-white rounded-12 p-10 flex flex-col sm:flex-row gap-8 items-stretch sm:items-center shadow-lift">
                        <span className="text-[11px] font-bold whitespace-nowrap">محدد: {selected.size}</span>
                        <select value={bulkCategory} onChange={e=>setBulkCategory(e.target.value)} className="h-36 flex-1 rounded-8 bg-white text-primary px-10 text-[11px]"><option value="">اختر القسم للنقل...</option>{categoryNames.map(cat=><option key={cat} value={cat}>{cat}</option>)}<option value={CATEGORY_UNASSIGNED}>غير مصنف</option></select>
                        <button disabled={!bulkCategory||busy} onClick={applyBulk} className="h-36 px-12 rounded-8 bg-accent text-white text-[11px] font-bold disabled:opacity-50">نقل المحدد</button>
                        <button onClick={()=>setSelected(new Set())} className="h-36 px-10 rounded-8 border border-white/30 text-[11px]">إلغاء</button>
                    </div>}

                    <div className="flex justify-between items-center gap-8">
                        <p className="text-[11px] text-muted">النتائج: <span className="numeric">{scopedItems.length}</span></p>
                        {scopedItems.length>0 && <button onClick={()=>setSelected(new Set(scopedItems.slice(0,200).map(i=>i.cleanId)))} className="text-[11px] text-accent font-bold">تحديد أول {Math.min(200,scopedItems.length)}</button>}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                        {scopedItems.slice(0,300).map(item => {
                            const checked=selected.has(item.cleanId);
                            return <div key={item.cleanId} className={`bg-bg border rounded-12 p-10 flex gap-10 ${checked?'border-accent ring-1 ring-accent/20':'border-border'}`}>
                                <button onClick={()=>setSelected(prev=>{const n=new Set(prev);checked?n.delete(item.cleanId):n.add(item.cleanId);return n;})} className={`w-24 h-24 rounded-6 border flex-shrink-0 flex items-center justify-center text-[12px] font-bold ${checked?'bg-accent text-white border-accent':'border-border bg-surface'}`}>{checked?'✓':''}</button>
                                <div className="w-72 h-72 rounded-10 border border-border bg-surface overflow-hidden flex-shrink-0 flex items-center justify-center">{imagesList.has(item.cleanId)?<ProductImage fileName={imagesList.get(item.cleanId)} alt={item.name||item.id} className="w-full h-full object-contain"/>:<Icon.ImageOff className="w-20 h-20 text-muted"/>}</div>
                                <div className="min-w-0 flex-1"><p className="font-bold text-[13px] bidi-isolate truncate">{item.id}</p><p className="text-[11px] text-secondary truncate mt-2">{item.name||'---'}</p><p className="text-[10px] text-muted mt-6 mb-6">الحالي: <b className="text-primary">{currentCategoryById[item.cleanId]||'غير مصنف'}</b></p><select disabled={busy} value={currentCategoryById[item.cleanId]||CATEGORY_UNASSIGNED} onChange={e=>chooseCategory(item,e.target.value)} className="w-full h-32 px-8 rounded-8 border border-border bg-surface text-[10px] outline-none focus:border-accent"><option value={CATEGORY_UNASSIGNED}>غير مصنف</option>{categoryNames.map(cat=><option key={cat} value={cat}>{cat}</option>)}</select></div>
                            </div>;
                        })}
                    </div>
                    {scopedItems.length>300 && <p className="text-[11px] text-muted text-center">للسرعة يعرض المدير أول 300 نتيجة. استخدم البحث أو فلتر القسم للوصول للبقية.</p>}
                </div>
            )}

            {mode === 'manage' && (
                <div className="flex flex-col gap-12">
                    <div className="bg-bg border border-border rounded-12 p-12">
                        <p className="text-[12px] font-bold mb-8">إنشاء قسم جديد</p>
                        <div className="flex gap-8"><input value={newCategoryName} onChange={e=>setNewCategoryName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')createCategory();}} placeholder="اسم القسم الجديد..." className="h-40 flex-1 px-12 rounded-8 border border-border bg-surface outline-none focus:border-accent text-[12px]"/><button disabled={!newCategoryName.trim()||busy} onClick={createCategory} className="h-40 px-14 rounded-8 bg-primary text-white text-[11px] font-bold disabled:opacity-50">إضافة</button></div>
                    </div>
                    <div className="flex flex-col gap-8">
                        {categoryNames.map(category => <div key={category} className="bg-bg border border-border rounded-12 p-12 flex items-center gap-10">
                            <div className="min-w-0 flex-1"><p className="text-[13px] font-bold truncate">{category}</p><p className="text-[10px] text-muted mt-2"><span className="numeric">{countFor(category)}</span> صنف {categoryMeta?.[category]?.archived?'• مؤرشف':''}</p></div>
                            <button disabled={busy} onClick={()=>renameCategory(category)} className="h-32 px-10 rounded-8 border border-border text-[10px] font-bold">إعادة تسمية</button>
                            <button disabled={busy} onClick={()=>deleteCategory(category)} className="w-32 h-32 rounded-8 bg-dangerSoft text-danger border border-danger/10 flex items-center justify-center" aria-label={`حذف ${category}`}><Icon.Trash className="w-14 h-14"/></button>
                        </div>)}
                    </div>
                </div>
            )}

            {mode === 'audit' && (
                auditLoading ? <div className="text-center text-muted p-24 text-[12px]">جاري تحميل سجل التصنيفات...</div>
                : auditRows.length===0 ? <StateBlock icon={<Icon.Archive className="w-20 h-20"/>} title="لا توجد تعديلات مسجلة بعد"/>
                : <div className="flex flex-col gap-8">{auditRows.map(row => {
                    const label = row.action==='move'?'نقل منتج':row.action==='rename-category'?'إعادة تسمية قسم':row.action==='delete-category'?'حذف قسم':row.action==='create-category'?'إنشاء قسم':row.action;
                    return <div key={row.id} className="bg-bg border border-border rounded-12 p-12 flex gap-10 items-start"><div className="min-w-0 flex-1"><div className="flex flex-wrap gap-6 items-center"><b className="text-[12px]">{label}</b>{row.cleanId&&<span className="text-[10px] text-accent bidi-isolate">#{row.cleanId}</span>}</div><p className="text-[10px] text-secondary mt-4">{row.previousCategory && row.previousCategory!==CATEGORY_UNASSIGNED ? row.previousCategory : 'غير مصنف'} → {row.category && row.category!==CATEGORY_UNASSIGNED ? row.category : 'غير مصنف'}</p><p className="text-[9px] text-muted mt-4">مهند • {row.timestamp?.toDate ? row.timestamp.toDate().toLocaleString('ar-SA') : 'الآن'}</p></div>{row.action==='move'&&<button disabled={busy} onClick={()=>undoAudit(row)} className="h-32 px-10 rounded-8 border border-border text-[10px] font-bold whitespace-nowrap">تراجع</button>}</div>;
                })}</div>
            )}
        </div>
    );
});

// ============================================================
// لوحة تحكم الإدارة (خاصة بالمدير فقط - مهند) ✨ التجميع الذكي للجلسات وطلبات الدخول
// ============================================================
const AdminDashboardModal = memo(({ onClose, catalogItems, imagesList, categories, currentCategoryById, categoryMeta }) => {
    const [activeTab, setActiveTab] = useState('access_requests'); 
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    
    const [searchTerm, setSearchTerm] = useState('');
    const [sortOrder, setSortOrder] = useState('desc');
    const [expandedOrderId, setExpandedOrderId] = useState(null);
    const [archiveFilter, setArchiveFilter] = useState('all');

    const tabs = [
        { id: 'access_requests', label: 'طلبات الدخول 🔴' },
        { id: 'access_archive', label: 'صور الدخول' },
        { id: 'product_categories', label: 'إدارة الأقسام' },
        { id: 'site_sessions', label: 'جلسات العمل' },
        { id: 'orders', label: 'الطلبات المعتمدة' },
        { id: 'drafts', label: 'المسودات المؤقتة' }, 
        { id: 'search_logs', label: 'سجل عمليات البحث' },
        { id: 'users', label: 'إحصائيات المستخدمين' }
    ];

    useEffect(() => {
        let isMounted = true;
        let unsubscribe;

        if (activeTab === 'product_categories') {
            setLoading(false);
            setSearchTerm('');
            setExpandedOrderId(null);
        } else if (activeTab === 'access_requests') {
            setLoading(true);
            getDb().then(db => {
                unsubscribe = db.collection('access_requests')
                    .where('status', '==', 'pending')
                    .orderBy('timestamp', 'desc')
                    .onSnapshot(snapshot => {
                        if (isMounted) {
                            const reqs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setData(reqs);
                            setLoading(false);
                        }
                    }, err => {
                        console.error(err);
                        db.collection('access_requests').where('status', '==', 'pending').onSnapshot(snap => {
                            if (isMounted) {
                                let reqs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                reqs.sort((a,b) => (b.timestamp?.toMillis?.() || 0) - (a.timestamp?.toMillis?.() || 0));
                                setData(reqs);
                                setLoading(false);
                            }
                        });
                    });
            });
        } else if (activeTab === 'access_archive') {
            setLoading(true);
            setSearchTerm('');
            setExpandedOrderId(null);
            getDb().then(db => {
                db.collection('access_requests').limit(500).get()
                    .then(snapshot => {
                        if (!isMounted) return;
                        const rows = snapshot.docs
                            .map(doc => ({ id: doc.id, ...doc.data() }))
                            .filter(row => row.status === 'approved' || row.status === 'rejected')
                            .sort((a, b) => {
                                const av = a.reviewedAt?.toMillis?.() || a.timestamp?.toMillis?.() || 0;
                                const bv = b.reviewedAt?.toMillis?.() || b.timestamp?.toMillis?.() || 0;
                                return bv - av;
                            });
                        setData(rows);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('[Access Archive]', err);
                        if (isMounted) { setData([]); setLoading(false); }
                    });
            });
        } else {
            setLoading(true);
            setSearchTerm('');
            setExpandedOrderId(null);

            getDb().then(db => {
                let sortField = 'timestamp';
                if (activeTab === 'users') sortField = 'lastLogin';
                else if (activeTab === 'search_logs') sortField = 'time';
                else if (activeTab === 'site_sessions') sortField = 'lastActive'; 
                
                const collectionRef = db.collection(activeTab);
                
                collectionRef.orderBy(sortField, 'desc').limit(200).get()
                    .then(snapshot => {
                        if (isMounted) {
                            const fetchedData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setData(fetchedData);
                            setLoading(false);
                        }
                    })
                    .catch(err => {
                        console.warn("جاري استخدام الجلب الأساسي (Fallback):", err);
                        collectionRef.limit(200).get().then(snap => {
                            if (isMounted) {
                                let fetchedData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                fetchedData.sort((a,b) => {
                                    const t1 = a.timestamp || a.time || a.lastLogin || a.firstJoined || a.lastActive || 0;
                                    const t2 = b.timestamp || b.time || b.lastLogin || b.firstJoined || b.lastActive || 0;
                                    const v1 = t1.toMillis ? t1.toMillis() : new Date(t1).getTime();
                                    const v2 = t2.toMillis ? t2.toMillis() : new Date(t2).getTime();
                                    return v2 - v1;
                                });
                                setData(fetchedData);
                                setLoading(false);
                            }
                        }).catch(e => {
                            if(isMounted) setLoading(false);
                        });
                    });
            });
        }

        return () => { 
            isMounted = false; 
            if (unsubscribe) unsubscribe();
        };
    }, [activeTab]);

    const filteredData = useMemo(() => {
        let res = [...data];
        if (searchTerm.trim()) {
            const q = searchTerm.toLowerCase();
            res = res.filter(row => JSON.stringify(row).toLowerCase().includes(q));
        }
        if (sortOrder === 'asc') res.reverse();
        return res;
    }, [data, searchTerm, sortOrder]);

    const isUserOnline = useCallback((lastActive) => {
        if (!lastActive) return false;
        const lastTime = lastActive.toMillis ? lastActive.toMillis() : new Date(lastActive).getTime();
        return (Date.now() - lastTime) < (3 * 60 * 1000); 
    }, []);

    const groupedSessions = useMemo(() => {
        if (activeTab !== 'site_sessions') return [];
        const groups = {};
        filteredData.forEach(session => {
            const name = session.name || 'مجهول';
            if (!groups[name]) {
                groups[name] = { name: name, totalDuration: 0, sessions: [], isOnline: false, lastActive: 0 };
            }
            groups[name].sessions.push(session);
            groups[name].totalDuration += (session.durationMinutes || 0);
            
            const sessionLastActive = session.lastActive?.toMillis ? session.lastActive.toMillis() : new Date(session.lastActive).getTime();
            if (sessionLastActive > groups[name].lastActive) {
                groups[name].lastActive = sessionLastActive;
                groups[name].isOnline = isUserOnline(session.lastActive);
            }
        });
        return Object.values(groups).sort((a, b) => b.lastActive - a.lastActive);
    }, [filteredData, activeTab, isUserOnline]);

    const formatFbDate = (ts) => {
        if (!ts) return '---';
        try { return ts.toDate ? ts.toDate().toLocaleDateString('ar-SA') : new Date(ts).toLocaleDateString('ar-SA'); } catch { return '---'; }
    };
    
    const formatFbTime = (ts) => {
        if (!ts) return '---';
        try { return ts.toDate ? ts.toDate().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'}) : new Date(ts).toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'}); } catch { return '---'; }
    };

    const totalRevenue = activeTab === 'orders' ? filteredData.reduce((sum, row) => sum + (row.totalAmount || 0), 0) : 0;

    const handleRequestDecision = async (reqId, decision) => {
        if (!window.confirm(`تأكيد ${decision === 'approved' ? 'الموافقة' : 'الرفض'} لهذا الشخص؟`)) return;
        try {
            const db = await getDb();
            await db.collection('access_requests').doc(reqId).update({
                status: decision,
                reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
                reviewedBy: 'مهند'
            });
        } catch (e) {
            alert('حدث خطأ أثناء تنفيذ القرار.');
        }

    const archivedAccess = useMemo(() => {

    const deleteArchivedAccess = async (reqId) => {

            setData(prev => prev.filter(row => row.id !== reqId));

                                    </div>

                            {loading ? (
                                <div className="flex justify-center items-center h-48 text-muted text-[14px]">جاري جلب السجلات...</div>

                                            )}

                                            {activeTab === 'drafts' && (

                                            {activeTab === 'search_logs' && (

    const [accessVerified, setAccessVerified] = useState(() => {

        const gateVersion = localStorage.getItem(STORAGE_KEYS.ACCESS_GATE_VERSION) || '';
        const approvedName = localStorage.getItem(STORAGE_KEYS.ACCESS_APPROVED_NAME) || '';
        return Boolean(n) && gateVersion === ACCESS_GATE_VERSION && approvedName === normalizeText(n);
    });

    // إذا تغيّر الاسم يدويًا/من جلسة سابقة لا نسمح بإعادة استخدام تصريح مستخدم آخر.

    const [drafts, setDrafts] = useState(() => {

        return () => {

    }, []);

            const possibleMatches = pool.filter(item => item.cleanId && item.cleanId.length >= 3 && cleanQ.includes(item.cleanId));
            if (possibleMatches.length > 0) {
                possibleMatches.sort((a, b) => b.cleanId.length - a.cleanId.length);

            return next === cur ? prev : { ...prev, [uid]: next };
        });
    }, []);

        s.timer = setTimeout(() => { const taps = s.count; s.count = 0; s.uid = null; s.timer = null; applyTaps(uid, taps); }, MULTI_TAP_WINDOW_MS);
