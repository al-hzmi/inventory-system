<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مخزون شركة بيت الأواني الطيبة</title>
<meta name="theme-color" content="#FFFFFF">
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1c1917}#v37boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:999999}.v37box{text-align:center;padding:24px}.v37box img{width:82px;height:82px;object-fit:contain}.v37box p{font-size:12px;color:#78716c;margin:12px 0 0}.v37err{max-width:440px;margin:auto;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:14px;padding:16px;font-size:13px;line-height:1.8}</style>
</head>
<body>
<div id="v37boot"><div class="v37box"><img src="./icons/icon-192.png" alt="بيت الأواني الطيبة"><p>جاري فتح النظام...</p></div></div>
<script>
(async function(){
  const CORE='./runtime/index-v37-source.txt?v=37.1';
  const employeeName=(()=>{try{return String(localStorage.getItem('inventory_user_name_v2')||'').trim()}catch{return''}})();
  if(employeeName){
    const u=new URL(location.href);
    if(u.searchParams.get('employee')!=='1'){
      u.searchParams.set('employee','1');u.searchParams.delete('chooser');history.replaceState(null,'',u.pathname+u.search+u.hash);
    }
  }
  if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update().catch(()=>{}))).catch(()=>{});
  const loadCore=async()=>{try{const r=await fetch(CORE,{cache:'no-store'});if(!r.ok)throw new Error('CORE_HTTP_'+r.status);const text=await r.text();try{const c=await caches.open('batco-v37-core');await c.put(CORE,new Response(text,{headers:{'Content-Type':'text/plain;charset=utf-8'}}))}catch{}return text}catch(e){try{const hit=await caches.match(CORE);if(hit)return await hit.text()}catch{}throw e}};
  try{
    let html=await loadCore();
    const msgStart=html.indexOf('const EmployeeAdminMessageScreen =');
    const hookStart=html.indexOf('const useEmployeeAdminMessages =',msgStart);
    if(msgStart<0||hookStart<0)throw new Error('V37_MESSAGE_MARKER');
    const notification=`const EmployeeAdminNotification = ({notification,onClose}) => {
    const closeRef = useRef(onClose);
    useEffect(() => { closeRef.current = onClose; }, [onClose]);
    useEffect(() => { if (!notification?.id) return; const timer = setTimeout(() => closeRef.current?.(), 10000); return () => clearTimeout(timer); }, [notification?.id]);
    return (
        <div className="fixed inset-x-0 top-0 z-[280] pointer-events-none px-12 font-sans" style={{paddingTop:'max(10px, env(safe-area-inset-top))'}} aria-live="polite">
            <div role="status" className="pointer-events-auto mx-auto w-full max-w-[430px] bg-white/95 backdrop-blur border border-border rounded-16 shadow-lift px-12 py-11 flex items-start gap-10 animate-card">
                <div className="w-40 h-40 rounded-12 bg-successSoft text-success flex items-center justify-center flex-shrink-0" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="w-20 h-20"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg></div>
                <div className="min-w-0 flex-1"><div className="flex items-center gap-6 text-[10px] text-muted"><span className="font-bold text-success">الإدارة</span><span>الآن</span></div><div className="text-[13px] font-bold text-primary mt-1 truncate">{notification?.title || 'رسالة من الإدارة'}</div><div className="text-[11px] text-secondary leading-5 mt-2 whitespace-pre-wrap overflow-hidden" style={{display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{notification?.message || ''}</div></div>
                <button type="button" onClick={onClose} aria-label="إغلاق الإشعار" title="إغلاق" className="w-32 h-32 rounded-10 flex items-center justify-center text-muted hover:text-primary hover:bg-surface flex-shrink-0">×</button>
            </div>
        </div>
    );
};

`;
    html=html.slice(0,msgStart)+notification+html.slice(hookStart);
    const blocking=`    if (employeeAdminMessage) {\n        return <EmployeeAdminMessageScreen notification={employeeAdminMessage} onClose={dismissEmployeeAdminMessage} />;\n    }\n\n`;
    if(!html.includes(blocking))throw new Error('V37_BLOCKING_MARKER');
    html=html.replace(blocking,'');
    const appAt=html.indexOf('const App = () => {'),rootMarker='<div className="min-h-screen font-sans">',rootAt=html.indexOf(rootMarker,appAt);
    if(appAt<0||rootAt<0)throw new Error('V37_APP_ROOT_MARKER');
    html=html.slice(0,rootAt)+html.slice(rootAt).replace(rootMarker,rootMarker+'\n            {employeeAdminMessage && <EmployeeAdminNotification notification={employeeAdminMessage} onClose={dismissEmployeeAdminMessage} />}');
    const oldSwitch='<span className="hidden sm:inline text-[11px] font-bold whitespace-nowrap">واجهة العملاء</span>',newSwitch='<span className="text-[10px] font-bold whitespace-nowrap">عملاء</span>';
    if(!html.includes(oldSwitch))throw new Error('V37_SWITCH_MARKER');
    html=html.replace(oldSwitch,newSwitch);
    if(!html.includes('EmployeeAdminNotification')||html.includes('return <EmployeeAdminMessageScreen')||!html.includes('./customer.html?employeeView=1')||!html.includes('>عملاء</span>'))throw new Error('V37_OUTPUT_CHECK');
    document.open();document.write(html);document.close();
  }catch(e){console.error('[V37 bootstrap]',e);const root=document.getElementById('v37boot');if(root)root.innerHTML='<div class="v37box"><div class="v37err"><b>تعذر فتح النظام بأمان.</b><br>لم يتم تحميل نسخة ناقصة. حدّث الصفحة، وإذا استمرت المشكلة تواصل مع الإدارة.<br><small>'+String(e&&e.message||e)+'</small></div></div>'}
})();
</script>
</body>
</html>
