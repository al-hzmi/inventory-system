   <script type="text/babel">

const LAST_UPDATE = "23 يوليو 2026 - 9:15 مساءً";

let RAW_JEDDAH_DATA = "";
let RAW_RIYADH_DATA = "";
		
        // ==========================================
        // نهاية منطقة إدخال البيانات
        // ==========================================

        const { useState, useEffect, useRef, useMemo } = React;

        // Normalize Arabic numerals to English numerals for search consistency
        const normalizeNumerals = (str) => {
            if (!str) return '';
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        };

        // Parser function for pasted Excel (TSV) data
        const parseExcelData = (rawText) => {
            if (!rawText || rawText.includes('[قم_بتظليل_هذا_النص')) return [];

            const lines = rawText.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split('\t').map(h => h.trim());
            const idIdx = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));
            const nameIdx = headers.findIndex(h => /اسم|وصف|description|name/i.test(h));
            const qtyIdx = headers.findIndex(h => /كمية|رصيد|متوفر|qty|quantity/i.test(h));
            const unitIdx = headers.findIndex(h => /وحدة|unit|uom/i.test(h));
const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));

            const dataMap = {};

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(c => c.trim());
                if (cols.length === 0 || (!cols[idIdx] && !cols[nameIdx])) continue;

                const rawId = cols[idIdx] ? cols[idIdx].trim() : '';
                const searchId = normalizeNumerals(rawId).toLowerCase();

                if (!searchId) continue;

                const name = cols[nameIdx] ? cols[nameIdx].trim() : '';
                const rawQty = normalizeNumerals(cols[qtyIdx] || '0').replace(/,/g, ''); // Remove commas if any
                const qty = isNaN(parseFloat(rawQty)) ? 0 : parseFloat(rawQty);
                const unit = unitIdx !== -1 ? (cols[unitIdx] ? cols[unitIdx].trim() : '') : '';
                const pack = packIdx !== -1 ? (cols[packIdx] ? cols[packIdx].trim() : '') : '';

                // Overwrites if duplicate, keeping the last valid row per instructions
                dataMap[searchId] = { 
                    id: rawId, 
                    searchId: searchId, 
                    name, 
                    qty, 
                    unit, 
                    pack
                };
            }
            return Object.values(dataMap);
        };

        // Icons components
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} aria-hidden="true">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const FormatQuantity = ({ qty, unit }) => {
            const formattedQty = new Intl.NumberFormat('en-US').format(qty);
            return (
                <div className="flex flex-col">
                    <div className="flex items-baseline gap-1">
                        <span className="text-[24px] md:text-[28px] font-bold text-primary leading-none">{formattedQty}</span>
                        {unit && <span className="text-[14px] text-secondary">{unit}</span>}
                    </div>
                    {qty === 0 && (
                        <span className="text-[14px] text-secondary mt-1">نفدت الكمية حالياً</span>
                    )}
                </div>
            );
        };

        // Full Detailed Card (Exact Match)
       const FullResultCard = ({ item, warehouseName }) => (
    <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 md:p-24 bg-bg flex flex-col gap-16">

        </div>

        <div>
            <div className="text-[14px] font-medium text-secondary mb-1">اسم الصنف</div>
            <div className="text-[16px] text-primary">{item.name || "---"}</div>
        </div>

        <div>

            <div className="text-[16px] text-primary">{warehouseName}</div>
        </div>

        <div className="grid grid-cols-2 gap-4 border-t border-border pt-4">
            <div>
                <div className="text-[14px] font-medium text-secondary mb-1">الوحدة</div>
                <div className="text-[16px] font-bold text-primary">
                    {item.unit || "---"}
                </div>
            </div>

            <div>
                <div className="text-[14px] font-medium text-secondary mb-1">الشد</div>
                <div className="text-[16px] font-bold text-primary">
                    {item.pack || "---"}
                </div>
            </div>
        </div>

        <div className="border-t border-border pt-4">
            <div className="text-[14px] font-medium text-secondary mb-1">
                الكمية المتوفرة
            </div>
            <FormatQuantity qty={item.qty} unit={item.unit} />
        </div>

    </div>
);

        // Compact Card (Partial Match - max 5)
        const CompactResultCard = ({ item, warehouseName }) => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-16 bg-bg flex justify-between items-center gap-16 mb-8 hover:bg-hoverBg transition-colors duration-200">
                <div className="flex flex-col overflow-hidden">
                    <span className="text-[16px] font-bold text-primary truncate">{item.id}</span>
                    <span className="text-[14px] text-secondary truncate">{item.name || '---'}</span>
                </div>
                <div className="flex-shrink-0 text-left">
                    <FormatQuantity qty={item.qty} unit={item.unit} />
                </div>
            </div>
        );

        const NotFoundState = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <SearchIcon className="w-48 h-48 text-border" />
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">لم يتم العثور على الصنف</h3>
                    <p className="text-[15px] text-secondary">لا يوجد هذا الصنف داخل المستودع المحدد.</p>
                </div>
            </div>
        );

        const EmptyState = () => (
            <div className="w-full flex flex-col items-center justify-center py-48 text-center gap-16 opacity-70">
                <SearchIcon className="w-40 h-40 text-secondary" />
                <p className="text-[16px] text-secondary">ابدأ الكتابة لعرض بيانات الصنف</p>
            </div>
        );
        
        const DatabaseEmptyWarning = () => (
            <div className="animate-card w-full max-w-[480px] mx-auto border border-border rounded-12 shadow-card p-24 bg-bg flex flex-col items-center justify-center text-center gap-16">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-48 h-48 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h3 className="text-[16px] font-medium text-primary mb-8">قاعدة البيانات فارغة</h3>
                    <p className="text-[15px] text-secondary">يرجى لصق بيانات الإكسل في الكود المصدري لكي تتمكن من البحث.</p>
                </div>
            </div>
        );

// ==========================================
        // 1. مكون شاشة تسجيل الدخول
        // ==========================================
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                
                setLoading(true);
                try {
                    const userRef = db.collection('users').doc(name.trim());
                    const doc = await userRef.get();
                    
                    const userInfo = {
                        userAgent: navigator.userAgent,
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    };

                    if (doc.exists) {
                        await userRef.update({
                            ...userInfo,
                            loginCount: firebase.firestore.FieldValue.increment(1)
                        });
                    } else {
                        await userRef.set({
                            name: name.trim(),
                            ...userInfo,
                            loginCount: 1,
                            firstJoined: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }

                    await db.collection('login_logs').add({
                        name: name.trim(),
                        time: firebase.firestore.FieldValue.serverTimestamp(),
                        userAgent: navigator.userAgent
                    });

                    localStorage.setItem('inventory_user_name', name.trim());
                    onLogin(name.trim());

                } catch (error) {
                    console.error("Error logging in: ", error);
                    alert("حدث خطأ أثناء الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.");
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-16 font-sans">
                    <div className="animate-card w-full max-w-[400px] bg-white border border-border rounded-12 shadow-card p-32 text-center">
                        <h1 className="text-[24px] font-bold text-primary mb-8 font-cairo">نظام المخزون</h1>
                        <p className="text-[14px] text-secondary mb-32 font-cairo">شركة بيت الأواني الطيبة</p>
                        
                        <form onSubmit={handleSubmit} className="flex flex-col gap-16">
                            <div className="text-right">
                                <label className="text-[14px] font-medium text-primary mb-8 block font-cairo">
                                    اسم الموظف
                                </label>
                                <input 
                                    type="text" 
                                    required
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="اكتب اسمك هنا..."
                                    className="w-full h-[48px] px-16 rounded-12 border border-border focus:border-primary focus:ring-1 focus:ring-primary text-primary outline-none transition-all font-cairo"
                                />
                            </div>
                            
                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full h-[48px] bg-primary text-white rounded-12 font-medium hover:opacity-90 transition-opacity flex justify-center items-center font-cairo"
                            >
                                {loading ? "جاري الدخول..." : "دخول للنظام"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 2. التطبيق الأساسي (نظام المخزون)
        // ==========================================
        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('inventory_user_name') || '');
            const [isSubscribed, setIsSubscribed] = useState(false);
            const [warehouse, setWarehouse] = useState(null);
            const [query, setQuery] = useState('');
            const [databases, setDatabases] = useState({ jeddah: [], riyadh: [] });
            const [loading, setLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState("جاري التحقق...");
            const [notificationEnabled, setNotificationEnabled] = useState(false);
            
            const searchInputRef = useRef(null);

            const handleLogout = () => {
                localStorage.removeItem('inventory_user_name');
                setUserName('');
            };

            useEffect(() => {
                window.OneSignalDeferred = window.OneSignalDeferred || [];
                window.OneSignalDeferred.push(async function(OneSignal) {
                    const isPushSupported = await OneSignal.Notifications.isPushSupported();
                    if (isPushSupported) {
                        const permission = await OneSignal.Notifications.permission;
                        setIsSubscribed(permission === "granted");
                        setNotificationEnabled(permission === "granted");
                    }
                });
            }, []);

            useEffect(() => {
                fetch("./data/version.json")
                    .then(res => res.json())
                    .then(data => setLastUpdate(data.lastUpdate || "غير متوفر"))
                    .catch(() => setLastUpdate("غير متوفر"));
            }, []);

            useEffect(() => {        
                const loadData = async () => {
                    try {
                        const [jeddahRes, riyadhRes] = await Promise.all([
                            fetch("./data/jeddah.tsv"),
                            fetch("./data/riyadh.tsv")
                        ]);
                        const jeddahText = await jeddahRes.text();
                        const riyadhText = await riyadhRes.text();

                        setDatabases({
                            jeddah: parseExcelData(jeddahText),
                            riyadh: parseExcelData(riyadhText)
                        });
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            const enableNotifications = () => {
                window.OneSignalDeferred = window.OneSignalDeferred || [];
                window.OneSignalDeferred.push(async function(OneSignal) {
                    const isPushSupported = await OneSignal.Notifications.isPushSupported();
                    if (!isPushSupported) {
                        alert("عذراً، هذا المتصفح لا يدعم الإشعارات.");
                        return;
                    }
                    await OneSignal.Slidedown.promptPush();
                    const permission = await OneSignal.Notifications.permission;
                    if (permission === "granted") {
                        setIsSubscribed(true);
                        setNotificationEnabled(true);
                        alert("تم تفعيل الإشعارات بنجاح!");
                    } else {
                        setIsSubscribed(false);
                        setNotificationEnabled(false);
                    }
                });
            };
               
            const isDbEmpty = useMemo(() => databases.jeddah.length === 0 && databases.riyadh.length === 0, [databases]);

            useEffect(() => {
                if (warehouse && searchInputRef.current) {
                    searchInputRef.current.focus();
                }
            }, [warehouse]);

            const handleWarehouseSelect = (selected) => {
                setWarehouse(selected);
            };

            const handleSearchChange = (e) => {
                setQuery(e.target.value);
            };

            const results = useMemo(() => {
                if (!warehouse || !query.trim()) return null; 
                const normalizedQuery = normalizeNumerals(query.trim()).toLowerCase().replace(/[\s_-]/g, "");
                const activeDb = databases[warehouse] || [];
                
                return activeDb.filter(item => {
                    const sku = item.searchId.replace(/[\s_-]/g, "");
                    if (/^\d+$/.test(normalizedQuery)) {
                        const numericSku = sku.replace(/^[a-z_]+/i, "");
                        return numericSku.startsWith(normalizedQuery);
                    }
                    return sku.startsWith(normalizedQuery);
                });
            }, [query, warehouse, databases]);

            if (!userName) {
                return <LoginScreen onLogin={(name) => setUserName(name)} />;
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center text-xl font-bold font-cairo">
                        جاري تحميل بيانات المخزون...
                    </div>
                );
            }
                    
            return (
                <div className="max-w-[1024px] mx-auto px-16 sm:px-24 py-40 md:py-64 font-sans selection:bg-gray-200">
                    
                    <header className="text-center mb-32 flex flex-col gap-8 relative">
                        <div className="absolute -top-16 right-0 flex items-center gap-8 bg-white border border-border px-12 py-6 rounded-full shadow-sm">
                            <div className="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center text-[12px] font-bold">
                                {userName.charAt(0)}
                            </div>
                            <span className="text-[13px] font-medium font-cairo text-primary">{userName}</span>
                            <button onClick={handleLogout} className="text-[12px] text-red-500 hover:text-red-700 mr-4 font-cairo transition-colors">
                                تسجيل خروج
                            </button>
                        </div>

                        <h1 className="text-[28px] md:text-[32px] font-bold text-primary m-0 mt-24 leading-tight font-cairo">
                            مخزون شركة بيت الأواني الطيبة
                        </h1>
                        <h2 className="text-[15px] md:text-[16px] text-secondary font-normal m-0 font-cairo">
                            نظام الاستعلام عن المخزون
                        </h2>
                        <p className="text-[13px] text-secondary font-cairo">
                            🕒 آخر تحديث: {lastUpdate}
                        </p>
                    </header>

                    <div className="max-w-[480px] mx-auto mb-24">
                        <div className="border border-border rounded-12 p-16 bg-bg shadow-card">
                            <div className="flex items-start gap-3">
                                <div className="text-2xl">🔔</div>
                                <div className="flex-1">
                                    <h3 className="text-[16px] font-bold text-primary font-cairo">
                                        إشعارات تحديث المخزون
                                    </h3>
                                    <p className="text-[14px] text-secondary mt-1 font-cairo">
                                        فعّل الإشعارات ليصلك تنبيه عند تحديث بيانات المخزون.
                                    </p>
                                    <button
                                        onClick={enableNotifications}
                                        className={`mt-4 w-full rounded-12 py-3 font-medium font-cairo transition-colors ${
                                            isSubscribed 
                                                ? 'bg-green-100 text-green-700 border border-green-200' 
                                                : 'bg-primary text-white hover:opacity-90'
                                        }`}
                                    >
                                        {isSubscribed ? "✅ الإشعارات مفعلة" : "🔔 تفعيل الإشعارات"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                            
                    <div className="flex justify-center gap-16 mb-32" role="group" aria-label="اختر المستودع">
                        <button 
                            onClick={() => handleWarehouseSelect('jeddah')}
                            className={`px-24 py-16 rounded-12 text-[16px] font-medium font-cairo transition-all duration-200 focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 w-[140px] md:w-[160px] flex justify-center items-center ${
                                warehouse === 'jeddah' 
                                ? 'bg-primary text-bg shadow-md' 
                                : 'bg-bg text-primary border border-primary hover:bg-hoverBg'
                            }`}
                        >
                            مخزون جدة
                        </button>
                        <button 
                            onClick={() => handleWarehouseSelect('riyadh')}
                            className={`px-24 py-16 rounded-12 text-[16px] font-medium font-cairo transition-all duration-200 focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 w-[140px] md:w-[160px] flex justify-center items-center ${
                                warehouse === 'riyadh' 
                                ? 'bg-primary text-bg shadow-md' 
                                : 'bg-bg text-primary border border-primary hover:bg-hoverBg'
                            }`}
                        >
                            مخزون الرياض
                        </button>
                    </div>

                    <div className="max-w-[480px] mx-auto w-full mb-32 flex flex-col gap-8 relative">
                        <label htmlFor="searchInput" className={`text-[14px] font-medium font-cairo transition-colors duration-200 ${warehouse ? 'text-primary' : 'text-secondary'}`}>
                            رقم الصنف
                        </label>
                        <div className="relative">
                            <input
                                ref={searchInputRef}
                                id="searchInput"
                                type="text"
                                value={query}
                                onChange={handleSearchChange}
                                disabled={!warehouse}
                                placeholder={warehouse ? "اكتب رقم الصنف..." : "اختر المستودع أولاً"}
                                className={`w-full h-[56px] px-16 pl-48 rounded-12 border transition-all duration-200 text-[16px] font-cairo outline-none 
                                    ${!warehouse 
                                        ? 'bg-gray-50 border-border cursor-not-allowed text-secondary opacity-60' 
                                        : 'bg-bg border-border focus:border-primary focus:ring-1 focus:ring-primary text-primary shadow-sm'
                                    }`}
                                aria-disabled={!warehouse}
                            />
                            <div className="absolute left-16 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">
                                <SearchIcon className="w-24 h-24 opacity-60" />
                            </div>
                        </div>
                    </div>

                    <div className="w-full min-h-[300px]" aria-live="polite">
                        {(!warehouse || !query.trim()) ? (
                            <EmptyState />
                        ) : isDbEmpty ? (
                            <DatabaseEmptyWarning />
                        ) : results && results.length === 0 ? (
                            <NotFoundState />
                        ) : results && results.length === 1 ? (
                            <FullResultCard 
                                item={results[0]} 
                                warehouseName={warehouse === 'jeddah' ? 'مخزون جدة' : 'مخزون الرياض'} 
                            />
                        ) : results && results.length > 1 ? (
                            <div className="flex flex-col">
                                <div className="text-[14px] text-secondary mb-16 text-center font-cairo">
                                    مطابقات جزئية (نعرض حتى 5 نتائج)
                                </div>
                                {results.slice(0, 5).map(item => (
                                    <CompactResultCard 
                                        key={item.id}
                                        item={item} 
                                        warehouseName={warehouse === 'jeddah' ? 'مخزون جدة' : 'مخزون الرياض'} 
                                    />
                                ))}
                            </div>
                        ) : null}
                    </div>
                            
                    <footer className="mt-16 pt-8 border-t border-border text-center">
                        <p className="text-[12px] text-secondary font-cairo">
                            © 2026 تطوير مهند الحزمي
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
    
</body>
</html>
