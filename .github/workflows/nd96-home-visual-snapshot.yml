name: ND96 Home Visual Snapshot

on:
  push:
    branches: [fix/nd96-home-reference-v56-49]
    paths-ignore:
      - 'tests/visual-output/**'

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[visual-snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nd96-home-reference-v56-49
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 sharp@0.34.3 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Capture Home at locked reference viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/visual-output
          python3 -m http.server 4173 >/tmp/nd96-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat > capture-home.mjs <<'JS'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:364,height:768},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'ar-SA'});
          const page=await context.newPage();
          await page.addInitScript(()=>{
            const employeeId='visual-qa';
            localStorage.setItem('inventory_user_name_v2','تجريبي');
            localStorage.setItem('inventory_employee_id_v2',employeeId);
            localStorage.setItem('inventory_employee_auth_version_v2','2');
            localStorage.setItem('inventory_login_photo_proof_v2',JSON.stringify({role:'employee',employeeId,photoId:'visual-proof'}));
            sessionStorage.setItem('batco_identity_preview_v1','national96');
          });
          await page.goto('http://127.0.0.1:4173/index.html?qa=1&employee=1',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>document.body && document.body.innerText.includes('مخزون شركة بيت الأواني الطيبة'),null,{timeout:30000});
          await page.waitForFunction(()=>document.documentElement.classList.contains('batco-identity-national96'),null,{timeout:15000});
          await page.waitForTimeout(2500);
          await page.screenshot({path:'tests/visual-output/home-implementation-364x768.png',fullPage:false});
          await page.screenshot({path:'tests/visual-output/home-implementation-full.png',fullPage:true});
          const meta=await page.evaluate(()=>{
            const clean=s=>String(s||'').normalize('NFD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim();
            const box=r=>r?{x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),top:Math.round(r.top),right:Math.round(r.right),bottom:Math.round(r.bottom),left:Math.round(r.left)}:null;
            const leaf=needle=>[...document.querySelectorAll('body *')].find(el=>el.children.length===0&&clean(el.textContent).includes(clean(needle)));
            const chain=needle=>{let el=leaf(needle),out=[];for(let i=0;el&&i<7;i++,el=el.parentElement)out.push({tag:el.tagName,cls:el.className,text:clean(el.textContent).slice(0,180),box:box(el.getBoundingClientRect())});return out};
            const chip=[...document.querySelectorAll('.nd96-inventory-chip')][0];
            return {
              innerWidth,innerHeight,scrollHeight:document.documentElement.scrollHeight,
              bodyClass:document.body.className,htmlClass:document.documentElement.className,
              anchors:{operator:chain('مشغل بواسطة'),developer:chain('تطوير مهند الحزمي'),display:chain('المعرض الرقمي'),choose:chain('اختر المستودع'),chip:chip?{box:box(chip.getBoundingClientRect()),parent:{cls:chip.parentElement?.className||'',box:box(chip.parentElement?.getBoundingClientRect())}}:null},
              meta:[...document.querySelectorAll('.nd96-inventory-meta')].map(x=>box(x.getBoundingClientRect())),
              hero:[...document.querySelectorAll('.nd96-inventory-hero')].map(x=>box(x.getBoundingClientRect())),
              catalog:[...document.querySelectorAll('.nd96-inventory-catalog-heading')].map(x=>box(x.getBoundingClientRect())),
              empty:[...document.querySelectorAll('.nd96-warehouse-empty')].map(x=>box(x.getBoundingClientRect()))
            };
          });
          console.log('ND96_HOME_LAYOUT',JSON.stringify(meta));
          await sharp('tests/visual-output/home-implementation-364x768.png').jpeg({quality:64}).toFile('tests/visual-output/home-implementation-364.jpg');
          await browser.close();
          JS
          node capture-home.mjs
          rm -f capture-home.mjs
      - name: Commit visual snapshot for inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/visual-output/home-implementation-364x768.png tests/visual-output/home-implementation-full.png tests/visual-output/home-implementation-364.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'test(nd96): capture Home implementation [visual-snapshot]'
          git push origin HEAD:fix/nd96-home-reference-v56-49
