name: ND96 Home Visual Snapshot

on:
  push:
    branches: [fix/nd96-home-reference-v56-49]
    paths-ignore:
      - 'tests/visual-output/**'

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[visual-snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nd96-home-reference-v56-49
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 sharp@0.34.3 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Capture Home at locked mobile viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/visual-output
          python3 -m http.server 4173 >/tmp/nd96-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat > /tmp/capture-home.mjs <<'JS'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:393,height:852},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'ar-SA'});
          const page=await context.newPage();
          await page.addInitScript(()=>{
            localStorage.setItem('inventory_user_name_v2','تجريبي');
            localStorage.setItem('inventory_employee_id_v2','visual-qa');
            sessionStorage.setItem('batco_identity_preview_v1','national96');
            try{Object.defineProperty(navigator,'webdriver',{get:()=>true})}catch{}
          });
          await page.goto('http://127.0.0.1:4173/index.html?qa=1&employee=1',{waitUntil:'networkidle',timeout:60000});
          await page.waitForFunction(()=>document.body && document.body.innerText.includes('مخزون شركة بيت الأواني الطيبة'),null,{timeout:30000});
          await page.waitForTimeout(2500);
          await page.screenshot({path:'tests/visual-output/home-implementation-393x852.png',fullPage:true});
          const meta=await page.evaluate(()=>({
            innerWidth:innerWidth,innerHeight:innerHeight,scrollHeight:document.documentElement.scrollHeight,
            bodyClass:document.body.className,htmlClass:document.documentElement.className,
            title:[...document.querySelectorAll('h1,h2')].find(x=>x.textContent.includes('مخزون شركة'))?.getBoundingClientRect()||null,
            meta:[...document.querySelectorAll('.nd96-inventory-meta')].map(x=>x.getBoundingClientRect()),
            hero:[...document.querySelectorAll('.nd96-inventory-hero')].map(x=>x.getBoundingClientRect()),
            catalog:[...document.querySelectorAll('.nd96-inventory-catalog-heading')].map(x=>x.getBoundingClientRect()),
            empty:[...document.querySelectorAll('.nd96-warehouse-empty')].map(x=>x.getBoundingClientRect())
          }));
          console.log('ND96_HOME_LAYOUT',JSON.stringify(meta));
          await sharp('tests/visual-output/home-implementation-393x852.png').resize({width:364}).jpeg({quality:72}).toFile('tests/visual-output/home-implementation-364.jpg');
          await browser.close();
          JS
          node /tmp/capture-home.mjs
      - name: Commit visual snapshot for inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/visual-output/home-implementation-393x852.png tests/visual-output/home-implementation-364.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'test(nd96): capture Home implementation [visual-snapshot]'
          git push origin HEAD:fix/nd96-home-reference-v56-49
