name: Finalize V56.37 Admin Unification

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-v56-37-admin-unification.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove migration artifacts and validate final source
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='admin-dashboard.html';
          let s=fs.readFileSync(file,'utf8');
          const from="tile('history','سجل التصنيفات'";
          const to="tile('clock','سجل التصنيفات'";
          const count=s.split(from).length-1;
          if(count!==1)throw new Error(`expected one history tile, found ${count}`);
          s=s.replace(from,to);
          fs.writeFileSync(file,s);

          const runtime=fs.readFileSync('runtime/index-v37-source.txt','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const nav=fs.readFileSync('v46-admin-nav.js','utf8');
          const enhance=fs.readFileSync('v54-admin-enhancements.js','utf8');
          const album=fs.readFileSync('image-distribution.html','utf8');
          if(runtime.includes('title="إدارة المنتجات والأقسام"'))throw new Error('duplicate product launcher survived');
          if(!runtime.includes('title="لوحة التحكم الإدارية"'))throw new Error('unified admin launcher missing');
          if(!index.includes("v=56.16&rev=56.37"))throw new Error('runtime cache contract wrong');
          for(const x of ['ProductManagementHub','product_management','إدارة أقسام المنتجات','مكتبة صور المنتجات','إدارة «جديدنا»','سجل التصنيفات','ألبوم الصور وربط الأصناف'])if(!s.includes(x))throw new Error('product hub missing '+x);
          if(!nav.includes('module=product_management'))throw new Error('sidebar product route missing');
          if(!enhance.includes("v54-1-desktop-canvas-fix.css?v=56.37"))throw new Error('desktop canvas cache bust stale');
          if(!album.includes("IMAGE_BINDING_BACKEND='api/image-admin'"))throw new Error('image backend compatibility marker missing');
          if(!album.includes("text('./data/pricing.tsv')")||!album.includes("text('./data/categories.tsv')"))throw new Error('sold-out persistent catalog sources missing');
          NODE

          rm -f v56-37-admin-entry-unification.js
          rm -f .github/workflows/apply-v56-37-admin-unification.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v56.37): finalize unified admin cleanup"
          git push origin HEAD:main
