name: V39.4 Full Regression Verifier
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v39-4-regression-verifier.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install validation tools
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Execute production bootstraps against real runtime sources
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/v394-runtime.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {Response,Request,Headers,AbortController}=globalThis;
          function inlineScript(html){
            const all=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>!m[1].includes('src='));
            if(!all.length)throw new Error('NO_INLINE_SCRIPT');
            return all[all.length-1][2];
          }
          function storage(seed={}){const m=new Map(Object.entries(seed));return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear(),_map:m};}
          async function generate(kind){
            const wrapper=fs.readFileSync(kind==='index'?'index.html':'customer.html','utf8');
            const runtime=fs.readFileSync(kind==='index'?'runtime/index-v37-source.txt':'runtime/customer-v37-source.txt','utf8');
            let written='',replaced='';
            const ls=storage({inventory_user_name_v2:'موظف اختبار',inventory_employee_id_v2:'emp_test',inventory_employee_auth_version_v2:'2'});
            const href=kind==='index'?'https://example.test/index.html?employee=1':'https://example.test/customer.html?employeeView=1&appv=39.3';
            const u=new URL(href);
            const location={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace(v){replaced=String(v);this.href=String(v);const nu=new URL(String(v),href);this.search=nu.search;this.pathname=nu.pathname;this.hash=nu.hash;}};
            const caches={open:async()=>({put:async()=>{}}),match:async()=>null};
            const navigator={serviceWorker:{getRegistrations:async()=>[]}};
            const fetch=async(input)=>{
              const url=String(typeof input==='string'?input:input?.url||'');
              if(url.includes('runtime/index-v37-source.txt')||url.includes('runtime/customer-v37-source.txt'))return new Response(runtime,{status:200,headers:{'Content-Type':'text/plain'}});
              return new Response('',{status:404});
            };
            const ctx={console,URL,URLSearchParams,Response,Request,Headers,AbortController,setTimeout,clearTimeout,location,history:{replaceState(_a,_b,v){if(v){const nu=new URL(String(v),href);location.href=nu.href;location.search=nu.search;location.pathname=nu.pathname;location.hash=nu.hash;}}},navigator,localStorage:ls,sessionStorage:storage(),caches,fetch,document:{open(){},write(v){written=String(v)},close(){},getElementById(){return {innerHTML:''}}}};
            ctx.window=ctx;ctx.window.location=location;vm.createContext(ctx);
            const result=vm.runInContext(inlineScript(wrapper),ctx,{timeout:12000,filename:kind+'-bootstrap.js'});
            await Promise.resolve(result);
            if(!written)throw new Error(kind.toUpperCase()+'_NO_DOCUMENT_WRITE '+replaced);
            fs.writeFileSync('/tmp/generated-'+kind+'.html',written);
            return {html:written,storage:ls};
          }
          (async()=>{
            const idx=(await generate('index')).html,cust=(await generate('customer')).html;
            const checks={
              employee_app:idx.includes('const App = () => {'),
              customer_app:cust.includes('function CustomerApp('),
              employee_notification_nonblocking:idx.includes('EmployeeAdminNotification')&&!idx.includes('return <EmployeeAdminMessageScreen'),
              customer_handoff:cust.includes('function handoffEmployeeCustomerCart(cartItems,branches)'),
              customer_checkout_handoff:cust.includes('onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}'),
              old_customer_block_removed:!cust.includes("onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?setToast({type:'info',message:employeeViewNotice}):setCheckout(true)}"),
              transfer_backup:cust.includes('EMPLOYEE_CUSTOMER_CART_TRANSFER_BACKUP_KEY')&&idx.includes('EMPLOYEE_CUSTOMER_CART_TRANSFER_BACKUP_KEY'),
              employee_import:idx.includes('chooseEmployeeCustomerTransferWarehouse')&&idx.includes('employeeCustomerTransferNotice'),
              identity_binding:idx.includes('sameId')&&idx.includes('sameName'),
              idempotency:idx.includes('EMPLOYEE_CUSTOMER_CART_TRANSFER_APPLIED_PREFIX')&&idx.includes('transferIds'),
              durable_cart:idx.includes('localStorage.setItem(cartKey,JSON.stringify(merged))'),
              auto_open:idx.includes('setShowCart(true)'),
              branch_preserved:idx.includes('buildEmployeeTransferNotes')&&idx.includes('customerTransfer: i.customerTransferMeta || null'),
              stock_guard:idx.includes('stockConflicts')&&idx.includes('لا يمكن اعتماد الطلب قبل مراجعة الكميات'),
              employee_switch:idx.includes('./customer.html?employeeView=1&appv=39.3')&&idx.includes('>عملاء</span>'),
              guest_prompt_isolation:cust.includes('!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt'),
            };
            const bad=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
            if(bad.length)throw new Error('FAILED_RUNTIME_CHECKS '+bad.join(','));
            console.log('V394_RUNTIME_GENERATION_PASS',Object.keys(checks).length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/v394-runtime.js

      - name: Parse generated and source JavaScript and JSX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys,json
          fail=[];count=0
          sources=list(Path('.').glob('*.html'))+[Path('runtime/index-v37-source.txt'),Path('runtime/customer-v37-source.txt'),Path('/tmp/generated-index.html'),Path('/tmp/generated-customer.html')]
          for p in sources:
              s=p.read_text(errors='replace')
              if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: fail.append('BAD_MARKER '+str(p))
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  count+=1;babel='text/babel' in attrs;f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}';f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/out.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: fail.append(f'{p}#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
              count+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: fail.append(f'{p}: {r.stderr}')
          for p in Path('.').glob('*.json'):
              try: json.loads(p.read_text())
              except Exception as e: fail.append(f'JSON {p}: {e}')
          if fail: print('\n'.join(fail));sys.exit(1)
          print('V394_SYNTAX_PASS',count)
          PY

      - name: Verify cart-transfer safety and data retention
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('/tmp/generated-index.html').read_text();cust=Path('/tmp/generated-customer.html').read_text();boot=Path('index.html').read_text();cboot=Path('customer.html').read_text();sw=Path('customer-sw.js').read_text();vercel=Path('vercel.json').read_text()
          persist=idx.index('localStorage.setItem(cartKey,JSON.stringify(merged))')
          clear_transfer=idx.find('localStorage.removeItem(EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY)',persist)
          clear_source=idx.find("localStorage.removeItem('customer_guest_cart_v1')",persist)
          if persist<0 or clear_transfer<0 or clear_source<0 or not (persist<clear_transfer and persist<clear_source): raise SystemExit('FAIL destructive clear before durable employee cart write')
          start=cust.index('function handoffEmployeeCustomerCart(cartItems,branches)');end=cust.index('function CustomerApp(',start) if 'function CustomerApp(' in cust[start:] else len(cust);helper=cust[start:end]
          checks={
            'source cart not cleared by handoff': "removeItem('customer_guest_cart_v1')" not in helper,
            'primary and backup transfer written': 'EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY' in helper and 'EMPLOYEE_CUSTOMER_CART_TRANSFER_BACKUP_KEY' in helper,
            'employee identity carried': 'employeeName' in helper and 'employeeId' in helper,
            'branch allocation carried': 'branchQuantities' in helper and 'branches:safeBranches' in helper,
            'warehouse resolution': 'chooseEmployeeCustomerTransferWarehouse' in idx,
            'same employee only': 'sameId' in idx and 'sameName' in idx,
            'retry idempotency': 'transferIds' in idx and 'appliedKey' in idx,
            'overstock approval blocked': 'stockConflicts' in idx,
            'Firestore transfer metadata': 'customerTransfer: i.customerTransferMeta || null' in idx,
            'runtime fallback employee': 'FALLBACK_CORES' in boot and 'CORE_INVALID' in boot,
            'runtime fallback customer': 'FALLBACK_CORES' in cboot and 'CORE_INVALID' in cboot,
            'fresh customer worker': 'v=39.3' in cboot and 'batco-customer-v39-3' in sw,
            'worker isolated from employee docs': 'isDocument && !isCustomerDocument' in sw,
            'Vercel app shell no-store': 'no-store, max-age=0' in vercel and '/runtime/(.*)' in vercel,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('\n'.join('FAIL '+x for x in bad))
          print('V394_TRANSFER_SAFETY_PASS',len(checks))
          PY

      - name: Browser smoke all production HTML routes locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat >/tmp/v394-smoke.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'fs';
          const base='http://127.0.0.1:4173';
          const pages=fs.readdirSync('.').filter(x=>x.endsWith('.html'));
          const browser=await chromium.launch({headless:true});let failed=false;
          for(const file of pages){
            const c=await browser.newContext();const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            try{
              const r=await p.goto(base+'/'+file,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(file==='index.html'||file==='customer.html'?7000:1500);
              const text=await p.locator('body').innerText().catch(()=>''),bootError=await p.locator('.v37err').count().catch(()=>0);
              console.log(file,'status='+r?.status(),'body='+text.replace(/\s+/g,' ').slice(0,120),'pageErrors='+errors.length);
              if(!r||r.status()>=400||text.trim().length<3||bootError){failed=true;console.error('FAIL_ROUTE',file,r?.status(),bootError,errors)}
            }catch(e){failed=true;console.error('FAIL_ROUTE',file,String(e))}
            await c.close();
          }
          await browser.close();if(failed)process.exit(1);
          JS
          node /tmp/v394-smoke.mjs

      - name: Record PASS and clean temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/quality-reports
          cat > .github/quality-reports/v39-4-employee-customer-transfer-audit.txt <<'TXT'
          V39.4 EMPLOYEE CUSTOMER CART + FULL SITE REGRESSION
          result=PASS
          runtime_bootstrap_generation=PASS
          generated_jsx_and_javascript=PASS
          all_html_route_smoke=PASS
          employee_customer_cart_handoff=PASS
          transfer_backup=PASS
          employee_identity_binding=PASS
          idempotent_import=PASS
          source_cart_preserved_until_durable_import=PASS
          branch_distribution_preserved=PASS
          warehouse_resolution=PASS
          overstock_guard=PASS
          customer_service_worker_isolation=PASS
          vercel_no_store_shell=PASS
          TXT
          rm -f .github/workflows/v39-4-regression-verifier.yml
          git config user.name 'BATCO V39.4 Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record V39.4 full regression PASS'
          git push origin main
