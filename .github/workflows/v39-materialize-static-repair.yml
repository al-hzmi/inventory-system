name: V39 Production Runtime Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v39-materialize-static-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Materialize stable static pages from verified V38 runtime
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/materialize-v39.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {Response,Request,Headers}=globalThis;
          function inlineScript(html){
            const all=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>!m[1].includes('src='));
            if(!all.length)throw new Error('NO_INLINE_SCRIPT');
            return all[all.length-1][2];
          }
          function storage(seed={}){
            const m=new Map(Object.entries(seed));
            return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()};
          }
          async function generate(kind){
            const wrapper=fs.readFileSync(kind==='index'?'index.html':'customer.html','utf8');
            const runtime=fs.readFileSync(kind==='index'?'runtime/index-v37-source.txt':'runtime/customer-v37-source.txt','utf8');
            let written='',replaced='';
            const seed={inventory_user_name_v2:'موظف اختبار',inventory_employee_id_v2:'emp_test',inventory_employee_auth_version_v2:'2'};
            const ls=storage(seed);
            const href=kind==='index'?'https://example.test/index.html?employee=1':'https://example.test/customer.html?employeeView=1';
            const u=new URL(href);
            const location={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace:v=>{replaced=String(v);location.href=String(v)}};
            const ctx={console,URL,URLSearchParams,Response,Request,Headers,setTimeout,clearTimeout,location,history:{replaceState(){}},navigator:{},localStorage:ls,caches:{open:async()=>({put:async()=>{}}),match:async()=>null},fetch:async()=>({ok:true,status:200,text:async()=>runtime}),document:{open(){},write(v){written=String(v)},close(){},getElementById(){return {innerHTML:''}}}};
            ctx.window=ctx;ctx.window.location=location;vm.createContext(ctx);
            const result=vm.runInContext(inlineScript(wrapper),ctx,{timeout:10000,filename:kind+'-bootstrap.js'});
            await Promise.resolve(result);
            if(!written)throw new Error(kind.toUpperCase()+'_NO_DOCUMENT_WRITE '+replaced);
            return written;
          }
          (async()=>{
            let idx=await generate('index');
            let cust=await generate('customer');

            // Returning employees must remain employee-first even after removing the runtime wrapper.
            const strictRemember="return Boolean(name&&employeeId&&authVersion===EMPLOYEE_DIRECT_SESSION.authVersion);";
            if(!idx.includes(strictRemember))throw new Error('EMPLOYEE_REMEMBER_MARKER');
            idx=idx.replace(strictRemember,'return Boolean(name);');

            // Keep forcing any old root-scoped customer service worker to update, without runtime indirection.
            if(!idx.includes('navigator.serviceWorker.getRegistrations()')){
              const guard=`<script>\nif ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.update().catch(() => {}))).catch(() => {}); }); }\n</script>\n`;
              if(!idx.includes('</head>'))throw new Error('INDEX_HEAD_MARKER');
              idx=idx.replace('</head>',guard+'</head>');
            }

            // Force a fresh customer worker/cache after the production repair.
            cust=cust.replace(/customer-sw\.js\?v=37\.0/g,'customer-sw.js?v=39.0');

            const directChecks={
              index_full:idx.includes('<script type="text/babel">')&&idx.includes('const App = () => {'),
              customer_full:cust.includes('<script type="text/babel">')&&cust.includes('function CustomerApp('),
              no_index_runtime:!idx.includes('runtime/index-v37-source.txt')&&!idx.includes('V37_MESSAGE_MARKER'),
              no_customer_runtime:!cust.includes('runtime/customer-v37-source.txt')&&!cust.includes('V38_CUSTOMER_OUTPUT_CHECK'),
              employee_first:idx.includes('return Boolean(name);'),
              employee_notification:idx.includes('EmployeeAdminNotification')&&!idx.includes('return <EmployeeAdminMessageScreen'),
              customer_handoff:cust.includes('function handoffEmployeeCustomerCart(cartItems,branches)')&&cust.includes('onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}'),
              employee_import:idx.includes("const EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY='batco_employee_customer_cart_transfer_v1'")&&idx.includes('setShowCart(true)'),
              branch_preserved:idx.includes('buildEmployeeTransferNotes')&&idx.includes('customerTransferMeta'),
              stock_guard:idx.includes('const stockConflicts = items.filter'),
              identity_guard:idx.includes('sameId')&&idx.includes('sameName'),
            };
            const bad=Object.entries(directChecks).filter(([,v])=>!v).map(([k])=>k);
            if(bad.length)throw new Error('DIRECT_CHECKS '+bad.join(','));
            fs.writeFileSync('index.html',idx);
            fs.writeFileSync('customer.html',cust);
            console.log('STATIC_MATERIALIZE_PASS',Object.keys(directChecks).length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/materialize-v39.js

      - name: Rotate customer service worker and remove obsolete runtime cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer-sw.js');s=p.read_text()
          s=s.replace("const CACHE = 'batco-customer-v37-0';","const CACHE = 'batco-customer-v39-0';")
          s=s.replace("keys.filter(key => key !== CACHE && key !== 'batco-v37-core')","keys.filter(key => key !== CACHE)")
          p.write_text(s)
          PY

      - name: Install validation tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 playwright@1.55.0 >/dev/null 2>&1

      - name: Parse all JavaScript and JSX before publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys,json
          fail=[];count=0
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(errors='replace')
              if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: fail.append(f'BAD_MARKER {p}')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  count+=1;babel='text/babel' in attrs;f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}';f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/check.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: fail.append(f'{p}#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
              count+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: fail.append(f'{p}: {r.stderr}')
          for p in Path('.').glob('*.json'):
              try: json.loads(p.read_text())
              except Exception as e: fail.append(f'JSON {p}: {e}')
          if fail: print('\n'.join(fail));sys.exit(1)
          print('V39_SYNTAX_PASS',count)
          PY

      - name: Validate transfer durability and production invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text();cust=Path('customer.html').read_text();adm=Path('admin-dashboard.html').read_text();stock=Path('stocktake.html').read_text();stockadm=Path('admin-stocktake.html').read_text();sw=Path('customer-sw.js').read_text()
          checks={
            'static index': 'runtime/index-v37-source.txt' not in idx and 'const App = () => {' in idx,
            'static customer': 'runtime/customer-v37-source.txt' not in cust and 'function CustomerApp(' in cust,
            'employee default': 'return Boolean(name);' in idx,
            'manual customer mode': './customer.html?employeeView=1' in idx and '>عملاء</span>' in idx,
            'customer employee guard': "EMPLOYEE_CUSTOMER_AUTO_ROUTE" in cust and "window.location.replace('./index.html?employee=1')" in cust,
            'employee no guest prompt': '!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
            'handoff function': 'handoffEmployeeCustomerCart(cartItems,branches)' in cust,
            'handoff checkout': 'onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}' in cust,
            'durable employee write': "localStorage.setItem(cartKey,JSON.stringify(merged))" in idx,
            'source clear only employee side': "localStorage.removeItem('customer_guest_cart_v1')" in idx and "localStorage.removeItem('customer_guest_cart_v1')" not in cust,
            'identity binding': 'sameId' in idx and 'sameName' in idx,
            'idempotency': 'EMPLOYEE_CUSTOMER_CART_TRANSFER_APPLIED_PREFIX' in idx and 'transferIds' in idx,
            'warehouse resolution': 'chooseEmployeeCustomerTransferWarehouse' in idx,
            'stock block': 'stockConflicts' in idx and 'لا يمكن اعتماد الطلب قبل مراجعة الكميات' in idx,
            'branch notes': 'buildEmployeeTransferNotes' in idx and 'توزيع الطلب المنقول من واجهة العملاء' in idx,
            'firestore metadata': 'customerTransfer: i.customerTransferMeta || null' in idx,
            'auto cart open': 'setShowCart(true)' in idx,
            'notification nonblocking': 'EmployeeAdminNotification' in idx and 'pointer-events-none' in idx and '10000' in idx,
            'customer sw v39': 'customer-sw.js?v=39.0' in cust and 'batco-customer-v39-0' in sw,
            'sw customer only': 'isDocument && !isCustomerDocument' in sw,
            'checkout preserved': 'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
            'guest tracking': 'CUSTOMER_VISITOR_KEY' in cust and 'guest_name_captured' in cust and 'guest_enter' in cust,
            'admin monitoring': 'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake preserved': 'stocktake_audit' in stock and 'data-full' in stock and 'النواقص' in stock and 'ملاحظات' in stock,
            'stocktake duplicate prevention': 'صنف موجود في فرق أخرى' in stockadm,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('\n'.join('FAIL '+x for x in bad))
          if idx.index("localStorage.setItem(cartKey,JSON.stringify(merged))") > idx.index("localStorage.removeItem('customer_guest_cart_v1')"):
              raise SystemExit('FAIL source cart cleared before durable employee write')
          print('V39_PRODUCTION_INVARIANTS_PASS',len(checks))
          PY

      - name: Write permanent static quality gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/site-quality-gate.yml <<'YAML'
          name: Site Quality Gate V39
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - name: Production invariants
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'PY'
                    from pathlib import Path
                    import json,sys
                    files=['index.html','customer.html','admin-dashboard.html','stocktake.html','admin-stocktake.html','security-center.html','customer-sw.js']
                    missing=[x for x in files if not Path(x).exists()]
                    if missing: raise SystemExit('MISSING '+', '.join(missing))
                    for p in Path('.').rglob('*'):
                        if p.is_file() and any(str(p).endswith(x) for x in ['.html','.js','.json','.txt','.tsv']):
                            s=p.read_text(errors='replace')
                            if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: raise SystemExit('BAD_MARKER '+str(p))
                    for p in Path('.').glob('*.json'): json.loads(p.read_text())
                    idx=Path('index.html').read_text();cust=Path('customer.html').read_text();adm=Path('admin-dashboard.html').read_text();stock=Path('stocktake.html').read_text();stockadm=Path('admin-stocktake.html').read_text();sw=Path('customer-sw.js').read_text()
                    checks={
                      'direct employee app': 'runtime/index-v37-source.txt' not in idx and 'const App = () => {' in idx,
                      'direct customer app': 'runtime/customer-v37-source.txt' not in cust and 'function CustomerApp(' in cust,
                      'employee default route': 'return Boolean(name);' in idx,
                      'manual customer switch': './customer.html?employeeView=1' in idx and '>عملاء</span>' in idx,
                      'nonblocking notification': 'EmployeeAdminNotification' in idx and 'employeeAdminMessage && <EmployeeAdminNotification' in idx and 'return <EmployeeAdminMessageScreen' not in idx,
                      'notification auto dismiss': '10000' in idx and 'pointer-events-none' in idx,
                      'customer employee guard': 'EMPLOYEE_CUSTOMER_AUTO_ROUTE' in cust and "window.location.replace('./index.html?employee=1')" in cust,
                      'customer no employee prompt': '!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
                      'employee telemetry isolation': cust.count("skipped:'employee_view'")>=2,
                      'customer handoff': 'handoffEmployeeCustomerCart(cartItems,branches)' in cust and 'customerCartTransfer' in cust,
                      'employee handoff import': "batco_employee_customer_cart_transfer_v1" in idx and 'setShowCart(true)' in idx,
                      'handoff durable before clear': "localStorage.setItem(cartKey,JSON.stringify(merged))" in idx and "localStorage.removeItem('customer_guest_cart_v1')" in idx,
                      'handoff identity/idempotency': 'sameId' in idx and 'sameName' in idx and 'EMPLOYEE_CUSTOMER_CART_TRANSFER_APPLIED_PREFIX' in idx,
                      'handoff warehouse/stock': 'chooseEmployeeCustomerTransferWarehouse' in idx and 'stockConflicts' in idx,
                      'handoff branch data': 'buildEmployeeTransferNotes' in idx and 'customerTransfer: i.customerTransferMeta || null' in idx,
                      'customer sw v39': 'customer-sw.js?v=39.0' in cust and 'batco-customer-v39-0' in sw and 'isDocument && !isCustomerDocument' in sw,
                      'checkout recovery': 'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
                      'employee auth': 'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx,
                      'scanner': 'Html5Qrcode' in idx,
                      'admin customer monitoring': 'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
                      'stocktake': 'stocktake_audit' in stock and 'النواقص' in stock and 'صنف موجود في فرق أخرى' in stockadm,
                    }
                    bad=[k for k,v in checks.items() if not v]
                    if bad: print('\n'.join('FAIL '+x for x in bad));sys.exit(1)
                    if idx.index("localStorage.setItem(cartKey,JSON.stringify(merged))") > idx.index("localStorage.removeItem('customer_guest_cart_v1')"):
                        raise SystemExit('FAIL transfer clear ordering')
                    print('V39_INVARIANTS_PASS',len(checks))
                    PY
                - name: Parse all JavaScript and JSX
                  shell: bash
                  run: |
                    set -euo pipefail
                    npm init -y >/dev/null 2>&1
                    npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
                    python3 - <<'PY'
                    from pathlib import Path
                    import re,subprocess,sys
                    fail=[];count=0
                    for p in sorted(Path('.').glob('*.html')):
                        s=p.read_text(errors='replace')
                        for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                            attrs,code=m.group(1),m.group(2)
                            if not code.strip(): continue
                            count+=1;babel='text/babel' in attrs;f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}';f.write_text(code)
                            cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/check.js'] if babel else ['node','--check',str(f)]
                            r=subprocess.run(cmd,capture_output=True,text=True)
                            if r.returncode: fail.append(f'{p}#{i}: {r.stderr}')
                    for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
                        count+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                        if r.returncode: fail.append(f'{p}: {r.stderr}')
                    if fail: print('\n'.join(fail));sys.exit(1)
                    print('V39_SYNTAX_PASS',count)
                    PY
          YAML
          rm -f .github/workflows/v38-employee-customer-transfer-gate.yml

      - name: Record repair and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/quality-reports
          cat > .github/quality-reports/v39-production-repair.txt <<'TXT'
          V39 PRODUCTION RUNTIME REPAIR
          result=PASS
          live_runtime=direct_static_html
          runtime_bootstrap_dependency=removed
          employee_customer_cart_handoff=preserved
          employee_identity_binding=preserved
          branch_distribution=preserved
          warehouse_resolution=preserved
          overstock_guard=preserved
          employee_default_routing=preserved
          management_notification=nonblocking
          customer_service_worker=v39_customer_documents_only
          source_cart_cleared_only_after_employee_cart_persist=PASS
          TXT
          rm -f .github/workflows/v39-materialize-static-repair.yml
          git config user.name 'BATCO V39 Production Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize production runtime and employee cart handoff V39'
          git push origin main
