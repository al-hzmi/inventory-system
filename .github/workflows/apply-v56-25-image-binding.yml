name: Apply V56.25 Image Binding Safety

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-25-image-binding.py'
      - '.github/scripts/v56-25-patcher-adapter.py'
      - '.github/scripts/v56-25-customer-image-identity.py'
      - '.github/workflows/apply-v56-25-image-binding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'V56.25 — unified image identity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapt employee patcher to current runtime
        run: python .github/scripts/v56-25-patcher-adapter.py
      - name: Apply employee image identity and admin repair
        run: python .github/scripts/v56-25-image-binding.py
      - name: Apply customer image identity
        run: python .github/scripts/v56-25-customer-image-identity.py
      - name: Unified image identity regression
        run: |
          python - <<'PY'
          from pathlib import Path
          employee=Path('runtime/index-v37-source.txt').read_text(encoding='utf-8')
          customer=Path('runtime/customer-v37-source.txt').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          customer_wrapper=Path('customer.html').read_text(encoding='utf-8')
          manifest=Path('data/images_list.txt').read_text(encoding='utf-8')

          employee_required=[
            "const normalizeImageSku = raw =>",
            "const buildImageCollisionIndex = databases =>",
            "const resolveImageForItem = (imagesMap, item, collisionIndex, overrides = {}) =>",
            "if (owners.size !== 1) return '';",
            "const ProductImageBindingManager = memo",
            "const IMAGE_BINDING_DOC = 'product_image_bindings';",
            "{ id: 'product_images', label: 'ربط الصور', icon: Icon.Camera },",
            "if (['product_categories','product_images'].includes(activeTab)) {",
          ]
          missing=[x for x in employee_required if x not in employee]
          assert not missing, f'Missing employee contracts: {missing}'
          assert 'imagesList.get(' not in employee
          assert './runtime/index-v37-source.txt?v=56.25' in index

          customer_required=[
            'V56.25 customer image identity — exact SKU first; numeric fallback only when unique.',
            'const normalizeImageSku = raw =>',
            'buildCustomerImageCollisionIndex',
            'loadCustomerImageBindings',
            "doc('product_image_bindings')",
            'resolveCustomerImage',
            'owners.size!==1',
          ]
          missing=[x for x in customer_required if x not in customer]
          assert not missing, f'Missing customer contracts: {missing}'
          assert 'images.has(x.cleanId)' not in customer
          assert 'images.get(x.cleanId)' not in customer
          assert './runtime/customer-v37-source.txt?v=56.25' in customer_wrapper

          assert 'BA_209\t209.webp' in manifest
          assert not any(line=='209\t209.webp' for line in manifest.splitlines())
          # Known regression: the same numeric 209 belongs to two full SKUs, so numeric fallback is forbidden.
          assert ''.join(c for c in 'BA_209' if c.isdigit()) == '209'
          assert ''.join(c for c in 'AR_M209' if c.isdigit()) == '209'
          print('V56.25 unified image identity regression: PASS')
          PY
      - name: Commit verified product repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/index-v37-source.txt index.html runtime/customer-v37-source.txt customer.html data/images_list.txt
          if git diff --cached --quiet; then
            echo 'No product diff to commit.'
            exit 0
          fi
          git commit -m 'V56.25 — unified image identity and admin repair'
          git push origin HEAD:main

# trigger unified rollout v3
