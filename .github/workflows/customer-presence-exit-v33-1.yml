name: Customer Presence Exit V33.1

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/customer_presence_exit_v33_1.py'
      - '.github/workflows/customer-presence-exit-v33-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply presence fix
        run: python3 .github/scripts/customer_presence_exit_v33_1.py
      - name: Validate admin JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('admin-dashboard.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\s+type=["\']text/babel["\']>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/admin.jsx').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'customerSessionOnline' in text
          assert "guest_exit'" in text
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/parser@7.28.3 >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs'),parser=require('@babel/parser');
          parser.parse(fs.readFileSync('/tmp/admin.jsx','utf8'),{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('Admin JSX parsed');
          NODE
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/customer_presence_exit_v33_1.py .github/workflows/customer-presence-exit-v33-1.yml
          git add admin-dashboard.html
          git commit -m 'Make guest exit state visible immediately when recorded'
          git push origin main
