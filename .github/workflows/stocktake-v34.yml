name: Stocktake V34
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stocktake-v34.yml'
permissions:
  contents: write
jobs:
  build-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build stocktake pages and patch integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          stock_b64 = Path('.github/stocktake-v34-stock.b64').read_text().strip()
          admin_b64 = Path('.github/stocktake-v34-admin.b64').read_text().strip()
          Path('stocktake.html').write_bytes(gzip.decompress(base64.b64decode(stock_b64)))
          Path('admin-stocktake.html').write_bytes(gzip.decompress(base64.b64decode(admin_b64)))

          # ---------------- Employee integration ----------------
          index_path = Path('index.html')
          index = index_path.read_text()

          if 'const STOCKTAKE_CONTROL_DOC' not in index:
              marker = "const employeeSiteAccessAllowed = (control, { name = '', employeeId = '', isAdmin = false } = {}) => {"
              if marker not in index:
                  raise SystemExit('index access marker missing')
              helper = r'''const STOCKTAKE_CONTROL_DOC = 'stocktake_feature';
          const DEFAULT_STOCKTAKE_CONTROL = { enabled:false, accessMode:'none', allowedEmployeeIds:[], allowedEmployeeNames:[], activeCampaignId:'' };
          const useStocktakeControl = () => {
              const [control, setControl] = useState(DEFAULT_STOCKTAKE_CONTROL);
              useEffect(() => {
                  let active = true, unsubscribe = null;
                  (async () => {
                      try {
                          const db = await getDb();
                          if (!active) return;
                          unsubscribe = db.collection('system_controls').doc(STOCKTAKE_CONTROL_DOC).onSnapshot(doc => {
                              const raw = doc.exists ? doc.data() : {};
                              if (active) setControl({
                                  ...DEFAULT_STOCKTAKE_CONTROL,
                                  ...raw,
                                  enabled: !!raw.enabled,
                                  accessMode: ['none','admin_only','selected','all'].includes(raw.accessMode) ? raw.accessMode : 'none',
                                  allowedEmployeeIds: Array.isArray(raw.allowedEmployeeIds) ? raw.allowedEmployeeIds : [],
                                  allowedEmployeeNames: Array.isArray(raw.allowedEmployeeNames) ? raw.allowedEmployeeNames : [],
                                  activeCampaignId: String(raw.activeCampaignId || '')
                              });
                          }, () => active && setControl(DEFAULT_STOCKTAKE_CONTROL));
                      } catch (e) { if (active) setControl(DEFAULT_STOCKTAKE_CONTROL); }
                  })();
                  return () => { active = false; if (unsubscribe) unsubscribe(); };
              }, []);
              return control;
          };
          const stocktakeAccessAllowed = (control, { name = '', employeeId = '', isAdmin = false } = {}) => {
              if (isAdmin) return true;
              if (!control?.enabled) return false;
              const mode = control?.accessMode || 'none';
              if (mode === 'all') return true;
              if (mode !== 'selected') return false;
              const ids = new Set(Array.isArray(control?.allowedEmployeeIds) ? control.allowedEmployeeIds : []);
              const names = new Set((Array.isArray(control?.allowedEmployeeNames) ? control.allowedEmployeeNames : []).map(normalizeText));
              return ids.has(employeeId) || names.has(normalizeText(name));
          };

          '''
              index = index.replace(marker, helper + marker, 1)

          app_marker = "    const employeeSiteControl = useEmployeeSiteControl();\n"
          if 'const stocktakeControl = useStocktakeControl();' not in index:
              if app_marker not in index:
                  raise SystemExit('index app marker missing')
              index = index.replace(app_marker, app_marker + "    const stocktakeControl = useStocktakeControl();\n", 1)

          employee_id_marker = "    const currentEmployeeId = localStorage.getItem(STORAGE_KEYS.EMPLOYEE_ID) || '';\n"
          if 'const currentStocktakeAccessAllowed' not in index:
              if employee_id_marker not in index:
                  raise SystemExit('index employee id marker missing')
              index = index.replace(
                  employee_id_marker,
                  employee_id_marker + "    const currentStocktakeAccessAllowed = stocktakeAccessAllowed(stocktakeControl,{name:sessionName,employeeId:currentEmployeeId,isAdmin});\n",
                  1
              )

          if "window.location.href = './stocktake.html'" not in index:
              admin_button = "<button onClick={() => { window.location.href = './admin-dashboard.html'; }} title=\"لوحة التحكم الإدارية\""
              button_pos = index.find(admin_button)
              if button_pos < 0:
                  raise SystemExit('admin toolbar button missing')
              block_pos = index.rfind('{isAdmin && (', 0, button_pos)
              if block_pos < 0:
                  raise SystemExit('admin toolbar block missing')
              line_start = index.rfind('\n', 0, block_pos) + 1
              indent = index[line_start:block_pos]
              stock_btn = f'''{indent}{{currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId && (
          {indent}    <button onClick={{() => {{ window.location.href = './stocktake.html'; }}}} title="فتح الجرد"
          {indent}            className="flex items-center justify-center gap-7 h-48 px-12 rounded-12 bg-successSoft border border-success/20 text-success hover:bg-success hover:text-white transition-colors animate-flip">
          {indent}        <Icon.Archive className="w-20 h-20" />
          {indent}        <span className="hidden md:inline text-[12px] font-bold whitespace-nowrap">الجرد</span>
          {indent}    </button>
          {indent})}}
          '''
              index = index[:line_start] + stock_btn + index[line_start:]

          index_path.write_text(index)

          # ---------------- Admin dashboard integration ----------------
          admin_path = Path('admin-dashboard.html')
          admin = admin_path.read_text()
          if "window.location.href='./admin-stocktake.html'" not in admin:
              needle = 'فتح مركز العملاء ←</div></button>'
              pos = admin.find(needle)
              if pos < 0:
                  raise SystemExit('admin customer card marker missing')
              insert_at = pos + len(needle)
              stock_admin_card = '''
          <button onClick={()=>{window.location.href='./admin-stocktake.html'}} className="md:col-span-2 bg-white border border-border rounded-2xl p-5 text-right shadow-card hover:border-[#D6D3D1] press"><div className="flex items-start justify-between"><div className="w-12 h-12 rounded-2xl bg-successSoft text-success flex items-center justify-center"><Icon name="file" className="w-6 h-6"/></div><Pill tone="info">موسمي</Pill></div><h3 className="text-lg font-bold mt-5">إدارة الجرد</h3><p className="text-[11px] text-secondary mt-1 leading-5">حملات الجرد، الفرق، رفع ملفات Excel، صلاحيات الموظفين، النواقص، الملاحظات وسجل التعديلات.</p><div className="text-[11px] text-accent font-bold mt-5">فتح مركز الجرد ←</div></button>'''
              admin = admin[:insert_at] + stock_admin_card + admin[insert_at:]
          admin_path.write_text(admin)
          PY

      - name: Syntax and invariant checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for fn in ['stocktake.html','admin-stocktake.html']:
              s = Path(fn).read_text()
              st = s.rfind('<script>')
              en = s.rfind('</script>')
              if st < 0 or en <= st:
                  raise SystemExit(fn + ' script extraction failed')
              st += len('<script>')
              Path('/tmp/' + fn + '.js').write_text(s[st:en])

          for fn in ['index.html','admin-dashboard.html']:
              s = Path(fn).read_text()
              marker = '<script type="text/babel">'
              st = s.find(marker)
              en = s.rfind('</script>')
              if st < 0 or en <= st:
                  raise SystemExit(fn + ' babel extraction failed')
              st += len(marker)
              Path('/tmp/' + fn + '.jsx').write_text(s[st:en])
          PY

          node --check /tmp/stocktake.html.js
          node --check /tmp/admin-stocktake.html.js
          npx --yes esbuild@0.25.9 /tmp/index.html.jsx --loader:.jsx=jsx --outfile=/tmp/index-check.js >/dev/null
          npx --yes esbuild@0.25.9 /tmp/admin-dashboard.html.jsx --loader:.jsx=jsx --outfile=/tmp/admin-check.js >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          stock = Path('stocktake.html').read_text()
          admin_stock = Path('admin-stocktake.html').read_text()
          index = Path('index.html').read_text()
          admin = Path('admin-dashboard.html').read_text()

          checks = {
              'employee feature control': 'stocktake_feature' in stock,
              'employee audit': 'stocktake_audit' in stock,
              'employee complete action': 'data-full' in stock and 'كاملة' in stock,
              'employee shortages filter': 'النواقص' in stock,
              'employee notes filter': 'ملاحظات' in stock,
              'admin selected access': "accessMode:'selected'" in admin_stock or "accessMode: 'selected'" in admin_stock,
              'admin excel import guard': 'الاستيراد متاح قبل بدء الحملة فقط' in admin_stock,
              'admin duplicate conflict guard': 'conflicts.length' in admin_stock,
              'admin audit view': 'stocktake_audit' in admin_stock,
              'index hook': 'currentStocktakeAccessAllowed' in index and './stocktake.html' in index,
              'dashboard link': './admin-stocktake.html' in admin,
              'currency compatibility': '⃁' not in stock and '⃁' not in admin_stock,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('Invariant checks failed: ' + ', '.join(bad))
          print('All stocktake invariants passed')
          PY

      - name: Commit verified stocktake module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BATCO Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/stocktake-v34-stock.b64
          rm -f .github/stocktake-v34-admin.b64
          rm -f .github/placeholder.tmp
          rm -f .github/workflows/stocktake-v34.yml
          git add -A
          git commit -m "Add controlled year-end stocktake module V34"
          git push origin main
