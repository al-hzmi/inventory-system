name: V39.4 Repair Generated Employee Runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v39-4-fix-generated-index.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair generated runtime and self-report
        shell: bash
        run: |
          set +e
          mkdir -p .github/quality-reports
          REPORT=.github/quality-reports/v39-4-runtime-repair.txt
          echo 'V39.4 EMPLOYEE RUNTIME REPAIR' > "$REPORT"
          git pull --rebase origin main >/tmp/pull.log 2>&1
          PULL=$?
          echo "pre_patch_pull_exit=$PULL" >> "$REPORT"

          python3 - <<'PY' >/tmp/patch.log 2>&1
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          broken="return lines.length>1?lines.join('\\n'):'';"
          fixed="return lines.length>1?lines.join('\\\\n'):'';"
          bc=s.count(broken);fc=s.count(fixed)
          print('broken_count',bc,'fixed_count',fc)
          if bc==1:
              p.write_text(s.replace(broken,fixed,1))
              print('PATCH_APPLIED')
          elif bc==0 and fc>=1:
              print('ALREADY_PATCHED')
          else:
              raise SystemExit('UNEXPECTED_ESCAPE_STATE')
          PY
          PATCH=$?
          cat /tmp/patch.log >> "$REPORT"
          echo "patch_exit=$PATCH" >> "$REPORT"

          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/tmp/npm.log 2>&1
          NPM=$?
          echo "validator_install_exit=$NPM" >> "$REPORT"

          cat > ./v394-runtime-check.js <<'NODE'
          const fs=require('fs'),vm=require('vm');const {Response,Request,Headers,AbortController}=globalThis;
          const wrapper=fs.readFileSync('index.html','utf8'),runtime=fs.readFileSync('runtime/index-v37-source.txt','utf8');
          const scripts=[...wrapper.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(x=>!x[1].includes('src='));
          if(!scripts.length)throw Error('NO_WRAPPER_SCRIPT');
          let out='';const u=new URL('https://x.local/index.html?employee=1');
          const m=new Map([['inventory_user_name_v2','موظف اختبار'],['inventory_employee_id_v2','emp_test'],['inventory_employee_auth_version_v2','2']]);
          const localStorage={getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()};
          const sessionStorage={getItem:()=>null,setItem(){},removeItem(){},clear(){}};
          const loc={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace(v){this.href=String(v)}};
          const ctx={console,URL,URLSearchParams,Response,Request,Headers,AbortController,setTimeout,clearTimeout,location:loc,history:{replaceState(){}},navigator:{serviceWorker:{getRegistrations:async()=>[]}},localStorage,sessionStorage,caches:{open:async()=>({put:async()=>{}}),match:async()=>null},fetch:async()=>new Response(runtime,{status:200}),document:{open(){},write(v){out=String(v)},close(){},getElementById(){return{innerHTML:''}}}};ctx.window=ctx;vm.createContext(ctx);
          (async()=>{await Promise.resolve(vm.runInContext(scripts.at(-1)[2],ctx,{timeout:12000}));if(!out)throw Error('NO_GENERATED_INDEX');fs.writeFileSync('/tmp/generated-index.html',out);const checks={app:out.includes('const App = () => {'),transfer:out.includes('readEmployeeCustomerCartTransfer'),autoOpen:out.includes('setShowCart(true)'),stockGuard:out.includes('stockConflicts'),nonblocking:out.includes('EmployeeAdminNotification')&&!out.includes('return <EmployeeAdminMessageScreen')};for(const[k,v]of Object.entries(checks))console.log(v?'PASS':'FAIL',k);if(Object.values(checks).some(v=>!v))throw Error('GENERATED_INVARIANT');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node ./v394-runtime-check.js >/tmp/runtime.log 2>&1
          RUNTIME=$?
          cat /tmp/runtime.log >> "$REPORT"
          echo "runtime_generation_exit=$RUNTIME" >> "$REPORT"

          if [ $NPM -eq 0 ] && [ $RUNTIME -eq 0 ]; then
            python3 - <<'PY' >/tmp/parse.log 2>&1
          from pathlib import Path
          import re,subprocess,sys
          s=Path('/tmp/generated-index.html').read_text();bad=[];count=0
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              attrs,code=m.group(1),m.group(2)
              if not code.strip(): continue
              count+=1;f=Path('/tmp')/f'generated-index-{i}.{"jsx" if "text/babel" in attrs else "js"}';f.write_text(code)
              cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/generated-index-out.js'] if 'text/babel' in attrs else ['node','--check',str(f)]
              r=subprocess.run(cmd,capture_output=True,text=True)
              if r.returncode: bad.append(r.stderr)
          if bad: print('\n'.join(bad));sys.exit(1)
          print('GENERATED_INDEX_SYNTAX_PASS',count)
          PY
            PARSE=$?
          else PARSE=1; echo 'prerequisite failed' >/tmp/parse.log; fi
          cat /tmp/parse.log >> "$REPORT"
          echo "generated_parse_exit=$PARSE" >> "$REPORT"

          if [ $PULL -eq 0 ] && [ $PATCH -eq 0 ] && [ $NPM -eq 0 ] && [ $RUNTIME -eq 0 ] && [ $PARSE -eq 0 ]; then
            echo 'result=PASS' >> "$REPORT"
          else
            echo 'result=FAIL' >> "$REPORT"
          fi
          cat "$REPORT"

          rm -f ./v394-runtime-check.js
          if grep -q 'result=PASS' "$REPORT"; then
            rm -f .github/workflows/v39-4-fix-generated-index.yml
            git config user.name 'BATCO V39.4 Runtime Repair'
            git config user.email 'actions@users.noreply.github.com'
            git add index.html .github/quality-reports/v39-4-runtime-repair.txt .github/workflows/v39-4-fix-generated-index.yml
            git commit -m 'Fix generated employee runtime syntax V39.4'
            git pull --rebase origin main
            git push origin main
            exit $?
          else
            git config user.name 'BATCO V39.4 Runtime Diagnostic'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/quality-reports/v39-4-runtime-repair.txt
            git commit -m 'Record V39.4 runtime repair failure' || true
            git pull --rebase origin main || true
            git push origin main || true
            exit 1
          fi
