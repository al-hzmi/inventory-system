name: V39.4 Repair Generated Employee Runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v39-4-fix-generated-index.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, execute and validate generated employee app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          old="return lines.length>1?lines.join('\\n'):'';"
          new="return lines.length>1?lines.join('\\\\n'):'';"
          count=s.count(old)
          if count!=1: raise SystemExit(f'EXPECTED_ONE_NEWLINE_MARKER got={count}')
          p.write_text(s.replace(old,new,1))
          print('PATCHED_GENERATED_NEWLINE_ESCAPE')
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
          cat > /tmp/verify-index.js <<'NODE'
          const fs=require('fs'),vm=require('vm');const {Response,Request,Headers,AbortController}=globalThis;
          const wrapper=fs.readFileSync('index.html','utf8'),runtime=fs.readFileSync('runtime/index-v37-source.txt','utf8');
          const scripts=[...wrapper.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(x=>!x[1].includes('src='));
          let out='';const u=new URL('https://x.local/index.html?employee=1');
          const m=new Map([['inventory_user_name_v2','موظف اختبار'],['inventory_employee_id_v2','emp_test'],['inventory_employee_auth_version_v2','2']]);
          const storage={getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()};
          const loc={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace(v){this.href=String(v)}};
          const ctx={console,URL,URLSearchParams,Response,Request,Headers,AbortController,setTimeout,clearTimeout,location:loc,history:{replaceState(){}},navigator:{serviceWorker:{getRegistrations:async()=>[]}},localStorage:storage,sessionStorage:storage,caches:{open:async()=>({put:async()=>{}}),match:async()=>null},fetch:async()=>new Response(runtime,{status:200}),document:{open(){},write(v){out=String(v)},close(){},getElementById(){return{innerHTML:''}}}};ctx.window=ctx;vm.createContext(ctx);
          (async()=>{await Promise.resolve(vm.runInContext(scripts.at(-1)[2],ctx,{timeout:12000}));if(!out)throw Error('NO_GENERATED_INDEX');fs.writeFileSync('/tmp/generated-index.html',out);if(!out.includes('const App = () => {')||!out.includes('setShowCart(true)')||!out.includes('stockConflicts'))throw Error('GENERATED_INVARIANT');console.log('GENERATED_INDEX_OK')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify-index.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          s=Path('/tmp/generated-index.html').read_text();bad=[]
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
            attrs,code=m.group(1),m.group(2)
            if not code.strip(): continue
            f=Path('/tmp')/f'generated-index-{i}.{"jsx" if "text/babel" in attrs else "js"}';f.write_text(code)
            cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/generated-index-out.js'] if 'text/babel' in attrs else ['node','--check',str(f)]
            r=subprocess.run(cmd,capture_output=True,text=True)
            if r.returncode: bad.append(r.stderr)
          if bad: print('\n'.join(bad));sys.exit(1)
          print('GENERATED_INDEX_SYNTAX_PASS')
          PY
          rm -f .github/workflows/v39-4-fix-generated-index.yml
          git config user.name 'BATCO V39.4 Runtime Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/v39-4-fix-generated-index.yml
          git commit -m 'Fix generated employee runtime newline escape V39.4'
          git pull --rebase origin main
          git push origin main
