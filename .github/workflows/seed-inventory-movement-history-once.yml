name: Seed inventory movement history once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-inventory-movement-history-once.yml'

permissions:
  contents: write

concurrency:
  group: seed-inventory-movement-history
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate movement history
        run: python3 tools/generate-inventory-analytics.py

      - name: Validate generated movement history
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/inventory-analytics.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('schemaVersion') == 2
          assert isinstance(data.get('events'), list)
          for branch in ('jeddah', 'riyadh'):
              cur = data.get('current', {}).get(branch, {})
              assert cur.get('skuCount', 0) > 20, (branch, cur)
          changes = sum(len(e.get('changes', [])) for e in data['events'])
          print(f"events={len(data['events'])} changes={changes}")
          assert len(data['events']) > 0, 'No inventory history events were generated'
          assert changes > 0, 'No inventory movements were generated'
          PY

      - name: Commit seeded history and remove one-shot workflow
        run: |
          rm .github/workflows/seed-inventory-movement-history-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Seed inventory movement history'
          git pull --rebase origin main
          git push origin HEAD:main
