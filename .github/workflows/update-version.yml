name: BATCO Employee Messages V31 Runner

on:
  push:
    paths:
      - '.github/workflows/update-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply employee messages patch
        run: python3 .github/scripts/employee_messages_patch_v31.py

      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add employee one-time and scheduled in-app messages"
          git push origin HEAD:main
