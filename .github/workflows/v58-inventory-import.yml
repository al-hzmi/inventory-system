name: V58 Inventory Import Regression
on:
  push:
    branches: [main]
    paths:
      - 'api/inventory-import.js'
      - 'vercel.json'
      - 'inventory-import-ui.js'
      - 'v59-admin-import-ui.js'
      - 'pdf-inventory-import.js'
      - 'tests/v112-pdf-inventory-import.cjs'
      - 'tests/v113-inventory-truth-and-archive.cjs'
      - 'tests/v114-daily-inventory-snapshot.cjs'
      - 'runtime/index-v37-source.txt'
      - 'v59-admin-import.css'
      - 'admin-inventory-import.html'
      - 'tests/v58-inventory-import.mjs'
      - 'tests/v60-inventory-import-version.mjs'
      - '.github/workflows/v58-inventory-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test full inventory and pricing TSV formats
        run: |
          node --check api/inventory-import.js
          node --check inventory-import-ui.js
          node --check v59-admin-import-ui.js
          node --check pdf-inventory-import.js
          node tests/v112-pdf-inventory-import.cjs
          node tests/v113-inventory-truth-and-archive.cjs
          node tests/v114-daily-inventory-snapshot.cjs
          grep -q 'v59-admin-import-ui.js?v=114.0' admin-inventory-import.html
          grep -q 'v59-admin-import.css?v=114.0' admin-inventory-import.html
          grep -q 'v59-review' v59-admin-import-ui.js
          node tests/v58-inventory-import.mjs
          node tests/v60-inventory-import-version.mjs
          node -e "const c=require('./vercel.json');for(const p of ['/data/version.json','/data/jeddah.tsv','/data/riyadh.tsv','/data/pricing.tsv']){if(!c.headers.some(e=>e.source===p&&e.headers.some(h=>h.key==='Cache-Control'&&h.value.includes('no-store'))))process.exitCode=1}"
          git diff --check
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify importer responds in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsSL --connect-timeout 5 --max-time 12 -H 'Cache-Control: no-cache' "https://inventory-system-coral-nu.vercel.app/api/inventory-import?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if echo "$body" | grep -Fq '"version":"v114-authoritative-daily-snapshot"' && echo "$body" | grep -Fq '"configured":true'; then
              echo 'Production inventory importer is configured and serving V114: PASS'
              exit 0
            fi
            echo "Waiting for production importer (attempt $attempt/24)"
            sleep 10
          done
          echo 'Production import endpoint did not become ready'
          exit 1
