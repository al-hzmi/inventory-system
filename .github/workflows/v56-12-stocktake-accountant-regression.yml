name: V56.12 Stocktake Accountant Regression

on:
  push:
    branches: [main]
    paths:
      - 'admin-stocktake.html'
      - 'stocktake-accountant.html'
      - 'stocktake.html'
      - 'runtime/index-v37-source.txt'
      - 'runtime/v56-12-production-probe.txt'
      - 'index.html'
      - 'tests/v56-3-stocktake-test-mode.mjs'
      - 'tests/v56-12-stocktake-accountant.mjs'
      - '.github/workflows/v56-12-stocktake-accountant-regression.yml'
      - '.github/v56-12-production-redeploy.txt'
  pull_request:
    paths:
      - 'admin-stocktake.html'
      - 'stocktake-accountant.html'
      - 'stocktake.html'
      - 'runtime/index-v37-source.txt'
      - 'index.html'
      - 'tests/v56-3-stocktake-test-mode.mjs'
      - 'tests/v56-12-stocktake-accountant.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Full test stocktake regression
        run: node tests/v56-3-stocktake-test-mode.mjs

      - name: Accountant and full-inventory regression
        run: node tests/v56-12-stocktake-accountant.mjs

      - name: JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          for src,out in [('stocktake-accountant.html','/tmp/accountant.js'),('admin-stocktake.html','/tmp/admin-stocktake.js')]:
              text=pathlib.Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', text)
              pathlib.Path(out).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/accountant.js
          node --check /tmp/admin-stocktake.js

      - name: Verify live production provenance and V56.12 assets
        if: github.event_name == 'push'
        env:
          PROD: https://inventory-system-coral-nu.vercel.app
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-12-production-probe.txt)"
          matched=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-12-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "Production probe matched current main."
              matched=1
              break
            fi
            echo "Production has not reached the current probe yet (attempt $attempt)."
            sleep 10
          done
          test "$matched" = "1" || { echo '::error::Production alias did not reach current main.'; exit 1; }

          nonce="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/?verify=$nonce" -o /tmp/prod-index.html
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/runtime/index-v37-source.txt?verify=$nonce" -o /tmp/prod-runtime.txt
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/stocktake.html?v=56.12&verify=$nonce" -o /tmp/prod-stocktake.html
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/stocktake-accountant.html?v=56.12&verify=$nonce" -o /tmp/prod-accountant.html
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/admin-stocktake.html?verify=$nonce" -o /tmp/prod-admin.html

          cmp -s index.html /tmp/prod-index.html || { echo '::error::Production index differs from main.'; exit 1; }
          cmp -s runtime/index-v37-source.txt /tmp/prod-runtime.txt || { echo '::error::Production runtime differs from main.'; exit 1; }
          cmp -s stocktake.html /tmp/prod-stocktake.html || { echo '::error::Production stocktake differs from main.'; exit 1; }
          cmp -s stocktake-accountant.html /tmp/prod-accountant.html || { echo '::error::Production accountant differs from main.'; exit 1; }
          cmp -s admin-stocktake.html /tmp/prod-admin.html || { echo '::error::Production admin stocktake differs from main.'; exit 1; }

          grep -Fq 'stocktake.html?v=56.12' /tmp/prod-runtime.txt
          grep -Fq 'stocktake-accountant.html?v=56.12' /tmp/prod-runtime.txt
          grep -Fq 'stocktake_accountant_access' /tmp/prod-accountant.html
          grep -Fq 'stocktake_accountant_access' /tmp/prod-admin.html
          grep -Fq 'preview' /tmp/prod-accountant.html
          echo 'Production serves the exact current main V56.12 assets.'

      - name: Diff check
        run: git diff --check
