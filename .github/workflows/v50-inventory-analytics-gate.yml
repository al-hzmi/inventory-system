name: V50 Inventory Analytics Quality Gate

on:
  pull_request:
    paths:
      - 'inventory-analytics.html'
      - 'tools/inventory_analytics.py'
      - 'tools/test_inventory_analytics.py'
      - 'data/inventory-analytics.json'
      - 'v46-admin-nav.js'
      - 'v52-admin.css'
      - '.github/workflows/update-version.yml'
      - '.github/workflows/v50-inventory-analytics-gate.yml'

permissions:
  contents: read

jobs:
  inventory-analytics-v50:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python syntax, incident tests and analytics rebuild
        run: |
          python -m py_compile tools/inventory_analytics.py tools/test_inventory_analytics.py
          python -m unittest tools/test_inventory_analytics.py
          python tools/inventory_analytics.py --repo . --output data/inventory-analytics.json --limit 250
          python - <<'PY'
          import json,os
          d=json.load(open('data/inventory-analytics.json',encoding='utf-8'))
          assert d['schema']==2 and d['eventCount']>=1
          assert d['rawEventCount']==d['eventCount']+d['excludedEventCount']
          assert d['excludedEventCount']>=4
          assert d['current']['jeddah']['skuCount']>0 and d['current']['riyadh']['skuCount']>0
          assert all('summary' in e and 'changes' in e for e in d['events'])
          assert all(c['delta']!=0 for e in d['events'] for c in e['changes'])
          assert all(float(t.get('quantityRatio',1))>=0.70 for t in d.get('transferCandidates',[]))
          excluded=d.get('excludedEvents',[])
          assert all(e.get('analyticsExcluded') is True and e.get('exclusionType') and e.get('exclusionReason') for e in excluded)
          required={
            '0047432de994a04c3da176a1981996a01cc551b6',
            '216f77727a9f8657521bd31e5606afad2b169d7a',
            '114b085e0f7a4f5d25ffe8f1e694ebfa4ded0540',
            'd1e021d5a0030375c1817c9ed06b4849797bf0ec',
          }
          active_commits={e.get('commit') for e in d['events']}
          excluded_commits={e.get('commit') for e in excluded}
          assert not (required & active_commits), 'confirmed correction incident leaked into active analytics'
          assert required <= excluded_commits, 'confirmed correction incident missing from excluded audit history'
          assert float(d.get('quality',{}).get('excludedOutboundQty') or 0)>9000
          assert os.path.getsize('data/inventory-analytics.json') < 25_000_000
          print('V50_DATA_PASS',d['eventCount'],d['excludedEventCount'],sum(len(e['changes']) for e in d['events']))
          PY
      - name: JavaScript syntax and V52 invariants
        run: |
          node --check v46-admin-nav.js
          python - <<'PY'
          import re
          s=open('inventory-analytics.html',encoding='utf-8').read();blocks=re.findall(r'<script>(.*?)</script>',s,re.S|re.I);assert blocks;open('/tmp/v50-dashboard.js','w',encoding='utf-8').write('\n'.join(blocks))
          for marker in ['المبيعات','جدة','الرياض','inventory-analytics.json','branch-card','sales-chart','transferMatchedQty','saleQty']: assert marker in s, marker
          nav=open('v46-admin-nav.js',encoding='utf-8').read()
          for marker in ["VERSION='52.1'",'v52-sidebar','v52-mobile-nav','./inventory-analytics.html','command-center.html','location.replace']: assert marker in nav, marker
          print('V50_STATIC_PASS')
          PY
          node --check /tmp/v50-dashboard.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser regression desktop and mobile
        run: |
          python -m http.server 4173 >/tmp/v50-http.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');
          const html=fs.readFileSync('inventory-analytics.html','utf8');const match=html.match(/const ADMIN_HASH='([^']+)'/);if(!match)throw new Error('Admin token marker missing');
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const ctx=await browser.newContext({viewport});await ctx.addInitScript(token=>{localStorage.setItem('inventory_user_name_v2','مهند');localStorage.setItem('inventory_admin_token_v2',token)},match[1]);
              const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const started=Date.now();await page.goto('http://127.0.0.1:4173/inventory-analytics.html?qa=1',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.v52-kpi',{timeout:45000});await page.waitForSelector('.branch-card',{timeout:45000});
              const loadMs=Date.now()-started,overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth),kpis=await page.locator('.v52-kpi').count(),charts=await page.locator('.sales-chart svg').count(),branches=await page.locator('.branch-card').count(),shell=await page.locator('#v51-admin-shell').count();
              const text=await page.locator('body').innerText();console.log(viewport,{loadMs,overflow,kpis,charts,branches,shell,errors});
              if(loadMs>20000||overflow>3||kpis<6||charts<2||branches<2||shell!==1||errors.length||!text.includes('جدة')||!text.includes('الرياض'))failed=true;
              for(const label of ['الأصناف','التحويلات','التحديثات','كل التفاصيل']){const b=page.getByRole('button',{name:label,exact:true});await b.evaluate(el=>el.click());await page.waitForTimeout(100)}
              await ctx.close();
            }
            await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
