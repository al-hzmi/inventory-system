name: Site Quality Gate V37
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Structural and business-critical invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          files=['index.html','customer.html','runtime/index-v37-source.txt','runtime/customer-v37-source.txt','admin-dashboard.html','stocktake.html','admin-stocktake.html','security-center.html','customer-sw.js']
          missing=[x for x in files if not Path(x).exists()]
          if missing: raise SystemExit('MISSING: '+', '.join(missing))
          for p in Path('.').rglob('*'):
              if p.is_file() and any(str(p).endswith(x) for x in ['.html','.js','.json','.txt','.tsv']):
                  s=p.read_text(errors='replace')
                  if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: raise SystemExit('BAD_MARKER '+str(p))
          for p in Path('.').glob('*.json'): json.loads(p.read_text())
          boot=Path('index.html').read_text(); custboot=Path('customer.html').read_text(); idx=Path('runtime/index-v37-source.txt').read_text(); cust=Path('runtime/customer-v37-source.txt').read_text(); adm=Path('admin-dashboard.html').read_text(); stock=Path('stocktake.html').read_text(); stockadm=Path('admin-stocktake.html').read_text(); sw=Path('customer-sw.js').read_text()
          checks={
            'employee durable auto-route': "inventory_user_name_v2" in boot and "searchParams.set('employee','1')" in boot and "searchParams.delete('chooser')" in boot,
            'manual customer switch visible': "./customer.html?employeeView=1" in idx and "V37_SWITCH_MARKER" in boot and ">عملاء</span>" in boot,
            'nonblocking management notification': 'EmployeeAdminNotification' in boot and 'employeeAdminMessage && <EmployeeAdminNotification' in boot and 'V37_BLOCKING_MARKER' in boot,
            'notification auto-dismiss': '10000' in boot and 'pointer-events-none' in boot,
            'customer employee direct guard': "employeeName&&params.get('employeeView')!=='1'" in custboot and "location.replace('./index.html?employee=1')" in custboot,
            'customer employee view identity patch': 'return {valid:Boolean(name)' in custboot and "EMPLOYEE_CUSTOMER_SESSION.name||'موظف'" in cust,
            'customer no employee guest prompt': '!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
            'employee telemetry isolation': cust.count("skipped:'employee_view'")>=2,
            'customer SW v37 patch': "customer-sw.js?v=37.0" in custboot and "batco-customer-v37-0" in sw,
            'SW no employee/admin document capture': 'isDocument && !isCustomerDocument' in sw,
            'checkout recovery': 'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
            'guest progressive tracking': 'CUSTOMER_VISITOR_KEY' in cust and 'guest_name_captured' in cust and 'guest_enter' in cust,
            'currency compatibility': 'ر.س' in idx and 'ر.س' in cust and 'ر.س' in adm,
            'employee PBKDF2': 'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_AUTH_VERSION' in idx,
            'employee security photo': 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx and 'face_mesh' in idx,
            'employee notifications source': 'EMPLOYEE_NOTIFICATION_COLLECTION' in idx and 'useEmployeeAdminMessages' in idx,
            'employee access control': 'employeeSiteAccessAllowed' in idx and 'EMPLOYEE_SITE_CONTROL_DOC' in idx,
            'barcode scanner': 'Html5Qrcode' in idx,
            'customer portal control': 'CustomerPortalBootstrap' in cust and 'CUSTOMER_PORTAL_CONTROL_DOC' in cust,
            'admin customer monitoring': 'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake employee gate': 'currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId' in idx,
            'stocktake audit/count': 'stocktake_audit' in stock and 'data-full' in stock and 'النواقص' in stock and 'ملاحظات' in stock,
            'stocktake duplicate prevention': 'صنف موجود في فرق أخرى' in stockadm,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: print('\n'.join('FAIL '+x for x in bad)); sys.exit(1)
          print('STRUCTURAL_BUSINESS_PASS',len(checks))
          PY
      - name: Parse every JavaScript and JSX script
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          sources=list(Path('.').glob('*.html'))+[Path('runtime/index-v37-source.txt'),Path('runtime/customer-v37-source.txt')]
          fail=[];count=0
          for p in sources:
              s=p.read_text(errors='replace')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  count+=1; babel='text/babel' in attrs; f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}';f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/check.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: fail.append(f'{p} script#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
              count+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: fail.append(f'{p}: {r.stderr}')
          if fail: print('\n'.join(fail));sys.exit(1)
          print('SYNTAX_PASS',count)
          PY
      - name: Browser smoke - public, employee, customer switch and all HTML routes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat >.site-smoke.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'fs';
          const base='http://127.0.0.1:4173';
          const employee={inventory_user_name_v2:'اختبار موظف',inventory_employee_id_v2:'audit_employee',inventory_employee_auth_version_v2:'2'};
          const legacy={inventory_user_name_v2:'اختبار قديم'};
          const scenarios=[['public','/index.html',{}],['employee','/index.html',employee],['legacy','/index.html',legacy],['customer-public','/customer.html',{}],['customer-employee-direct','/customer.html',employee],['customer-legacy-direct','/customer.html',legacy],['customer-employee-manual','/customer.html?employeeView=1',employee]];
          const covered=new Set(['index.html','customer.html']);for(const f of fs.readdirSync('.').filter(x=>x.endsWith('.html')))if(!covered.has(f))scenarios.push(['html:'+f,'/'+f,{}]);
          const b=await chromium.launch({headless:true});let fail=false;
          for(const [name,path,store] of scenarios){const c=await b.newContext();await c.addInitScript(s=>{localStorage.clear();sessionStorage.clear();for(const[k,v]of Object.entries(s))localStorage.setItem(k,v)},store);const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));try{const r=await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(5000);const text=await p.locator('body').innerText().catch(()=>''),url=p.url();console.log(name,r?.status(),url,text.replace(/\s+/g,' ').slice(0,180));if(!r||r.status()>=400||text.trim().length<8){fail=true;console.error(name,'basic runtime')};if(name==='public'&&!text.includes('حدد نوع الدخول للمتابعة')){fail=true;console.error('public chooser')};if((name==='employee'||name==='legacy')&&text.includes('حدد نوع الدخول للمتابعة')){fail=true;console.error(name,'employee default failed')};if((name==='customer-employee-direct'||name==='customer-legacy-direct')&&!url.includes('/index.html?employee=1')){fail=true;console.error(name,'customer guard')};if(name==='customer-employee-manual'&&(text.includes('اسمك الكريم')||!text.includes('اختبار موظف')||!text.includes('الموظفين'))){fail=true;console.error('manual employee customer view')};}catch(e){fail=true;console.error(name,e)}await c.close()}
          await b.close();if(fail)process.exit(1);
          JS
          node ./.site-smoke.mjs
