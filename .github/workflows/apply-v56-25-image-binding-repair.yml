name: Apply V56.25 Image Binding Repair

on:
  push:
    paths:
      - '.github/workflows/apply-v56-25-image-binding-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact SKU image binding repair
        shell: python
        run: |
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'MISSING_MARKER:{label}')
              return text.replace(old, new, 1)

          # 1) Correct the known 209 assignment explicitly: 209.webp belongs to BA_209, not AR_M209.
          p = Path('data/images_list.txt')
          images = p.read_text(encoding='utf-8')
          images = re.sub(r'(?m)^209\t209\.webp$', 'BA_209\t209.webp', images)
          if 'BA_209\t209.webp' not in images:
              raise SystemExit('V56_25_209_BINDING_NOT_FOUND')
          p.write_text(images, encoding='utf-8')

          # 2) Employee runtime: preserve exact alphanumeric SKU identity for image matching only.
          p = Path('runtime/index-v37-source.txt')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              'const normalizeCleanId = (str) => { if (!str) return ""; return toEnglishDigits(str).replace(/\\D/g, ""); };',
              'const normalizeCleanId = (str) => { if (!str) return ""; return toEnglishDigits(str).replace(/\\D/g, ""); };\nconst normalizeSkuKey = (str) => { if (!str) return ""; return toEnglishDigits(String(str)).trim().toUpperCase().replace(/[^A-Z0-9]/g, ""); };',
              'employee-normalize-sku')
          s = must_replace(s,
              'uid: `${warehouseKey}:${searchId}`, warehouseKey, id: rawId, searchId, cleanId: cleanId,',
              'uid: `${warehouseKey}:${searchId}`, warehouseKey, id: rawId, searchId, cleanId: cleanId, skuKey: normalizeSkuKey(rawId),',
              'employee-item-sku-key')
          old = '''const buildImagesMap = (imagesText) => {
    const map = new Map();
    String(imagesText || '').split(/\\r?\\n/).forEach((line) => {
        const raw = line.trim();
        if (!raw || raw.startsWith('#')) return;
        const parts = raw.split(/\\t/);
        let clean = '', fileName = '';
        if (parts.length >= 2) {
            clean = normalizeCleanId(parts[0]);
            fileName = parts.slice(1).join('\\t').trim();
        } else {
            fileName = raw;
            const base = fileName.split('/').pop().split('?')[0];
            clean = normalizeCleanId(base.replace(/\\.[^.]+$/, ''));
        }
        if (clean && fileName) map.set(clean, fileName);
    });
    return map;
};'''
          new = '''const buildImagesMap = (imagesText) => {
    const map = new Map();
    String(imagesText || '').split(/\\r?\\n/).forEach((line) => {
        const raw = line.trim();
        if (!raw || raw.startsWith('#')) return;
        const parts = raw.split(/\\t/);
        let sourceKey = '', fileName = '';
        if (parts.length >= 2) {
            sourceKey = parts[0].trim();
            fileName = parts.slice(1).join('\\t').trim();
        } else {
            fileName = raw;
            const base = fileName.split('/').pop().split('?')[0];
            sourceKey = base.replace(/\\.[^.]+$/, '');
        }
        if (!sourceKey || !fileName) return;
        const exact = normalizeSkuKey(sourceKey);
        const numeric = normalizeCleanId(sourceKey);
        if (/[A-Za-z]/.test(sourceKey) && exact) map.set('sku:' + exact, fileName);
        else if (numeric) map.set('num:' + numeric, fileName);
    });
    return map;
};
const getImageForItem = (imagesMap, item) => {
    if (!imagesMap || !item) return '';
    const exact = normalizeSkuKey(item.skuKey || item.id || item.searchId || '');
    if (exact && imagesMap.has('sku:' + exact)) return imagesMap.get('sku:' + exact) || '';
    const numeric = normalizeCleanId(item.cleanId || item.id || '');
    return numeric ? (imagesMap.get('num:' + numeric) || '') : '';
};'''
          s = must_replace(s, old, new, 'employee-images-map')
          s, n_has = re.subn(r'imagesList\.has\(([A-Za-z_$][A-Za-z0-9_$]*)\.cleanId\)', r'Boolean(getImageForItem(imagesList,\1))', s)
          s, n_get = re.subn(r'imagesList\.get\(([A-Za-z_$][A-Za-z0-9_$]*)\.cleanId\)', r'getImageForItem(imagesList,\1)', s)
          if n_has < 1 or n_get < 1:
              raise SystemExit(f'EMPLOYEE_IMAGE_LOOKUP_PATCH_INCOMPLETE:{n_has}:{n_get}')
          if re.search(r'imagesList\.(?:has|get)\([A-Za-z_$][A-Za-z0-9_$]*\.cleanId\)', s):
              raise SystemExit('EMPLOYEE_LEGACY_IMAGE_LOOKUP_REMAINS')
          p.write_text(s, encoding='utf-8')

          # 3) Customer runtime: same exact-image identity without changing pricing/category numeric IDs.
          p = Path('runtime/customer-v37-source.txt')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              "const normalizeCleanId = s => toEnglishDigits(s).replace(/\\D/g,'');",
              "const normalizeCleanId = s => toEnglishDigits(s).replace(/\\D/g,'');\nconst normalizeSkuKey = s => toEnglishDigits(String(s??'')).trim().toUpperCase().replace(/[^A-Z0-9]/g,'');",
              'customer-normalize-sku')
          s = must_replace(s,
              "map.set(cleanId,{cleanId,id,name:nameIdx>=0?(c[nameIdx]||''):'',qty:Number.isFinite(q)?q:0,unit:unitIdx>=0?(c[unitIdx]||''):'',pack:packIdx>=0?(c[packIdx]||''):''});",
              "map.set(cleanId,{cleanId,skuKey:normalizeSkuKey(id),id,name:nameIdx>=0?(c[nameIdx]||''):'',qty:Number.isFinite(q)?q:0,unit:unitIdx>=0?(c[unitIdx]||''):'',pack:packIdx>=0?(c[packIdx]||''):''});",
              'customer-item-sku-key')
          old = '''function buildImagesMap(text){
  const map=new Map();
  String(text||'').split(/\\r?\\n/).forEach(line=>{
    const raw=line.trim();if(!raw||raw.startsWith('#'))return;
    const parts=raw.split(/\\t/);let id='',file='';
    if(parts.length>=2){id=normalizeCleanId(parts[0]);file=parts.slice(1).join('\\t').trim()}
    else{file=raw;const base=file.split('/').pop().split('?')[0];id=normalizeCleanId(base.replace(/\\.[^.]+$/,''))}
    if(id&&file)map.set(id,file);
  });
  return map;
}'''
          new = '''function buildImagesMap(text){
  const map=new Map();
  String(text||'').split(/\\r?\\n/).forEach(line=>{
    const raw=line.trim();if(!raw||raw.startsWith('#'))return;
    const parts=raw.split(/\\t/);let sourceKey='',file='';
    if(parts.length>=2){sourceKey=parts[0].trim();file=parts.slice(1).join('\\t').trim()}
    else{file=raw;const base=file.split('/').pop().split('?')[0];sourceKey=base.replace(/\\.[^.]+$/,'')}
    if(!sourceKey||!file)return;
    const exact=normalizeSkuKey(sourceKey),numeric=normalizeCleanId(sourceKey);
    if(/[A-Za-z]/.test(sourceKey)&&exact)map.set('sku:'+exact,file);
    else if(numeric)map.set('num:'+numeric,file);
  });
  return map;
}
function getImageForItem(images,item){
  if(!images||!item)return'';
  const exact=normalizeSkuKey(item.skuKey||item.id||'');
  if(exact&&images.has('sku:'+exact))return images.get('sku:'+exact)||'';
  const numeric=normalizeCleanId(item.cleanId||item.id||'');
  return numeric?(images.get('num:'+numeric)||''):'';
}'''
          s = must_replace(s, old, new, 'customer-images-map')
          old_load = "const merged=mergeInventories(parseInventory(j),parseInventory(r)).filter(x=>x.allowedMax>=CART_STEP&&images.has(x.cleanId)).map(x=>{const cartonPrice=Number(pricing[x.cleanId]||0);const packNum=parseFloat(toEnglishDigits(x.pack||'').replace(/[^0-9.]/g,''));return {...x,imageFile:images.get(x.cleanId)||'',cartonPrice,approxPrice:cartonPrice>0&&Number.isFinite(packNum)&&packNum>0?cartonPrice/packNum:0}});"
          new_load = "const merged=mergeInventories(parseInventory(j),parseInventory(r)).filter(x=>x.allowedMax>=CART_STEP&&getImageForItem(images,x)).map(x=>{const cartonPrice=Number(pricing[x.cleanId]||0);const packNum=parseFloat(toEnglishDigits(x.pack||'').replace(/[^0-9.]/g,''));return {...x,imageFile:getImageForItem(images,x),cartonPrice,approxPrice:cartonPrice>0&&Number.isFinite(packNum)&&packNum>0?cartonPrice/packNum:0}});"
          s = must_replace(s, old_load, new_load, 'customer-image-load')
          p.write_text(s, encoding='utf-8')

          # 4) Load the admin/runtime override layer on both employee and customer surfaces.
          for name in ('index.html','customer.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              if 'v56-image-repair.js' not in s:
                  marker='<script src="./v48-auth-security.js?v='
                  pos=s.find(marker)
                  if pos<0: raise SystemExit('SCRIPT_INJECT_MARKER_MISSING:'+name)
                  end=s.find('</scr' + "'+'ipt>", pos)
                  if end<0:
                      # wrappers store the split closing tag literally as source code.
                      token='</scr\'+'ipt>'
                      end=s.find(token,pos)
                  # safest: append inside the existing html.replace('</body>', replacement) payload.
                  needle="</scr'+'ipt></body>"
                  if needle not in s: raise SystemExit('SCRIPT_PAYLOAD_MARKER_MISSING:'+name)
                  s=s.replace(needle,"</scr'+'ipt><script src=\"./v56-image-repair.js?v=56.25\"></scr'+'ipt></body>",1)
              p.write_text(s,encoding='utf-8')

          # Permanent regression contract.
          checks = {
              'data/images_list.txt':['BA_209\t209.webp'],
              'runtime/index-v37-source.txt':['normalizeSkuKey','getImageForItem','sku:'],
              'runtime/customer-v37-source.txt':['normalizeSkuKey','getImageForItem','sku:'],
              'index.html':['v56-image-repair.js?v=56.25'],
              'customer.html':['v56-image-repair.js?v=56.25'],
              'v56-image-repair.js':['product_image_overrides','admin_mohanad','إدارة ربط الصورة']
          }
          for fn,needles in checks.items():
              text=Path(fn).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text: raise SystemExit(f'REGRESSION_MISSING:{fn}:{needle}')
          if re.search(r'(?m)^209\t209\.webp$', Path('data/images_list.txt').read_text(encoding='utf-8')):
              raise SystemExit('AMBIGUOUS_209_MAPPING_REMAINS')
      - name: Commit V56.25
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images_list.txt runtime/index-v37-source.txt runtime/customer-v37-source.txt index.html customer.html v56-image-repair.js
          git commit -m "V56.25 — exact SKU image binding and admin repair"
          git push origin HEAD:main
