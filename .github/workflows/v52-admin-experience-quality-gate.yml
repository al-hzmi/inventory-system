name: V52 Executive Admin Experience Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin-home.html'
      - 'admin-dashboard.html'
      - 'control-center.html'
      - 'inventory-analytics.html'
      - 'admin-stocktake-shell.html'
      - 'v46-admin-nav.js'
      - 'v52-admin.css'
      - 'tools/inventory_analytics.py'
      - 'data/inventory-analytics.json'
      - '.github/workflows/v52-admin-experience-quality-gate.yml'

permissions:
  contents: read

jobs:
  v52-admin-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static architecture and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/inventory_analytics.py
          python tools/inventory_analytics.py --repo . --output data/inventory-analytics.json --limit 250
          node --check v46-admin-nav.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          for p in ['admin-home.html','inventory-analytics.html']:
              s=Path(p).read_text(encoding='utf-8');blocks=list(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I));code='\n'.join(m.group(2) for m in blocks if m.group(2).strip() and 'src=' not in m.group(1));Path('/tmp/'+p.replace('.html','.js')).write_text(code,encoding='utf-8')
          nav=Path('v46-admin-nav.js').read_text(encoding='utf-8');home=Path('admin-home.html').read_text(encoding='utf-8');sales=Path('inventory-analytics.html').read_text(encoding='utf-8');css=Path('v52-admin.css').read_text(encoding='utf-8')
          checks={'v52 shell':all(x in nav for x in ["VERSION='52.1'",'v52-sidebar','v52-mobile-nav','admin-home.html']),'legacy redirect':"path==='command-center.html'" in nav and 'location.replace' in nav,'desktop sidebar':'.v52-sidebar' in css,'mobile bottom nav':'#v52-mobile-nav' in css,'executive home':all(x in home for x in ['لوحة الإدارة','اتجاه المبيعات','مقارنة الفرعين','الأصناف الأكثر مبيعًا','يحتاج انتباهك']),'sales branches':all(x in sales for x in ['جدة','الرياض','branchCard','branch-card']),'sales charts':all(x in sales for x in ['trendChart','movementChart','sales-chart']),'mobile sales cards':all(x in sales for x in ['mobile-changes','change-card']),'sales transfer exclusion':'transferMatchedQty' in sales and 'saleQty' in sales}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V52_STATIC_FAIL '+', '.join(bad))
          d=json.load(open('data/inventory-analytics.json',encoding='utf-8'));assert d.get('eventCount',0)>0 and d['current']['jeddah']['skuCount']>0 and d['current']['riyadh']['skuCount']>0
          print('V52_STATIC_PASS',len(checks),'events',d['eventCount'])
          PY
          node --check /tmp/admin-home.js
          node --check /tmp/inventory-analytics.js
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser executive UX desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/v52-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true; rm -f .v52.mjs' EXIT
          sleep 2
          cat > .v52.mjs <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});let fail=false;
          async function open(width,height,path){const ctx=await browser.newContext({viewport:{width,height}});await ctx.addInitScript(()=>{localStorage.setItem('inventory_user_name_v2','مهند');localStorage.setItem('inventory_admin_token_v2','1jh297-spgf2z')});const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:30000});return{ctx,page,errors}}
          const geo=page=>page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
          try{for(const [w,h] of [[1440,900],[390,844]]){let x=await open(w,h,'admin-home.html?qa=1');await x.page.waitForSelector('.v52-kpi',{timeout:45000});await x.page.waitForSelector('.v52-chart svg',{timeout:45000});let g=await geo(x.page),k=await x.page.locator('.v52-kpi').count(),c=await x.page.locator('.v52-chart svg').count(),side=await x.page.locator('.v52-sidebar').count(),mobile=await x.page.locator('#v52-mobile-nav').count();const vis=await x.page.evaluate(()=>({side:getComputedStyle(document.querySelector('.v52-sidebar')).display,mobile:getComputedStyle(document.querySelector('#v52-mobile-nav')).display}));console.log('home',w,{g,k,c,side,mobile,vis,errors:x.errors});if(g.sw>g.cw+3||k<4||c<1||side!==1||mobile!==1||x.errors.length||(w>=900&&vis.side==='none')||(w<900&&vis.mobile==='none'))fail=true;await x.ctx.close();x=await open(w,h,'inventory-analytics.html?qa=1');await x.page.waitForSelector('.v52-kpi',{timeout:45000});await x.page.waitForSelector('.branch-card',{timeout:45000});g=await geo(x.page);const sk=await x.page.locator('.v52-kpi').count(),svg=await x.page.locator('.sales-chart svg').count(),branches=await x.page.locator('.branch-card').count(),text=await x.page.locator('body').innerText();console.log('sales',w,{g,sk,svg,branches,errors:x.errors});if(g.sw>g.cw+3||sk<6||svg<2||branches<2||!text.includes('جدة')||!text.includes('الرياض')||x.errors.length)fail=true;for(const label of ['الأصناف','التحويلات','التحديثات','كل التفاصيل']){await x.page.getByRole('button',{name:label,exact:true}).click();await x.page.waitForTimeout(100)}if(w<900){const cards=await x.page.locator('.mobile-changes .change-card').count();if(cards<1)fail=true}await x.ctx.close();x=await open(w,h,'control-center.html?qa=1');await x.page.waitForSelector('#v51-admin-shell',{state:'attached',timeout:20000});g=await geo(x.page);if(g.sw>g.cw+3||x.errors.length)fail=true;await x.ctx.close();x=await open(w,h,'admin-dashboard.html?section=employees&module=live&qa=1');await x.page.waitForSelector('#v51-admin-shell',{state:'attached',timeout:20000});await x.page.waitForTimeout(2500);g=await geo(x.page);if(g.sw>g.cw+3||x.errors.length)fail=true;await x.ctx.close();}const x=await open(1440,900,'command-center.html?qa=1');await x.page.waitForTimeout(1000);if(!x.page.url().includes('admin-home.html')||x.errors.length)fail=true;await x.ctx.close()}catch(e){console.error(e);fail=true}
          await browser.close();if(fail)process.exit(1);
          JS
          node ./.v52.mjs
