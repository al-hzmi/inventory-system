name: V56.3 Stocktake Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify stocktake workflow and isolated test mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('admin-stocktake.html').read_text()
          failures=[]
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              code=m.group(2)
              if not code.strip():
                  continue
              f=Path('/tmp')/f'admin-stocktake-{i}.js'
              f.write_text(code)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  failures.append(r.stderr)
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('ADMIN_STOCKTAKE_SYNTAX_OK')
          PY
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          git diff --check
          grep -q 'id="testCampaign"' admin-stocktake.html
          grep -q "testSource:'current_inventory'" admin-stocktake.html
          grep -q "sourceMode:'current_inventory'" admin-stocktake.html
          grep -q 'activeStocktakeCampaign' admin-stocktake.html
