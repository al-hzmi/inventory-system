name: V89 unified verified scanning and sync
on:
  push:
    branches: [feature/v89-verified-scanning-batched-sync, main]
    paths: ['batco-scan-pro.js','branch-presence.js','branch-presence.html','stocktake.html','index.html','runtime/index-v37-source.txt','sw.js','tests/v89-*','tests/v88-real-label-mapping.cjs','tests/v87-cashier-geometry.cjs','tests/v88-real-label-browser.cjs','tests/v83-branch-sync-browser.cjs','.github/workflows/v89-scan-sync.yml']
  pull_request:
    paths: ['batco-scan-pro.js','branch-presence.js','branch-presence.html','stocktake.html','index.html','runtime/index-v37-source.txt','sw.js','tests/v89-*','tests/v88-real-label-mapping.cjs','tests/v87-cashier-geometry.cjs','tests/v88-real-label-browser.cjs','tests/v83-branch-sync-browser.cjs','.github/workflows/v89-scan-sync.yml']
permissions:
  contents: read
jobs:
  verify-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node tests/v89-shared-scanning.cjs
      - run: node tests/v89-cross-page-syntax.cjs
      - run: node tests/v88-real-label-mapping.cjs
      - run: node tests/v87-cashier-geometry.cjs
      - run: node tests/v78-boot-service-worker.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v88-real-label-browser.cjs
      - run: BROWSER=webkit node tests/v88-real-label-browser.cjs
      - run: node tests/v83-branch-sync-browser.cjs
      - run: BROWSER=webkit node tests/v83-branch-sync-browser.cjs
      - run: npm run build
