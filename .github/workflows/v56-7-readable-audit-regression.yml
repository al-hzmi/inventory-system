name: V56.7 Readable Audit Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify readable audit and stocktake integrity
        run: |
          set -euo pipefail
          node tests/v56-7-readable-audit.mjs
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-6-admin-responsive.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('admin-stocktake.html').read_text()
          failures=[]
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              code=m.group(2)
              if not code.strip(): continue
              f=Path('/tmp')/f'v567-regression-{i}.js'; f.write_text(code)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: failures.append(r.stderr)
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('V56_7_READABLE_AUDIT_SYNTAX_OK')
          PY
