name: Apply V56.12 Runtime Contract Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/v56-12-contract-reconcile.txt'
      - '.github/workflows/apply-v56-12-contract-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile V56.12 base contract without losing later cache revisions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('runtime/index-v37-source.txt')
          s = runtime.read_text(encoding='utf-8')
          old = "./stocktake-accountant.html?v=56.17"
          new = "./stocktake-accountant.html?v=56.12&rev=56.17"
          if old not in s and new not in s:
              raise SystemExit('accountant runtime link contract not found')
          s = s.replace(old, new)
          runtime.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = "./runtime/index-v37-source.txt?v=56.26"
          new = "./runtime/index-v37-source.txt?v=56.16&rev=56.26"
          if old not in s and new not in s:
              raise SystemExit('index runtime cache contract not found')
          s = s.replace(old, new)
          index.write_text(s, encoding='utf-8')

          test = Path('tests/v56-12-stocktake-accountant.mjs')
          s = test.read_text(encoding='utf-8')
          s = s.replace(
              "assert.match(runtime,new RegExp(`stocktake-accountant\\\\.html\\\\?v=${v56AtLeast12}`),'authorized employees must retain the V56.12+ accountant entry point');",
              "has(runtime,\"stocktake-accountant.html?v=56.12\",'authorized employees must retain the V56.12 accountant entry point');"
          )
          s = s.replace(
              "has(index,\"index-v37-source.txt?v=56.26\",'runtime cache must include the current V56.26 employee hotfix');",
              "has(index,\"index-v37-source.txt?v=56.16&rev=56.26\",'runtime cache must retain V56.16 base contract while preserving current V56.26 hotfix revision');"
          )
          s = s.replace(
              "console.log('V56.12 stocktake accountant/full-test regression: OK on V56.26 runtime');",
              "console.log('V56.12 stocktake accountant/full-test regression: OK with V56.16 base cache and V56.26 revision');"
          )
          test.write_text(s, encoding='utf-8')
          PY
          node tests/v56-12-stocktake-accountant.mjs
          git diff --check
      - name: Commit reconciled contract
        run: |
          if git diff --quiet; then
            echo 'Contract already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/index-v37-source.txt index.html tests/v56-12-stocktake-accountant.mjs
          git commit -m 'fix: reconcile V56.12 runtime links and cache contract'
          git push origin HEAD:main
