name: Customer Presence Exit V33.1 Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/customer_presence_exit_v33_1_retry.py'
      - '.github/workflows/customer-presence-exit-v33-1-retry.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply robust presence fix
        run: python3 .github/scripts/customer_presence_exit_v33_1_retry.py

      - name: Validate admin JSX and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('admin-dashboard.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\s+type=["\']text/babel["\']>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No admin Babel script')
          Path('/tmp/admin.jsx').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'const customerOnlineCount=customerOnline.size+guestOnlineVisitors.size;' in text
          assert 'const customerOnlineCount=customerOnlineCount+' not in text
          assert "!['guest_exit','logout'].includes" in text
          assert 'on=customerSessionOnline(s),isGuest' in text
          assert 'presence.filter(s=>!customerSessionOnline(s))' in text
          assert text.count('customerSessionOnline(r)') >= 3
          assert '⃁' not in text
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/parser@7.28.3 >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs'),parser=require('@babel/parser');
          parser.parse(fs.readFileSync('/tmp/admin.jsx','utf8'),{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
          console.log('Admin JSX parsed successfully');
          NODE

      - name: Commit verified fix and clean temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/scripts/customer_presence_exit_v33_1.py \
            .github/workflows/customer-presence-exit-v33-1.yml \
            .github/scripts/customer_presence_exit_v33_1_retry.py \
            .github/workflows/customer-presence-exit-v33-1-retry.yml
          git add admin-dashboard.html
          git commit -m 'Fix customer presence count and recorded exit state'
          git push origin main
