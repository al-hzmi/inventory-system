name: Harden Inventory Parser Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-inventory-parser-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden TSV parsers against a missing first-column label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('runtime/index-v37-source.txt')
          text = runtime.read_text(encoding='utf-8')
          marker = "const parseExcelData = (rawText, warehouseKey, pricingMap) => {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('parseExcelData not found')
          end = text.find('\n};', start)
          if end < 0:
              raise SystemExit('parseExcelData end not found')
          end += 3
          block = text[start:end]
          old_block = block
          block = block.replace(
              "const lines = rawText.trim().split('\\n');",
              "const lines = rawText.replace(/^\\uFEFF/, '').trimEnd().split('\\n');",
              1,
          )
          block = block.replace(
              "const idIdx   = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));",
              "let idIdx     = headers.findIndex(h => /رقم|كود|sku|item/i.test(h));",
              1,
          )
          needle = "    const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));\n\n    if (idIdx === -1) return [];"
          replacement = "    const packIdx = headers.findIndex(h => /شد|الشد/i.test(h));\n\n    // Defensive fallback: preserve a blank first TSV header cell instead of dropping the whole warehouse.\n    if (idIdx === -1 && headers[0] === '' && nameIdx === 1 && qtyIdx >= 2) idIdx = 0;\n    if (idIdx === -1) return [];"
          block = block.replace(needle, replacement, 1)
          if block == old_block or "trimEnd().split('\\n')" not in block or "headers[0] === ''" not in block:
              raise SystemExit('runtime parser hardening did not apply cleanly')
          runtime.write_text(text[:start] + block + text[end:], encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = "const parseInventory40=(raw,warehouseKey,pricing)=>{"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('parseInventory40 not found')
          end = text.find('\n  };', start)
          if end < 0:
              raise SystemExit('parseInventory40 end not found')
          end += 5
          block = text[start:end]
          old_block = block
          block = block.replace(
              "const lines=String(raw||'').trim().split(/\\r?\\n/);",
              "const lines=String(raw||'').replace(/^\\uFEFF/,'').trimEnd().split(/\\r?\\n/);",
              1,
          )
          block = block.replace(
              "const idIdx=headers.findIndex(h=>/رقم|كود|sku|item/i.test(h));",
              "let idIdx=headers.findIndex(h=>/رقم|كود|sku|item/i.test(h));",
              1,
          )
          needle = "    const packIdx=headers.findIndex(h=>/شد|الشد/i.test(h));\n    if(idIdx<0)return [];"
          replacement = "    const packIdx=headers.findIndex(h=>/شد|الشد/i.test(h));\n    if(idIdx<0&&headers[0]===''&&nameIdx===1&&qtyIdx>=2)idIdx=0;\n    if(idIdx<0)return [];"
          block = block.replace(needle, replacement, 1)
          if block == old_block or "trimEnd().split(/\\r?\\n/)" not in block or "headers[0]===''" not in block:
              raise SystemExit('bootstrap parser hardening did not apply cleanly')
          index.write_text(text[:start] + block + text[end:], encoding='utf-8')

          # Sanity check: current inventory files still have the canonical header.
          for filename in ('data/jeddah.tsv', 'data/riyadh.tsv'):
              first = Path(filename).read_text(encoding='utf-8').splitlines()[0]
              headers = [x.strip() for x in first.split('\t')]
              if not headers or headers[0] != 'رقم الصنف':
                  raise SystemExit(f'{filename}: invalid SKU header after hardening: {headers[:5]!r}')

          print('Parser hardening applied and inventory headers validated.')
          PY

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-inventory-parser-once.yml
          git add index.html runtime/index-v37-source.txt
          git diff --cached --check
          git commit -m 'Harden inventory TSV parsing against missing SKU header label'
          git push origin HEAD:main
