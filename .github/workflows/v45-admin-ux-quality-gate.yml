name: V45 Admin UX Quality Gate
on:
  push:
    branches: [feature/v45-admin-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  v45:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static V45 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          required=['v45-admin-ux.js','v46-admin-nav.js','index.html','customer.html','admin-dashboard.html','command-center.html','admin-home.html']
          miss=[x for x in required if not Path(x).exists()]
          if miss: raise SystemExit('MISSING '+','.join(miss))
          js=Path('v45-admin-ux.js').read_text(); nav=Path('v46-admin-nav.js').read_text(); idx=Path('index.html').read_text(); cust=Path('customer.html').read_text(); adm=Path('admin-dashboard.html').read_text()
          checks={
            'legacy launchers retired': 'legacyLaunchers:false' in js and 'removeLegacyLaunchers' in js,
            'legacy messages listener retired': 'employee_notifications' not in js,
            'desktop horizontal support': 'enableDesktopHorizontal' in js and "addEventListener('wheel'" in js,
            'unified shell': 'v51-admin-shell' in nav and 'v52-sidebar' in nav,
            'legacy command redirect': "path==='command-center.html'" in nav and 'admin-home.html' in nav,
            'admin V45 injection retained':'v45-admin-ux.js?v=45.0' in adm,
            'employee wrapper untouched':'v45-admin-ux.js?v=45.0' not in idx,
            'customer wrapper untouched':'v45-admin-ux.js?v=45.0' not in cust,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V45_STATIC_FAIL '+', '.join(bad))
          print('V45_STATIC_PASS',len(checks))
          PY
      - name: Parse admin compatibility scripts
        run: |
          node --check v45-admin-ux.js
          node --check v46-admin-nav.js
      - name: Browser desktop and mobile regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/v45-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true; rm -f .v45.mjs' EXIT
          cat > .v45.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});let fail=false;
          async function pageAt(width,height,path){const c=await b.newContext({viewport:{width,height}});await c.addInitScript(()=>{localStorage.setItem('inventory_user_name_v2','مهند');localStorage.setItem('inventory_admin_token_v2','1jh297-spgf2z')});const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(5000);return {c,p,errors}}
          try{
            for(const vp of [[1440,900],[390,844]]){
              let {c,p,errors}=await pageAt(vp[0],vp[1],'admin-dashboard.html?section=employees&module=overview&qa=1');
              const shell=await p.locator('#v51-admin-shell').count();
              const legacy=await p.locator('#v45-command-tab,#v45-messages-tab,#v46-control-tab,#v49-security-tab,#v50-inventory-tab').count();
              const width=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              const backdrop=await p.evaluate(()=>{const el=document.querySelector('#root>div.fixed.inset-0');if(!el)return null;const s=getComputedStyle(el);return {pos:s.position,bg:s.backgroundColor}});
              console.log('admin',vp,{shell,legacy,width,backdrop,errors:errors.slice(0,3)});
              if(shell!==1||legacy!==0||width.sw>width.cw+3||errors.length||backdrop?.pos==='fixed')fail=true;
              await c.close();
            }
            let {c,p,errors}=await pageAt(1440,900,'command-center.html?qa=1');await p.waitForTimeout(700);
            const url=p.url(),shell=await p.locator('#v51-admin-shell').count();console.log('legacy command redirect',url,shell,errors.slice(0,3));
            if(!url.includes('admin-home.html')||shell!==1||errors.length)fail=true;await c.close();
          }catch(e){console.error(e);fail=true}
          await b.close();if(fail)process.exit(1);
          JS
          node ./.v45.mjs
