name: V61 Employee Pilot Quality Gate
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vercel.json'
      - 'admin-home.html'
      - 'runtime/index-v37-source.txt'
      - 'control-center.html'
      - 'v57-admin-workspace.js'
      - 'v61-employee-pilot.js'
      - 'v61-employee-pilot.css'
      - 'v61-employee-pilot-admin.js'
      - 'v61-employee-pilot-admin.css'
      - 'tests/v61-employee-pilot.mjs'
      - 'tests/v61-pilot-dom.mjs'
      - 'tests/v61-pilot-browser.mjs'
      - '.github/workflows/v61-employee-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pilot gating, inventory diffs, original search preservation, mobile UI
        run: |
          node --check v61-employee-pilot.js
          node --check v61-employee-pilot-admin.js
          node tests/v61-employee-pilot.mjs
          npm install --no-save --no-package-lock --ignore-scripts jsdom@24.1.3 playwright@1.56.1
          node tests/v61-pilot-dom.mjs
          npx playwright install --with-deps chromium
          node tests/v61-pilot-browser.mjs
          node -e "const c=require('./vercel.json');for(const p of ['/admin-home.html','/control-center.html','/index.html','/v61-employee-pilot.js','/v61-employee-pilot-admin.js']){if(!c.headers.some(h=>h.source===p&&h.headers.some(x=>x.key==='Cache-Control'&&x.value.includes('no-store'))))process.exitCode=1;}"
          git diff --check
  production:
    runs-on: ubuntu-latest
    needs: regression
    timeout-minutes: 8
    steps:
      - name: Confirm production publishes both opt-in pilot assets
        shell: bash
        run: |
          set -euo pipefail
          domain="https://inventory-system-coral-nu.vercel.app"
          for attempt in $(seq 1 24); do
            page="$(curl -fsSL --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' "$domain/index.html?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            admin="$(curl -fsSL --connect-timeout 5 --max-time 15 "$domain/control-center.html?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            asset="$(curl -fsSL --connect-timeout 5 --max-time 15 "$domain/v61-employee-pilot.js?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            style="$(curl -fsSL --connect-timeout 5 --max-time 15 "$domain/v61-employee-pilot.css?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            home="$(curl -fsSL --connect-timeout 5 --max-time 15 "$domain/admin-home.html?verify=$GITHUB_SHA-$attempt" 2>/dev/null || true)"
            if grep -Fq 'v61-employee-pilot.js?v=64.0' <<<"$page" \
              && grep -Fq 'v61-employee-pilot-admin.js?v=63.0' <<<"$admin" \
              && grep -Fq "DOC='employee_site_access'" <<<"$asset" \
              && grep -Fq 'body.batco-pilot-visual #gallery-section' <<<"$style" \
              && grep -Fq 'button:not([class*="accent"])' <<<"$style" \
              && grep -Fq 'v62-pilot-entry' <<<"$home" \
              && grep -Fq 'data-b61a-open' <<<"$home" \
              && grep -Fq 'pilotPreview=1' <<<"$home"; then
                echo "PRODUCTION_V61_EMPLOYEE_PILOT_PASS"
                exit 0
            fi
            echo "Waiting for production (attempt $attempt/24)"
            sleep 10
          done
          echo "Production pilot assets not ready"
          exit 1
