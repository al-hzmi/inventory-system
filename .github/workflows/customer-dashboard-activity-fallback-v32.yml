name: Customer Dashboard Activity Fallback V32

on:
  push:
    paths:
      - '.github/workflows/customer-dashboard-activity-fallback-v32.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Complete overview fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-dashboard.html')
          t=p.read_text(encoding='utf-8')
          old="function CustomerOverview(){const last=sortRows(cActivity,r=>r.createdAt||r.timestamp).slice(0,10);"
          new="function CustomerOverview(){const last=sortRows(recentCustomerActivity,r=>r.createdAt||r.timestamp).slice(0,10);"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('CustomerOverview activity marker missing')
          t=t.replace('<span className="text-[10px] text-muted">{cActivity.length} حركة</span>','<span className="text-[10px] text-muted">{recentCustomerActivity.length} حركة</span>',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate admin JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('admin-dashboard.html').read_text(encoding='utf-8')
          m=re.findall(r'<script\s+type=["\']text/babel["\']>(.*?)</script>',t,re.S|re.I)
          if not m: raise SystemExit('Babel script missing')
          Path('/tmp/admin.jsx').write_text('\n'.join(m),encoding='utf-8')
          if 'sortRows(recentCustomerActivity' not in t: raise SystemExit('Overview fallback missing')
          PY
          npx --yes esbuild@0.25.8 /tmp/admin.jsx --loader:.jsx=jsx --outfile=/tmp/admin-built.js --log-level=error

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          git rm .github/workflows/customer-dashboard-activity-fallback-v32.yml
          git commit -m "Complete customer dashboard activity fallback"
          git push origin HEAD:main
