name: Apply V56.38 Admin IA

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-38-admin-ia.py'
      - '.github/workflows/apply-v56-38-admin-ia.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v56-38-admin-ia-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V56.38 admin IA
        run: python3 .github/scripts/v56-38-admin-ia.py
      - name: Run focused regression
        run: |
          set -euo pipefail
          node tests/v56-38-admin-ia.mjs
          git diff --check
      - name: Commit V56.38
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'V56.38 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html v46-admin-nav.js v54-admin-enhancements.js v54-1-desktop-canvas-fix.css tests/v56-38-admin-ia.mjs
          git commit -m 'V56.38 — separate products from people admin workspace'
          git push origin HEAD:main
