name: V56.51 National Day Categories Composition

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  categories-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V56.51 Categories-only visual contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          node tests/v56-50-nd96-catalog.mjs
          node tests/v56-51-nd96-categories.mjs
          git diff --check
          grep -Fq '@import url("./v56-49-nd96-home.css?v=56.49")' v56-39-national-day.css
          grep -Fq '@import url("./v56-50-nd96-catalog.css?v=56.50")' v56-39-national-day.css
          grep -Fq '@import url("./v56-51-nd96-categories.css?v=56.51")' v56-39-national-day.css
          grep -Fq 'V56.51 — CATEGORIES ONLY' v56-51-nd96-categories.css
          ! grep -Fq '.nd96-cart-page' v56-51-nd96-categories.css
          ! grep -Fq '.nd96-empty-cart' v56-51-nd96-categories.css
          node - <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('v56-51-nd96-categories.css','utf8').replace(/\/\*[\s\S]*?\*\//g,'');
          if(/(^|[\s,>+~])nav(?:[\s.#:[>+~]|$)/m.test(css))throw new Error('Categories layer targets navigation');
          NODE
          echo 'V56.51 quality gate: protected Home/Catalog + Categories-only ND96 paint + navigation untouched PASS.'

  categories-production-smoke:
    if: github.event_name != 'pull_request'
    needs: categories-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve V56.51 tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "V56.51 production probe matched on attempt $attempt"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.51 within verification window.'; exit 1; }
      - name: Verify exact production Categories phase files
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            v56-39-national-day.css
            v56-49-nd96-home.css
            v56-50-nd96-catalog.css
            v56-51-nd96-categories.css
            national-day-96-mark.svg
            national-day-96/assets/header.svg
            national-day-96/assets/border.svg
            national-day-96/assets/corner.svg
            tests/v56-50-nd96-catalog.mjs
            tests/v56-51-nd96-categories.mjs
            runtime/v56-39-identity-production-probe.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done
          grep -Fq '@import url("./v56-51-nd96-categories.css?v=56.51")' /tmp/v56-39-national-day.css
          grep -Fq 'V56.51 — CATEGORIES ONLY' /tmp/v56-51-nd96-categories.css
          ! grep -Fq '.nd96-cart-page' /tmp/v56-51-nd96-categories.css
          echo 'Production serves exact V56.51 Categories-only National Day composition.'
