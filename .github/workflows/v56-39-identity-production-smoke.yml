name: V56.48 National Day Approved Mockup Skin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate V56.48 approved-mockup visual-skin contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          git diff --check

          assert_text(){ local needle="$1" file="$2"; grep -Fq -- "$needle" "$file" || { echo "::error::$file missing contract: $needle"; exit 1; }; }
          reject_text(){ local needle="$1" file="$2"; if grep -Fq -- "$needle" "$file"; then echo "::error::$file contains forbidden behavior: $needle"; exit 1; fi; }

          assert_text "VISUAL_REVISION='56.48'" v56-39-site-identity.js
          assert_text 'V56.48 — Saudi National Day 96 approved-mockup composition skin' v56-39-national-day.css
          assert_text './national-day-96/assets/header.svg' v56-39-national-day.css
          assert_text './national-day-96/assets/border.svg' v56-39-national-day.css
          assert_text './national-day-96/assets/corner.svg' v56-39-national-day.css
          assert_text './national-day-96/assets/fort.svg' v56-39-national-day.css
          assert_text './national-day-96/assets/landscape.svg' v56-39-national-day.css
          assert_text 'CRITICAL NAV CONTRACT' v56-39-national-day.css
          reject_text 'body.nd96-customer nav{position:' v56-39-national-day.css
          reject_text '.category-tile.nd96-category-tile::after' v56-39-national-day.css
          reject_text 'repeating-conic-gradient' v56-39-national-day.css
          reject_text "document.createElement('img')" v56-39-site-identity.js

          for asset in \
            national-day-96/assets/header.svg \
            national-day-96/assets/border.svg \
            national-day-96/assets/corner.svg \
            national-day-96/assets/fort.svg \
            national-day-96/assets/landscape.svg; do
            test -s "$asset" || { echo "::error::Missing production National Day asset: $asset"; exit 1; }
            grep -Fq '<svg' "$asset"
            ! grep -Fq 'data:image/' "$asset"
          done

          echo 'V56.48 quality gate: approved mockup composition + frozen UI geometry + persistent bottom navigation PASS.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production to serve V56.48 tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "V56.48 production probe matched on attempt $attempt"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.48 within verification window.'; exit 1; }

      - name: Verify exact production visual-skin files
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            index.html
            customer.html
            identities.html
            v56-39-site-identity.js
            v56-39-national-day.css
            national-day-96-mark.svg
            national-day-96/assets/header.svg
            national-day-96/assets/border.svg
            national-day-96/assets/corner.svg
            national-day-96/assets/fort.svg
            national-day-96/assets/landscape.svg
            v46-admin-nav.js
            tests/v56-39-identities.mjs
            runtime/index-v37-source.txt
            runtime/v56-39-identity-production-probe.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done

          grep -Fq "VISUAL_REVISION='56.48'" /tmp/v56-39-site-identity.js
          grep -Fq 'approved-mockup composition skin' /tmp/v56-39-national-day.css
          grep -Fq 'CRITICAL NAV CONTRACT' /tmp/v56-39-national-day.css
          ! grep -Fq 'body.nd96-customer nav{position:' /tmp/v56-39-national-day.css
          ! grep -Fq '.category-tile.nd96-category-tile::after' /tmp/v56-39-national-day.css
          echo 'Production serves exact V56.48 approved-mockup National Day skin.'