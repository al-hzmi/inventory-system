name: V56.60 National Day Final Approved Identity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate final approved four-view visual contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          node tests/v56-50-nd96-catalog.mjs
          node tests/v56-51-nd96-categories.mjs
          node tests/v56-52-nd96-cart.mjs
          git diff --check
          for file in v56-39-national-day.css v56-49-nd96-home.css v56-50-nd96-catalog.css v56-51-nd96-categories.css v56-52-nd96-cart.css; do
            test -s "$file"
          done
          grep -Fq 'v56-49-nd96-home.css?v=56.60' v56-39-national-day.css
          grep -Fq 'v56-50-nd96-catalog.css?v=56.60' v56-39-national-day.css
          grep -Fq 'v56-51-nd96-categories.css?v=56.60' v56-39-national-day.css
          grep -Fq 'v56-52-nd96-cart.css?v=56.60' v56-39-national-day.css
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['v56-49-nd96-home.css','v56-50-nd96-catalog.css','v56-51-nd96-categories.css','v56-52-nd96-cart.css']){
            const css=fs.readFileSync(file,'utf8').replace(/\/\*[\s\S]*?\*\//g,'');
            if(/(^|[\s,>+~])nav(?:[\s.#:[>+~]|$)/m.test(css))throw new Error(`${file} targets navigation`);
          }
          NODE
          echo 'V56.60 quality gate: approved Home + Catalog + Categories + Cart, UI geometry protected, navigation untouched PASS.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production and verify exact V56.60 identity tree
        shell: bash
        run: |
          set -euo pipefail
          files=(
            v56-39-site-identity.js
            v56-39-national-day.css
            v56-49-nd96-home.css
            v56-50-nd96-catalog.css
            v56-51-nd96-categories.css
            v56-52-nd96-cart.css
            national-day-96-mark.svg
            national-day-96/assets/corner.svg
            national-day-96/assets/landscape.svg
            tests/v56-39-identities.mjs
            tests/v56-50-nd96-catalog.mjs
            tests/v56-51-nd96-categories.mjs
            tests/v56-52-nd96-cart.mjs
            runtime/v56-39-identity-production-probe.txt
          )
          expected_probe="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            probe="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?verify=$nonce" 2>/dev/null || true)"
            if [[ "$probe" != "$expected_probe" ]]; then sleep 10; continue; fi
            all=1
            for file in "${files[@]}"; do
              mkdir -p "/tmp/$(dirname "$file")"
              curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file" || { all=0; break; }
              cmp -s "$file" "/tmp/$file" || { all=0; break; }
            done
            if [[ "$all" == 1 ]]; then ok=1; echo "V56.60 exact production tree matched on attempt $attempt"; break; fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not serve the exact V56.60 approved identity tree within the verification window.'; exit 1; }
          echo 'Production serves exact V56.60 final approved National Day identity.'
