name: V56.60 National Day Final Four-View Reference

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V56.60 final four-view identity contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          git diff --check
          grep -Fq "VERSION='56.60'" v56-39-site-identity.js
          grep -Fq "VISUAL_REVISION='56.60'" v56-39-site-identity.js
          grep -Fq '@import url("./v56-49-nd96-home.css?v=56.60")' v56-39-national-day.css
          grep -Fq '@import url("./v56-50-nd96-catalog.css?v=56.60")' v56-39-national-day.css
          grep -Fq '@import url("./v56-51-nd96-categories.css?v=56.60")' v56-39-national-day.css
          grep -Fq '@import url("./v56-52-nd96-cart.css?v=56.60")' v56-39-national-day.css
          grep -Fq 'V56.60 — HOME / INVENTORY' v56-49-nd96-home.css
          grep -Fq 'V56.60 — CUSTOMER / CATALOG' v56-50-nd96-catalog.css
          grep -Fq 'V56.60 — CATEGORIES' v56-51-nd96-categories.css
          grep -Fq 'V56.60 — CART' v56-52-nd96-cart.css
          echo 'V56.60 quality gate: four approved reference views + cache revision + application safety PASS.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve V56.60 tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "V56.60 production probe matched on attempt $attempt"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.60 within verification window.'; exit 1; }
      - name: Verify exact production V56.60 identity files
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            index.html
            customer.html
            v56-39-site-identity.js
            v56-39-national-day.css
            v56-49-nd96-home.css
            v56-50-nd96-catalog.css
            v56-51-nd96-categories.css
            v56-52-nd96-cart.css
            national-day-96-mark.svg
            national-day-96/assets/header.svg
            national-day-96/assets/border.svg
            national-day-96/assets/corner.svg
            national-day-96/assets/fort.svg
            national-day-96/assets/landscape.svg
            tests/v56-39-identities.mjs
            runtime/v56-39-identity-production-probe.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done
          grep -Fq "VISUAL_REVISION='56.60'" /tmp/v56-39-site-identity.js
          grep -Fq 'FINAL APPROVED NATIONAL DAY 96 IDENTITY' /tmp/v56-39-national-day.css
          grep -Fq 'V56.60 — CART' /tmp/v56-52-nd96-cart.css
          echo 'Production serves the exact committed V56.60 four-view National Day identity files.'
