name: V56.43 Identity Quality + Production Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate identity runtime and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js

          assert_text(){ local needle="$1" file="$2"; grep -Fq "$needle" "$file" || { echo "::error::$file missing expected contract: $needle"; exit 1; }; }
          reject_text(){ local needle="$1" file="$2"; if grep -Fq "$needle" "$file"; then echo "::error::$file contains retired visual primitive: $needle"; exit 1; fi; }

          OFFICIAL_MARK='https://cdn.gea.gov.sa/ND-2026/brand/brand-emblem-wide.png'
          OFFICIAL_VECTOR='https://cdn.gea.gov.sa/ND-2026/assets/identity/vector-green.png'

          assert_text "VERSION='56.40'" v56-39-site-identity.js
          assert_text "VISUAL_REVISION='56.43'" v56-39-site-identity.js
          assert_text "CONTROL_DOC='site_identity'" v56-39-site-identity.js
          assert_text "DEFAULT_IDENTITY='default'" v56-39-site-identity.js
          assert_text "NATIONAL_IDENTITY='national96'" v56-39-site-identity.js
          assert_text "enabled:false" v56-39-site-identity.js
          assert_text "onSnapshot" v56-39-site-identity.js
          assert_text "waitForDefaultFirebase" v56-39-site-identity.js
          assert_text "$OFFICIAL_MARK" v56-39-site-identity.js
          assert_text "nd96-new-arrivals" v56-39-site-identity.js
          reject_text "const ICONS=" v56-39-site-identity.js
          reject_text "iconForLabel" v56-39-site-identity.js
          reject_text "injectIcon" v56-39-site-identity.js
          reject_text "CART_ILLUSTRATION" v56-39-site-identity.js

          assert_text "data-testid=\"identity-console\"" identities.html
          assert_text "اليوم الوطني السعودي 96" identities.html
          assert_text "system_controls" identities.html
          assert_text "site_identity" identities.html
          assert_text "national96" identities.html
          assert_text "$OFFICIAL_MARK" identities.html
          assert_text "$OFFICIAL_VECTOR" identities.html

          assert_text "#008B4C" v56-39-national-day.css
          assert_text "#07383A" v56-39-national-day.css
          assert_text "$OFFICIAL_VECTOR" v56-39-national-day.css
          assert_text "$OFFICIAL_MARK" v56-39-national-day.css
          assert_text ".nd96-new-arrivals{display:none" v56-39-national-day.css
          assert_text ".category-tile.nd96-category-tile .w-10.h-10{display:none" v56-39-national-day.css
          assert_text ".nd96-chip-icon," v56-39-national-day.css
          assert_text "prefers-reduced-motion" v56-39-national-day.css
          reject_text "national96-weave.svg" v56-39-national-day.css
          reject_text "national96-watermark.svg" v56-39-national-day.css
          reject_text "national96-landscape.svg" v56-39-national-day.css
          reject_text "repeating-conic-gradient" v56-39-national-day.css
          reject_text "nd96WeaveSlide" v56-39-national-day.css

          test ! -e national96-weave.svg || { echo '::error::synthetic weave asset still exists'; exit 1; }
          test ! -e national96-watermark.svg || { echo '::error::synthetic watermark asset still exists'; exit 1; }
          test ! -e national96-landscape.svg || { echo '::error::synthetic landscape asset still exists'; exit 1; }

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          P().feed(Path('identities.html').read_text())
          css=Path('v56-39-national-day.css').read_text()
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS_BRACE_MISMATCH')
          print('V56.43_IDENTITY_STATIC_PASS')
          PY
          echo 'V56.43 clean National Day identity contracts verified: official assets only, no injected category illustrations.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production to serve the current identity tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "Identity production probe matched on attempt $attempt"
              ok=1
              break
            fi
            echo "Attempt $attempt: production has not reached the current identity tree yet"
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Production alias did not serve the identity probe within the verification window."
            exit 1
          fi

      - name: Verify exact identity control page and shared assets
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(index.html identities.html v56-39-site-identity.js v56-39-national-day.css national-day-96-mark.svg v46-admin-nav.js runtime/index-v37-source.txt)
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done

          grep -Fq "VISUAL_REVISION='56.43'" /tmp/v56-39-site-identity.js
          grep -Fq 'vector-green.png' /tmp/v56-39-national-day.css
          grep -Fq '.nd96-new-arrivals{display:none' /tmp/v56-39-national-day.css
          ! grep -Fq 'iconForLabel' /tmp/v56-39-site-identity.js
          ! grep -Fq 'national96-weave.svg' /tmp/v56-39-national-day.css
          ! grep -Fq 'national96-watermark.svg' /tmp/v56-39-national-day.css
          ! grep -Fq 'national96-landscape.svg' /tmp/v56-39-national-day.css

          for removed in national96-weave.svg national96-watermark.svg national96-landscape.svg; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$PROD/$removed?verify=$nonce")"
            if [[ "$status" == "200" ]]; then
              echo "::error::Retired synthetic asset is still served in production: $removed"
              exit 1
            fi
          done
          echo 'Production serves exact V56.43 clean National Day identity from current main.'
