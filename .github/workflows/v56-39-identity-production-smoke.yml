name: V56.66 National Day Visible Minimal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V56.66 visible-minimal identity contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          git diff --check
          grep -Fq '@import url("./v56-65-nd96-minimal.css?v=56.66")' v56-39-national-day.css
          grep -Fq 'V56.66 — National Day 96 visible-minimal identity' v56-65-nd96-minimal.css
          grep -Fq 'v56-63-mark.webp' v56-65-nd96-minimal.css
          grep -Fq 'corner.svg' v56-65-nd96-minimal.css
          grep -Fq 'background-image:var(--nd96-logo)' v56-65-nd96-minimal.css
          grep -Fq 'body.nd96-customer .rights-bar' v56-65-nd96-minimal.css
          test -s national-day-96/assets/v56-63-mark.webp
          test -s national-day-96/assets/corner.svg
          ! grep -Fq '@import url("./v56-63-nd96-exact-webp.css' v56-39-national-day.css
          ! grep -Fq '@import url("./v56-49-nd96-home.css' v56-39-national-day.css
          ! grep -Fq '@import url("./v56-50-nd96-catalog.css' v56-39-national-day.css
          ! grep -Fq '@import url("./v56-51-nd96-categories.css' v56-39-national-day.css
          ! grep -Fq '@import url("./v56-52-nd96-cart.css' v56-39-national-day.css
          echo 'V56.66 quality gate: visible top mark + sparse motifs; original layout remains owned by base app.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve V56.66 tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "V56.66 production probe matched on attempt $attempt"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.66 within verification window.'; exit 1; }
      - name: Verify production V56.66 bytes and no-store headers
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            index.html
            customer.html
            v56-39-site-identity.js
            v56-39-national-day.css
            v56-65-nd96-minimal.css
            national-day-96/assets/v56-63-mark.webp
            national-day-96/assets/corner.svg
            tests/v56-39-identities.mjs
            runtime/v56-39-identity-production-probe.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done
          grep -Fq 'V56.66 — VISIBLE MINIMAL NATIONAL DAY 96 IDENTITY' /tmp/v56-39-national-day.css
          grep -Fq 'V56.66 — National Day 96 visible-minimal identity' /tmp/v56-65-nd96-minimal.css
          for path in \
            v56-39-site-identity.js \
            v56-39-national-day.css \
            v56-65-nd96-minimal.css \
            national-day-96/assets/v56-63-mark.webp \
            national-day-96/assets/corner.svg; do
            headers="$(curl -fsSI --retry 3 --retry-delay 2 "$PROD/$path?headers=$nonce")"
            cache="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^cache-control:/{sub(/^[^:]+:[[:space:]]*/,""); print; exit}')"
            echo "$path cache-control: $cache"
            printf '%s' "$cache" | grep -Eqi '(^|[ ,])no-store([ ,]|$)' || { echo "::error::Production $path is not served with Cache-Control: no-store."; exit 1; }
          done
          echo 'Production serves V56.66 visible-minimal identity bytes with no-store cache protection.'
