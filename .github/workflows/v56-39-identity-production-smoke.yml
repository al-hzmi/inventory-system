name: V56.44 Base-Layout Identity Quality + Production Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate base-layout identity contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js

          assert_text(){ local needle="$1" file="$2"; grep -Fq "$needle" "$file" || { echo "::error::$file missing expected contract: $needle"; exit 1; }; }
          reject_text(){ local needle="$1" file="$2"; if grep -Fq "$needle" "$file"; then echo "::error::$file contains retired visual behavior: $needle"; exit 1; fi; }

          OFFICIAL_MARK='https://cdn.gea.gov.sa/ND-2026/brand/brand-emblem-wide.png'

          assert_text "VERSION='56.40'" v56-39-site-identity.js
          assert_text "VISUAL_REVISION='56.44'" v56-39-site-identity.js
          assert_text "CONTROL_DOC='site_identity'" v56-39-site-identity.js
          assert_text "NATIONAL_IDENTITY='national96'" v56-39-site-identity.js
          assert_text "enabled:false" v56-39-site-identity.js
          assert_text "onSnapshot" v56-39-site-identity.js
          assert_text "waitForDefaultFirebase" v56-39-site-identity.js
          assert_text "no injected visual DOM" v56-39-site-identity.js
          reject_text "ensureDecorations" v56-39-site-identity.js
          reject_text "addSubtitle" v56-39-site-identity.js
          reject_text "decorateFooter" v56-39-site-identity.js
          reject_text "ensureInventoryMasthead" v56-39-site-identity.js
          reject_text "nd96-new-arrivals" v56-39-site-identity.js
          reject_text "OFFICIAL_MARK_URL" v56-39-site-identity.js
          reject_text "document.createElement('img')" v56-39-site-identity.js

          assert_text "$OFFICIAL_MARK" v56-39-national-day.css
          assert_text "--nd96-green:#009A55" v56-39-national-day.css
          assert_text "--nd96-deep:#063B3B" v56-39-national-day.css
          assert_text "Base application geometry remains authoritative" v56-39-national-day.css
          assert_text "same DOM, same dimensions" v56-39-national-day.css
          assert_text "preserve every base tile" v56-39-national-day.css
          assert_text "preserve original empty-state geometry" v56-39-national-day.css
          assert_text "no injected masthead, no body offset" v56-39-national-day.css
          assert_text "prefers-reduced-motion" v56-39-national-day.css

          reject_text ".nd96-new-arrivals{display:none" v56-39-national-day.css
          reject_text ".category-tile.nd96-category-tile .w-10.h-10{display:none" v56-39-national-day.css
          reject_text "national96-weave.svg" v56-39-national-day.css
          reject_text "national96-watermark.svg" v56-39-national-day.css
          reject_text "national96-landscape.svg" v56-39-national-day.css
          reject_text "repeating-conic-gradient" v56-39-national-day.css
          reject_text "nd96WeaveSlide" v56-39-national-day.css

          python3 - <<'PY'
          import re
          from pathlib import Path
          from html.parser import HTMLParser
          css=Path('v56-39-national-day.css').read_text()
          js=Path('v56-39-site-identity.js').read_text()
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS_BRACE_MISMATCH')
          # The National Day stylesheet may repaint components, but it may not resize
          # or reflow any existing base-layout component.
          forbidden = ['width','height','min-width','max-width','min-height','max-height','padding','padding-top','padding-bottom','padding-left','padding-right','padding-inline','padding-block','margin','margin-top','margin-bottom','margin-left','margin-right','margin-inline','margin-block','gap','row-gap','column-gap','font-size','line-height','grid-template-columns','grid-template-rows','flex-basis','order']
          violations=[]
          for prop in forbidden:
              if re.search(r'(?<![-\w])'+re.escape(prop)+r'\s*:', css):
                  violations.append(prop)
          if violations:
              raise SystemExit('BASE_GEOMETRY_OVERRIDE_FORBIDDEN: '+', '.join(sorted(set(violations))))
          if "createElement('img')" in js or 'createElement("img")' in js:
              raise SystemExit('VISUAL_DOM_INJECTION_FORBIDDEN')
          class P(HTMLParser): pass
          P().feed(Path('identities.html').read_text())
          print('V56.44_BASE_LAYOUT_IDENTITY_PASS')
          PY
          echo 'V56.44 verified: National Day paint layer only; base component geometry and content remain authoritative.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production to serve current identity revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "Identity production probe matched on attempt $attempt"
              ok=1
              break
            fi
            echo "Attempt $attempt: production has not reached V56.44 yet"
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.44 within verification window.'; exit 1; }

      - name: Verify exact base-layout identity files in production
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(index.html identities.html v56-39-site-identity.js v56-39-national-day.css national-day-96-mark.svg v46-admin-nav.js runtime/index-v37-source.txt runtime/v56-39-identity-production-probe.txt)
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done
          grep -Fq "VISUAL_REVISION='56.44'" /tmp/v56-39-site-identity.js
          grep -Fq 'Base application geometry remains authoritative' /tmp/v56-39-national-day.css
          ! grep -Fq 'ensureInventoryMasthead' /tmp/v56-39-site-identity.js
          ! grep -Fq '.nd96-new-arrivals{display:none' /tmp/v56-39-national-day.css
          echo 'Production serves exact V56.44 base-layout National Day identity.'