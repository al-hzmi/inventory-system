name: V56.40 Identity Quality + Production Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate identity runtime and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js

          assert_text(){ local needle="$1" file="$2"; grep -Fq "$needle" "$file" || { echo "::error::$file missing expected contract: $needle"; exit 1; }; }
          reject_text(){ local needle="$1" file="$2"; if grep -Fq "$needle" "$file"; then echo "::error::$file contains retired visual primitive: $needle"; exit 1; fi; }

          OFFICIAL_MARK='https://cdn.gea.gov.sa/ND-2026/brand/brand-emblem-wide.png'
          OFFICIAL_VECTOR='https://cdn.gea.gov.sa/ND-2026/assets/identity/vector-green.png'

          assert_text "VERSION='56.40'" v56-39-site-identity.js
          assert_text "CONTROL_DOC='site_identity'" v56-39-site-identity.js
          assert_text "DEFAULT_IDENTITY='default'" v56-39-site-identity.js
          assert_text "NATIONAL_IDENTITY='national96'" v56-39-site-identity.js
          assert_text "enabled:false" v56-39-site-identity.js
          assert_text "onSnapshot" v56-39-site-identity.js
          assert_text "waitForDefaultFirebase" v56-39-site-identity.js
          assert_text "$OFFICIAL_MARK" v56-39-site-identity.js
          reject_text "./national-day-96-mark.svg" v56-39-site-identity.js

          assert_text "data-testid=\"identity-console\"" identities.html
          assert_text "اليوم الوطني السعودي 96" identities.html
          assert_text "system_controls" identities.html
          assert_text "site_identity" identities.html
          assert_text "national96" identities.html
          assert_text "$OFFICIAL_MARK" identities.html
          assert_text "$OFFICIAL_VECTOR" identities.html
          for id in livePill liveLabel defaultBadge nationalBadge activateNational activateDefault previewNational clearPreview syncState toast; do
            assert_text "id=\"$id\"" identities.html
          done

          assert_text "#008B4C" v56-39-national-day.css
          assert_text "#0F2C31" v56-39-national-day.css
          assert_text "$OFFICIAL_VECTOR" v56-39-national-day.css
          assert_text "prefers-reduced-motion" v56-39-national-day.css
          reject_text "repeating-conic-gradient" v56-39-national-day.css
          reject_text "pattern id=\"weave\"" national-day-96-mark.svg
          reject_text "pattern id=\"teeth\"" national-day-96-mark.svg
          assert_text "$OFFICIAL_MARK" national-day-96-mark.svg

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          P().feed(Path('identities.html').read_text())
          css=Path('v56-39-national-day.css').read_text()
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS_BRACE_MISMATCH')
          print('V56.40_IDENTITY_STATIC_PASS')
          PY
          echo 'Canonical 2026 GEA asset bindings verified. External CDN reachability is intentionally not a CI blocker because the provider rejects GitHub runner traffic with HTTP 403.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production to serve the current identity tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "Identity production probe matched on attempt $attempt"
              ok=1
              break
            fi
            echo "Attempt $attempt: production has not reached the current identity tree yet"
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Production alias did not serve the identity probe within the verification window."
            exit 1
          fi

      - name: Verify exact identity control page and shared assets
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            index.html
            identities.html
            v56-39-site-identity.js
            v56-39-national-day.css
            national-day-96-mark.svg
            v46-admin-nav.js
            runtime/index-v37-source.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done

          assert_text(){ local needle="$1" file="$2"; grep -Fq "$needle" "$file" || { echo "::error::$file missing expected contract: $needle"; exit 1; }; }
          reject_text(){ local needle="$1" file="$2"; if grep -Fq "$needle" "$file"; then echo "::error::$file contains retired visual primitive: $needle"; exit 1; fi; }

          assert_text "CONTROL_DOC='site_identity'" /tmp/v56-39-site-identity.js
          assert_text "DEFAULT_IDENTITY='default'" /tmp/v56-39-site-identity.js
          assert_text "NATIONAL_IDENTITY='national96'" /tmp/v56-39-site-identity.js
          assert_text "VERSION='56.40'" /tmp/v56-39-site-identity.js
          assert_text "enabled:false" /tmp/v56-39-site-identity.js
          assert_text "onSnapshot" /tmp/v56-39-site-identity.js
          assert_text "batco-identity-national96" /tmp/v56-39-site-identity.js
          assert_text "waitForDefaultFirebase" /tmp/v56-39-site-identity.js
          assert_text "brand-emblem-wide.png" /tmp/v56-39-site-identity.js

          assert_text "الهويات" /tmp/identities.html
          assert_text "اليوم الوطني السعودي 96" /tmp/identities.html
          assert_text "مقفلة حتى تفعّلها" /tmp/identities.html
          assert_text "system_controls" /tmp/identities.html
          assert_text "site_identity" /tmp/identities.html
          assert_text "national96" /tmp/identities.html
          assert_text "brand-emblem-wide.png" /tmp/identities.html
          assert_text "vector-green.png" /tmp/identities.html

          assert_text "['identity','الهويات','./identities.html']" /tmp/v46-admin-nav.js
          assert_text "v56-39-site-identity.js?v=56.39" /tmp/index.html

          assert_text "#008B4C" /tmp/v56-39-national-day.css
          assert_text "#0F2C31" /tmp/v56-39-national-day.css
          assert_text "vector-green.png" /tmp/v56-39-national-day.css
          assert_text "prefers-reduced-motion" /tmp/v56-39-national-day.css
          reject_text "repeating-conic-gradient" /tmp/v56-39-national-day.css

          assert_text "هوية اليوم الوطني السعودي 96" /tmp/national-day-96-mark.svg
          assert_text "SAUDI NATIONAL DAY 96" /tmp/national-day-96-mark.svg
          assert_text "brand-emblem-wide.png" /tmp/national-day-96-mark.svg

          curl -fsSL --retry 3 --retry-delay 2 "$PROD/identities.html?route=$nonce" -o /tmp/identity-route.html
          test -s /tmp/identity-route.html
          assert_text "الهويات" /tmp/identity-route.html
          echo "Production serves the exact V56.40 identity manager and official National Day 96 asset bindings from current main."
