name: V56.62 National Day Safari-Safe Reference

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V56.62 Safari-safe identity contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v56-39-site-identity.js
          node tests/v56-39-identities.mjs
          git diff --check
          grep -Fq "VERSION='56.62'" v56-39-site-identity.js
          grep -Fq "VISUAL_REVISION='56.62'" v56-39-site-identity.js
          grep -Fq '@import url("./v56-49-nd96-home.css?v=56.62")' v56-39-national-day.css
          grep -Fq '@import url("./v56-50-nd96-catalog.css?v=56.62")' v56-39-national-day.css
          grep -Fq '@import url("./v56-51-nd96-categories.css?v=56.62")' v56-39-national-day.css
          grep -Fq '@import url("./v56-52-nd96-cart.css?v=56.62")' v56-39-national-day.css
          grep -Fq 'V56.62 — HOME / INVENTORY' v56-49-nd96-home.css
          grep -Fq 'V56.62 — CUSTOMER / CATALOG' v56-50-nd96-catalog.css
          grep -Fq 'V56.62 — CATEGORIES' v56-51-nd96-categories.css
          grep -Fq 'V56.62 — CART' v56-52-nd96-cart.css
          test -s national-day-96/assets/corner.svg
          test -s national-day-96/assets/landscape.svg
          ! grep -Rq 'exact-corner-top.svg\|exact-corner-bottom.svg\|exact-skyline.svg' v56-49-nd96-home.css v56-50-nd96-catalog.css v56-51-nd96-categories.css v56-52-nd96-cart.css
          echo 'V56.62 quality gate: Safari-safe artwork + four reference views + no-store + application safety PASS.'

  identity-production-smoke:
    if: github.event_name != 'pull_request'
    needs: identity-quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROD: https://inventory-system-coral-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve V56.62 tree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat runtime/v56-39-identity-production-probe.txt)"
          ok=0
          for attempt in $(seq 1 48); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$PROD/runtime/v56-39-identity-production-probe.txt?sha=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ "$body" == "$expected" ]]; then
              echo "V56.62 production probe matched on attempt $attempt"
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo '::error::Production did not reach V56.62 within verification window.'; exit 1; }
      - name: Verify exact production V56.62 identity files and cache headers
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          files=(
            index.html
            customer.html
            v56-39-site-identity.js
            v56-39-national-day.css
            v56-49-nd96-home.css
            v56-50-nd96-catalog.css
            v56-51-nd96-categories.css
            v56-52-nd96-cart.css
            national-day-96/assets/corner.svg
            national-day-96/assets/landscape.svg
            tests/v56-39-identities.mjs
            runtime/v56-39-identity-production-probe.txt
          )
          for file in "${files[@]}"; do
            mkdir -p "/tmp/$(dirname "$file")"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$PROD/$file?verify=$nonce" -o "/tmp/$file"
            cmp -s "$file" "/tmp/$file" || { echo "::error::Production $file differs from current main."; exit 1; }
          done
          grep -Fq "VISUAL_REVISION='56.62'" /tmp/v56-39-site-identity.js
          grep -Fq 'FINAL APPROVED NATIONAL DAY 96 IDENTITY' /tmp/v56-39-national-day.css
          grep -Fq 'V56.62 — CART' /tmp/v56-52-nd96-cart.css
          grep -Fq 'landscape.svg' /tmp/v56-50-nd96-catalog.css

          for path in v56-39-site-identity.js v56-39-national-day.css v56-49-nd96-home.css v56-50-nd96-catalog.css v56-51-nd96-categories.css v56-52-nd96-cart.css national-day-96/assets/corner.svg national-day-96/assets/landscape.svg; do
            headers="$(curl -fsSI --retry 3 --retry-delay 2 "$PROD/$path?headers=$nonce")"
            cache="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^cache-control:/{sub(/^[^:]+:[[:space:]]*/,""); print; exit}')"
            echo "$path cache-control: $cache"
            printf '%s' "$cache" | grep -Eqi '(^|[ ,])no-store([ ,]|$)' || { echo "::error::Production $path is not served with Cache-Control: no-store."; exit 1; }
          done

          echo 'Production serves V56.62 Safari-safe artwork bytes with no-store cache protection.'
