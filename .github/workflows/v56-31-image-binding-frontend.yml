name: V56.31 Image Binding Frontend Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-31-image-binding-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire all image binding clients to server API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          album=Path('image-distribution.html')
          emp=Path('runtime/index-v37-source.txt')
          cust=Path('runtime/customer-v37-source.txt')

          a=album.read_text(encoding='utf-8')
          anchor="if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore();const text=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p);return r.text()};"
          addition="const adminProof=()=>{try{return JSON.parse(localStorage.getItem('inventory_login_photo_proof_v2')||'null')||{}}catch{return{}}};const adminToken=()=>String(localStorage.getItem('inventory_admin_token_v2')||'');const loadServerBindings=async()=>{const r=await fetch('./api/image-admin?action=bindings',{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'BINDINGS_LOAD_FAILED');return d.bindings||{}};"
          if addition not in a:
              if anchor not in a: raise SystemExit('album helper anchor missing')
              a=a.replace(anchor,anchor+'\n'+addition,1)

          start=a.index('async function bind(item,button){')
          end=a.index('\nfunction toast(',start)
          new_bind="""async function bind(item,button){if(!state.selected||state.busy)return;const sku=norm(item.id),imageKey=state.selected.key;if(!confirm(`ربط الصورة ${imageKey} بالصنف ${item.id}؟`))return;state.busy=true;button.disabled=true;const old=button.innerHTML;button.textContent='جاري الحفظ…';sheetHint.textContent='جاري حفظ الربط على الخادم، لا تغلق الصفحة…';try{const r=await Promise.race([fetch('./api/image-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bind',sku,imageKey,updatedBy:'مهند',adminToken:adminToken(),adminProof:adminProof()})}),new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(Error('SAVE_TIMEOUT'),{code:'SAVE_TIMEOUT'})),15000))]);const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.error||'BIND_FAILED'),{status:r.status});const saved=norm(d.saved||d.bindings?.[sku]||'');if(saved!==imageKey)throw Error('VERIFY_FAILED');state.bindings={...(d.bindings||{}),[sku]:imageKey};state.busy=false;closeSheet();toast(`تم ربط ${imageKey} بالصنف ${item.id} ✓`);refresh()}catch(e){console.error('[image album bind]',e);state.busy=false;button.disabled=false;button.innerHTML=old;sheetHint.textContent='تعذر الحفظ. يمكنك المحاولة مرة أخرى دون تحديث الصفحة.';toast(e?.code==='SAVE_TIMEOUT'?'تأخر الخادم أكثر من المعتاد. تحقق من الإنترنت وحاول مرة أخرى.':(e?.message&&/جلسة|الصنف|الصورة/.test(e.message)?e.message:'تعذر حفظ الربط على الخادم. لم يتم إغلاق النافذة حتى تتمكن من المحاولة مرة أخرى.'),true)}}"""
          a=a[:start]+new_bind+a[end:]

          old_init="(async()=>{try{const [imgs,j,r,snap]=await Promise.all([text('./data/images_list.txt'),text('./data/jeddah.tsv'),text('./data/riyadh.tsv'),db.collection('system_controls').doc('product_image_bindings').get()]);state.images=parseImages(imgs);state.items=uniqueItems([...parseInv(j),...parseInv(r)]).sort((a,b)=>a.id.localeCompare(b.id,'ar',{numeric:true}));state.bindings=snap.exists?(snap.data().bindings||{}):{};refresh()}catch(e){console.error(e);grid.innerHTML='<div class=\"card empty\">تعذر تحميل بيانات الصور أو الأصناف. أعد المحاولة.</div>'}})();"
          new_init="(async()=>{try{const [imgs,j,r,bindings]=await Promise.all([text('./data/images_list.txt'),text('./data/jeddah.tsv'),text('./data/riyadh.tsv'),loadServerBindings()]);state.images=parseImages(imgs);state.items=uniqueItems([...parseInv(j),...parseInv(r)]).sort((a,b)=>a.id.localeCompare(b.id,'ar',{numeric:true}));state.bindings=bindings||{};refresh()}catch(e){console.error(e);grid.innerHTML='<div class=\"card empty\">تعذر تحميل بيانات الصور أو الأصناف. أعد المحاولة.</div>'}})();"
          if old_init in a:a=a.replace(old_init,new_init,1)
          elif new_init not in a: raise SystemExit('album init anchor missing')
          album.write_text(a,encoding='utf-8')

          s=emp.read_text(encoding='utf-8')
          old_load="""const loadImageBindingOverrides = async () => {
    try {
        const db = await getDb();
        const snap = await db.collection('system_controls').doc(IMAGE_BINDING_DOC).get();
        return snap.exists ? (snap.data()?.bindings || {}) : {};
    } catch (err) {
        console.warn('[V56.25 image bindings]', err);
        return {};
    }
};"""
          new_load="""const loadImageBindingOverrides = async () => {
    try {
        const r = await fetch('./api/image-admin?action=bindings', { cache: 'no-store' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data?.error || 'IMAGE_BINDINGS_LOAD_FAILED');
        return data?.bindings || {};
    } catch (err) {
        console.warn('[V56.31 image bindings]', err);
        return {};
    }
};"""
          if old_load in s:s=s.replace(old_load,new_load,1)
          elif new_load not in s: raise SystemExit('employee binding load anchor missing')

          save_start="const saveImageBindingOverride = async ({ sku, imageKey, updatedBy = 'مهند' }) => {"
          remove_start="const removeImageBindingOverride = async ({ sku, updatedBy = 'مهند' }) => {"
          parse_start="const parseCategories = (text) => {"
          i=s.index(save_start);j=s.index(remove_start,i);k=s.index(parse_start,j)
          mutators="""const imageAdminProof = () => { try { return JSON.parse(localStorage.getItem('inventory_login_photo_proof_v2') || 'null') || {}; } catch { return {}; } };
const imageAdminToken = () => { try { return String(localStorage.getItem('inventory_admin_token_v2') || ''); } catch { return ''; } };
const saveImageBindingOverride = async ({ sku, imageKey, updatedBy = 'مهند' }) => {
    const exactSku = normalizeImageSku(sku), exactImage = normalizeImageSku(imageKey);
    if (!exactSku || !exactImage) throw new Error('INVALID_IMAGE_BINDING');
    const r = await fetch('./api/image-admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'bind',sku:exactSku,imageKey:exactImage,updatedBy,adminToken:imageAdminToken(),adminProof:imageAdminProof()}) });
    const data = await r.json().catch(() => ({})); if(!r.ok) throw new Error(data?.error || 'IMAGE_BINDING_SAVE_FAILED'); return data;
};
const removeImageBindingOverride = async ({ sku, updatedBy = 'مهند' }) => {
    const exactSku = normalizeImageSku(sku); if(!exactSku) throw new Error('INVALID_IMAGE_BINDING');
    const r = await fetch('./api/image-admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'unbind',sku:exactSku,updatedBy,adminToken:imageAdminToken(),adminProof:imageAdminProof()}) });
    const data = await r.json().catch(() => ({})); if(!r.ok) throw new Error(data?.error || 'IMAGE_BINDING_REMOVE_FAILED'); return data;
};

"""
          s=s[:i]+mutators+s[k:]
          emp.write_text(s,encoding='utf-8')

          c=cust.read_text(encoding='utf-8')
          old_c="async function loadCustomerImageBindings(){\n  try{const snap=await db.collection('system_controls').doc('product_image_bindings').get();return snap.exists?(snap.data()?.bindings||{}):{}}catch(e){console.warn('[V56.25 customer image bindings]',e);return{}}\n}"
          new_c="async function loadCustomerImageBindings(){\n  try{const r=await fetch('./api/image-admin?action=bindings',{cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data?.error||'IMAGE_BINDINGS_LOAD_FAILED');return data?.bindings||{}}catch(e){console.warn('[V56.31 customer image bindings]',e);return{}}\n}"
          if old_c in c:c=c.replace(old_c,new_c,1)
          elif new_c not in c:raise SystemExit('customer binding load anchor missing')
          cust.write_text(c,encoding='utf-8')

          Path('tests/v56-31-image-binding-backend.mjs').write_text("""import fs from 'node:fs';import assert from 'node:assert/strict';
const api=fs.readFileSync('api/image-admin.js','utf8'),album=fs.readFileSync('image-distribution.html','utf8'),emp=fs.readFileSync('runtime/index-v37-source.txt','utf8'),cust=fs.readFileSync('runtime/customer-v37-source.txt','utf8');
for(const x of ['image-bindings-state','writeBinding','bindImage',\"action === 'bindings'\",\"action === 'bind'\"])assert.ok(api.includes(x),x);
assert.ok(album.includes(\"./api/image-admin?action=bindings\"));assert.ok(album.includes(\"action:'bind'\"));assert.ok(!album.includes(\"current[sku]=imageKey;tx.set(ref\"));
assert.ok(emp.includes(\"./api/image-admin?action=bindings\"));assert.ok(emp.includes(\"action:'bind'\"));assert.ok(emp.includes(\"action:'unbind'\"));assert.ok(cust.includes(\"./api/image-admin?action=bindings\"));
console.log('V56.31 image binding backend regression: PASS');\n""",encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check api/image-admin.js
          node tests/v56-31-image-binding-backend.mjs
          node tests/v56-27-image-binding-wiring.mjs
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898271+github-actions[bot]@users.noreply.github.com'
          git add image-distribution.html runtime/index-v37-source.txt runtime/customer-v37-source.txt tests/v56-31-image-binding-backend.mjs
          git commit -m 'V56.31 — wire image bindings to backend persistence'
          git push origin HEAD:main
