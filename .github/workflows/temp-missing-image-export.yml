name: Missing inventory image export
on:
  push:
    paths:
      - '.github/workflows/temp-missing-image-export.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download missing images
        run: |
          mkdir export-images
          for f in 468.webp 669.webp 822.webp BA_571.webp; do
            curl -fsSL "https://raw.githubusercontent.com/al-hzmi/inventory-system/main/images/$f" -o "export-images/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-images-missing
          path: export-images/
