name: V87 cashier sound and stable camera
on:
  push:
    branches: [feature/v87-cashier-beep-fixed-camera, main]
    paths: ['branch-presence.html','branch-presence.css','branch-presence.js','branch-scan-audio.js','sw.js','tests/v87-*','tests/v86-*','.github/workflows/v87-cashier-scan.yml']
  pull_request:
    paths: ['branch-presence.html','branch-presence.css','branch-presence.js','branch-scan-audio.js','sw.js','tests/v87-*','tests/v86-*','.github/workflows/v87-cashier-scan.yml']
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node tests/v87-cashier-geometry.cjs
      - run: node tests/v78-boot-service-worker.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v87-scan-camera-browser.cjs
      - run: BROWSER=webkit node tests/v87-scan-camera-browser.cjs
      - run: node tests/v83-branch-sync-browser.cjs
      - run: BROWSER=webkit node tests/v83-branch-sync-browser.cjs
      - run: npm run build
