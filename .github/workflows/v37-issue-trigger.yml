name: V37 Issue Triggered Repair
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  repair:
    if: github.event.issue.title == 'TRIGGER V37 ROUTING FIX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply V37 patch
        run: python3 .github/v37_patch.py
      - name: Verify critical source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          idx=Path('index.html').read_text(); cust=Path('customer.html').read_text(); sw=Path('customer-sw.js').read_text(); adm=Path('admin-dashboard.html').read_text(); st=Path('stocktake.html').read_text(); sta=Path('admin-stocktake.html').read_text()
          checks={
            'employee default route': "const __employeeMode = hasRememberedEmployeeSession() || __entryParams.get('employee') === '1';" in idx,
            'durable employee identity': 'return {valid:Boolean(name)' in idx,
            'compact customer switch': './customer.html?employeeView=1' in idx and '>عملاء</span>' in idx,
            'notification overlay': 'EmployeeAdminNotification' in idx and 'EmployeeAdminMessageScreen' not in idx and 'employeeAdminMessage && <EmployeeAdminNotification' in idx,
            'customer direct guard': "employeeName && params.get('employeeView')!=='1'" in cust,
            'employee customer identity': "EMPLOYEE_CUSTOMER_SESSION.name||'موظف'" in cust,
            'employee name prompt suppressed': '!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
            'customer sw v37': 'customer-sw.js?v=37.0' in cust and 'batco-customer-v37-0' in sw,
            'worker no employee/admin document capture': 'isDocument && !isCustomerDocument' in sw,
            'checkout preserved': 'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
            'employee auth preserved': 'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx,
            'admin customer monitoring preserved': 'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake preserved': 'stocktake_audit' in st and 'صنف موجود في فرق أخرى' in sta,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: print('\n'.join(bad)); sys.exit(1)
          for p in Path('.').glob('*.html'):
              s=p.read_text(errors='replace')
              if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: raise SystemExit(f'bad marker {p}')
          print('V37_INVARIANTS_PASS',len(checks))
          PY
      - name: Parse JavaScript and JSX
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          fail=[]; count=0
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(errors='replace')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  count+=1; babel='text/babel' in attrs; f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}'; f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/out.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: fail.append(f'{p}#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: fail.append(f'{p}: {r.stderr}')
          if fail: print('\n'.join(fail)); sys.exit(1)
          print('V37_SYNTAX_PASS',count)
          PY
      - name: Commit repair and cleanup
        shell: bash
        run: |
          set -euo pipefail
          printf 'V37 ROUTING + NOTIFICATION AUDIT\nresult=PASS\nemployee_default_route=success\nmanual_customer_switch=success\nnotification_nonblocking=success\nsyntax=success\n' > .github/quality-reports/v37-routing-notification-audit.txt
          rm -f .github/v37_patch.py .github/v37-trigger.txt
          rm -f .github/workflows/v37-issue-trigger.yml .github/workflows/v37-trigger-runner.yml .github/workflows/v37-routing-notification.yml .github/workflows/v37-quickpatch.yml
          git config user.name 'BATCO V37 Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix employee routing and notification banner V37'
          git push origin main
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "V37 repair completed and verified."
