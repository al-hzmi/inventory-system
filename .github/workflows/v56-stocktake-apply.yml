name: V56 Stocktake Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-stocktake-apply.yml'

permissions:
  contents: write

concurrency:
  group: v56-stocktake-production-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: v56-stocktake-build
          fetch-depth: 0

      - name: Materialize verified V56 payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          expected = {
            'stocktake.html': 'd1b3a6eff31410ad7447d1b8b571d782e91eb8fba35af80ac52f68888919732a',
            'admin-stocktake.html': 'cef8d74c90f8962084b2b31c7c7dfd2d5ec05f0b8a7979edc2fc682e057f3dc7',
            'tests/v56-stocktake-workflow.mjs': '733bb5be1f089801b300c30a4d6f018c8d3891f5f7a4e7d729818402487629e2',
            '.github/workflows/v56-stocktake-quality-gate.yml': '360a85343ee4fbac1ad8e245c6e3f233af84b806fbef29bd2b634173f3d125de',
          }
          chunks = {
            'stocktake.html': ['.v56_payload/stocktake.01','.v56_payload/stocktake.02'],
            'admin-stocktake.html': ['.v56_payload/admin.01','.v56_payload/admin.02','.v56_payload/admin.03'],
            'tests/v56-stocktake-workflow.mjs': ['.v56_payload/test.01'],
            '.github/workflows/v56-stocktake-quality-gate.yml': ['.v56_payload/quality.01'],
          }
          for target, parts in chunks.items():
              encoded = ''.join(Path(p).read_text(encoding='utf-8') for p in parts)
              encoded = ''.join(encoded.split())
              if target == 'admin-stocktake.html':
                  encoded = encoded.replace('pkeagdgLSm','pkeegdgLSm')
              raw = zlib.decompress(base64.b64decode(encoded))
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected[target]:
                  raise SystemExit(f'PAYLOAD HASH MISMATCH: {target}: {digest}')
              out = Path(target); out.parent.mkdir(parents=True, exist_ok=True); out.write_bytes(raw)
              print(f'OK {target} {digest}')
          shell = Path('admin-stocktake-shell.html')
          text = shell.read_text(encoding='utf-8')
          old_employee = 'href="./stocktake.html"'
          old_admin = 'src="./admin-stocktake.html?embedded=1"'
          if old_employee not in text and 'href="./stocktake.html?v=56.0"' not in text: raise SystemExit('employee shell marker missing')
          if old_admin not in text and 'src="./admin-stocktake.html?embedded=1&v=56.0"' not in text: raise SystemExit('admin shell marker missing')
          text = text.replace(old_employee, 'href="./stocktake.html?v=56.0"').replace(old_admin, 'src="./admin-stocktake.html?embedded=1&v=56.0"')
          shell.write_text(text, encoding='utf-8')
          PY

      - name: Verify V56 stocktake behavior and syntax
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          python - <<'PY'
          import re, pathlib, subprocess
          for name in ['stocktake.html','admin-stocktake.html']:
              html=pathlib.Path(name).read_text(encoding='utf-8')
              blocks=[body for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,flags=re.S|re.I) if 'src=' not in attrs.lower()]
              p=pathlib.Path('/tmp')/(name+'.js'); p.write_text('\n'.join(blocks),encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          grep -q 'stocktake.html?v=56.0' admin-stocktake-shell.html
          grep -q 'admin-stocktake.html?embedded=1&v=56.0' admin-stocktake-shell.html
          git diff --check

      - name: Commit production change and rebase latest main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v56_payload
          rm -f .github/workflows/v56-stocktake-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V56 — Production digital stocktake workflow'
          git fetch origin main
          git rebase origin/main

      - name: Re-verify after rebase
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          grep -q 'stocktake.html?v=56.0' admin-stocktake-shell.html
          grep -q 'admin-stocktake.html?embedded=1&v=56.0' admin-stocktake-shell.html
          git diff --check HEAD^

      - name: Publish V56 to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
