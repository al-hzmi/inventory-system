name: V88 photographed EAN and camera fill
on:
  push:
    branches: [feature/v88-ar-ean-link-camera-audio, main]
    paths: ['branch-presence-core.js','branch-presence.js','branch-scan-audio.js','branch-presence.css','branch-presence.html','sw.js','tests/v88-*','tests/v87-*','.github/workflows/v88-barcode.yml']
  pull_request:
    paths: ['branch-presence-core.js','branch-presence.js','branch-scan-audio.js','branch-presence.css','branch-presence.html','sw.js','tests/v88-*','tests/v87-*','.github/workflows/v88-barcode.yml']
permissions:
  contents: read
jobs:
  barcode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node tests/v88-real-label-mapping.cjs
      - run: node tests/v87-cashier-geometry.cjs
      - run: node tests/v85-ean-dual-engine.cjs
      - run: node tests/v78-boot-service-worker.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v88-real-label-browser.cjs
      - run: BROWSER=webkit node tests/v88-real-label-browser.cjs
      - run: node tests/v83-branch-sync-browser.cjs
      - run: BROWSER=webkit node tests/v83-branch-sync-browser.cjs
      - run: npm run build
