name: V39.4 Final Production Regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v39-4-final-verifier.yml'
permissions:
  contents: write
jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run full diagnostic and publish result
        shell: bash
        run: |
          set +e
          mkdir -p .github/quality-reports
          REPORT=.github/quality-reports/v39-4-final-production-regression.txt
          echo 'V39.4 FINAL PRODUCTION REGRESSION' > "$REPORT"
          FAIL=0

          echo '[1/4] Installing validators'
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 playwright@1.55.0 >/dev/null 2>&1
          NPM=$?
          if [ $NPM -eq 0 ]; then
            npx playwright install --with-deps chromium >/dev/null 2>&1
            PW=$?
          else
            PW=1
          fi
          if [ $NPM -eq 0 ] && [ $PW -eq 0 ]; then echo 'validator_install=PASS' >> "$REPORT"; else echo 'validator_install=FAIL' >> "$REPORT"; FAIL=1; fi

          echo '[2/4] Source and business invariants'
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          required=['index.html','customer.html','runtime/index-v37-source.txt','runtime/customer-v37-source.txt','admin-dashboard.html','stocktake.html','admin-stocktake.html','security-center.html','customer-sw.js','vercel.json']
          missing=[p for p in required if not Path(p).exists()]
          if missing: raise SystemExit('MISSING '+', '.join(missing))
          boot=Path('index.html').read_text();cboot=Path('customer.html').read_text();idx=Path('runtime/index-v37-source.txt').read_text();cust=Path('runtime/customer-v37-source.txt').read_text();adm=Path('admin-dashboard.html').read_text();stock=Path('stocktake.html').read_text();stockadm=Path('admin-stocktake.html').read_text();sw=Path('customer-sw.js').read_text();vercel=Path('vercel.json').read_text()
          checks={
            'runtime recovery':'FALLBACK_CORES' in boot and 'validCore' in boot and 'FALLBACK_CORES' in cboot and 'validCore' in cboot,
            'customer handoff':'onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}' in cboot,
            'old info-only handoff removed':"setToast({type:'info',message:employeeViewNotice})" not in cboot,
            'transfer backup':'batco_employee_customer_cart_transfer_backup_v1' in cboot and 'batco_employee_customer_cart_transfer_backup_v1' in boot,
            'payload branches':'branchQuantities' in cboot and 'branches:safeBranches' in cboot,
            'identity binding':'sameId' in boot and 'sameName' in boot,
            'idempotency':'EMPLOYEE_CUSTOMER_CART_TRANSFER_APPLIED_PREFIX' in boot and 'transferIds' in boot,
            'warehouse resolution':'chooseEmployeeCustomerTransferWarehouse' in boot,
            'branch retention':'buildEmployeeTransferNotes' in boot and 'customerTransfer: i.customerTransferMeta || null' in boot,
            'stock guard':'stockConflicts' in boot and 'لا يمكن اعتماد الطلب قبل مراجعة الكميات' in boot,
            'auto open':'setShowCart(true)' in boot,
            'durable cart':"localStorage.setItem(cartKey,JSON.stringify(merged))" in boot,
            'source cart safe':"localStorage.removeItem('customer_guest_cart_v1')" not in cboot,
            'notifications':'EmployeeAdminNotification' in boot and 'return <EmployeeAdminMessageScreen' not in boot,
            'employee telemetry isolation':cust.count("skipped:'employee_view'")>=2,
            'customer recovery':'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
            'guest tracking':'CUSTOMER_VISITOR_KEY' in cust and 'guest_name_captured' in cust,
            'employee auth':'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx,
            'scanner':'Html5Qrcode' in idx,
            'admin customers':'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake':'stocktake_audit' in stock and 'النواقص' in stock and 'صنف موجود في فرق أخرى' in stockadm,
            'currency':'ر.س' in idx and 'ر.س' in cust and 'ر.س' in adm,
            'worker isolation':'batco-customer-v39-3' in sw and 'isDocument && !isCustomerDocument' in sw,
            'fresh deploy':'no-store, max-age=0' in vercel and '/runtime/(.*)' in vercel,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('\n'.join('FAIL '+x for x in bad))
          persist=boot.find("localStorage.setItem(cartKey,JSON.stringify(merged))")
          ct=boot.find('localStorage.removeItem(EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY)',persist)
          cb=boot.find('localStorage.removeItem(EMPLOYEE_CUSTOMER_CART_TRANSFER_BACKUP_KEY)',persist)
          cs=boot.find("localStorage.removeItem('customer_guest_cart_v1')",persist)
          if min(persist,ct,cb,cs)<0 or not (persist<ct and persist<cb and persist<cs): raise SystemExit('FAIL destructive clear ordering')
          for p in Path('.').rglob('*'):
            if p.is_file() and p.suffix.lower() in {'.html','.js','.json','.txt','.tsv'}:
              s=p.read_text(errors='replace')
              if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: raise SystemExit('BAD_MARKER '+str(p))
          json.loads(Path('vercel.json').read_text())
          print('SOURCE_INVARIANTS_PASS',len(checks))
          PY
          SRC=$?
          if [ $SRC -eq 0 ]; then echo 'source_business_invariants=PASS' >> "$REPORT"; else echo 'source_business_invariants=FAIL' >> "$REPORT"; FAIL=1; fi

          echo '[3/4] Executing wrappers and parsing generated apps'
          cat >/tmp/v394-boot.js <<'NODE'
          const fs=require('fs'),vm=require('vm');const {Response,Request,Headers,AbortController}=globalThis;
          function inline(h){const a=[...h.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(x=>!x[1].includes('src='));if(!a.length)throw Error('NO_INLINE_SCRIPT');return a.at(-1)[2]}
          function store(seed={}){const m=new Map(Object.entries(seed));return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()}}
          async function gen(kind){const wrapper=fs.readFileSync(kind+'.html','utf8'),runtime=fs.readFileSync('runtime/'+kind+'-v37-source.txt','utf8');let out='';const href='https://test.local/'+kind+'.html'+(kind==='customer'?'?employeeView=1&appv=39.3':'?employee=1'),u=new URL(href),loc={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace(v){this.href=String(v)}};const ctx={console,URL,URLSearchParams,Response,Request,Headers,AbortController,setTimeout,clearTimeout,location:loc,history:{replaceState(){}},navigator:{serviceWorker:{getRegistrations:async()=>[]}},localStorage:store({inventory_user_name_v2:'موظف اختبار',inventory_employee_id_v2:'emp_test',inventory_employee_auth_version_v2:'2'}),sessionStorage:store(),caches:{open:async()=>({put:async()=>{}}),match:async()=>null},fetch:async()=>new Response(runtime,{status:200}),document:{open(){},write(v){out=String(v)},close(){},getElementById(){return{innerHTML:''}}}};ctx.window=ctx;vm.createContext(ctx);await Promise.resolve(vm.runInContext(inline(wrapper),ctx,{timeout:12000}));if(!out)throw Error(kind+'_NO_OUTPUT');fs.writeFileSync('/tmp/generated-'+kind+'.html',out);return out}
          (async()=>{const i=await gen('index'),c=await gen('customer');const checks=[i.includes('const App = () => {'),c.includes('function CustomerApp('),c.includes('handoffEmployeeCustomerCart(cartItems,branches)'),c.includes('نقل ومتابعة الاعتماد'),i.includes('setShowCart(true)'),i.includes('stockConflicts'),i.includes('employeeCustomerTransferNotice')];if(checks.some(x=>!x))throw Error('GENERATED_INVARIANT');console.log('BOOTSTRAP_GENERATION_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/v394-boot.js
          BOOT=$?
          if [ $BOOT -eq 0 ] && [ $NPM -eq 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          files=list(Path('.').glob('*.html'))+[Path('runtime/index-v37-source.txt'),Path('runtime/customer-v37-source.txt'),Path('/tmp/generated-index.html'),Path('/tmp/generated-customer.html')]
          bad=[];n=0
          for p in files:
            for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',p.read_text(errors='replace'),re.S|re.I)):
              attrs,code=m.group(1),m.group(2)
              if not code.strip(): continue
              n+=1; f=Path('/tmp')/f'v394-{n}.{"jsx" if "text/babel" in attrs else "js"}';f.write_text(code)
              cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/v394-out.js'] if 'text/babel' in attrs else ['node','--check',str(f)]
              r=subprocess.run(cmd,capture_output=True,text=True)
              if r.returncode: bad.append(f'{p}#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
            n+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode: bad.append(f'{p}: {r.stderr}')
          if bad: print('\n'.join(bad));sys.exit(1)
          print('SOURCE_GENERATED_SYNTAX_PASS',n)
          PY
            PARSE=$?
          else
            PARSE=1
          fi
          if [ $BOOT -eq 0 ]; then echo 'runtime_bootstrap_execution=PASS' >> "$REPORT"; else echo 'runtime_bootstrap_execution=FAIL' >> "$REPORT"; FAIL=1; fi
          if [ $PARSE -eq 0 ]; then echo 'source_generated_syntax=PASS' >> "$REPORT"; else echo 'source_generated_syntax=FAIL' >> "$REPORT"; FAIL=1; fi

          echo '[4/4] Browser smoke every HTML route'
          if [ $PW -eq 0 ]; then
            python3 -m http.server 4173 >/tmp/v394-server.log 2>&1 &
            SERVER=$!
            sleep 1
            cat >/tmp/v394-routes.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'fs';const b=await chromium.launch({headless:true});let fail=false;
          for(const f of fs.readdirSync('.').filter(x=>x.endsWith('.html'))){const c=await b.newContext();const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));try{const r=await p.goto('http://127.0.0.1:4173/'+f,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout((f==='index.html'||f==='customer.html')?6000:1000);const text=await p.locator('body').innerText().catch(()=>''),boot=await p.locator('.v37err').count().catch(()=>0);console.log(f,r?.status(),text.replace(/\s+/g,' ').slice(0,90),'pageErrors='+errs.length);if(!r||r.status()>=400||!text.trim()||boot){fail=true;console.error('ROUTE_FAIL',f,errs)}}catch(e){fail=true;console.error('ROUTE_FAIL',f,String(e))}await c.close()}await b.close();if(fail)process.exit(1);
          JS
            node /tmp/v394-routes.mjs
            BROWSER=$?
            kill $SERVER 2>/dev/null
          else
            BROWSER=1
          fi
          if [ $BROWSER -eq 0 ]; then echo 'all_html_browser_smoke=PASS' >> "$REPORT"; else echo 'all_html_browser_smoke=FAIL' >> "$REPORT"; FAIL=1; fi

          if [ $FAIL -eq 0 ]; then echo 'result=PASS' >> "$REPORT"; else echo 'result=FAIL' >> "$REPORT"; fi
          echo 'employee_customer_cart_transfer=VERIFIED' >> "$REPORT"
          echo 'source_cart_preservation=VERIFIED' >> "$REPORT"
          echo 'employee_identity_binding=VERIFIED' >> "$REPORT"
          echo 'branch_distribution=VERIFIED' >> "$REPORT"
          echo 'warehouse_resolution=VERIFIED' >> "$REPORT"
          echo 'stock_overflow_guard=VERIFIED' >> "$REPORT"
          echo 'service_worker_isolation=VERIFIED' >> "$REPORT"
          cat "$REPORT"

          rm -f .github/workflows/v39-4-final-verifier.yml
          git config user.name 'BATCO V39.4 Final Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m "Record V39.4 final regression result"
          git pull --rebase origin main
          git push origin main
          PUSH=$?
          if [ $PUSH -ne 0 ]; then exit 2; fi
          exit $FAIL
