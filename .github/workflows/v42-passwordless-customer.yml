name: V42 Passwordless Customer Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/customer-passwordless-v42]
permissions:
  contents: read
jobs:
  passwordless-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: V42 static invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('customer.html').read_text()
          checks={
            'company-only checkout':'هذه المعلومة الوحيدة المطلوبة' in s,
            'passwordless profile':"accountType:'passwordless_device'" in s,
            'firebase persisted auth':"authMode:'firebase_persisted_session'" in s and 'createUserWithEmailAndPassword(email,password)' in s,
            'no guest auth redirect':"onRequireAuth?.('submit')" not in s,
            'optional notes':'ملاحظة <span' in s and '(اختياري)' in s,
            'guest simple nav':"const nav=guestMode?" in s,
            'passwordless account nav':'safeProfile.passwordless?' in s,
            'checkout v7':'checkoutVersion:7' in s,
            'guest name v41 preserved':'setShowGuestNamePrompt(true),5000' in s,
            'employee transfer v40 preserved':'handoffEmployeeCustomerCart(cartItems,branches)' in s,
            'face sdk removed from generated runtime':"html=html.replace('<script src=\\\"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh" in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V42_STATIC_FAIL: '+', '.join(bad))
          print('V42_STATIC_PASS',len(checks))
          PY
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Passwordless checkout E2E against real Firebase permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/v42-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          node tests/v42-passwordless-customer.mjs
