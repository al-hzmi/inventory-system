name: V35 Comprehensive Full Site Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v35-comprehensive-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: structural
        name: Structural integrity and local references
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys
          failures=[]; scanned=[]
          for pat in ['*.html','*.js','*.json','*.css','*.md','*.txt','*.tsv']:
              scanned.extend(Path('.').glob(pat))
          for folder in ['api','data']:
              if Path(folder).exists(): scanned.extend(p for p in Path(folder).rglob('*') if p.is_file())
          for p in scanned:
              try:s=p.read_text(errors='strict')
              except Exception as e:failures.append(f'UTF8 {p}: {e}');continue
              if '<<<<<<<' in s or '>>>>>>>' in s:failures.append(f'MERGE_MARKER {p}')
              if '... (truncated)' in s:failures.append(f'TRUNCATED_PLACEHOLDER {p}')
          for p in Path('.').glob('*.json'):
              try:json.loads(p.read_text())
              except Exception as e:failures.append(f'JSON {p}: {e}')
          for p in Path('.').glob('*.html'):
              s=p.read_text(errors='replace')
              for val in re.findall(r'\b(?:src|href)=["\']([^"\']+)["\']',s,re.I):
                  v=val.strip()
                  if not v or v.startswith(('#','http:','https:','//','data:','blob:','mailto:','tel:','javascript:')) or any(x in v for x in ['{','}','`','$']):continue
                  v=v.split('?')[0].split('#')[0]
                  if not v:continue
                  target=(p.parent/v).resolve()
                  try:target.relative_to(Path('.').resolve())
                  except ValueError:continue
                  if not target.exists():failures.append(f'BROKEN_LOCAL_REF {p}: {val}')
          if failures:
              print('\n'.join(sorted(set(failures))));sys.exit(1)
          print('STRUCTURAL_OK files=',len(scanned),'root_html=',len(list(Path('.').glob('*.html'))))
          PY

      - id: deps
        name: Install syntax checker
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1

      - id: syntax
        name: Parse every HTML script and JavaScript file
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          failures=[];count=0
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(errors='replace')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip():continue
                  count+=1
                  babel=bool(re.search(r'type=["\']text/babel["\']',attrs,re.I));ext='.jsx' if babel else '.js'
                  f=Path('/tmp')/f'{p.stem}-{i}{ext}';f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/check.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode:failures.append(f'{p} script#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+(list(Path('api').glob('*.js')) if Path('api').exists() else []):
              count+=1;r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:failures.append(f'{p}: {r.stderr}')
          if failures:print('\n'.join(failures));sys.exit(1)
          print('SYNTAX_OK scripts=',count)
          PY

      - id: semantic
        name: Business critical regression invariants
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          idx=Path('index.html').read_text();cust=Path('customer.html').read_text();adm=Path('admin-dashboard.html').read_text();stock=Path('stocktake.html').read_text();stockadm=Path('admin-stocktake.html').read_text();sw=Path('customer-sw.js').read_text()
          checks={
            'remembered employee session':'hasRememberedEmployeeSession' in idx and 'inventory_employee_auth_version_v2' in idx,
            'employee auto default':"__entryParams.get('chooser') !== '1' && hasRememberedEmployeeSession()" in idx,
            'manual customer switch':"./customer.html?employeeView=1" in idx and 'واجهة العملاء' in idx,
            'direct customer employee guard':'EMPLOYEE_CUSTOMER_AUTO_ROUTE' in cust and "window.location.replace('./index.html?employee=1')" in cust,
            'employee customer identity':"EMPLOYEE_CUSTOMER_SESSION.name||'موظف'" in cust,
            'employee customer activity isolation':cust.count("skipped:'employee_view'")>=2,
            'employee guest heartbeat isolation':'if(!guestMode||EMPLOYEE_CUSTOMER_VIEW)return;' in cust,
            'employee name prompt isolation':'!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
            'employee customer action guard':cust.count('employeeViewNotice')>=4,
            'employee customer return':'العودة لنظام الموظفين' in cust,
            'customer cache v35':'customer-sw.js?v=35.0' in cust and 'batco-customer-v35-0' in sw,
            'V32 checkout snapshot':'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust,
            'V32 success receipt':'OrderSuccessScreen' in cust,
            'V32 WhatsApp share':'whatsapp_share_opened' in cust,
            'V33 visitor tracking':'CUSTOMER_VISITOR_KEY' in cust and 'guest_name_captured' in cust and 'guest_enter' in cust,
            'currency compatibility':'ر.س' in idx and 'ر.س' in cust and 'ر.س' in adm,
            'employee PBKDF2 auth':'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_AUTH_VERSION' in idx,
            'employee face/security':'face_mesh' in idx and 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx,
            'employee messages':'EMPLOYEE_NOTIFICATION_COLLECTION' in idx and 'رسالة من الإدارة' in idx,
            'employee access control':'employeeSiteAccessAllowed' in idx and 'EMPLOYEE_SITE_CONTROL_DOC' in idx,
            'employee barcode scanner':'Html5Qrcode' in idx,
            'customer portal control':'CustomerPortalBootstrap' in cust and 'CUSTOMER_PORTAL_CONTROL_DOC' in cust,
            'admin visitor monitoring':'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake admin entry':'./admin-stocktake.html' in adm and 'إدارة الجرد' in adm,
            'stocktake employee gate':'currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId' in idx,
            'stocktake count/audit':'stocktake_audit' in stock and 'data-full' in stock and 'النواقص' in stock and 'ملاحظات' in stock,
            'stocktake duplicate prevention':'صنف موجود في فرق أخرى' in stockadm,
            'security center':Path('security-center.html').exists() and Path('security-center.html').stat().st_size>1000,
          }
          failures=[k for k,v in checks.items() if not v]
          if idx.count('const stocktakeControl = useStocktakeControl();')!=1:failures.append('stocktake hook duplicate/missing')
          app=idx.find('const App = () => {');hook=idx.find('const stocktakeControl = useStocktakeControl();');use=idx.find('const currentStocktakeAccessAllowed = stocktakeAccessAllowed(stocktakeControl')
          if min(app,hook,use)<0 or not app<hook<use:failures.append('stocktake hook declaration order')
          for p in Path('.').glob('*.html'):
              s=p.read_text(errors='replace')
              for m in re.finditer(r'\bconst\s+([A-Za-z_$][\w$]*)\s*=\s*\1\s*[+\-*/]',s):failures.append(f'self-reference {p}:{m.group(1)}')
          if failures:print('FAILED:\n- '+'\n- '.join(failures));sys.exit(1)
          print('SEMANTIC_OK checks=',len(checks))
          PY

      - id: browserdeps
        name: Install browser runtime
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - id: browser
        name: Browser runtime audit of every root HTML page
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat >/tmp/v35-full-runtime.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const base='http://127.0.0.1:4173';
          const employee={inventory_user_name_v2:'اختبار تقني',inventory_employee_id_v2:'audit_employee',inventory_employee_auth_version_v2:'2'};
          const admin={inventory_user_name_v2:'مهند',inventory_admin_token_v2:'1jh297-spgf2z'};
          const scenarios=[
            ['public-entry','/index.html',{}],['employee-auto','/index.html',employee],['employee-explicit','/index.html?employee=1',employee],['admin-employee','/index.html?employee=1',admin],
            ['public-customer','/customer.html',{}],['employee-customer-direct','/customer.html',employee],['employee-customer-view','/customer.html?employeeView=1',employee],
            ['admin-dashboard','/admin-dashboard.html',admin],['stocktake-employee','/stocktake.html',employee],['admin-stocktake','/admin-stocktake.html',admin],['security-center','/security-center.html',admin]
          ];
          const covered=new Set(scenarios.map(x=>x[1].split('?')[0].slice(1)));
          for(const f of fs.readdirSync('.').filter(x=>x.endsWith('.html')))if(!covered.has(f))scenarios.push([`all-html:${f}`,`/${f}`,{}]);
          const browser=await chromium.launch({headless:true});let failed=false;
          for(const [name,path,store] of scenarios){
            const context=await browser.newContext();
            await context.addInitScript(store=>{localStorage.clear();sessionStorage.clear();for(const [k,v] of Object.entries(store))localStorage.setItem(k,v)},store);
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(String(e?.stack||e)));
            try{
              const resp=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(5500);
              const text=(await page.locator('body').innerText().catch(()=>'' )).trim();const final=page.url();const visible=text.replace(/\s+/g,' ').length;
              console.log(`RUNTIME ${name} http=${resp?.status()} final=${final} chars=${visible}`);
              if(!resp||resp.status()>=400){failed=true;console.error(`HTTP_FAIL ${name}`)}
              if(errors.length){failed=true;console.error(`PAGEERROR ${name}: ${errors.join(' | ')}`)}
              if(visible<8){failed=true;console.error(`BLANK_PAGE ${name}`)}
              if(name==='public-entry'&&!text.includes('حدد نوع الدخول للمتابعة')){failed=true;console.error('PUBLIC_CHOOSER_MISSING')}
              if(name==='employee-auto'&&text.includes('حدد نوع الدخول للمتابعة')){failed=true;console.error('EMPLOYEE_AUTO_ROUTING_FAILED')}
              if(name==='employee-explicit'&&text.includes('حدد نوع الدخول للمتابعة')){failed=true;console.error('EMPLOYEE_EXPLICIT_ROUTING_FAILED')}
              if(name==='public-customer'&&final.includes('/index.html?employee=1')){failed=true;console.error('PUBLIC_CUSTOMER_WRONG_REDIRECT')}
              if(name==='employee-customer-direct'&&!final.includes('/index.html?employee=1')){failed=true;console.error('EMPLOYEE_CUSTOMER_DIRECT_GUARD_FAILED')}
              if(name==='employee-customer-view'){
                const flag=await page.evaluate(()=>window.__employeeCustomerView===true).catch(()=>false);
                const guest=await page.evaluate(()=>localStorage.getItem('customer_guest_name_v1')).catch(()=>null);
                if(!flag){failed=true;console.error('EMPLOYEE_CUSTOMER_VIEW_FLAG_FAILED')}
                if(guest!==null){failed=true;console.error('EMPLOYEE_VIEW_GUEST_NAME_POLLUTION')}
                if(text.includes('اسمك الكريم')){failed=true;console.error('EMPLOYEE_VIEW_NAME_PROMPT_VISIBLE')}
                if(!text.includes('اختبار تقني')){failed=true;console.error('EMPLOYEE_VIEW_IDENTITY_MISSING')}
                const back=page.getByRole('button',{name:'الموظفين'}).first();
                if(await back.count()){await back.click();await page.waitForTimeout(1200);const t=await page.locator('body').innerText().catch(()=>'' );if(!page.url().includes('/index.html?employee=1')||t.includes('حدد نوع الدخول للمتابعة')){failed=true;console.error('EMPLOYEE_RETURN_FLOW_FAILED')}}else{failed=true;console.error('EMPLOYEE_RETURN_BUTTON_MISSING')}
              }
              if(name==='admin-employee'&&!text.includes('إدارة الجرد')){failed=true;console.error('ADMIN_STOCKTAKE_ENTRY_MISSING')}
            }catch(e){failed=true;console.error(`NAV_FAIL ${name}: ${e?.stack||e}`)}
            await context.close();
          }
          await browser.close();if(failed)process.exit(1);console.log('BROWSER_OK scenarios=',scenarios.length);
          JS
          node /tmp/v35-full-runtime.mjs

      - id: report
        name: Persist audit report
        if: always()
        shell: bash
        env:
          STRUCTURAL: ${{ steps.structural.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          SEMANTIC: ${{ steps.semantic.outcome }}
          BROWSER_DEPS: ${{ steps.browserdeps.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .github/quality-reports
          RESULT=PASS
          for x in "$STRUCTURAL" "$DEPS" "$SYNTAX" "$SEMANTIC" "$BROWSER_DEPS" "$BROWSER"; do [ "$x" = success ] || RESULT=FAIL; done
          cat > .github/quality-reports/v35-full-site-audit.txt <<EOF
          V35 FULL SITE AUDIT
          result=$RESULT
          tested_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          structural=$STRUCTURAL
          syntax_dependencies=$DEPS
          syntax=$SYNTAX
          semantic_regression=$SEMANTIC
          browser_dependencies=$BROWSER_DEPS
          browser_runtime=$BROWSER
          EOF
          git config user.name "BATCO Quality Gate"
          git config user.email "actions@users.noreply.github.com"
          git add .github/quality-reports/v35-full-site-audit.txt
          git commit -m "Record V35 comprehensive site audit $RESULT"
          git push origin main
          [ "$RESULT" = PASS ]
