name: Guest Tracking and Currency Compatibility V33

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/guest_tracking_currency_v33.py'
      - '.github/workflows/guest-tracking-currency-v33.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply V33 patch
        run: python3 .github/scripts/guest_tracking_currency_v33.py

      - name: Extract Babel scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['customer.html','admin-dashboard.html','index.html']:
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script\s+type=["\']text/babel["\']>(.*?)</script>',text,re.S|re.I)
              if not scripts:
                  raise SystemExit(f'No Babel script found in {name}')
              Path('/tmp/'+name.replace('.html','.jsx')).write_text('\n'.join(scripts),encoding='utf-8')
          PY

      - name: Validate JSX syntax
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/parser@7.28.3 >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs');
          const parser=require('@babel/parser');
          for(const f of ['/tmp/customer.jsx','/tmp/admin-dashboard.jsx','/tmp/index.jsx']){
            const code=fs.readFileSync(f,'utf8');
            parser.parse(code,{sourceType:'script',plugins:['jsx','optionalChaining','nullishCoalescingOperator']});
            console.log('Parsed:',f);
          }
          NODE

      - name: Verify business-critical behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files={n:Path(n).read_text(encoding='utf-8') for n in ['customer.html','admin-dashboard.html','index.html','customer-sw.js']}
          assert all('⃁' not in files[n] for n in ['customer.html','admin-dashboard.html','index.html'])
          for needle in ['guest_name_captured','guest_enter','guest_active','customerVisitorId','visitorId:customerVisitorId']:
              assert needle in files['customer.html'], needle
          for needle in ['customerOnlineCount','العملاء والزوار الآن','زوار سجّلوا الاسم','زائر غير مسمى']:
              assert needle in files['admin-dashboard.html'], needle
          assert 'customer-sw.js?v=33.0' in files['customer.html']
          assert 'batco-customer-v33-0' in files['customer-sw.js']
          assert 'ر.س' in files['customer.html'] and 'ر.س' in files['admin-dashboard.html'] and 'ر.س' in files['index.html']
          print('V33 critical checks passed.')
          PY

      - name: Commit verified fix and cleanup temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/guest_tracking_currency_v33.py .github/workflows/guest-tracking-currency-v33.yml
          git add customer.html admin-dashboard.html index.html customer-sw.js
          git commit -m 'Fix currency compatibility and track named guest presence'
          git push origin main
