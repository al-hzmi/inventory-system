name: Stocktake Admin Entry V36
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stocktake-entry-v36.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch stocktake admin entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          idxp=Path('index.html')
          s=idxp.read_text()
          old='''                            {currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId && (\n                                <button onClick={() => { window.location.href = './stocktake.html'; }} title="فتح الجرد"\n                                        className="flex items-center justify-center gap-7 h-48 px-12 rounded-12 bg-successSoft border border-success/20 text-success hover:bg-success hover:text-white transition-colors animate-flip">\n                                    <Icon.Archive className="w-20 h-20" />\n                                    <span className="hidden md:inline text-[12px] font-bold whitespace-nowrap">الجرد</span>\n                                </button>\n                            )}'''
          new='''                            {isAdmin ? (\n                                <button onClick={() => { window.location.href = './admin-stocktake.html'; }} title="إدارة الجرد"\n                                        className="flex items-center justify-center gap-7 h-48 px-12 rounded-12 bg-successSoft border border-success/20 text-success hover:bg-success hover:text-white transition-colors animate-flip">\n                                    <Icon.Archive className="w-20 h-20" />\n                                    <span className="hidden md:inline text-[12px] font-bold whitespace-nowrap">إدارة الجرد</span>\n                                </button>\n                            ) : (currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId && (\n                                <button onClick={() => { window.location.href = './stocktake.html'; }} title="فتح الجرد"\n                                        className="flex items-center justify-center gap-7 h-48 px-12 rounded-12 bg-successSoft border border-success/20 text-success hover:bg-success hover:text-white transition-colors animate-flip">\n                                    <Icon.Archive className="w-20 h-20" />\n                                    <span className="hidden md:inline text-[12px] font-bold whitespace-nowrap">الجرد</span>\n                                </button>\n                            ))}'''
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one old stocktake button block, found {s.count(old)}')
          idxp.write_text(s.replace(old,new,1))
          PY
      - name: Validate patched index
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script[^>]*type=["\']text/babel["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(blocks):
              f=Path('/tmp')/f'index-{i}.jsx'; f.write_text(code)
              r=subprocess.run(['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/out.js'],capture_output=True,text=True)
              if r.returncode: print(r.stderr); sys.exit(1)
          assert "window.location.href = './admin-stocktake.html'" in s
          assert '>إدارة الجرد</span>' in s
          assert 'currentStocktakeAccessAllowed && stocktakeControl.activeCampaignId' in s
          print('STOCKTAKE_ENTRY_V36_OK')
          PY
      - name: Commit index repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expose stocktake management to admin V36"
          git push origin main
