name: V110 Customer category rail and mobile touch regression
on:
  push:
    branches: [main]
    paths:
      - 'runtime/customer-v37-source.txt'
      - 'customer.html'
      - 'sw.js'
      - 'tests/v107-customer-swipe-category-order.cjs'
      - 'tests/v105-customer-catalog-quota.cjs'
      - 'tests/v108-mobile-webkit-scroller.cjs'
      - 'tests/v109-customer-viewport-swipe.cjs'
      - 'tests/v110-progressive-category-rail.cjs'
      - '.github/workflows/v108-safari-swipe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/v107-customer-swipe-category-order.cjs
      - run: node tests/v110-progressive-category-rail.cjs
      - run: node tests/v105-customer-catalog-quota.cjs
      - run: node tests/v103-sku-identity.cjs
      - run: node tests/v90-data-reliability.cjs
      - run: node tests/v95-login-stocktake-integrity.cjs
      - run: node tests/v96-live-employee-visibility.cjs
      - run: node tests/v99-integrity-recovery.cjs
      - run: npm run build
  mobile-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v108-mobile-webkit-scroller.cjs
      - run: node tests/v109-customer-viewport-swipe.cjs
