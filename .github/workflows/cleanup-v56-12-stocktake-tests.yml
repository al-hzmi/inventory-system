name: V56.12 Cleanup Legacy Test Stocktakes
on:
  push:
    branches: [main]
    paths:
      - 'tools/cleanup_v56_12_stocktake_tests.mjs'
      - '.github/workflows/cleanup-v56-12-stocktake-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cleanup script syntax
        run: node --check tools/cleanup_v56_12_stocktake_tests.mjs
      - name: Delete legacy test campaigns and related rows
        run: node tools/cleanup_v56_12_stocktake_tests.mjs