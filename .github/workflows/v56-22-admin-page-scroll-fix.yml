name: V56.22 Admin Page Scroll Lock Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-22-admin-page-scroll-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V56.22 body scroll lock fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-dashboard.html')
          s=p.read_text()
          if 'const useBodyScrollLock=(active=true)=>' not in s:
              old="""const useBodyScrollLock=()=>{useEffect(()=>{\n  const w=window,body=document.body,html=document.documentElement;"""
              new="""const useBodyScrollLock=(active=true)=>{useEffect(()=>{\n  if(!active)return;\n  const w=window,body=document.body,html=document.documentElement;"""
              if old not in s: raise SystemExit('V56.22 hook start anchor missing')
              s=s.replace(old,new,1)
              old_end="""delete w.__BATCO_BODY_SCROLL_LOCK;requestAnimationFrame(()=>window.scrollTo(0,y))}};\n},[])};"""
              new_end="""delete w.__BATCO_BODY_SCROLL_LOCK;requestAnimationFrame(()=>window.scrollTo(0,y))}};\n},[active])};"""
              if old_end not in s: raise SystemExit('V56.22 hook dependency anchor missing')
              s=s.replace(old_end,new_end,1)
          old_drawer="""function DetailDrawer({row,onClose,onCustomerMessage}){\n  useBodyScrollLock();"""
          if old_drawer in s:
              s=s.replace(old_drawer,"""function DetailDrawer({row,onClose,onCustomerMessage}){\n  useBodyScrollLock(Boolean(row));""",1)
          if 'useBodyScrollLock(Boolean(row));' not in s: raise SystemExit('V56.22 conditional DetailDrawer lock missing')
          p.write_text(s)

          t=Path('tests/v56-17-ops-polish.mjs')
          ts=t.read_text()
          old="assert.ok((admin.match(/useBodyScrollLock\\(\\);/g)||[]).length>=6&&admin.includes('customer_guest_presence')&&admin.includes('onCustomerMessage={target=>'));"
          new="assert.ok((admin.match(/useBodyScrollLock\\(\\);/g)||[]).length>=5&&admin.includes('useBodyScrollLock(Boolean(row));')&&admin.includes('const useBodyScrollLock=(active=true)=>')&&admin.includes('customer_guest_presence')&&admin.includes('onCustomerMessage={target=>'));"
          if old in ts: ts=ts.replace(old,new,1)
          elif new not in ts: raise SystemExit('V56.22 v56-17 regression anchor missing')
          t.write_text(ts)
          PY
      - name: V56.22 regression
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const s=fs.readFileSync('admin-dashboard.html','utf8');
          assert.ok(s.includes('const useBodyScrollLock=(active=true)=>{useEffect(()=>{\n  if(!active)return;'));
          assert.ok(s.includes('},[active])};'));
          assert.ok(s.includes('function DetailDrawer({row,onClose,onCustomerMessage}){\n  useBodyScrollLock(Boolean(row));'));
          assert.ok(!s.includes('function DetailDrawer({row,onClose,onCustomerMessage}){\n  useBodyScrollLock();'));
          console.log('V56.22 admin page scrolling regression: OK');
          NODE
          git diff --check
      - name: Existing UX regressions
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/v56-17-ops-polish.mjs tests/v56-10-critical-ux.mjs tests/v56-11-ops-fixes.mjs tests/v56-4-messaging.mjs; do
            if [ -f "$t" ]; then node "$t"; fi
          done
      - name: Commit V56.22
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html tests/v56-17-ops-polish.mjs
          git commit -m "V56.22 — only lock admin page scroll for open detail drawer"
          git pull --rebase origin main
          node tests/v56-17-ops-polish.mjs
          git push origin HEAD:main
