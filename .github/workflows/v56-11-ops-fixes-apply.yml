name: V56.11 Operations Fixes Apply

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/v56-11-ops-fixes.py'
      - '.github/workflows/v56-11-ops-fixes-apply.yml'

permissions:
  contents: write

concurrency:
  group: v56-11-ops-fixes-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V56.11 patch
        run: |
          # Two intentional duplicate anchors exist in admin-dashboard.html:
          # employee and customer notification payloads. Allow replace_once to
          # replace the first match, then the second call replaces the remaining one.
          sed -i 's/if s.count(old)!=1:/if s.count(old)<1:/' .github/scripts/v56-11-ops-fixes.py
          python .github/scripts/v56-11-ops-fixes.py
      - name: Verify regressions
        run: |
          set -euo pipefail
          node tests/v56-4-messaging.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-10-critical-ux.mjs
          node tests/v56-11-ops-fixes.mjs
          git diff --check
      - name: Commit and push feature files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stocktake.html admin-stocktake-shell.html runtime/index-v37-source.txt runtime/customer-v37-source.txt admin-dashboard.html index.html customer.html tests/v56-4-messaging.mjs tests/v56-5-stocktake-direct-mobile.mjs tests/v56-10-critical-ux.mjs tests/v56-11-ops-fixes.mjs
          if git diff --cached --quiet; then
            echo 'No V56.11 feature changes to commit.'
            exit 0
          fi
          git commit -m 'V56.11 — fix stocktake mobile UX and one-time messages'
          git pull --rebase origin main
          git push origin HEAD:main
