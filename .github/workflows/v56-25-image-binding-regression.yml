name: V56.25 Image Binding Regression

on:
  push:
    branches: [main]
    paths:
      - 'data/images_list.txt'
      - 'runtime/index-v37-source.txt'
      - 'runtime/customer-v37-source.txt'
      - 'index.html'
      - 'customer.html'
      - '.github/workflows/v56-25-image-binding-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collision-safe employee and customer image binding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest=Path('data/images_list.txt').read_text(encoding='utf-8')
          employee=Path('runtime/index-v37-source.txt').read_text(encoding='utf-8')
          customer=Path('runtime/customer-v37-source.txt').read_text(encoding='utf-8')
          wrapper=Path('customer.html').read_text(encoding='utf-8')

          assert 'BA_209\t209.webp' in manifest
          assert not any(line.strip()=='209\t209.webp' for line in manifest.splitlines())

          for token in ['normalizeImageSku','imageForItem','product_image_bindings','admin_mohanad']:
              assert token in employee, f'employee missing {token}'

          for token in [
              'V56.25 customer image identity — exact SKU first; numeric fallback only when unique.',
              'const normalizeImageSku = raw =>',
              'map.set(imageSku,{cleanId,imageSku,id,',
              'const skuKey=normalizeImageSku(item.imageSku||item.id)||item.cleanId;',
              'buildCustomerImageCollisionIndex',
              'resolveCustomerImage',
              "doc('product_image_bindings')",
              'owners.size!==1',
          ]:
              assert token in customer, f'customer missing {token}'
          assert 'images.has(x.cleanId)' not in customer
          assert 'images.get(x.cleanId)' not in customer
          assert './runtime/customer-v37-source.txt?v=56.25' in wrapper

          # Superseded prototypes used separate state and must stay removed.
          assert not Path('v56-image-repair.js').exists()
          assert not Path('.github/workflows/apply-v56-25-image-binding-repair.yml').exists()
          assert not Path('.github/workflows/apply-v56-25-customer-image-binding.yml').exists()

          # Behavioral regression for the exact BA_209 / AR_M209 collision.
          def norm_sku(v): return re.sub(r'[^A-Z0-9_-]','',str(v).strip().upper())
          def clean(v): return ''.join(ch for ch in str(v) if ch.isdigit())
          owners={}
          for sku in ['BA_209','AR_M209']:
              owners.setdefault(clean(sku),set()).add(norm_sku(sku))
          exact={'BA_209':'209.webp'}
          def resolve(sku,override=None):
              key=norm_sku(sku)
              if override and norm_sku(override) in exact: return exact[norm_sku(override)]
              if key in exact: return exact[key]
              return '' if len(owners.get(clean(sku),set())) != 1 else None
          assert resolve('BA_209')=='209.webp'
          assert resolve('AR_M209')==''
          assert resolve('AR_M209','BA_209')=='209.webp'
          print('V56.25 image binding regression PASS')
          PY
