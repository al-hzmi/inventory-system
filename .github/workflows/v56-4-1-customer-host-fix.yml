name: V56.4.1 Customer Host Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-4-1-customer-host-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Relocate customer notification host
        run: python3 .github/scripts/v56-4-1-customer-host-fix.py
      - name: Verify messaging regressions and raw syntax
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-4-messaging.mjs
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 playwright@1.55.0 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          p=Path('runtime/customer-v37-source.txt');s=p.read_text();fail=[]
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              attrs,code=m.group(1),m.group(2)
              if not code.strip(): continue
              f=Path('/tmp')/f'customer-{i}.{"jsx" if "text/babel" in attrs else "js"}';f.write_text(code)
              cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/customer-check.js'] if 'text/babel' in attrs else ['node','--check',str(f)]
              r=subprocess.run(cmd,capture_output=True,text=True)
              if r.returncode: fail.append(r.stderr)
          if fail: print('\n'.join(fail));sys.exit(1)
          print('CUSTOMER_RAW_SYNTAX_OK')
          PY
          git diff --check
      - name: Customer bootstrap browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/v5641-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > /tmp/v5641-smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          const base='http://127.0.0.1:4173';
          const b=await chromium.launch({headless:true});
          let failed=false;
          for(const [name,path,store] of [
            ['customer-public','/customer.html',{}],
            ['customer-employee-manual','/customer.html?employeeView=1',{inventory_user_name_v2:'اختبار موظف',inventory_employee_id_v2:'audit_employee',inventory_employee_auth_version_v2:'2'}]
          ]){
            const c=await b.newContext();
            await c.addInitScript(s=>{localStorage.clear();sessionStorage.clear();for(const[k,v]of Object.entries(s))localStorage.setItem(k,v)},store);
            const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text())});
            const r=await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(6000);
            const text=await p.locator('body').innerText().catch(()=>''),url=p.url();
            console.log(name,r?.status(),url,text.replace(/\s+/g,' ').slice(0,220));if(errs.length)console.error(name,'errors',errs.join(' | '));
            if(!r||r.status()>=400||text.trim().length<8||errs.some(x=>/CustomerAdminNotificationHost is not defined|ReferenceError/.test(x)))failed=true;
            if(name==='customer-employee-manual'&&(text.includes('اسمك الكريم')||!text.includes('اختبار موظف')||!text.includes('الموظفين')))failed=true;
            await c.close();
          }
          await b.close();if(failed)process.exit(1);
          JS
          node /tmp/v5641-smoke.mjs
      - name: Commit verified customer host fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/customer-v37-source.txt tests/v56-4-messaging.mjs
          git commit -m 'V56.4.1 — keep customer messaging outside V42 bootstrap replacement'
          git push origin main
