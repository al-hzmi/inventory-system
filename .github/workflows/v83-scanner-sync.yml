name: V83 scanner sync customer and approval gate
on:
  push:
    branches: [feature/v83-scanner-sync-approval-sound, main]
    paths: ['branch-presence.*','stocktake.html','customer.html','batco-brand-footer.js','sw.js','tests/v83-*','tests/v82-brand-footer.cjs','.github/workflows/v83-scanner-sync.yml']
  pull_request:
    paths: ['branch-presence.*','stocktake.html','customer.html','batco-brand-footer.js','sw.js','tests/v83-*','tests/v82-brand-footer.cjs','.github/workflows/v83-scanner-sync.yml']
permissions:
  contents: read
jobs:
  scanner-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node tests/v83-scanner-sync-sound.cjs
      - run: node tests/v82-brand-footer.cjs
      - run: node tests/v78-boot-service-worker.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v83-branch-sync-browser.cjs
      - run: BROWSER=webkit node tests/v83-branch-sync-browser.cjs
      - run: node tests/v80-branch-presence-browser.cjs
      - run: BROWSER=webkit node tests/v80-branch-presence-browser.cjs
      - run: npm run build
