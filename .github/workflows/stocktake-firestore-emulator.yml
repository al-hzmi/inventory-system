name: Stocktake synthetic Firestore emulator
on:
  pull_request:
    paths:
      - 'tests/emulator/**'
      - 'stocktake.html'
      - 'stocktake-core.js'
      - 'stocktake-branches.js'
      - '.github/workflows/stocktake-firestore-emulator.yml'
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund firebase@10.8.0
      - run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-inventory-reliability --config tests/emulator/firebase.json 'node tests/emulator/firestore-concurrency.cjs && node tests/emulator/stocktake-app.cjs'
