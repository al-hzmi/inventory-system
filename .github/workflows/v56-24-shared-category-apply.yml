name: V56.24 Shared Category Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-24-shared-category-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V56.24
        run: python3 scripts/v56-24-apply.py
      - name: Regression
        run: |
          node tests/v56-24-shared-product-categories.mjs
          node tests/v56-10-critical-ux.mjs
          node tests/v56-17-ops-polish.mjs
          git diff --check
      - name: Commit V56.24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html tests/v56-24-shared-product-categories.mjs
          git commit -m "V56.24 — add shared product category manager"
          git pull --rebase origin main
          node tests/v56-24-shared-product-categories.mjs
          node tests/v56-10-critical-ux.mjs
          node tests/v56-17-ops-polish.mjs
          git push origin HEAD:main
