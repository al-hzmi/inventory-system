            --nd96-line:#CFE3D7;
            --nd96-white:#FFFFFF;
            --primary:#0F2C31;--secondary:#365B50;--muted:#71847C;--border:#CFE3D7;--surface:#F2F8F4;
            --accent:#008B4C;--accentSoft:#E4F4E9;--success:#008B4C;--successSoft:#E5F7EA;
            --p:#0F2C31;--s:#365B50;--m:#71847C;--b:#CFE3D7;--sf:#F2F8F4;--a:#008B4C;--as:#E4F4E9;--ok:#008B4C;--oks:#E5F7EA;
            --admin-ink:#0F2C31;--admin-muted:#64776F;--admin-line:#CFE3D7;--admin-green:#008B4C;
