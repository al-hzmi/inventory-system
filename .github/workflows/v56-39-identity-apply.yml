          html.batco-identity-national96 .missionEyebrow{color:#BDE8CB!important}
          html.batco-identity-national96 .mission .progress>i{background:linear-gradient(90deg,#008B4C,#54AE63)!important}

          /* Executive/admin shell */
          html.batco-identity-national96 .v52-sidebar{
            background:var(--nd96-deep)!important;color:#fff!important;
            background-image:linear-gradient(180deg,rgba(0,139,76,.08),transparent 32%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 8px,transparent 8px 16px)!important;
            border-inline-start-color:rgba(255,255,255,.10)!important;
          }
          html.batco-identity-national96 .v52-sidebar .v52-brand-copy b,
