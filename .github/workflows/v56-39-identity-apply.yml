name: V56.39 Identity Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-39-identity-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build occasion identity system
        shell: bash
        run: |
          set -euo pipefail

          cat > national-day-96-mark.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
            <title id="title">هوية اليوم الوطني السعودي 96</title>
            <desc id="desc">شارة خضراء بنقوش هندسية مستوحاة من الهوية النجدية واليوم الوطني السعودي 96</desc>
            <defs>
              <pattern id="weave" width="24" height="24" patternUnits="userSpaceOnUse">
                <rect width="24" height="24" fill="#0F2C31"/>
                <rect width="12" height="12" fill="#14393B"/>
                <rect x="12" y="12" width="12" height="12" fill="#14393B"/>
                <rect x="4" y="4" width="4" height="4" fill="#008B4C" opacity=".55"/>
                <rect x="16" y="16" width="4" height="4" fill="#3D8943" opacity=".6"/>
              </pattern>
              <pattern id="teeth" width="28" height="18" patternUnits="userSpaceOnUse">
                <path d="M0 9 7 2l7 7-7 7zM14 9l7-7 7 7-7 7z" fill="#3D8943"/>
              </pattern>
              <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#008B4C"/>
                <stop offset="1" stop-color="#006B3B"/>
              </linearGradient>
              <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001E22" flood-opacity=".18"/>
              </filter>
            </defs>
            <rect x="58" y="32" width="644" height="152" rx="4" fill="url(#weave)" filter="url(#soft)"/>
            <rect x="58" y="22" width="644" height="12" fill="url(#teeth)"/>
            <rect x="58" y="182" width="644" height="12" fill="url(#teeth)"/>
            <g fill="#008B4C" opacity=".95">
              <path d="M70 48h22v22H70zM96 48h22v22H96zM70 74h22v22H70zM660 48h22v22h-22zM634 48h22v22h-22zM660 74h22v22h-22z"/>
              <path d="M70 120h22v22H70zM96 146h22v22H96zM660 120h22v22h-22zM634 146h22v22h-22z" opacity=".7"/>
            </g>
            <text x="380" y="130" fill="#FFFFFF" font-size="66" font-weight="800" text-anchor="middle" direction="rtl" font-family="IBM Plex Sans Arabic, Noto Kufi Arabic, Arial, sans-serif">عزنا بطبعنا</text>
            <text x="380" y="233" fill="#0F2C31" font-size="36" font-weight="800" text-anchor="middle" direction="rtl" font-family="IBM Plex Sans Arabic, Arial, sans-serif">اليوم الوطني السعودي 96</text>
            <text x="380" y="274" fill="#3D8943" font-size="18" font-weight="700" letter-spacing="8" text-anchor="middle" font-family="Arial, sans-serif">SAUDI NATIONAL DAY 96</text>
            <rect x="58" y="207" width="86" height="6" rx="3" fill="url(#green)"/>
            <rect x="616" y="207" width="86" height="6" rx="3" fill="url(#green)"/>
          </svg>
          SVG

          cat > v56-39-national-day.css <<'CSS'
