            background:rgba(0,139,76,.24)!important;color:#fff!important;border-color:rgba(255,255,255,.10)!important;
          }
          html.batco-identity-national96 .v52-brand-mark{background:var(--nd96-green)!important;color:#fff!important;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.18)!important}
          html.batco-identity-national96 #v52-mobile-header{background:rgba(15,44,49,.97)!important;border-bottom-color:rgba(255,255,255,.10)!important}
          html.batco-identity-national96 #v52-mobile-header .v52-mobile-copy b,
          html.batco-identity-national96 #v52-mobile-header .v52-mobile-copy span{color:#fff!important}
          html.batco-identity-national96 #v52-mobile-nav{border-top-color:var(--nd96-line)!important}
          html.batco-identity-national96 #v52-mobile-nav:before{
            content:"";position:absolute;inset-inline:0;top:0;height:4px;pointer-events:none;
            background:repeating-conic-gradient(from 45deg,var(--nd96-green) 0 25%,var(--nd96-deep) 0 50%) 0/12px 12px;
          }
          html.batco-identity-national96 .v52-mobile-nav-item.on{color:var(--nd96-green)!important}

          /* Decorative frame: inspired by the supplied woven/diamond references. */
          #batco-nd96-frame{position:fixed;inset:0;z-index:34;pointer-events:none;overflow:hidden}
          #batco-nd96-frame:before,#batco-nd96-frame:after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-conic-gradient(from 45deg,var(--nd96-deep) 0 25%,var(--nd96-green) 0 50%) 0/16px 16px;opacity:.96}
          #batco-nd96-frame:before{top:0}#batco-nd96-frame:after{bottom:0}
          #batco-nd96-frame .nd96-corner{position:absolute;width:84px;height:84px;opacity:.13;background:
            linear-gradient(45deg,transparent 38%,var(--nd96-green) 38% 62%,transparent 62%),
            linear-gradient(-45deg,transparent 38%,var(--nd96-leaf) 38% 62%,transparent 62%);background-size:28px 28px}
          #batco-nd96-frame .a{top:18px;right:14px}#batco-nd96-frame .b{bottom:18px;left:14px;transform:rotate(180deg)}
          #batco-nd96-badge{position:fixed;z-index:35;top:14px;left:14px;width:210px;pointer-events:none;border-radius:16px;background:rgba(255,255,255,.94);border:1px solid rgba(0,139,76,.24);box-shadow:0 14px 38px rgba(15,44,49,.15);padding:8px 10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
          #batco-nd96-badge img{display:block;width:100%;height:auto}
          @media(max-width:760px){
            #batco-nd96-badge{top:auto;bottom:78px;left:10px;width:136px;padding:5px 7px;border-radius:12px;opacity:.94}
            #batco-nd96-frame .nd96-corner{width:58px;height:58px;background-size:20px 20px}
          }
          @media(prefers-reduced-motion:no-preference){
            #batco-nd96-badge{animation:nd96In .38s cubic-bezier(.16,1,.3,1) both}@keyframes nd96In{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
          }
          CSS

          cat > v56-39-site-identity.js <<'JS'
          (()=>{
          'use strict';
          const VERSION='56.39';
          const CACHE_KEY='batco_site_identity_cache_v1';
          const PREVIEW_KEY='batco_identity_preview_v1';
          const CONTROL_COLLECTION='system_controls';
          const CONTROL_DOC='site_identity';
          const DEFAULT_IDENTITY='default';
          const NATIONAL_IDENTITY='national96';
          const DEFAULT_STATE={activeIdentity:DEFAULT_IDENTITY,enabled:false,revision:1};
          const FIREBASE_CONFIG={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374'};
          let liveState={...DEFAULT_STATE},unsubscribe=null;

          const safeJson=value=>{try{return JSON.parse(value)}catch{return null}};
          const readPreview=()=>{try{const v=sessionStorage.getItem(PREVIEW_KEY)||'';return v===NATIONAL_IDENTITY?v:''}catch{return''}};
          const normalize=row=>{
            const source=row&&typeof row==='object'?row:{};
            const national=source.enabled===true&&source.activeIdentity===NATIONAL_IDENTITY;
            return {activeIdentity:national?NATIONAL_IDENTITY:DEFAULT_IDENTITY,enabled:national,revision:Number(source.revision)||1,updatedAt:source.updatedAt||null,updatedBy:String(source.updatedBy||'')};
          };
          const wanted=()=>readPreview()||liveState.activeIdentity||DEFAULT_IDENTITY;
          const afterDom=fn=>document.body?fn():document.addEventListener('DOMContentLoaded',fn,{once:true});
          const ensureStyle=()=>{
            let link=document.getElementById('v56-39-national-day-css');
            if(link)return link;
            link=document.createElement('link');link.id='v56-39-national-day-css';link.rel='stylesheet';link.href='./v56-39-national-day.css?v=56.39';document.head.appendChild(link);return link;
          };
          const ensureDecorations=()=>afterDom(()=>{
            if(!document.getElementById('batco-nd96-frame')){
              const frame=document.createElement('div');frame.id='batco-nd96-frame';frame.setAttribute('aria-hidden','true');frame.innerHTML='<i class="nd96-corner a"></i><i class="nd96-corner b"></i>';document.body.appendChild(frame);
            }
            if(!document.getElementById('batco-nd96-badge')){
              const badge=document.createElement('div');badge.id='batco-nd96-badge';badge.setAttribute('aria-hidden','true');badge.innerHTML='<img src="./national-day-96-mark.svg?v=56.39" alt="">';document.body.appendChild(badge);
            }
          });
          const clearDecorations=()=>afterDom(()=>{document.getElementById('batco-nd96-frame')?.remove();document.getElementById('batco-nd96-badge')?.remove()});
          const setThemeColor=active=>{
            const meta=document.querySelector('meta[name="theme-color"]');if(!meta)return;
            if(!meta.dataset.identityDefault)meta.dataset.identityDefault=meta.getAttribute('content')||'#FFFFFF';
            meta.setAttribute('content',active?'#008B4C':meta.dataset.identityDefault);
          };
          const apply=(identity,source='live')=>{
            const active=identity===NATIONAL_IDENTITY;
            if(active)ensureStyle();
            document.documentElement.classList.toggle('batco-identity-national96',active);
            document.documentElement.dataset.siteIdentity=active?NATIONAL_IDENTITY:DEFAULT_IDENTITY;
            afterDom(()=>document.body.classList.toggle('batco-identity-national96',active));
            setThemeColor(active);
            active?ensureDecorations():clearDecorations();
            try{window.dispatchEvent(new CustomEvent('batco:identitychange',{detail:{identity:active?NATIONAL_IDENTITY:DEFAULT_IDENTITY,active,source,version:VERSION}}))}catch{}
          };
          const applyCurrent=source=>apply(wanted(),source||'live');
          const cache=state=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({...state,cachedAt:Date.now()}))}catch{}};
          const bootstrapCache=()=>{
            const preview=readPreview();
            if(preview){apply(preview,'preview-cache');return}
            try{const cached=normalize(safeJson(localStorage.getItem(CACHE_KEY)||'null'));liveState=cached;applyCurrent('cache')}catch{apply(DEFAULT_IDENTITY,'default')}
          };
          const loadScript=(id,src)=>new Promise((resolve,reject)=>{
            const existing=document.getElementById(id);if(existing){if(existing.dataset.ready==='1'||window.firebase)return resolve();existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}
            const s=document.createElement('script');s.id=id;s.src=src;s.async=true;s.onload=()=>{s.dataset.ready='1';resolve()};s.onerror=reject;document.head.appendChild(s);
          });
          const firestore=async()=>{
            if(!window.firebase?.firestore){await loadScript('batco-identity-firebase-app','https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js');await loadScript('batco-identity-firestore','https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js')}
            if(!window.firebase?.firestore)throw new Error('FIREBASE_UNAVAILABLE');
            if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
            return firebase.firestore();
          };
          const subscribe=async()=>{
            try{
              const db=await firestore();
              unsubscribe=db.collection(CONTROL_COLLECTION).doc(CONTROL_DOC).onSnapshot(snap=>{
                liveState=normalize(snap.exists?snap.data():DEFAULT_STATE);cache(liveState);applyCurrent(readPreview()?'preview':'firestore');
              },error=>console.warn('[V56.39 identity] realtime unavailable; cached identity retained',error));
            }catch(error){console.warn('[V56.39 identity] control unavailable; cached/default identity retained',error)}
          };
          const setPreview=identity=>{try{if(identity===NATIONAL_IDENTITY)sessionStorage.setItem(PREVIEW_KEY,NATIONAL_IDENTITY);else sessionStorage.removeItem(PREVIEW_KEY)}catch{}applyCurrent('preview')};
          const clearPreview=()=>{try{sessionStorage.removeItem(PREVIEW_KEY)}catch{}applyCurrent('preview-clear')};
          const getState=()=>({version:VERSION,live:{...liveState},preview:readPreview(),effective:wanted()});

          window.__BATCO_SITE_IDENTITY={version:VERSION,apply,setPreview,clearPreview,getState,control:{collection:CONTROL_COLLECTION,doc:CONTROL_DOC},supported:[DEFAULT_IDENTITY,NATIONAL_IDENTITY]};
          bootstrapCache();subscribe();
          window.addEventListener('storage',event=>{if(event.key===CACHE_KEY&&!readPreview()){liveState=normalize(safeJson(event.newValue||'null'));applyCurrent('storage')}});
          })();
          JS

          cat > identities.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#FFFFFF">
            <title>الهويات والمناسبات | بيت الأواني الطيبة</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
            <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
            <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
            <script src="./v56-39-site-identity.js?v=56.39"></script>
            <style>
              :root{--ink:#17211c;--muted:#66716b;--line:#e4e9e6;--surface:#f6f8f7;--green:#008B4C;--deep:#0F2C31;--leaf:#3D8943}
              *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--surface);color:var(--ink)}button{font:inherit;cursor:pointer}.page{max-width:1100px;margin:auto;padding:28px 22px 110px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}.heroCopy,.heroArt,.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 38px rgba(23,33,28,.055)}.heroCopy{padding:28px}.eyebrow{font-size:11px;font-weight:800;color:var(--green)}h1{font-size:30px;line-height:1.4;margin:5px 0 8px}.lead{font-size:13px;line-height:2;color:var(--muted);max-width:640px}.heroArt{padding:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f7fbf8,#eef7f1)}.heroArt img{width:100%;max-width:520px}.statusRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line);background:#fff}.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}.pill.on{color:#006B3B;background:#eaf7ee;border-color:#cdebd7}.pill.on .dot{background:#008B4C}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.card{padding:22px;position:relative;overflow:hidden}.card.featured:before{content:"";position:absolute;inset-inline:0;top:0;height:6px;background:repeating-conic-gradient(from 45deg,#0F2C31 0 25%,#008B4C 0 50%) 0/16px 16px}.cardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#f1f5f3;color:var(--deep)}.featured .icon{background:#e4f4e9;color:var(--green)}h2{font-size:18px;margin:14px 0 5px}.note{font-size:12px;color:var(--muted);line-height:1.8}.palette{display:flex;gap:8px;margin:16px 0}.swatch{width:38px;height:38px;border-radius:12px;border:1px solid rgba(0,0,0,.06)}.features{display:grid;gap:7px;margin:16px 0}.feature{font-size:11px;color:#365b50;display:flex;gap:8px;align-items:center}.feature:before{content:"✓";width:19px;height:19px;border-radius:7px;background:#e4f4e9;color:#008B4C;display:inline-flex;align-items:center;justify-content:center;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:800}.btn.primary{background:var(--deep);color:#fff;border-color:var(--deep)}.btn.green{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.48;cursor:not-allowed}.lock{font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#f3f4f6;color:#6b7280}.lock.ready{background:#eaf7ee;color:#006B3B}.system{margin-top:18px;padding:18px 20px;border-radius:20px;background:#0F2C31;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}.system b{font-size:13px}.system span{font-size:10px;color:#c7d6d0;display:block;margin-top:3px}.system strong{font-size:11px;color:#bde8cb}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:13px;background:#0F2C31;color:#fff;font-size:12px;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.2);transition:.2s;z-index:300}.toast.show{opacity:1;transform:translate(-50%,0)}
              @media(max-width:800px){.page{padding:20px 14px 110px}.hero{grid-template-columns:1fr}.heroCopy{padding:22px}.heroArt{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:25px}.system{align-items:flex-start;flex-direction:column}}
            </style>
          </head>
          <body>
            <main class="page" data-testid="identity-console">
              <section class="hero">
                <div class="heroCopy">
                  <div class="eyebrow">إدارة الهوية الموسمية</div>
