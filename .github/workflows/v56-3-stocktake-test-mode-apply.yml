name: V56.3 Stocktake Test Mode Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-3-stocktake-test-mode-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'V56.3 bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply V56.3 patch
        run: python3 .github/scripts/v56-3-stocktake-test-mode-apply.py

      - name: Verify V56.3
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          git diff --check
          grep -q 'id="testCampaign"' admin-stocktake.html
          grep -q "testSource:'current_inventory'" admin-stocktake.html

      - name: Commit V56.3 feature
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/site-quality-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-stocktake.html
          git commit -m 'V56.3 — add isolated stocktake test mode from current inventory'
          git push origin main
