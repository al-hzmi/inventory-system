name: V37 Explicit Trigger Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/v37-trigger.txt'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch
        run: python3 .github/v37_patch.py
      - name: Verify syntax and critical behavior
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          fail=[]; scripts=0
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(errors='replace')
              if '<<<<<<<' in s or '>>>>>>>' in s or '... (truncated)' in s: fail.append(f'bad marker {p}')
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  scripts+=1; babel=bool(re.search(r'type=["\']text/babel["\']',attrs,re.I)); f=Path('/tmp')/f'{p.stem}-{i}.{"jsx" if babel else "js"}'; f.write_text(code)
                  cmd=['npx','esbuild',str(f),'--loader:.jsx=jsx','--outfile=/tmp/out.js'] if babel else ['node','--check',str(f)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: fail.append(f'{p} script#{i}: {r.stderr}')
          for p in list(Path('.').glob('*.js'))+list(Path('api').glob('*.js')):
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: fail.append(f'{p}: {r.stderr}')
          idx=Path('index.html').read_text();cust=Path('customer.html').read_text();sw=Path('customer-sw.js').read_text();adm=Path('admin-dashboard.html').read_text();st=Path('stocktake.html').read_text();sta=Path('admin-stocktake.html').read_text()
          checks={
            'employee-default':"const __employeeMode = hasRememberedEmployeeSession() || __entryParams.get('employee') === '1';" in idx,
            'durable-employee-identity':"return {valid:Boolean(name)" in idx,
            'manual-customer-switch':'./customer.html?employeeView=1' in idx and '>عملاء</span>' in idx,
            'nonblocking-notification':'EmployeeAdminNotification' in idx and 'EmployeeAdminMessageScreen' not in idx and 'employeeAdminMessage && <EmployeeAdminNotification' in idx,
            'customer-direct-guard':"employeeName && params.get('employeeView')!=='1'" in cust,
            'customer-employee-view':"get('employeeView')==='1'" in cust and "EMPLOYEE_CUSTOMER_SESSION.name||'موظف'" in cust,
            'no-name-prompt':'!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt' in cust,
            'sw-v37':'customer-sw.js?v=37.0' in cust and 'batco-customer-v37-0' in sw,
            'sw-document-scope':'isDocument && !isCustomerDocument' in sw,
            'orders':'PENDING_CHECKOUT_SNAPSHOT_KEY' in cust and 'OrderSuccessScreen' in cust and 'whatsapp_share_opened' in cust,
            'employee-auth':'deriveEmployeePasswordHash' in idx and 'EMPLOYEE_SECURITY_PHOTO_COLLECTION' in idx,
            'visitor-monitoring':'العملاء والزوار الآن' in adm and 'customerSessionOnline' in adm,
            'stocktake':'stocktake_audit' in st and 'صنف موجود في فرق أخرى' in sta,
          }
          fail += [k for k,v in checks.items() if not v]
          if fail: print('FAIL\n'+'\n'.join(fail)); sys.exit(1)
          print('V37_VERIFY_PASS scripts=',scripts,'checks=',len(checks))
          PY
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          printf 'V37 ROUTING + NOTIFICATION AUDIT\nresult=PASS\nstatic_and_syntax=success\n' > .github/quality-reports/v37-routing-notification-audit.txt
          rm -f .github/v37_patch.py .github/v37-trigger.txt
          rm -f .github/workflows/v37-trigger-runner.yml .github/workflows/v37-routing-notification.yml .github/workflows/v37-quickpatch.yml
          git config user.name 'BATCO V37 Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix employee routing and nonblocking notifications V37'
          git push origin main
