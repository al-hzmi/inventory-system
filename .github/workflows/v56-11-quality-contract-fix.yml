name: V56.11 Quality Contract Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v56-11-quality-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update blind-count quality contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/site-quality-gate.yml')
          s=p.read_text()
          old="'stocktake V56 blind audit/count': 'stocktake_audit' in stock and 'العد الأول أعمى' in stock and 'quantity_found_later' in stock and '+ كمية عُثر عليها' in stock and 'navigator.vibrate' in stock and 'ملاحظات' in stock,"
          new="'stocktake V56 blind audit/count': 'stocktake_audit' in stock and 'counted?`<div class=\"qtygrid\"' in stock and '<div class=\"blind\"></div>' in stock and 'quantity_found_later' in stock and '+ كمية عُثر عليها' in stock and 'navigator.vibrate' in stock and 'ملاحظات' in stock,"
          if s.count(old)!=1: raise SystemExit(f'expected one stale blind-count contract, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-quality-gate.yml
          git commit -m 'Verify stocktake blind behavior without UI copy'
          git pull --rebase origin main
          git push origin HEAD:main
