name: V56.11 Operations Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stocktake mobile UX and one-time messaging
        run: |
          set -euo pipefail
          node tests/v56-11-ops-fixes.mjs
          node tests/v56-4-messaging.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-10-critical-ux.mjs
          node tests/v56-stocktake-workflow.mjs
          git diff --check
      - name: Repair stale blind-count quality contract
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/site-quality-gate.yml')
          s=p.read_text()
          old="'stocktake V56 blind audit/count': 'stocktake_audit' in stock and 'العد الأول أعمى' in stock and 'quantity_found_later' in stock and '+ كمية عُثر عليها' in stock and 'navigator.vibrate' in stock and 'ملاحظات' in stock,"
          new="'stocktake V56 blind audit/count': 'stocktake_audit' in stock and 'counted?`<div class=\"qtygrid\"' in stock and '<div class=\"blind\"></div>' in stock and 'quantity_found_later' in stock and '+ كمية عُثر عليها' in stock and 'navigator.vibrate' in stock and 'ملاحظات' in stock,"
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('blind-count quality contract not found')
          PY
          git diff --check
          if git diff --quiet -- .github/workflows/site-quality-gate.yml; then
            echo 'Quality contract already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-quality-gate.yml
          git commit -m 'Verify stocktake blind behavior without UI copy'
          git pull --rebase origin main
          git push origin HEAD:main
