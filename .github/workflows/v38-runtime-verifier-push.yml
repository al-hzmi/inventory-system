name: V38 Runtime Verifier Push
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save esbuild@0.25.9 >/dev/null 2>&1
      - name: Execute bootstraps against production runtime sources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-v38.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {Response}=globalThis;
          function inlineScript(html){const all=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>!m[1].includes('src='));if(!all.length)throw new Error('NO_INLINE_SCRIPT');return all[all.length-1][2];}
          function storage(seed={}){const m=new Map(Object.entries(seed));return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()};}
          async function execute(kind){
            const wrapper=fs.readFileSync(kind==='index'?'index.html':'customer.html','utf8');
            const runtime=fs.readFileSync(kind==='index'?'runtime/index-v37-source.txt':'runtime/customer-v37-source.txt','utf8');
            let written='',replaced='';
            const ls=storage({inventory_user_name_v2:'موظف اختبار',inventory_employee_id_v2:'emp_test',inventory_employee_auth_version_v2:'2',batco_employee_customer_cart_transfer_v1:JSON.stringify({version:1,transferId:'ect_test',createdAt:Date.now(),employeeName:'موظف اختبار',employeeId:'emp_test',source:'customer_portal_employee_view',items:[{cleanId:'10032',id:'ARM_10032',name:'منتج اختبار',totalQty:1,cartonPrice:128,pack:'12',branchQuantities:{b_main:1}}],branches:[{id:'b_main',name:'الفرع الرئيسي'}]})});
            const href=kind==='index'?'https://example.test/index.html?employee=1&customerCartTransfer=1':'https://example.test/customer.html?employeeView=1';
            const u=new URL(href),location={href:u.href,search:u.search,pathname:u.pathname,hash:u.hash,replace:v=>{replaced=String(v);location.href=String(v)}};
            const ctx={console,URL,URLSearchParams,Response,Request:globalThis.Request,Headers:globalThis.Headers,setTimeout,clearTimeout,location,history:{replaceState(){}},navigator:{},localStorage:ls,caches:{open:async()=>({put:async()=>{}}),match:async()=>null},fetch:async()=>({ok:true,status:200,text:async()=>runtime}),document:{open(){},write(v){written=String(v)},close(){},getElementById(){return {innerHTML:''}}}};
            ctx.window=ctx;ctx.window.location=location;vm.createContext(ctx);
            const result=vm.runInContext(inlineScript(wrapper),ctx,{timeout:8000,filename:kind+'-bootstrap.js'});await Promise.resolve(result);
            if(!written)throw new Error(kind.toUpperCase()+'_NO_DOCUMENT_WRITE '+replaced);fs.writeFileSync('/tmp/generated-'+kind+'.html',written);return written;
          }
          (async()=>{
            const idx=await execute('index'),cust=await execute('customer');
            const checks={customer_helper:cust.includes('function handoffEmployeeCustomerCart(cartItems,branches)'),customer_checkout_handoff:cust.includes('onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}'),customer_old_block_removed:!cust.includes("onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?setToast({type:'info',message:employeeViewNotice}):setCheckout(true)}"),employee_transfer_key:idx.includes("const EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY='batco_employee_customer_cart_transfer_v1'"),employee_auto_open:idx.includes('setShowCart(true)'),employee_idempotency:idx.includes('transferIds:[...new Set([...priorIds,transferId])]'),employee_stock_guard:idx.includes('const stockConflicts = items.filter'),employee_branch_notes:idx.includes('buildEmployeeTransferNotes(Object.values(cart || {}))'),employee_firestore_meta:idx.includes('customerTransfer: i.customerTransferMeta || null'),employee_message_nonblocking:idx.includes('EmployeeAdminNotification')&&!idx.includes('return <EmployeeAdminMessageScreen')};
            const bad=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);if(bad.length)throw new Error('FAILED_CHECKS '+bad.join(','));console.log('V38_RUNTIME_PATCH_PASS',Object.keys(checks).length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify-v38.js
      - name: Parse generated JavaScript and JSX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          failures=[];count=0
          for name in ['index','customer']:
              html=Path('/tmp/generated-'+name+'.html').read_text()
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I)):
                  attrs,code=m.group(1),m.group(2)
                  if not code.strip(): continue
                  count+=1;p=Path('/tmp')/f'generated-{name}-{i}.jsx';p.write_text(code)
                  cmd=['npx','esbuild',str(p),'--loader:.jsx=jsx','--outfile=/tmp/out.js'] if 'text/babel' in attrs else ['node','--check',str(p)]
                  r=subprocess.run(cmd,capture_output=True,text=True)
                  if r.returncode: failures.append(f'{name}#{i}: {r.stderr}')
          if failures: print('\n'.join(failures));sys.exit(1)
          print('V38_GENERATED_SYNTAX_PASS',count)
          PY
      - name: Verify durability, identity and stock safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text();cust=Path('customer.html').read_text()
          checks={
            'source cart preserved before redirect': "localStorage.removeItem('customer_guest_cart_v1')" not in cust,
            'employee cart durable write': "localStorage.setItem(cartKey,JSON.stringify(merged))" in idx,
            'source cart clear after import': "localStorage.removeItem('customer_guest_cart_v1')" in idx,
            'idempotent transfer': 'EMPLOYEE_CUSTOMER_CART_TRANSFER_APPLIED_PREFIX' in idx and 'transferIds' in idx,
            'employee identity binding': 'sameId' in idx and 'sameName' in idx,
            'warehouse selection': 'chooseEmployeeCustomerTransferWarehouse' in idx,
            'overstock block': 'stockConflicts' in idx,
            'branch allocation retained': 'branchQuantities' in cust and 'branchQuantities' in idx,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('\n'.join('FAIL '+x for x in bad))
          if idx.index("localStorage.setItem(cartKey,JSON.stringify(merged))") > idx.index("localStorage.removeItem('customer_guest_cart_v1')"):
              raise SystemExit('FAIL source cart cleared before employee cart persisted')
          print('V38_SAFETY_PASS',len(checks))
          PY
      - name: Record PASS and remove temporary verifiers
        shell: bash
        run: |
          set -euo pipefail
          printf 'V38 EMPLOYEE CUSTOMER CART TRANSFER AUDIT\nresult=PASS\nruntime_bootstrap=PASS\ngenerated_jsx=PASS\nidempotent_transfer=PASS\nsource_cart_preserved_until_import=PASS\nemployee_identity_binding=PASS\nwarehouse_selection=PASS\noverstock_guard=PASS\nbranch_distribution_preserved=PASS\n' > .github/quality-reports/v38-employee-customer-transfer-audit.txt
          rm -f .github/workflows/v38-runtime-verifier.yml .github/workflows/v38-runtime-verifier-push.yml
          git config user.name 'BATCO V38 Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record V38 employee customer cart transfer PASS'
          git push origin main
