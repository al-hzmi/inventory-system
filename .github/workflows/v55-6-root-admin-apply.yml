name: V55.6 ROOT Admin QR Apply

on:
  push:
    paths:
      - '.github/workflows/v55-6-root-admin-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ROOT approval semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('runtime/index-v37-source.txt')
          text = runtime.read_text(encoding='utf-8')

          old = """const REMOTE_LOGIN_COLLECTION = 'employee_remote_login_challenges';\nconst REMOTE_LOGIN_TTL_MS = 2 * 60 * 1000;"""
          new = """const REMOTE_LOGIN_COLLECTION = 'employee_remote_login_challenges';\nconst REMOTE_LOGIN_TTL_MS = 2 * 60 * 1000;\nconst ROOT_ADMIN_EMPLOYEE_ID = 'admin_mohanad';\nconst isRootRemoteApprover = identity => Boolean(identity?.valid && identity.role === 'admin' && identity.employeeId === ROOT_ADMIN_EMPLOYEE_ID);"""
          if old not in text:
              raise SystemExit('ROOT_CONSTANT_MARKER_MISSING')
          text = text.replace(old, new, 1)

          old = """const remoteApproverIdentityError = (challenge, identity) => {\n    const expectedRole = challenge?.isAdmin ? 'admin' : 'employee';\n    if (!identity?.valid) return 'يجب فتح النظام على هذا الجوال والدخول بحساب صاحب الطلب أولًا، ثم مسح رمز جديد من الكمبيوتر.';\n    if (identity.role !== expectedRole || identity.employeeId !== String(challenge?.employeeId || '')) {"""
          new = """const remoteApproverIdentityError = (challenge, identity) => {\n    const expectedRole = challenge?.isAdmin ? 'admin' : 'employee';\n    if (!identity?.valid) return 'يجب فتح النظام على هذا الجوال والدخول بحساب صاحب الطلب أولًا، ثم مسح رمز جديد من الكمبيوتر.';\n    // مهند هو ROOT الوحيد: حسابه الموثوق يستطيع اعتماد أي مستخدم. أي حساب آخر يظل مقيدًا بهويته فقط.\n    if (identity.role === 'admin' && identity.employeeId === 'admin_mohanad') return '';\n    if (identity.role !== expectedRole || identity.employeeId !== String(challenge?.employeeId || '')) {"""
          if old not in text:
              raise SystemExit('IDENTITY_GUARD_MARKER_MISSING')
          text = text.replace(old, new, 1)

          old = """                const expectedApproverRole = account?.isAdmin ? 'admin' : 'employee';\n                if (row.approverEmployeeId !== account?.id || row.approverRole !== expectedApproverRole || !row.approverPhotoProofId) {\n                    setError('رفض النظام الموافقة لأنها صادرة من حساب جوال مختلف عن صاحب الطلب.');\n                    return;\n                }\n                try {\n                    const approverProofSnap = await db.collection(EMPLOYEE_SECURITY_PHOTO_COLLECTION).doc(row.approverPhotoProofId).get();\n                    const approverProof = approverProofSnap.exists ? approverProofSnap.data() : null;\n                    const proofRoleMatches = expectedApproverRole === 'admin' ? approverProof?.isAdmin === true : approverProof?.isAdmin !== true;\n                    if (!approverProof || approverProof.employeeId !== account?.id || !proofRoleMatches) {\n                        setError('رفض النظام هوية الجوال لأنها لا تملك تحققًا سابقًا للحساب نفسه.');\n                        return;\n                    }\n                } catch (err) {"""
          new = """                const expectedApproverRole = account?.isAdmin ? 'admin' : 'employee';\n                const approvedByRoot = row.approverEmployeeId === ROOT_ADMIN_EMPLOYEE_ID && row.approverRole === 'admin';\n                const approvedByOwner = row.approverEmployeeId === account?.id && row.approverRole === expectedApproverRole;\n                if ((!approvedByRoot && !approvedByOwner) || !row.approverPhotoProofId) {\n                    setError('رفض النظام الموافقة لأنها صادرة من حساب غير مخول لاعتماد هذا الطلب.');\n                    return;\n                }\n                try {\n                    const approverProofSnap = await db.collection(EMPLOYEE_SECURITY_PHOTO_COLLECTION).doc(row.approverPhotoProofId).get();\n                    const approverProof = approverProofSnap.exists ? approverProofSnap.data() : null;\n                    const proofMatchesRoot = approvedByRoot && approverProof?.employeeId === ROOT_ADMIN_EMPLOYEE_ID && approverProof?.isAdmin === true;\n                    const proofRoleMatches = expectedApproverRole === 'admin' ? approverProof?.isAdmin === true : approverProof?.isAdmin !== true;\n                    const proofMatchesOwner = approvedByOwner && approverProof?.employeeId === account?.id && proofRoleMatches;\n                    if (!approverProof || (!proofMatchesRoot && !proofMatchesOwner)) {\n                        setError('رفض النظام هوية الجوال لأنها لا تملك تحققًا موثوقًا للحساب المخول.');\n                        return;\n                    }\n                } catch (err) {"""
          if old not in text:
              raise SystemExit('DESKTOP_APPROVER_GUARD_MARKER_MISSING')
          text = text.replace(old, new, 1)

          old = """                approverPhotoProofId: approverIdentity.photoId,\n                approverUserAgent: navigator.userAgent,"""
          new = """                approverPhotoProofId: approverIdentity.photoId,\n                approverIsRoot: isRootRemoteApprover(approverIdentity),\n                approverUserAgent: navigator.userAgent,"""
          if old not in text:
              raise SystemExit('APPROVAL_AUDIT_MARKER_MISSING')
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          boot = Path('index.html')
          boot_text = boot.read_text(encoding='utf-8')
          if "const CORE='./runtime/index-v37-source.txt?v=55.4';" not in boot_text:
              raise SystemExit('BOOT_CACHE_MARKER_MISSING')
          boot.write_text(boot_text.replace("const CORE='./runtime/index-v37-source.txt?v=55.4';", "const CORE='./runtime/index-v37-source.txt?v=55.6';", 1), encoding='utf-8')

          test = Path('tests/v55-4-identity-customers-control.mjs')
          t = test.read_text(encoding='utf-8')
          marker = """assert.equal(context.matchIdentity(\n  { employeeId:'admin_mohanad', canonicalName:'مهند', isAdmin:true },\n  { valid:true, employeeId:'admin_mohanad', name:'مهند', role:'admin' },\n), '', 'same admin identity should pass');"""
          addition = marker + """\nassert.equal(context.matchIdentity(\n  { employeeId:'employee_2', canonicalName:'خالد', isAdmin:false },\n  { valid:true, employeeId:'admin_mohanad', name:'مهند', role:'admin' },\n), '', 'trusted ROOT admin must be allowed to approve another employee');"""
          if marker not in t:
              raise SystemExit('ROOT_TEST_INSERT_MARKER_MISSING')
          t = t.replace(marker, addition, 1)
          test.write_text(t, encoding='utf-8')

          new_test = Path('tests/v55-6-root-admin-approval.mjs')
          new_test.write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nimport vm from 'node:vm';\n\nconst login=fs.readFileSync('runtime/index-v37-source.txt','utf8');\nassert(login.includes(\"const ROOT_ADMIN_EMPLOYEE_ID = 'admin_mohanad'\"));\nassert(login.includes(\"identity.role === 'admin' && identity.employeeId === 'admin_mohanad'\"));\nassert(login.includes('const approvedByRoot = row.approverEmployeeId === ROOT_ADMIN_EMPLOYEE_ID'));\nassert(login.includes('const proofMatchesRoot = approvedByRoot'));\nassert(login.includes('approverIsRoot: isRootRemoteApprover(approverIdentity)'));\n\nconst helperBody=login.match(/const isRootRemoteApprover = identity => ([^;]+);/)?.[1];\nassert(helperBody,'root helper must be extractable');\nconst context={ROOT_ADMIN_EMPLOYEE_ID:'admin_mohanad'};vm.createContext(context);vm.runInContext(`this.root = identity => ${helperBody};`,context);\nassert.equal(context.root({valid:true,role:'admin',employeeId:'admin_mohanad'}),true,'Mohanad trusted admin is ROOT');\nassert.equal(context.root({valid:true,role:'admin',employeeId:'admin_other'}),false,'another admin is not ROOT');\nassert.equal(context.root({valid:true,role:'employee',employeeId:'admin_mohanad'}),false,'employee role cannot become ROOT');\nassert.equal(context.root({valid:false,role:'admin',employeeId:'admin_mohanad'}),false,'untrusted local identity cannot become ROOT');\nconsole.log('V55_6_ROOT_ADMIN_APPROVAL_PASS');\n""",encoding='utf-8')

          wf = Path('.github/workflows/v55-6-root-admin-apply.yml')
          wf.unlink()
          PY

      - name: Verify V55.6
        run: |
          node tests/v55-4-identity-customers-control.mjs
          node tests/v55-5-customer-new-arrivals-override.mjs
          node tests/v55-6-root-admin-approval.mjs
          git diff --check
          grep -q "index-v37-source.txt?v=55.6" index.html

      - name: Commit V55.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V55.6 — ROOT admin can approve any QR login" -m "Allow only trusted admin_mohanad to approve another account while preserving same-identity enforcement for everyone else. Add desktop proof validation, audit marker, cache bust, and regression tests."
          git push origin HEAD:main
