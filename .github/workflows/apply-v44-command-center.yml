name: Apply V44 Command Center
on:
  push:
    branches: [feature/command-center-v44]
    paths:
      - tools/patch_v44_command_center.py
      - .github/workflows/apply-v44-command-center.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-center-v44
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V44 wrapper patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/patch_v44_command_center.py
          python tools/patch_v44_command_center.py
          grep -q 'V44_QA_BOOTSTRAP' index.html
          grep -q 'v44-observability.js?v=44.0' index.html
          grep -q 'v44-observability.js?v=44.0' customer.html
          grep -q 'v44-admin-bridge.js?v=44.0' admin-dashboard.html
          grep -q 'v44-admin-bridge.js?v=44.0' security-center.html
      - name: Commit generated wrappers
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html customer.html admin-dashboard.html security-center.html; then
            echo 'already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html admin-dashboard.html security-center.html
          git commit -m 'V44: inject observability, QA isolation, and command-center access'
          git push origin HEAD:feature/command-center-v44
