name: Apply V45 Admin UX
on:
  push:
    branches: [feature/v45-admin-ux]
    paths:
      - tools/patch_v45_admin_ux.py
      - v45-admin-ux.js
      - .github/workflows/apply-v45-admin-ux.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v45-admin-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V45 injection
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/patch_v45_admin_ux.py
          python tools/patch_v45_admin_ux.py
          for f in index.html customer.html admin-dashboard.html command-center.html; do grep -q 'v45-admin-ux.js?v=45.0' "$f"; done
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html customer.html admin-dashboard.html command-center.html; then
            echo 'already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html admin-dashboard.html command-center.html
          git commit -m 'V45: inject admin UX and desktop compatibility layer'
          git push origin HEAD:feature/v45-admin-ux
