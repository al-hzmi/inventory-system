name: Fix movement quantity precision once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-movement-quantity-precision-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve fractional carton precision
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html=Path('inventory-analytics.html')
          s=html.read_text(encoding='utf-8')
          old="const num=(n,d=0)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(n)||0);"
          new="const num=(n,d=5)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Math.abs(Number(n)||0)<1e-9?0:Number(n)||0);"
          if old not in s:
              raise SystemExit('Number formatter anchor not found')
          html.write_text(s.replace(old,new,1),encoding='utf-8')

          gen=Path('tools/generate-inventory-analytics.py')
          s=gen.read_text(encoding='utf-8')
          old='''        b = float(old.get("qty", 0) or 0)\n        a = float(new.get("qty", 0) or 0)\n        delta = a - b\n        if abs(delta) < 1e-9:\n'''
          new='''        b = round(float(old.get("qty", 0) or 0), 5)\n        a = round(float(new.get("qty", 0) or 0), 5)\n        delta = round(a - b, 5)\n        if abs(delta) < 1e-9:\n'''
          if old not in s:
              raise SystemExit('Generator precision anchor not found')
          gen.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/fix-movement-quantity-precision-once.yml
          git diff --check

      - name: Commit precision fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve fractional inventory movement quantities'
          git pull --rebase origin main
          git push origin HEAD:main
