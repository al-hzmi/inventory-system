name: Apply V56.33 New Arrivals Admin Controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v56-33-new-arrivals-admin-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V56.33
        run: python3 .github/scripts/v56-33-new-arrivals-admin-fixed.py
      - name: Verify
        run: |
          node --check api/new-arrivals-admin.js
          node tests/v56-33-new-arrivals-admin.mjs
          git diff --check
      - name: Commit verified feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/new-arrivals-admin.js runtime/index-v37-source.txt runtime/customer-v37-source.txt index.html customer.html tests/v56-33-new-arrivals-admin.mjs
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: admin controls for new arrivals section'
          git push origin HEAD:main
