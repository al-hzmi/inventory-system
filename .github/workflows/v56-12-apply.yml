name: V56.12 Apply Stocktake Accounting Package
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-12-stocktake-accounting.py'
      - '.github/workflows/v56-12-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V56.12
        run: python .github/scripts/v56-12-stocktake-accounting.py
      - name: Verify generated regression
        run: python tests/v56-12-stocktake-accounting.py
      - name: Commit V56.12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-stocktake.html stocktake-accountant.html index.html tests/v56-12-stocktake-accounting.py .github/workflows/v56-12-stocktake-accounting-regression.yml
          git diff --cached --quiet && exit 0
          git commit -m "V56.12 — full test inventory and read-only accountant view"
          git push
