name: V56.12 Stocktake Accountant Apply
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-12-stocktake-accountant.py'
      - '.github/workflows/v56-12-stocktake-accountant-apply.yml'
      - 'tests/v56-3-stocktake-test-mode.mjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V56.12
        run: python3 .github/scripts/v56-12-stocktake-accountant.py
      - name: Verify accountant page syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('stocktake-accountant.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',p)
          pathlib.Path('/tmp/accountant.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/accountant.js
      - name: Verify stocktake/admin syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          for src,out in [('stocktake.html','/tmp/stocktake.js'),('admin-stocktake.html','/tmp/admin-stocktake.js')]:
            p=pathlib.Path(src).read_text(encoding='utf-8')
            scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',p)
            pathlib.Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/stocktake.js
          node --check /tmp/admin-stocktake.js
      - name: Verify V56.12 contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('admin-stocktake.html').read_text(encoding='utf-8')
          r=Path('runtime/index-v37-source.txt').read_text(encoding='utf-8')
          p=Path('stocktake-accountant.html').read_text(encoding='utf-8')
          assert 'stocktake_accountant_access' in a and 'معاينة منظور المحاسب' in a
          assert 'current_inventory_full' in a and 'إنشاء تجربة كاملة' in a
          assert 'cleanupLegacyTestsOnce' in a and 'stocktake_test_cleanup_v5612' in a
          assert 'stocktake-accountant.html?v=56.12' in r
          assert 'useStocktakeAccountantControl' in r
          assert 'قراءة فقط' in p and 'stocktake_items' in p
          assert 'data-save' not in p and 'actualQty:' not in p
          print('V56.12 contracts OK')
          PY
      - name: Existing stocktake regressions
        run: |
          for f in tests/v56-3-stocktake-test-mode.mjs tests/v56-5-stocktake-direct-mobile.mjs tests/v56-7-readable-audit.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - name: Diff check
        run: git diff --check
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-stocktake.html admin-dashboard.html runtime/index-v37-source.txt index.html stocktake-accountant.html
          if git diff --cached --quiet; then echo "No feature changes"; exit 0; fi
          git commit -m "V56.12 — full test stocktake and accountant view"
          git pull --rebase origin main
          git push origin HEAD:main
# trigger 3