name: V56.6 Admin Responsive Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-6-admin-responsive.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply responsive admin fix
        run: python3 .github/scripts/v56-6-admin-responsive.py
      - name: Verify stocktake regressions and syntax
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-6-admin-responsive.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          s=Path('admin-stocktake.html').read_text()
          fails=[]
          for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              code=m.group(2)
              if not code.strip(): continue
              f=Path('/tmp')/f'admin-stocktake-{i}.js'; f.write_text(code)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: fails.append(r.stderr)
          if fails:
              print('\n'.join(fails)); sys.exit(1)
          print('V56_6_ADMIN_SYNTAX_OK')
          PY
          git diff --check
      - name: Mobile browser layout smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/v566-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true; rm -f .v566-smoke.mjs' EXIT
          cat > .v566-smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await c.addInitScript(()=>{localStorage.setItem('inventory_user_name_v2','مهند');localStorage.setItem('inventory_admin_token_v2','1jh297-spgf2z')});
          const p=await c.newPage(); const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
          const r=await p.goto('http://127.0.0.1:4173/admin-stocktake.html',{waitUntil:'domcontentloaded',timeout:30000});
          await p.waitForTimeout(2500);
          const m=await p.evaluate(()=>{
            const sels=['.wrap','.top','#root','.panel','.card','.stats','.stat','.summaryActions','.moreActions','.mobileItem','.reviewHead','#employeeView'];
            const overflow=[];
            for(const sel of sels) for(const el of document.querySelectorAll(sel)){
              const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
              const r=el.getBoundingClientRect(); if(r.width>0&&(r.left<-1||r.right>innerWidth+1)) overflow.push({sel,left:r.left,right:r.right,width:r.width});
            }
            const head=document.querySelector('.head')?.getBoundingClientRect();
            const employee=document.querySelector('#employeeView')?.getBoundingClientRect();
            return {innerWidth,scrollWidth:document.documentElement.scrollWidth,overflow,headWidth:head?.width||0,employeeWidth:employee?.width||0,textAdjust:getComputedStyle(document.documentElement).webkitTextSizeAdjust||''};
          });
          console.log('v56.6 mobile',m,errors);
          if(!r||r.status()>=400||m.scrollWidth>m.innerWidth+2||m.overflow.length||m.employeeWidth>m.innerWidth+1||errors.some(x=>/SyntaxError|ReferenceError/.test(x))) process.exitCode=1;
          await b.close();
          JS
          node ./.v566-smoke.mjs
      - name: Commit responsive fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-stocktake.html tests/v56-6-admin-responsive.mjs
          git commit -m 'V56.6 — fix stocktake admin responsive layout'
          git pull --rebase origin main
          node tests/v56-6-admin-responsive.mjs
          git push origin HEAD:main
