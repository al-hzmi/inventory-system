name: V56.9 Stocktake Operator Apply

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/v56-9-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V56.9 operator UX
        run: python3 tools/apply_v56_9_stocktake_operator.py
      - name: Verify stocktake contracts
        run: |
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-8-stocktake-field-ux.mjs
          git diff --check
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('stocktake.html','utf8');
          const m=html.match(/<script>([\s\S]*)<\/script>/);
          if(!m) throw new Error('stocktake script missing');
          fs.writeFileSync('/tmp/stocktake-v56-9.js',m[1]);
          NODE
          node --check /tmp/stocktake-v56-9.js
      - name: Commit feature
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stocktake.html admin-stocktake-shell.html tests/v56-5-stocktake-direct-mobile.mjs tests/v56-8-stocktake-field-ux.mjs
          git commit -m 'V56.9 — streamline stocktake operator workflow'
          git pull --rebase origin main
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-8-stocktake-field-ux.mjs
          git push origin HEAD:main
