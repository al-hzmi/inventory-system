name: Apply V56.32 Server Image Bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-32-image-binding-backend.py'
      - '.github/workflows/apply-v56-32-image-binding-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v56-32-image-binding-backend-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply server-backed image binding patch
        run: python3 .github/scripts/v56-32-image-binding-backend.py

      - name: Verify image binding contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check api/image-admin.js
          node tests/v56-32-image-binding-backend.mjs
          node tests/v56-27-image-binding-wiring.mjs
          python3 - <<'PY'
          from pathlib import Path
          for f in ['image-distribution.html','runtime/index-v37-source.txt','runtime/customer-v37-source.txt']:
              s=Path(f).read_text(errors='replace')
              assert '<<<<<<<' not in s and '>>>>>>>' not in s and '... (truncated)' not in s, f
          print('V56.32 structural verification: PASS')
          PY
          git diff --check

      - name: Commit verified functional patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'V56.32 already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-distribution.html runtime/index-v37-source.txt runtime/customer-v37-source.txt tests/v56-32-image-binding-backend.mjs
          git commit -m 'V56.32 — persist image bindings through configured server backend'
          git push origin HEAD:main
