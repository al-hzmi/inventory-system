name: V96 employee attendance and live visibility
on:
  push:
    branches: [main, 'hotfix/v96-employee-live-login-correlation-*']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@24.1.3
      - run: node tests/v90-data-reliability.cjs
      - run: node tests/v91-incident-audit.cjs
      - run: node tests/v92-verified-attendance-feedback.cjs
      - run: node tests/v93-invoice-rating.mjs
      - run: node tests/v94-stocktake-safe-reset.cjs
      - run: node tests/v95-login-stocktake-integrity.cjs
      - run: node tests/v96-live-employee-visibility.cjs
      - run: npm run build
