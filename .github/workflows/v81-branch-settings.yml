name: V81 isolated branch inventory settings
on:
  push:
    branches: [feature/v81-clean-branch-stocktake-admin, main]
    paths: ['admin-branch-presence.html', 'branch-presence-page.css', 'branch-presence-admin.js', 'admin-stocktake.html', 'admin-stocktake-shell.html', 'branch-presence-admin.css', 'sw.js', 'batco-fast-nav.js', 'tests/v81-*', 'tests/v80-branch-*', '.github/workflows/v81-branch-settings.yml']
  pull_request:
    paths: ['admin-branch-presence.html', 'branch-presence-page.css', 'branch-presence-admin.js', 'admin-stocktake.html', 'admin-stocktake-shell.html', 'branch-presence-admin.css', 'sw.js', 'batco-fast-nav.js', 'tests/v81-*', 'tests/v80-branch-*', '.github/workflows/v81-branch-settings.yml']
permissions:
  contents: read
jobs:
  branch-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: node tests/v80-branch-presence.cjs
      - run: node tests/v78-boot-service-worker.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/v81-branch-standalone-browser.cjs
      - run: BROWSER=webkit node tests/v81-branch-standalone-browser.cjs
      - run: node tests/v80-branch-admin-browser.cjs
      - run: BROWSER=webkit node tests/v80-branch-admin-browser.cjs
      - run: npm run build
