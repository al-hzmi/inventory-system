name: Apply V56.53 admin interaction performance
# V56.53 rerun trigger: 2026-09-13-c

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v56-53-admin-interaction-performance.py'
      - '.github/workflows/apply-v56-53-admin-interaction-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize V56.53 patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/v56-53-admin-interaction-performance.py')
          s=p.read_text(encoding='utf-8')
          needle="s=replace_once(s,old_fn,new_fn,'v54 active module stability')"
          fixed="old_fn=old_fn.replace('\\\\\"','\"');new_fn=new_fn.replace('\\\\\"','\"')\n"+needle
          if fixed not in s:
              if needle not in s: raise SystemExit('V56.53 v54 anchor call missing')
              s=s.replace(needle,fixed,1)
              p.write_text(s,encoding='utf-8')
          for name in ['v46-admin-nav.js','v54-admin-enhancements.js','admin-dashboard.html','inventory-analytics.html','control-center.html','admin-home.html']:
              f=Path(name)
              txt=f.read_text(encoding='utf-8')
              if not txt.endswith('\n'):
                  f.write_text(txt+'\n',encoding='utf-8')
          # V56.18 historically pinned an exact customer core cache version (56.19).
          # The production shell is now newer, so preserve the real invariant: never regress below 56.19.
          test=Path('tests/v56-18-scroll-haroun.mjs')
          t=test.read_text(encoding='utf-8')
          old='assert.ok(customer.includes("customer-v37-source.txt?v=56.19"),\'customer cache bust must advance\');'
          new='const customerCoreVersion=customer.match(/customer-v37-source\\.txt\\?v=(\\d+(?:\\.\\d+)?)/);\nassert.ok(customerCoreVersion&&Number(customerCoreVersion[1])>=56.19,\'customer cache bust must remain at or above V56.19\');'
          if old in t:
              t=t.replace(old,new,1)
              test.write_text(t,encoding='utf-8')
          elif new not in t:
              raise SystemExit('V56.18 cache-bust regression anchor missing')
          # V56.20 asserted the old unconditional hook spelling. V56.53 keeps the
          # same drawer isolation while making activation explicit from the row state.
          test20=Path('tests/v56-20-admin-body-scroll-lock.mjs')
          t20=test20.read_text(encoding='utf-8')
          old20="assert.ok(admin.includes('function DetailDrawer({row,onClose,onCustomerMessage}){\\n  useBodyScrollLock();'),'the drawer must still isolate body scroll while actually open');"
          new20="assert.ok(admin.includes('function DetailDrawer({row,onClose,onCustomerMessage}){\\n  useBodyScrollLock(Boolean(row));'),'the drawer must still isolate body scroll while actually open');"
          if old20 in t20:
              t20=t20.replace(old20,new20,1)
              test20.write_text(t20,encoding='utf-8')
          elif new20 not in t20:
              raise SystemExit('V56.20 body-lock regression anchor missing')
          PY
      - name: Apply V56.53 patch
        run: python3 .github/scripts/v56-53-admin-interaction-performance.py
      - name: Run focused admin regressions
        run: |
          node tests/v56-18-scroll-haroun.mjs
          node tests/v56-20-admin-body-scroll-lock.mjs
          node tests/v56-34-executive-integration.mjs
          node tests/v56-35-navigation-new-arrivals.mjs
          node tests/v56-38-admin-ia.mjs
          node tests/v56-53-admin-interaction-performance.mjs
      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/scripts/v56-53-admin-interaction-performance.py
          rm -f .github/workflows/apply-v56-53-admin-interaction-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stabilize admin scrolling and interaction performance'
          git push
