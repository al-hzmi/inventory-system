name: V56.2 Stocktake Nomenclature

on:
  push:
    branches: [v56-stocktake-nomenclature]
    paths:
      - '.github/workflows/v56-2-nomenclature.yml'

permissions:
  contents: write

concurrency:
  group: v56-2-stocktake-nomenclature
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nomenclature branch
        uses: actions/checkout@v4
        with:
          ref: v56-stocktake-nomenclature
          fetch-depth: 0

      - name: Align terminology with historical stocktake form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          admin_path = Path('admin-stocktake.html')
          admin = admin_path.read_text(encoding='utf-8')

          replacements = [
            ('أعضاء لجنة الجرد أصحاب الحسابات', 'عضو / أعضاء اللجنة (أصحاب الحسابات)'),
            ('أسماء إضافية ضمن اللجنة (اختياري، اسم في كل سطر)', 'المساعد / المساعدون (اختياري، اسم في كل سطر)'),
            ('يمكن إضافة أي عضو لا يملك حسابًا في النظام', 'اكتب أسماء المساعدين من المستودع، اسم في كل سطر'),
            ('لا نفرض مسميات «عداد/مسجل». المجموعة يمكن أن تضم أي عدد من الأشخاص، وأي عضو صاحب حساب مضاف للمجموعة يستطيع فتح قائمتها أثناء الجرد.', 'اعتمادًا على ملف الجرد الورقي: «عضو اللجنة» هو صاحب الحساب الذي يسجل، و«المساعد» اسم إضافي عند الحاجة. يمكن أن تضم المجموعة أكثر من عضو أو مساعد.'),
            ("function teamRoster(t){return [...teamNames(t),...(Array.isArray(t.extraMemberNames)?t.extraMemberNames:[])].filter(Boolean)}", "function teamAssistants(t){return Array.isArray(t.extraMemberNames)?t.extraMemberNames:[]}function teamRoster(t){return [...teamNames(t),...teamAssistants(t)].filter(Boolean)}"),
            ('أعضاء اللجنة: ${teamRoster(t).length?esc(teamRoster(t).join(\'، \')):\'لم يحدد أعضاء بعد\'}', 'عضو اللجنة / المساعد: ${teamRoster(t).length?esc(teamRoster(t).join(\'، \')):\'لم يحدد أعضاء بعد\'}'),
            ('<th>أعضاء اللجنة</th><th>الإنجاز</th>', '<th>عضو اللجنة</th><th>المساعد</th><th>الإنجاز</th>'),
            ("<td>${esc(teamRoster(t).join('، '))}</td><td>${d}/${its.length}</td>", "<td>${esc(teamNames(t).join('، '))}</td><td>${esc(teamAssistants(t).join('، '))}</td><td>${d}/${its.length}</td>"),
          ]
          for old, new in replacements:
              if old not in admin:
                  raise SystemExit(f'ADMIN MARKER MISSING: {old[:90]}')
              admin = admin.replace(old, new, 1)
          admin_path.write_text(admin, encoding='utf-8')

          employee_path = Path('stocktake.html')
          employee = employee_path.read_text(encoding='utf-8')
          old = ' · أعضاء اللجنة: ${esc(roster.join(\'، \'))}'
          new = ' · عضو اللجنة / المساعد: ${esc(roster.join(\'، \'))}'
          if old not in employee:
              raise SystemExit('EMPLOYEE ROSTER MARKER MISSING')
          employee = employee.replace(old, new, 1)
          employee_path.write_text(employee, encoding='utf-8')

          test_path = Path('tests/v56-stocktake-workflow.mjs')
          test = test_path.read_text(encoding='utf-8')
          old = "has(admin,'أعضاء لجنة الجرد أصحاب الحسابات','teams must support flexible committee membership');"
          new = "has(admin,'عضو / أعضاء اللجنة (أصحاب الحسابات)','committee member terminology must match the stocktake form');\nhas(admin,'المساعد / المساعدون','assistant terminology must match the stocktake form');\nhas(admin,'<th>عضو اللجنة</th><th>المساعد</th>','printable report must preserve committee/assistant columns');"
          if old not in test:
              raise SystemExit('V56 TEST NOMENCLATURE MARKER MISSING')
          test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify V56.2
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          python - <<'PY'
          import re, pathlib, subprocess
          for name in ['stocktake.html','admin-stocktake.html']:
              html=pathlib.Path(name).read_text(encoding='utf-8')
              blocks=[]
              for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S|re.I):
                  if 'src=' not in attrs.lower(): blocks.append(body)
              p=pathlib.Path('/tmp')/(name+'.js')
              p.write_text('\n'.join(blocks),encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          grep -q 'عضو / أعضاء اللجنة (أصحاب الحسابات)' admin-stocktake.html
          grep -q 'المساعد / المساعدون' admin-stocktake.html
          grep -q '<th>عضو اللجنة</th><th>المساعد</th>' admin-stocktake.html
          grep -q 'عضو اللجنة / المساعد:' stocktake.html
          git diff --check

      - name: Commit V56.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-stocktake.html stocktake.html tests/v56-stocktake-workflow.mjs
          git commit -m 'V56.2 — align stocktake committee terminology'
          git push origin HEAD:v56-stocktake-nomenclature
