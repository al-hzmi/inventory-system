name: V56.5 Stocktake Direct Mobile Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify stocktake invariants and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node tests/v56-stocktake-workflow.mjs
          node tests/v56-3-stocktake-test-mode.mjs
          node tests/v56-5-stocktake-direct-mobile.mjs
          node tests/v56-6-admin-responsive.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          failures=[]
          for path in ['admin-stocktake.html','stocktake.html','admin-stocktake-shell.html']:
              s=Path(path).read_text()
              for i,m in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
                  code=m.group(2)
                  if not code.strip(): continue
                  f=Path('/tmp')/f'{Path(path).stem}-{i}.js';f.write_text(code)
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: failures.append(f'{path} script#{i}: {r.stderr}')
          if failures:
              print('\n'.join(failures));sys.exit(1)
          print('V56_6_STOCKTAKE_SYNTAX_OK')
          PY
          git diff --check
      - name: Responsive browser smoke - mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/v566-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true; rm -f .v566-responsive-smoke.mjs' EXIT
          cat > .v566-responsive-smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});
          const cases=[
            {name:'mobile-direct',path:'/admin-stocktake.html',viewport:{width:390,height:844},mobile:true},
            {name:'mobile-embedded',path:'/admin-stocktake.html?embedded=1',viewport:{width:390,height:844},mobile:true},
            {name:'desktop-direct',path:'/admin-stocktake.html',viewport:{width:1440,height:900},mobile:false}
          ];
          let fail=false;
          for(const tc of cases){
            const c=await b.newContext({viewport:tc.viewport,deviceScaleFactor:1,isMobile:tc.mobile,hasTouch:tc.mobile});
            await c.addInitScript(()=>{localStorage.setItem('inventory_user_name_v2','مهند');localStorage.setItem('inventory_admin_token_v2','1jh297-spgf2z')});
            const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            const r=await p.goto('http://127.0.0.1:4173'+tc.path,{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(2500);
            const m=await p.evaluate(()=>{
              const sels=['.wrap','.top','#root','.panel','.card','.stats','.stat','.summaryActions','.moreActions','.mobileItem','.reviewHead','#employeeView'];
              const overflow=[];
              for(const sel of sels) for(const el of document.querySelectorAll(sel)){
                const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')continue;
                const r=el.getBoundingClientRect();if(r.width>0&&(r.left<-1||r.right>innerWidth+1))overflow.push({sel,left:r.left,right:r.right,width:r.width});
              }
              const employee=document.querySelector('#employeeView')?.getBoundingClientRect();
              const title=document.querySelector('.title');
              return {
                innerWidth,scrollWidth:document.documentElement.scrollWidth,overflow,
                employeeWidth:employee?.width||0,
                titleSize:title?parseFloat(getComputedStyle(title).fontSize):0,
                textAdjust:getComputedStyle(document.documentElement).webkitTextSizeAdjust||''
              };
            });
            console.log(tc.name,r?.status(),m,errors);
            if(!r||r.status()>=400||m.scrollWidth>m.innerWidth+2||m.overflow.length||errors.some(x=>/SyntaxError|ReferenceError/.test(x)))fail=true;
            if(tc.mobile&&(m.employeeWidth<m.innerWidth-30||m.titleSize>24||m.textAdjust!=='100%'))fail=true;
            if(!tc.mobile&&m.employeeWidth>360)fail=true;
            await c.close();
          }
          await b.close();if(fail)process.exit(1);
          JS
          node ./.v566-responsive-smoke.mjs
