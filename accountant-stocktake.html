function tableRows(rows){return `<div class="desktopTable"><table class="table"><thead><tr><th>المجموعة</th><th>النطاق</th><th>رقم الصنف</th><th>اسم الصنف</th><th>الشد</th><th>كمية النظام</th><th>الفعلي</th><th>الفرق</th><th>الحالة</th><th>الملاحظة</th><th>آخر تسجيل</th><th>التعديلات</th></tr></thead><tbody>${rows.length?rows.map(i=>{const counted=(i.countStatus||'pending')!=='pending',diff=counted?Number(i.difference??(Number(i.actualQty)-Number(i.expectedQty))):null;return `<tr><td>${esc(teamName(i.teamId))}</td><td>${esc(teamScope(i.teamId))}</td><td class="ltr"><b>${esc(i.sku)}</b></td><td class="wrapText">${esc(i.name||'')}</td><td>${esc(i.pack??'—')}</td><td class="ltr">${fmt(i.expectedQty)}</td><td class="ltr">${counted?fmt(i.actualQty):'—'}</td><td class="ltr">${counted?`${diff>0?'+':''}${fmt(diff)}`:'—'}</td><td>${itemStatus(i.countStatus)}</td><td class="wrapText">${esc(i.note||'')}</td><td>${esc(i.updatedByName||'—')} · ${dt(i.lastCountAt||i.updatedAt)}</td><td class="ltr">${fmt(i.revision||0)}</td></tr>`}).join(''):'<tr><td colspan="12" class="empty">لا توجد نتائج.</td></tr>'}</tbody></table></div>`}
function render(){if(!state.control||(!adminPreview&&!canAccess(state.control)))return;if(!state.campaign){lock('جاري تحميل حملة الجرد','انتظر لحظات...');return}const total=state.items.length,counted=state.items.filter(i=>(i.countStatus||'pending')!=='pending').length,pending=total-counted,matched=state.items.filter(i=>i.countStatus==='matched').length,shortage=state.items.filter(i=>i.countStatus==='shortage').length,surplus=state.items.filter(i=>i.countStatus==='surplus').length,notes=state.items.filter(i=>String(i.note||'').trim()).length,progress=total?Math.round(counted/total*100):0,rows=filteredItems(),shown=rows.slice(0,state.visible);app.innerHTML=`<div class="top"><div class="head"><button id="back" class="back">‹</button><div class="grow"><div class="title">متابعة الجرد</div><div class="subtitle">${esc(state.campaign.name||`جرد ${state.campaign.warehouse||''}`)}</div></div><span class="badge ${adminPreview?'preview':''}">${adminPreview?'معاينة الإدارة':'قراءة فقط'}</span></div></div><section class="panel campaign"><div class="campaignHead"><div class="grow"><div class="campaignName">${esc(state.campaign.name||`جرد ${state.campaign.warehouse||''}`)}</div><div class="campaignMeta">${esc(state.campaign.warehouse||'—')} · ${esc(state.campaign.stocktakeDate||'—')}</div></div><span class="status">${statusLabel(state.campaign.status)}</span></div><div class="progressRow"><div><div class="progressBig">${progress}%</div></div><div class="progressCopy">تم ${counted} من ${total} صنف</div></div><div class="bar"><i style="width:${progress}%"></i></div></section><section class="stats">${[['الأصناف',total],['تم الجرد',counted],['متبقي',pending],['مطابق',matched],['نواقص',shortage],['زيادات',surplus],['ملاحظات',notes]].map(([l,v])=>`<div class="stat"><b>${fmt(v)}</b><span>${l}</span></div>`).join('')}</section>${state.teams.length?`<section class="panel"><div class="sectionHead"><h2>تقدم المجموعات</h2><span class="small">تحديث مباشر</span></div><div class="teams">${state.teams.map(teamHtml).join('')}</div></section>`:''}<section class="panel filtersPanel"><div class="tabs">${tab('all','الكل',total)}${tab('pending','المتبقي',pending)}${tab('matched','المطابق',matched)}${tab('variance','الفروقات',shortage+surplus)}${tab('shortage','النواقص',shortage)}${tab('surplus','الزيادات',surplus)}${tab('notes','الملاحظات',notes)}</div><input id="search" class="search" value="${esc(state.search)}" inputmode="search" autocomplete="off" placeholder="رقم الصنف / الاسم / المجموعة / الملاحظة"></section><div class="mobileList list">${shown.length?shown.map(itemCard).join(''):'<div class="panel empty">لا توجد نتائج.</div>'}</div>${tableRows(shown)}${shown.length<rows.length?`<button id="more" class="more">إظهار المزيد · ${rows.length-shown.length} متبقي</button>`:''}`;bindUi()}
function bindUi(){$('#back')?.addEventListener('click',()=>location.href=adminPreview?'./admin-stocktake.html?v=56.16':'./index.html?employee=1');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;state.visible=120;render()});const s=$('#search');if(s)s.oninput=e=>{state.search=e.target.value;state.visible=120;render();const n=$('#search');if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch{}}};$('#more')?.addEventListener('click',()=>{state.visible+=120;render()})}
function updateNet(){net.textContent=navigator.onLine?'متصل':'بدون اتصال';net.classList.toggle('off',!navigator.onLine)}window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);updateNet();
window.addEventListener('beforeunload',()=>state.unsubs.splice(0).forEach(fn=>{try{fn()}catch{}}));start();
</script>
</body></html>
