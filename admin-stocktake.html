*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--sf);color:var(--p)}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{font-size:16px}.wrap{max-width:1180px;margin:auto;padding:14px 14px 40px}.top{position:sticky;top:0;z-index:30;background:rgba(250,250,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--b);margin:0 -14px;padding:12px 14px}.head{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:1px solid var(--b);border-radius:12px;background:#fff}.grow{flex:1}.title{font-size:20px;font-weight:700}.sub{font-size:10px;color:var(--s);margin-top:2px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.panel{background:#fff;border:1px solid var(--b);border-radius:16px;padding:15px;box-shadow:0 1px 3px rgba(28,25,23,.05)}.panel h2{font-size:15px;margin:0}.panel h3{font-size:13px;margin:0}.muted{font-size:10px;color:var(--s);line-height:1.7}.section{margin-top:14px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--b);background:#fff;font-size:11px;font-weight:700}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad{background:var(--bads);color:var(--bad);border-color:rgba(185,28,28,.15)}.btn.info{background:var(--infos);color:var(--info);border-color:rgba(3,105,161,.15)}.btn:disabled{opacity:.45;cursor:not-allowed}.input,.select,.textarea{width:100%;border:1px solid var(--b);border-radius:11px;background:#fff;padding:0 11px;outline:none}.input,.select{height:42px}.textarea{min-height:88px;padding:10px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(180,83,9,.08)}.field label{font-size:10px;font-weight:700;display:block;margin-bottom:5px}.fields{display:grid;grid-template-columns:1fr;gap:8px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.mode{min-height:56px;border:1px solid var(--b);border-radius:12px;background:#fff;text-align:right;padding:9px}.mode b{display:block;font-size:11px}.mode span{font-size:9px;color:var(--s)}.mode.active{border-color:var(--p);background:var(--p);color:#fff}.mode.active span{color:#d6d3d1}.staff{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;max-height:260px;overflow:auto}.staff label{display:flex;gap:7px;align-items:center;background:var(--sf);border:1px solid var(--b);border-radius:10px;padding:8px;font-size:10px}.campaigns,.teams{display:grid;gap:8px}.card{border:1px solid var(--b);border-radius:13px;padding:11px;background:#fff}.card.active{border-color:var(--a);box-shadow:0 0 0 2px rgba(180,83,9,.06)}.cardtop{display:flex;gap:8px;align-items:flex-start}.pill{font-size:9px;font-weight:700;border:1px solid var(--b);border-radius:999px;padding:5px 8px;background:var(--sf);color:var(--s)}.pill.ok{background:var(--oks);color:var(--ok);border-color:rgba(21,128,61,.12)}.pill.bad{background:var(--bads);color:var(--bad);border-color:rgba(185,28,28,.12)}.pill.info{background:var(--infos);color:var(--info);border-color:rgba(3,105,161,.12)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid var(--b);background:var(--sf);border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--s)}.progress{height:6px;background:#eeeae7;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--ok)}.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px 0}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;height:36px;border:1px solid var(--b);background:#fff;border-radius:999px;padding:0 12px;font-size:10px;font-weight:700}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.tablewrap{overflow:auto;border:1px solid var(--b);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;font-size:10px;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}.table th{background:var(--sf);color:var(--s);font-size:9px}.note{max-width:220px;white-space:normal!important}.importbox{border:1px dashed #d6d3d1;border-radius:13px;padding:12px;background:var(--sf)}.mapgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.preview{max-height:210px;overflow:auto;margin-top:10px}.warning{background:var(--bads);color:var(--bad);border:1px solid rgba(185,28,28,.12);border-radius:11px;padding:9px;font-size:10px;margin-top:8px}.success{background:var(--oks);color:var(--ok);border:1px solid rgba(21,128,61,.12);border-radius:11px;padding:9px;font-size:10px;margin-top:8px}.empty{text-align:center;padding:34px 14px;color:var(--m);font-size:11px}.toast{position:fixed;z-index:100;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--p);color:#fff;border-radius:12px;padding:10px 14px;font-size:11px;font-weight:700;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modalbg{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}.modalbg.open{display:flex}.modal{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:15px 15px max(18px,env(safe-area-inset-bottom))}.modal h3{margin:0 0 10px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

<div id="teamModal" class="modalbg"><div class="modal"><h3>إنشاء فريق</h3><div class="fields"><div class="field"><label>اسم الفريق</label><input id="teamName" class="input" placeholder="فريق 1"></div><div class="field"><label>الجهة / المنطقة</label><input id="teamZone" class="input" placeholder="الجهة A"></div><div class="field"><label>الموظف الذي يسجل بالحساب</label><select id="teamEmployee" class="select"></select></div><div class="field"><label>اسم موظف المستودع الذي يعدّ (لا يحتاج حساب)</label><input id="teamCounter" class="input" placeholder="الاسم اختياري"></div></div><div class="modalactions"><button id="teamCancel" class="btn">إلغاء</button><button id="teamCreate" class="btn primary">حفظ الفريق</button></div></div></div>

const firebaseConfig={apiKey:'AIzaSyCCvNlnZDxL5P4cPQrHYkOh3C8wJ6yl4Bw',authDomain:'inventory-system-ca3dc.firebaseapp.com',projectId:'inventory-system-ca3dc',storageBucket:'inventory-system-ca3dc.firebasestorage.app',messagingSenderId:'139575913885',appId:'1:139575913885:web:110648e07345b36da15374',measurementId:'G-ZGF5DT9D0K'};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const STORAGE={NAME:'inventory_user_name_v2',TOKEN:'inventory_admin_token_v2',PHOTO:'inventory_login_photo_proof_v2'};const ADMIN_HASH='1jh297-spgf2z';const adminName=(localStorage.getItem(STORAGE.NAME)||'').trim(),adminToken=localStorage.getItem(STORAGE.TOKEN)||'',adminLocalQa=['localhost','127.0.0.1'].includes(location.hostname);let adminPhoto=null;try{adminPhoto=JSON.parse(localStorage.getItem(STORAGE.PHOTO)||'null')}catch{}if(adminName!=='مهند'||adminToken!==ADMIN_HASH||(!adminLocalQa&&(adminPhoto?.role!=='admin'||!adminPhoto?.photoId)))location.href='./index.html?employee=1';
const $=s=>document.querySelector(s),root=$('#root');const state={control:{enabled:false,accessMode:'none',allowedEmployeeIds:[],allowedEmployeeNames:[],activeCampaignId:''},employees:[],campaigns:[],campaign:null,teams:[],items:[],audit:[],tab:'all',search:'',import:{file:null,rows:[],headers:[],map:{sku:'',qty:'',pack:'',name:''},teamId:'',errors:[]},unsubs:[]};
const ar='٠١٢٣٤٥٦٧٨٩',fa='۰۱۲۳۴۵۶۷۸۹';const eng=s=>String(s??'').replace(/[٠-٩۰-۹]/g,d=>{let i=ar.indexOf(d);return i>=0?String(i):String(fa.indexOf(d))});const norm=s=>eng(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06ffa-z0-9\s._-]/g,' ').replace(/\s+/g,' ').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(eng(v).replace(/[٬,]/g,'').replace(/٫/g,'.'));const fmt=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(v)||0);const ms=v=>{try{return v?.toMillis?v.toMillis():v?.seconds?v.seconds*1000:new Date(v).getTime()||0}catch{return 0}};const dt=v=>ms(v)?new Date(ms(v)).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—';const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1900)};const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};const itemId=(campaignId,sku)=>`st_${hash(campaignId+'|'+norm(sku))}_${hash(norm(sku))}`;
$('#back').onclick=()=>location.href='./admin-dashboard.html';$('#employeeView').onclick=()=>location.href='./stocktake.html';
function start(){state.unsubs.push(db.collection('system_controls').doc('stocktake_feature').onSnapshot(d=>{state.control={...state.control,...(d.exists?d.data():{})};render()},e=>console.error(e)));state.unsubs.push(db.collection('employee_accounts').onSnapshot(s=>{state.employees=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status!=='suspended').sort((a,b)=>String(a.canonicalName||'').localeCompare(String(b.canonicalName||''),'ar'));render()},()=>{}));state.unsubs.push(db.collection('stocktake_campaigns').onSnapshot(s=>{state.campaigns=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));if(state.campaign){state.campaign=state.campaigns.find(x=>x.id===state.campaign.id)||null}else if(state.control.activeCampaignId)state.campaign=state.campaigns.find(x=>x.id===state.control.activeCampaignId)||null;render();bindSelected()},()=>{}))}start();
let selectedId='';function bindSelected(){const id=state.campaign?.id||'';if(id===selectedId)return;selectedId=id;while(state.unsubs.length>3){try{state.unsubs.pop()()}catch{}}state.teams=[];state.items=[];state.audit=[];if(!id){render();return}state.unsubs.push(db.collection('stocktake_teams').where('campaignId','==',id).onSnapshot(s=>{state.teams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orderIndex??999)-(b.orderIndex??999));render()},()=>{}));state.unsubs.push(db.collection('stocktake_items').where('campaignId','==',id).onSnapshot(s=>{state.items=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));state.unsubs.push(db.collection('stocktake_audit').where('campaignId','==',id).limit(200).onSnapshot(s=>{state.audit=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));render()},()=>{}))}
function render(){const c=state.control,cp=state.campaign,items=state.items,total=items.length,counted=items.filter(i=>i.countStatus&&i.countStatus!=='pending').length,short=items.filter(i=>i.countStatus==='shortage').length,surplus=items.filter(i=>i.countStatus==='surplus').length,matched=items.filter(i=>i.countStatus==='matched').length,notes=items.filter(i=>String(i.note||'').trim()).length;root.innerHTML=`<div class="grid g2"><section class="panel">${controlHtml(c)}</section><section class="panel">${campaignHtml(cp)}</section></div>${cp?`<section class="panel"><div class="row"><div class="grow"><h2>لوحة الحملة</h2><div class="muted">${esc(cp.name)} · ${esc(cp.warehouse||'بدون موقع')} · ${statusCampaign(cp.status)}</div></div><button id="newTeam" class="btn" ${cp.status!=='draft'?'disabled':''}>+ فريق</button><button id="exportAll" class="btn info">تصدير كامل</button><button id="exportDiff" class="btn bad">تصدير الفروقات</button></div><div class="stats section">${stat('الأصناف',total)}${stat('تم الجرد',counted)}${stat('مطابق',matched)}${stat('نواقص',short)}${stat('زيادات',surplus)}${stat('ملاحظات',notes)}</div>${teamsHtml(cp)}${importHtml(cp)}${reviewHtml(cp)}</section>`:'<section class="panel empty">أنشئ حملة جرد أو اختر حملة موجودة للبدء.</section>'}`;bindUi()}
function controlHtml(c){const selected=new Set(c.allowedEmployeeIds||[]);return `<div class="row"><div class="grow"><h2>تشغيل ميزة الجرد</h2><div class="muted">الميزة مخفية تمامًا عن الموظفين ما لم تفعلها وتحدد من يستطيع استخدامها.</div></div><span class="pill ${c.enabled?'ok':'bad'}">${c.enabled?'مفعلة':'مقفلة'}</span></div><div class="modes">${mode('none','إيقاف للجميع','لا تظهر الميزة لأي موظف',!c.enabled||c.accessMode==='none')}${mode('admin_only','لي فقط','الإدارة فقط',c.enabled&&c.accessMode==='admin_only')}${mode('selected','موظفين محددين','تظهر للمختارين فقط',c.enabled&&c.accessMode==='selected')}${mode('all','الجميع','كل أصحاب الحسابات',c.enabled&&c.accessMode==='all')}</div>${c.enabled&&c.accessMode==='selected'?`<div class="staff">${state.employees.map(e=>`<label><input type="checkbox" data-employee="${e.id}" ${selected.has(e.id)?'checked':''}><span>${esc(e.canonicalName||e.aliases?.[0]||e.id)}</span></label>`).join('')||'<div class="muted">لا توجد حسابات موظفين.</div>'}</div><button id="saveStaff" class="btn primary" style="margin-top:9px">حفظ الموظفين المحددين</button>`:''}`}
function mode(id,title,note,active){return `<button class="mode ${active?'active':''}" data-mode="${id}"><b>${title}</b><span>${note}</span></button>`}
function campaignHtml(cp){return `<div class="row"><div class="grow"><h2>حملات الجرد</h2><div class="muted">كل حملة مستقلة، وكل صنف لا يمكن أن ينتمي إلا لفريق واحد داخل الحملة.</div></div><button id="newCampaign" class="btn primary">+ حملة جديدة</button></div><div class="campaigns section">${state.campaigns.length?state.campaigns.slice(0,8).map(c=>`<button data-campaign="${c.id}" class="card ${cp?.id===c.id?'active':''}" style="text-align:right"><div class="cardtop"><div class="grow"><b style="font-size:12px">${esc(c.name)}</b><div class="muted">${esc(c.warehouse||'—')} · ${dt(c.createdAt)}</div></div><span class="pill ${c.status==='active'?'ok':c.status==='closed'?'bad':''}">${statusCampaign(c.status)}</span></div></button>`).join(''):'<div class="empty">لا توجد حملات بعد.</div>'}</div>${cp?`<div class="row section"><button id="activateCampaign" class="btn ok" ${cp.status==='active'&&state.control.activeCampaignId===cp.id?'disabled':''}>بدء / تفعيل الحملة</button><button id="closeCampaign" class="btn bad" ${cp.status==='closed'?'disabled':''}>إغلاق الحملة</button>${cp.status==='closed'?'<button id="reopenCampaign" class="btn">إعادة فتح</button>':''}</div>`:''}`}
function statusCampaign(s){return({draft:'مسودة',active:'نشطة',closed:'مغلقة'}[s]||s||'مسودة')}
function stat(l,v){return `<div class="stat"><b>${fmt(v)}</b><span>${l}</span></div>`}
function teamsHtml(cp){return `<div class="section"><h3>الفرق</h3><div class="muted">الموظف صاحب الحساب يسجل ويشرف، واسم موظف المستودع الذي يعدّ يُحفظ داخل الفريق بدون إنشاء حساب.</div><div class="teams section">${state.teams.length?state.teams.map(t=>{const its=state.items.filter(i=>i.teamId===t.id),done=its.filter(i=>i.countStatus&&i.countStatus!=='pending').length,p=its.length?Math.round(done/its.length*100):0;return `<div class="card"><div class="cardtop"><div class="grow"><b style="font-size:12px">${esc(t.name)}</b><div class="muted">${esc(t.zone||'بدون جهة')} · التسجيل: ${esc(t.assignedEmployeeName||'غير محدد')}${t.counterName?` · العد: ${esc(t.counterName)}`:''}</div></div><span class="pill ${p===100?'ok':''}">${done}/${its.length}</span></div><div class="progress"><i style="width:${p}%"></i></div>${cp.status==='draft'?`<div class="row" style="margin-top:8px"><button data-delete-team="${t.id}" class="btn bad">حذف الفريق وأصنافه</button></div>`:''}</div>`}).join(''):'<div class="empty">لم تتم إضافة فرق بعد.</div>'}</div></div>`}
function importHtml(cp){const im=state.import;return `<div class="section"><h3>رفع ملف Excel لفريق</h3><div class="muted">يدعم Excel وCSV. بعد اختيار الملف تحدد أعمدة رقم الصنف والكمية والشد، ثم النظام يفحص التكرار قبل الاستيراد.</div><div class="importbox section"><div class="fields"><div class="field"><label>الفريق</label><select id="importTeam" class="select" ${cp.status!=='draft'?'disabled':''}><option value="">اختر الفريق</option>${state.teams.map(t=>`<option value="${t.id}" ${im.teamId===t.id?'selected':''}>${esc(t.name)} · ${esc(t.zone||'')}</option>`).join('')}</select></div><div class="field"><label>ملف Excel / CSV</label><input id="importFile" type="file" accept=".xlsx,.xls,.csv" class="input" ${cp.status!=='draft'?'disabled':''}></div></div>${im.headers.length?mappingHtml(im):''}</div></div>`}
function mappingHtml(im){const opts=h=>`<option value="">غير محدد</option>${im.headers.map(x=>`<option value="${esc(x)}" ${im.map[h]===x?'selected':''}>${esc(x)}</option>`).join('')}`;return `<div class="mapgrid"><div class="field"><label>رقم الصنف *</label><select class="select" data-map="sku">${opts('sku')}</select></div><div class="field"><label>الكمية *</label><select class="select" data-map="qty">${opts('qty')}</select></div><div class="field"><label>الشد *</label><select class="select" data-map="pack">${opts('pack')}</select></div><div class="field"><label>اسم الصنف (اختياري)</label><select class="select" data-map="name">${opts('name')}</select></div></div><div class="preview"><table class="table"><thead><tr><th>رقم الصنف</th><th>الكمية</th><th>الشد</th><th>الاسم</th></tr></thead><tbody>${mappedRows().slice(0,8).map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.qty)}</td><td>${esc(r.pack)}</td><td>${esc(r.name)}</td></tr>`).join('')}</tbody></table></div>${im.errors.length?`<div class="warning">${im.errors.map(esc).join('<br>')}</div>`:'<div class="success">المعاينة جاهزة. سيتم منع أي صنف مكرر بين الفرق.</div>'}<button id="importNow" class="btn primary" style="margin-top:9px" ${!im.map.sku||!im.map.qty||!im.map.pack||im.errors.length?'disabled':''}>استيراد الأصناف للفريق</button>`}
function reviewHtml(cp){let rows=state.items;const q=norm(state.search);if(state.tab==='pending')rows=rows.filter(i=>!i.countStatus||i.countStatus==='pending');if(state.tab==='shortage')rows=rows.filter(i=>i.countStatus==='shortage');if(state.tab==='surplus')rows=rows.filter(i=>i.countStatus==='surplus');if(state.tab==='notes')rows=rows.filter(i=>String(i.note||'').trim());if(state.tab==='matched')rows=rows.filter(i=>i.countStatus==='matched');if(q)rows=rows.filter(i=>norm(`${i.sku} ${i.name||''} ${i.note||''}`).includes(q));rows=rows.sort((a,b)=>String(a.teamName||'').localeCompare(String(b.teamName||''),'ar')||(a.orderIndex??999999)-(b.orderIndex??999999)).slice(0,500);return `<div class="section"><div class="row"><div class="grow"><h3>مراجعة الأصناف</h3><div class="muted">يمكنك متابعة النواقص والملاحظات لحظيًا. الموظف يستطيع الرجوع للنقص وتعديل الكمية حتى إغلاق الحملة.</div></div><input id="reviewSearch" class="input" style="max-width:280px" value="${esc(state.search)}" placeholder="بحث"></div><div class="tabs">${tab('all','الكل')}${tab('pending','غير مجرود')}${tab('matched','كامل')}${tab('shortage','النواقص')}${tab('surplus','الزيادات')}${tab('notes','ملاحظات')}${tab('audit','سجل التعديلات')}</div>${state.tab==='audit'?auditHtml():`<div class="tablewrap"><table class="table"><thead><tr><th>الفريق</th><th>الصنف</th><th>الشد</th><th>المطلوب</th><th>الموجود</th><th>الفرق</th><th>الحالة</th><th>الملاحظة</th><th>آخر موظف</th></tr></thead><tbody>${rows.length?rows.map(i=>`<tr><td>${esc(i.teamName||teamName(i.teamId))}</td><td><b>${esc(i.sku)}</b><div class="muted">${esc(i.name||'')}</div></td><td>${esc(i.pack??'—')}</td><td>${fmt(i.expectedQty)}</td><td>${i.countStatus&&i.countStatus!=='pending'?fmt(i.actualQty):'—'}</td><td>${i.countStatus&&i.countStatus!=='pending'?fmt(i.difference):'—'}</td><td><span class="pill ${i.countStatus==='matched'?'ok':i.countStatus==='shortage'?'bad':i.countStatus==='surplus'?'info':''}">${statusItem(i.countStatus)}</span></td><td class="note">${esc(i.note||'')}</td><td>${esc(i.updatedByName||'—')}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">لا توجد نتائج.</td></tr>'}</tbody></table></div>`}</div>`}
function tab(id,label){return `<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`}function statusItem(s){return({pending:'غير مجرود',matched:'مطابق',shortage:'ناقص',surplus:'زائد'}[s]||'غير مجرود')}function teamName(id){return state.teams.find(t=>t.id===id)?.name||'—'}
function auditHtml(){const a=state.audit.slice(0,150);return `<div class="tablewrap"><table class="table"><thead><tr><th>الوقت</th><th>الصنف</th><th>الحركة</th><th>الموظف</th><th>قبل</th><th>بعد</th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td>${dt(x.createdAt)}</td><td>${esc(x.sku||'—')}</td><td>${esc(x.action||'—')}</td><td>${esc(x.actorName||'—')}</td><td class="note">${esc(JSON.stringify(x.before||{}))}</td><td class="note">${esc(JSON.stringify(x.after||{}))}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد تعديلات بعد.</td></tr>'}</tbody></table></div>`}
function bindUi(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#saveStaff')?.addEventListener('click',saveSelectedStaff);$('#newCampaign')?.addEventListener('click',()=>$('#campaignModal').classList.add('open'));document.querySelectorAll('[data-campaign]').forEach(b=>b.onclick=()=>{state.campaign=state.campaigns.find(c=>c.id===b.dataset.campaign)||null;bindSelected();render()});$('#activateCampaign')?.addEventListener('click',activateCampaign);$('#closeCampaign')?.addEventListener('click',closeCampaign);$('#reopenCampaign')?.addEventListener('click',reopenCampaign);$('#newTeam')?.addEventListener('click',openTeam);document.querySelectorAll('[data-delete-team]').forEach(b=>b.onclick=()=>deleteTeam(b.dataset.deleteTeam));$('#importTeam')?.addEventListener('change',e=>{state.import.teamId=e.target.value;validateImport();render()});$('#importFile')?.addEventListener('change',e=>readFile(e.target.files?.[0]));document.querySelectorAll('[data-map]').forEach(s=>s.onchange=e=>{state.import.map[e.target.dataset.map]=e.target.value;validateImport();render()});$('#importNow')?.addEventListener('click',importRows);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#reviewSearch')?.addEventListener('input',e=>{const v=e.target.value,pos=e.target.selectionStart??v.length;state.search=v;render();const next=$('#reviewSearch');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}});$('#exportAll')?.addEventListener('click',()=>exportExcel(false));$('#exportDiff')?.addEventListener('click',()=>exportExcel(true))}
async function setMode(mode){const patch=mode==='none'?{enabled:false,accessMode:'none'}:{enabled:true,accessMode:mode};try{await db.collection('system_controls').doc('stocktake_feature').set({...patch,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await auditAdmin('feature_access_changed',patch);toast('تم تحديث صلاحية الجرد')}catch(e){toast('تعذر حفظ الإعداد')}}
async function saveSelectedStaff(){const boxes=[...document.querySelectorAll('[data-employee]:checked')],ids=boxes.map(x=>x.dataset.employee),names=ids.map(id=>state.employees.find(e=>e.id===id)?.canonicalName||'').filter(Boolean);try{await db.collection('system_controls').doc('stocktake_feature').set({enabled:true,accessMode:'selected',allowedEmployeeIds:ids,allowedEmployeeNames:names,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'},{merge:true});await auditAdmin('allowed_employees_changed',{ids,names});toast('تم حفظ الموظفين')}catch(e){toast('تعذر الحفظ')}}
$('#campaignCancel').onclick=()=>$('#campaignModal').classList.remove('open');$('#campaignModal').onclick=e=>{if(e.target.id==='campaignModal')$('#campaignCancel').click()};$('#campaignCreate').onclick=async()=>{const name=$('#campaignName').value.trim(),warehouse=$('#campaignWarehouse').value.trim();if(name.length<3)return toast('اكتب اسم الحملة');try{const r=await db.collection('stocktake_campaigns').add({name,warehouse,status:'draft',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:'مهند',schemaVersion:1});state.campaign={id:r.id,name,warehouse,status:'draft'};$('#campaignCancel').click();$('#campaignName').value='';$('#campaignWarehouse').value='';await auditAdmin('campaign_created',{campaignId:r.id,name,warehouse});toast('تم إنشاء الحملة')}catch(e){toast('تعذر إنشاء الحملة')}};
async function activateCampaign(){if(!state.campaign)return;if(!state.teams.length)return toast('أضف فريقًا واحدًا على الأقل');if(!state.items.length)return toast('ارفع أصناف الحملة أولًا');if(!confirm('بدء هذه الحملة وجعلها الحملة النشطة للموظفين؟'))return;const now=firebase.firestore.FieldValue.serverTimestamp();try{const batch=db.batch();batch.set(db.collection('stocktake_campaigns').doc(state.campaign.id),{status:'active',activatedAt:now,activatedBy:'مهند'},{merge:true});batch.set(db.collection('system_controls').doc('stocktake_feature'),{activeCampaignId:state.campaign.id,updatedAt:now,updatedBy:'مهند'},{merge:true});await batch.commit();await auditAdmin('campaign_activated',{campaignId:state.campaign.id});toast('تم بدء الحملة')}catch(e){toast('تعذر بدء الحملة')}}
async function closeCampaign(){if(!state.campaign||!confirm('إغلاق حملة الجرد؟ بعد الإغلاق تصبح أصناف الموظفين للقراءة فقط وسيتم إخفاء ميزة الجرد عن الجميع.'))return;const pending=state.items.filter(i=>!i.countStatus||i.countStatus==='pending').length;if(pending&& !confirm(`باقي ${pending} صنف غير مجرود. هل تريد الإغلاق رغم ذلك؟`))return;const now=firebase.firestore.FieldValue.serverTimestamp();try{const batch=db.batch();batch.set(db.collection('stocktake_campaigns').doc(state.campaign.id),{status:'closed',closedAt:now,closedBy:'مهند'},{merge:true});batch.set(db.collection('system_controls').doc('stocktake_feature'),{enabled:false,accessMode:'none',activeCampaignId:'',updatedAt:now,updatedBy:'مهند'},{merge:true});await batch.commit();await auditAdmin('campaign_closed',{campaignId:state.campaign.id,pending});toast('تم إغلاق الحملة وحفظ النتائج')}catch(e){toast('تعذر إغلاق الحملة')}}
async function reopenCampaign(){if(!state.campaign||!confirm('إعادة فتح الحملة للتعديل؟'))return;try{await db.collection('stocktake_campaigns').doc(state.campaign.id).set({status:'draft',reopenedAt:firebase.firestore.FieldValue.serverTimestamp(),reopenedBy:'مهند'},{merge:true});await auditAdmin('campaign_reopened',{campaignId:state.campaign.id});toast('تمت إعادة فتح الحملة')}catch(e){toast('تعذر إعادة الفتح')}}
function openTeam(){if(!state.campaign)return;$('#teamEmployee').innerHTML='<option value="">اختر الموظف</option>'+state.employees.map(e=>`<option value="${e.id}">${esc(e.canonicalName||e.aliases?.[0]||e.id)}</option>`).join('');$('#teamModal').classList.add('open')}
$('#teamCancel').onclick=()=>$('#teamModal').classList.remove('open');$('#teamModal').onclick=e=>{if(e.target.id==='teamModal')$('#teamCancel').click()};$('#teamCreate').onclick=async()=>{const name=$('#teamName').value.trim(),zone=$('#teamZone').value.trim(),eid=$('#teamEmployee').value,counterName=$('#teamCounter').value.trim(),emp=state.employees.find(e=>e.id===eid);if(!name||!zone||!eid||!emp)return toast('حدد اسم الفريق والجهة والموظف صاحب الحساب');try{await db.collection('stocktake_teams').add({campaignId:state.campaign.id,name,zone,assignedEmployeeId:eid,assignedEmployeeName:emp.canonicalName||emp.aliases?.[0]||'',counterName,status:'active',orderIndex:state.teams.length,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:'مهند'});await auditAdmin('team_created',{campaignId:state.campaign.id,name,zone,eid,counterName});$('#teamCancel').click();['teamName','teamZone','teamCounter'].forEach(id=>$('#'+id).value='');toast('تم إنشاء الفريق')}catch(e){toast('تعذر إنشاء الفريق')}};
async function deleteTeam(id){const t=state.teams.find(x=>x.id===id);if(!t||!confirm(`حذف ${t.name} وجميع الأصناف المسندة له؟`))return;const docs=state.items.filter(i=>i.teamId===id);try{for(let x=0;x<docs.length;x+=400){const b=db.batch();docs.slice(x,x+400).forEach(i=>b.delete(db.collection('stocktake_items').doc(i.id)));await b.commit()}await db.collection('stocktake_teams').doc(id).delete();await auditAdmin('team_deleted',{campaignId:state.campaign.id,teamId:id,itemCount:docs.length});toast('تم حذف الفريق وأصنافه')}catch(e){toast('تعذر حذف الفريق')}}
function detect(headers,variants){for(const h of headers){const nh=norm(h);if(variants.some(v=>nh===norm(v)||nh.includes(norm(v))))return h}return''}
async function readFile(file){if(!file)return;state.import={...state.import,file,rows:[],headers:[],map:{sku:'',qty:'',pack:'',name:''},errors:[]};try{const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});const headers=rows.length?Object.keys(rows[0]):[];state.import.rows=rows;state.import.headers=headers;state.import.map={sku:detect(headers,['رقم الصنف','الصنف','رقم صنف','sku','item code','code']),qty:detect(headers,['الكمية','كمية','الرصيد','qty','quantity']),pack:detect(headers,['الشد','شد','pack']),name:detect(headers,['اسم الصنف','الاسم','item name','name'])};validateImport();render();toast(`تمت قراءة ${rows.length} صف`)}catch(e){console.error(e);toast('تعذر قراءة الملف')}}
function mappedRows(){const im=state.import;return im.rows.map((r,idx)=>({row:idx+2,sku:String(r[im.map.sku]??'').trim(),qty:r[im.map.qty],pack:r[im.map.pack],name:im.map.name?String(r[im.map.name]??'').trim():''})).filter(r=>r.sku)}
function validateImport(){const im=state.import,errors=[];if(!im.map.sku||!im.map.qty||!im.map.pack){im.errors=errors;return}const rows=mappedRows(),seen=new Map();for(const r of rows){const k=norm(r.sku),q=num(r.qty);if(!k){errors.push(`صف ${r.row}: رقم الصنف فارغ`);continue}if(!Number.isFinite(q)||q<0)errors.push(`صف ${r.row}: كمية غير صحيحة للصنف ${r.sku}`);if(seen.has(k))errors.push(`الصنف ${r.sku} مكرر داخل نفس الملف`);else seen.set(k,r.row)}const existing=new Map(state.items.map(i=>[norm(i.sku),i]));for(const r of rows){const e=existing.get(norm(r.sku));if(e&&e.teamId!==im.teamId)errors.push(`الصنف ${r.sku} موجود مسبقًا في الفريق: ${teamName(e.teamId)}`)}im.errors=[...new Set(errors)].slice(0,20)}
async function importRows(){const im=state.import;if(!state.campaign||state.campaign.status!=='draft')return toast('الاستيراد متاح قبل بدء الحملة فقط');if(!im.teamId)return toast('اختر الفريق');validateImport();if(im.errors.length)return render();const team=state.teams.find(t=>t.id===im.teamId);if(!team)return toast('الفريق غير موجود');const rows=mappedRows();if(!rows.length)return toast('الملف لا يحتوي أصنافًا');if(!confirm(`استيراد ${rows.length} صنف إلى ${team.name}؟`))return;try{const fresh=await db.collection('stocktake_items').where('campaignId','==',state.campaign.id).get();const freshMap=new Map(fresh.docs.map(d=>{const x=d.data();return[norm(x.sku),{id:d.id,...x}]}));const conflicts=rows.filter(r=>{const e=freshMap.get(norm(r.sku));return e&&e.teamId!==team.id});if(conflicts.length)return toast(`مرفوض: ${conflicts.length} صنف موجود في فرق أخرى`);for(let x=0;x<rows.length;x+=350){const batch=db.batch();rows.slice(x,x+350).forEach((r,j)=>{const id=itemId(state.campaign.id,r.sku),existing=state.items.find(i=>norm(i.sku)===norm(r.sku)),ref=db.collection('stocktake_items').doc(id);const base={campaignId:state.campaign.id,campaignName:state.campaign.name,teamId:team.id,teamName:team.name,zone:team.zone,sku:r.sku,normalizedSku:norm(r.sku),name:r.name,expectedQty:num(r.qty),pack:r.pack,countStatus:existing?.countStatus||'pending',actualQty:existing?.actualQty??null,difference:existing?.difference??null,note:existing?.note||'',hasNote:!!existing?.note,orderIndex:x+j,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),importedAt:firebase.firestore.FieldValue.serverTimestamp(),importedBy:'مهند'};batch.set(ref,base,{merge:true})});await batch.commit()}await auditAdmin('team_items_imported',{campaignId:state.campaign.id,teamId:team.id,count:rows.length,fileName:im.file?.name||''});state.import={file:null,rows:[],headers:[],map:{sku:'',qty:'',pack:'',name:''},teamId:im.teamId,errors:[]};toast(`تم استيراد ${rows.length} صنف بنجاح`)}catch(e){console.error(e);toast('تعذر استيراد الأصناف')}}
function exportExcel(diffOnly){if(!state.campaign)return;const rows=(diffOnly?state.items.filter(i=>['shortage','surplus'].includes(i.countStatus)):state.items).map(i=>({'الفريق':i.teamName||teamName(i.teamId),'الجهة':i.zone||'', 'رقم الصنف':i.sku,'اسم الصنف':i.name||'','الشد':i.pack??'','كمية النظام':Number(i.expectedQty)||0,'الكمية الفعلية':i.countStatus&&i.countStatus!=='pending'?(Number(i.actualQty)||0):'','الفرق':i.countStatus&&i.countStatus!=='pending'?(Number(i.difference)||0):'','الحالة':statusItem(i.countStatus),'الملاحظة':i.note||'','آخر تسجيل بواسطة':i.updatedByName||''}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,diffOnly?'الفروقات':'الجرد');XLSX.writeFile(wb,`${state.campaign.name}_${diffOnly?'الفروقات':'كامل'}.xlsx`)}
async function auditAdmin(action,data){try{await db.collection('stocktake_audit').add({campaignId:state.campaign?.id||data?.campaignId||'',action,actorName:'مهند',actorEmployeeId:null,data,createdAt:firebase.firestore.FieldValue.serverTimestamp(),userAgent:navigator.userAgent||''})}catch(e){console.warn(e)}}
</script></body></html>
