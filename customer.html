const {useState,useEffect,useMemo,useRef,useCallback,memo} = React;
const NF = new Intl.NumberFormat('en-US',{maximumFractionDigits:1});
const PRICE_NF = new Intl.NumberFormat('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
const toEnglishDigits = s => String(s??'').replace(/[٠-٩۰-۹]/g,d=>{const a=AR.indexOf(d);return a>-1?String(a):String(FA.indexOf(d))});
const normalizeCleanId = s => toEnglishDigits(s).replace(/\D/g,'');
const normalizeText = s => toEnglishDigits(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/\u0640/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
const roundHalf = n => Math.round((Number(n)||0)*2)/2;
const floorHalf = n => Math.max(0,Math.floor((Number(n)||0)*2+1e-7)/2);
const sum = arr => arr.reduce((a,b)=>a+(Number(b)||0),0);
const uidPart = () => Math.random().toString(36).slice(2,10);
const nowLabel = () => new Date().toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'});


// Security telemetry: meaningful customer activity only. Never stores PINs or face images.
const customerSessionId = (()=>{
  try{
    let id=sessionStorage.getItem('batco_customer_session_id');
    if(!id){id=`cs_${Date.now().toString(36)}_${uidPart()}`;sessionStorage.setItem('batco_customer_session_id',id)}
    return id;
  }catch{return `cs_${Date.now().toString(36)}_${uidPart()}`}
})();
const customerDeviceInfo = () => ({
  userAgent:navigator.userAgent||'', platform:navigator.platform||'', language:navigator.language||'',
  viewport:`${window.innerWidth||0}x${window.innerHeight||0}`, standalone:Boolean(window.matchMedia?.('(display-mode: standalone)')?.matches || navigator.standalone),
  timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||''
});
async function logCustomerEvent(user,type,label='',data={}){
  if(!user?.uid)return;
  try{
    await db.collection(CUSTOMER_ACTIVITY_COLLECTION).add({
      customerUid:user.uid, sessionId:customerSessionId, type, label:String(label||''), data:data||{},
      device:customerDeviceInfo(), createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){console.warn('[Customer telemetry]',e?.message||e)}
}
async function touchCustomerSession(user,profile,event='active'){
  if(!user?.uid)return;
  try{
    const key='batco_customer_session_started_'+customerSessionId;
    const first=!sessionStorage.getItem(key);
    const payload={customerUid:user.uid,sessionId:customerSessionId,name:profile?.name||'',company:profile?.company||'',phone:profile?.phone||'',event,lastActive:firebase.firestore.FieldValue.serverTimestamp(),device:customerDeviceInfo()};
    if(first){payload.startedAt=firebase.firestore.FieldValue.serverTimestamp();sessionStorage.setItem(key,'1')}
    await db.collection(CUSTOMER_SESSION_COLLECTION).doc(`${user.uid}_${customerSessionId}`).set(payload,{merge:true});
  }catch(e){console.warn('[Customer session]',e?.message||e)}
}

function normalizePhone(raw){
  let d=toEnglishDigits(raw).replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(/^05\d{8}$/.test(d)) d='966'+d.slice(1);
  else if(/^5\d{8}$/.test(d)) d='966'+d;
  return d;
}
function displayPhone(p){
  const d=normalizePhone(p);
  if(/^9665\d{8}$/.test(d)) return '0'+d.slice(3);
  return d;
}
function authEmailFromPhone(phone){ return `customer_${normalizePhone(phone)}@example.com`; }
function legacyAuthEmailFromPhone(phone){ return `customer_${normalizePhone(phone)}@portal.batco.local`; }
function validPhone(phone){ const d=normalizePhone(phone); return /^\d{8,15}$/.test(d); }
function validPin(pin){ return /^\d{6}$/.test(toEnglishDigits(pin)); }

function registrationErrorMessage(err,stage='auth',cleanupFailed=false){
  const code=String(err?.code||'');
  const suffix=code?` (رمز: ${code.replace(/^firebase\//,'')})`:'';
  if(code==='auth/email-already-in-use') return 'يوجد حساب مسجل بهذا الرقم بالفعل. اختر «لدي حساب».';
  if(code==='auth/operation-not-allowed'||code==='auth/configuration-not-found') return 'خدمة إنشاء الحسابات غير مفعّلة في Firebase. فعّل Email/Password من Authentication ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/invalid-email') return 'تعذر تجهيز معرّف الحساب الداخلي. تم تصحيح هذه المشكلة في النسخة الجديدة؛ حدّث الصفحة وحاول مرة أخرى.'+suffix;
  if(code==='auth/weak-password') return 'رمز الدخول غير مقبول حسب سياسة Firebase الحالية. استخدم 6 أرقام مختلفة مؤقتًا أو راجع سياسة كلمات المرور.'+suffix;
  if(code==='auth/network-request-failed'||code==='unavailable'||code==='firestore/unavailable') return 'تعذر الوصول إلى خدمة الحسابات الآن. تحقق من الاتصال ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/too-many-requests'||code==='auth/quota-exceeded') return 'تم إيقاف إنشاء الحسابات مؤقتًا بسبب كثرة المحاولات. انتظر قليلًا ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/app-not-authorized'||code==='auth/unauthorized-domain') return 'نطاق الموقع غير مصرح له في Firebase Authentication. أضف نطاق Vercel ضمن Authorized domains.'+suffix;
  if(code==='permission-denied'||code==='firestore/permission-denied') return 'تم إنشاء بيانات الدخول، لكن قواعد Firestore تمنع إنشاء ملف العميل. يلزم السماح لمجموعة customers للمستخدم المسجل.'+suffix+(cleanupFailed?' وتعذر تنظيف حساب المصادقة تلقائيًا؛ راجع Firebase Authentication.':'');
  if(code==='failed-precondition'||code==='firestore/failed-precondition') return 'إعداد قاعدة البيانات غير مكتمل لهذه العملية. راجع Firestore ثم أعد المحاولة.'+suffix;
  if(stage==='profile') return 'نجح إنشاء بيانات الدخول لكن تعذر حفظ ملف العميل في قاعدة البيانات.'+suffix+(cleanupFailed?' راجع Firebase Authentication قبل إعادة المحاولة.':'');
  return 'تعذر إنشاء الحساب بسبب إعداد تقني غير متوقع.'+suffix;
}

async function fetchText(url,{fresh=false}={}){
  const key='customer_cache_'+url;
  try{
    const target=fresh?`${url}${url.includes('?')?'&':'?'}v=${Date.now()}`:url;
    const res=await fetch(target,{cache:fresh?'no-store':'default'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(!fresh) localStorage.setItem(key,text);
    return text;
  }catch(err){
    const cached=localStorage.getItem(key);
    if(cached&&!fresh) return cached;
    throw err;
  }
}

function parsePricingMap(rawText){
  const map={}; if(!rawText)return map;
  const lines=String(rawText).trim().split(/\r?\n/); if(lines.length<2)return map;
  let headerRow=-1;
  for(let i=0;i<Math.min(lines.length,5);i++){if(lines[i]?.includes('سعر')&&(lines[i].includes('رقم')||lines[i].includes('صنف'))){headerRow=i;break}}
  if(headerRow<0)return map;
  const headers=lines[headerRow].split('\t').map(x=>x.trim()),pairs=[];
  headers.forEach((h,i)=>{if(/رقم|كود|صنف/i.test(h)){if(i>0&&/سعر|بيع/i.test(headers[i-1]))pairs.push([i,i-1]);else if(i<headers.length-1&&/سعر|بيع/i.test(headers[i+1]))pairs.push([i,i+1])}});
  for(let i=headerRow+1;i<lines.length;i++){const cols=lines[i].split('\t').map(x=>x.trim());pairs.forEach(([skuIdx,priceIdx])=>{const id=normalizeCleanId(cols[skuIdx]||'');const price=parseFloat(toEnglishDigits(cols[priceIdx]||'').replace(/,/g,''));if(id&&Number.isFinite(price)&&price>0)map[id]=price})}
  return map;
}

function parseInventory(raw){
  if(!raw) return [];
  const lines=raw.trim().split(/\r?\n/); if(lines.length<2) return [];
  const headers=lines[0].split('\t').map(x=>x.trim());
  const idIdx=headers.findIndex(h=>/رقم|كود|sku|item/i.test(h));
  const nameIdx=headers.findIndex(h=>/اسم|وصف|description|name/i.test(h));
  const qtyIdx=headers.findIndex(h=>/كمية|رصيد|متوفر|qty|quantity/i.test(h));
  const unitIdx=headers.findIndex(h=>/وحدة|unit|uom/i.test(h));
  const packIdx=headers.findIndex(h=>/شد|الشد/i.test(h));
  if(idIdx<0) return [];
  const map=new Map();
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split('\t').map(x=>x.trim());
    const id=c[idIdx]||''; const cleanId=normalizeCleanId(id); if(!cleanId) continue;
    const q=parseFloat(toEnglishDigits(qtyIdx>=0?(c[qtyIdx]||'0'):'0').replace(/,/g,''));
    map.set(cleanId,{cleanId,id,name:nameIdx>=0?(c[nameIdx]||''):'',qty:Number.isFinite(q)?q:0,unit:unitIdx>=0?(c[unitIdx]||''):'',pack:packIdx>=0?(c[packIdx]||''):''});
  }
  return [...map.values()];
}
function mergeInventories(a,b){
  const map=new Map();
  [...a,...b].forEach(item=>{
    const prev=map.get(item.cleanId);
    if(!prev) map.set(item.cleanId,{...item,mergedQty:Math.max(0,item.qty||0)});
    else map.set(item.cleanId,{...prev,id:prev.id||item.id,name:prev.name||item.name,unit:prev.unit||item.unit,pack:prev.pack||item.pack,mergedQty:Math.max(0,prev.mergedQty||0)+Math.max(0,item.qty||0)});

        let total=0;

        const avg=total/(d.length/4);
        // متسامح عمدًا: نرفض فقط الظلام الشديد أو الصورة المحروقة جدًا.
        lightOk=avg>18&&avg<252;
      }catch{}

      if(faces.length!==1){
        goodFramesRef.current=0;
        setQuality({face:false,light:lightOk,ready:false});
        setStatus(faces.length>1?'خلّ شخص واحد فقط أمام الكاميرا':'وجّه الكاميرا على وجهك');

      }

      if(!faceOk){
        goodFramesRef.current=0;

        setStatus(faceW<=.115?'قرّب الجوال قليلًا':'أبعد الجوال قليلًا');
        return;
      }

      // لا رمشة، لا لف رأس، لا تحديات. وجه واضح ومستقر للحظة واحدة فقط.
      goodFramesRef.current+=1;
      const ready=goodFramesRef.current>=3;
      setQuality({face:true,light:true,ready});
      setStatus(goodFramesRef.current<3?'ممتاز، ثبّت الجوال لحظة...':'جاري إنهاء التحقق...');

    const rateKey='cust_login_rate_'+p;let state={n:0,t:0};try{state=JSON.parse(localStorage.getItem(rateKey)||'{}')}catch{};const now=Date.now();if(state.t&&now-state.t<15*60*1000&&state.n>=6)return setError('تم إيقاف المحاولات مؤقتًا. حاول بعد 15 دقيقة.');

      sessionStorage.setItem('batco_customer_auth_reason','manual_login');
      const password=toEnglishDigits(pin);
      try{await auth.signInWithEmailAndPassword(authEmailFromPhone(p),password)}
      catch(primaryErr){
        const fallbackCodes=new Set(['auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials','auth/invalid-email']);
        if(!fallbackCodes.has(primaryErr?.code)) throw primaryErr;
        await auth.signInWithEmailAndPassword(legacyAuthEmailFromPhone(p),password);
      }
      localStorage.removeItem(rateKey)
    }catch(err){
      console.error('[Customer login]',err?.code,err?.message,err);
      const n=(state.t&&now-state.t<15*60*1000?state.n:0)+1;localStorage.setItem(rateKey,JSON.stringify({n,t:now}));
      if(err.code==='auth/operation-not-allowed'||err.code==='auth/configuration-not-found')setError('خدمة الحسابات غير مفعّلة في Firebase حاليًا.');
      else if(err.code==='auth/network-request-failed')setError('تعذر الاتصال بخدمة تسجيل الدخول. تحقق من الشبكة وحاول مرة أخرى.');
      else if(err.code==='auth/too-many-requests')setError('تم إيقاف المحاولات مؤقتًا للحماية. حاول بعد قليل.');
      else setError('رقم الجوال أو رمز الدخول غير صحيح.');
    }finally{setBusy(false)}};
  return <div className="min-h-[100dvh] ui-auth-bg flex items-center justify-center px-4 py-8 safe-top safe-bottom"><div className="w-full max-w-[500px]">
    <button type="button" onClick={onBack} className="ui-back mb-4"><Icon name="back" className="w-4 h-4"/>رجوع</button>
    <form onSubmit={submit} className="ui-panel fade-in">
      <div className="ui-panel-head"><div className="ui-brand-mark"><Icon name="lock" className="w-7 h-7"/></div><div className="ui-eyebrow">تسجيل الدخول</div><h2 className="ui-title">أهلًا بعودتك</h2><p className="ui-subtitle">رقم الجوال ورمز الدخول فقط.</p></div>
      <div className="ui-panel-body">
        <FormField label="رقم الجوال" icon="phone"><input value={phone} onChange={e=>setPhone(toEnglishDigits(e.target.value).replace(/[^0-9+]/g,''))} inputMode="tel" autoComplete="username" dir="ltr" className="ui-input text-left" placeholder="05xxxxxxxx"/></FormField>
        <FormField label="رمز الدخول" icon="lock"><input value={pin} onChange={e=>setPin(toEnglishDigits(e.target.value).replace(/\D/g,'').slice(0,6))} inputMode="numeric" type="password" autoComplete="current-password" className="ui-input ui-pin" placeholder="••••••"/></FormField>
        {error&&<div className="ui-error"><Icon name="alert" className="w-5 h-5 shrink-0 mt-[1px]"/>{error}</div>}
        <button disabled={busy} className="ui-btn ui-btn-primary">{busy?<Spinner/>:<><Icon name="shop" className="w-5 h-5"/>دخول إلى المعرض</>}</button>
        <p className="text-[11px] leading-6 text-muted text-center">نسيت رمز الدخول؟ تواصل مع الإدارة لإعادة تعيينه.</p>
      </div>
    </form>
    <CustomerCredits/>
  </div></div>
}

function BranchAllocationModal({item,branches,current,onClose,onSave,onLimit}){
  const [q,setQ]=useState(()=>Object.fromEntries(branches.map(b=>[b.id,roundHalf(current?.[b.id]||0)])));
  const total=sum(Object.values(q)); const max=item.allowedMax;
  const adjust=(id,delta)=>{setQ(prev=>{const next={...prev};const cur=roundHalf(next[id]||0);if(delta>0&&sum(Object.values(prev))+CART_STEP>max+1e-9){onLimit(max);return prev}next[id]=Math.max(0,roundHalf(cur+delta));return next})};
  return <div className="fixed inset-0 z-50 bg-black/45 flex items-end sm:items-center justify-center" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><div className="w-full sm:max-w-[560px] max-h-[88dvh] bg-white rounded-t-20 sm:rounded-20 shadow-lift overflow-hidden fade-in">

function OrdersView({orders,drafts,onLoadDraft,onDeleteDraft,loading}){

  const [expanded,setExpanded]=useState(null);
  useEffect(()=>setExpanded(null),[tab]);
  const rows=tab==='orders'?orders:drafts;

  const details=(row)=>{
    const branchRows=(row.branches||[]).map(branch=>({
      branch,
      items:(row.items||[]).map(item=>({...item,qty:item.branchQuantities?.[branch.id]||0})).filter(item=>item.qty>0)
    })).filter(x=>x.items.length);
    return <div className="mt-3 pt-3 border-t border-border grid gap-3 fade-in">

    </div>;
  };

  return <div>
    <div className="bg-surface border border-border rounded-12 p-1 grid grid-cols-2 mb-4"><button onClick={()=>setTab('orders')} className={`h-10 rounded-10 text-sm font-bold ${tab==='orders'?'bg-white shadow-card':'text-secondary'}`}>الطلبات المرسلة</button><button onClick={()=>setTab('drafts')} className={`h-10 rounded-10 text-sm font-bold ${tab==='drafts'?'bg-white shadow-card':'text-secondary'}`}>المسودات</button></div>

hite':'text-muted'}`}><Icon name="grid" className="w-4 h-4"/></button><button onClick={()=>setViewMode('list')} className={`w-9 h-8 rounded-8 flex items-center justify-center ${viewMode==='list'?'bg-primary text-white':'text-muted'}`}><Icon name="list" className="w-4 h-4"/></button></div></div>{loading?<div className="py-24 flex justify-center"><Spinner/></div>:filtered.length===0?<Empty title="لا توجد منتجات في هذا القسم" note="قد تكون المنتجات بانتظار إضافة صور أو تحديث التصنيف." icon="grid"/>:<><div className={viewMode==='grid'?'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4':'grid gap-3'}>{filtered.slice(0,pageCount).map(item=>viewMode==='grid'?<ProductCard key={item.cleanId} item={item} onAdd={requestProduct} onImageMissing={()=>markImageMissing(item.cleanId)} onZoom={setZoom}/>:<ProductListCard key={item.cleanId} item={item} onAdd={requestProduct} onImageMissing={()=>markImageMissing(item.cleanId)} onZoom={setZoom}/>)}</div>{pageCount<filtered.length&&<button onClick={()=>setPageCount(n=>n+PAGE_SIZE)} className="mt-5 w-full h-12 rounded-12 border border-border bg-white font-bold text-sm">عرض المزيد</button>}</>}</>}

function Root({registrationEnabled=true,loginEnabled=true}){
  const [authState,setAuthState]=useState('loading'),[profile,setProfile]=useState(null),[screen,setScreen]=useState('choice'),[registration,setRegistration]=useState(null),[registering,setRegistering]=useState(false),[globalError,setGlobalError]=useState('');
  const creatingAccountRef=useRef(false);

  useEffect(()=>auth.onAuthStateChanged(async u=>{
    if(creatingAccountRef.current) return;
    if(!u){setProfile(null);setAuthState('guest');return;}
    setAuthState('loading');
    try{
      const doc=await db.collection(CUSTOMER_COLLECTION).doc(u.uid).get();
      if(!doc.exists){await auth.signOut();setGlobalError('الحساب موجود في المصادقة لكن ملف العميل غير مكتمل. تواصل مع الإدارة.');setAuthState('guest');return;}
      const p={id:doc.id,...doc.data()};
      if(p.status==='suspended'){await auth.signOut();setGlobalError('هذا الحساب موقوف حاليًا. تواصل مع الإدارة.');setAuthState('guest');return;}
      setProfile(p);setAuthState('ready');
      const reason=sessionStorage.getItem('batco_customer_auth_reason')||'session_restore';sessionStorage.removeItem('batco_customer_auth_reason');
      db.collection(CUSTOMER_COLLECTION).doc(u.uid).update({lastLoginAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
      touchCustomerSession(u,p,reason);
      logCustomerEvent(u,reason==='manual_login'?'login_success':'session_restored',reason,{company:p.company,phone:p.phone});
      db.collection(CUSTOMER_LOGIN_COLLECTION).add({customerUid:u.uid,company:p.company||'',phone:p.phone||'',type:reason==='manual_login'?'login_success':'session_restore',sessionId:customerSessionId,device:customerDeviceInfo(),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    }catch(e){console.error(e);setGlobalError('تعذر تحميل حساب العميل.');setAuthState('guest');}
  }),[]);

  const finishRegistration=async(facePhotoDataUrl='')=>{
    if(!registration||registering)return;
    setRegistering(true);setGlobalError('');creatingAccountRef.current=true;
    let created=null,stage='auth',cleanupFailed=false;
    try{
      sessionStorage.setItem('batco_customer_auth_reason','account_created');
      const email=authEmailFromPhone(registration.phone);
      console.info('[Customer registration] starting',{phone:registration.phone,emailHint:email.replace(/(.{4}).+(@.+)/,'$1***$2')});
      const cred=await auth.createUserWithEmailAndPassword(email,registration.pin);
      created=cred.user;stage='profile';
      const profileData={name:'',company:registration.company,phone:registration.phone,branches:[],status:'active',livenessVerified:true,livenessVerifiedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastLoginAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:3};
      await db.collection(CUSTOMER_COLLECTION).doc(created.uid).set(profileData);
      const doc=await db.collection(CUSTOMER_COLLECTION).doc(created.uid).get();
      if(!doc.exists) throw Object.assign(new Error('customer profile missing after create'),{code:'customer/profile-missing'});
      const createdProfile={id:created.uid,...doc.data()};setProfile(createdProfile);
      if(facePhotoDataUrl){
        try{
          await db.collection(CUSTOMER_SECURITY_PHOTO_COLLECTION).add({
            customerUid:created.uid,company:registration.company||'',phone:registration.phone||'',photoDataUrl:facePhotoDataUrl,
            verificationType:'registration_face_presence',sessionId:customerSessionId,userAgent:navigator.userAgent||'',platform:navigator.platform||'',
            screen:`${window.screen?.width||0}x${window.screen?.height||0}`,createdAt:firebase.firestore.FieldValue.serverTimestamp()
          });
        }catch(photoErr){console.warn('[Customer security photo save]',photoErr)}
      }
      touchCustomerSession(created,createdProfile,'account_created');
      logCustomerEvent(created,'account_created','إنشاء حساب',{company:registration.company,phone:registration.phone,livenessVerified:true});
      logCustomerEvent(created,'liveness_verified','تم التحقق من الحضور',{savedFaceImage:!!facePhotoDataUrl});
      db.collection(CUSTOMER_LOGIN_COLLECTION).add({customerUid:created.uid,company:registration.company,phone:registration.phone,type:'account_created',sessionId:customerSessionId,device:customerDeviceInfo(),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
      setRegistration(null);setAuthState('ready');setScreen('choice');
    }catch(err){
      console.error('[Customer registration]',{stage,code:err?.code,message:err?.message,error:err});
      if(created&&stage==='profile'){
        try{await created.delete();created=null}
        catch(cleanErr){cleanupFailed=true;console.error('[Customer registration cleanup]',cleanErr);try{await auth.signOut()}catch{}}
      }
      setGlobalError(registrationErrorMessage(err,stage,cleanupFailed));
      setScreen('choice');setRegistration(null);setAuthState('guest');
    }finally{
      creatingAccountRef.current=false;setRegistering(false);
    }
  };
  if(authState==='loading'||registering)return <div className="min-h-[100dvh] ui-auth-bg flex flex-col items-center justify-center gap-4 px-4"><div className="ui-brand-mark !mb-0"><Icon name="shop" className="w-7 h-7"/></div><Spinner/><div className="text-sm font-semibold text-secondary">{registering?'جاري إنشاء حسابك...':'جاري تجهيز البوابة...'}</div></div>;
  if(authState==='ready'&&profile)return <CustomerApp user={auth.currentUser} profile={profile} onProfileUpdate={setProfile}/>;
  if(screen==='register'&&registrationEnabled)return <RegistrationForm onBack={()=>setScreen('choice')} onReady={data=>{setRegistration(data);setScreen('liveness')}}/>;
  if(screen==='liveness'&&registration)return <LivenessCheck registration={registration} onBack={()=>setScreen('register')} onSuccess={finishRegistration}/>;
  if(screen==='login'&&loginEnabled)return <ExistingLogin onBack={()=>setScreen('choice')}/>;
  return <><AccessChoice registrationEnabled={registrationEnabled} loginEnabled={loginEnabled} onNew={()=>{if(!registrationEnabled)return;setGlobalError('');setScreen('register')}} onExisting={()=>{if(!loginEnabled)return;setGlobalError('');setScreen('login')}}/>{globalError&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-32px)] max-w-[560px] bg-danger text-white rounded-12 p-3 shadow-lift text-sm font-bold">{globalError}</div>}</>;
}

function CustomerPortalBootstrap(){
  const [control,setControl]=useState({...DEFAULT_CUSTOMER_PORTAL_CONTROL,__loading:true});
  const previewAllowed=useMemo(()=>{
    try{return localStorage.getItem(CUSTOMER_PORTAL_PREVIEW_KEY)==='admin-preview'}catch{return false}
  },[]);

  useEffect(()=>{
    const ref=db.collection(CUSTOMER_PORTAL_CONTROL_COLLECTION).doc(CUSTOMER_PORTAL_CONTROL_DOC);
    const unsubscribe=ref.onSnapshot(doc=>{
      setControl({...DEFAULT_CUSTOMER_PORTAL_CONTROL,...(doc.exists?doc.data():{}),__loading:false});
    },err=>{
      console.warn('[Portal control]',err);
      setControl({...DEFAULT_CUSTOMER_PORTAL_CONTROL,__loading:false});
    });
    return()=>unsubscribe();
  },[]);

  if(control.__loading){
    return <div className="min-h-[100dvh] ui-auth-bg flex flex-col items-center justify-center gap-4 px-4"><div className="ui-brand-mark !mb-0"><Icon name="shop" className="w-7 h-7"/></div><Spinner/><div className="text-sm font-semibold text-secondary">جاري التحقق من حالة البوابة...</div></div>;
  }

  if(!control.enabled&&!previewAllowed){
    return <div className="min-h-[100dvh] ui-auth-bg flex items-center justify-center p-5 font-sans safe-top safe-bottom">
      <div className="w-full max-w-[440px] ui-panel fade-in">
        <div className="ui-panel-head">
          <div className="ui-brand-mark"><Icon name="shop" className="w-7 h-7"/></div>
          <div className="ui-eyebrow">بوابة العملاء</div>
          <h1 className="ui-title">الخدمة متوقفة مؤقتًا</h1>
          <p className="ui-subtitle">{control.maintenanceMessage||DEFAULT_CUSTOMER_PORTAL_CONTROL.maintenanceMessage}</p>
        </div>
        <div className="ui-panel-body"><a href="./index.html" className="ui-btn ui-btn-secondary"><Icon name="back" className="w-4 h-4"/>العودة للبوابة الرئيسية</a></div>
      </div>
    </div>;
  }

  const effectiveRegistration=previewAllowed?true:control.registrationEnabled!==false;
  const effectiveLogin=previewAllowed?true:control.loginEnabled!==false;
  return <>
    {previewAllowed&&!control.enabled&&<div className="fixed top-2 left-1/2 -translate-x-1/2 z-[200] px-3 py-2 rounded-full bg-info text-white shadow-lift text-[11px] font-bold whitespace-nowrap">معاينة الإدارة — البوابة متوقفة للعامة</div>}
    <Root registrationEnabled={effectiveRegistration} loginEnabled={effectiveLogin}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<CustomerPortalBootstrap/>);
</script>
