<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>بوابة عملاء بيت الأواني الطيبة</title><meta name="theme-color" content="#FFFFFF"><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#1c1917}#v37boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:999999}.v37box{text-align:center;padding:24px}.v37box img{width:82px;height:82px;object-fit:contain}.v37box p{font-size:12px;color:#78716c;margin:12px 0 0}.v37err{max-width:440px;margin:auto;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:14px;padding:16px;font-size:13px;line-height:1.8}</style></head>
<body><div id="v37boot"><div class="v37box"><img src="./icons/icon-192.png" alt="بيت الأواني الطيبة"><p>جاري فتح بوابة العملاء...</p></div></div>
<script>
(async function(){
  const params=new URLSearchParams(location.search),employeeName=(()=>{try{return String(localStorage.getItem('inventory_user_name_v2')||'').trim()}catch{return''}})();
  if(employeeName&&params.get('employeeView')!=='1'){location.replace('./index.html?employee=1');return}
  const CORE='./runtime/customer-v37-source.txt?v=38.0';
  const loadCore=async()=>{try{const r=await fetch(CORE,{cache:'no-store'});if(!r.ok)throw new Error('CORE_HTTP_'+r.status);const text=await r.text();try{const c=await caches.open('batco-v37-core');await c.put(CORE,new Response(text,{headers:{'Content-Type':'text/plain;charset=utf-8'}}))}catch{}return text}catch(e){try{const hit=await caches.match(CORE);if(hit)return await hit.text()}catch{}throw e}};
  try{
    let html=await loadCore();
    const oldSession="const EMPLOYEE_CUSTOMER_SESSION = (() => { try { const name=String(localStorage.getItem('inventory_user_name_v2')||'').trim(); const employeeId=String(localStorage.getItem('inventory_employee_id_v2')||'').trim(); const authVersion=String(localStorage.getItem('inventory_employee_auth_version_v2')||''); return {valid:Boolean(name&&employeeId&&authVersion==='2'),name,employeeId}; } catch { return {valid:false,name:'',employeeId:''}; } })();";
    const newSession="const EMPLOYEE_CUSTOMER_SESSION = (() => { try { const name=String(localStorage.getItem('inventory_user_name_v2')||'').trim(); const employeeId=String(localStorage.getItem('inventory_employee_id_v2')||'').trim(); const authVersion=String(localStorage.getItem('inventory_employee_auth_version_v2')||''); const modern=Boolean(name&&employeeId&&authVersion==='2'); return {valid:Boolean(name),name,employeeId,authVersion,modern}; } catch { return {valid:false,name:'',employeeId:'',authVersion:'',modern:false}; } })();";
    if(!html.includes(oldSession))throw new Error('V37_CUSTOMER_SESSION_MARKER');html=html.replace(oldSession,newSession);
    if(!html.includes("customer-sw.js?v=35.0"))throw new Error('V37_SW_MARKER');html=html.replace("customer-sw.js?v=35.0","customer-sw.js?v=37.0");

    const employeeViewMarker='window.__employeeCustomerView = EMPLOYEE_CUSTOMER_VIEW;';
    if(!html.includes(employeeViewMarker))throw new Error('V38_TRANSFER_HELPER_MARKER');
    const transferHelper=`
const EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY='batco_employee_customer_cart_transfer_v1';
function handoffEmployeeCustomerCart(cartItems,branches){
  if(!EMPLOYEE_CUSTOMER_VIEW)return false;
  const rows=(Array.isArray(cartItems)?cartItems:[]).map(item=>({
    cleanId:normalizeCleanId(item?.cleanId||item?.id||''),
    id:String(item?.id||item?.cleanId||''),
    name:String(item?.name||''),
    totalQty:Number(item?.totalQty)||0,
    cartonPrice:Number(item?.cartonPrice)||0,
    pack:String(item?.pack||''),
    imageFile:String(item?.imageFile||''),
    allowedMax:Number(item?.allowedMax)||0,
    branchQuantities:{...(item?.branchQuantities||{})}
  })).filter(item=>item.cleanId&&item.totalQty>0);
  if(!rows.length){window.alert('السلة فارغة. أضف أصنافًا أولاً ثم تابع الاعتماد.');return false;}
  const safeBranches=(Array.isArray(branches)?branches:[]).map(branch=>({id:String(branch?.id||''),name:String(branch?.name||'')})).filter(branch=>branch.id||branch.name);
  const payload={
    version:1,
    transferId:'ect_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),
    createdAt:Date.now(),
    employeeName:String(EMPLOYEE_CUSTOMER_SESSION.name||''),
    employeeId:String(EMPLOYEE_CUSTOMER_SESSION.employeeId||''),
    source:'customer_portal_employee_view',
    items:rows,
    branches:safeBranches
  };
  try{
    localStorage.setItem(EMPLOYEE_CUSTOMER_CART_TRANSFER_KEY,JSON.stringify(payload));
    const target=new URL('./index.html',window.location.href);
    target.searchParams.set('employee','1');
    target.searchParams.set('customerCartTransfer','1');
    window.location.href=target.href;
    return true;
  }catch(error){
    console.error('[Employee customer cart handoff]',error);
    window.alert('تعذر نقل السلة إلى نظام الموظفين. السلة ما زالت محفوظة هنا ولم يتم حذفها.');
    return false;
  }
}
`;
    html=html.replace(employeeViewMarker,employeeViewMarker+'\n'+transferHelper);

    const oldCheckout="onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?setToast({type:'info',message:employeeViewNotice}):setCheckout(true)}";
    const newCheckout="onCheckout={()=>EMPLOYEE_CUSTOMER_VIEW?handoffEmployeeCustomerCart(cartItems,branches):setCheckout(true)}";
    if(!html.includes(oldCheckout))throw new Error('V38_EMPLOYEE_CHECKOUT_MARKER');
    html=html.replace(oldCheckout,newCheckout);

    if(!html.includes("EMPLOYEE_CUSTOMER_ROUTE.get('employeeView')==='1'")||!html.includes("EMPLOYEE_CUSTOMER_SESSION.name||'موظف'")||!html.includes('!EMPLOYEE_CUSTOMER_VIEW&&guestMode&&showGuestNamePrompt')||!html.includes('handoffEmployeeCustomerCart(cartItems,branches)'))throw new Error('V38_CUSTOMER_OUTPUT_CHECK');
    document.open();document.write(html);document.close();
  }catch(e){console.error('[V38 customer bootstrap]',e);const root=document.getElementById('v37boot');if(root)root.innerHTML='<div class="v37box"><div class="v37err"><b>تعذر فتح بوابة العملاء بأمان.</b><br>حدّث الصفحة وحاول مرة أخرى.<br><small>'+String(e&&e.message||e)+'</small></div></div>'}
})();
</script></body></html>
