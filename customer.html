const fieldLabel=k=>FIELD_LABELS[k]||String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ');
const VALUE_LABELS={active:'نشط',blocked:'محظور',deleted:'محذوف',suspended:'موقوف',submitted:'تم الإرسال',approved:'مقبول',rejected:'مرفوض',pending:'معلّق',login_success:'دخول ناجح',session_restore:'استعادة جلسة',account_created:'إنشاء حساب',registration_face_presence:'تحقق إنشاء الحساب',employee_face_presence:'تحقق دخول الموظف',true:'نعم',false:'لا'};
const valueText=(v,k='')=>{if(v==null||v==='')return'—';if(v?.toMillis||v?.toDate)return dateTime(v);if(typeof v==='boolean')return v?'نعم':'لا';if(typeof v==='number'){if(/amount|price|estimated|totalAmount/i.test(k))return `${num(v)} ⃁`;return num(v)};const text=String(v);return VALUE_LABELS[text]||text};
const TECHNICAL_FIELDS=new Set(['id','customerUid','employeeId','sessionId','cleanId','userAgent','__collection','passwordHash','passwordSalt','hashIterations','authVersion']);
function FriendlyValue({name,value,depth=0}){
  if(name==='photoDataUrl')return <span>صورة تحقق محفوظة</span>;
  if(value==null||typeof value!=='object'||value?.toMillis||value?.toDate)return <span>{valueText(value,name)}</span>;
  if(Array.isArray(value)){
    if(!value.length)return <span className="text-muted">لا توجد بيانات</span>;
    return <div className="grid gap-2">{value.map((item,i)=><div key={i} className="bg-white border border-border rounded-xl p-3">{item&&typeof item==='object'?<div className="grid sm:grid-cols-2 gap-2">{Object.entries(item).filter(([k])=>k!=='photoDataUrl'&&!TECHNICAL_FIELDS.has(k)&&!/^(__|password|token|secret)/i.test(k)).map(([k,v])=><div key={k} className="min-w-0"><div className="text-[9px] text-muted font-bold">{fieldLabel(k)}</div><div className="text-[11px] mt-1 break-words"><FriendlyValue name={k} value={v} depth={depth+1}/></div></div>)}</div>:<div className="text-xs"><FriendlyValue name={name} value={item} depth={depth+1}/></div>}</div>)}</div>;
  }
  return <div className="grid sm:grid-cols-2 gap-2">{Object.entries(value).filter(([k])=>k!=='photoDataUrl'&&!TECHNICAL_FIELDS.has(k)&&!/^(__|password|token|secret)/i.test(k)).map(([k,v])=><div key={k} className="bg-white border border-border rounded-xl p-2.5 min-w-0"><div className="text-[9px] text-muted font-bold">{fieldLabel(k)}</div><div className="text-[11px] mt-1 break-words"><FriendlyValue name={k} value={v} depth={depth+1}/></div></div>)}</div>;
}

  const fields=Object.entries(safeRow).filter(([k])=>!k.startsWith('__')&&k!=='photoDataUrl'&&!TECHNICAL_FIELDS.has(k));

ondary press">معاينة بوابة العملاء</button></div></div></section>

function EmployeeAccountEditor({value,onClose,onSaved}){
  const existing=value?.account||null;
  const resetOnly=!!value?.resetOnly;
  const [canonicalName,setCanonicalName]=useState(existing?.canonicalName||value?.initialName||'');
  const [aliasesText,setAliasesText]=useState((existing?.aliases||[]).filter(x=>normalizeText(x)!==normalizeText(existing?.canonicalName||'')).join('\n'));
  const [password,setPassword]=useState('');
  const [status,setStatus]=useState(existing?.status||'active');
  const [busy,setBusy]=useState(false),[error,setError]=useState(''),[savedPin,setSavedPin]=useState('');
  const aliases=()=>[...new Set([canonicalName.trim(),...aliasesText.split(/[\n,،]+/).map(x=>x.trim()).filter(Boolean)])];
  const save=async()=>{
    const name=canonicalName.trim();if(name.length<2)return setError('اكتب الاسم الأساسي للموظف.');
    const cleanPin=toEnglishDigits(password).replace(/\D/g,'');
    if(!existing&&cleanPin&&!/^(?:\d{4}|\d{6})$/.test(cleanPin))return setError('رمز الدخول يجب أن يكون 4 أو 6 أرقام.');
    if(password&&!/^(?:\d{4}|\d{6})$/.test(cleanPin))return setError('رمز الدخول يجب أن يكون 4 أو 6 أرقام.');
    setBusy(true);setError('');
    try{
      const accountRef=existing?db.collection('employee_accounts').doc(existing.id):db.collection('employee_accounts').doc();
      const employeeId=accountRef.id;
      const displayAliases=aliases();
      const aliasKeys=[...new Set(displayAliases.flatMap(employeeAliasVariants))];
      if(!aliasKeys.length)throw new Error('NO_ALIAS');
      for(const key of aliasKeys){const d=await db.collection('employee_aliases').doc(employeeAliasDocId(key)).get();if(d.exists&&d.data()?.employeeId!==employeeId)throw Object.assign(new Error('ALIAS_EXISTS'),{alias:key})}
      const payload={canonicalName:name,aliases:displayAliases,aliasKeys,status,passwordPending:password?false:(!existing?true:(existing?.passwordHash?false:true)),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'};
      if(!existing){payload.createdAt=firebase.firestore.FieldValue.serverTimestamp();payload.createdBy='مهند';payload.loginCount=0}
      if(password){const salt=newSalt();payload.passwordSalt=salt;payload.passwordIterations=120000;payload.passwordHash=await deriveEmployeePasswordHash(cleanPin,salt,120000);payload.passwordUpdatedAt=firebase.firestore.FieldValue.serverTimestamp()}
      const batch=db.batch();
      const oldKeys=existing?.aliasKeys||[];oldKeys.filter(k=>!aliasKeys.includes(k)).forEach(k=>batch.delete(db.collection('employee_aliases').doc(employeeAliasDocId(k))));
      aliasKeys.forEach(key=>batch.set(db.collection('employee_aliases').doc(employeeAliasDocId(key)),{employeeId,canonicalName:name,alias:key,status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}));
      batch.set(accountRef,payload,{merge:true});
      batch.set(db.collection('users').doc(toSafeDocId(name)),{employeeId,name,accountEnabled:true,accountStatus:status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      await batch.commit();
      await adminAudit(existing?'employee_account_updated':'employee_account_created',{employeeId,canonicalName:name,aliases:displayAliases,status,passwordChanged:!!password});
      if(password){setSavedPin(cleanPin);setPassword('');}else onSaved();
    }catch(e){console.error(e);setError(e?.message==='ALIAS_EXISTS'?`الاسم البديل «${e.alias}» مستخدم في حساب موظف آخر.`:'تعذر حفظ الحساب. تحقق من صلاحيات Firestore وحاول مرة أخرى.')}finally{setBusy(false)}
  };
  return <div className="fixed inset-0 z-[140] bg-black/45 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}><div className="w-full sm:max-w-[520px] bg-white rounded-t-[24px] sm:rounded-[24px] shadow-lift overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 border-b border-border flex items-center justify-between"><div><div className="text-[10px] text-accent font-bold">حساب موظف</div><b className="text-base">{resetOnly?'إعادة تعيين رمز الدخول':existing?'تعديل الحساب':'إنشاء حساب موظف'}</b></div><button onClick={onClose} className="w-9 h-9 rounded-lg border border-border flex items-center justify-center"><Icon name="x" className="w-4 h-4"/></button></div><div className="p-4 grid gap-4 max-h-[72vh] overflow-y-auto"><label className="text-xs font-bold">الاسم الأساسي<input value={canonicalName} onChange={e=>setCanonicalName(e.target.value)} placeholder="اكتب الاسم الأساسي" className="mt-2 w-full h-12 rounded-xl border border-border px-3 outline-none focus:border-accent"/></label><label className="text-xs font-bold">الأسماء البديلة<textarea value={aliasesText} onChange={e=>setAliasesText(e.target.value)} rows="4" placeholder={'اكتب كل اسم بديل في سطر مستقل'} className="mt-2 w-full rounded-xl border border-border p-3 outline-none focus:border-accent resize-none"/><span className="text-[10px] text-muted font-normal leading-5 block mt-1">كل سطر اسم بديل. النظام يقبل تلقائيًا اختلاف المسافات في الاسم، وجميع الأسماء البديلة تدخل لنفس الحساب الأساسي.</span></label><label className="text-xs font-bold">{existing?'رمز دخول جديد (اختياري)':'رمز الدخول (اختياري)'}<input value={password} onChange={e=>setPassword(toEnglishDigits(e.target.value).replace(/\D/g,'').slice(0,6))} type="password" inputMode="numeric" pattern="[0-9]*" maxLength="6" autoComplete="new-password" placeholder={existing?'اتركه فارغًا إذا لم ترد تغييره':'اتركه فارغًا ليختاره الموظف'} className="mt-2 w-full h-12 rounded-xl border border-border px-3 outline-none focus:border-accent text-center tracking-[.35em]"/><span className="text-[10px] text-muted font-normal block mt-1">يمكنك تركه فارغًا عند إنشاء الموظف؛ أول ما يدخل سيطلب منه النظام إنشاء رمز من 4 أو 6 أرقام. وإذا نسيه لاحقًا يمكنك إعادة تعيينه من هنا.</span><button type="button" onClick={()=>setPassword(String(Math.floor(100000+Math.random()*900000)))} className="mt-2 h-9 px-3 rounded-lg border border-border bg-surface text-[10px] font-bold">توليد رمز 6 أرقام</button></label><label className="text-xs font-bold">حالة الحساب<select value={status} onChange={e=>setStatus(e.target.value)} className="mt-2 w-full h-12 rounded-xl border border-border px-3 outline-none focus:border-accent bg-white"><option value="active">نشط</option><option value="suspended">موقوف</option></select></label>{savedPin&&<div className="bg-successSoft border border-success/15 text-success rounded-xl p-4"><div className="text-[10px] font-bold">تم حفظ رمز الدخول الجديد</div><div className="text-2xl font-bold tracking-[.3em] ltr mt-2">{savedPin}</div><div className="text-[10px] text-secondary mt-2">انسخه أو أعطه للموظف الآن. بعد إغلاق النافذة لن يمكن عرض هذا الرمز مرة أخرى.</div><button type="button" onClick={()=>navigator.clipboard?.writeText(savedPin)} className="mt-3 h-9 px-3 rounded-lg bg-success text-white text-[10px] font-bold">نسخ الرمز</button></div>}{error&&<div className="bg-dangerSoft text-danger rounded-xl p-3 text-xs font-bold">{error}</div>}</div><div className="p-4 border-t border-border bg-surface grid grid-cols-2 gap-2"><button onClick={onClose} className="h-11 rounded-xl border border-border bg-white text-xs font-bold">إلغاء</button>{savedPin?<button onClick={onSaved} className="h-11 rounded-xl bg-primary text-white text-xs font-bold">تم</button>:<button disabled={busy} onClick={save} className="h-11 rounded-xl bg-primary text-white text-xs font-bold disabled:opacity-50">{busy?'جاري الحفظ...':'حفظ الحساب'}</button>}</div></div></div>
 }

function EmployeeMergeModal({source,accounts,onClose,onSaved}){
  const [targetId,setTargetId]=useState(accounts?.[0]?.id||'');
  const [busy,setBusy]=useState(false),[error,setError]=useState('');
  const target=(accounts||[]).find(a=>a.id===targetId);
  const sourceNames=[...new Set((source?.userRecords||[source?.user]).map(x=>String(x?.name||x?.id||'').trim()).filter(Boolean))];
  const merge=async()=>{
    if(!target)return setError('اختر المستخدم الذي تريد إضافة هذه الأسماء إليه.');
    setBusy(true);setError('');
    try{
      const displayAliases=[...new Set([target.canonicalName,...(target.aliases||[]),...sourceNames].filter(Boolean))];
      const aliasKeys=[...new Set(displayAliases.flatMap(employeeAliasVariants))];
      for(const key of aliasKeys){const d=await db.collection('employee_aliases').doc(employeeAliasDocId(key)).get();if(d.exists&&d.data()?.employeeId!==target.id)throw Object.assign(new Error('ALIAS_EXISTS'),{alias:key})}
      const now=firebase.firestore.FieldValue.serverTimestamp(),batch=db.batch();
      batch.set(db.collection('employee_accounts').doc(target.id),{aliases:displayAliases,aliasKeys,updatedAt:now,updatedBy:'مهند'},{merge:true});
      aliasKeys.forEach(key=>batch.set(db.collection('employee_aliases').doc(employeeAliasDocId(key)),{employeeId:target.id,canonicalName:target.canonicalName,alias:key,status:target.status||'active',updatedAt:now},{merge:true}));
      (source?.userRecords||[source?.user]).filter(Boolean).forEach(u=>batch.set(db.collection('users').doc(u.id),{employeeId:target.id,canonicalName:target.canonicalName,accountEnabled:true,accountStatus:target.status||'active',mergedInto:target.id,updatedAt:now},{merge:true}));
      await batch.commit();

function AdminApp(){

  const [detail,setDetail]=useState(null);
  const [employeeEditor,setEmployeeEditor]=useState(null);
  const [employeeMerge,setEmployeeMerge]=useState(null);
  const [customerManager,setCustomerManager]=useState(null);
  const [control,setControl]=useState(DEFAULT_PORTAL_CONTROL);
  const [data,setData]=useState({customers:[],customerDevices:[],customerSessions:[],customerLogins:[],customerActivity:[],customerOrders:[],customerDrafts:[],customerSecurityPhotos:[],employeeUsers:[],employeeAccounts:[],employeeAliases:[],employeeSecurityPhotos:[],employeeLoginAttempts:[],employeeSessions:[],employeeLogins:[],access:[],search:[],employeeOrders:[],employeeDrafts:[],categoryAudit:[],adminAudit:[]});

  useEffect(()=>{
    let stopped=false;const unsubs=[];const waiting=new Set(Object.keys(COLLECTIONS));
    const markReady=key=>{waiting.delete(key);if(!waiting.size&&!stopped)setSyncing(false)};
    const apply=(key,name,snap)=>{if(stopped)return;const rows=snap.docs.map(d=>({id:d.id,...d.data(),__collection:name}));setData(prev=>({...prev,[key]:rows}));markReady(key)};
    const attach=(key,name)=>{
      const limit=REALTIME_LIMIT[key]||900;let unsubscribe=null,usingFallback=false;
      const fallback=()=>{if(stopped||usingFallback)return;usingFallback=true;try{unsubscribe?.()}catch{};unsubscribe=db.collection(name).limit(limit).onSnapshot(s=>apply(key,name,s),e=>{console.warn('[Dashboard realtime fallback]',name,e);markReady(key)})};
      try{
        const field=REALTIME_ORDER[key];const q=field?db.collection(name).orderBy(field,'desc').limit(limit):db.collection(name).limit(limit);
        unsubscribe=q.onSnapshot(s=>apply(key,name,s),e=>{console.warn('[Dashboard realtime]',name,e);field?fallback():markReady(key)});
      }catch(e){fallback()}
      return()=>{try{unsubscribe?.()}catch{}}
    };
    Object.entries(COLLECTIONS).forEach(([key,name])=>unsubs.push(attach(key,name)));
    const settle=setTimeout(()=>{if(!stopped)setSyncing(false)},2200);
    adminAudit('admin_dashboard_open');
    return()=>{stopped=true;clearTimeout(settle);unsubs.forEach(fn=>fn())}
  },[]);
  useEffect(()=>db.collection(CONTROL_COLLECTION).doc(CONTROL_DOC).onSnapshot(doc=>setControl({...DEFAULT_PORTAL_CONTROL,...(doc.exists?doc.data():{})}),e=>console.warn('[Portal control]',e)),[]);

  const saveControl=async patch=>{setBusy(true);try{await db.collection(CONTROL_COLLECTION).doc(CONTROL_DOC).set({...patch,updatedBy:'مهند',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await adminAudit('customer_portal_control_changed',patch)}catch(e){alert('تعذر حفظ الإعداد. تحقق من الاتصال وصلاحيات Firestore.')}finally{setBusy(false)}};
  const updateEmployeeAccountStatus=async(account,status)=>{if(!account?.id)return;if(!confirm(status==='suspended'?'إيقاف حساب الموظف مؤقتًا؟':'إعادة تفعيل حساب الموظف؟'))return;setBusy(true);try{const now=firebase.firestore.FieldValue.serverTimestamp(),batch=db.batch();batch.set(db.collection('employee_accounts').doc(account.id),{status,updatedAt:now,updatedBy:'مهند'},{merge:true});(account.aliasKeys||[]).forEach(key=>batch.set(db.collection('employee_aliases').doc(employeeAliasDocId(key)),{status,updatedAt:now},{merge:true}));await batch.commit();await adminAudit('employee_account_status_changed',{employeeId:account.id,canonicalName:account.canonicalName||'',status})}catch(e){console.error(e);alert('تعذر تحديث حالة الموظف.')}finally{setBusy(false)}};
  const updateCustomerStatus=async(c,status)=>{if(!confirm(status==='suspended'?`إيقاف حساب ${c.company||c.name||c.phone}؟`:'إعادة تفعيل الحساب؟'))return;setBusy(true);try{await db.collection('customers').doc(c.id).update({status,statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),statusUpdatedBy:'مهند'});await adminAudit('customer_status_changed',{customerId:c.id,status,company:c.company||'',phone:c.phone||''});setData(d=>({...d,customers:d.customers.map(x=>x.id===c.id?{...x,status}:x)}))}catch(e){alert('تعذر تحديث الحساب.')}finally{setBusy(false)}};

  const restoreCustomerAccount=async c=>{if(!confirm('استعادة الحساب والسماح له بالعودة؟'))return;setBusy(true);try{await db.collection('customers').doc(c.id).set({status:'active',deletedAt:firebase.firestore.FieldValue.delete(),deletedBy:firebase.firestore.FieldValue.delete(),statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),statusUpdatedBy:'مهند'},{merge:true});await adminAudit('customer_account_restored',{customerId:c.id});setData(d=>({...d,customers:d.customers.map(x=>x.id===c.id?{...x,status:'active'}:x)}));setCustomerManager(m=>m&&m.id===c.id?{...m,status:'active'}:m)}catch(e){console.error(e);alert('تعذر استعادة الحساب.')}finally{setBusy(false)}};
  const setCustomerDeviceStatus=async(device,status)=>{const label=status==='blocked'?'حظر هذا الجهاز؟ سيتم تسجيل خروج العميل منه فورًا ولن يستطيع العودة من نفس الجهاز.':'فك حظر هذا الجهاز؟';if(!confirm(label))return;setBusy(true);try{const patch={status,blocked:status==='blocked',updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'مهند'};if(status==='blocked'){patch.blockedAt=firebase.firestore.FieldValue.serverTimestamp();patch.blockedBy='مهند'}else{patch.blockedAt=firebase.firestore.FieldValue.delete();patch.blockedBy=firebase.firestore.FieldValue.delete()}await db.collection('customer_devices').doc(device.id).set(patch,{merge:true});await adminAudit('customer_device_status_changed',{customerId:device.customerUid,deviceId:device.id,status});}catch(e){console.error(e);alert('تعذر تحديث حالة الجهاز.')}finally{setBusy(false)}};

  function EmployeeAccounts(){
    const aliasToAccount=new Map();
    eAccounts.forEach(a=>[a.canonicalName,...(a.aliases||[])].flatMap(employeeAliasVariants).forEach(k=>aliasToAccount.set(k,a)));
    eAliases.forEach(x=>{const a=eAccounts.find(a=>a.id===x.employeeId);if(a&&x.alias)employeeAliasVariants(x.alias).forEach(k=>aliasToAccount.set(k,a))});
    const groups=new Map();
    eUsers.forEach(u=>{const name=String(u.name||u.id||'').trim();const keys=employeeAliasVariants(name);const compact=keys.find(k=>!k.includes(' '))||keys[0]||normalizeText(name);if(!compact)return;if(!groups.has(compact))groups.set(compact,{userRecords:[],names:[]});const g=groups.get(compact);g.userRecords.push(u);g.names.push(name)});
    const rows=[];const represented=new Set();
    groups.forEach(g=>{const keys=[...new Set(g.names.flatMap(employeeAliasVariants))];const account=keys.map(k=>aliasToAccount.get(k)).find(Boolean)||null;if(account)represented.add(account.id);const preferred=account?.canonicalName||[...g.names].sort((a,b)=>(b.includes(' ')-a.includes(' '))||(b.length-a.length))[0]||'—';rows.push({name:preferred,user:g.userRecords[0],userRecords:g.userRecords,legacyNames:[...new Set(g.names)],account})});
    eAccounts.forEach(a=>{if(!represented.has(a.id))rows.push({name:a.canonicalName,account:a,user:null,userRecords:[],legacyNames:[]})});
    const filtered=rows.filter(r=>!search||normalizeText(JSON.stringify({name:r.name,legacyNames:r.legacyNames,aliases:r.account?.aliases,status:r.account?.status})).includes(normalizeText(search)));
    return <div><div className="flex items-center justify-between gap-3 mb-3"><div><b className="text-[14px]">حسابات الموظفين</b><div className="text-[10px] text-muted mt-1">أنشئ اسم الموظف فقط واترك الرمز فارغًا؛ أول دخول سيطلب منه إنشاء رمز 4 أو 6 أرقام. ويمكنك هنا دمج الأسماء وإيقاف الحساب أو إعادة تعيين الرمز.</div></div><button onClick={()=>setEmployeeEditor({initialName:''})} className="h-10 px-4 rounded-xl bg-primary text-white text-[11px] font-bold flex items-center gap-2"><Icon name="plus" className="w-4 h-4"/>إنشاء موظف</button></div><div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{filtered.length?filtered.map((r,idx)=>{const a=r.account;const active=a&&a.status!=='suspended';return <div key={a?.id||`${r.name}_${idx}`} className="bg-white border border-border rounded-xl p-4 shadow-card"><div className="flex justify-between gap-2"><div className="min-w-0"><b className="text-[14px] block truncate">{r.name||'—'}</b><div className="text-[10px] text-muted mt-1">{a?`${a.aliases?.length||1} اسم للدخول`:`غير مفعّل · ${r.legacyNames?.length||1} سجل قديم`}</div></div><Pill tone={!a||!a?.passwordHash?'info':active?'ok':'bad'}>{!a?'غير مربوط بحساب':!a.passwordHash?'بانتظار إنشاء رمز':active?'نشط':'موقوف'}</Pill></div>{a?<div className="flex flex-wrap gap-1.5 mt-3">{(a.aliases||[]).slice(0,6).map(x=><span key={x} className="px-2 py-1 rounded-full bg-surface border border-border text-[9px] text-secondary">{x}</span>)}{(a.aliases?.length||0)>6&&<span className="px-2 py-1 text-[9px] text-muted">+{a.aliases.length-6}</span>}</div>:<div className="flex flex-wrap gap-1.5 mt-3">{(r.legacyNames||[]).map(x=><span key={x} className="px-2 py-1 rounded-full bg-infoSoft text-info border border-info/10 text-[9px]">{x}</span>)}</div>}<div className={`grid ${a?'grid-cols-2':'grid-cols-2'} gap-2 mt-4`}>{a?<><button onClick={()=>setEmployeeEditor({account:a,initialName:r.name})} className="h-9 rounded-lg border border-border bg-white text-[10px] font-bold">تعديل الحساب</button><button onClick={()=>setEmployeeEditor({account:a,initialName:r.name,resetOnly:true})} className="h-9 rounded-lg bg-primary text-white text-[10px] font-bold">إعادة تعيين الرمز</button><button disabled={busy} onClick={()=>updateEmployeeAccountStatus(a,active?'suspended':'active')} className={`h-9 rounded-lg text-[10px] font-bold ${active?'bg-dangerSoft text-danger':'bg-successSoft text-success'}`}>{active?'إيقاف الحساب':'إعادة التفعيل'}</button><button onClick={()=>setDetail(redactSensitive({...a,__collection:'employee_accounts'}))} className="h-9 rounded-lg border border-border text-[10px] font-bold">التفاصيل</button></>:<><button onClick={()=>setEmployeeEditor({initialName:r.name})} className="h-9 rounded-lg bg-primary text-white text-[10px] font-bold">تفعيل من الإدارة</button><button onClick={()=>setEmployeeMerge(r)} disabled={!eAccounts.length} className="h-9 rounded-lg bg-accentSoft text-accent border border-accent/10 text-[10px] font-bold disabled:opacity-40">إضافة إلى مستخدم</button><button onClick={()=>setDetail({...r.user,__collection:'users',relatedNames:r.legacyNames})} className="col-span-2 h-9 rounded-lg border border-border text-[10px] font-bold">سجل الموظف</button></>}</div></div>}):<Empty/>}</div></div>
  }

  const deleteSecurityPhoto=async(collection,row)=>{if(!confirm('حذف لقطة التحقق الأمنية؟'))return;setBusy(true);try{await db.collection(collection).doc(row.id).delete();await adminAudit('security_photo_deleted',{collection,id:row.id,name:row.canonicalName||row.name||row.company||''});setData(d=>collection==='employee_security_photos'?{...d,employeeSecurityPhotos:d.employeeSecurityPhotos.filter(x=>x.id!==row.id)}:{...d,customerSecurityPhotos:d.customerSecurityPhotos.filter(x=>x.id!==row.id)})}catch(e){alert('تعذر حذف الصورة.')}finally{setBusy(false)}};
  function SecurityPhotoGrid({rows,kind}){const collection=kind==='employee'?'employee_security_photos':'customer_security_photos';const filtered=sortRows(rows.filter(match),r=>r.timestamp||r.createdAt);return <div className="grid md:grid-cols-2 gap-3">{filtered.length?filtered.map(r=>{const c=kind==='customer'?customers.find(x=>x.id===r.customerUid):null;const title=kind==='employee'?(r.canonicalName||r.name||'موظف'):(c?.name||r.name||'عميل');const sub=kind==='employee'?`دخل باسم: ${r.enteredAlias||title}`:`${c?.company||r.company||'—'} · ${c?.phone||r.phone||'—'}`;return <div key={r.id} className="bg-white border border-border rounded-xl p-3 shadow-card flex gap-3"><button onClick={()=>setDetail(r)} className="w-[96px] h-[96px] rounded-xl overflow-hidden bg-surface shrink-0">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full h-full object-cover"/>:<div className="w-full h-full flex items-center justify-center text-muted"><Icon name="camera" className="w-5 h-5"/></div>}</button><div className="min-w-0 flex-1"><div className="flex justify-between gap-2"><b className="text-[13px] truncate">{title}</b><Pill tone="ok">متحقق</Pill></div><div className="text-[10px] text-secondary mt-1 truncate">{sub}</div><div className="text-[9px] text-muted mt-1">{dateTime(r.timestamp||r.createdAt)}</div><div className="flex gap-2 mt-3"><button onClick={()=>setDetail(r)} className="h-8 px-3 rounded-lg border border-border text-[10px] font-bold">التفاصيل</button><button disabled={busy} onClick={()=>deleteSecurityPhoto(collection,r)} className="w-8 h-8 rounded-lg bg-dangerSoft text-danger flex items-center justify-center"><Icon name="x" className="w-3.5 h-3.5"/></button></div></div></div>}):<Empty text="لا توجد صور تحقق محفوظة بعد."/>}</div>}

  function EmployeePending(){const rows=sortRows(pendingAccess.filter(match),r=>r.timestamp);return <div className="grid gap-3">{rows.length?rows.map(r=><div key={r.id} className="bg-white border border-accent/30 rounded-xl p-4 shadow-card relative overflow-hidden"><div className="absolute top-0 right-0 left-0 h-1 bg-accent"></div><div className="flex justify-between gap-3 mb-3"><div><b className="text-[14px]">{r.name||'—'}</b><div className="text-[10px] text-muted mt-1">{dateTime(r.timestamp)}</div></div><Pill tone="info">بانتظار القرار</Pill></div><div className="rounded-xl overflow-hidden bg-black border border-border relative max-w-[460px] mx-auto">{r.photoDataUrl?<img src={r.photoDataUrl} className="w-full aspect-square object-cover"/>:<div className="aspect-square flex items-center justify-center text-white/60"><Icon name="camera" className="w-7 h-7"/></div>}{r.latitude&&r.longitude&&<a href={`https://www.google.com/maps?q=${r.latitude},${r.longitude}`} target="_blank" className="absolute bottom-2 left-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded-lg">عرض الموقع</a>}</div><div className="grid grid-cols-2 gap-2 mt-3"><button disabled={busy} onClick={()=>accessDecision(r,'approved')} className="h-10 rounded-lg bg-success text-white text-[12px] font-bold">اعتماد الدخول</button><button disabled={busy} onClick={()=>accessDecision(r,'rejected')} className="h-10 rounded-lg bg-dangerSoft text-danger text-[12px] font-bold">رفض الدخول</button></div><button onClick={()=>setDetail(r)} className="w-full h-9 mt-2 rounded-lg border border-border text-[11px] font-bold">كل التفاصيل</button></div>):<StateBlock title="لا توجد طلبات دخول معلقة" note="لا يوجد شيء يحتاج قرارك حاليًا."/>}</div>}

      <div className="grid sm:grid-cols-2 gap-3 mt-4"><label className="border border-dashed border-border rounded-xl p-4 bg-surface cursor-pointer hover:border-accent/40"><div className="text-xs font-bold">ملف الصور ZIP</div><div className="text-[10px] text-muted mt-1">PNG / JPG / WEBP — ويمكن أن يحتوي ملف التوزيع داخله.</div><input type="file" accept=".zip,application/zip" className="hidden" onChange={e=>setZipFile(e.target.files?.[0]||null)}/>{zipFile&&<div className="mt-3 text-[10px] font-bold text-accent truncate">{zipFile.name}</div>}</label><label className="border border-dashed border-border rounded-xl p-4 bg-surface cursor-pointer hover:border-accent/40"><div className="text-xs font-bold">ملف التوزيع</div><div className="text-[10px] text-muted mt-1">TXT / TSV / CSV — رقم الصنف ثم اسم الصورة.</div><input type="file" accept=".txt,.tsv,.csv,text/plain,text/csv" className="hidden" onChange={e=>setMapFile(e.target.files?.[0]||null)}/>{mapFile&&<div className="mt-3 text-[10px] font-bold text-accent truncate">{mapFile.name}</div>}</label></div>
      {preview&&<div className="grid grid-cols-3 gap-2 mt-4"><Stat label="الصور" value={preview.files.length}/><Stat label="مرتبطة" value={preview.mapped} tone="success"/><Stat label="تحتاج ربط" value={preview.unmapped} tone={preview.unmapped?'danger':'success'}/></div>}
      <label className="block mt-4 text-xs font-bold">رمز إدارة الصور<input value={secret} onChange={e=>setSecret(e.target.value)} type="password" className="mt-2 w-full h-11 rounded-xl border border-border px-3 outline-none focus:border-accent" placeholder="رمز إدارة الصور"/></label>
      {progress&&<div className="mt-4 bg-infoSoft text-info rounded-xl p-3 text-[11px] font-bold">{progress}</div>}{result&&<div className={`mt-4 rounded-xl p-3 text-[11px] font-bold ${result.type==='success'?'bg-successSoft text-success':'bg-dangerSoft text-danger'}`}>{result.message}</div>}
      <button disabled={busyUpload||(!zipFile&&!mapFile)} onClick={run} className="mt-4 h-11 px-5 rounded-xl bg-primary text-white text-xs font-bold disabled:opacity-40">{busyUpload?'جاري التنفيذ...':'رفع واعتماد الصور'}</button></section>
      <section className="bg-white border border-border rounded-2xl p-4 shadow-card"><b className="text-sm">ربط الصور بالأصناف</b><p className="text-[10px] text-secondary mt-2 leading-5">إذا كان اسم الصورة يحتوي رقم الصنف يتم الربط تلقائيًا. ويمكن رفع ملف توزيع من عمودين: رقم الصنف ثم اسم الصورة. الصور الحالية لا تُحذف؛ يتم فقط إضافة الربط الجديد أو استبدال ربط الصنف المحدد.</p></section>
    </div>;
  }

  function RawCollections({side}){const defs=side==='customers'?[['customers',customers],['customer_devices',cDevices],['customer_security_photos',cSecurityPhotos],['customer_sessions',cSessions],['customer_login_logs',cLogins],['customer_activity_logs',cActivity],['customer_orders',cOrdersAll],['customer_drafts',cDrafts],['security_admin_logs',adminLogs]]:[['users',eUsers],['employee_accounts',eAccounts.map(redactSensitive)],['employee_aliases',eAliases],['employee_security_photos',eSecurityPhotos],['employee_login_attempts',eLoginAttempts],['site_sessions',eSessions],['login_logs',eLogins],['access_requests',access],['search_logs',searches],['orders',eOrdersAll],['drafts',eDrafts],['category_audit_logs',categoryAudit],['security_admin_logs',adminLogs]];return <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">{defs.map(([name,rows])=><button key={name} onClick={()=>setDetail({collection:name,count:rows.length,latest:rows.slice(0,50),__collection:'collection_summary'})} className="bg-white border border-border rounded-xl p-4 shadow-card text-right"><div className="flex justify-between gap-2"><div className="w-9 h-9 rounded-lg bg-surface text-secondary flex items-center justify-center"><Icon name="database" className="w-4 h-4"/></div><Pill>{rows.length} سجل</Pill></div><div className="text-[10px] text-muted ltr text-right mt-4">{name}</div><b className="text-[13px] block mt-1">فتح البيانات</b></button>)}</div>}

  function ActiveContent(){if(area==='employees'){switch(module){case'live':return <EmployeeLive/>;case'overview':return <EmployeeOverview/>;case'accounts':return <EmployeeAccounts/>;case'images':return <ImageLibraryManager/>;case'security_photos':return <EmployeeSecurityPhotos/>;case'staff':return <EmployeeStaff/>;case'sessions':return <EmployeeSessions/>;case'orders':return <EmployeeOrders/>;case'drafts':return <EmployeeDrafts/>;case'searches':return <EmployeeSearches/>;case'categories':return <EmployeeCategories/>;case'raw':return <RawCollections side="employees"/>;default:return <EmployeeOverview/>}}switch(module){case'live':return <CustomerLive/>;case'overview':return <CustomerOverview/>;case'companies':return <CustomerCompanies/>;case'accounts':return <CustomerAccounts/>;case'images':return <ImageLibraryManager/>;case'security_photos':return <CustomerSecurityPhotos/>;case'activity':return <CustomerActivity/>;case'orders':return <CustomerOrders/>;case'drafts':return <CustomerDrafts/>;case'sessions':return <CustomerSessions/>;case'portal':return <CustomerPortal/>;case'raw':return <RawCollections side="customers"/>;default:return <CustomerOverview/>}}

  if(false&&loading)return <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-0 sm:p-4"><div className="w-full max-w-[1080px] h-[100dvh] sm:h-[94vh] bg-white sm:rounded-2xl overflow-hidden shadow-lift flex flex-col"><CommandHeader/><div className="flex-1 p-4 bg-surface"><div className="h-12 rounded-xl skeleton"></div><div className="grid grid-cols-2 gap-3 mt-3"><div className="h-28 rounded-xl skeleton"></div><div className="h-28 rounded-xl skeleton"></div></div><div className="h-72 rounded-xl skeleton mt-3"></div></div></div></div>;

  return <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-0 sm:p-4 safe-top safe-bottom">
    <div className="w-full max-w-[1080px] h-[100dvh] sm:h-[94vh] bg-white sm:rounded-2xl overflow-hidden shadow-lift flex flex-col fade">
      <CommandHeader/>
      <><TabsBar/><ToolBar/><div className="flex-1 overflow-y-auto p-3 sm:p-4 bg-surface"><ActiveContent/></div></>
    </div>
    <DetailDrawer row={detail} onClose={()=>setDetail(null)}/>
    {employeeEditor&&<EmployeeAccountEditor value={employeeEditor} onClose={()=>setEmployeeEditor(null)} onSaved={()=>setEmployeeEditor(null)}/>}
    {employeeMerge&&<EmployeeMergeModal source={employeeMerge} accounts={eAccounts} onClose={()=>setEmployeeMerge(null)} onSaved={()=>setEmployeeMerge(null)}/>}
    {customerManager&&<CustomerManagerModal customer={customers.find(c=>c.id===customerManager.id)||customerManager} devices={cDevices.filter(d=>d.customerUid===customerManager.id)} busy={busy} onClose={()=>setCustomerManager(null)} onSave={saveCustomerProfile} onStatus={updateCustomerStatus} onDelete={deleteCustomerAccount} onRestore={restoreCustomerAccount} onDeviceStatus={setCustomerDeviceStatus} onDeviceDelete={deleteCustomerDevice}/>} 
  </div>;
}

function DashboardRoot(){const [ok,setOk]=useState(isAdminSession());return ok?<AdminApp/>:<AdminGate onPass={()=>setOk(true)}/>}
ReactDOM.createRoot(document.getElementById('root')).render(<DashboardRoot/>);
setTimeout(()=>document.getElementById('app-loader')?.classList.add('is-hidden'),320);
</script>
</body>
</html>
