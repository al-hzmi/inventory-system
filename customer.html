const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
const toEnglishDigits = s => String(s??'').replace(/[٠-٩۰-۹]/g,d=>{const a=AR.indexOf(d);return a>-1?String(a):String(FA.indexOf(d))});
const normalizeCleanId = s => toEnglishDigits(s).replace(/\D/g,'');
const normalizeText = s => toEnglishDigits(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/\u0640/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
const roundHalf = n => Math.round((Number(n)||0)*2)/2;
const floorHalf = n => Math.max(0,Math.floor((Number(n)||0)*2+1e-7)/2);

function normalizePhone(raw){
  let d=toEnglishDigits(raw).replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(/^05\d{8}$/.test(d)) d='966'+d.slice(1);
  else if(/^5\d{8}$/.test(d)) d='966'+d;
  return d;
}
function displayPhone(p){
  const d=normalizePhone(p);
  if(/^9665\d{8}$/.test(d)) return '0'+d.slice(3);
  return d;
}
function authEmailFromPhone(phone){ return `customer_${normalizePhone(phone)}@portal.batco.local`; }
function validPhone(phone){ const d=normalizePhone(phone); return /^\d{8,15}$/.test(d); }
function validPin(pin){ return /^\d{6}$/.test(toEnglishDigits(pin)); }

async function fetchText(url,{fresh=false}={}){
  const key='customer_cache_'+url;
  try{
    const target=fresh?`${url}${url.includes('?')?'&':'?'}v=${Date.now()}`:url;
    const res=await fetch(target,{cache:fresh?'no-store':'default'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(!fresh) localStorage.setItem(key,text);
    return text;
  }catch(err){
    const cached=localStorage.getItem(key);
    if(cached&&!fresh) return cached;
    throw err;
  }
}

function parseInventory(raw){
  if(!raw) return [];
  const lines=raw.trim().split(/\r?\n/); if(lines.length<2) return [];
  const headers=lines[0].split('\t').map(x=>x.trim());
  const idIdx=headers.findIndex(h=>/رقم|كود|sku|item/i.test(h));
  const nameIdx=headers.findIndex(h=>/اسم|وصف|description|name/i.test(h));
  const qtyIdx=headers.findIndex(h=>/كمية|رصيد|متوفر|qty|quantity/i.test(h));
  const unitIdx=headers.findIndex(h=>/وحدة|unit|uom/i.test(h));
  const packIdx=headers.findIndex(h=>/شد|الشد/i.test(h));
  if(idIdx<0) return [];
  const map=new Map();
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split('\t').map(x=>x.trim());
    const id=c[idIdx]||''; const cleanId=normalizeCleanId(id); if(!cleanId) continue;
    const q=parseFloat(toEnglishDigits(qtyIdx>=0?(c[qtyIdx]||'0'):'0').replace(/,/g,''));
    map.set(cleanId,{cleanId,id,name:nameIdx>=0?(c[nameIdx]||''):'',qty:Number.isFinite(q)?q:0,unit:unitIdx>=0?(c[unitIdx]||''):'',pack:packIdx>=0?(c[packIdx]||''):''});
  }
  return [...map.values()];
}
function mergeInventories(a,b){
  const map=new Map();
  [...a,...b].forEach(item=>{
    const prev=map.get(item.cleanId);
    if(!prev) map.set(item.cleanId,{...item,mergedQty:Math.max(0,item.qty||0)});
    else map.set(item.cleanId,{...prev,id:prev.id||item.id,name:prev.name||item.name,unit:prev.unit||item.unit,pack:prev.pack||item.pack,mergedQty:Math.max(0,prev.mergedQty||0)+Math.max(0,item.qty||0)});
  });
  return [...map.values()].map(x=>({...x,allowedMax:floorHalf(x.mergedQty),searchName:normalizeText(x.name),searchId:toEnglishDigits(x.id).toLowerCase()}));
}
function buildImagesMap(text){
  const map=new Map();
  String(text||'').split(/\r?\n/).forEach(line=>{const f=line.trim();if(!f)return;const id=normalizeCleanId(f.replace(/\.[^.]+$/,''));if(id&&!map.has(id))map.set(id,f)});
  return map;
}
function parseCategories(text){
  const out={}; if(!text)return out;
  const rows=text.split(/\r?\n/).map(r=>r.split('\t').map(c=>c.trim())); if(!rows.length)return out;
  const headers=rows[0]; headers.forEach(h=>{if(h)out[h]=[]});
  for(let i=1;i<rows.length;i++) headers.forEach((h,j)=>{if(!h)return;const id=normalizeCleanId(rows[i]?.[j]);if(id)out[h].push(id)});
  return out;
}
function effectiveCategories(base,overrides,meta){
  const out={}; const archived=new Set();
  Object.values(meta||{}).forEach(m=>{if(m?.name&&m.archived)archived.add(m.name);else if(m?.name)out[m.name]=out[m.name]||[]});
  Object.entries(base||{}).forEach(([cat,ids])=>{
    if(!cat||archived.has(cat))return; out[cat]=out[cat]||[];
    ids.forEach(id=>{const o=overrides[id]; if(o&&Object.prototype.hasOwnProperty.call(o,'category')&&(o.category===CATEGORY_UNASSIGNED||o.category!==cat))return; out[cat].push(id)});
  });
  Object.values(overrides||{}).forEach(o=>{const id=normalizeCleanId(o?.cleanId||o?.id);const cat=o?.category;if(!id||!cat||cat===CATEGORY_UNASSIGNED||archived.has(cat))return;out[cat]=out[cat]||[];out[cat].push(id)});
  Object.keys(out).forEach(k=>out[k]=[...new Set(out[k])]); return out;
}
function categoryLookup(cats){const out={};Object.entries(cats||{}).forEach(([c,ids])=>ids.forEach(id=>out[id]=c));return out}

function Toast({toast,onClose}){
  useEffect(()=>{if(!toast)return;const t=setTimeout(onClose,3200);return()=>clearTimeout(t)},[toast,onClose]);

  const tone=toast.type==='error'?'bg-danger text-white':toast.type==='success'?'bg-success text-white':'bg-primary text-white';

}

function LivenessCheck({registration,onBack,onSuccess}){
  const videoRef=useRef(null), miniCanvas=useRef(null), streamRef=useRef(null), meshRef=useRef(null), loopTimerRef=useRef(null);
  const phaseRef=useRef('center');
  const centeredFrames=useRef(0), returnedFrames=useRef(0), baselineEye=useRef([]), blinkClosed=useRef(false), doneRef=useRef(false);
  const [phase,setPhase]=useState('loading');
  const [status,setStatus]=useState('جاري تجهيز وحدة التحقق...');
  const [quality,setQuality]=useState({face:false,light:false,distance:false,motion:false,blink:false});
  const [error,setError]=useState('');

  const stop=useCallback(()=>{
    if(loopTimerRef.current){clearTimeout(loopTimerRef.current);loopTimerRef.current=null;}
    try{streamRef.current?.getTracks?.().forEach(t=>t.stop())}catch{}
    streamRef.current=null;
    meshRef.current=null;
    if(videoRef.current) videoRef.current.srcObject=null;
  },[]);

  useEffect(()=>{
    let cancelled=false;
    let processing=false;

    const processResults=(results)=>{
      if(cancelled||doneRef.current)return;
      const faces=results.multiFaceLandmarks||[];
      let lightOk=true;
      try{
        const c=miniCanvas.current,ctx=c.getContext('2d',{willReadFrequently:true});
        c.width=48;c.height=36;ctx.drawImage(videoRef.current,0,0,48,36);
        const d=ctx.getImageData(0,0,48,36).data;let total=0;
        for(let i=0;i<d.length;i+=4)total+=(d[i]+d[i+1]+d[i+2])/3;
        const avg=total/(d.length/4);lightOk=avg>35&&avg<245;
      }catch{}

      if(faces.length!==1){
        centeredFrames.current=0;
        setQuality(q=>({...q,face:false,light:lightOk,distance:false}));
        setStatus(faces.length>1?'يجب أن يظهر شخص واحد فقط':'ضع وجهك داخل الإطار');
        return;
      }

      const lm=faces[0], left=lm[234], right=lm[454], top=lm[10], bottom=lm[152], nose=lm[1];
      const faceW=Math.abs(right.x-left.x), faceH=Math.abs(bottom.y-top.y);
      const sizeOk=faceW>.20&&faceW<.72&&faceH>.26&&faceH<.88;
      const eyeMid=(lm[33].x+lm[263].x)/2;
      const turn=Math.abs((nose.x-eyeMid)/Math.max(faceW,.001));
      const eyeL=Math.abs(lm[159].y-lm[145].y)/Math.max(Math.abs(lm[33].x-lm[133].x),.001);
      const eyeR=Math.abs(lm[386].y-lm[374].y)/Math.max(Math.abs(lm[362].x-lm[263].x),.001);
      const eye=(eyeL+eyeR)/2;

      setQuality(q=>({...q,face:true,light:lightOk,distance:sizeOk}));
      if(!lightOk){setStatus('حسّن الإضاءة حتى يظهر وجهك بوضوح');return;}
      if(!sizeOk){setStatus(faceW<=.20?'اقترب قليلًا من الكاميرا':'ابتعد قليلًا عن الكاميرا');return;}

      const centered=turn<.055;
      if(phaseRef.current==='center'){
        if(centered){
          centeredFrames.current++;
          baselineEye.current.push(eye);
          if(baselineEye.current.length>30)baselineEye.current.shift();
          setStatus('ثبّت وجهك للحظة...');
        }else centeredFrames.current=0;
        if(centeredFrames.current>=10){phaseRef.current='turn';setPhase('turn');setStatus('حرّك رأسك بوضوح إلى أحد الجانبين');}
      }else if(phaseRef.current==='turn'){
        if(turn>.105){setQuality(q=>({...q,motion:true}));phaseRef.current='return';setPhase('return');setStatus('ممتاز، أعد وجهك للمنتصف');}
      }else if(phaseRef.current==='return'){
        if(centered)returnedFrames.current++;else returnedFrames.current=0;
        if(returnedFrames.current>=7){phaseRef.current='blink';setPhase('blink');setStatus('ارمش مرة واحدة بشكل طبيعي');}
      }else if(phaseRef.current==='blink'){
        const base=baselineEye.current.length?baselineEye.current.reduce((a,b)=>a+b,0)/baselineEye.current.length:.25;
        if(!blinkClosed.current&&eye<base*.60){blinkClosed.current=true;setStatus('ممتاز، افتح عينيك');}
        else if(blinkClosed.current&&eye>base*.80){
          setQuality(q=>({...q,blink:true}));doneRef.current=true;setPhase('success');setStatus('تم التحقق من الحضور المباشر بنجاح');
          setTimeout(()=>{stop();onSuccess();},650);
        }
      }
    };

    const scheduleLoop=()=>{
      if(cancelled||doneRef.current)return;
      loopTimerRef.current=setTimeout(async()=>{
        if(cancelled||doneRef.current)return;
        if(!processing&&meshRef.current&&videoRef.current?.readyState>=2){
          processing=true;
          try{await meshRef.current.send({image:videoRef.current});}catch(e){if(!cancelled)console.warn('FaceMesh frame:',e)}
          processing=false;
        }
        scheduleLoop();
      },90);
    };

    async function start(){
      try{
        if(!window.FaceMesh) throw new Error('MODULE');
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('CAMERA_UNSUPPORTED');
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
        if(cancelled){stream.getTracks().forEach(t=>t.stop());return;}
        streamRef.current=stream;
        videoRef.current.srcObject=stream;
        await videoRef.current.play();

        const mesh=new FaceMesh({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`});
        mesh.setOptions({maxNumFaces:2,refineLandmarks:true,minDetectionConfidence:.72,minTrackingConfidence:.72});
        mesh.onResults(processResults);
        meshRef.current=mesh;

        setPhase('center');phaseRef.current='center';setStatus('ضع وجهك في منتصف الإطار');
        scheduleLoop();
      }catch(err){
        console.error(err);stop();
        if(err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError')setError('تعذر الوصول للكاميرا. اسمح باستخدام الكاميرا لإكمال التسجيل.');
        else if(err?.name==='NotFoundError')setError('لم يتم العثور على كاميرا أمامية متاحة.');
        else setError('تعذر تشغيل وحدة التحقق من الحضور على هذا الجهاز.');
      }
    }

    start();
    return()=>{cancelled=true;stop();};
  },[onSuccess,stop]);

  const checks=[['face','وجه واحد'],['light','إضاءة مناسبة'],['distance','موضع مناسب'],['motion','حركة حية'],['blink','استجابة مباشرة']];
  return <div className="min-h-[100dvh] bg-[#111] text-white flex flex-col safe-top safe-bottom">
    <div className="px-4 py-3 flex items-center justify-between"><button onClick={()=>{stop();onBack()}} className="h-10 px-3 rounded-10 bg-white/10 text-sm">إلغاء</button><b>التحقق من الحضور</b><span className="w-16"/></div>
    <div className="flex-1 flex items-center justify-center px-4 py-4"><div className="w-full max-w-[520px]">
      <div className="relative aspect-[3/4] sm:aspect-[4/3] rounded-20 overflow-hidden bg-black border border-white/10 shadow-lift">
        <video ref={videoRef} muted playsInline className="face-video absolute inset-0 w-full h-full object-cover"/>
        <div className="absolute inset-[12%] border-2 border-white/60 rounded-[45%] pointer-events-none"></div>
        <div className="absolute bottom-4 left-4 right-4 bg-black/55 backdrop-blur rounded-12 p-3 text-center text-sm font-bold">{error||status}</div>
        {phase==='success'&&<div className="absolute inset-0 bg-success/25 flex items-center justify-center"><div className="w-20 h-20 rounded-full bg-success text-white flex items-center justify-center pulse-ring"><Icon name="check" className="w-10 h-10"/></div></div>}
      </div>
      <canvas ref={miniCanvas} className="hidden"/>
      <div className="mt-4 grid grid-cols-5 gap-2">{checks.map(([k,l])=><div key={k} className={`rounded-10 px-2 py-2 text-center border ${quality[k]?'bg-success/20 border-success/40 text-green-200':'bg-white/5 border-white/10 text-white/50'}`}><div className="mx-auto w-5 h-5 flex items-center justify-center">{quality[k]?<Icon name="check" className="w-4 h-4"/>:<span className="w-2 h-2 rounded-full bg-current"/>}</div><div className="text-[9px] mt-1">{l}</div></div>)}</div>
      {error&&<button onClick={()=>location.reload()} className="mt-4 w-full h-12 rounded-12 bg-white text-primary font-bold">إعادة المحاولة</button>}
      <p className="text-[11px] text-white/50 text-center mt-4">يتم التحليل على جهازك ولا يتم حفظ صورة الوجه في حساب العميل.</p>
    </div></div>
  </div>;
}

  const showLimit=max=>setToast({type:'info',message:`تم الوصول للحد الأقصى المسموح لهذا الصنف: ${NF.format(max)} كرتون.`});
  const removeItem=id=>setCart(c=>{const n={...c};delete n[id];return n});
  async function saveDraft(notes=''){
    if(!cartItems.length)return;setSavingDraft(true);try{const ref=db.collection(DRAFT_COLLECTION).doc();const draftNo='D-'+ref.id.slice(0,7).toUpperCase();await ref.set({customerUid:user.uid,draftNo,items:cartItems.map(i=>({cleanId:i.cleanId,id:i.id,name:i.name,imageFile:i.imageFile||'',branchQuantities:i.branchQuantities,totalQty:i.totalQty})),notes:String(notes||'').trim(),totalCartons,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});setToast({type:'success',message:`تم حفظ ${draftNo} كمسودة.`});await loadHistory()}catch(e){console.error(e);setToast({type:'error',message:'تعذر حفظ المسودة.'})}finally{setSavingDraft(false)}}
  async function freshAllowedMap(){const [j,r]=await Promise.all([fetchText(DATA_PATH+'jeddah.tsv',{fresh:true}),fetchText(DATA_PATH+'riyadh.tsv',{fresh:true})]);return new Map(mergeInventories(parseInventory(j),parseInventory(r)).map(x=>[x.cleanId,x.allowedMax]))}
  async function submitOrder(notes){
    const cleanNotes=String(notes||'').trim();if(!cleanNotes){setToast({type:'error',message:'الملاحظات إلزامية قبل اعتماد الطلب.'});return}if(!cartItems.length)return;
    setSubmitBusy(true);setValidationErrors([]);try{const allowed=await freshAllowedMap();const errors=cartItems.map(i=>({cleanId:i.cleanId,id:i.id,requested:i.totalQty,allowed:allowed.get(i.cleanId)||0})).filter(x=>x.requested>x.allowed+1e-9);if(errors.length){setValidationErrors(errors);setToast({type:'error',message:'تغير الحد المسموح لبعض الأصناف. راجع التنبيه.'});return}
      const ref=db.collection(ORDER_COLLECTION).doc(),orderNo='BT-'+ref.id.slice(0,7).toUpperCase();await ref.set({customerUid:user.uid,orderNo,customer:{name:profile.name,company:profile.company,phone:profile.phone},branches:branches.map(b=>({id:b.id,name:b.name})),items:cartItems.map(i=>({cleanId:i.cleanId,id:i.id,name:i.name,branchQuantities:i.branchQuantities,totalQty:i.totalQty})),notes:cleanNotes,totalCartons,status:'submitted',createdAt:firebase.firestore.FieldValue.serverTimestamp()});setCart({});setCheckout(false);setPage('orders');setToast({type:'success',message:`تم إرسال الطلب ${orderNo} بنجاح.`});await loadHistory()
    }catch(e){console.error(e);setToast({type:'error',message:'تعذر اعتماد الطلب. تحقق من الاتصال وحاول مجددًا.'})}finally{setSubmitBusy(false)}}
  async function loadHistory(){setHistoryLoading(true);try{const [o,d]=await Promise.all([db.collection(ORDER_COLLECTION).where('customerUid','==',user.uid).get(),db.collection(DRAFT_COLLECTION).where('customerUid','==',user.uid).get()]);const cv=x=>x?.toMillis?.()||0;setOrders(o.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>cv(b.createdAt)-cv(a.createdAt)));setDrafts(d.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>cv(b.updatedAt||b.createdAt)-cv(a.updatedAt||a.createdAt)))}catch(e){console.error(e)}finally{setHistoryLoading(false)}}
  useEffect(()=>{if(page==='orders')loadHistory()},[page]);
  async function deleteDraft(id){try{await db.collection(DRAFT_COLLECTION).doc(id).delete();setDrafts(x=>x.filter(d=>d.id!==id));setToast({type:'success',message:'تم حذف المسودة.'})}catch{setToast({type:'error',message:'تعذر حذف المسودة.'})}}
  function loadDraft(d){const next={};(d.items||[]).forEach(i=>next[i.cleanId]={cleanId:i.cleanId,id:i.id,name:i.name,imageFile:i.imageFile||'',branchQuantities:i.branchQuantities||{}});setCart(next);setCheckout(false);setPage('cart');setToast({type:'success',message:'تم تحميل المسودة إلى السلة.'})}
  async function saveBranches(next){await db.collection(CUSTOMER_COLLECTION).doc(user.uid).update({branches:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});onProfileUpdate({...profile,branches:next});setToast({type:'success',message:'تم تحديث أسماء الفروع.'})}
  async function changePin(currentPin,newPin){
    try{
      const credential=firebase.auth.EmailAuthProvider.credential(authEmailFromPhone(profile.phone),currentPin);
      await user.reauthenticateWithCredential(credential);
      await user.updatePassword(newPin);
      setToast({type:'success',message:'تم تغيير رمز الدخول بنجاح.'});
    }catch(e){
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')throw new Error('رمز الدخول الحالي غير صحيح.');
      if(e.code==='auth/too-many-requests')throw new Error('محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا.');
      throw new Error('تعذر تغيير رمز الدخول الآن.');
    }
  }
  const nav=[['home','home','الرئيسية'],['categories','grid','الأقسام'],['cart','cart','السلة'],['orders','file','طلباتي'],['account','user','حسابي']];
  if(checkout)return <><div className="min-h-[100dvh] bg-surface pb-8"><header className="bg-white border-b border-border sticky top-0 z-20"><div className="max-w-[900px] mx-auto p-4"><b>اعتماد طلب الشراء</b></div></header><main className="max-w-[760px] mx-auto p-4"><Checkout items={cartItems} branches={branches} profile={profile} onBack={()=>{setCheckout(false);setValidationErrors([])}} onDraft={saveDraft} onSubmit={submitOrder} busy={submitBusy} validationErrors={validationErrors}/></main></div><Toast toast={toast} onClose={()=>setToast(null)}/></>;
  return <div className="min-h-[100dvh] bg-surface pb-[92px]">
    <header className="bg-white border-b border-border sticky top-0 z-30 safe-top"><div className="max-w-[1100px] mx-auto px-4 py-3 flex items-center justify-between gap-3"><div className="min-w-0"><div className="text-[10px] text-muted">بوابة العملاء</div><b className="text-sm block truncate">{profile.company}</b></div><div className="flex items-center gap-2"><div className="hidden sm:block text-left"><div className="text-[10px] text-muted">مرحبًا</div><div className="text-xs font-bold">{profile.name||'عميلنا'}</div></div><button onClick={()=>setPage('cart')} className="relative w-11 h-11 rounded-12 border border-border bg-white flex items-center justify-center"><Icon name="cart"/>{cartCount>0&&<span className="absolute -top-1 -left-1 min-w-5 h-5 px-1 rounded-full bg-accent text-white text-[10px] flex items-center justify-center">{cartCount}</span>}</button></div></div></header>
    <main className="max-w-[1100px] mx-auto p-4 sm:p-5">
      {(page==='home'||page==='categories')&&<div className="fade-in">
        {page==='home'&&<div className="mb-5 bg-primary text-white rounded-20 p-5 sm:p-6 overflow-hidden relative"><div className="relative z-10"><div className="text-xs text-white/65">أهلًا {profile.name||'بك'}</div><h1 className="text-xl sm:text-2xl font-bold mt-1">المعرض الرقمي</h1><p className="text-sm text-white/70 mt-2 max-w-xl">ابحث عن منتجاتك، وزّع الكمية على فروعك، وأرسل الطلب مباشرة.</p><div className="mt-4 inline-flex gap-2 text-xs"><span className="px-3 py-2 rounded-full bg-white/10">{cartCount} صنف في السلة</span><span className="px-3 py-2 rounded-full bg-white/10 ltr">{NF.format(totalCartons)} كرتون</span></div></div></div>}
        <div className="sticky top-[69px] z-20 bg-surface/95 backdrop-blur py-2"><div className="relative"><Icon name="search" className="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-muted"/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ابحث برقم الصنف أو اسم المنتج..." className="w-full h-[52px] pr-12 pl-4 bg-white border border-border rounded-16 outline-none focus:border-accent focus:ring-4 focus:ring-accent/5 shadow-card"/></div><div className="flex gap-2 overflow-x-auto no-scrollbar mt-3 pb-1"><button onClick={()=>setActiveCategory('الكل')} className={`h-9 px-4 rounded-full border text-xs font-bold whitespace-nowrap ${activeCategory==='الكل'?'bg-primary border-primary text-white':'bg-white border-border'}`}>الكل</button><button onClick={()=>setActiveCategory(SPECIAL_UNCATEGORIZED)} className={`h-9 px-4 rounded-full border text-xs font-bold whitespace-nowrap ${activeCategory===SPECIAL_UNCATEGORIZED?'bg-primary border-primary text-white':'bg-white border-border'}`}>أخرى</button>{categoryNames.map(c=><button key={c} onClick={()=>setActiveCategory(c)} className={`h-9 px-4 rounded-full border text-xs font-bold whitespace-nowrap ${activeCategory===c?'bg-primary border-primary text-white':'bg-white border-border'}`}>{c}</button>)}</div></div>
        <div className="flex items-center justify-between mt-4 mb-3"><div><b className="text-sm">{activeCategory==='الكل'?'جميع المنتجات':activeCategory}</b><div className="text-[10px] text-muted">{filtered.length} منتج متاح للطلب</div></div></div>
        {loading?<div className="py-24 flex justify-center"><Spinner/></div>:filtered.length===0?<Empty title="لا توجد منتجات مطابقة" note="جرّب رقم صنف آخر أو قسمًا مختلفًا." icon="search"/>:<><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">{filtered.slice(0,pageCount).map(item=><ProductCard key={item.cleanId} item={item} onAdd={requestProduct} onZoom={setZoom}/>)}</div>{pageCount<filtered.length&&<button onClick={()=>setPageCount(n=>n+PAGE_SIZE)} className="mt-5 w-full h-12 rounded-12 border border-border bg-white font-bold text-sm">عرض المزيد</button>}</>}
      </div>}
      {page==='cart'&&<div className="fade-in"><div className="ui-section-head"><h2>طلب الشراء</h2><p>عدّل الكمية بنصف كرتون ووزّعها على فروعك بدون كتابة يدوية.</p></div><CartView cartItems={cartItems} branches={branches} onEdit={setAllocItem} onRemove={removeItem} onCheckout={()=>setCheckout(true)} onSaveDraft={()=>saveDraft('')} savingDraft={savingDraft}/></div>}
      {page==='orders'&&<div className="fade-in"><div className="ui-section-head"><h2>طلباتي</h2><p>كل الطلبات المرسلة والمسودات المحفوظة في مكان واحد.</p></div><OrdersView orders={orders} drafts={drafts} onLoadDraft={loadDraft} onDeleteDraft={deleteDraft} loading={historyLoading}/></div>}
      {page==='account'&&<div className="fade-in"><div className="ui-section-head"><h2>حسابي</h2><p>بيانات الحساب، الفروع، ورمز الدخول.</p></div><AccountView profile={profile} onLogout={()=>auth.signOut()} onSaveBranches={saveBranches} onChangePin={changePin}/></div>}
    </main>
    <nav className="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-border safe-bottom"><div className="max-w-[700px] mx-auto grid grid-cols-5 px-1 pt-2">{nav.map(([id,icon,label])=><button key={id} onClick={()=>{setCheckout(false);setPage(id);if(id==='categories')setActiveCategory('الكل')}} className={`h-14 flex flex-col items-center justify-center gap-1 rounded-10 text-[10px] font-bold ${page===id?'text-accent':'text-muted'}`}><div className="relative"><Icon name={icon} className="w-5 h-5"/>{id==='cart'&&cartCount>0&&<span className="absolute -top-2 -left-2 w-4 h-4 rounded-full bg-accent text-white text-[8px] flex items-center justify-center">{cartCount}</span>}</div>{label}</button>)}</div></nav>
    {!String(profile.name||'').trim()&&<NamePromptModal company={profile.company} onSave={saveCustomerName}/>}
    {firstBranchItem&&<FirstBranchModal item={firstBranchItem} onClose={()=>setFirstBranchItem(null)} onCreate={createFirstBranch}/>}
    {allocItem&&<BranchAllocationModal item={allocItem} branches={branches} current={cart[allocItem.cleanId]?.branchQuantities||{}} onClose={()=>setAllocItem(null)} onSave={q=>saveAllocation(allocItem,q)} onLimit={showLimit}/>}<Lightbox item={zoom} onClose={()=>setZoom(null)}/><Toast toast={toast} onClose={()=>setToast(null)}/>
  </div>
}

function Root(){
  const [authState,setAuthState]=useState('loading'),[profile,setProfile]=useState(null),[screen,setScreen]=useState('choice'),[registration,setRegistration]=useState(null),[registering,setRegistering]=useState(false),[globalError,setGlobalError]=useState('');
  const creatingAccountRef=useRef(false);

  useEffect(()=>auth.onAuthStateChanged(async u=>{
    if(creatingAccountRef.current) return;
    if(!u){setProfile(null);setAuthState('guest');return;}
    setAuthState('loading');
    try{
      const doc=await db.collection(CUSTOMER_COLLECTION).doc(u.uid).get();
      if(!doc.exists){await auth.signOut();setGlobalError('الحساب موجود في المصادقة لكن ملف العميل غير مكتمل. تواصل مع الإدارة.');setAuthState('guest');return;}
      const p={id:doc.id,...doc.data()};
      if(p.status==='suspended'){await auth.signOut();setGlobalError('هذا الحساب موقوف حاليًا. تواصل مع الإدارة.');setAuthState('guest');return;}
      setProfile(p);setAuthState('ready');
      db.collection(CUSTOMER_COLLECTION).doc(u.uid).update({lastLoginAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    }catch(e){console.error(e);setGlobalError('تعذر تحميل حساب العميل.');setAuthState('guest');}
  }),[]);

  const finishRegistration=async()=>{
    if(!registration||registering)return;
    setRegistering(true);setGlobalError('');creatingAccountRef.current=true;
    let created=null;
    try{
      const cred=await auth.createUserWithEmailAndPassword(authEmailFromPhone(registration.phone),registration.pin);
      created=cred.user;
      const profileData={name:'',company:registration.company,phone:registration.phone,branches:[],status:'active',livenessVerified:true,livenessVerifiedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastLoginAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:2};
      await db.collection(CUSTOMER_COLLECTION).doc(created.uid).set(profileData);
      const doc=await db.collection(CUSTOMER_COLLECTION).doc(created.uid).get();
      setProfile({id:created.uid,...doc.data()});
      setRegistration(null);setAuthState('ready');setScreen('choice');
    }catch(err){
      console.error(err);
      if(created){try{await created.delete()}catch{}}
      if(err.code==='auth/email-already-in-use')setGlobalError('يوجد حساب مسجل بهذا الرقم بالفعل. اختر «مستخدم سابق».');
      else if(err.code==='auth/operation-not-allowed')setGlobalError('يلزم تفعيل Email/Password من Firebase Authentication مرة واحدة قبل تسجيل العملاء.');
      else if(err.code==='auth/weak-password')setGlobalError('رمز الدخول يجب أن يكون 6 أرقام.');
      else setGlobalError('تعذر إنشاء الحساب. تحقق من الاتصال وحاول مرة أخرى.');
      setScreen('choice');setRegistration(null);setAuthState('guest');
    }finally{
      creatingAccountRef.current=false;setRegistering(false);
    }
  };
  if(authState==='loading'||registering)return <div className="min-h-[100dvh] ui-auth-bg flex flex-col items-center justify-center gap-4 px-4"><div className="ui-brand-mark !mb-0"><Icon name="shop" className="w-7 h-7"/></div><Spinner/><div className="text-sm font-semibold text-secondary">{registering?'جاري إنشاء حسابك...':'جاري تجهيز البوابة...'}</div></div>;
  if(authState==='ready'&&profile)return <CustomerApp user={auth.currentUser} profile={profile} onProfileUpdate={setProfile}/>;
  if(screen==='register')return <RegistrationForm onBack={()=>setScreen('choice')} onReady={data=>{setRegistration(data);setScreen('liveness')}}/>;
  if(screen==='liveness'&&registration)return <LivenessCheck registration={registration} onBack={()=>setScreen('register')} onSuccess={finishRegistration}/>;
  if(screen==='login')return <ExistingLogin onBack={()=>setScreen('choice')}/>;
  return <><AccessChoice onNew={()=>{setGlobalError('');setScreen('register')}} onExisting={()=>{setGlobalError('');setScreen('login')}}/>{globalError&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-32px)] max-w-[560px] bg-danger text-white rounded-12 p-3 shadow-lift text-sm font-bold">{globalError}</div>}</>;
}

function CustomerPortalBootstrap(){
  const [released,setReleased]=useState(()=>Date.now()>=CUSTOMER_PORTAL_RELEASE_AT);
  const previewAllowed=useMemo(()=>{
    try{return localStorage.getItem(CUSTOMER_PORTAL_PREVIEW_KEY)===String(CUSTOMER_PORTAL_RELEASE_AT)}catch{return false}
  },[]);

  useEffect(()=>{
    if(released)return;
    const check=()=>{if(Date.now()>=CUSTOMER_PORTAL_RELEASE_AT)setReleased(true)};
    check();
    const timer=setInterval(check,15000);
    return()=>clearInterval(timer);
  },[released]);

  if(!released&&!previewAllowed){
    return <div className="min-h-[100dvh] bg-surface flex items-center justify-center p-5 font-sans">
      <div className="w-full max-w-[420px] ui-panel fade-in">
        <div className="ui-panel-head"><div className="ui-brand-mark"><Icon name="lock" className="w-7 h-7"/></div><div className="ui-eyebrow">بوابة العملاء</div><h1 className="ui-title">الخدمة غير متاحة حاليًا</h1><p className="ui-subtitle">يجري تجهيز المعرض والطلبات للإطلاق. ستتاح البوابة تلقائيًا في الموعد المحدد.</p></div>
        <div className="ui-panel-body"><a href="./index.html" className="ui-btn ui-btn-secondary"><Icon name="back" className="w-4 h-4"/>العودة للبوابة الرئيسية</a></div>
      </div>
    </div>;
  }

  return <>
    {!released&&previewAllowed&&<div className="fixed top-2 left-1/2 -translate-x-1/2 z-[200] px-3 py-2 rounded-full bg-info text-white shadow-lift text-[11px] font-bold whitespace-nowrap">وضع المعاينة للإدارة — غير متاح للعملاء بعد</div>}
    <Root/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<CustomerPortalBootstrap/>);
</script>
</body>
</html>
