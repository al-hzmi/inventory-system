const {useState,useEffect,useMemo,useRef,useCallback,memo} = React;
const NF = new Intl.NumberFormat('en-US',{maximumFractionDigits:1});
const PRICE_NF = new Intl.NumberFormat('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
const toEnglishDigits = s => String(s??'').replace(/[٠-٩۰-۹]/g,d=>{const a=AR.indexOf(d);return a>-1?String(a):String(FA.indexOf(d))});
const normalizeCleanId = s => toEnglishDigits(s).replace(/\D/g,'');
const normalizeText = s => toEnglishDigits(String(s??'')).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/\u0640/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/[^\u0600-\u06FFa-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
const roundHalf = n => Math.round((Number(n)||0)*2)/2;
const floorHalf = n => Math.max(0,Math.floor((Number(n)||0)*2+1e-7)/2);
const sum = arr => arr.reduce((a,b)=>a+(Number(b)||0),0);
const uidPart = () => Math.random().toString(36).slice(2,10);
const nowLabel = () => new Date().toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'});


// Security telemetry: meaningful customer activity only. Never stores PINs or face images.
const customerSessionId = (()=>{
  try{
    let id=sessionStorage.getItem('batco_customer_session_id');
    if(!id){id=`cs_${Date.now().toString(36)}_${uidPart()}`;sessionStorage.setItem('batco_customer_session_id',id)}
    return id;
  }catch{return `cs_${Date.now().toString(36)}_${uidPart()}`}
})();
const customerVisitorId=(()=>{
  try{
    let id=localStorage.getItem(CUSTOMER_VISITOR_KEY);
    if(!id){id=`cv_${Date.now().toString(36)}_${uidPart()}_${uidPart()}`;localStorage.setItem(CUSTOMER_VISITOR_KEY,id)}
    return id;
  }catch{return `cv_${Date.now().toString(36)}_${uidPart()}`}
})();
const currentGuestName=()=>{try{return String(localStorage.getItem(GUEST_NAME_KEY)||'').trim()}catch{return''}};
const customerIdentity=user=>user?.uid
  ? {key:`u_${user.uid}`,customerUid:user.uid,visitorId:customerVisitorId,identityType:'account'}
  : {key:`g_${customerVisitorId}`,customerUid:'',visitorId:customerVisitorId,identityType:'guest'};
const CUSTOMER_DEVICE_INSTALL_KEY='batco_customer_device_install_v1';
const compactHash=str=>{let h=2166136261>>>0;for(const ch of String(str||'')){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36)};
function customerInstallId(){
  try{let id=localStorage.getItem(CUSTOMER_DEVICE_INSTALL_KEY);if(!id){id=`dev_${Date.now().toString(36)}_${uidPart()}_${uidPart()}`;localStorage.setItem(CUSTOMER_DEVICE_INSTALL_KEY,id)}return id}catch{return `dev_${compactHash(navigator.userAgent||'browser')}`}
}
function customerFingerprint(){
  const sw=Number(window.screen?.width||0),sh=Number(window.screen?.height||0),dims=[sw,sh].sort((a,b)=>a-b).join('x');
  const parts=[navigator.platform||'',navigator.language||'',dims,window.devicePixelRatio||1,navigator.maxTouchPoints||0,navigator.hardwareConcurrency||0,navigator.deviceMemory||0,Intl.DateTimeFormat().resolvedOptions().timeZone||'',/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent||'')?'m':'d'];
  return `fp_${compactHash(parts.join('|'))}`;
}
const customerDeviceIdentity=()=>({deviceId:customerInstallId(),fingerprint:customerFingerprint()});
const customerDeviceDocId=uid=>`${uid}__${customerFingerprint()}`;
const customerDeviceInfo = () => ({
  ...customerDeviceIdentity(), userAgent:navigator.userAgent||'', platform:navigator.platform||'', language:navigator.language||'',
  viewport:`${window.innerWidth||0}x${window.innerHeight||0}`, screen:`${window.screen?.width||0}x${window.screen?.height||0}`,
  standalone:Boolean(window.matchMedia?.('(display-mode: standalone)')?.matches || navigator.standalone), timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||''
});
async function ensureCustomerDeviceAllowed(user,profile){
  if(!user?.uid)return {allowed:false};
  const info=customerDeviceInfo(),ref=db.collection(CUSTOMER_DEVICE_COLLECTION).doc(customerDeviceDocId(user.uid));
  const snap=await ref.get();
  if(snap.exists){
    const current=snap.data()||{};
    if(current.status==='blocked'||current.blocked===true)return {allowed:false,device:{id:snap.id,...current}};
    await ref.set({customerUid:user.uid,name:profile?.name||'',company:profile?.company||'',phone:profile?.phone||'',...info,installIds:firebase.firestore.FieldValue.arrayUnion(info.deviceId),lastSeen:firebase.firestore.FieldValue.serverTimestamp(),status:current.status||'active'},{merge:true});
  }else{
    await ref.set({customerUid:user.uid,name:profile?.name||'',company:profile?.company||'',phone:profile?.phone||'',...info,installIds:[info.deviceId],status:'active',firstSeen:firebase.firestore.FieldValue.serverTimestamp(),lastSeen:firebase.firestore.FieldValue.serverTimestamp()});
  }
  return {allowed:true,deviceId:ref.id,info};
}
async function logCustomerEvent(user,type,label='',data={}){
  const identity=customerIdentity(user),device=customerDeviceInfo(),guestName=currentGuestName();
  const activityWrite=db.collection(CUSTOMER_ACTIVITY_COLLECTION).add({
    customerUid:identity.customerUid,visitorId:identity.visitorId,identityType:identity.identityType,
    name:user?.uid?'':guestName,sessionId:customerSessionId,type,label:String(label||''),data:data||{},device,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  const writes=[activityWrite];
  if(user?.uid){
    writes.push(db.collection(CUSTOMER_COLLECTION).doc(user.uid).set({
      visitorId:identity.visitorId,lastActivityAt:firebase.firestore.FieldValue.serverTimestamp(),lastActivityType:String(type||'activity'),
      lastActivityLabel:String(label||''),lastSessionId:customerSessionId,lastSeenAt:firebase.firestore.FieldValue.serverTimestamp(),
      lastDevice:{deviceId:device.deviceId||'',fingerprint:device.fingerprint||'',userAgent:device.userAgent||'',platform:device.platform||'',viewport:device.viewport||'',screen:device.screen||'',standalone:!!device.standalone,timezone:device.timezone||''},
      telemetryVersion:5
    },{merge:true}));
  }
  const results=await Promise.allSettled(writes);
  results.forEach((r,i)=>{if(r.status==='rejected')console.warn('[Customer telemetry]',i,r.reason?.message||r.reason)});
  return {activity:results[0]?.status==='fulfilled',profile:user?.uid?(results[1]?.status==='fulfilled'):false};
}
async function touchCustomerSession(user,profile,event='active'){
  const identity=customerIdentity(user),device=customerDeviceInfo();
  try{
    const key='batco_customer_session_started_'+identity.key+'_'+customerSessionId;
    const first=!sessionStorage.getItem(key);
    const resolvedName=String(profile?.name||(!user?.uid?currentGuestName():'')).trim();
    const payload={customerUid:identity.customerUid,visitorId:identity.visitorId,identityType:identity.identityType,sessionId:customerSessionId,name:resolvedName,company:profile?.company||'',phone:profile?.phone||'',event,lastActive:firebase.firestore.FieldValue.serverTimestamp(),device,userAgent:device.userAgent||'',platform:device.platform||''};
    if(first){payload.startedAt=firebase.firestore.FieldValue.serverTimestamp();sessionStorage.setItem(key,'1')}
    const sessionWrite=db.collection(CUSTOMER_SESSION_COLLECTION).doc(`${identity.key}_${customerSessionId}`).set(payload,{merge:true});
    const writes=[sessionWrite];
    if(user?.uid){
      writes.push(db.collection(CUSTOMER_COLLECTION).doc(user.uid).set({
        visitorId:identity.visitorId,lastSeenAt:firebase.firestore.FieldValue.serverTimestamp(),lastSessionId:customerSessionId,
        lastSessionEvent:String(event||'active'),lastDevice:{deviceId:device.deviceId||'',fingerprint:device.fingerprint||'',userAgent:device.userAgent||'',platform:device.platform||'',viewport:device.viewport||'',screen:device.screen||'',standalone:!!device.standalone,timezone:device.timezone||''},telemetryVersion:5
      },{merge:true}));
    }
    const results=await Promise.allSettled(writes);
    results.forEach((r,i)=>{if(r.status==='rejected')console.warn('[Customer session]',i,r.reason?.message||r.reason)});
    return {session:results[0]?.status==='fulfilled',profile:user?.uid?(results[1]?.status==='fulfilled'):false};
  }catch(e){console.warn('[Customer session]',e?.message||e);return {session:false,profile:false}}
}

function normalizePhone(raw){
  let d=toEnglishDigits(raw).replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(/^05\d{8}$/.test(d)) d='966'+d.slice(1);
  else if(/^5\d{8}$/.test(d)) d='966'+d;
  return d;
}
function displayPhone(p){
  const d=normalizePhone(p);
  if(/^9665\d{8}$/.test(d)) return '0'+d.slice(3);
  return d;
}
function authEmailFromPhone(phone){ return `customer_${normalizePhone(phone)}@example.com`; }
function legacyAuthEmailFromPhone(phone){ return `customer_${normalizePhone(phone)}@portal.batco.local`; }
function validPhone(phone){ const d=normalizePhone(phone); return /^\d{8,15}$/.test(d); }
function validPin(pin){ return /^\d{6}$/.test(toEnglishDigits(pin)); }

function buildOrderWhatsAppText(order){
  const c=order?.customer||{},branches=Array.isArray(order?.branches)?order.branches:[],items=Array.isArray(order?.items)?order.items:[];
  const totalCartons=Number(order?.totalCartons)||sum(items.map(i=>Number(i.totalQty)||0));
  const estimatedTotal=Number(order?.estimatedTotal)||sum(items.map(i=>(Number(i.cartonPrice)||0)*(Number(i.totalQty)||0)));
  const lines=['طلب شراء - بيت الأواني الطيبة',`رقم الطلب: ${order?.orderNo||'—'}`];
  if(c.name)lines.push(`الاسم: ${c.name}`);
  if(c.company)lines.push(`الجهة: ${c.company}`);
  if(c.phone)lines.push(`الجوال: ${displayPhone(c.phone)}`);
  lines.push(`إجمالي الكراتين: ${NF.format(totalCartons)}`);
  if(estimatedTotal>0)lines.push(`القيمة التقريبية: ${PRICE_NF.format(estimatedTotal)} ريال`);
  branches.forEach((branch,index)=>{
    const rows=items.map(item=>({...item,qty:Number(item.branchQuantities?.[branch.id]||0)})).filter(item=>item.qty>0);
    if(!rows.length)return;
    lines.push('',`${index+1}) ${branch.name||'فرع'}`);
    rows.forEach(item=>lines.push(`• ${item.id||item.cleanId||'—'} — ${NF.format(item.qty)} كرتون`));
  });
  if(order?.notes)lines.push('','ملاحظات:',String(order.notes));
  lines.push('','تم إعداد الطلب عبر بوابة عملاء بيت الأواني الطيبة.');
  return lines.join('\n');
}
function openOrderWhatsApp(order){
  const url='https://wa.me/?text='+encodeURIComponent(buildOrderWhatsAppText(order));

}

function registrationErrorMessage(err,stage='auth',cleanupFailed=false){
  const code=String(err?.code||'');
  const suffix=code?` (رمز: ${code.replace(/^firebase\//,'')})`:'';
  if(code==='auth/email-already-in-use') return 'يوجد حساب مسجل بهذا الرقم بالفعل. اختر «لدي حساب».';
  if(code==='auth/operation-not-allowed'||code==='auth/configuration-not-found') return 'خدمة إنشاء الحسابات غير مفعّلة في Firebase. فعّل Email/Password من Authentication ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/invalid-email') return 'تعذر تجهيز معرّف الحساب الداخلي. تم تصحيح هذه المشكلة في النسخة الجديدة؛ حدّث الصفحة وحاول مرة أخرى.'+suffix;
  if(code==='auth/weak-password') return 'رمز الدخول غير مقبول حسب سياسة Firebase الحالية. استخدم 6 أرقام مختلفة مؤقتًا أو راجع سياسة كلمات المرور.'+suffix;
  if(code==='auth/network-request-failed'||code==='unavailable'||code==='firestore/unavailable') return 'تعذر الوصول إلى خدمة الحسابات الآن. تحقق من الاتصال ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/too-many-requests'||code==='auth/quota-exceeded') return 'تم إيقاف إنشاء الحسابات مؤقتًا بسبب كثرة المحاولات. انتظر قليلًا ثم حاول مرة أخرى.'+suffix;
  if(code==='auth/app-not-authorized'||code==='auth/unauthorized-domain') return 'نطاق الموقع غير مصرح له في Firebase Authentication. أضف نطاق Vercel ضمن Authorized domains.'+suffix;
  if(code==='permission-denied'||code==='firestore/permission-denied') return 'تم إنشاء بيانات الدخول، لكن قواعد Firestore تمنع إنشاء ملف العميل. يلزم السماح لمجموعة customers للمستخدم المسجل.'+suffix+(cleanupFailed?' وتعذر تنظيف حساب المصادقة تلقائيًا؛ راجع Firebase Authentication.':'');
  if(code==='failed-precondition'||code==='firestore/failed-precondition') return 'إعداد قاعدة البيانات غير مكتمل لهذه العملية. راجع Firestore ثم أعد المحاولة.'+suffix;
  if(stage==='profile') return 'نجح إنشاء بيانات الدخول لكن تعذر حفظ ملف العميل في قاعدة البيانات.'+suffix+(cleanupFailed?' راجع Firebase Authentication قبل إعادة المحاولة.':'');
  return 'تعذر إنشاء الحساب بسبب إعداد تقني غير متوقع.'+suffix;
}

async function fetchText(url,{fresh=false}={}){
  const key='customer_cache_'+url;
  try{
    const target=fresh?`${url}${url.includes('?')?'&':'?'}v=${Date.now()}`:url;
    const res=await fetch(target,{cache:fresh?'no-store':'default'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(!fresh) localStorage.setItem(key,text);
    return text;
  }catch(err){
    const cached=localStorage.getItem(key);
    if(cached&&!fresh) return cached;
    throw err;
  }
}

function parsePricingMap(rawText){
  const map={}; if(!rawText)return map;
  const lines=String(rawText).trim().split(/\r?\n/); if(lines.length<2)return map;
  let headerRow=-1;
  for(let i=0;i<Math.min(lines.length,5);i++){if(lines[i]?.includes('سعر')&&(lines[i].includes('رقم')||lines[i].includes('صنف'))){headerRow=i;break}}
  if(headerRow<0)return map;
  const headers=lines[headerRow].split('\t').map(x=>x.trim()),pairs=[];
  headers.forEach((h,i)=>{if(/رقم|كود|صنف/i.test(h)){if(i>0&&/سعر|بيع/i.test(headers[i-1]))pairs.push([i,i-1]);else if(i<headers.length-1&&/سعر|بيع/i.test(headers[i+1]))pairs.push([i,i+1])}});
  for(let i=headerRow+1;i<lines.length;i++){const cols=lines[i].split('\t').map(x=>x.trim());pairs.forEach(([skuIdx,priceIdx])=>{const id=normalizeCleanId(cols[skuIdx]||'');const price=parseFloat(toEnglishDigits(cols[priceIdx]||'').replace(/,/g,''));if(id&&Number.isFinite(price)&&price>0)map[id]=price})}
  return map;
}

function parseInventory(raw){
  if(!raw) return [];
  const lines=raw.trim().split(/\r?\n/); if(lines.length<2) return [];
  const headers=lines[0].split('\t').map(x=>x.trim());
  const idIdx=headers.findIndex(h=>/رقم|كود|sku|item/i.test(h));
  const nameIdx=headers.findIndex(h=>/اسم|وصف|description|name/i.test(h));
  const qtyIdx=headers.findIndex(h=>/كمية|رصيد|متوفر|qty|quantity/i.test(h));
  const unitIdx=headers.findIndex(h=>/وحدة|unit|uom/i.test(h));
  const packIdx=headers.findIndex(h=>/شد|الشد/i.test(h));
  if(idIdx<0) return [];
  const map=new Map();
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split('\t').map(x=>x.trim());
    const id=c[idIdx]||''; const cleanId=normalizeCleanId(id); if(!cleanId) continue;
    const q=parseFloat(toEnglishDigits(qtyIdx>=0?(c[qtyIdx]||'0'):'0').replace(/,/g,''));
    map.set(cleanId,{cleanId,id,name:nameIdx>=0?(c[nameIdx]||''):'',qty:Number.isFinite(q)?q:0,unit:unitIdx>=0?(c[unitIdx]||''):'',pack:packIdx>=0?(c[packIdx]||''):''});
  }
  return [...map.values()];
}
function mergeInventories(a,b){
  const map=new Map();
  [...a,...b].forEach(item=>{
    const prev=map.get(item.cleanId);
    if(!prev) map.set(item.cleanId,{...item,mergedQty:Math.max(0,item.qty||0)});
    else map.set(item.cleanId,{...prev,id:prev.id||item.id,name:prev.name||item.name,unit:prev.unit||item.unit,pack:prev.pack||item.pack,mergedQty:Math.max(0,prev.mergedQty||0)+Math.max(0,item.qty||0)});
  });
  return [...map.values()].map(x=>({...x,allowedMax:floorHalf(x.mergedQty),searchName:normalizeText(x.name),searchId:toEnglishDigits(x.id).toLowerCase()}));
}
function buildImagesMap(text){
  const map=new Map();
  String(text||'').split(/\r?\n/).forEach(line=>{
    const raw=line.trim();if(!raw||raw.startsWith('#'))return;
    const parts=raw.split(/\t/);let id='',file='';
    if(parts.length>=2){id=normalizeCleanId(parts[0]);file=parts.slice(1).join('\t').trim()}
    else{file=raw;const base=file.split('/').pop().split('?')[0];id=normalizeCleanId(base.replace(/\.[^.]+$/,''))}
    if(id&&file)map.set(id,file);
  });
  return map;
}
function parseCategories(text){
  const out={}; if(!text)return out;
  const rows=text.split(/\r?\n/).map(r=>r.split('\t').map(c=>c.trim())); if(!rows.length)return out;
  const headers=rows[0]; headers.forEach(h=>{if(h)out[h]=[]});
  for(let i=1;i<rows.length;i++) headers.forEach((h,j)=>{if(!h)return;const id=normalizeCleanId(rows[i]?.[j]);if(id)out[h].push(id)});
  return out;
}
function effectiveCategories(base,overrides,meta){
  const out={}; const archived=new Set();
  Object.values(meta||{}).forEach(m=>{if(m?.name&&m.archived)archived.add(m.name);else if(m?.name)out[m.name]=out[m.name]||[]});
  Object.entries(base||{}).forEach(([cat,ids])=>{
    if(!cat||archived.has(cat))return; out[cat]=out[cat]||[];
    ids.forEach(id=>{const o=overrides[id]; if(o&&Object.prototype.hasOwnProperty.call(o,'category')&&(o.category===CATEGORY_UNASSIGNED||o.category!==cat))return; out[cat].push(id)});
  });
  Object.values(overrides||{}).forEach(o=>{const id=normalizeCleanId(o?.cleanId||o?.id);const cat=o?.category;if(!id||!cat||cat===CATEGORY_UNASSIGNED||archived.has(cat))return;out[cat]=out[cat]||[];out[cat].push(id)});
  Object.keys(out).forEach(k=>out[k]=[...new Set(out[k])]); return out;
}
function categoryLookup(cats){const out={};Object.entries(cats||{}).forEach(([c,ids])=>ids.forEach(id=>out[id]=c));return out}

  const [manualReady,setManualReady]=useState(false);
  const [error,setError]=useState('');

  const stop=useCallback(()=>{
    if(loopRef.current){clearTimeout(loopRef.current);loopRef.current=null}
    if(fallbackRef.current){clearTimeout(fallbackRef.current);fallbackRef.current=null}
    try{streamRef.current?.getTracks?.().forEach(t=>t.stop())}catch{}
    streamRef.current=null;meshRef.current=null;
    if(videoRef.current)videoRef.current.srcObject=null;
  },[]);

  const captureAndContinue=useCallback(()=>{
    if(doneRef.current||!videoRef.current||videoRef.current.readyState<2)return;
    doneRef.current=true;
    try{
      const v=videoRef.current,sw=v.videoWidth||640,sh=v.videoHeight||480,maxW=420,scale=Math.min(1,maxW/sw);
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      const photo=c.toDataURL('image/jpeg',.60);
      setStatus('تم التقاط الصورة بنجاح');
      setTimeout(()=>{stop();onSuccessRef.current?.(photo)},180);
    }catch(e){doneRef.current=false;setError('تعذر التقاط الصورة. حاول مرة أخرى.')}
  },[stop]);

  useEffect(()=>{
    let cancelled=false,processing=false;
    const onResults=(results)=>{
      if(cancelled||doneRef.current)return;
      const faces=results?.multiFaceLandmarks||[];
      if(faces.length>=1){
        framesRef.current+=1;setFaceDetected(true);setStatus('ممتاز، تم العثور على الوجه');
        if(framesRef.current>=2)captureAndContinue();
      }else{
        framesRef.current=0;setFaceDetected(false);setStatus('خلّ وجهك ظاهر أمام الكاميرا');
      }
    };
    const loop=()=>{
      if(cancelled||doneRef.current)return;
      loopRef.current=setTimeout(async()=>{
        if(!cancelled&&!doneRef.current&&!processing&&meshRef.current&&videoRef.current?.readyState>=2){
          processing=true;try{await meshRef.current.send({image:videoRef.current})}catch(e){setManualReady(true)}processing=false;
        }
        loop();
      },180);
    };
    async function start(){
      try{
        if(!navigator.mediaDevices?.getUserMedia)throw new Error('CAMERA_UNSUPPORTED');
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
        if(cancelled){stream.getTracks().forEach(t=>t.stop());return}
        streamRef.current=stream;videoRef.current.srcObject=stream;await videoRef.current.play();
        setCameraReady(true);setStatus('خلّ وجهك ظاهر أمام الكاميرا');
        fallbackRef.current=setTimeout(()=>{if(!cancelled&&!doneRef.current)setManualReady(true)},1400);
        if(window.FaceMesh){
          try{
            const mesh=new FaceMesh({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`});
            mesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.35,minTrackingConfidence:.35});
            mesh.onResults(onResults);meshRef.current=mesh;loop();
          }catch(e){setManualReady(true);setStatus('الكاميرا جاهزة — اضغط التقاط والمتابعة')}
        }else{setManualReady(true);setStatus('الكاميرا جاهزة — اضغط التقاط والمتابعة')}
      }catch(err){
        console.error(err);stop();
        if(err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError')setError('اسمح باستخدام الكاميرا لإكمال التسجيل.');
        else if(err?.name==='NotFoundError')setError('لم يتم العثور على كاميرا أمامية.');
        else setError('تعذر تشغيل الكاميرا على هذا الجهاز.');
      }
    }
    start();return()=>{cancelled=true;stop()}
  },[captureAndContinue,stop]);

  return <div className="min-h-[100dvh] ui-auth-bg safe-top safe-bottom px-4 py-5">
    <div className="max-w-[520px] mx-auto">
      <div className="flex items-center justify-between mb-4">
        <button onClick={()=>{stop();onBack()}} className="ui-back"><Icon name="back" className="w-4 h-4"/>رجوع</button>
        <div className="text-left"><div className="text-[10px] text-muted">خطوة أخيرة</div><b className="text-sm">تأكيد الحضور</b></div>
      </div>
      <section className="ui-panel fade-in overflow-hidden">
        <div className="ui-panel-head !pb-4">
          <div className="w-12 h-12 mx-auto rounded-16 bg-successSoft text-success flex items-center justify-center mb-3"><Icon name="camera" className="w-6 h-6"/></div>
          <div className="ui-eyebrow !text-success">لقطة سريعة للحماية</div>
          <h1 className="ui-title !text-[20px]">خلّ وجهك ظاهر أمام الكاميرا للحظة</h1>
          <p className="ui-subtitle">غالبًا يتم الالتقاط تلقائيًا فورًا. وإذا جهازك ما تعرّف على الوجه، يظهر لك زر متابعة بدون تعقيد.</p>
        </div>
        <div className="p-4 sm:p-5">
          <div className="relative aspect-[4/3] rounded-20 overflow-hidden bg-[#F5F5F4] border border-border shadow-card">
            <video ref={videoRef} muted playsInline className="face-video absolute inset-0 w-full h-full object-cover"/>
            <div className={`absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[58%] h-[82%] rounded-[44%] border-[3px] transition-colors pointer-events-none ${faceDetected?'border-success':'border-white'}`} style={{boxShadow:'0 0 0 999px rgba(28,25,23,.08)'}}></div>
            <div className="absolute left-3 right-3 bottom-3 flex justify-center"><div className={`px-4 py-2 rounded-full text-[11px] font-bold shadow-card ${error?'bg-danger text-white':'bg-white/95 text-primary'}`}>{error||status}</div></div>
          </div>
          <div className="grid grid-cols-2 gap-2 mt-3">
            <div className={`rounded-10 border p-2 text-center text-[10px] font-bold ${cameraReady?'bg-successSoft text-success border-success/20':'bg-surface text-muted border-border'}`}>{cameraReady?'✓ ':''}الكاميرا جاهزة</div>
            <div className={`rounded-10 border p-2 text-center text-[10px] font-bold ${faceDetected?'bg-successSoft text-success border-success/20':'bg-surface text-muted border-border'}`}>{faceDetected?'✓ ':''}الوجه ظاهر</div>
          </div>
          {manualReady&&!error&&<button type="button" onClick={captureAndContinue} className="ui-btn ui-btn-primary mt-3">التقاط والمتابعة <Icon name="camera" className="w-5 h-5"/></button>}
          <div className="mt-3 rounded-12 bg-surface border border-border p-3 text-[10px] leading-5 text-secondary">تُحفظ لقطة التحقق في السجل الأمني للإدارة فقط. لا نطلب رمشة أو حركة رأس أو أي اختبار إضافي.</div>
        </div>
      </section>
      <CustomerCredits/>
    </div>
  </div>
}

function ExistingLogin({onBack}){
  const [phone,setPhone]=useState(''),[pin,setPin]=useState(''),[busy,setBusy]=useState(false),[error,setError]=useState('');
  const submit=async e=>{
    e.preventDefault();setError('');
    const p=normalizePhone(phone), password=toEnglishDigits(pin);
    if(!validPhone(p))return setError('تحقق من رقم الجوال.');
    if(!validPin(password))return setError('رمز الدخول يجب أن يكون 6 أرقام.');

    const rateKey='cust_login_rate_'+p;let state={n:0,t:0};
    try{state=JSON.parse(localStorage.getItem(rateKey)||'{}')}catch{}
    const now=Date.now();
    if(state.t&&now-state.t<15*60*1000&&state.n>=6)return setError('تم إيقاف المحاولات مؤقتًا. حاول بعد 15 دقيقة.');

    setBusy(true);
    try{
      sessionStorage.setItem('batco_customer_auth_reason','manual_login');
      try{
        await auth.signInWithEmailAndPassword(authEmailFromPhone(p),password);
      }catch(primaryErr){
        const fallbackCodes=new Set(['auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials','auth/invalid-email']);
        if(!fallbackCodes.has(primaryErr?.code)) throw primaryErr;
        await auth.signInWithEmailAndPassword(legacyAuthEmailFromPhone(p),password);
      }
      localStorage.removeItem(rateKey);
    }catch(err){
      console.error('[Customer login]',err?.code,err?.message,err);
      const n=(state.t&&now-state.t<15*60*1000?state.n:0)+1;
      localStorage.setItem(rateKey,JSON.stringify({n,t:now}));
      if(err.code==='auth/operation-not-allowed'||err.code==='auth/configuration-not-found') setError('خدمة تسجيل الدخول غير مفعّلة حاليًا.');
      else if(err.code==='auth/network-request-failed') setError('تعذر الاتصال بخدمة تسجيل الدخول. تحقق من الشبكة وحاول مرة أخرى.');
      else if(err.code==='auth/too-many-requests') setError('تم إيقاف المحاولات مؤقتًا للحماية. حاول بعد قليل.');
      else setError('رقم الجوال أو رمز الدخول غير صحيح.');
    }finally{setBusy(false)}
  };

  return <div className="min-h-[100dvh] ui-auth-bg flex items-center justify-center px-4 py-8 safe-top safe-bottom">
    <div className="w-full max-w-[500px]">
      <button type="button" onClick={onBack} className="ui-back mb-4"><Icon name="back" className="w-4 h-4"/>رجوع</button>
      <form onSubmit={submit} className="ui-panel fade-in">
        <div className="ui-panel-head">
          <div className="ui-brand-mark"><Icon name="lock" className="w-7 h-7"/></div>
          <div className="ui-eyebrow">تسجيل الدخول</div>
          <h2 className="ui-title">أهلًا بعودتك</h2>
          <p className="ui-subtitle">أدخل رقم الجوال ورمز الدخول.</p>
        </div>
        <div className="ui-panel-body">
          <FormField label="رقم الجوال" icon="phone">
            <input value={phone} onChange={e=>setPhone(toEnglishDigits(e.target.value).replace(/[^0-9+]/g,''))} inputMode="tel" autoComplete="username" dir="ltr" className="ui-input text-left" placeholder="05xxxxxxxx"/>
          </FormField>
          <FormField label="رمز الدخول" icon="lock">
            <input value={pin} onChange={e=>setPin(toEnglishDigits(e.target.value).replace(/\D/g,'').slice(0,6))} inputMode="numeric" type="password" autoComplete="current-password" className="ui-input ui-pin" placeholder="••••••"/>
          </FormField>
          {error&&<div className="ui-error"><Icon name="alert" className="w-5 h-5 shrink-0 mt-[1px]"/>{error}</div>}
          <button disabled={busy} className="ui-btn ui-btn-primary">{busy?<Spinner/>:<><Icon name="shop" className="w-5 h-5"/>دخول إلى المعرض</>}</button>
          <p className="text-[11px] leading-6 text-muted text-center">إذا نسيت رمز الدخول، تواصل مع الإدارة لإعادة تعيينه.</p>
          <CustomerCredits compact/>
        </div>
      </form>
    </div>
  </div>
}

function BranchAllocationModal({item,branches,current,onClose,onSave,onLimit}){
  const [q,setQ]=useState(()=>Object.fromEntries(branches.map(b=>[b.id,roundHalf(current?.[b.id]||0)])));
  const total=sum(Object.values(q)); const max=item.allowedMax;
  const adjust=(id,delta)=>{setQ(prev=>{const next={...prev};const cur=roundHalf(next[id]||0);if(delta>0&&sum(Object.values(prev))+CART_STEP>max+1e-9){onLimit(max);return prev}next[id]=Math.max(0,roundHalf(cur+delta));return next})};
  return <div className="fixed inset-0 z-50 bg-black/45 flex items-end sm:items-center justify-center" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><div className="w-full sm:max-w-[560px] max-h-[88dvh] bg-white rounded-t-20 sm:rounded-20 shadow-lift overflow-hidden fade-in">

function useInstallApp(){
  const [deferred,setDeferred]=useState(()=>window.__customerInstallPrompt||null);
  const [installed,setInstalled]=useState(()=>Boolean(window.matchMedia?.('(display-mode: standalone)')?.matches||navigator.standalone));
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  useEffect(()=>{
    const onReady=()=>setDeferred(window.__customerInstallPrompt||null);
    const onInstalled=()=>{setInstalled(true);setDeferred(null);try{localStorage.setItem('customer_install_dismissed_until','0')}catch{}};
    window.addEventListener('customerinstallready',onReady);window.addEventListener('appinstalled',onInstalled);
    onReady();
    return()=>{window.removeEventListener('customerinstallready',onReady);window.removeEventListener('appinstalled',onInstalled)};
  },[]);
  const prompt=async()=>{const p=deferred||window.__customerInstallPrompt;if(!p)return false;p.prompt();const choice=await p.userChoice.catch(()=>null);if(choice?.outcome==='accepted')setInstalled(true);window.__customerInstallPrompt=null;setDeferred(null);return choice?.outcome==='accepted'};
  return {deferred,installed,isIOS,prompt};
}
function InstallNudge(){
  const install=useInstallApp();
  const [show,setShow]=useState(false),[iosHelp,setIosHelp]=useState(false);
  useEffect(()=>{if(install.installed)return;let until=0;try{until=Number(localStorage.getItem('customer_install_dismissed_until')||0)}catch{};if(until>Date.now())return;const t=setTimeout(()=>{if(install.deferred||install.isIOS)setShow(true)},4500);return()=>clearTimeout(t)},[install.deferred,install.isIOS,install.installed]);

        db.collection(CUSTOMER_LOGIN_COLLECTION).add({customerUid:created.uid,name:createdProfile.name||'',company:registration.company,phone:registration.phone,type:'account_created',sessionId:customerSessionId,device:customerDeviceInfo(),createdAt:firebase.firestore.FieldValue.serverTimestamp()})
      ]);
      setRegistration(null);setAuthState('ready');setAuthPrompt(false);setScreen('choice');
    }catch(err){
      console.error('[Customer registration]',{stage,code:err?.code,message:err?.message,error:err});
      if(created&&stage==='profile'){
        try{await created.delete();created=null}
        catch(cleanErr){cleanupFailed=true;console.error('[Customer registration cleanup]',cleanErr);try{await auth.signOut()}catch{}}
      }
      setGlobalError(registrationErrorMessage(err,stage,cleanupFailed));
      setScreen('choice');setRegistration(null);setAuthState('guest');
    }finally{
      creatingAccountRef.current=false;setRegistering(false);
    }
  };
  if(authState==='loading'||registering)return <div className="min-h-[100dvh] ui-auth-bg flex flex-col items-center justify-center gap-4 px-4"><div className="ui-brand-mark !mb-0"><Icon name="shop" className="w-7 h-7"/></div><Spinner/><div className="text-sm font-semibold text-secondary">{registering?'جاري إنشاء حسابك...':'جاري تجهيز البوابة...'}</div></div>;
  if(authState==='ready'&&profile)return <CustomerApp user={auth.currentUser} profile={profile} onProfileUpdate={setProfile}/>;
  if(authPrompt){
    if(screen==='register'&&registrationEnabled)return <RegistrationForm onBack={()=>setScreen('choice')} onReady={data=>{setRegistration(data);setScreen('liveness')}}/>;
    if(screen==='liveness'&&registration)return <LivenessCheck registration={registration} onBack={()=>setScreen('register')} onSuccess={finishRegistration}/>;
    if(screen==='login'&&loginEnabled)return <ExistingLogin onBack={()=>setScreen('choice')}/>;
    return <><AccessChoice registrationEnabled={registrationEnabled} loginEnabled={loginEnabled} onBrowse={()=>{setAuthPrompt(false);setScreen('choice');setGlobalError('')}} onNew={()=>{if(!registrationEnabled)return;setGlobalError('');setScreen('register')}} onExisting={()=>{if(!loginEnabled)return;setGlobalError('');setScreen('login')}}/>{globalError&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-32px)] max-w-[560px] bg-danger text-white rounded-12 p-3 shadow-lift text-sm font-bold">{globalError}</div>}</>;
  }
  return <><CustomerApp user={null} profile={null} guestMode={true} onProfileUpdate={()=>{}} onRequireAuth={()=>{setGlobalError('');setScreen('choice');setAuthPrompt(true)}}/>{globalError&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-32px)] max-w-[560px] bg-danger text-white rounded-12 p-3 shadow-lift text-sm font-bold">{globalError}</div>}</>;
}

function CustomerPortalBootstrap(){
  const [control,setControl]=useState({...DEFAULT_CUSTOMER_PORTAL_CONTROL,__loading:true});
  const previewAllowed=useMemo(()=>{
    try{return localStorage.getItem(CUSTOMER_PORTAL_PREVIEW_KEY)==='admin-preview'}catch{return false}
  },[]);

  useEffect(()=>{
    const ref=db.collection(CUSTOMER_PORTAL_CONTROL_COLLECTION).doc(CUSTOMER_PORTAL_CONTROL_DOC);
    const unsubscribe=ref.onSnapshot(doc=>{
      setControl({...DEFAULT_CUSTOMER_PORTAL_CONTROL,...(doc.exists?doc.data():{}),__loading:false});
    },err=>{
      console.warn('[Portal control]',err);
      setControl({...DEFAULT_CUSTOMER_PORTAL_CONTROL,__loading:false});
    });
    return()=>unsubscribe();
  },[]);

  if(control.__loading){
    return <div className="min-h-[100dvh] ui-auth-bg flex flex-col items-center justify-center gap-4 px-4"><div className="ui-brand-mark !mb-0"><Icon name="shop" className="w-7 h-7"/></div><Spinner/><div className="text-sm font-semibold text-secondary">جاري التحقق من حالة البوابة...</div></div>;
  }

  if(!control.enabled&&!previewAllowed){
    return <div className="min-h-[100dvh] ui-auth-bg flex items-center justify-center p-5 font-sans safe-top safe-bottom">
      <div className="w-full max-w-[440px] ui-panel fade-in">
        <div className="ui-panel-head">
          <div className="ui-brand-mark"><Icon name="shop" className="w-7 h-7"/></div>
          <div className="ui-eyebrow">بوابة العملاء</div>
          <h1 className="ui-title">الخدمة متوقفة مؤقتًا</h1>
          <p className="ui-subtitle">{control.maintenanceMessage||DEFAULT_CUSTOMER_PORTAL_CONTROL.maintenanceMessage}</p>
        </div>
        <div className="ui-panel-body"><a href="./index.html?employee=1" className="ui-btn ui-btn-secondary"><Icon name="back" className="w-4 h-4"/>دخول الموظفين</a></div>
      </div>
    </div>;
  }
 

  const effectiveRegistration=previewAllowed?true:control.registrationEnabled!==false;
  const effectiveLogin=previewAllowed?true:control.loginEnabled!==false;
  return <>
    {previewAllowed&&!control.enabled&&<div className="fixed top-2 left-1/2 -translate-x-1/2 z-[200] px-3 py-2 rounded-full bg-info text-white shadow-lift text-[11px] font-bold whitespace-nowrap">معاينة الإدارة — البوابة متوقفة للعامة</div>}
    <Root registrationEnabled={effectiveRegistration} loginEnabled={effectiveLogin}/>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<CustomerPortalBootstrap/>);
setTimeout(()=>document.getElementById('app-loader')?.classList.add('is-hidden'),320);
</script>
</body>
